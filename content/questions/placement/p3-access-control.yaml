id: p3-access-control
level: P3
topic_tags: [system-design]
stem: "In a company RAG assistant, employees must only see documents they are allowed to read. Where should access control be enforced?"
options:
  - id: a
    text: "In the system prompt, by asking the model not to reveal restricted documents"
  - id: b
    text: "After the answer, by deleting sensitive words"
  - id: c
    text: "At retrieval time, by filtering chunks to the user's permissions before they reach the model"
  - id: d
    text: "Nowhere, because employees are trusted"
correct: c
explanation: "If a restricted chunk reaches the prompt, the model can leak it. Filter by permission before the model sees any text."
