id: p3-changing-handbook
level: P3
topic_tags: [approach-selection]
stem: "Your assistant must answer from a company handbook that changes every week. Which approach fits best?"
options:
  - id: a
    text: "RAG over the handbook, with the index refreshed when documents change"
  - id: b
    text: "Fine-tune the model on the handbook every week"
  - id: c
    text: "Train a new model from scratch"
  - id: d
    text: "Put an old copy of the handbook in the prompt and never update it"
correct: a
explanation: "Facts that change often belong in retrieved documents, not in model weights. Re-indexing is cheap compared with retraining."
