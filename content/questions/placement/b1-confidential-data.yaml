id: b1-confidential-data
level: B1
topic_tags: [ai-safety]
stem: "Your company has not approved any AI tool for confidential data. You want help summarising a client contract. What is the best choice?"
options:
  - id: a
    text: "Check the company's rules and use an approved tool, or remove all confidential details first"
  - id: b
    text: "Paste the whole contract into a free chat assistant"
  - id: c
    text: "Paste only the first half of the contract"
  - id: d
    text: "Paste it, then ask the assistant to promise to forget it"
correct: a
explanation: "Text you paste may be stored or used by the provider. Follow your company's policy, and do not rely on the assistant's promise to forget."
