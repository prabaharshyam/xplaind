id: p2-api-key
level: P2
topic_tags: [security-privacy]
stem: "Where should an LLM API key live in a web app?"
options:
  - id: a
    text: "In the JavaScript that is sent to the browser"
  - id: b
    text: "In a public GitHub repository"
  - id: c
    text: "On the server, in an environment variable or secret manager, never in browser code or the repository"
  - id: d
    text: "In an HTML comment on the page"
correct: c
explanation: "Anything sent to the browser can be read by users. Keep keys on the server and out of version control."
