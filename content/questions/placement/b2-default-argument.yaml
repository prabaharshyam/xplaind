id: b2-default-argument
level: B2
topic_tags: [python-functions]
stem: |-
  What does this program print?

  def greet(name, greeting="Hello"):
      return f"{greeting}, {name}"

  print(greet("Ravi"))
options:
  - id: a
    text: "TypeError, because greeting is missing"
  - id: b
    text: "Hello, Ravi"
  - id: c
    text: "Hello, name"
  - id: d
    text: "greeting, Ravi"
correct: b
explanation: "greeting has a default value, so the caller may leave it out. The f-string fills in both values."
