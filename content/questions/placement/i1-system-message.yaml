id: i1-system-message
level: I1
topic_tags: [llm-api]
stem: "In a chat-style LLM API, what is the system message mainly used for?"
options:
  - id: a
    text: "To store the user's password"
  - id: b
    text: "To list the model's training data"
  - id: c
    text: "To set the model's role, rules and style for the whole conversation"
  - id: d
    text: "To count how many tokens were used"
correct: c
explanation: "The system message gives standing instructions, such as the role, the tone and the rules to follow. User messages carry each request."
