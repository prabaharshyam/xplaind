id: b1-knowledge-cutoff
level: B1
topic_tags: [llm-basics]
stem: "Why might a chat assistant get a recent news event wrong?"
options:
  - id: a
    text: "It is programmed to hide recent news"
  - id: b
    text: "Its knowledge comes from training data up to a cutoff date, so it may not know later events unless it can search"
  - id: c
    text: "It forgets everything every night"
  - id: d
    text: "Recent events cannot be put into any AI model"
correct: b
explanation: "A model only knows what was in its training data. Tools such as web search can add newer information, but the model itself does not update every day."
