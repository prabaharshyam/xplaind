id: b1-made-up-citation
level: B1
topic_tags: [hallucination]
stem: "A chat assistant gives a research paper with a title, authors and a year. You cannot find the paper anywhere. What most likely happened?"
options:
  - id: a
    text: "The paper is real but hidden from search engines"
  - id: b
    text: "Your internet connection is blocking the paper"
  - id: c
    text: "The assistant produced a believable but invented reference"
  - id: d
    text: "The paper is too new for any website to list"
correct: c
explanation: "Language models predict plausible text. That can include references that look real but do not exist, so every citation needs checking."
drafted_with_ai: true
