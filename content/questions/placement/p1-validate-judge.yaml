id: p1-validate-judge
level: P1
topic_tags: [llm-judges]
stem: "Before you trust an LLM judge's scores, what should you do?"
options:
  - id: a
    text: "Ask the judge whether it is accurate"
  - id: b
    text: "Use the same model to write and judge the answers, for consistency"
  - id: c
    text: "Compare its scores with human labels on a sample and check that they agree"
  - id: d
    text: "Raise the temperature"
correct: c
explanation: "A judge is a measuring tool, so it needs calibration against a trusted standard. Human-labelled examples provide that."
