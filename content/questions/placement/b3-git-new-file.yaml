id: b3-git-new-file
level: B3
topic_tags: [terminal-git]
stem: "You created a new file and want it saved in Git history. Which steps work?"
options:
  - id: a
    text: "git commit alone, because new files are included automatically"
  - id: b
    text: "git add the file, then git commit -m \"message\""
  - id: c
    text: "git push, then git add"
  - id: d
    text: "git clone, then git commit"
correct: b
explanation: "A new file is untracked. git add stages it, and git commit records the snapshot. git push only sends commits to a remote."
