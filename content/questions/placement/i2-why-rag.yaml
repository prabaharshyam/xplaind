id: i2-why-rag
level: I2
topic_tags: [rag-pipeline]
stem: "What problem does retrieval-augmented generation (RAG) mainly solve?"
options:
  - id: a
    text: "It lets a model answer from your own, up-to-date documents without retraining the model"
  - id: b
    text: "It permanently changes the model's weights with your facts"
  - id: c
    text: "It lets the model run on a phone"
  - id: d
    text: "It removes the need to write prompts"
correct: a
explanation: "RAG fetches relevant text at question time and puts it in the prompt. Changing the model's weights is fine-tuning, which is a different tool."
