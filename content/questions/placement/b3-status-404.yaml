id: b3-status-404
level: B3
topic_tags: [web-apis]
stem: "An API call returns status code 404. What does that usually mean?"
options:
  - id: a
    text: "The request worked and returned data"
  - id: b
    text: "The server crashed"
  - id: c
    text: "The address or item you asked for was not found"
  - id: d
    text: "You have made too many requests"
correct: c
explanation: "404 means not found. 200 is success, 500 is a server error and 429 is too many requests."
