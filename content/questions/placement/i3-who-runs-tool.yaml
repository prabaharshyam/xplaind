id: i3-who-runs-tool
level: I3
topic_tags: [tool-calling]
stem: "In tool calling (function calling), who actually runs the tool?"
options:
  - id: a
    text: "The model runs it inside its own network"
  - id: b
    text: "The API provider runs any function you name"
  - id: c
    text: "Your application code runs it and sends the result back to the model"
  - id: d
    text: "The user runs it by hand"
correct: c
explanation: "The model only asks for a tool call by name with arguments. Your code runs it and returns the result so the model can continue."
