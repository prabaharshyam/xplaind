stem: "Which description best fits an agent loop?"
options:
  - id: a
    text: "One prompt goes in, one answer comes out, and nothing repeats"
  - id: b
    text: "A loop that retrains the model after each call"
  - id: c
    text: "A fixed list of steps the model cannot change"
  - id: d
    text: "The model picks an action, your code runs it, the result goes back to the model, and this repeats until the task is done or a limit is reached"
correct: d
explanation: "An agent works in repeated steps of decide, act and observe. The loop needs a stop condition and a limit."
