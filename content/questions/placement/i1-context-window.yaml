id: i1-context-window
level: I1
topic_tags: [tokens-context]
stem: "A model has an 8,000-token context window and your prompt is 7,500 tokens. What is the main problem?"
options:
  - id: a
    text: "Input and output share the window, so only about 500 tokens remain for the answer"
  - id: b
    text: "Nothing, because the answer has its own separate window"
  - id: c
    text: "The model will refuse every prompt over 5,000 tokens"
  - id: d
    text: "The prompt is quietly summarised and nothing is lost"
correct: a
explanation: "The context window covers both what you send and what the model writes. A prompt that nearly fills it leaves little room for a reply."
