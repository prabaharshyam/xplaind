stem: "You must launch a customer-support assistant in a month. Which plan is strongest?"
options:
  - id: a
    text: "Build a test set from real tickets, set pass criteria, release to a small group, monitor results, then widen the rollout"
  - id: b
    text: "Launch to everyone and fix problems as complaints arrive"
  - id: c
    text: "Test only on the cases the team likes"
  - id: d
    text: "Skip evaluation because the model is strong"
correct: a
explanation: "A staged rollout with measurable criteria finds problems while they are small and gives you evidence for each decision."
