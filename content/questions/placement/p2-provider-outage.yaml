id: p2-provider-outage
level: P2
topic_tags: [deployment-monitoring]
stem: "The model provider has a short outage. Which design keeps your app usable?"
options:
  - id: a
    text: "Retry forever with no timeout"
  - id: b
    text: "Show a blank screen"
  - id: c
    text: "Cache every answer permanently"
  - id: d
    text: "Timeouts, retries with backoff, and a fallback model or a clear message that the service is degraded"
correct: d
explanation: "Failures happen. Timeouts stop requests hanging, and a fallback or a clear message keeps users informed."
