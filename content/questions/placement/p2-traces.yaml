topic_tags: [deployment-monitoring]
stem: "A user reports a wrong answer from your RAG app last Tuesday. What best helps you find the cause?"
options:
  - id: a
    text: "Nothing, because LLM outputs cannot be examined"
  - id: b
    text: "A stored trace of that request: the prompt, the retrieved chunks, the model version and the output"
  - id: c
    text: "Only the user's complaint"
  - id: d
    text: "The average latency chart"
correct: b
explanation: "Traces let you replay what the app saw and did, so you can tell whether retrieval, the prompt or the model was at fault."
