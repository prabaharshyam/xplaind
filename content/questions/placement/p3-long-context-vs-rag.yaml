id: p3-long-context-vs-rag
level: P3
topic_tags: [tradeoffs]
stem: "In an interview you are asked, \"Why not just use a bigger context window instead of RAG?\" Which answer shows the best judgement?"
options:
  - id: a
    text: "Long context makes RAG obsolete in every case"
  - id: b
    text: "Long context costs more and adds latency, quality can fall when text is irrelevant, and a corpus can exceed the window, so RAG fetches only what is needed while long context suits small, stable inputs"
  - id: c
    text: "RAG is always cheaper, so nothing else matters"
  - id: d
    text: "They are the same thing, so there is no difference"
correct: b
explanation: "A strong answer weighs cost, latency, quality and size, and says when each approach fits."
