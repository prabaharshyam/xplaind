topic_tags: [caching-latency]
stem: "Users wait several seconds for long answers. Which change most improves how fast the app feels?"
options:
  - id: a
    text: "Increase the maximum output tokens"
  - id: b
    text: "Wait until the full answer has been checked before showing any of it"
  - id: c
    text: "Use a higher temperature"
  - id: d
    text: "Stream the answer so text appears as it is generated"
correct: d
explanation: "Streaming shows the first words quickly, which lowers the wait people notice even if the total time is the same."
