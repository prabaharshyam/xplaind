id: i3-tool-error
level: I3
topic_tags: [agent-failures]
stem: "A tool call returns an error. What should the agent loop do?"
options:
  - id: a
    text: "Hide the error and pretend the call worked"
  - id: b
    text: "Stop the whole program without saying why"
  - id: c
    text: "Send the error message back to the model so it can fix the input or try another step, within a retry limit"
  - id: d
    text: "Retry the identical call forever"
correct: c
explanation: "The error text is useful information. Give it to the model, and keep a limit so failures cannot loop forever."
