id: b2-with-open
level: B2
topic_tags: [python-files-errors]
stem: |-
  Why is this the preferred way to read a file?

  with open("notes.txt") as f:
      text = f.read()
options:
  - id: a
    text: "It makes reading much faster"
  - id: b
    text: "It lets other programs read the file at the same time"
  - id: c
    text: "The with block closes the file automatically, even if an error happens"
  - id: d
    text: "It turns the text into numbers"
correct: c
explanation: "with makes sure the file is closed when the block ends, including when an error occurs. That avoids leaked file handles."
