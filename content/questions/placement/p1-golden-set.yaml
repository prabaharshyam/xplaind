id: p1-golden-set
level: P1
topic_tags: [evals]
stem: "What is the main purpose of a golden test set for an LLM app?"
options:
  - id: a
    text: "A fixed set of inputs with known good outputs or criteria, used to compare versions of the app over time"
  - id: b
    text: "Data used to train the model"
  - id: c
    text: "Popular questions shown on the home page"
  - id: d
    text: "A list of prompts that always succeed"
correct: a
explanation: "A golden set lets you run the same checks after every change, so you can tell whether the app got better or worse."
