stem: "The answer is in your documents, but the model says it does not know. The retrieved chunks do not contain the answer. What should you look at first?"
options:
  - id: a
    text: "The retrieval step: chunking, the embedding model and how many chunks you fetch"
  - id: b
    text: "Raise the temperature"
  - id: c
    text: "Make the system prompt longer"
  - id: d
    text: "Switch to a larger model before anything else"
correct: a
explanation: "If the right text never reaches the prompt, no model can use it. Fix retrieval first, then look at generation."
