id: i1-rate-limit
level: I1
topic_tags: [llm-cost-errors]
stem: "Your API call fails with a 429 rate-limit error. What is the best way to handle it?"
options:
  - id: a
    text: "Retry immediately in a tight loop until it works"
  - id: b
    text: "Delete the API key and create a new one"
  - id: c
    text: "Make the prompt longer"
  - id: d
    text: "Wait and retry with exponential backoff, and cap the number of retries"
correct: d
explanation: "Backing off gives the limit time to reset. A tight retry loop makes the problem worse, and a cap stops endless retries."
