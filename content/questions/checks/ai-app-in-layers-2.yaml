id: ai-app-in-layers-2
stop_id: ai-app-in-layers
stem: "What is the main difference between a router and a gateway?"
options:
  - { id: a, text: "There is none" }
  - { id: b, text: "A router decides where each request goes; a gateway is one managed path for all model calls" }
  - { id: c, text: "A gateway classifies intent; a router stores keys" }
  - { id: d, text: "A router is only for images" }
correct: b
explanation: "A router picks the destination (model, tool, stock reply, person). A gateway centralises keys, access, limits, logging and fallbacks for model calls."
