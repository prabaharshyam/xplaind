id: long-context-vs-rag-3
stop_id: long-context-vs-rag
stem: "A Hyderabad team plants the sentence \"The project code is ZX-41\" at five depths in a 300,000-token annual report, three runs each. The model finds it every time. The team concludes long context is safe for analysts, whose questions compare figures across sections. What is the main flaw in that conclusion?"
options:
  - { id: a, text: "Five depths are too few; the team needs at least fifty depths before trusting the result." }
  - { id: b, text: "The sentence should go only in the middle, since that is the one place models always fail." }
  - { id: c, text: "Three runs per depth cannot show a pattern; the team should repeat each depth many times." }
  - { id: d, text: "One exact lookup is the easy case; test multi-fact questions with look-alike distractors." }
correct: d
explanation: "Current models usually find a single planted sentence; accuracy drops on questions that need several facts, inference or ignoring look-alike text. More depths or more runs only measure the easy case more precisely, not the analysts' real task."
