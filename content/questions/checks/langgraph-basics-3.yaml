id: langgraph-basics-3
stop_id: langgraph-basics
stem: "A Jaipur shopping site runs its LangGraph support bot on two servers behind a load balancer, compiled with InMemorySaver and one thread_id per chat. About half the time, customers say the bot has forgotten what they told it a minute earlier. What is the most likely cause?"
options:
  - { id: a, text: "The thread_id stays the same for the whole chat, so an old saved state is loaded each time" }
  - { id: b, text: "The messages field has no add_messages reducer, so each new reply erases the history" }
  - { id: c, text: "No node calls interrupt() after replying, so the conversation state is never saved" }
  - { id: d, text: "Each server keeps its own checkpoints in memory; a shared Postgres saver fixes it" }
correct: d
explanation: "InMemorySaver lives inside one process, so a message that lands on the other server finds no history, which matches the half-the-time pattern. A missing reducer would lose the history on every message, not half of them, and checkpoints are saved after every step without any interrupt."
