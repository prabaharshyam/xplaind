stem: "What is the difference between context compaction and a context reset?"
options:
  - { id: a, text: "They are the same thing with different names" }
  - { id: b, text: "Compaction summarises history in place and the session continues; a reset starts a fresh agent from a written handoff" }
  - { id: c, text: "A reset deletes the progress file; compaction keeps it" }
  - { id: d, text: "Compaction is only for chat apps; resets are only for coding" }
correct: b
explanation: "Compaction keeps continuity but gives no clean slate. A reset gives a clean slate and relies on files and git to carry state."
