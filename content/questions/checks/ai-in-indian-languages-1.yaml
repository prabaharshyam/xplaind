id: ai-in-indian-languages-1
stop_id: ai-in-indian-languages
stem: "The same reply costs about three times more in Tamil than in English on your API. What is the most likely cause?"
options:
  - { id: a, text: "Tamil answers are always longer" }
  - { id: b, text: "The tokenizer splits Tamil into many more tokens for the same meaning" }
  - { id: c, text: "The API charges extra for Indian languages" }
  - { id: d, text: "Tamil needs a bigger model" }
correct: b
explanation: "APIs charge per token. Tokenizers designed mainly for English often need several times more tokens for Indian scripts."
