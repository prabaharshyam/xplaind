stem: "A service keeps restarting and the log shows \"No space left on device\". What do you check first?"
options:
  - { id: a, text: "CPU usage with top" }
  - { id: b, text: "Disk usage with df -h, then du to find the large folder" }
  - { id: c, text: "The Python version" }
  - { id: d, text: "Network speed" }
correct: b
explanation: "The error says the disk is full. df shows which filesystem; du narrows it to the folder."
