id: experiment-tracking-2
stop_id: experiment-tracking
stem: "A Bengaluru food-delivery company retrains its refund-fraud model monthly. The new run logged validation PR AUC 0.48 on November's split. The current champion logged 0.44 on October's split last month. A teammate wants to promote the new model because 0.48 is higher. What should the team do first?"
options:
  - { id: a, text: "Score both models on the same recent holdout neither trained on" }
  - { id: b, text: "Promote it, because a 0.04 gain is far bigger than any normal noise" }
  - { id: c, text: "Sort both runs by PR AUC in the tracking UI and promote the top one" }
  - { id: d, text: "Compare their training-set PR AUC, since both runs logged it as well" }
correct: a
explanation: "The two logged numbers come from different months of data, so the gap mixes the change in data with the change in model. Only scores on the same fresh holdout compare the models; sorting the runs in the UI repeats the same unfair comparison, and training-set scores reward overfitting."
