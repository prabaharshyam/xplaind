stem: "In a role-play, the 'client' runs a hospital chain in Kochi: 'Your discharge-summary assistant works. I need it in all 14 hospitals by the 1st.' The pilot runs in one hospital and has not been tested on other hospitals' records. Which of these candidate lines would cost the most marks?"
options:
  - { id: a, text: "'We can do all 14 by the 1st; my team will work every weekend to make it happen.'" }
  - { id: b, text: "'Before I answer, can I ask what is driving the 1st? Is something due on that day?'" }
  - { id: c, text: "'The other hospitals use a different records format, so outputs there are untested.'" }
  - { id: d, text: "'Shall we go live in two hospitals first, with a doctor checking each summary?'" }
correct: a
explanation: "Promising all 14 hospitals with weekend work commits on the spot without sizing the work or the risk of untested records, which is exactly what the role-play tests. Asking about the 1st can feel like stalling, but asking what drives the date is how you find the real need and the options."
