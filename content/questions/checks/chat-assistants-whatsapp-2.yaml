stem: "A Jaipur jewellery shop wants to send a Diwali offer on WhatsApp to 5,000 customers from its billing records. A few messaged the shop last week; most have not written in months. Which plan follows the rules?"
options:
  - { id: a, text: "A marketing template, sent only to customers who agreed to receive offers" }
  - { id: b, text: "A utility template to all 5,000, since the offer relates to past purchases" }
  - { id: c, text: "Free-form text to last week's customers and a template to everyone else" }
  - { id: d, text: "A marketing template to all 5,000, since they gave their numbers at billing" }
correct: a
explanation: "A promotion is a marketing template, and it may go only to people who opted in to offers, which DPDP consent also requires. Giving a number at the billing counter is not opt-in, and free-form messages need a window opened in the last 24 hours, not last week."
