id: kpi-that-matters-2
stop_id: kpi-that-matters
stem: "A Jaipur lender wants to start its pilot next week, during the Diwali loan rush, and proposes a two-week baseline taken now from all branches. The pilot will run in its two best-run branches. What is the best response?"
options:
  - { id: a, text: "Use ordinary past weeks, measured for the pilot branches and lender-wide" }
  - { id: b, text: "Accept it, as two weeks of festival volume gives more files and so a sounder baseline" }
  - { id: c, text: "Skip the baseline and compare against a published industry benchmark" }
  - { id: d, text: "Take the baseline after the pilot, from branches that never used the tool" }
correct: a
explanation: "A festival rush is not typical, and a lender-wide figure can flatter well-run pilot branches, so use ordinary weeks and measure both groups. More files do not help when the period itself is unusual."
