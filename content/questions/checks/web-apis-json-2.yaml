id: web-apis-json-2
stop_id: web-apis-json
stem: "Kabir's script in Jaipur sends a POST to a payments API to charge a customer 1,200 rupees. The call raises requests.Timeout after 20 seconds. The API supports an Idempotency-Key header. What should the script do?"
options:
  - { id: a, text: "Retry at once, since a timeout means the server never got it" }
  - { id: b, text: "Retry with a fresh idempotency key on each attempt" }
  - { id: c, text: "Give up and ask the customer to pay again" }
  - { id: d, text: "Retry with backoff, sending the same idempotency key" }
correct: d
explanation: "The first charge may have gone through with only the reply lost, so the retry must carry the same key and the server can spot the repeat. A fresh key on each try, or a retry with no key, makes every attempt look new and can charge the customer twice."
