stem: "A company MCP server queries the database with one all-powerful account for every user. What is the risk?"
options:
  - { id: a, text: "It is slower" }
  - { id: b, text: "Any user can reach data their own permissions would block" }
  - { id: c, text: "MCP does not allow it" }
  - { id: d, text: "Tool descriptions become longer" }
correct: b
explanation: "The server should act with each user's own permissions; a shared super-user breaks access control."
