id: mcp-servers-clients-2
stop_id: mcp-servers-clients
stem: "Priya in Hyderabad follows a 2025 blog post. Her server starts with from mcp.server.fastmcp import FastMCP and runs with transport=\"sse\". After pip install mcp today, the import fails. Her colleagues will reach the server over the company network. What should she do?"
options:
  - { id: a, text: "Switch to MCPServer from mcp.server and run it with the streamable-http transport" }
  - { id: b, text: "Pin mcp<2 and keep the SSE transport, because both will keep working for many years" }
  - { id: c, text: "Keep the code and add an initialize handler so new clients can open a session" }
  - { id: d, text: "Switch to the stdio transport, which is the standard choice for a shared server" }
correct: a
explanation: "In SDK 2.x FastMCP was renamed MCPServer, and Streamable HTTP is the current remote transport. Pinning mcp<2 makes the import work, but HTTP+SSE is deprecated, so new work should not start on it. The 2026-07-28 spec also retired the initialize handshake and sessions, and stdio is for local servers."
drafted_with_ai: true
reviewed_by: "Shyam Prabahar"
reviewed_on: 2026-10-27
