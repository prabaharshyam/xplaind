stem: "A model API key was committed to Git six months ago and removed the next day. What now?"
options:
  - { id: a, text: "Nothing; it was removed" }
  - { id: b, text: "Rotate the key, because it is still in history and may have been copied" }
  - { id: c, text: "Make the repository private" }
  - { id: d, text: "Rename the file" }
correct: b
explanation: "Removal does not erase history. Treat any committed secret as leaked and rotate it."
