id: environments-secrets-terraform-1
stop_id: environments-secrets-terraform
stem: "At a Pune fintech, the nightly terraform plan -detailed-exitcode job on production exits with code 2. Nobody has merged Terraform changes since the last apply. The plan shows the database sku_name changing from GP_Standard_D4s_v3 back to GP_Standard_D2s_v3. What should the on-call engineer do?"
options:
  - { id: a, text: "Treat it as a failed job: exit code 2 means plan errored, so rerun it and check the CI logs" }
  - { id: b, text: "Run terraform apply at once, because whatever the cloud shows must always be put back to match the code" }
  - { id: c, text: "Check the activity log for who resized it and why, then put the new size in code or apply" }
  - { id: d, text: "Delete the state file and import the database again, because state no longer matches the real cloud" }
correct: c
explanation: "Exit code 2 means plan found a difference; with no unapplied code, someone resized the database by hand, perhaps to handle load. Applying blindly could undo a deliberate fix during an incident, so find the reason first, then make code and cloud agree through a reviewed change."
