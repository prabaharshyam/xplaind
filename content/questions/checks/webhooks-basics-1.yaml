id: webhooks-basics-1
stop_id: webhooks-basics
stem: "A clinic in Pune takes booking payments. Its n8n webhook replies 200 immediately, then writes each booking to a sheet. The sheet service failed for 10 minutes, and 14 paid bookings are missing. What is the right fix?"
options:
  - { id: a, text: "None needed: the gateway will resend the 14 events, since the work failed" }
  - { id: b, text: "Add a duplicate check on the booking id so retried events are not lost" }
  - { id: c, text: "Save each event before replying 200, then retry failed work from it" }
  - { id: d, text: "Reply 200 even faster, so the gateway never times out when the sheet is slow" }
correct: c
explanation: "The gateway saw a 200 for each event, so it counts them as delivered and will never resend them; the events were lost when the work failed. Saving durably before the reply lets a sweep finish the work later. A duplicate check stops repeats but cannot recover events that never come back."
