id: networking-for-security-3
stop_id: networking-for-security
stem: "A company's cloud server allows inbound port 3306 (MySQL) from any address. What should be done?"
options:
  - { id: a, text: "Nothing, because the database has a password" }
  - { id: b, text: "Move MySQL to port 3307" }
  - { id: c, text: "Allow 3306 only from the application server, and deny it from everywhere else" }
  - { id: d, text: "Allow it only during working hours" }
correct: c
explanation: "Databases should never face the whole internet. Deny by default and allow only the systems that need access. A changed port or a password alone is not enough."
