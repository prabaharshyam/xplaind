id: model-size-and-scaling-2
stop_id: model-size-and-scaling
stem: "A Hyderabad lab plans to pre-train a 4-billion-parameter model on 600 billion tokens. Using 6 × parameters × tokens, on A100s at an assumed 40% utilisation, roughly how many GPU-hours will the arithmetic take?"
options:
  - { id: a, text: "About 32,100 GPU-hours" }
  - { id: b, text: "About 10,700 GPU-hours" }
  - { id: c, text: "About 12,800 GPU-hours" }
  - { id: d, text: "About 16,000 GPU-hours" }
correct: a
explanation: "6 × 4 billion × 600 billion = 1.44 × 10²² operations; divided by the A100's 312 × 10¹² per second at 16-bit times 0.4, that is about 32,100 hours, a lower bound. About 10,700 uses 2 operations per parameter per token, the cost of answering rather than training; 12,800 forgets utilisation and 16,000 uses the sparsity peak of 624 teraFLOPS."
