stem: "Which sshd_config settings give the safest baseline for an internet-facing server?"
options:
  - { id: a, text: "PasswordAuthentication yes and PermitRootLogin yes" }
  - { id: b, text: "PasswordAuthentication no, PermitRootLogin no, key-based login for named users" }
  - { id: c, text: "Moving SSH to port 2222 with passwords on" }
  - { id: d, text: "PermitRootLogin yes with a long root password" }
correct: b
explanation: "Keys cannot be brute-forced like passwords, and blocking direct root login forces named accounts and sudo. Changing the port only reduces noise."
