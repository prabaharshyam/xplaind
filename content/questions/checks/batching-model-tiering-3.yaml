id: batching-model-tiering-3
stop_id: batching-model-tiering
stem: "A Bengaluru fintech's invoice cascade escalates only 2% of invoices. Its validator checks the JSON schema and that amounts are positive. What should the team check before calling the cascade a success?"
options:
  - { id: a, text: "Nothing more: a 2% escalation rate shows the small model rarely fails" }
  - { id: b, text: "Whether escalation can drop to 1%, so that the savings grow further" }
  - { id: c, text: "The cost per call of each model, compared on last month's bill" }
  - { id: d, text: "How many wrong outputs pass the validator, on a labelled golden set" }
correct: d
explanation: "Schema and range checks catch loud failures but pass well-formed wrong values, so the miss rate on a golden set is the real quality cost. A low escalation rate is the tempting signal, but it only counts what the validator noticed."
