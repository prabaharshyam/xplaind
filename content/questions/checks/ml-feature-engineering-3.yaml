id: ml-feature-engineering-3
stop_id: ml-feature-engineering
stem: "A Chennai food app's model uses orders_today. Training computed it on IST calendar days; the live service counts orders by UTC calendar day. A month after launch, live accuracy is clearly below the offline score. What is the best diagnosis and fix?"
options:
  - { id: a, text: "Customer behaviour has drifted since launch, so retrain the model every single week" }
  - { id: b, text: "Training had a leak from future data, so remove orders_today from the model" }
  - { id: c, text: "Late-night orders land on another day live; compute both with one IST function" }
  - { id: d, text: "The live model has too few inputs, so add more features to recover accuracy" }
correct: c
explanation: "This is training-serving skew: an order at 2:00 am IST on 5 November is 20:30 UTC on 4 November, so the live feature counts it on the wrong day. Retraining is tempting but does not fix it, because serving would still compute the feature differently from training."
