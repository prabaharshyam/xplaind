stem: "Farah has four years as a security operations analyst in Hyderabad. She writes Python scripts to parse logs. Her company is about to launch an LLM chatbot that can look up customer orders. Which move gives her the most leverage?"
options:
  - { id: a, text: "AI security engineer, testing the new chatbot for prompt injection" }
  - { id: b, text: "GenAI engineer from scratch, since its early salary band is higher" }
  - { id: c, text: "AI governance, since it needs no code and uses her risk knowledge" }
  - { id: d, text: "ML engineer, since spotting attacks in logs is mainly a modelling job" }
correct: a
explanation: "AI security builds on everything she has: security basics, light Python and a real chatbot at work to threat-model and test, and few people have both skill sets. A higher GenAI band is tempting, but starting from scratch throws away her rarest asset, and governance would leave her Python and hands-on security skills unused."
