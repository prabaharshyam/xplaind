id: environments-secrets-terraform-3
stop_id: environments-secrets-terraform
stem: "A Hyderabad agency builds staging and production for a client from the same Terraform code. Only two senior engineers may change production; the whole team may change staging. Which setup fits?"
options:
  - { id: a, text: "Two CLI workspaces in one backend, with the team told to select the prod workspace only after approval" }
  - { id: b, text: "One state file holding both environments, with for_each over a map of staging and production settings" }
  - { id: c, text: "Separate folders with copied code per environment, both applied by one CI identity with full rights" }
  - { id: d, text: "A shared module, plus a separate state, backend access and CI identity per environment" }
correct: d
explanation: "Separate states with separate access and pipeline identities mean staging rights cannot reach production, while the module keeps both the same shape. Workspaces are tempting, but they share one backend and the same credentials, so they cannot enforce who changes production."
