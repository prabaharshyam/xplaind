id: model-privacy-attacks-3
stop_id: model-privacy-attacks
stem: "Why does returning exact probabilities, rather than a label or band, raise privacy risk?"
options:
  - { id: a, text: "Exact probabilities are slower to compute" }
  - { id: b, text: "They break the model's accuracy" }
  - { id: c, text: "They are not allowed under any law" }
  - { id: d, text: "Each answer reveals more, which helps membership inference and model extraction" }
correct: d
explanation: "Small confidence differences can show whether a record was in training, and rich outputs make cloning cheaper. Return only what the task needs."
