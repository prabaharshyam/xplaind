stem: "A Chennai lender processes 5,000 loan documents a month. A vendor that passes fit and compliance gives the lowest two-year total at today's volume. The build estimate is mostly fixed cost, and the lender plans 50,000 documents a month next year. What should the product manager do?"
options:
  - { id: a, text: "Compare the vendor's fee with the model token cost only, since tokens drive build cost" }
  - { id: b, text: "Sign a three-year contract now, since the vendor is cheapest at today's volume" }
  - { id: c, text: "Build now, because building is always cheaper than buying once volume is high" }
  - { id: d, text: "Redo both totals at planned volume, and negotiate volume prices and exit terms" }
correct: d
explanation: "Per-document fees grow with volume while a build's cost is mostly fixed, so the answer can flip at ten times the volume; recompute and protect yourself with volume pricing and an exit. Signing for three years on today's numbers is tempting but locks in a price that may be wrong next year."
