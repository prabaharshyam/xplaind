id: executive-communication-2
stop_id: executive-communication
stem: "In the rollout meeting, a Bengaluru retailer's CFO says: 'Your baseline of 14 minutes per return was timed at your busiest store. I don't believe the savings.' What is the best reply?"
options:
  - { id: a, text: "Explain how it was timed, then offer to re-time a sample at two other stores" }
  - { id: b, text: "Point out that the baseline was signed off in the scope of work, so it stands" }
  - { id: c, text: "Move to the model's accuracy scores, which do not depend on the baseline" }
  - { id: d, text: "Say the savings will be even larger at full scale, so the doubt hardly matters" }
correct: a
explanation: "A challenged baseline is answered with its method and an offer to re-check it, then restating the value if it changes. Pointing to the signed scope is true but dismissive; it wins the argument and loses the CFO's trust."
