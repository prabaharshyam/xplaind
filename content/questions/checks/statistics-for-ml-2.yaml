id: statistics-for-ml-2
stop_id: statistics-for-ml
stem: "A Chennai food-delivery dashboard shows last month's delivery times: median 28 minutes, mean 34, standard deviation 23, 90th percentile 62 and 99th percentile 118. The operations head wants one honest line on how bad slow deliveries get. What should you report?"
options:
  - { id: a, text: "The 90th and 99th percentiles: 1 in 10 orders took over 62 minutes, 1 in 100 over 118" }
  - { id: b, text: "Mean plus three standard deviations, 103 minutes, as almost no order takes longer" }
  - { id: c, text: "The median of 28 minutes, because the few very late orders cannot pull it upwards" }
  - { id: d, text: "The standard deviation of 23 minutes, because it measures how spread out the times are" }
correct: a
explanation: "Delivery times have a long right tail, so percentiles describe slow orders directly. The three-standard-deviation rule assumes a bell shape: the 99th percentile of 118 shows that at least 1 in 100 orders take longer than 103 minutes."
