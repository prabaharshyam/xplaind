id: writing-ai-policy-3
stop_id: writing-ai-policy
stem: "Two months after a Jaipur e-commerce company launched its AI policy, proxy logs show visits to free chatbot sites have not fallen. The survey says the approved assistant cannot make product images and exception requests take three weeks. What should the policy owner do first?"
options:
  - { id: a, text: "Block every free chatbot site now and warn staff that misuse will be punished" }
  - { id: b, text: "Add a longer section on shadow AI risks and make everyone repeat the training" }
  - { id: c, text: "Withdraw the policy, because staff clearly prefer free tools and will use them" }
  - { id: d, text: "Approve a checked image tool and answer exception requests within days" }
correct: d
explanation: "The data shows the approved route is failing people: a missing tool and slow approvals push them to free sites, so fix the route. Blocking first feels decisive, but without an approved alternative it acts as a ban and moves the use to personal phones, where you cannot see it."
drafted_with_ai: true
