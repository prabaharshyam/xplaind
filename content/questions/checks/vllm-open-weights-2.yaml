id: vllm-open-weights-2
stop_id: vllm-open-weights
stem: "A Bengaluru team runs a chat model and an embedding model as two vLLM processes on one 80 GB GPU. After upgrading to vLLM v0.34.0 with no flag changes, the embedding server fails to start for lack of memory. What is the right fix?"
options:
  - { id: a, text: "Lower --max-model-len on the chat model so it holds less cache" }
  - { id: b, text: "Quantize the chat model to 4-bit so its weights take less room" }
  - { id: c, text: "Turn off prefix caching, which now reserves memory at start-up" }
  - { id: d, text: "Give each a --gpu-memory-utilization share, totalling at most 1" }
correct: d
explanation: "In v0.34.0 an unset --gpu-memory-utilization means 1.0, so the first server's KV cache takes all free memory. Shrinking the chat model's context or weights does not help, because the cache simply grows into the freed memory."
