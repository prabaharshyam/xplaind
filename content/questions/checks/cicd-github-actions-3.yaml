id: cicd-github-actions-3
stop_id: cicd-github-actions
stem: "A Bengaluru team's workflow uses some-vendor/scan-action@v3. The vendor's account is hacked, and the attacker moves the action's tags to code that prints secrets into the build log. Which setup would have kept the team safe?"
options:
  - { id: a, text: "Pinning the exact release tag v3.2.1 rather than the v3 tag" }
  - { id: b, text: "Keeping the secrets in an environment, not the repository" }
  - { id: c, text: "Pinning its full commit SHA, updated through Dependabot" }
  - { id: d, text: "Using only popular actions from a verified creator" }
correct: c
explanation: "Any tag, even v3.2.1, is a pointer an attacker can move, which is what happened to tj-actions/changed-files in March 2025. A commit SHA cannot be moved, and Dependabot still proposes updates you can review. Environment secrets do not help if the compromised step runs in the job that uses them."
