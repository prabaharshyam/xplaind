id: reasoning-models-3
stop_id: reasoning-models
stem: "A Chennai support bot switches to a reasoning model but keeps its 1,000-token output limit, sized for the old model's short replies. Some requests now stop at the limit with an empty or cut-off answer, and the cost per reply has gone up although visible replies are no longer. What explains both?"
options:
  - { id: a, text: "The provider bills the thinking summary as an extra item" }
  - { id: b, text: "The limit only covers visible text, so the cut-off is a bug" }
  - { id: c, text: "Hidden thinking is billed as output and uses up the limit" }
  - { id: d, text: "The long system prompt is counted against the output limit" }
correct: c
explanation: "Thinking tokens are billed as output tokens even when hidden, and they count toward the output limit, so a limit sized for no thinking runs out before the answer. Raise the limit or lower the effort. The limit covers all output, thinking included, so the cut-off is expected behaviour, not a bug."
