id: company-ai-policy-3
stop_id: company-ai-policy
stem: "Your company approves its video-call tool's AI notetaker for internal meetings. Tomorrow you have a call with a Kochi hospital about a project that involves patient data. The policy says nothing about external calls. What do you do?"
options:
  - { id: a, text: "Turn it on, because approving the tool covers all of your meetings" }
  - { id: b, text: "Turn it on quietly, then delete the transcript once the call ends" }
  - { id: c, text: "Record on a free phone app, so the company tool never sees client data" }
  - { id: d, text: "Check with your manager, then ask the client at the start of the call" }
correct: d
explanation: "A notetaker records everyone, so the other side must agree, and a silent policy means you ask first. Option a is tempting, but approval for internal calls does not cover a client call about patient data."
