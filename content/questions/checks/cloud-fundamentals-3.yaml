id: cloud-fundamentals-3
stop_id: cloud-fundamentals
stem: "A Pune team's Container App calls a hosted model and can scale to 30 replicas. A monthly budget emails at 50%, 90% and 100%. Over a weekend, a client's retry loop runs nonstop and the bill jumps several times over. Which change would have limited the damage?"
options:
  - { id: a, text: "Lower the budget thresholds to 25% so the first email comes sooner" }
  - { id: b, text: "Set minimum replicas to zero so the quiet hours cost nothing" }
  - { id: c, text: "Send the budget emails to the whole team instead of one person" }
  - { id: d, text: "A lower replica ceiling plus a per-client limit on model calls" }
correct: d
explanation: "A budget only sends alerts, and cost data can arrive hours late, so no threshold stops a weekend loop. A replica ceiling and rate limits cap spend as it happens; scaling to zero saves idle cost but does nothing once traffic is flowing."
