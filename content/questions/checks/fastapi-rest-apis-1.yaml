id: fastapi-rest-apis-1
stop_id: fastapi-rest-apis
stem: "A request body is missing a required field. With a Pydantic model on the endpoint, what does FastAPI return?"
options:
  - { id: a, text: "200 with an error message in the body" }
  - { id: b, text: "422 listing the failing field, before your function runs" }
  - { id: c, text: "500 Internal Server Error" }
  - { id: d, text: "404 Not Found" }
correct: b
explanation: "FastAPI validates the body against the model and returns 422 with details, so your code never sees bad input."
