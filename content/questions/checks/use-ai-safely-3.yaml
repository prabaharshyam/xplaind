stem: "Which of these is usually fine to paste into a public chat assistant?"
options:
  - { id: a, text: "A customer's phone number and complaint" }
  - { id: b, text: "A public blog post you want shortened" }
  - { id: c, text: "Your team's salary sheet" }
  - { id: d, text: "The password for a shared account" }
correct: b
explanation: "Public text has nothing confidential in it. Personal data, salaries and passwords never belong in a public tool."
