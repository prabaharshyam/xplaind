id: running-models-on-many-gpus-2
stop_id: running-models-on-many-gpus
stem: "A Pune startup's model needs about 6 GPUs of memory per copy. They have two servers, each with 4 GPUs of 80 GB joined by NVLink, and the servers are linked by an ordinary data-centre network. Which layout should they start with?"
options:
  - { id: a, text: "Tensor parallelism across all 8 GPUs in both servers" }
  - { id: b, text: "One replica per server, each on its 4 GPUs" }
  - { id: c, text: "Pipeline parallelism, so each request runs faster" }
  - { id: d, text: "Tensor 4 inside each server, pipeline 2 across them" }
correct: d
explanation: "Tensor parallelism exchanges results twice in every layer, so it belongs on NVLink inside each server; pipeline sends only stage outputs, once per stage, so the slower link between servers is enough. Tensor across all 8 GPUs is tempting because it uses every GPU, but its constant traffic would cross the slow network."
