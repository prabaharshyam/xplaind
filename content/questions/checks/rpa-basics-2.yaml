id: rpa-basics-2
stop_id: rpa-basics
stem: "A robot posts vendor invoices into an old accounting app for a Surat textile trader. In one night: invoice A has a GSTIN that does not match the vendor master, and on invoice B the app crashed while the robot was typing. How should the robot handle them?"
options:
  - { id: a, text: "Send A to a person with its reason; restart the app and retry B a few times" }
  - { id: b, text: "Retry both up to three times, because automatic retries clear most failures" }
  - { id: c, text: "Retry A after a short pause; send B to a person, because crashes need review" }
  - { id: d, text: "Stop the whole run and alert the developer, because any failure means a bug" }
correct: a
explanation: "A wrong GSTIN is a business exception: the data will be just as wrong on every retry, so a person must fix it. The crash is a system exception that a restart and retry usually clears; retrying both wastes runs on A and still ends with a person."
drafted_with_ai: true
