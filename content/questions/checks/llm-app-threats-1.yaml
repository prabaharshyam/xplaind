id: llm-app-threats-1
stop_id: llm-app-threats
stem: "An app inserts the model's reply straight into a web page as HTML. Which OWASP LLM risk is this, and what is the fix?"
options:
  - { id: a, text: "Misinformation; add citations" }
  - { id: b, text: "Improper output handling; escape or validate model output like any untrusted input" }
  - { id: c, text: "Unbounded consumption; add rate limits" }
  - { id: d, text: "Supply chain; pin the model version" }
correct: b
explanation: "An attacker who steers the model's output can turn it into cross-site scripting. Treat model output as untrusted: escape it for HTML, parameterise SQL and never pass it to exec."
