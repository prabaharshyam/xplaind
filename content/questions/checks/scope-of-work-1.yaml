id: scope-of-work-1
stop_id: scope-of-work
stem: "A draft SOW for a Pune insurer's claim-summary assistant says: 'Acceptance: the system reaches at least 90% accuracy on claim summaries before the pilot starts.' What does this clause most need to become testable?"
options:
  - { id: a, text: "A higher bar, because 90% is too low for insurance claims" }
  - { id: b, text: "A user satisfaction score from the pilot claims handlers" }
  - { id: c, text: "A held-out test set, a named judge and the model version" }
  - { id: d, text: "The KPI target for claim handling time in the same clause" }
correct: c
explanation: "A bar alone cannot be tested: nobody knows which claims, who decides what is correct, or which model it applies to. Raising the bar is tempting, but a higher number on an undefined test is just as arguable."
