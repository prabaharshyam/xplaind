stem: "A Jaipur test-prep app needs at least 80% correct on its 600-problem test set, at the lowest cost. Results, with cost per 100 problems: plain prompt 70%, ₹15; step-by-step prompt 76%, ₹40; reasoning model at low effort 87%, ₹60; step-by-step with a majority of 5, 88%, ₹200; reasoning model at high effort 92%, ₹240. Which should they ship?"
options:
  - { id: a, text: "The step-by-step prompt" }
  - { id: b, text: "Step-by-step with a majority of 5" }
  - { id: c, text: "The reasoning model at high effort" }
  - { id: d, text: "The reasoning model at low effort" }
correct: d
explanation: "Low effort clears 80% with room to spare, even allowing for a margin of about 3 points on 600 problems, and costs least among the options that do. Step-by-step is the right thing to try first, but at 76% it misses the bar. Voting and high effort are more accurate, but they cost three to four times as much for quality the app did not ask for."
