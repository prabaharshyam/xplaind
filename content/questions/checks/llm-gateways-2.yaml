id: llm-gateways-2
stop_id: llm-gateways
stem: "At a Chennai insurer, a nightly claims-summary job and the customer chatbot share one provider quota of 300,000 tokens per minute. Last week the job overran into the morning and the chatbot got rate-limit errors. What is the best fix in the gateway?"
options:
  - { id: a, text: "Per-key token limits: chatbot 200,000, job 60,000; the job waits on 429s" }
  - { id: b, text: "A monthly budget on the job's key, so it is refused once it has spent its share" }
  - { id: c, text: "More retries on the chatbot's key, so it keeps trying until the quota frees up" }
  - { id: d, text: "A fallback for the chatbot to a second model, so rate limits never reach users" }
correct: a
explanation: "Tokens-per-minute limits that add up to less than the quota stop the job taking the chatbot's share at the busy moment. A monthly budget is tempting but controls money over a month, not speed in a minute, so the job could still flood the quota in one morning."
