stem: "Why use model aliases such as chat-default instead of model names in application code?"
options:
  - { id: a, text: "Aliases are cheaper" }
  - { id: b, text: "The model behind an alias can be changed centrally after evals, without code changes" }
  - { id: c, text: "Providers require them" }
  - { id: d, text: "They improve accuracy" }
correct: b
explanation: "Aliases decouple apps from specific models."
