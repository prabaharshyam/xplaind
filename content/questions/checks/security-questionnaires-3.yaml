id: security-questionnaires-3
stop_id: security-questionnaires
stem: "Halfway through a contract with a Mumbai bank, your team wants a new model provider whose nearest region is outside India. Your questionnaire answers said all processing is in India. What is the right move?"
options:
  - { id: a, text: "Switch now: RBI only requires payment data to stay in India, so the bank has no grounds to object." }
  - { id: b, text: "Switch now and update the sub-processor list at the next yearly review of the answer library." }
  - { id: c, text: "Drop the idea, because RBI rules forbid any bank customer data from leaving India at all." }
  - { id: d, text: "Tell the bank first, as the contract's vendor terms require, then fix the India-only answers." }
correct: d
explanation: "A new sub-processor in a new region changes answers the bank relied on, and contracts and bank policy usually require notice first. Option (a) is tempting because the legal point about payment data is right, but the bank's own policy and your earlier answers still bind you."
