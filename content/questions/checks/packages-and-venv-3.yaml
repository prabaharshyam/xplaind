id: packages-and-venv-3
stop_id: packages-and-venv
stem: "Which command records the exact versions installed in the current environment?"
options:
  - { id: a, text: "pip list --save" }
  - { id: b, text: "pip freeze > requirements.txt" }
  - { id: c, text: "python -m venv requirements.txt" }
  - { id: d, text: "pip install --record" }
correct: b
explanation: "pip freeze prints every installed package with its version, and > writes that list to the file."
