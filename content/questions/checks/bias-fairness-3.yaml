id: bias-fairness-3
stop_id: bias-fairness
stem: "In a microfinance lender's data, 80% of Group A and 60% of Group B would repay. Model X approves 70% of each group. Model Y wrongly rejects 10% of would-be repayers and wrongly approves 20% of non-repayers in each group. Which statement is correct?"
options:
  - { id: a, text: "Model X is fairer, because treating both groups at the same rate is what fairness means" }
  - { id: b, text: "Model Y is unfair, because its approval rates will differ between the two groups" }
  - { id: c, text: "Both models meet the same fairness definition, just measured in different ways" }
  - { id: d, text: "X meets equal approval rates, Y equal error rates; a useful model cannot meet both" }
correct: d
explanation: "X equalises approval rates and Y equalises both kinds of error, and with different repayment rates only a model no better than guessing can do both, so picking one is a value decision. Calling Y unfair just because its approval rates differ (76% and 62%) assumes equal approval is the only definition of fairness."
