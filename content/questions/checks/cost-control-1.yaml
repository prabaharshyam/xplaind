id: cost-control-1
stop_id: cost-control
stem: "A Bengaluru fintech moved its FAQ bot to a newer reasoning model. Replies look the same, about 120 visible tokens, but the usage data now shows about 900 output tokens per reply and the bill has doubled. What should the team do first?"
options:
  - { id: a, text: "Set max_tokens to 150, so no reply can ever bill more than 150 tokens" }
  - { id: b, text: "Hide the thinking display, so the unseen reasoning is no longer billed" }
  - { id: c, text: "Treat it as billed thinking and try a lower effort on the FAQ evals" }
  - { id: d, text: "Turn on streaming, so only the tokens shown to the user are billed" }
correct: c
explanation: "The 780-token gap is hidden thinking, which is billed as output, so lowering effort on this easy route and checking the FAQ evals is the right first test. Hiding the display changes only what you see, not what you pay, and a 150-token cap would cut replies off because thinking counts toward max_tokens."
