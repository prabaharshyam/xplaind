id: latency-load-testing-2
stop_id: latency-load-testing
stem: "A Pune edtech runs a short real-model load test of its doubt-solving bot. From about 260 users, many responses are 429 Too Many Requests. CPU is at 25% and database pool waits are near zero. The client retries every failed call at once, up to three times, and calls to the provider jump as the errors start. What should the team do first?"
options:
  - { id: a, text: "Back off with jitter, cap retries, then raise the limit or cut answers" }
  - { id: b, text: "Enlarge the database pool, since latency is rising while CPU stays low" }
  - { id: c, text: "Add more app servers so the system can send more requests to the provider" }
  - { id: d, text: "Raise the client timeouts so that slow requests get more time to finish" }
correct: a
explanation: "A 429 means the provider's rate limit is the ceiling, and instant retries multiply traffic exactly when the limit is hit. The database answer is tempting because CPU is low, but the status code and the near-zero pool waits point to the provider, not the database."
