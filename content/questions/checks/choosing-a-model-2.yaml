id: choosing-a-model-2
stop_id: choosing-a-model
stem: "A model scores 95% on an old, popular maths benchmark but poorly on new questions of the same kind. What is the likely cause?"
options:
  - { id: a, text: "Saturation" }
  - { id: b, text: "Data contamination: the test questions were in its training data" }
  - { id: c, text: "The temperature was too high" }
  - { id: d, text: "The context window was too short" }
correct: b
explanation: "Public test questions leak into web text and then training data. High scores on old benchmarks can show memory rather than skill."
