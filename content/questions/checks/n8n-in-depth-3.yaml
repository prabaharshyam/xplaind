id: n8n-in-depth-3
stop_id: n8n-in-depth
stem: "Priya in Pune sets an error workflow, starting with an Error Trigger, in her reconciliation workflow's settings. To test it, she breaks a node and clicks Execute workflow in the editor. The run fails, but no alert arrives. What is the most likely reason?"
options:
  - { id: a, text: "Error workflows fire only for automatic runs, not ones started by hand" }
  - { id: b, text: "The broken node needs Retry On Fail turned on before it can raise an error" }
  - { id: c, text: "The error workflow should start with a Webhook that the main workflow calls" }
  - { id: d, text: "Pinned data on the trigger hides errors from every node that runs after it" }
correct: a
explanation: "n8n runs the error workflow only when an automatic run fails, such as one started by a schedule, so she should test it with a short schedule. A Webhook start is the tempting wrong fix: an error workflow must start with the Error Trigger, which she already has. Retry settings do not decide whether a failure is reported."
