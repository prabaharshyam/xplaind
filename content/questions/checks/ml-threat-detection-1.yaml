stem: "A login detector catches 99% of attacks and flags 1% of normal logins. A company has 1,000,000 logins a day and about 10 are attacks. Roughly what share of its alerts are real?"
options:
  - { id: a, text: "About 99%" }
  - { id: b, text: "About 50%" }
  - { id: c, text: "About 1 in 1,000" }
  - { id: d, text: "About 1%" }
correct: c
explanation: "About 10 real alerts against about 10,000 false ones. Because attacks are rare, even a small false positive rate swamps the true detections: the base-rate problem."
