stem: "A teammate sends you a project with a requirements.txt file. What do you run after activating a new virtual environment?"
options:
  - { id: a, text: "pip install requirements.txt" }
  - { id: b, text: "python requirements.txt" }
  - { id: c, text: "pip install -r requirements.txt" }
  - { id: d, text: "pip freeze requirements.txt" }
correct: c
explanation: "The -r flag tells pip to read the list of packages from the file."
