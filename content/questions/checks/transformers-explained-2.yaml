id: transformers-explained-2
stop_id: transformers-explained
stem: "A student trains a small decoder-only model on Hindi news to predict the next token. To give every token the full context, she removes the causal mask. Training loss falls almost to zero within an hour, but generated text is nonsense. What went wrong?"
options:
  - { id: a, text: "Each position could see the very token it had to predict, so it learned to copy it" }
  - { id: b, text: "Attention became quadratic without the mask, so the model ran short of memory and stopped learning" }
  - { id: c, text: "The mask carries word order, so without it the model lost track of token positions" }
  - { id: d, text: "Hindi needs many tokens per word, so the model overfitted to the tokenizer's splits" }
correct: a
explanation: "The causal mask hides future tokens; without it the answer is visible during training, so loss collapses while nothing useful is learned, and at generation time there is no future to copy. Option c is tempting, but order comes from position embeddings such as RoPE, not from the mask."
