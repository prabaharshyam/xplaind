id: gpus-quantization-2
stop_id: gpus-quantization
stem: "A Kochi team serves a 14B model in 4-bit AWQ (about 10 GB) on one 48 GB L40S. Single-user tests are fine, but at the 10 a.m. peak, requests queue because the KV cache is full. Which change most directly lets more requests fit on this GPU?"
options:
  - { id: a, text: "Store the KV cache in FP8, which halves it, then re-run the evals" }
  - { id: b, text: "Quantize the weights from 4-bit to 3-bit, since weights fill the memory" }
  - { id: c, text: "Split the model over two GPUs with tensor parallelism to share its load" }
  - { id: d, text: "Raise the maximum context length so long prompts are no longer cut off" }
correct: a
explanation: "The cache, not the 10 GB of weights, is what fills the card, so halving it roughly doubles the requests that fit, as long as the evals still pass. Going to 3-bit saves only about 2 GB at a real quality cost; if more GPUs are needed, separate copies beat tensor parallelism for a model that already fits."
