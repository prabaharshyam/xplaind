id: writing-ai-policy-1
stop_id: writing-ai-policy
stem: "You are reviewing the incident section of a draft AI policy for a Bengaluru fintech. It says: \"Report any AI mistake or data leak to your manager within 24 hours.\" What is the best change?"
options:
  - { id: a, text: "Keep 24 hours, since the DPDP Rules allow 72 hours for the report to the Board" }
  - { id: b, text: "Drop the deadline, so staff never hide a mistake for fear of reporting it late" }
  - { id: c, text: "Report to security within an hour; security and legal judge outside reports" }
  - { id: d, text: "Tell staff to report every AI mistake straight to CERT-In within six hours" }
correct: c
explanation: "CERT-In requires listed incidents, including data leaks, within 6 hours of noticing, so the internal clock must be shorter, and experts should judge what goes outside. The 72-hour DPDP report is a later, separate step, and it does not make a 24-hour internal deadline safe."
