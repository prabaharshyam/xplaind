id: incident-response-basics-2
stop_id: incident-response-basics
stem: "An attacker is using a stolen admin account right now. Which action is containment rather than eradication?"
options:
  - { id: a, text: "Disabling the account and revoking its sessions and tokens" }
  - { id: b, text: "Patching the vulnerability the attacker first used, a week later" }
  - { id: c, text: "Holding a blameless lessons-learned review" }
  - { id: d, text: "Buying a new SIEM" }
correct: a
explanation: "Containment stops the damage spreading, fast. Eradication removes the root cause, such as the vulnerability or malware. Reviews belong to lessons learned."
