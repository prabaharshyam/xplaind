id: build-vs-buy-1
stop_id: build-vs-buy
stem: "An insurer in Pune tests AI that summarises claim files. On 30 real files, claims experts rate 27 usable, 3 needing work and none unsafe. The manager wants to go live next month on about 2 lakh claims a year. What should the team do?"
options:
  - { id: a, text: "Go live as planned: no unsafe output in 30 files shows the unsafe rate is close to zero" }
  - { id: b, text: "Stop the project: 3 files out of 30 needing work shows the task is not feasible yet" }
  - { id: c, text: "Keep building, but run a far larger expert-rated test first: 0 of 30 can hide rare failures" }
  - { id: d, text: "Ask the engineers who wrote the prompt to re-rate all 30 files more strictly before deciding" }
correct: c
explanation: "Thirty examples show feasibility, but 0 unsafe in 30 is still consistent with an unsafe rate near 10%, so go-live needs a much larger evaluation. Going live now treats a small prototype as launch evidence, which is the most tempting mistake."
