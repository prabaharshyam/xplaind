id: cloud-fundamentals-1
stop_id: cloud-fundamentals
stem: "A Bengaluru lending startup runs its app and PostgreSQL privately in Central India. To get more quota, the team deploys its chat model in Microsoft Foundry as Global Standard. The client's policy says customer data must be processed only in India. What is the problem?"
options:
  - { id: a, text: "None, since the Foundry resource was created in Central India" }
  - { id: b, text: "Uploaded files and stored data would be kept outside India" }
  - { id: c, text: "Prompts with customer data may be processed outside India" }
  - { id: d, text: "None, since only the database holds customer records" }
correct: c
explanation: "A Global deployment can process each request in any region where the model runs, even when the resource sits in Central India. Stored data stays in the resource's geography, so the risk is processing, not storage; a regional Standard deployment in an Indian region fixes it."
