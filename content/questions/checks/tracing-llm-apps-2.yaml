id: tracing-llm-apps-2
stop_id: tracing-llm-apps
stem: "A Kochi travel agency's assistant started giving shorter, vaguer answers on Tuesday. Nobody changed the code, the prompt (still v12) or the configured model name. Which recorded attribute is most likely to show the cause?"
options:
  - { id: a, text: "The response model on each model span, compared before and after Tuesday" }
  - { id: b, text: "The requested model on each model span, compared before and after Tuesday" }
  - { id: c, text: "The prompt version tag, which shows whether a prompt edit caused it" }
  - { id: d, text: "The total latency of each trace, which shows whether the provider was slow" }
correct: a
explanation: "Providers can move a model alias to a new snapshot, and only the response model records what actually answered. The requested model is the name you configured, so it stays the same and hides the change."
