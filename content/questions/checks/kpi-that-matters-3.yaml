stem: "A Hyderabad hospital's billing pilot aimed to cut median minutes per claim from 30 to 12. On the agreed final weeks it reached 13, with a likely range of 12.5 to 13.5; the agreed bands call 13 to 15 'close'. Guardrails held. How should you report it?"
options:
  - { id: a, text: "As met, because one minute is within the normal weekly variation" }
  - { id: b, text: "As a failure, and recommend stopping, because the target was missed" }
  - { id: c, text: "As not yet known, and extend the pilot until a week reaches 12" }
  - { id: d, text: "As close: a real saving, short of target, with a plan for the gap" }
correct: d
explanation: "The bands were agreed in advance, and the target lies outside the likely range, so the honest word is close, not met. Calling it met because the gap looks small rewrites the agreement after seeing the result."
