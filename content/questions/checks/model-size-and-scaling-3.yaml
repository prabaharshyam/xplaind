id: model-size-and-scaling-3
stop_id: model-size-and-scaling
stem: "A Chennai company will serve a Tamil support assistant at about 1 crore replies a month. For the same training budget it can train a 7B model at about 20 tokens per parameter, or a 3B model on far more tokens that scores within a point of the 7B on its test set. Which should it pick?"
options:
  - { id: a, text: "The 7B, because the Chinchilla point gives the best model for any use" }
  - { id: b, text: "The 7B, because more parameters always give better answers to users" }
  - { id: c, text: "Either, because training costs the same and that is the main cost" }
  - { id: d, text: "The 3B, because each reply costs less and quality is about equal" }
correct: d
explanation: "Chinchilla minimises training cost only; at 1 crore replies a month, the running cost of every reply dominates, and the 3B model needs less than half the arithmetic per token for nearly the same quality. Option a is tempting, but 'compute-optimal' ignores what the model costs to use."
