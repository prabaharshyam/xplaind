stem: "Why was Llama 3 8B trained on far more than 20 tokens per parameter?"
options:
  - { id: a, text: "By mistake" }
  - { id: b, text: "A smaller model trained longer is cheaper to run for many users and keeps improving" }
  - { id: c, text: "Chinchilla requires it" }
  - { id: d, text: "Larger models cannot use more data" }
correct: b
explanation: "The Chinchilla rule minimises training cost. Heavily used models are trained longer so that every request is cheaper."
