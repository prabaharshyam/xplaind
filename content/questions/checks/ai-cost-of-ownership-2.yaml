id: ai-cost-of-ownership-2
stop_id: ai-cost-of-ownership
stem: "A Bengaluru edtech wants to self-host a model for homework help. A load test shows one GPU serves 2 requests per second at the target latency. Traffic averages 1 request per second over the day but reaches 6 per second for two hours each evening. What should the self-hosted plan budget for?"
options:
  - { id: a, text: "Four GPUs, three for the peak plus a spare, mostly idle" }
  - { id: b, text: "One GPU, because average traffic is half of its capacity" }
  - { id: c, text: "Three GPUs, running near full use because they match the peak" }
  - { id: d, text: "Three GPUs billed only for the two busy hours each evening" }
correct: a
explanation: "Capacity must cover the 6-per-second peak with a spare, and the fleet stays up all day because traffic never stops, so four GPUs serve an average of 1 request per second: about 12.5% utilisation. The 'near full use' option confuses peak load with average load; the GPUs are busy only for those two evening hours."
