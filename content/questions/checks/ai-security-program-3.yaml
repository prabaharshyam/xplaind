stem: "Which question matters most in a vendor review of an AI meeting-notes tool?"
options:
  - { id: a, text: "Whether recordings and transcripts are used to train the vendor's models, and how long they are kept" }
  - { id: b, text: "How many languages the user interface supports" }
  - { id: c, text: "Whether the vendor has a mobile app" }
  - { id: d, text: "How fast the tool produces a summary" }
