id: ml-feature-engineering-1
stop_id: ml-feature-engineering
stem: "A Hyderabad lending startup has 2 lakh past loans. An analyst target-encodes branch_code and fits a scaler on all 2 lakh rows, then makes a random 80/20 split. Validation AUC is 0.91, but live AUC is 0.74. What is the most likely cause?"
options:
  - { id: a, text: "The encoder learned from validation rows' outcomes, as it was fitted before the split" }
  - { id: b, text: "Gradient boosting needs no scaling, so the scaler added noise that hurts live accuracy" }
  - { id: c, text: "Borrower behaviour drifted after launch; a random split gives a fair estimate otherwise" }
  - { id: d, text: "Branch code has too many values for target encoding; one-hot would hold up live" }
correct: a
explanation: "Fitting the target encoder on all rows puts each validation row's own label inside its feature, so validation looks better than reality. Drift is the tempting answer, but it cannot explain a gap that the pipeline itself creates; fit encoders and scalers after the split, inside the pipeline."
