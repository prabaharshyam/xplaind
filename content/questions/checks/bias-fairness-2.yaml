stem: "A hiring tool in Hyderabad shortlists 30% of 1,000 male applicants and 21% of 500 female applicants, all of whom meet the job's requirements. Using the four-fifths rule of thumb, what should the team conclude?"
options:
  - { id: a, text: "The ratio is 0.70, below 0.8, so the gap is a warning sign to investigate" }
  - { id: b, text: "The gap is 9 points, well under 20 points, so the tool passes the rule" }
  - { id: c, text: "The overall shortlist rate is 27%, so the tool treats both groups fairly" }
  - { id: d, text: "The ratio is 0.70, which proves illegal discrimination under Indian law" }
correct: a
explanation: "The rule compares rates, not points: 21 divided by 30 is 0.70, below the 0.8 screen, so the team should look for the cause. Reading it as a 20-point allowance is the common slip, and the rule is a US rule of thumb that flags a problem rather than proving one."
