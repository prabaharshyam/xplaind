id: rpa-basics-3
stop_id: rpa-basics
stem: "A Chennai hospital's billing app is published over Citrix. The robot sees only a picture of the screen, so the developer made it find the Submit button by image matching. It passed every test on the developer's laptop. What is the main risk, and the best first step?"
options:
  - { id: a, text: "Image matching is slow, so the real fix is to schedule the robot to run overnight" }
  - { id: b, text: "There is little risk now it passed every test; add a few more cases and go live" }
  - { id: c, text: "Citrix screens cannot be automated at all, so replace the robot with an AI agent" }
  - { id: d, text: "A font or scaling change can break it; ask about the RPA vendor's Citrix add-on" }
correct: d
explanation: "Image matching breaks when the theme, font, resolution or scaling changes, and the robot machine may differ from the laptop. The RPA vendor's Citrix component on the server restores real selectors; passing tests on one machine proves little, because the risk is change, not today's screen."
