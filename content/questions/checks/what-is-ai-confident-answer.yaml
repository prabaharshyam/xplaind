id: what-is-ai-confident-answer
stop_id: what-is-ai
stem: A chat assistant gives a confident answer that includes a statistic. What is the safest next step?
options:
  - { id: a, text: "Trust it, because it sounded sure" }
  - { id: b, text: Check the statistic against a source you trust }
  - { id: c, text: Ask the same question again and trust the answer if it repeats }
  - { id: d, text: "Assume it is wrong, because AI is always unreliable" }
correct: b
explanation: Language models can state made-up facts in a confident tone. Asking again can repeat the same mistake, and rejecting everything is not useful either. Checking the one claim you plan to rely on is the habit that works.
