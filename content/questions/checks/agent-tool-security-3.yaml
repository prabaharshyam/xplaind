stem: "Which approval prompt gives a person a real chance to catch a bad tool call?"
options:
  - { id: a, text: "\"Allow tools for this session?\"" }
  - { id: b, text: "\"Allow send_email?\"" }
  - { id: c, text: "No prompt, so people are not interrupted" }
