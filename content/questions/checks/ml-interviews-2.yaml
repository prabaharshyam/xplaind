id: ml-interviews-2
stop_id: ml-interviews
stem: "In a mock interview, Rohit says his model for flagging fake sellers on a Surat textile marketplace has 99.8% accuracy on a time-based test set. About 0.2% of sellers are fake, and the trust team can review 300 sellers a week. What is the most useful thing to ask next?"
options:
  - { id: a, text: "How many of the top 300 sellers each week are fake, and what share of all fakes is that?" }
  - { id: b, text: "What is the ROC AUC, since it is not affected by imbalance and is the fairest single score?" }
  - { id: c, text: "Can the threshold be tuned to lift accuracy from 99.8% to 99.9% before the model launches?" }
  - { id: d, text: "Was the test set undersampled to 50% fake sellers, so that accuracy becomes a fair measure?" }
correct: a
explanation: "With 0.2% fake sellers, predicting that no seller is fake already scores 99.8%, so accuracy says nothing; precision and recall at the team's 300 reviews a week measure what the business gets. ROC AUC is tempting, but it can look high on rare-event data while precision at the review capacity is poor."
