id: webhooks-basics-3
stop_id: webhooks-basics
stem: "A travel agency in Kochi replied slowly to one payment webhook, so the gateway retried. Both copies arrived one second apart. The workflow looks up the event id in a sheet and adds a row if it is missing, yet two invoices went out. What prevents this?"
options:
  - { id: a, text: "Reply 200 sooner, so the gateway never has a reason to send a second copy" }
  - { id: b, text: "Look up the event id twice: once at the start and once just before invoicing" }
  - { id: c, text: "Turn off gateway retries, so that each event is only ever delivered once" }
  - { id: d, text: "Record the id with an insert that fails on duplicates, before any work" }
correct: d
explanation: "Both copies passed the lookup before either wrote its row, because checking and writing were two separate steps. A unique key makes them one step, so exactly one insert succeeds. Replying faster helps but cannot stop at-least-once delivery from sending repeats."
