id: pricing-ai-features-2
stop_id: pricing-ai-features
stem: "A Hyderabad edtech app estimated its doubt-answering feature at 300 output tokens per answer, but output cost is about four times that estimate. Logs show replies average 300 visible tokens while output_tokens averages 1,200. What should the PM do first?"
options:
  - { id: a, text: "Log thinking tokens and test a lower effort level on simple doubts" }
  - { id: b, text: "Set the maximum output length to 300 tokens to match the replies" }
  - { id: c, text: "Switch provider, since the price per token must have been raised" }
  - { id: d, text: "Ask for a refund, since output tokens nobody sees are billed wrongly" }
correct: a
explanation: "The extra 900 tokens are thinking, which bills as output even when hidden; lower effort on simple doubts, checked on an eval, cuts it. Capping output at 300 is tempting but wrong: thinking counts toward the cap, so replies get cut off and retries cost more."
