id: ai-in-indian-languages-2
stop_id: ai-in-indian-languages
stem: "Why are general models usually weaker in Marathi or Telugu than in English?"
options:
  - { id: a, text: "Those languages are grammatically simpler" }
  - { id: b, text: "There is very little Marathi or Telugu text in their training data" }
  - { id: c, text: "Models cannot read Devanagari" }
  - { id: d, text: "Indian languages have no written standard" }
correct: b
explanation: "These languages make up a tiny share of web training data compared with their number of speakers, so models learn them less well."
