id: ml-interviews-1
stop_id: ml-interviews
stem: "In a design round, Ananya is building a loan-default model for a Bengaluru lending app. A loan's label is final 90 days after it is issued. She will test on loans issued in July 2026, using labels pulled on 1 November 2026. Which training set gives an honest test score?"
options:
  - { id: a, text: "All loans issued before July 2026, so the model learns the latest behaviour" }
  - { id: b, text: "A random 80% of all loans, stratified by default rate, with the rest held out" }
  - { id: c, text: "Loans issued before early April 2026, one label delay before the test" }
  - { id: d, text: "Loans issued before June 2026, leaving a one-month gap before testing" }
correct: c
explanation: "On 1 July she could only have known final labels for loans issued at least 90 days earlier, so training must stop about one full delay (90 days) before the test period, and a one-month gap is too short. Option a looks sensible but trains on April to June loans using labels that only arrived later, which makes the test score too optimistic."
