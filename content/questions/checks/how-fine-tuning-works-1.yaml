id: how-fine-tuning-works-1
stop_id: how-fine-tuning-works
stem: "You fine-tune a model and it scores 95% on your test set. Later you find the same emails were in the training data. What does the 95% tell you?"
options:
  - { id: a, text: "The model is excellent and ready to ship" }
  - { id: b, text: "Very little, because the test examples were not unseen" }
  - { id: c, text: "The model forgot its old skills" }
  - { id: d, text: "The learning rate was too low" }
correct: b
explanation: "A test set only measures real performance if the model has never seen it. Leaked examples inflate the score, so remove duplicates before splitting."
