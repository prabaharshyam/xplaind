id: agent-budgets-kill-switches-1
stop_id: agent-budgets-kill-switches
stem: "A Pune fintech's support agent has a ₹20 daily cap per user, stored in Postgres. For each model call the code reads today's total, calls the model if the total plus an estimate is within the cap, and afterwards adds the real cost. On busy days some users reach ₹34. What is the right fix?"
options:
  - { id: a, text: "Lower the cap to ₹12 so that the overshoot lands near ₹20" }
  - { id: b, text: "Make the final step an atomic update of total = total + cost" }
  - { id: c, text: "Reserve the estimate in one atomic step first, then settle" }
  - { id: d, text: "Retry the final write if it fails, so that no spend is lost" }
correct: c
explanation: "The race is in the gap between reading the total and adding the cost: many calls pass the same check before any of them is counted. An atomic increment after the call does not close that gap; only a check and reservation in one statement does."
