id: phishing-social-engineering-2
stop_id: phishing-social-engineering
stem: "What does a DMARC record add on top of SPF and DKIM?"
options:
  - { id: a, text: "It encrypts every email end to end" }
  - { id: b, text: "It scans attachments for malware" }
  - { id: c, text: "It requires SPF or DKIM to pass and align with the visible From domain, sets what receivers do on failure, and sends reports to the domain owner" }
  - { id: d, text: "It blocks look-alike domains such as examp1e.in automatically" }
correct: c
explanation: "DMARC ties SPF and DKIM to the From domain people see, with a policy of none, quarantine or reject, plus reports. It does not encrypt mail, scan attachments or stop look-alike domains."
