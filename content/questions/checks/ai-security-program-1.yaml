stem: "Proxy logs show hundreds of staff using public chatbots for work. What is the best first response?"
options:
  - { id: a, text: "Block every AI website at once and say nothing" }
  - { id: b, text: "Ignore it; staff will stop on their own" }
  - { id: c, text: "Offer an approved enterprise tool with clear data rules, then restrict the unapproved ones" }
  - { id: d, text: "Ask each person to sign a form promising not to paste data" }
correct: c
explanation: "People use shadow AI because it helps them work. Give them a safe approved option first, then restrict; blocking alone pushes use onto personal devices."
