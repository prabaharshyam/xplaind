id: versioning-prompts-models-3
stop_id: versioning-prompts-models
stem: "A Pune startup loads its prompt from a registry alias called 'production' and writes 'production' into every trace. After moving the alias from version 9 back to 8, it cannot tell which answers came from which version. What is the best fix?"
options:
  - { id: a, text: "Load the prompt by version number in code and stop using the alias at all" }
  - { id: b, text: "Turn off the registry's alias cache so that rollbacks take effect instantly" }
  - { id: c, text: "Create a new alias for every version so that each has its own stable name" }
  - { id: d, text: "Log the version the alias resolved to, with the release id, on every trace" }
correct: d
explanation: "An alias is a moving name, so traces must record the version it pointed to when the prompt was loaded. Loading by version number keeps traces clear but loses the one-step rollback the alias gives, and the cache only affects how fast a move takes effect."
