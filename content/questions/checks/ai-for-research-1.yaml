id: ai-for-research-1
stop_id: ai-for-research
stem: "Nisha, a student in Kochi, asks an assistant for evidence that banning phones in class improves exam scores. It cites a real journal paper. She finds the paper on Google Scholar, but its abstract describes a lab study of 40 adults' attention on a short task, with no exams. What should she conclude?"
options:
  - { id: a, text: "A paper on a related topic is enough support for an assignment claim" }
  - { id: b, text: "The claim is supported, because a peer-reviewed paper is cited for it" }
  - { id: c, text: "The paper is real but does not back the claim, so it is unverified" }
  - { id: d, text: "She should ask the assistant to confirm the paper supports the claim" }
correct: c
explanation: "A citation supports a claim only if the source studied the same thing. This paper studied adults' attention on a lab task, not exam scores in schools, so the claim stays unverified. A related topic is not support, and asking the same assistant to confirm is not an independent check."
