id: statistics-for-ml-1
stop_id: statistics-for-ml
stem: "A Pune HR-tech team scores two resume-screening models on the same 400 labelled resumes. Model A gets 81% right (324) and model B gets 84% (336). A paired bootstrap of B minus A gives a 95% interval of -0.5 to +6.5 points. What should they conclude?"
options:
  - { id: a, text: "B is better: it is 3 points ahead on 400 resumes, a fair-sized test" }
  - { id: b, text: "B is better: nearly all of the interval lies above zero, so it wins" }
  - { id: c, text: "Not proven yet: the interval includes zero, so test on more resumes" }
  - { id: d, text: "The test is invalid: a bootstrap needs a separate test set per model" }
correct: c
explanation: "The paired interval for the difference includes zero, so a 3-point gap is still consistent with no real difference; McNemar's test on the 52 resumes where the models disagree (B alone right on 32, A alone right on 20) agrees (p = 0.13). Most of the interval being above zero is tempting, but an interval that includes zero is not evidence of a winner."
