id: langgraph-basics-2
stop_id: langgraph-basics
stem: "A Pune insurance team runs LangGraph 1.2. Their draft_reply node feeds check_reply, which sends the draft back when it breaks a rule. One unusual claim never passed the check and made thousands of model calls overnight before the run stopped. What is the best fix?"
options:
  - { id: a, text: "Switch from InMemorySaver to PostgresSaver so the looping run is saved and can stop" }
  - { id: b, text: "Look elsewhere for the cost, because LangGraph ends every run after 25 steps by default" }
  - { id: c, text: "Set a small recursion_limit on every run and catch GraphRecursionError for a handover" }
  - { id: d, text: "Merge check_reply into draft_reply so the graph has no loop left for LangGraph to count" }
correct: c
explanation: "recursion_limit caps the steps in one run, and catching GraphRecursionError lets a person take over. The default was 25 only up to LangGraph 1.0.5; releases from 1.0.6 use 10,000 or more, which is why the loop ran so long. Merging the nodes only hides the loop inside one function."
