stem: "How is a basic tool-using agent expressed in LangGraph?"
options:
  - { id: a, text: "As one node that does everything" }
  - { id: b, text: "As a model node and a tool node with a conditional edge that loops until no tool is requested" }
  - { id: c, text: "As a list of prompts" }
  - { id: d, text: "It cannot be expressed" }
correct: b
explanation: "The agent loop is a small graph: the conditional edge checks whether the model asked for a tool."
