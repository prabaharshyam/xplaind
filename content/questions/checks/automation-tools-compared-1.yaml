id: automation-tools-compared-1
stop_id: automation-tools-compared
stem: "A 250-person IT services firm in Noida runs on Microsoft 365 Business Standard and has its own IT team. It wants leave requests from Microsoft Forms sent to each manager for approval in Teams, then logged in a SharePoint list: about 1,500 runs a month, standard connectors only. What do you recommend?"
options:
  - { id: a, text: "Zapier, because it is the easiest tool and HR can build the flow itself" }
  - { id: b, text: "Self-hosted n8n, because it charges no fee per run at this volume" }
  - { id: c, text: "Power Automate cloud flows under their existing Microsoft 365 licences" }
  - { id: d, text: "Power Automate, after buying a Premium licence for every employee" }
correct: c
explanation: "Cloud flows that use only standard connectors such as Forms, Teams and SharePoint are covered by business Microsoft 365 plans, and the IT team already governs that tenant. Buying Premium for everyone pays for premium connectors and RPA the flow never uses, and n8n would add servers and upkeep to save a fee that does not exist."
