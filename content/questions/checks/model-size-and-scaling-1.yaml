id: model-size-and-scaling-1
stop_id: model-size-and-scaling
stem: "A Pune team wants to self-host Qwen3-30B-A3B, a mixture-of-experts model with about 30.5 billion parameters in total and 3.3 billion active per token, at 16-bit precision. Which statement is right?"
options:
  - { id: a, text: "About 7 GB for weights, and per-token compute like a 3B model" }
  - { id: b, text: "About 61 GB for weights, and per-token compute like a 30B model" }
  - { id: c, text: "About 61 GB for weights, but per-token compute like a 3B model" }
  - { id: d, text: "About 30 GB for weights, since 16-bit means one byte per weight" }
correct: c
explanation: "Memory follows the total parameters, because every expert must be loaded: 30.5 billion × 2 bytes is about 61 GB. Compute and speed follow the 3.3 billion active parameters, so option a gets the speed right but wrongly sizes memory from the active count."
