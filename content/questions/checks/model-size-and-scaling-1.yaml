stem: "About how much GPU memory do the weights of a 13-billion-parameter model need at 16-bit precision?"
options:
  - { id: a, text: "13 MB" }
  - { id: b, text: "About 26 GB" }
  - { id: c, text: "About 2.6 TB" }
  - { id: d, text: "1.3 GB" }
correct: b
explanation: "Memory for weights is parameters times bytes per parameter: 13 billion × 2 bytes ≈ 26 GB, before the KV cache and overhead."
