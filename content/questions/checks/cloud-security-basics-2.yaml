id: cloud-security-basics-2
stop_id: cloud-security-basics
stem: "A developer finds that a cloud access key was pushed to a public GitHub repository an hour ago. What should happen first?"
options:
  - { id: a, text: "Delete the commit and carry on" }
  - { id: b, text: "Make the repository private and wait to see if anything happens" }
  - { id: c, text: "Deactivate and rotate the key at once, then check the cloud audit logs for anything it was used for" }
  - { id: d, text: "Email everyone asking them not to use the key" }
correct: c
explanation: "Automated scanners watch public repositories for keys, so assume it was copied. Kill the key, then use audit logs such as CloudTrail to see what it did."
