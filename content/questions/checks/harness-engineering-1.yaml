id: harness-engineering-1
stop_id: harness-engineering
stem: "Two teams use the same model for their coding agents, but one agent finishes far more tasks. What most likely explains the gap?"
options:
  - { id: a, text: "One team gets a better copy of the model weights" }
  - { id: b, text: "The harness: tools, verification checks, state on disk, context handling and stop rules" }
  - { id: c, text: "The time of day the agents run" }
  - { id: d, text: "One team writes longer prompts" }
correct: b
explanation: "Agent = model + harness. With the model fixed, the difference lies in what surrounds it: tools, checks, memory and limits."
