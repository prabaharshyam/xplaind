id: linux-for-security-1
stop_id: linux-for-security
stem: "A file holding API keys shows -rw-rw-rw- in ls -l. What is the right fix?"
options:
  - { id: a, text: "chmod 777 so the app can always read it" }
  - { id: b, text: "Rename the file to start with a dot" }
  - { id: c, text: "Delete the file's group" }
  - { id: d, text: "Make the app user the owner and chmod 600, then rotate the keys if they may have been read" }
correct: d
explanation: "rw for everyone lets any user or compromised service read and change the keys. Owner-only 600 is right; a hidden name or a group change does not protect it."
