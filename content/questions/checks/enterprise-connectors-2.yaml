id: enterprise-connectors-2
stop_id: enterprise-connectors
stem: "A Chennai distributor's assistant syncs Salesforce accounts every 30 minutes with a query on SystemModstamp. Sales managers say accounts they deleted last week still appear in answers. What is the best fix?"
options:
  - { id: a, text: "Also call Salesforce's get-deleted resource for each window, plus a weekly id check" }
  - { id: b, text: "Switch the filter from SystemModstamp to LastModifiedDate so more changes are caught" }
  - { id: c, text: "Run the same modified-since query every 5 minutes so deletions arrive sooner" }
  - { id: d, text: "Rebuild the whole index from a full export of all accounts every night" }
correct: a
explanation: "A modified-since query only returns records that still exist, so deletions never reach the index; a deletion feed plus a weekly id comparison fixes that. Running the query more often is tempting, but a deleted record is never returned at any frequency."
