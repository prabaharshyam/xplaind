id: ml-feature-engineering-2
stop_id: ml-feature-engineering
stem: "A Pune e-commerce team builds churn features at monthly cutoffs for 18 months, so each customer appears in up to 18 rows. A colleague proposes a random 80/20 split of all rows for validation. What should the team do instead?"
options:
  - { id: a, text: "Use 5-fold random cross-validation, so the noise from one split averages out" }
  - { id: b, text: "Stratify the random split by churn label, so both sets have the same churn rate" }
  - { id: c, text: "Keep the random split but drop customer ID, so the model cannot memorise people" }
  - { id: d, text: "Train on the earlier monthly cutoffs and validate on the later months only" }
correct: d
explanation: "A time split mirrors real use: the model is trained on the past and judged on a future it has not seen. Random cross-validation is tempting, but every fold still mixes later months into training, so leaks and short-lived patterns still look like skill."
