stem: "Arjun moved from Finance to Sales at a Pune company. Chunks store access as group ids. Two weeks later the HR assistant still shows him Finance-only salary circulars. What is the right fix?"
options:
  - { id: a, text: "Re-embed all the Finance circulars so the vectors forget his old access" }
  - { id: b, text: "Store each employee's user id on every chunk so that access is exact" }
  - { id: c, text: "Drop the access filter and tell the model to refuse salary questions" }
  - { id: d, text: "Read his groups fresh from the identity system at query time" }
correct: d
explanation: "The chunks are tagged correctly; the stale part is the cached list of Arjun's groups, so read groups at query time or cache them briefly. Re-embedding changes the vectors, not the access metadata, so it fixes nothing."
