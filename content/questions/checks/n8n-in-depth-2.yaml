stem: "A textile wholesaler in Surat needs to update 1,500 contacts in a CRM whose API allows 100 requests a minute. The workflow uses Loop Over Items with a batch size of 25 and one request per item. What is the shortest Wait between batches that keeps it within the limit?"
options:
  - { id: a, text: "0.6 seconds, because 100 a minute is one request every 0.6 seconds" }
  - { id: b, text: "No Wait: turn on Retry On Fail so it absorbs the rate-limit errors" }
  - { id: c, text: "60 seconds, so that each batch of 25 gets a whole minute to itself" }
  - { id: d, text: "15 seconds, so at most four batches of 25 start in each minute" }
correct: d
explanation: "Each batch sends 25 requests, so 25 x 60 / 100 = 15 seconds keeps you at 100 a minute; add a little margin in practice. A 0.6-second wait paces the batches, not the requests, so it sends about 25 requests every 0.6 seconds. Retries allow at most five tries a few seconds apart, so they cannot replace pacing."
