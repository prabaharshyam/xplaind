stem: "A Hyderabad hospital group's cost model says self-hosting with one-year reserved GPUs stays cheaper than the API above 1.9 million requests a month. Today's volume is 1.1 million, growing about 5% a month. The API's prices for this quality level fell during the last year. What should the recommendation say?"
options:
  - { id: a, text: "Reserve GPUs now, since growth will pass 1.9 million within a year" }
  - { id: b, text: "Self-host now, since each extra request is cheaper on a GPU" }
  - { id: c, text: "Stay on the API for good, since its prices always fall faster" }
  - { id: d, text: "Stay on the API, and requote GPUs when volume nears 1.5 million" }
correct: d
explanation: "The crossover is close but fragile: it moves with API prices, GPU throughput and the rupee, so set a review trigger and rerun the model with fresh quotes. Reserving now is tempting, but it locks in a year of cost on a forecast while API prices may keep falling and push the crossover further out."
