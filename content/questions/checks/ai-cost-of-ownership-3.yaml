stem: "Self-hosting costs ₹1.75 crore a year and the API option ₹1 crore at current volume. When might self-hosting become the better choice?"
options:
  - { id: a, text: "Never" }
  - { id: b, text: "If volume rises enough that fixed GPU costs are spread over many more requests, or if data rules require it" }
  - { id: c, text: "When prices go up" }
  - { id: d, text: "When users prefer it" }
correct: b
explanation: "Fixed costs favour self-hosting only at high, steady volume, or when it is required."
