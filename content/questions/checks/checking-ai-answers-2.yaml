stop_id: checking-ai-answers
stem: "Arjun asks an assistant for the family income limit of a state scholarship. It links to the official state portal, and the page does give that limit, but in the notice for last year's round. What should he do?"
options:
  - { id: a, text: "Rely on it, because the link is official and the sentence matches" }
  - { id: b, text: "Ask the assistant whether the limit is still current, and accept its reply" }
  - { id: c, text: "Ask a second assistant, and treat the limit as confirmed if both agree" }
  - { id: d, text: "Find this year's notice on the same portal and read the limit there" }
correct: d
explanation: "A source must be current as well as official, and rules can change between rounds, so only this year's notice settles it. The official link is tempting, but old notices stay online; asking the same or another assistant is not an independent check."
