id: model-privacy-attacks-2
stop_id: model-privacy-attacks
stem: "A support chatbot fine-tuned on old tickets sometimes completes a prompt with a real customer's phone number. What is the strongest fix?"
options:
  - { id: a, text: "Tell the model in its system prompt not to share phone numbers" }
  - { id: b, text: "Remove or mask personal data in the tickets before fine-tuning, and retrain" }
  - { id: c, text: "Lower the temperature" }
  - { id: d, text: "Add more tickets to the training data" }
correct: b
explanation: "A model cannot leak what it never saw. Output filters help as a second layer, but cleaning the training data removes the cause."
