id: writing-ai-policy-2
stop_id: writing-ai-policy
stem: "A Chennai hospital-software company's sales team asks you to approve an AI meeting note-taker. The vendor's website says: \"We never train on your data.\" As the policy author, what do you do next?"
options:
  - { id: a, text: "Ask for written terms on retention, location, vendor access and logs" }
  - { id: b, text: "Approve it, because training on company data is the main risk of an AI tool" }
  - { id: c, text: "Switch on the training opt-out setting for every user, then approve it" }
  - { id: d, text: "Refuse it, since any tool that records meetings is too risky in health care" }
correct: a
explanation: "Not training on data says nothing about how long recordings are kept, where they are stored, who at the vendor can read them, or what the contract promises, so the checklist comes first. Approving on that one promise is the tempting shortcut, and it is the gap a client's security review will find."
