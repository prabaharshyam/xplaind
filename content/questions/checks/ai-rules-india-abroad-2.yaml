id: ai-rules-india-abroad-2
stop_id: ai-rules-india-abroad
stem: "In November 2026, Ravi's bank rejects his loan application through its app in seconds, with no reason. Which request is backed by a rule in force today?"
options:
  - { id: a, text: "Written reasons for the rejection, under RBI rules for banks" }
  - { id: b, text: "A human review of the decision, under the DPDP Act" }
  - { id: c, text: "An explanation of the AI model, under the AI Governance Guidelines" }
  - { id: d, text: "Erasure of his data under the DPDP Act, within one week" }
correct: a
explanation: "RBI's fair practices code requires banks to give the main reasons for a rejection in writing. The DPDP Act gives no right to human review of automated decisions, and its main rights start only in May 2027."
