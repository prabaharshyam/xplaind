id: harness-engineering-2
stop_id: harness-engineering
stem: "A coding agent often says a task is done while tests still fail. Which harness change targets this directly?"
options:
  - { id: a, text: "Raise the temperature so it tries more ideas" }
  - { id: b, text: "Add more tools for it to choose from" }
  - { id: c, text: "A verification gate: run tests and lint on 'done' and feed failures back into the loop" }
  - { id: d, text: "Ask it in the prompt to be more careful" }
correct: c
explanation: "Back-pressure from automatic checks stops the agent from marking work finished until the checks pass. A prompt request is not enforced."
