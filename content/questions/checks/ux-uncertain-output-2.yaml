id: ux-uncertain-output-2
stop_id: ux-uncertain-output
stem: "Six weeks after launch, a Hyderabad insurer's agent copilot shows: 97% of answers accepted, citations opened on 2% of claim-amount answers, and wrong-answer reports falling each week. The manager says trust is well calibrated. What is the best reading?"
options:
  - { id: a, text: "Trust is calibrated, since high acceptance and few reports mean the answers are right" }
  - { id: b, text: "Reports are falling, so the amount flags can be removed to cut friction for agents" }
  - { id: c, text: "Possible over-trust: hand-audit a random sample before calling it accuracy" }
  - { id: d, text: "Survey the agents on how much they trust the tool and act on that score" }
correct: c
explanation: "A very high accept rate with almost no citation opens on high-stakes answers is the pattern of rubber-stamping, and falling reports can mean people stopped reporting. Acceptance is not accuracy, so only an expert audit of real answers shows whether this trust is deserved."
