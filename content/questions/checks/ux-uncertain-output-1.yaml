id: ux-uncertain-output-1
stop_id: ux-uncertain-output
stem: "A Pune fintech's support assistant answers questions about loan fees from the company's fee schedule. The team wants a 'Please check this' flag on doubtful answers. Which trigger gives the most trustworthy flag?"
options:
  - { id: a, text: "Flag answers whose fee amount is missing from the cited passage" }
  - { id: b, text: "Ask the model to rate its own confidence and flag answers it rates below 70" }
  - { id: c, text: "Show the retrieval similarity score as a percentage beside every answer" }
  - { id: d, text: "Skip flags and add an 'AI can make mistakes' footer under every answer" }
correct: a
explanation: "A computed check, such as whether the cited passage contains the stated amount, catches invented or wrong numbers and tells the user exactly what to check. Self-rated confidence is tempting but models tend to be overconfident, so it flags little; raw percentages and generic footers give users nothing to act on."
