id: cicd-github-actions-2
stop_id: cicd-github-actions
stem: "Release 42 of a Chennai lender's loan assistant renamed the loan_amt column to loan_amount in one migration. Production slows down, the team redeploys release 41's image, and it crashes on start. What should they have done?"
options:
  - { id: a, text: "Add loan_amount, write both, drop loan_amt in a later release" }
  - { id: b, text: "Rebuild release 41 from its commit instead of reusing its image" }
  - { id: c, text: "Run the migration after the deploy so the old image still starts" }
  - { id: d, text: "Run the down migration automatically whenever the app rolls back" }
correct: a
explanation: "Rolling back the app does not roll back the schema, so each release must work with both the old and the new schema: expand first, contract later. An automatic down migration is tempting, but it can lose data written since the release and turns a quick rollback into a risky database change."
