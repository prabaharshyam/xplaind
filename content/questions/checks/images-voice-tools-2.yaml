id: images-voice-tools-2
stop_id: images-voice-tools
stem: "A travel agency in Jaipur makes an AI video of a realistic customer praising a Rajasthan tour package, with a stock AI voice. No real person appears. They plan to post it as an Instagram reel. What is the right approach?"
options:
  - { id: a, text: "Declare it as AI-made at upload and do not call the speaker a real customer" }
  - { id: b, text: "Skip the label, because the voice is a stock voice and not a clone of anyone" }
  - { id: c, text: "Add #AI to the caption, but tell viewers the speaker is a real past customer" }
  - { id: d, text: "Post it unlabelled, as long as the video tool's terms allow commercial use" }
correct: a
explanation: "Since 20 February 2026, India's IT Rules require AI-made video that appears real to be labelled, and large social media platforms such as Instagram must ask users to declare it; a fake customer testimonial also misleads buyers. A stock voice avoids a consent problem but not the labelling duty, and an AI tag does not make a fake testimonial honest."
