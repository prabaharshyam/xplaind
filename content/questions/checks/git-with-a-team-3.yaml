stem: "During a merge, Git shows conflict markers in a file. What is the right way to resolve it?"
options:
  - { id: a, text: "Always keep your version" }
  - { id: b, text: "Always keep main's version" }
  - { id: c, text: "Edit the file to the correct combined result, remove the markers, run the tests, then commit" }
  - { id: d, text: "Delete the file" }
correct: c
explanation: "A conflict needs judgement: the right result often combines both changes, and tests confirm it."
