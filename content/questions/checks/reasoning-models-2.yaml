stem: "A Pune team moves its prompt to a reasoning model. The prompt still says 'Think step by step and write out all your reasoning before the answer.' The bill has tripled, replies are long, and accuracy is no better. What should they change first?"
options:
  - { id: a, text: "Remove the step-by-step line, then tune effort" }
  - { id: b, text: "Add more worked examples so it reasons better" }
  - { id: c, text: "Raise the output limit so all the reasoning fits" }
  - { id: d, text: "Turn on streaming so the long replies feel faster" }
correct: a
explanation: "A reasoning model already thinks before answering, so the instruction makes it write its reasoning again in the reply, paid as output on top of the hidden thinking. Effort is the control providers recommend. More examples or a higher limit only add tokens, and streaming hides the wait without cutting the cost."
