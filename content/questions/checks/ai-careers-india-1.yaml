id: ai-careers-india-1
stop_id: ai-careers-india
stem: "A bank's GCC in Hyderabad posts a \"Machine Learning Engineer\" job. The duties: put models that the data science team trains behind APIs on Kubernetes, monitor drift and latency, build CI/CD for model releases and cut GPU cost. Which role is this really?"
options:
  - { id: a, text: "ML engineer, since both the title and the word models point there" }
  - { id: b, text: "Data engineer, since the work is moving models into live systems" }
  - { id: c, text: "MLOps engineer, since the job is serving models others train" }
  - { id: d, text: "GenAI engineer, since GPU cost means it must serve language models" }
correct: c
explanation: "Serving, Kubernetes, drift monitoring, CI/CD and GPU cost are the signals of MLOps work, and another team trains the models. The title is the trap: an ML engineer post would centre on features, labelled data and training the model itself."
