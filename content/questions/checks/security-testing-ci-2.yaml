stem: "Which threshold setup is most sensible for a CI attack suite?"
options:
  - { id: a, text: "Zero allowed for tool misuse and canary leaks; a small agreed rate, such as 1%, for jailbreak text" }
  - { id: b, text: "A single 10% threshold for every category" }
  - { id: c, text: "No thresholds; a person reads every output" }
  - { id: d, text: "Fail the build only if every attack succeeds" }
correct: a
explanation: "Harmful actions and leaks must never pass. Some text-only categories cannot reach exactly zero because output is random, so they get a small, agreed allowance."
