stem: "A model has a perplexity of 4 on some text. What does that roughly mean?"
options:
  - { id: a, text: "It is right 4% of the time" }
  - { id: b, text: "It is as unsure as choosing between 4 equally likely next tokens" }
  - { id: c, text: "It makes 4 mistakes per sentence" }
  - { id: d, text: "It needs 4 seconds per token" }
correct: b
explanation: "Perplexity is the exponential of cross-entropy, roughly the number of equally likely choices the model weighs per token."
