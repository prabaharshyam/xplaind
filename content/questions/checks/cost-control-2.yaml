id: cost-control-2
stop_id: cost-control
stem: "A Mumbai insurer's assistant puts a 10,000-token policy document at the start of every prompt and caches it with the 5-minute cache. By day, cache reads are high. At night, questions arrive about every 15 minutes, cache reads are zero and cache writes appear on every call. What is the best fix for the night traffic?"
options:
  - { id: a, text: "Use the 1-hour cache at night: one write at 2x, then cheap reads" }
  - { id: b, text: "Cache only the user's question, since that part changes on each call" }
  - { id: c, text: "Add the current time at the top so the cache knows when to refresh" }
  - { id: d, text: "Split the document into small chunks so each fits the cache lifetime" }
correct: a
explanation: "With 15-minute gaps the 5-minute cache expires every time, so each call pays a write at 1.25 times input, more than no cache at all. A 1-hour write costs 2 times input, and each read within the hour refreshes it, so it pays off after two reads. A timestamp at the top would change the prefix on every call and stop all cache hits."
