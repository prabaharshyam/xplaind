stem: "What counts towards a model's context window in a chat app?"
options:
  - { id: a, text: "Only the latest user message" }
  - { id: b, text: "The system prompt, the conversation so far and the model's reply" }
  - { id: c, text: "Only the model's reply" }
  - { id: d, text: "Only files you upload" }
correct: b
explanation: "Everything the model reads and writes in one request shares the same window."
