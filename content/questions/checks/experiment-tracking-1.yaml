id: experiment-tracking-1
stop_id: experiment-tracking
stem: "Shreya at a Pune lending startup reruns last week's training run. MLflow shows the same Git commit (clean tree), the same parameters with random_state=42, the same library versions and the same data_version tag \"loans-2026-10\". But the data_sha256 tag differs, and PR AUC is 0.47 instead of 0.52. What is the most likely cause, and the fix?"
options:
  - { id: a, text: "Training stays random even with a seed, so log the average of several reruns instead" }
  - { id: b, text: "The commit tag misses notebook state, so tag each run with the notebook's file name too" }
  - { id: c, text: "The file behind the label changed, so keep read-only snapshots with new version ids" }
  - { id: d, text: "PR AUC is unstable on small data, so compare the two runs on plain accuracy instead" }
correct: c
explanation: "A different hash under the same label means the data itself changed, and code, parameters, seed and environment all match, so the data is the remaining difference. Seed randomness is the tempting answer, but a fixed seed with identical data and libraries gives the same model; the hash says the inputs were not identical."
