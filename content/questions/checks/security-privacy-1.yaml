stop_id: security-privacy
stem: "A Mumbai insurer's internal assistant searches one shared index of company documents. A sales executive asks about bonus rules and gets a summary of an HR file listing named employees' salaries. Which fix stops this from happening again?"
options:
  - { id: a, text: "Add a line to the system prompt telling the model never to reveal HR or salary documents" }
  - { id: b, text: "Add an output guardrail that blocks any reply containing salary figures or employee names" }
  - { id: c, text: "Record who may read each document and filter search results by user before the prompt" }
  - { id: d, text: "Switch to a larger model that follows confidentiality instructions more reliably" }
correct: c
explanation: "The leak happened at retrieval: the HR file should never have reached the prompt, so the filter belongs in the search, enforced by code. A prompt instruction or a stronger model only asks the model to keep a secret it has already been shown, and rephrased questions get around that."
