id: project-tooling-1
stop_id: project-tooling
stem: "Priya's project in Chennai keeps its package in src/invoice_extractor. Tests pass on her laptop, but in a fresh CI job that runs pip install pytest pydantic and then pytest, every test file fails with ModuleNotFoundError: No module named 'invoice_extractor'. What is the most likely cause?"
options:
  - { id: a, text: "The tests folder has no __init__.py file, so pytest cannot see the package" }
  - { id: b, text: "The lock file is out of date, so CI installed different package versions" }
  - { id: c, text: "The package is never installed in CI, and src keeps it off the path" }
  - { id: d, text: "CI runs pytest from another folder, so testpaths must be an absolute path" }
correct: c
explanation: "With a src layout, tests can import the package only after it is installed; uv sync or pip install -e . does that, and her laptop already had it installed. A stale lock changes versions, but it cannot make your own package vanish."
