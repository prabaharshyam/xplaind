id: batching-model-tiering-2
stop_id: batching-model-tiering
stem: "A Chennai insurer extracts claim forms. A small model costs one tenth as much per form as the large one, and 40% of its outputs fail the validator and go to the large model. Per form, what does the cascade cost?"
options:
  - { id: a, text: "0.5 of the large model, so it is cheaper if quality holds" }
  - { id: b, text: "0.46 of the large model, since only 60% of forms use the small one" }
  - { id: c, text: "0.1 of the large model, since most forms stay on the small one" }
  - { id: d, text: "More than the large model, because 40% of forms are run twice" }
correct: a
explanation: "Every form pays for the small call (0.1) and 40% also pay for the large call (0.4), so the total is 0.5. The tempting 0.46 forgets that escalated forms already paid for the small call."
