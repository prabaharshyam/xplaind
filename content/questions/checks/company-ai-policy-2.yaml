stop_id: company-ai-policy
stem: "Arjun, an analyst at a Gurugram insurer, pastes a sheet with 300 customers' names and mobile numbers into his personal chatbot account by mistake. What should he do first?"
options:
  - { id: a, text: "Report it to IT security now with the facts, then delete the chat" }
  - { id: b, text: "Delete the chat straight away; once it is gone there is nothing left to report" }
  - { id: c, text: "Ask the chatbot to forget the data and not use it for training, then carry on" }
  - { id: d, text: "Wait a few days to see whether any customer complains before telling anyone" }
correct: a
explanation: "Security needs the facts quickly, because the company may have to report some incidents to CERT-In within 6 hours. Deleting the chat is tempting, but the service may still keep a copy, and hiding the mistake makes it worse."
