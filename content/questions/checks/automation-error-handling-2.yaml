id: automation-error-handling-2
stop_id: automation-error-handling
stem: "A nightly sync in Chennai updates 400 customer records in a CRM by customer id, so repeating an update is safe. 399 go through. One record gets HTTP 500 on every one of its four retries, and its address field has 900 characters. What should the workflow do?"
options:
  - { id: a, text: "Send that record to needs attention with the reason, and carry on" }
  - { id: b, text: "Keep retrying it with longer waits, because 5xx errors are temporary" }
  - { id: c, text: "Stop the whole run and alert the owner that the CRM is down" }
  - { id: d, text: "Skip the record and finish the run, since 399 out of 400 is fine" }
correct: a
explanation: "When one record fails every time while the others succeed, the problem is that record, even with a 500 code, so more retries will not help. Stopping the run is for failures that hit every record, which this is not."
drafted_with_ai: true
