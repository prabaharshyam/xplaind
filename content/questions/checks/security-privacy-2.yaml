id: security-privacy-2
stop_id: security-privacy
stem: "A Chennai lending app's chat endpoint receives a JSON body with customer_id: 1043 and the message. A tester changes it to 1044 and the bot describes another customer's loan. What should the server do?"
options:
  - { id: a, text: "Ignore the id in the body and use the customer id from the verified session token" }
  - { id: b, text: "Encrypt the customer_id field in the browser so that testers cannot read or edit it" }
  - { id: c, text: "Check that customer 1044 exists in the database before passing the id to the model" }
  - { id: d, text: "Tell the model in the system prompt to answer only about the customer who is asking" }
correct: a
explanation: "Identity must come from something the user cannot change, such as a verified session, and every lookup should use that id. Encrypting the field is tempting, but the browser still holds what it sends, so an attacker can replay or swap another value."
