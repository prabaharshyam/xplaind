id: context-engineering-1
stop_id: context-engineering
stem: "An agent's long task fails after 40 steps because the context is full of old search results. What helps most?"
options:
  - { id: a, text: "A larger context window" }
  - { id: b, text: "Clearing or summarising old tool results once used, and compacting history when near the limit" }
  - { id: c, text: "Raising the temperature" }
  - { id: d, text: "Adding more tools" }
correct: b
explanation: "Old results are dead weight. Clearing and compaction keep the window focused on the current step."
