id: ai-and-jobs-1
stop_id: ai-and-jobs
stem: "Farhan is an HR executive at a global capability centre in Pune. His week: 40% handling employee grievances, 25% running in-person onboarding sessions, 20% answering routine leave and travel-claim questions from a written handbook, and 15% preparing offer letters from approved templates. His manager asks which task he should hand to an AI assistant first. What is the best answer?"
options:
  - { id: a, text: "Grievances, because they take the most hours, so handing them over saves the most time" }
  - { id: b, text: "Offer letters, because a fixed template means the AI can send them with no one checking" }
  - { id: c, text: "The handbook questions, because they come up daily, follow rules and are easy to check" }
  - { id: d, text: "None yet, because he should wait until AI can do all four tasks reliably on its own" }
correct: c
explanation: "Start with a task that is frequent, routine, easy to check and cheap to get wrong, and handbook questions fit all four. Grievances take the most time but need trust and judgement, so the biggest task is not the best first one; and a template never removes the need to check a costly document like an offer letter."
