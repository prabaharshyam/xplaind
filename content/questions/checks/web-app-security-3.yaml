id: web-app-security-3
stop_id: web-app-security
stem: "Product reviews are shown on a page exactly as customers typed them, and one review's script runs in visitors' browsers. What is the main fix?"
options:
  - { id: a, text: "Encode each review for HTML when it is shown, and add a Content Security Policy" }
  - { id: b, text: "Require customers to sign in before reviewing" }
  - { id: c, text: "Store reviews in a separate database" }
  - { id: d, text: "Use HTTPS for the reviews page" }
correct: a
explanation: "This is stored XSS. Context-aware output encoding stops the browser running the text as code; a CSP is a second layer. Sign-in, separate storage and HTTPS do not stop it."
