id: errors-retries-cost-1
stop_id: errors-retries-cost
stem: "Your app gets a 429 rate limit error. What is the best response?"
options:
  - { id: a, text: "Retry immediately in a tight loop" }
  - { id: b, text: "Wait, then retry with a growing delay (exponential backoff)" }
  - { id: c, text: "Change the prompt" }
  - { id: d, text: "Give up and show the user a blank page" }
correct: b
explanation: "Backing off gives the limit time to reset. Hammering the API makes it worse."
