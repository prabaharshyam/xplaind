stem: "Why keep cancel_trip separate from get_trip?"
options:
  - { id: a, text: "Models cannot call tools with two purposes" }
  - { id: b, text: "So actions that change things can require approval and be logged separately from reads" }
  - { id: c, text: "It makes the schema shorter" }
  - { id: d, text: "Read tools are slower" }
correct: b
explanation: "Separating reads from writes lets you put controls only where risk is."
