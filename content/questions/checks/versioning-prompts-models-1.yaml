id: versioning-prompts-models-1
stop_id: versioning-prompts-models
stem: "A Jaipur insurer's claims assistant got worse on Tuesday. On Monday three things changed: a prompt edit, the gateway name 'chat-default' moving to a newer model, and an index rebuild with a new chunk size. Traces record only 'chat-default', but the panel keeps prompt history and the gateway logs the model id. What is the best first step?"
options:
  - { id: a, text: "Undo the prompt edit first, because prompt changes cause most quality drops" }
  - { id: b, text: "Ask the provider whether the new model is worse, and wait before changing anything" }
  - { id: c, text: "Restore all three to the last good state, then bring back one change at a time" }
  - { id: d, text: "Rebuild the index with the old chunk size and leave the new model and prompt live" }
correct: c
explanation: "With three unversioned changes and traces that record only a moving name, nobody can tell which change caused the drop, so restore the last good combination and reintroduce changes one at a time through the golden set. Undoing only the prompt is a guess: the model or index may be the cause."
