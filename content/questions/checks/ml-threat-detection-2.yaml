stop_id: ml-threat-detection
stem: "An anomaly model flags an employee's genuine login during a trip to Delhi on a new phone. What is the best way to reduce alerts like this without missing attackers?"
options:
  - { id: a, text: "Turn the model off and rely on users to report problems" }
  - { id: b, text: "Combine signals and add context, such as approved travel and failed attempts, before alerting" }
  - { id: c, text: "Lower the threshold so the model flags more logins" }
  - { id: d, text: "Remove the distance feature entirely" }
correct: b
explanation: "Unusual is not the same as malicious. Requiring an anomaly plus a strong signal, and suppressing known context such as approved travel, raises precision while keeping the features that catch real attacks."
