id: quality-cost-speed-2
stop_id: quality-cost-speed
stem: "A Chennai edtech compares two models for its tutor bot on the same 150 questions. Model X scores 86% and Model Y 88%, and Y costs twice as much. Y got 9 questions right that X missed; X got 6 right that Y missed. The manager wants to switch to Y. What is the best response?"
options:
  - { id: a, text: "Switch to Y, since two points of accuracy matter for students" }
  - { id: b, text: "Rerun both models on the same 150 questions until the gap holds" }
  - { id: c, text: "Keep X, since the 9 and 6 flips show that Y is less consistent" }
  - { id: d, text: "Treat it as a tie and keep X unless more questions show a gap" }
correct: d
explanation: "The net gap is 3 questions, well under 2 times the square root of 15 (about 8), so the results are a tie and the cheaper model wins. Rerunning the same 150 questions measures run-to-run noise but adds no new evidence about which model is better."
