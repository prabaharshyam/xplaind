stop_id: executive-communication
stem: "A pilot at a Kochi bank aimed to answer 60% of customer chats without an agent but reached 41%, though wrong answers fell sharply. How should your update to the COO open?"
options:
  - { id: a, text: "With the drop in wrong answers, then the missed target near the end" }
  - { id: b, text: "With a request for six more weeks, leaving the choice of next step to the COO" }
  - { id: c, text: "With nothing yet: wait until the 60% target is reached, then report" }
  - { id: d, text: "With the missed target, then options with costs and the one you recommend" }
correct: d
explanation: "Bad news goes in the first line, followed by options and a clear recommendation. Opening with the good news feels kinder, but the COO reads the miss as hidden, and every later number in your update loses credibility."
