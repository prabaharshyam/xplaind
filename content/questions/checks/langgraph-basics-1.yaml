id: langgraph-basics-1
stop_id: langgraph-basics
stem: "A Bengaluru lending app uses LangGraph for refunds. The approve_refund node first sends the customer an SMS, \"Your refund is under review\", then calls interrupt() with the refund details. The dashboard sends exactly one Command(resume=...) when the manager approves, yet every customer gets the SMS twice. What is the cause?"
options:
  - { id: a, text: "The node reruns from its top on resume, so the SMS before interrupt() is sent again" }
  - { id: b, text: "Resuming replays the whole graph from START, so every earlier node sends its messages again" }
  - { id: c, text: "The checkpointer lost the pause, so LangGraph restarted the refund as a brand new run" }
  - { id: d, text: "The add_messages reducer appended the SMS twice, once before and once after the pause" }
correct: a
explanation: "On resume LangGraph reruns only the interrupted node, from its first line, and interrupt() then returns the decision, so anything before it happens twice. It does not replay earlier nodes; move the SMS to a later node and give it an idempotency key."
