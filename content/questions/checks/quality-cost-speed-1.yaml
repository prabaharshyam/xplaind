stem: "A Bengaluru fintech tests four support-bot options on the same 500 held-out questions. A: 80%, ₹0.10 per request, 1.8 s p95. B: 85%, ₹0.35, 3.1 s. C: 90%, ₹0.55, 4.0 s. D: 88%, ₹0.30, 2.4 s. Which option can be dropped before the product owner sees the table?"
options:
  - { id: a, text: "A, because it is the least accurate of the four options" }
  - { id: b, text: "C, because it is both the most expensive and the slowest" }
  - { id: c, text: "B, because D is at least as accurate and cheaper and faster" }
  - { id: d, text: "None, because each option is the best on at least one measure" }
correct: c
explanation: "B is dominated: D is at least as accurate and beats it on cost and speed, so nobody should pick B. A is the cheapest and fastest, C is the most accurate and D sits between them, so all three stay on the frontier and the business chooses among them."
