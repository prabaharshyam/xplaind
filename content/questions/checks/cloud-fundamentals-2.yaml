id: cloud-fundamentals-2
stop_id: cloud-fundamentals
stem: "A Chennai insurer's Container App uses a managed identity that has the Contributor role on the storage account. Reading a claim PDF from the claims container fails with a 403 error. What is the right fix?"
options:
  - { id: a, text: "Give it Storage Blob Data Reader on the claims container only" }
  - { id: b, text: "Give the identity Owner on the subscription so nothing is blocked" }
  - { id: c, text: "Put the storage account key in Key Vault and read blobs with it" }
  - { id: d, text: "Allow public read on the container, since its URL is hard to guess" }
correct: a
explanation: "Contributor manages the storage account but grants no data access, so the identity cannot read blobs with its own token. The account key would work, but it brings back a long-lived secret that opens every container; a data role on one container is least privilege."
