stem: "A chat assistant writes a report section for you and it has a wrong figure. Who is responsible if you send it to your manager?"
options:
  - { id: a, text: "You, because you sent it" }
  - { id: b, text: "The company that made the assistant" }
  - { id: c, text: "Nobody, because AI makes mistakes" }
  - { id: d, text: "Your manager, because they asked for the report" }
correct: a
explanation: "The assistant gives you a draft. Whoever sends it owns it, so check figures before you send."
