id: enterprise-connectors-3
stop_id: enterprise-connectors
stem: "An HR assistant in Bengaluru indexes SharePoint files. Priya is removed from the 'HR Leads' group, which can read salary files. No file changed. How should the system stop showing her those files?"
options:
  - { id: a, text: "Wait for the next delta run, which reports the change on each salary file" }
  - { id: b, text: "Re-index every file the group could read, with new expanded user lists" }
  - { id: c, text: "Rebuild the index tonight so her access is refreshed by morning" }
  - { id: d, text: "Store group ids on chunks and check her current groups at query time" }
correct: d
explanation: "Filtering by the user's current groups at query time removes her access as soon as her groups are looked up again, with no re-index. The delta run is the tempting answer, but a membership change does not touch the files, so delta may never report them."
