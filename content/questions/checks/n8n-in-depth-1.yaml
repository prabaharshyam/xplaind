id: n8n-in-depth-1
stop_id: n8n-in-depth
stem: "A coaching institute in Kolkata runs a nightly n8n workflow that compares each Razorpay settlement row's credit with the course price in its sheet. Almost every payment is flagged 'amount differs', yet the bank balance looks right. What is the best fix?"
options:
  - { id: a, text: "Add 18% GST to each course price in the sheet before comparing it with the credit" }
  - { id: b, text: "Switch the Merge node to combine by position, since both lists are in date order" }
  - { id: c, text: "Compare the gross amount with the price in paise; check the gateway fee alone" }
  - { id: d, text: "Widen the window to three days of settlements, because payouts arrive later" }
correct: c
explanation: "The credit is the payment minus the gateway fee, so it never equals the course price; compare the gross amount, in paise, and check the gateway fee on its own. Adding GST to the course price is wrong because GST is charged on the gateway's fee, not on the payment. A wider window fixes missing settlements, not wrong amounts."
