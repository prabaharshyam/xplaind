id: ai-risk-frameworks-3
stop_id: ai-risk-frameworks
stem: "A Chennai team tests its shortlisting model on 400 labelled candidates. Gender and college names are not model inputs. By college tier, rates are 30% and 28% (ratio 0.93). Split by tier and gender, tier-3 women (60 candidates) are shortlisted at 22%, against a top rate of 31%. What should the team conclude?"
options:
  - { id: a, text: "The model is fair, because the tier-level ratio of 0.93 is above four-fifths" }
  - { id: b, text: "The model breaks EU law, because any ratio under 0.8 is illegal discrimination" }
  - { id: c, text: "Nothing to fix, because gender and college names are not inputs to the model" }
  - { id: d, text: "Investigate: 0.71 is below four-fifths, but 60 cases is a small sample" }
correct: d
explanation: "22% divided by 31% is about 0.71, below four-fifths for one combination of groups, so it is a warning to investigate with more cases and a proxy check. It is not proof of illegal bias: the four-fifths rule is a US rule of thumb, not an EU or Indian legal test. Fair results for each attribute alone can hide an unfair intersection."
