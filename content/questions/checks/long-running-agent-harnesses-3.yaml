stem: "An overnight agent run crashes at hour four. With a good harness, what happens on restart?"
options:
  - { id: a, text: "It starts again from the first feature" }
  - { id: b, text: "It asks the model to remember what it did" }
  - { id: c, text: "It reads the saved state, skips features already passing, and continues from the next one" }
  - { id: d, text: "It marks every feature as passing to save time" }
correct: c
explanation: "Durable execution saves state after each finished step, so a restart resumes from the last checkpoint instead of starting over."
