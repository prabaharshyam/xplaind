id: latency-load-testing-3
stop_id: latency-load-testing
stem: "A Hyderabad ticketing firm load-tests its help assistant before an IPL ticket sale opens at noon. Its Locust test runs 1,000 users with 20 seconds of think time. When the backend slowed during the test, the request rate fell, no queue built and the team called the test a pass. Last season, arrivals tripled in the first minute of the sale. What should change?"
options:
  - { id: a, text: "Remove the think time so that each simulated user sends requests nonstop" }
  - { id: b, text: "Run the same 1,000-user test against the real model instead of the fake" }
  - { id: c, text: "Double the users to 2,000 with the same think time, as a safety margin" }
  - { id: d, text: "Add a test that sends the sale's arrival rate, whatever the replies do" }
correct: d
explanation: "Locust users wait for each reply, so a slow system receives fewer requests and the queue a real rush builds never appears. Removing think time is tempting, but it is still a closed test that backs off when replies slow; only a fixed arrival rate with a burst shows the queue."
