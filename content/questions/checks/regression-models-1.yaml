stem: "A Pune used-car platform offers to buy back any car it priced if the price was off by more than ₹1 lakh. On the latest month, Model A has MAE ₹30,000 and RMSE ₹90,000. Model B has MAE ₹34,000 and RMSE ₹50,000. Which should it ship?"
options:
  - { id: a, text: "Model A, because a lower MAE always means a better model" }
  - { id: b, text: "Model A, because RMSE is always higher than MAE anyway" }
  - { id: c, text: "Model B, because an RMSE near its MAE means few huge misses" }
  - { id: d, text: "Neither, because only R² can settle a choice between two models" }
correct: c
explanation: "Big misses trigger costly buy-backs, and RMSE punishes big misses. Model A's RMSE is three times its MAE, a sign of a few very large errors, so its lower MAE is the tempting but wrong reason to pick it."
