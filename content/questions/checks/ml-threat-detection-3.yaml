stem: "A phishing classifier scored very well in testing but its catch rate has fallen over six months. What is the most likely cause, and the fix?"
options:
  - { id: a, text: "Concept drift: attackers changed their emails; retrain on recent labelled data and monitor recall" }
  - { id: b, text: "The server is too slow; buy more CPUs" }
  - { id: c, text: "The model was too accurate; make it smaller" }
  - { id: d, text: "Users stopped reading email; nothing to fix" }
correct: a
explanation: "Attackers adapt, so what the model learned stops matching new campaigns. Retrain on recent verdicts, test on later months, and track precision and recall over time."
