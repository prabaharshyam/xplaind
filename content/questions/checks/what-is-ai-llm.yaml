id: what-is-ai-llm
stop_id: what-is-ai
stem: Which statement best describes a large language model?
options:
  - { id: a, text: A program that looks facts up in a database and returns them word for word }
  - { id: b, text: "A model trained on a very large amount of text to predict what comes next, which lets it write answers" }
  - { id: c, text: A search engine that ranks web pages }
  - { id: d, text: A set of rules that programmers wrote for every possible question }
correct: b
explanation: A language model learns patterns from a huge amount of text and predicts the next piece of text. That is how it produces answers. It does not look facts up, and nobody wrote a rule for each question.
