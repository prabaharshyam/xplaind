id: webhooks-basics-2
stop_id: webhooks-basics
stem: "A developer in Bengaluru verifies Razorpay webhooks in n8n with the correct webhook secret. Every genuine event fails the check. The workflow parses the JSON, turns it back into text with JSON.stringify, and computes the HMAC-SHA256 of that text. What is wrong?"
options:
  - { id: a, text: "It hashes re-serialised JSON, not the exact raw bytes the gateway sent" }
  - { id: b, text: "The secret must be Base64-encoded before it is used as the HMAC key" }
  - { id: c, text: "A tunnel rewrites the HTTPS request, so signatures only match on a server" }
  - { id: d, text: "The signature header must be parsed as JSON before it is compared" }
correct: a
explanation: "The signature covers the exact bytes posted, and re-serialising JSON can change spaces or key order, so a genuine event no longer matches. Turn on Raw Body and hash that. A tunnel forwards the body unchanged, so it is not the cause."
