stop_id: gpus-quantization
stem: "A Lucknow edtech answers student questions in Hindi and English. A 4-bit version of its model scores only 0.4 points below 16-bit on a public English benchmark. What should the team do before switching?"
options:
  - { id: a, text: "Switch now, since a 0.4-point average drop means quality holds for everyone" }
  - { id: b, text: "Check perplexity on English Wikipedia, the standard test for quantized models" }
  - { id: c, text: "Skip testing if the maker published the 4-bit checkpoint, as they tested it" }
  - { id: d, text: "Score both on its own golden set, split by language and task, before switching" }
correct: d
explanation: "Quantization often costs more in maths, long reasoning and less common languages than an English average shows, so each Hindi and English slice of the team's own set must hold. A small benchmark drop is tempting evidence, but it says nothing about Hindi answers."
