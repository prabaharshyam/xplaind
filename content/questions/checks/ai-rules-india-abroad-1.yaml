id: ai-rules-india-abroad-1
stop_id: ai-rules-india-abroad
stem: "A Pune start-up sells an AI tool that ranks job applicants' CVs. A retailer in Germany wants to use it from 2027. Under the EU AI Act, as of November 2026, what applies?"
options:
  - { id: a, text: "Limited risk: it only needs to tell applicants that AI is used" }
  - { id: b, text: "Nothing, because the start-up is based in India, not the EU" }
  - { id: c, text: "High risk, with duties from 2 December 2027 after the delay" }
  - { id: d, text: "Banned, because the Act forbids AI that scores people" }
correct: c
explanation: "Ranking job applicants is a high-risk use, and the Digital Omnibus moved those duties to 2 December 2027. The Act reaches the start-up because its system is used in the EU, wherever the company is based."
