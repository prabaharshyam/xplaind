stem: "A small automation agency in Coimbatore plans to run one n8n server and sell each client a login to build their own workflows on it, for ₹4,000 a month. Under n8n's Sustainable Use License, what is the correct advice?"
options:
  - { id: a, text: "It is fine, because n8n is open source and free for any commercial use" }
  - { id: b, text: "It is fine, as long as the server is hosted in India for data rules" }
  - { id: c, text: "It is not allowed: agencies cannot build n8n workflows for paying clients" }
  - { id: d, text: "It needs a deal with n8n; building clients' workflows is fine" }
correct: d
explanation: "The licence lets the agency use n8n for its own business and build workflows for paying clients, but hosting n8n so clients log in and use it, for a fee, needs a commercial agreement with n8n. The tempting answer calls n8n open source; it is source-available, and where the server sits does not change the licence."
