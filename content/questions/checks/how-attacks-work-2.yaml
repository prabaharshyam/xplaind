stop_id: how-attacks-work
stem: "Which statement correctly separates a vulnerability, an exploit and a CVE?"
options:
  - { id: a, text: "A CVE is a type of malware that uses an exploit" }
  - { id: b, text: "An exploit is a weakness; a vulnerability is the code that attacks it" }
  - { id: c, text: "A vulnerability is a weakness, an exploit uses it, and a CVE is a public ID for a known vulnerability" }
  - { id: d, text: "They are three names for the same thing" }
correct: c
explanation: "The weakness is the vulnerability, the code or technique that uses it is the exploit, and the CVE is the shared public identifier."
