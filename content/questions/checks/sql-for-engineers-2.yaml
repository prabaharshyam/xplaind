id: sql-for-engineers-2
stop_id: sql-for-engineers
stem: "You want each customer's first ticket while keeping all ticket columns. What fits best?"
options:
  - { id: a, text: "GROUP BY customer_id" }
  - { id: b, text: "ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY created_at) and keep row 1" }
  - { id: c, text: "ORDER BY created_at LIMIT 1" }
  - { id: d, text: "DISTINCT customer_id" }
correct: b
explanation: "A window function numbers rows within each customer without collapsing them, so you can keep the first full row."
