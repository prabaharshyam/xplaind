id: incident-response-basics-1
stop_id: incident-response-basics
stem: "Under CERT-In's directions of 28 April 2022, how quickly must a covered organisation report an incident type listed in Annexure I?"
options:
  - { id: a, text: "Within 72 hours of finishing the investigation" }
  - { id: b, text: "Within 6 hours of noticing the incident or being brought to notice of it" }
  - { id: c, text: "Within 30 days, in the annual report" }
  - { id: d, text: "Only if customer data was sold online" }
correct: b
explanation: "The directions, issued under section 70B(6) of the IT Act, set a 6-hour window counted from when the incident is noticed, not from when the investigation ends."
