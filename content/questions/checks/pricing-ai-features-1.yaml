id: pricing-ai-features-1
stop_id: pricing-ai-features
stem: "Suppose a Chennai legal-tech app charges ₹1,499 a month (before GST), which includes 300 AI contract reviews. Extra reviews come in packs of 200 for ₹249. Each review costs ₹1.20, thinking tokens and retries included. A law firm runs 1,100 reviews in a month. How much is left after AI cost from this firm?"
options:
  - { id: a, text: "₹1,673, because it buys 6 packs for its 1,100 reviews" }
  - { id: b, text: "₹1,535, since only the 800 extra reviews cost anything" }
  - { id: c, text: "₹1,175: it pays ₹2,495 and its reviews cost ₹1,320" }
  - { id: d, text: "₹179, since the ₹1,499 plan must cover all ₹1,320 of cost" }
correct: c
explanation: "The firm needs 800 extra reviews, so 4 packs: ₹1,499 + ₹996 = ₹2,495, and all 1,100 reviews cost money, ₹1,320. The tempting slip is costing only the extra reviews: included usage is free to the customer, not to you."
