id: llm-gateways-3
stop_id: llm-gateways
stem: "A Bengaluru fintech's dashboards show zero chatbot errors for three weeks. But the monthly bill rose and answers got a little worse. Gateway headers show x-litellm-model-group: chat-backup on most requests. What most likely happened?"
options:
  - { id: a, text: "The backup model is slower, so the gateway's timeout is cutting answers short" }
  - { id: b, text: "Prompt caching was switched off on the primary, so costs went up for every call" }
  - { id: c, text: "The gateway's cool-down is too short, so it keeps retrying the primary model" }
  - { id: d, text: "The primary's key broke, so every request falls back and no error ever shows" }
correct: d
explanation: "A wrong or expired primary key makes every request fall back, and users see no error, which matches the chat-backup header on most requests. Lost caching would raise cost but would not move traffic to the backup alias. The fix is to alert on the fallback rate, not only on errors."
