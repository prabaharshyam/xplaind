stem: "You accidentally committed an API key and pushed it. What must you do?"
options:
  - { id: a, text: "Delete the file in the next commit" }
  - { id: b, text: "Rotate (revoke and replace) the key immediately, then remove it from the code" }
  - { id: c, text: "Make the repository private" }
  - { id: d, text: "Nothing if nobody noticed" }
correct: b
explanation: "The key stays in Git history and may already be copied. Rotating it is the only safe fix."
