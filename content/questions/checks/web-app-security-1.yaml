id: web-app-security-1
stop_id: web-app-security
stem: "A developer writes: query = \"SELECT * FROM users WHERE email = '\" + email + \"'\". What is the best fix?"
options:
  - { id: a, text: "Strip single quotes from the email before joining" }
  - { id: b, text: "Use a parameterised query and pass the email as a bound value" }
  - { id: c, text: "Check the email with a regular expression in the browser" }
  - { id: d, text: "Hide database errors from users" }
correct: b
explanation: "Parameterised queries send SQL and data separately, so input can never change the query. Filtering, browser checks and hiding errors are weaker extras."
