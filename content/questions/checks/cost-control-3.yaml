id: cost-control-3
stop_id: cost-control
stem: "A Delhi startup extracts invoice fields. The large model costs ₹0.50 per invoice and is right 98% of the time. A small model costs ₹0.025 and is right 80% of the time. Every wrong invoice goes to a clerk, at ₹6 of staff time each. Which choice costs less per 1,000 invoices?"
options:
  - { id: a, text: "The small model, because it is 20 times cheaper on every call" }
  - { id: b, text: "The small model, re-sending each failure to it until the fields are right" }
  - { id: c, text: "The small model on the batch API, which halves its price again" }
  - { id: d, text: "The large model: about ₹620 against about ₹1,225 for the small one" }
correct: d
explanation: "Count cost per completed task: the large model costs ₹500 plus 20 clerk fixes at ₹6, about ₹620, while the small one costs ₹25 plus 200 fixes, about ₹1,225. Halving the small model's call price saves only ₹12.50 and leaves the clerk cost untouched, and retries repeat the same weakness."
