stop_id: cost-control
stem: "Why track cost per user rather than only the monthly total?"
options:
  - { id: a, text: "It is required by law" }
  - { id: b, text: "It shows whether the product can pay for itself as users grow" }
  - { id: c, text: "It makes the bill smaller" }
  - { id: d, text: "Providers only report per user" }
correct: b
explanation: "A feature is sustainable only if each user costs less than they bring in."
