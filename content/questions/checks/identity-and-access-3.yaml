id: identity-and-access-3
stop_id: identity-and-access
stem: "An AI assistant summarises customers' support tickets. Which access is the best least-privilege choice?"
options:
  - { id: a, text: "Its own identity with read-only access to the tickets of the customer being helped" }
  - { id: b, text: "The admin account of the engineer who built it" }
  - { id: c, text: "Full read and write access to the ticket database, to avoid errors" }
  - { id: d, text: "A shared service account used by all internal tools" }
correct: a
explanation: "Give each agent its own scoped, read-only identity limited to the data of the user it acts for, so a bug or prompt injection can reach little."
