id: web-apis-json-1
stop_id: web-apis-json
stem: "Meera in Kolkata calls a city air-quality API, and data = r.json() holds this:\n\n{\"city\": \"Kolkata\",\n \"stations\": [\n   {\"name\": \"Ballygunge\", \"pm25\": 148},\n   {\"name\": \"Victoria\", \"pm25\": 96}\n ]}\n\nWhich expression gives the PM2.5 value of the second station, 96?"
options:
  - { id: a, text: "data[\"stations\"][\"pm25\"][1]" }
  - { id: b, text: "data[\"stations\"][2][\"pm25\"]" }
  - { id: c, text: "data[\"stations\"][1][\"pm25\"]" }
  - { id: d, text: "data[1][\"stations\"][\"pm25\"]" }
correct: c
explanation: "stations is a list, so you pick an item by number, counting from 0, and then use the key pm25 on that dictionary. Option a uses a string key on a list, which raises TypeError: list indices must be integers or slices, not str."
drafted_with_ai: true
reviewed_by: "Shyam Prabahar"
