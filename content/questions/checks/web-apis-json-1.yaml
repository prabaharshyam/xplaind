stem: "A web API returns status code 404. What does it usually mean?"
options:
  - { id: a, text: "The request worked" }
  - { id: b, text: "The thing you asked for was not found" }
  - { id: c, text: "You are sending too many requests" }
  - { id: d, text: "The server is overloaded" }
correct: b
explanation: "404 means not found. 429 means too many requests, and 5xx codes mean a server problem."
