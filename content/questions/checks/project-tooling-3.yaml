id: project-tooling-3
stop_id: project-tooling
stem: "In a Bengaluru team's invoice extractor, a model call times out, the code retries, and the second attempt succeeds. How should this be logged in production?"
options:
  - { id: a, text: "ERROR, because a model call failed and someone should know" }
  - { id: b, text: "INFO, because the invoice was processed in the end" }
  - { id: c, text: "DEBUG, so routine retries stay out of production logs" }
  - { id: d, text: "WARNING, with the invoice id, attempt number and error" }
correct: d
explanation: "A retry is odd but handled, which is what WARNING is for, and the ids let someone spot a pattern of timeouts later. ERROR is tempting, but it should mean something failed and needs a person; nothing here does."
