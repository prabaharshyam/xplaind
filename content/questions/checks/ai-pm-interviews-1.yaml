id: ai-pm-interviews-1
stop_id: ai-pm-interviews
stem: "In a design round, you propose an AI doubt-solving assistant for a Class 10 learning app. The interviewer says the goal is fewer students quitting after a doubt goes unanswered. Which primary metric fits that goal best?"
options:
  - { id: a, text: "Deflection rate: share of doubts the AI answers without a human tutor" }
  - { id: b, text: "Correct-answer rate on a golden set of 300 labelled past student doubts" }
  - { id: c, text: "Share of students who raised a doubt and are still active 7 days later" }
  - { id: d, text: "Median time from a student asking a doubt to the first reply" }
correct: c
explanation: "The goal is about students staying, so the primary metric must measure staying. Deflection is the tempting choice, but it can rise while students get wrong or unhelpful answers and leave; it is a supporting metric, and the golden-set score and reply time support it too."
