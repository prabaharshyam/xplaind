id: model-privacy-attacks-1
stop_id: model-privacy-attacks
stem: "A competitor sends hundreds of thousands of queries to your pricing API and trains their own model on the answers. What is this attack?"
options:
  - { id: a, text: "Data poisoning" }
  - { id: b, text: "Membership inference" }
  - { id: c, text: "Model extraction" }
  - { id: d, text: "Prompt injection" }
correct: c
explanation: "Model extraction copies a model's behaviour from its inputs and outputs. Rate limits, coarse outputs and monitoring for sweeps make it slow and visible."
