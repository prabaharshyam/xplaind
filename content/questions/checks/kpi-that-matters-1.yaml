id: kpi-that-matters-1
stop_id: kpi-that-matters
stem: "An insurer in Pune pilots an AI assistant that drafts claim assessments. By week 8, median time per claim has dropped to the target, rework is flat, and the share of drafts accepted with no edits has climbed from 55% to 98% in the last two weeks. What should you do next?"
options:
  - { id: a, text: "Declare the target met, since the KPI and the rework guardrail are both on track now" }
  - { id: b, text: "Switch the KPI to model accuracy, which assessors cannot influence" }
  - { id: c, text: "Spot-check a sample of accepted drafts for missed errors before calling it met" }
  - { id: d, text: "Raise the target, because hitting it early shows it was set too low" }
correct: c
explanation: "A near-100% zero-edit share suggests assessors may be accepting drafts unread to hit the time target, and rework lags by a week or two, so it cannot show the effect yet. Declaring success now trusts a number that may have been gamed."
