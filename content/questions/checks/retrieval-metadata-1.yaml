stem: "An officer in Bhopal asks the orders assistant \"What did the 2019 order on transfers say?\" The order is indexed, but a 2022 order replaced it. The search returns nothing. Which filter is the most likely cause?"
options:
  - { id: a, text: "The language filter, because the 2019 order exists only in its Hindi copy" }
  - { id: b, text: "The top-k limit, because the 2019 order ranks just below the top five" }
  - { id: c, text: "A default in-force-today filter, which drops orders replaced since" }
  - { id: d, text: "The access filter, because older orders are usually marked internal" }
correct: c
explanation: "The question asks about the order issued in 2019, so it should filter on issue year and ignore whether the order is still in force; a default in-force-today filter removes it completely. A small top-k would still return other results, not nothing."
