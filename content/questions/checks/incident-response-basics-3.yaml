id: incident-response-basics-3
stop_id: incident-response-basics
stem: "Why should responders usually collect memory, disk images and logs before wiping and rebuilding a compromised server?"
options:
  - { id: a, text: "Because rebuilding servers is illegal in India" }
  - { id: b, text: "Because the SIEM stops working after a rebuild" }
  - { id: c, text: "Because the evidence shows how the attacker got in and what they took, which is needed to eradicate them and for reports" }
  - { id: d, text: "Because backups are always infected" }
correct: c
explanation: "Wiping first destroys the record of the attack. With the evidence, kept with a chain of custody, you can close the real entry point and support CERT-In, insurer and legal reports."
