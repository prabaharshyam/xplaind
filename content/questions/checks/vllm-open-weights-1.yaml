id: vllm-open-weights-1
stop_id: vllm-open-weights
stem: "A Pune fintech serves a 12B model at 4-bit on one 24 GB GPU. Weights take about 7 GB and runtime overhead about 3 GB. Its KV cache needs 0.16 MB per token, requests average 2,500 tokens, and --max-model-len is 8,192. About how many requests can run at once?"
options:
  - { id: a, text: "About 10, because each request needs room for 8,192 tokens" }
  - { id: b, text: "About 35, from the 14 GB left after weights and overhead" }
  - { id: c, text: "About 42, from the 17 GB left after the weights alone" }
  - { id: d, text: "About 52, because 4-bit weights barely use any memory" }
correct: b
explanation: "24 − 7 − 3 leaves 14 GB, which holds about 87,500 tokens, or about 35 requests of 2,500 tokens. PagedAttention allocates pages as requests grow, so you size on average length, not --max-model-len; the 10 answer reserves memory vLLM never reserves."
