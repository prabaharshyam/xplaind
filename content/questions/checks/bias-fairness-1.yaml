id: bias-fairness-1
stop_id: bias-fairness
stem: "An NBFC in Pune deletes the religion and caste fields from its personal-loan model and retrains it. Applicants with similar repayment records from some PIN codes are still approved far less often. What should the team do next?"
options:
  - { id: a, text: "Add more training data until overall accuracy rises above 95%, closing the gap" }
  - { id: b, text: "Accept the gap, because the model can no longer see any sensitive field" }
  - { id: c, text: "Check whether PIN code, surname and similar fields predict the deleted traits" }
  - { id: d, text: "Ask applicants for their caste so the model can correct for it directly" }
correct: c
explanation: "Deleting a field does not delete the information: PIN code, surname and similar features can act as proxies, so checking whether they predict the removed traits finds the cause. Accepting the gap is tempting, but the model is still learning the old pattern through those proxies."
