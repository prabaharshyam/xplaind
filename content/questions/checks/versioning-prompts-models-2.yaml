id: versioning-prompts-models-2
stop_id: versioning-prompts-models
stem: "A Chennai team's 120-case golden set gives the current release 85.0%. A new prompt scores 84.2% on one run, and the CI gate blocks any drop over half a point. What should the team do?"
options:
  - { id: a, text: "Rerun the unchanged release a few times and set the gate just above that spread" }
  - { id: b, text: "Keep the gate as it is, because any drop on the golden set is a real regression" }
  - { id: c, text: "Set temperature to 0 and run once more, because outputs are then fully repeatable" }
  - { id: d, text: "Drop the gate, since a 120-case golden set is too small to tell anything useful" }
correct: a
explanation: "On 120 cases one case is 0.83 points and scores move by chance, so measure the run-to-run spread and set the tolerance just above it, with no tolerance on critical categories. Temperature 0 does not make outputs fully deterministic, and some models no longer accept it."
