stem: "You need every customer, including those with no orders, with their order count. Which join?"
options:
  - { id: a, text: "INNER JOIN customers to orders" }
  - { id: b, text: "LEFT JOIN from customers to orders" }
  - { id: c, text: "CROSS JOIN" }
  - { id: d, text: "RIGHT JOIN from customers to orders" }
correct: b
explanation: "A left join keeps every customer and fills order columns with NULL where there is no match; COUNT(o.id) then gives 0 for them."
