id: llms-in-the-soc-1
stop_id: llms-in-the-soc
stem: "A copilot's alert summary lists an IP address to block. What should happen before anyone blocks it?"
options:
  - { id: a, text: "Nothing; the copilot is trained on threat intelligence" }
  - { id: b, text: "Check that the IP appears in the raw alert or a trusted threat-intel feed" }
  - { id: c, text: "Ask the copilot whether it is sure" }
  - { id: d, text: "Block it for one hour only" }
correct: b
explanation: "LLMs can write indicators that look right but are not in the evidence. Extract indicators from the source with code and compare; asking the model again does not verify anything."
