id: agent-failures-1
stop_id: agent-failures
stem: "A Pune insurance startup's claims agent pays approved claims with a pay_claim tool. Every call carries an idempotency key built as run id plus step number. The payment API timed out at step 4, the agent retried at step 5, and the customer was paid twice. What is the cause?"
options:
  - { id: a, text: "The payment API ignores idempotency keys on calls that time out" }
  - { id: b, text: "Write tools must never be retried, so the retry itself was the real bug" }
  - { id: c, text: "The retry ran at a new step, so it got a new key and a new payment" }
  - { id: d, text: "The key also needed the claim amount, since amounts can change" }
correct: c
explanation: "A key must describe what the action is, such as claim id plus action type, not when it was tried; the retry at step 5 looked like a new payment. Retrying is fine and often needed after a timeout, as long as the retry reuses the same key."
drafted_with_ai: true
