id: agent-budgets-kill-switches-3
stop_id: agent-budgets-kill-switches
stem: "A Chennai insurer's claims agent reads its kill-switch flags from Redis every five seconds. One of its tools, approve_payout, sends money. Redis goes down and stays down for twenty minutes. What should the agent do about approve_payout?"
options:
  - { id: a, text: "Keep using the last flags it read until Redis comes back" }
  - { id: b, text: "Treat the missing flags as empty, so every tool stays on" }
  - { id: c, text: "Shut down the whole app, including pages that need no agent" }
  - { id: d, text: "Use the last flags for a minute, then switch payouts off" }
correct: d
explanation: "A short outage should change nothing, but after a minute without a good read, risky write tools must fail safe. Keeping old flags forever is tempting, yet a switch flipped during the outage would then never take effect."
