stop_id: first-n8n-workflow
stem: "A Kochi tuition centre tidies each enquiry, then uses Remove Duplicates (Remove Items Processed in Previous Executions, Value Is New) on the tidied phone field, which is empty when no number is given. On Monday three different students leave the phone blank, each arriving in its own run. What happens?"
options:
  - { id: a, text: "All three get through, because empty values are never compared" }
  - { id: b, text: "All three get through, because the node only checks one run" }
  - { id: c, text: "The node fails with an error when the value to check is empty" }
  - { id: d, text: "The first gets through; the other two are dropped as repeats" }
correct: d
explanation: "The node remembers values from earlier runs, and an empty phone is a value like any other, so the second and third blanks look like repeats. Checking only within one run is the other operation; here, dedupe on the phone or, if it is empty, the email."
