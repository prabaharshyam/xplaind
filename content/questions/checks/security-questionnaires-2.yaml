id: security-questionnaires-2
stop_id: security-questionnaires
stem: "Your AI assistant for a Hyderabad bank shows one customer's statement to another customer. Your on-call engineer confirms it at 02:00 on a Sunday. The contract asks you to tell the bank within 2 hours. What should your team do first?"
options:
  - { id: a, text: "Tell the bank within 2 hours so it can meet its 6-hour RBI report; check your CERT-In duty." }
  - { id: b, text: "Finish the investigation first, then tell the bank, so the report you send it is complete and confirmed." }
  - { id: c, text: "Report to CERT-In only, because the bank's own RBI report is the bank's concern, not yours." }
  - { id: d, text: "Notify the Data Protection Board yourself, since your system was the one that processed the data." }
correct: a
explanation: "The bank's 6-hour clock to RBI depends on your notice, so you tell it fast with what you know, and CERT-In's own 6-hour rule may also cover you. Waiting to finish the investigation (b) is the tempting mistake: neither clock waits for a full story."
