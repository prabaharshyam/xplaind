id: model-merging-3
stop_id: model-merging
stem: "A team in Hyderabad merges a Telugu support model and a legal summary model with TIES. On one weight, the support task changed it by +0.6 and the legal task by -0.5, and both changes survive the trim step. A teammate says TIES resolves conflicts so both tasks keep their change. What actually happens to that weight?"
options:
  - { id: a, text: "Both changes are averaged to about +0.05, so each task keeps a small part of its change." }
  - { id: b, text: "Both changes are added together, so each task's skill survives at full strength on that weight." }
  - { id: c, text: "The change is set to zero, because TIES removes every weight where the two tasks disagree." }
  - { id: d, text: "The positive side wins the sign vote, so +0.6 is kept and the legal task's change is dropped." }
correct: d
explanation: "TIES elects the sign with more total change (+0.6 against -0.5) and averages only the changes that agree, so the support task wins and the legal task's change is lost. Option a describes plain averaging, which is what TIES replaces; neither keeps both changes."
