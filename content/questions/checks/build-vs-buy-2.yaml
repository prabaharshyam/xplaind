id: build-vs-buy-2
stop_id: build-vs-buy
stem: "A Bengaluru edtech's main product is adaptive maths practice in Kannada and English, where AI picks each student's next question from their past mistakes. It also wants AI to sort parent support emails. Which plan fits the lesson best?"
options:
  - { id: a, text: "Build the question picker; buy or configure a help-desk AI to sort the support emails" }
  - { id: b, text: "Build both, because owning every AI feature keeps data in-house and is cheaper over time" }
  - { id: c, text: "Buy both, because vendors move faster and building AI is always slower and more costly" }
  - { id: d, text: "Buy the question picker from a vendor, and build the email sorter because it is simpler" }
correct: a
explanation: "Students choose the product because of how well it picks questions, so that is worth building; sorting support emails is a commodity every company needs. Building both sounds safe but ignores that people, not tokens, are most of a build's cost."
