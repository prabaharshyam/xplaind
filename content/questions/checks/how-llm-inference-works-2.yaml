id: how-llm-inference-works-2
stop_id: how-llm-inference-works
stem: "Why does serving many long chats at once cause out-of-memory errors?"
options:
  - { id: a, text: "The model weights grow with each user" }
  - { id: b, text: "Each request's KV cache grows with its context and they add up" }
  - { id: c, text: "Streaming uses extra memory" }
  - { id: d, text: "Tokenizers need GPU memory" }
correct: b
explanation: "The KV cache stores keys and values for every token of every active request, so long contexts times many users can exceed GPU memory."
