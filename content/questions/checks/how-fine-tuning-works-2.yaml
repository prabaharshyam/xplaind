stem: "A fine-tuned model is much better at your classification task but now answers general questions badly. What is this called?"
options:
  - { id: a, text: "Overfitting to the test set" }
  - { id: b, text: "Prompt injection" }
  - { id: c, text: "Catastrophic forgetting" }
  - { id: d, text: "Quantization error" }
correct: c
explanation: "Training narrowly can erode abilities the model had before. Test unrelated prompts, or limit where the model is used."
