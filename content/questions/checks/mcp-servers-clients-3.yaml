id: mcp-servers-clients-3
stop_id: mcp-servers-clients
stem: "A Chennai logistics firm's MCP server has a search_consignments tool. When nothing matches, it crashes and the agent sees only \"Internal error\". When a customer name is common, it returns all 3,000 matching records. The agent often gives up or becomes slow. Which fix addresses both problems?"
options:
  - { id: a, text: "Tell the model in the system prompt to retry failed searches and to ask for fewer rows" }
  - { id: b, text: "Catch the crash and return an empty list, and send matches as a resource instead" }
  - { id: c, text: "Raise the client's read timeout, and restart the server automatically after each crash" }
  - { id: d, text: "Return a tool error that suggests a narrower search, and cap results with a limit" }
correct: d
explanation: "A tool error with isError true and a useful message tells the model what to try next, and a limit stops one result from flooding the context. An empty list gives the model no hint, and records sent as a resource still fill the context once attached. A prompt cannot make the server return fewer rows."
