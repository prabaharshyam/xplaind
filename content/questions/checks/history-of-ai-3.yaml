id: history-of-ai-3
stop_id: history-of-ai
stem: "In November 2026 a vendor tells a Chennai firm: \"Our agent scores 90% on a public benchmark, so it can run your whole invoice-payment process with no staff.\" Based on AI's history, what is the best response?"
options:
  - { id: a, text: "Agree: agents are a new kind of AI, so the old pattern of over-promising no longer applies" }
  - { id: b, text: "Refuse: every AI boom ends in a winter, so agents will soon fail and be abandoned" }
  - { id: c, text: "Agree if it is a large transformer, since scaling lets bigger models handle any task" }
  - { id: d, text: "Trial it on your own invoices, with a person checking each step, before trusting it" }
correct: d
explanation: "History says to judge a system by what it does on your own tasks, checked by someone other than the seller, and agents still make mistakes on long tasks. Believing the claim because agents are new repeats the old over-promising pattern, while predicting a certain winter is just another confident forecast."
