stem: "Asked 'Tell me about a project you owned end to end', four candidates end their stories about speeding up insurance claim checks. Which result is strongest?"
options:
  - { id: a, text: "We used LangChain, FastAPI and a vector database, and the team processed claims about 60% faster." }
  - { id: b, text: "My model reached 94% accuracy on the test set, up from 81%, and the client was very happy with it." }
  - { id: c, text: "Our team cut checking time by two-thirds, and my manager called it the best project of the year." }
  - { id: d, text: "Checks fell from 6 days to 2 in a quarter, per ticket logs; I learned to get ops sign-off first." }
correct: d
explanation: "The ticket-log answer gives a before, an after, a period, how it was measured and a lesson. The 94% accuracy answer is tempting because it has precise numbers, but test-set accuracy is a model metric, not the business result the client cared about."
