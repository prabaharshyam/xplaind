stem: "Meera has six years as a test engineer at an IT services firm in Noida. Her company has just started an AI practice and is running a pilot of an LLM assistant for a client. She wants the fastest realistic move into AI. What should she do?"
options:
  - { id: a, text: "Resign and study full time, so she finishes a roadmap faster" }
  - { id: b, text: "Apply now for FDE posts, since that role has the top early band" }
  - { id: c, text: "Collect AI certificates first, since IT services firms rate them" }
  - { id: d, text: "Join the AI pilot, test the assistant's answers, measure them" }
correct: d
explanation: "Experienced people usually switch fastest inside their own company, and testing an assistant's answers is AI evaluation work that suits a test engineer and gives her measured evidence. FDE posts are tempting for the pay, but they expect engineering delivery she cannot yet show, and the high early band is rarely open to newcomers."
