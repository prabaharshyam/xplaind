id: cloud-security-basics-1
stop_id: cloud-security-basics
stem: "Under the shared responsibility model, who is responsible for a storage bucket that was left readable by the public?"
options:
  - { id: a, text: "The cloud provider, because it runs the storage service" }
  - { id: b, text: "The customer, because access settings and data are always the customer's responsibility" }
  - { id: c, text: "Nobody, because public buckets are a feature" }
  - { id: d, text: "CERT-In" }
correct: b
explanation: "The provider secures the service itself. Who can read your data is your configuration, in IaaS, PaaS and SaaS alike."
