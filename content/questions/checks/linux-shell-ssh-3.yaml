stem: "Which statement about SSH keys is right?"
options:
  - { id: a, text: "Share your private key with the server" }
  - { id: b, text: "Put the public key on the server; the private key never leaves your machine" }
  - { id: c, text: "Use the same key for every person on the team" }
  - { id: d, text: "Keys are less secure than passwords" }
correct: b
explanation: "The server only needs the public key. Each person and machine has its own private key so access can be revoked individually."
