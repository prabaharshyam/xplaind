id: scope-of-work-3
stop_id: scope-of-work
stem: "A Bengaluru retailer accepted your support assistant in March. In October the model provider announces it will retire that model in 60 days. The SOW says acceptance applies to the named model version. What should happen next?"
options:
  - { id: a, text: "Re-run the acceptance test on the replacement, with fixes paid as the SOW says" }
  - { id: b, text: "Nothing, because the system was accepted and the change is the provider's issue" }
  - { id: c, text: "Switch to the replacement at once, since newer models are at least as good" }
  - { id: d, text: "Keep calling the old model after the date so nothing needs to be re-tested" }
correct: a
explanation: "Acceptance was tied to a version, so a new model needs the same test again, and the SOW already says who pays for fixes. Assuming the newer model is at least as good is tempting, but a replacement can behave differently on your task, and requests to a retired model fail."
