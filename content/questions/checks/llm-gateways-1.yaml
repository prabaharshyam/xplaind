id: llm-gateways-1
stop_id: llm-gateways
stem: "A Hyderabad health app's contracts say patient prompts must be processed only in India. Its gateway alias calls one Claude deployment on Bedrock in Mumbai. Which change adds outage cover and still keeps the rule?"
options:
  - { id: a, text: "Switch to the model's APAC cross-Region profile, which stays in Asia Pacific" }
  - { id: b, text: "Switch to the model's global profile, which has the most capacity in an outage" }
  - { id: c, text: "Use its India geographic profile, or a Hyderabad in-Region ID if one exists" }
  - { id: d, text: "Raise num_retries to five on the Mumbai deployment, since retries stay there" }
correct: c
explanation: "The India profile routes only between Mumbai and Hyderabad, and an in-Region Hyderabad deployment stays in India too, so either gives a second place to serve from. The APAC profile is tempting, but Asia Pacific is wider than India. More retries on one deployment do not help when that Region is down."
