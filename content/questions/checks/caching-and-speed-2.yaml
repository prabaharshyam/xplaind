id: caching-and-speed-2
stop_id: caching-and-speed
stem: "A Pune food-delivery app caches assistant answers in Redis, keyed by a hash of the normalised question, prompt version and model, for 24 hours. After launch, a customer who asked \"Where is my order?\" is shown another customer's address. What is the right fix?"
options:
  - { id: a, text: "Scope the key: user id for account answers, shared only for general ones" }
  - { id: b, text: "Cut the cache expiry from 24 hours to 5 minutes so old answers vanish sooner" }
  - { id: c, text: "Turn off the provider's prompt caching, which shares prompts between customers" }
  - { id: d, text: "Switch to semantic caching so each question matches its closest stored answer" }
correct: a
explanation: "The leak comes from the app's own response cache: two users asking the same words share one key. A shorter expiry only narrows the window for the same leak, and the provider's prompt cache cannot cause it because the model writes a fresh answer each time."
