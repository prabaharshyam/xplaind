id: scoping-automation-1
stop_id: scoping-automation
stem: "A Kochi spice exporter's scope says: 'Accepted when at least 90% of invoice lines are extracted correctly on 200 past invoices.' Handwritten courier invoices are listed as out of scope. At the test, the client's manager picks 200 invoices that include 40 handwritten ones, and the result is 78%. What should the scope have said to prevent this dispute?"
options:
  - { id: a, text: "A higher threshold, such as 95%, so nobody can argue about the result" }
  - { id: b, text: "That the freelancer picks the test invoices, since she knows the system best" }
  - { id: c, text: "Which in-scope invoices are tested, who writes the answer key, by when" }
  - { id: d, text: "That acceptance depends on the client's overall satisfaction after a month" }
correct: c
explanation: "The dispute comes from an undefined test set, so the fix is to name the data (in-scope items, a stated period, chosen by the client) and the answer key in advance. A higher threshold is tempting but changes nothing: the same out-of-scope invoices would still fail it."
drafted_with_ai: true
