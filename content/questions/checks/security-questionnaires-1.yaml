id: security-questionnaires-1
stop_id: security-questionnaires
stem: "A Chennai bank asks: \"Do you retain prompts or model outputs?\" Your app deletes them when each session ends, but your tracing tool keeps full prompts for 30 days in a Singapore region. Which answer should you send?"
options:
  - { id: a, text: "\"No. Our app deletes all prompts and outputs when each session ends.\"" }
  - { id: b, text: "\"Not applicable: the tracing tool is a third party's system, not ours.\"" }
  - { id: c, text: "\"Yes: our tracing tool keeps them 30 days in Singapore; the app does not.\"" }
  - { id: d, text: "\"Only for debugging, which our internal policy does not count as retention.\"" }
correct: c
explanation: "Retention covers every place prompts live, including sub-processors such as a tracing tool, so the honest answer names the tool, period and region. Answer (a) is tempting because it is true for the app, but it is an overclaim that the bank's follow-up questions or audit will expose."
