stem: "Inside an async def function you call time.sleep(2). What happens?"
options:
  - { id: a, text: "Only that request waits two seconds" }
  - { id: b, text: "The whole event loop freezes for two seconds" }
  - { id: c, text: "Python raises an error" }
  - { id: d, text: "Nothing; sleep is ignored in async code" }
correct: b
explanation: "time.sleep blocks the thread, and the event loop runs on that thread, so every other task stalls. Use await asyncio.sleep(2)."
