id: ml-interviews-3
stop_id: ml-interviews
stem: "In a GenAI design round, you hear that a pilot RAG assistant for a Chennai insurer answers about one question in five wrongly from its policy documents. The interviewer asks what you would do first. Which answer is strongest?"
options:
  - { id: a, text: "Fine-tune the model on the policy documents so it memorises the right answers" }
  - { id: b, text: "Move to the largest model available, since wrong answers mean weak reasoning" }
  - { id: c, text: "Make the chunks much larger so every retrieved passage carries more context" }
  - { id: d, text: "Label the failing questions and check if the right passage was retrieved" }
correct: d
explanation: "You cannot fix what you have not measured: labelling failures shows whether retrieval missed the passage or the model misused it, and each needs a different fix. Fine-tuning is tempting, but it is a poor way to store changing policy facts and does not tell you where the errors come from."
