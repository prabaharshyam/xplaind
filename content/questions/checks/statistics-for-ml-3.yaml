id: statistics-for-ml-3
stop_id: statistics-for-ml
stem: "A Jaipur travel app runs a planned 50/50 A/B test of a new checkout for two full weeks. On the pre-chosen primary metric, bookings per user, the new checkout wins with p = 0.01. But the groups ended with 1,01,800 and 98,200 users. What should the team do first?"
options:
  - { id: a, text: "Ship it: the metric was chosen in advance and p = 0.01 is well below 0.05" }
  - { id: b, text: "Ignore the gap: 3,600 users is under 2% of traffic, too few to change much" }
  - { id: c, text: "Reweight the smaller group up to 1,01,800 users and then recompute the p-value" }
  - { id: d, text: "Find out why the split is uneven before trusting any result from this test" }
correct: d
explanation: "A fair 50/50 split almost never lands this far apart by chance (a chi-square test gives p below 0.000001), so users were lost or misassigned, perhaps by a crash in one version. Reweighting cannot help, because the users who are missing may be exactly the ones who would behave differently."
