id: rpa-basics-1
stop_id: rpa-basics
stem: "An unattended robot at a Pune finance company enters loan applications from paper forms, each with a printed reference number, into an old desktop loan system. One night it clicked Save, the app froze, the robot timed out and the queue retried the item. In the morning the team finds two applications for the same customer. Which change stops duplicates without losing automatic retries or applications?"
options:
  - { id: a, text: "Raise the robot's timeout to five minutes, so it always waits for Save to finish" }
  - { id: b, text: "Switch off retries on the queue, so every failed item goes straight to a person" }
  - { id: c, text: "First search the app by the paper form's reference number; reuse any match found" }
  - { id: d, text: "Mark the queue item successful the moment Save is clicked, so it is never retried" }
correct: c
explanation: "Searching by a unique key before creating makes the item idempotent: a retry finds the first record instead of making a second. A longer timeout only makes the freeze less likely to cause a retry; the next longer freeze or crash still duplicates the record."
