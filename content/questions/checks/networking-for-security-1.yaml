stem: "Which statement about TCP and UDP is correct?"
options:
  - { id: a, text: "TCP sets up a connection with a handshake and guarantees ordered delivery; UDP sends without guarantees" }
  - { id: b, text: "UDP is encrypted and TCP is not" }
  - { id: c, text: "TCP is only used inside offices and UDP only on the internet" }
  - { id: d, text: "UDP always uses port 443" }
correct: a
explanation: "TCP adds a handshake and reliable, ordered delivery. UDP is connectionless and faster. Neither is encrypted by itself; TLS adds encryption."
