stem: "A request uses 2,000 input tokens and 500 output tokens. Output tokens cost five times as much per token as input tokens. Which part of the bill is larger?"
options:
  - { id: a, text: "Input, because there are more tokens" }
  - { id: b, text: "Output, because 500 x 5 = 2,500 input-token equivalents" }
  - { id: c, text: "They are exactly equal" }
  - { id: d, text: "It cannot be worked out" }
correct: b
explanation: "500 output tokens at five times the price cost the same as 2,500 input tokens, which is more than 2,000."
