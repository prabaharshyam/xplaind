id: mcp-servers-clients-1
stop_id: mcp-servers-clients
stem: "A Bengaluru lending company builds a remote MCP server for its loan officers. Officers sign in through company SSO, and each token carries the officer's branch. A developer gives get_loan_applications a branch_id argument so each officer sees only their branch. What is the best change?"
options:
  - { id: a, text: "Keep branch_id, and tell the model in the tool description to use only the officer's branch" }
  - { id: b, text: "Keep branch_id, and check that it is a valid branch code before the query runs" }
  - { id: c, text: "Remove branch_id and filter every query by the branch claim in the verified token" }
  - { id: d, text: "Move the server to stdio so that each officer runs a private copy on their own laptop" }
correct: c
explanation: "The model fills tool arguments, and injected text can steer it, so any argument that picks whose data is returned can be abused. Reading the branch from the checked token means no prompt can change it. A valid branch code is still someone else's branch, and instructions in a description are only a request to the model."
