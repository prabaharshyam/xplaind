id: scoping-automation-3
stop_id: scoping-automation
stem: "A Jaipur wholesaler's acceptance test passes at 95% of order lines correct. Orders average eight lines, and errors look evenly spread. The owner now wants to drop the staff check, saying '19 in 20 orders are right'. What should you tell him?"
options:
  - { id: a, text: "He is right: 95% of lines correct means about 95% of orders are fully correct" }
  - { id: b, text: "Raise the test threshold to 97% of lines first, and then drop the staff check" }
  - { id: c, text: "Drop the check, because staff can correct any errors when shops complain" }
  - { id: d, text: "About a third of orders will still have an error, so keep the staff check" }
correct: d
explanation: "With eight lines at 95% each, the chance an order has no error is 0.95 to the power 8, about 66%, so roughly one order in three needs a correction. Even 97% of lines leaves about one order in five wrong, so a slightly higher threshold does not make the human check safe to remove."
