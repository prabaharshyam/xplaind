id: ai-for-research-3
stop_id: ai-for-research
stem: "Kavya in Bengaluru runs a deep research report on India's electric two-wheeler market for a funding pitch. It is 18 pages long with 45 citations. She has one evening before the pitch. What is the best way to check it?"
options:
  - { id: a, text: "Ask the tool to re-check all 45 citations and fix any it doubts" }
  - { id: b, text: "Open the first ten citations in order and check that each loads" }
  - { id: c, text: "Run a second tool and keep only the figures where both reports agree" }
  - { id: d, text: "List the figures the pitch rests on and trace each to its source" }
correct: d
explanation: "The pitch rests on a few figures, so tracing those to original, dated sources is the check that matters. The rest is background. Agreement between two tools is tempting but weak, because both may copy the same secondary source."
