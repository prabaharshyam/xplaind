stem: "Which is the most honest way to show a SOC copilot saves time?"
options:
  - { id: a, text: "Quote the vendor's published savings figure" }
  - { id: b, text: "Ask analysts whether they like the tool" }
  - { id: c, text: "Count how many prompts analysts sent this month" }
  - { id: d, text: "Compare task times with and without it on similar alerts, and sample its output for errors" }
correct: d
explanation: "A baseline, a like-for-like comparison and a quality sample show both the speed and the cost in mistakes. Usage counts and opinions do not measure either."
