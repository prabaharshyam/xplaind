id: company-ai-policy-1
stop_id: company-ai-policy
stem: "Divya, in sales at a packaging firm in Pune, is preparing a price list for a client. It will go to the client next week, once her manager approves it, and it names no people. Under the four data categories, what is it today?"
options:
  - { id: a, text: "Public, because the client will see these prices next week anyway" }
  - { id: b, text: "Internal, because it is an everyday document the sales team uses" }
  - { id: c, text: "Confidential, as it shows a client's prices before agreement" }
  - { id: d, text: "Personal, because it is linked to one particular client account" }
correct: c
explanation: "Unagreed prices for a named client are confidential: competitors would value them, and sending them to one client does not publish them. Public is the tempting answer, but a document is public only once it is actually published."
