id: ai-risk-frameworks-2
stop_id: ai-risk-frameworks
stem: "A Pune start-up sells its CV-screening tool, under its own brand, to a retailer in Germany that uses it to shortlist store staff. Which duty falls on the German retailer rather than on the Pune start-up?"
options:
  - { id: a, text: "Informing its workers' representatives and the candidates that the tool is used" }
  - { id: b, text: "Running the conformity assessment and signing the EU declaration of conformity" }
  - { id: c, text: "Writing the technical documentation on how the model was built and tested" }
  - { id: d, text: "Registering the system in the EU database before it is placed on the market" }
correct: a
explanation: "The start-up builds the tool and sells it under its name, so it is the provider and owes the design-side duties: documentation, conformity assessment and registration. The retailer is the deployer; it owes use-side duties such as trained oversight, keeping logs and informing the people affected. Using the tool inside the EU does not make the retailer the provider."
