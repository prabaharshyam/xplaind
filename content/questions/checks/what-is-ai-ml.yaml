id: what-is-ai-ml
stop_id: what-is-ai
stem: Which description fits machine learning best?
options:
  - { id: a, text: Programmers write a rule for every case the computer might see }
  - { id: b, text: The computer finds patterns from examples instead of following hand-written rules }
  - { id: c, text: Copying data from one computer to another }
  - { id: d, text: Making a computer run faster by adding memory }
correct: b
explanation: In machine learning the computer learns patterns from examples. This is the difference from ordinary programs, where a person writes the rules.
