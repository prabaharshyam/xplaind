id: ai-pm-interviews-3
stop_id: ai-pm-interviews
stem: "You are designing a Hindi and Marathi helpline assistant for state welfare schemes whose rules change every few weeks. An engineer proposes fine-tuning a model on the rulebook because it is cheaper per call than sending long documents. What do you say?"
options:
  - { id: a, text: "Agree: fine-tuning is cheaper per call, and cost matters most for a high-volume helpline" }
  - { id: b, text: "Put the whole rulebook in every prompt, since long context windows make retrieval unnecessary" }
  - { id: c, text: "Fine-tune now, and add retrieval later only if citizens start complaining about wrong answers" }
  - { id: d, text: "Use retrieval over the current rules with citations; fine-tuning would freeze old rules" }
correct: d
explanation: "When facts change every few weeks, retrieval keeps answers current and lets citizens see the source, while a fine-tuned model repeats last month's rules until it is retrained. Lower cost per call is the tempting argument, but a cheap wrong answer about a welfare scheme costs far more than the tokens saved."
