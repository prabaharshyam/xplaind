id: logs-and-siem-3
stop_id: logs-and-siem
stem: "Which of these should NOT appear in an application's security log?"
options:
  - { id: a, text: "The timestamp with its time zone offset" }
  - { id: b, text: "The user id and source IP address" }
  - { id: c, text: "Whether the action succeeded or failed" }
  - { id: d, text: "The user's password and session token" }
correct: d
explanation: "Logs record when, who, what, where and the outcome. Secrets such as passwords and tokens must never be logged, because anyone who reads the logs could reuse them."
