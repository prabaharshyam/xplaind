stem: "Your linear model for second-hand car prices in Kochi has residuals that are small for ₹3 lakh hatchbacks and very large for ₹25 lakh SUVs, fanning out as price rises. What should you try first?"
options:
  - { id: a, text: "Train on log price, so that errors scale with the price" }
  - { id: b, text: "Delete the expensive SUVs from the data as outliers" }
  - { id: c, text: "Raise the ridge penalty so that the coefficients shrink more" }
  - { id: d, text: "Report R² instead of MAE, since it ignores the rupee scale" }
correct: a
explanation: "A funnel of residuals means errors grow with price, which a log target handles by fitting percentage errors. Deleting the SUVs is tempting but only hides a real segment the product must still price."
