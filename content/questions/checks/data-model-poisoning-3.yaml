id: data-model-poisoning-3
stop_id: data-model-poisoning
stem: "After a retrain, overall test accuracy is unchanged. Why is that not enough to rule out poisoning?"
options:
  - { id: a, text: "Targeted poisoning and backdoors affect small slices or triggered inputs the test set does not contain" }
  - { id: b, text: "Accuracy is never a useful metric" }
  - { id: c, text: "Poisoning always lowers overall accuracy, so the test is broken" }
  - { id: d, text: "Test sets are always poisoned too" }
correct: a
explanation: "Test fixed slices and inputs with candidate triggers, and compare with the last good model. Overall accuracy can hide a narrow attack."
