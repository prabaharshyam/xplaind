stem: "Why do detection teams prefer behaviour-based rules over relying only on IOCs such as IP addresses and file hashes?"
options:
  - { id: a, text: "IOCs are illegal to share in India" }
  - { id: b, text: "Attackers can change IPs and hashes cheaply, but changing how they operate is much harder" }
  - { id: c, text: "Behaviour rules never need tuning" }
  - { id: d, text: "SIEMs cannot store IP addresses" }
correct: b
explanation: "IOCs are useful for blocking and searching, but attackers rotate them easily. Detecting techniques, such as encoded PowerShell, keeps working when the infrastructure changes."
