stem: "Why should an LLM app's attack suite run on every change, not only before launch?"
options:
  - { id: a, text: "Because CI minutes are free" }
  - { id: b, text: "Because unit tests cannot run without it" }
  - { id: c, text: "Because auditors require exactly one run per commit" }
  - { id: d, text: "Because prompt edits, model upgrades and new libraries can quietly reopen weaknesses that were fixed earlier" }
correct: d
explanation: "LLM app behaviour depends on prompts, models, data and libraries that change often. Running the suite on each change catches a reopened weakness before it ships."
