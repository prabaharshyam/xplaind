stem: "Why is `with open(\"data.txt\") as f:` preferred over calling open and close yourself?"
options:
  - { id: a, text: "It reads the file faster" }
  - { id: b, text: "It closes the file for you, even if an error happens" }
  - { id: c, text: "It works only for CSV files" }
  - { id: d, text: "It stops other programs from reading the file" }
correct: b
explanation: "The with block always closes the file when it ends, including when an exception is raised inside it."
