id: automation-error-handling-1
stop_id: automation-error-handling
stem: "A clinic in Pune sends appointment reminders on WhatsApp through a provider that has a message status API. One send call times out after 30 seconds with no reply. What is the safest next step?"
options:
  - { id: a, text: "Retry the send at once, because a timeout means the message was never sent" }
  - { id: b, text: "Retry with backoff and jitter, since timeouts are temporary errors" }
  - { id: c, text: "Check the status by your key, and resend with the same key only if absent" }
  - { id: d, text: "Mark it failed and move it to needs attention, never resending it" }
correct: c
explanation: "A timeout is an unknown outcome: the message may already have gone out, so look it up by your key before resending. Backoff and jitter only change when you retry, so they still risk a duplicate reminder."
