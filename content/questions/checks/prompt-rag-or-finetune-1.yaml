id: prompt-rag-or-finetune-1
stop_id: prompt-rag-or-finetune
stem: "A Bengaluru HR-tech startup extracts fields from 50 lakh resumes a month into JSON. The extracted values are right, but 8% of replies break the format: missing fields, a number sent as text. What should the team do first?"
options:
  - { id: a, text: "Fine-tune a small model on 5,000 well-formatted replies so it learns the format" }
  - { id: b, text: "Add RAG over a library of correctly formatted example replies" }
  - { id: c, text: "Use the API's structured output with a JSON schema, and validate values" }
  - { id: d, text: "Move to a larger model, since format errors show the model is too weak" }
correct: c
explanation: "This is a behaviour problem, and structured output guarantees the shape for almost no cost or effort, while code checks the values. Fine-tuning could also fix the format, but it takes weeks, needs upkeep and still guarantees nothing, so it comes only after cheaper fixes fail."
