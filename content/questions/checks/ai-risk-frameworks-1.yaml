id: ai-risk-frameworks-1
stop_id: ai-risk-frameworks
stem: "A Kolkata lender's website chatbot, also used by customers in Ireland, used to answer product questions only. It now asks about income and existing loans, tells each person how likely they are to be approved, and pre-fills their application. A loan officer still makes every final decision. How should the team classify it under the EU AI Act?"
options:
  - { id: a, text: "Still limited risk: it is a chatbot, so it only has to disclose that it is an AI" }
  - { id: b, text: "Not high risk, because a loan officer makes the final decision on every application" }
  - { id: c, text: "High risk: it now scores individuals' creditworthiness, which is profiling" }
  - { id: d, text: "Minimal risk for now, because high-risk duties only start in December 2027" }
correct: c
explanation: "The tier follows what the output is used for: assessing a person's chance of getting credit is an Annex III use, and scoring individuals is profiling, which keeps it high risk even with a human deciding. The 2027 date changes when the duties apply, not how the system is classified."
