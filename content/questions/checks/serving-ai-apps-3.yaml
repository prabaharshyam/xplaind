id: serving-ai-apps-3
stop_id: serving-ai-apps
stem: "A Chennai edtech's /ready endpoint runs a query on the shared Postgres database with a 1-second timeout, and the load balancer sends traffic only to ready instances. One evening the database slows down for 20 seconds. What happens, and what should change?"
options:
  - { id: a, text: "Only the instances nearest the database fail, traffic shifts to the rest, and nothing needs to change" }
  - { id: b, text: "Nothing visible happens, because readiness failures only matter when instances start up" }
  - { id: c, text: "The platform restarts each failing instance, which clears the slow connections, so keep it" }
  - { id: d, text: "All instances fail together and are removed; keep /ready to start-up checks, alert separately" }
correct: d
explanation: "Every instance shares the same database, so they all fail readiness at the same moment and the balancer has nowhere to send traffic: a 20-second slowdown becomes a full outage. Readiness failures remove instances from traffic; they do not restart them, which is what liveness checks do."
