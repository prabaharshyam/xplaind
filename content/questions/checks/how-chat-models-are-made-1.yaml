stem: "You ask a base model \"How do I reset my UPI PIN?\" and it replies with a list of more questions. Why?"
options:
  - { id: a, text: "It is broken and needs retraining" }
  - { id: b, text: "It was only trained to continue text, and lists of questions are common online" }
  - { id: c, text: "Its temperature is set to zero" }
  - { id: d, text: "It has no knowledge of UPI" }
correct: b
explanation: "A base model has only been pre-trained to predict the next token. Supervised fine-tuning is what teaches it to answer instead of continuing the text."
