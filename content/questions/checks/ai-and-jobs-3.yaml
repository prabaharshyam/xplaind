id: ai-and-jobs-3
stop_id: ai-and-jobs
stem: "Lakshmi leads an IT support team at a services firm in Bengaluru. An AI assistant now resolves most password-reset and access tickets, which is the work freshers used to learn on. Two new graduates join next month. What is the best plan for them?"
options:
  - { id: a, text: "Give them manual password tickets for six months, so they learn basics the old way" }
  - { id: b, text: "Let them rely on the assistant unchecked, since studies show AI helps new staff the most" }
  - { id: c, text: "Stop hiring freshers, since the assistant now does the junior work and seniors are enough" }
  - { id: d, text: "Pair them with seniors to check the assistant's answers, so they build judgement fast" }
correct: d
explanation: "When AI removes the training ground, the team has to build a new one on purpose, and checking AI answers with a senior builds the judgement juniors now need. Answer b misreads the evidence: new staff gained most when the tool carried expert know-how, but they still have to learn to catch its errors. Stopping fresher hiring leaves the team with no future seniors."
