id: synthetic-data-distillation-1
stop_id: synthetic-data-distillation
stem: "You distil a large model into a small one for ticket sorting. What should the final test use?"
options:
  - { id: a, text: "Synthetic tickets made by the large model" }
  - { id: b, text: "The same tickets used for training" }
  - { id: c, text: "Real, hand-labelled tickets never used in training" }
  - { id: d, text: "The large model's own accuracy report" }
correct: c
explanation: "Only real, unseen data shows how the student serves users. Testing on model-made data measures how well it copies the teacher."
