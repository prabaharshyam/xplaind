id: ai-threat-modeling-1
stop_id: ai-threat-modeling
stem: "In a data-flow diagram of an LLM app, where do most threats sit?"
options:
  - { id: a, text: "Inside the model's weights" }
  - { id: b, text: "In the colour scheme of the chat window" }
  - { id: c, text: "On trust boundaries, where data moves between parts with different trust, such as a retrieved document entering the prompt" }
  - { id: d, text: "Only in the login page" }
correct: c
explanation: "Trust boundaries are where untrusted data meets trusted parts: user input, retrieved text, tool calls and log access. Mark them all and look hardest there."
