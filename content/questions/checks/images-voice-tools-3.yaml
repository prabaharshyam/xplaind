stop_id: images-voice-tools
stem: "Kavya, an HR assistant in Bengaluru, must type 40 joining forms into a spreadsheet. The forms carry Aadhaar numbers, phone numbers and bank details. Her company has approved one AI tool for documents. What should she do?"
options:
  - { id: a, text: "Upload photos to her personal chatbot account, then delete the chat afterwards" }
  - { id: b, text: "Use the approved tool and paste its output straight in, since it reads forms well" }
  - { id: c, text: "Cover only the Aadhaar numbers, then upload the rest to her personal account" }
  - { id: d, text: "Use only the approved tool, then check each row in the sheet against its form" }
correct: d
explanation: "Other people's ID numbers, phone numbers and bank details belong only in a tool the company has approved, and readings of forms still need a line-by-line check. Deleting a chat does not undo an upload to an unapproved service, and even the approved tool can misread a digit."
