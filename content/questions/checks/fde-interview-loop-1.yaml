id: fde-interview-loop-1
stop_id: fde-interview-loop
stem: "In a 60-minute decomposition round, the interviewer says: 'A jewellery chain in Jaipur with 40 stores wants to use AI to reduce stock losses.' Twenty-five minutes in, which candidate is doing best?"
options:
  - { id: a, text: "Has sketched a shelf-camera vision pipeline and is now estimating GPU cost per store per month" }
  - { id: b, text: "Has written twelve clarifying questions on the board and plans to keep asking until the time is nearly up" }
  - { id: c, text: "Found most losses are billing errors at two stores, agreed a KPI, and is asking what data billing keeps" }
  - { id: d, text: "Has skipped the baseline, since any fall in losses is a win, and is comparing three vendors' AI products" }
correct: c
explanation: "The candidate who found the billing errors asked about the process first, found where the losses really come from, agreed a measurable goal and is now checking the data before choosing anything. The candidate with twelve questions looks careful, but asking questions without driving towards a KPI and a first option by halfway scores poorly too."
