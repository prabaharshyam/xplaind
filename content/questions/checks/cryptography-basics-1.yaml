id: cryptography-basics-1
stop_id: cryptography-basics
stem: "Which is the right way to store user passwords?"
options:
  - { id: a, text: "Encrypt them with AES and keep the key in the same database" }
  - { id: b, text: "A slow, salted password hash such as Argon2id or bcrypt" }
  - { id: c, text: "SHA-256 of the password, without a salt" }
  - { id: d, text: "Base64-encode them" }
correct: b
explanation: "Password hashes must be one-way, salted and deliberately slow so stolen hashes are expensive to crack. Base64 is reversible encoding, fast SHA-256 is too quick to guess against, and reversible encryption is not needed."
