stem: "Average response time is 2 seconds. Why is that not enough to judge user experience?"
options:
  - { id: a, text: "Averages are always wrong" }
  - { id: b, text: "It can hide a slow tail; p95 and p99 show what slower users experience" }
  - { id: c, text: "Users only care about the fastest response" }
  - { id: d, text: "Averages ignore streaming" }
correct: b
explanation: "A good average can coexist with many very slow requests. Percentiles reveal them."
