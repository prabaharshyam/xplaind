id: latency-load-testing-1
stop_id: latency-load-testing
stem: "A Chennai fintech runs its KYC help assistant on four servers, each taking a quarter of the traffic. The budget is p95 first token within 3 seconds. Three servers report a p95 of 1.2 s; the fourth has a median of 3.5 s and a p95 of 6 s. The dashboard shows their average, 2.4 s. Users complain of slow replies. What should the engineer conclude?"
options:
  - { id: a, text: "The budget is met, because the average of the four p95 values is 2.4 s" }
  - { id: b, text: "Add the per-step p95s from traces; if the sum is under 3 s, it is met" }
  - { id: c, text: "Compute p95 from all raw timings; the slow server puts it over 3 s" }
  - { id: d, text: "Use the median of the four values, 1.2 s, so one odd server does not skew it" }
correct: c
explanation: "Percentiles cannot be averaged. Half the slow server's requests take over 3.5 s, which is 12.5% of all requests, so the true p95 is above 3.5 s and the budget is missed. Averaging the four p95s, the tempting answer, hides exactly the slow tail the budget exists to catch."
