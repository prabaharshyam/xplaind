stem: "The model provider is down. Which status code helps callers most?"
options:
  - { id: a, text: "200 with an empty summary" }
  - { id: b, text: "400 Bad Request" }
  - { id: c, text: "503 Service Unavailable, so they know to retry later" }
  - { id: d, text: "404 Not Found" }
correct: c
explanation: "503 says the problem is temporary and on the server side; clients and gateways treat it as retryable."
