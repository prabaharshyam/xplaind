stem: "A Surat saree shop's order sheet already has 250 rows. Farhan adds a Google Sheets trigger (Row Added) and a Gmail node that thanks each buyer, pins nothing, and clicks Execute workflow to test it. What happens?"
options:
  - { id: a, text: "It outputs all 250 rows, so Gmail emails all 250 buyers" }
  - { id: b, text: "Only the newest row comes out, so one buyer gets an email" }
  - { id: c, text: "Nothing yet: a test run waits until a new row is added" }
  - { id: d, text: "The trigger refuses to run until the workflow is published" }
correct: a
explanation: "In an editor run, the Sheets trigger returns every row in the sheet, and Gmail runs once per item. Only a published trigger skips the rows that already existed, which is why the newest-row answer is tempting; pin a few samples or test on a copy of the sheet."
