id: serving-ai-apps-2
stop_id: serving-ai-apps
stem: "A Hyderabad startup's FastAPI answer endpoint streams smoothly on a laptop. After deploying behind an nginx ingress, users see nothing for 8 seconds and then the whole answer at once, although server logs show the first token leaving the app in under a second. What is the most likely cause?"
options:
  - { id: a, text: "The ingress buffers the response; turn buffering off for that route and test through it" }
  - { id: b, text: "The model is slower in production; switch to a smaller model to cut the wait" }
  - { id: c, text: "One Uvicorn worker cannot stream to many users at once, so add more workers" }
  - { id: d, text: "The browser must use EventSource, because fetch cannot read a streamed response" }
correct: a
explanation: "The app sends the first token in under a second but users see it 8 seconds later, so something between them is holding the response until it is complete, which is what a buffering proxy does. A smaller model would not help, because the delay is not in generation."
