stem: "A Lucknow clinic's bot prompt says 'Hand over all medical emergencies.' In testing, 'mummy ko saans lene mein dikkat ho rahi hai' (mother is struggling to breathe) got a reply with OPD timings. What is the most reliable fix?"
options:
  - { id: a, text: "Rewrite the prompt in capitals and repeat the emergency rule at its start and end" }
  - { id: b, text: "Add the phrase to the FAQ sheet, with the emergency number as its answer" }
  - { id: c, text: "Switch to a larger model, which understands Hinglish better than this one" }
  - { id: d, text: "Route in code before retrieval: Hinglish keywords plus a yes-or-no classifier" }
correct: d
explanation: "A check in code that runs before any model reply cannot be misread or talked out of the rule, and a failed check can fall back to staff. A stronger prompt or a larger model still leaves the decision to the model, so a missed emergency stays possible."
