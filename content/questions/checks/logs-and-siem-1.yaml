id: logs-and-siem-1
stop_id: logs-and-siem
stem: "What does a SIEM add on top of simply keeping log files on each server?"
options:
  - { id: a, text: "It encrypts the hard disks of every server" }
  - { id: b, text: "It collects logs from many sources in one place, normalises them, correlates related events and raises alerts" }
  - { id: c, text: "It blocks every attack automatically, so no analyst is needed" }
  - { id: d, text: "It replaces the need for an identity provider" }
correct: b
explanation: "A SIEM centralises, normalises, searches and correlates logs so analysts see patterns across systems. It does not replace people, encryption or identity systems."
