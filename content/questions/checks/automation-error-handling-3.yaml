id: automation-error-handling-3
stop_id: automation-error-handling
stem: "A gym chain in Hyderabad sends each member one fee reminder per month. Runs sometimes fail halfway and are rerun by hand. Which unique key should the send log check before sending?"
options:
  - { id: a, text: "The run id plus the member id, so each run tracks its own sends" }
  - { id: b, text: "The member id alone, so a member never gets the same reminder twice" }
  - { id: c, text: "The member's phone number plus the time the reminder was sent" }
  - { id: d, text: "The member id plus the billing month the reminder is for" }
correct: d
explanation: "The key must describe the real action, one reminder per member per month, so a rerun produces the same key and is skipped. A run id changes on every rerun, so nothing would ever be skipped; member id alone would block next month's reminder."
