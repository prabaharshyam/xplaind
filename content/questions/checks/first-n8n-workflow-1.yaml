id: first-n8n-workflow-1
stop_id: first-n8n-workflow
stem: "A Pune bakery's workflow runs Form Trigger, then Gmail (send the order confirmation), then Telegram. The Telegram text is 'New order from ' followed by the expression $json.customer_name. The confirmation email arrives fine. What does the kitchen see?"
options:
  - { id: a, text: "The customer's name, because $json always reads the form data" }
  - { id: b, text: "An error, and the workflow stops at the Telegram node" }
  - { id: c, text: "No name, because $json now holds Gmail's sent-email details" }
  - { id: d, text: "The name of the Gmail node that ran just before Telegram" }
correct: c
explanation: "Each node replaces $json with its own output, so after Gmail it describes the sent email, not the form. Reading the form data needs the trigger named, such as $('Form').item.json.customer_name for a node called Form; $json does not keep pointing at the trigger."
