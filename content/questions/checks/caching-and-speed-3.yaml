id: caching-and-speed-3
stop_id: caching-and-speed
stem: "A Hyderabad HR assistant puts a 20,000-token policy handbook at the start of every prompt, with Claude's default 5-minute cache. Employees ask about one question every 15 minutes through the day. The monthly bill went up after caching was turned on. What should the team do?"
options:
  - { id: a, text: "Remove caching, because it always costs more on prompts this long" }
  - { id: b, text: "Move the handbook after the question so it becomes the cached part" }
  - { id: c, text: "Pre-warm the cache once each morning with max_tokens set to 0" }
  - { id: d, text: "Use the 1-hour cache, as entries expire between questions" }
correct: d
explanation: "With 15-minute gaps, every 5-minute entry expires, so each request pays the 1.25x write price and never gets a cheap read. A single morning pre-warm also expires after 5 minutes; a 1-hour cache is refreshed by each question and stays warm all day."
