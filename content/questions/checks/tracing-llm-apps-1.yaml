id: tracing-llm-apps-1
stop_id: tracing-llm-apps
stem: "A Pune insurer's claims assistant handles 50,000 requests a day. To save storage, the team keeps a random 5% of traces, chosen when each request starts. A week later they find almost none of the failed tool calls they want to study. What change fixes this?"
options:
  - { id: a, text: "Raise the random share to 20%, so more of the failed tool calls are kept" }
  - { id: b, text: "Keep the 5% share but add more attributes to each kept trace" }
  - { id: c, text: "Decide in a Collector after each trace ends: keep all errors and 5% of others" }
  - { id: d, text: "Log only the final answer for each request, which is cheap enough to keep in full" }
correct: c
explanation: "Only a decision made after the trace ends can see that a tool call failed, so tail sampling keeps every error while storing a small share of normal traces. Raising the random share still loses most errors, and costs four times as much."
