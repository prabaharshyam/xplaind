stem: "Updated documents show both old and new versions in answers. What is the likely cause?"
options:
  - { id: a, text: "The model is confused" }
  - { id: b, text: "Chunks lack stable ids tied to the document, so updates add chunks without removing old ones" }
  - { id: c, text: "The cache is too small" }
  - { id: d, text: "The documents are too long" }
correct: b
explanation: "Stable ids let an update replace exactly the old chunks."
