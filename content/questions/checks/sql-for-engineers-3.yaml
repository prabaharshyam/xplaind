id: sql-for-engineers-3
stop_id: sql-for-engineers
stem: "A query filtering on created_at is slow on 30 million rows. What do you check first?"
options:
  - { id: a, text: "Rewrite it in Python" }
  - { id: b, text: "EXPLAIN ANALYZE to see whether it scans the whole table, then consider an index on created_at" }
  - { id: c, text: "Add more WHERE clauses" }
  - { id: d, text: "Restart the database" }
correct: b
explanation: "The plan shows whether the database scanned every row. An index on the filtered column usually fixes a full scan."
