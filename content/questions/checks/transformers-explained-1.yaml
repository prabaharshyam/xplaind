id: transformers-explained-1
stop_id: transformers-explained
stem: "A Pune insurer receives about 2 lakh customer emails a day and must route each one to one of 12 teams within 100 ms, on CPU servers it already owns. It has 15,000 emails labelled with the right team. Which approach fits best?"
options:
  - { id: a, text: "Send each email to the largest chat model with a few labelled examples in the prompt" }
  - { id: b, text: "Use an encoder-decoder translation model that writes the team name as its output sequence" }
  - { id: c, text: "Fine-tune a small encoder-only model with a 12-way classification head on the labelled emails" }
  - { id: d, text: "Embed each email and send it to the team whose name is closest in vector space, ignoring the labels" }
correct: c
explanation: "With 15,000 labels, a fixed set of 12 classes and a tight CPU budget, a small fine-tuned encoder is fast, cheap and accurate. A large chat model would also work but adds cost and latency for 2 lakh emails a day without being more accurate on a task this narrow."
