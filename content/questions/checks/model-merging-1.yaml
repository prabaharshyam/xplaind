id: model-merging-1
stop_id: model-merging
stem: "A Pune startup serves five LoRA adapters (rank 16) on one 8B base with vLLM on a single GPU. Each request already says which product it is for. The CTO wants to merge the five adapters into one model to free GPU memory. What is the best advice?"
options:
  - { id: a, text: "Merge with TIES, because five adapters take about five times the GPU memory of one model." }
  - { id: b, text: "Merge by plain averaging, because it frees the memory and keeps every adapter's skill intact." }
  - { id: c, text: "Keep multi-LoRA serving: the adapters are small beside the base, and requests are routed." }
  - { id: d, text: "Concatenate the adapters with cat, which gives one model using the memory of a single adapter." }
correct: c
explanation: "Rank-16 adapters are tens of megabytes against a base of many gigabytes, and vLLM already applies the right adapter per request, so a merge frees almost no memory and costs accuracy. Option a assumes adapters are as large as the model, which is the misconception the lesson warns about."
