id: ux-uncertain-output-3
stop_id: ux-uncertain-output
stem: "A Jaipur bank adds AI to three features: summarising a customer call for the agent's own notes, answering fixed-deposit questions in the app, and drafting decisions on loan penalty waivers. How should the design differ across them?"
options:
  - { id: a, text: "Put the same confirm step on all three so the design stays consistent" }
  - { id: b, text: "Label all three as AI and skip confirm steps, so users can judge for themselves" }
  - { id: c, text: "Add the most checks to the app answers, since customers see them directly" }
  - { id: d, text: "A label on notes, sources on deposit answers, human approval on waivers" }
correct: d
explanation: "Friction should follow the cost of a mistake: notes are low stakes, customer answers are medium, and a money decision is high. A uniform confirm step looks safe but teaches people to click through it, which is automation bias, and customer visibility alone does not make the app answers the highest stakes."
