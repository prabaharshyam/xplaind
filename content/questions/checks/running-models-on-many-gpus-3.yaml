id: running-models-on-many-gpus-3
stop_id: running-models-on-many-gpus
stem: "A Gurugram team plans to self-host a mixture-of-experts model with 235B total and 22B active parameters, at 8-bit, on 80 GB GPUs (about 72 GB usable each). What is the fewest GPUs that can hold one copy, before any KV cache?"
options:
  - { id: a, text: "One, as only about 22 GB of weights run per token" }
  - { id: b, text: "Four, as all 235 GB of experts must be in memory" }
  - { id: c, text: "Two, as idle experts can wait in the CPU's memory" }
  - { id: d, text: "Eight, as each active expert needs a GPU of its own" }
correct: b
explanation: "Memory follows total parameters, because the next token may need any expert, so 235 GB needs at least 4 GPUs of 72 GB usable. One GPU is tempting because compute per token follows the 22B active parameters, but every expert must still be loaded."
