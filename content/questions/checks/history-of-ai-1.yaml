id: history-of-ai-1
stop_id: history-of-ai
stem: "An agri-startup in Coimbatore built a fertiliser adviser from 400 if-then rules written with one senior agronomist. It did well on test farms near the city but gives poor advice in a new district with different soil and rainfall. What does AI's history suggest is the real problem?"
options:
  - { id: a, text: "It has too few rules; a few hundred more would make it reliable in every district" }
  - { id: b, text: "It was trained on too little data, so it should be retrained on the new district" }
  - { id: c, text: "Its rules hold one expert's local cases; new districts bring exceptions nobody wrote" }
  - { id: d, text: "Rules are a dead approach; a chat assistant would advise farmers reliably without checks" }
correct: c
explanation: "Rule systems only know the cases their authors wrote down, so a new setting with new exceptions breaks them, just as expert systems broke outside the lab. Adding more rules is tempting, but rules start to clash and unseen cases still slip through; retraining does not apply because the system never learned from data."
