id: batching-model-tiering-1
stop_id: batching-model-tiering
stem: "A Kota test-prep app gets 60,000 practice essays by 10 pm and must email feedback by 7 am. It also runs a live doubt-solving chat. Which plan cuts cost safely?"
options:
  - { id: a, text: "Batch both the essays and the chat, since batching halves the price of each" }
  - { id: b, text: "Run the essays in real time, because a batch can take up to 24 hours" }
  - { id: c, text: "Batch the essays at 10 pm, and send any unfinished at 5 am in real time" }
  - { id: d, text: "Batch the essays, and resubmit the whole batch if any single item fails" }
correct: c
explanation: "The essays can wait hours, so batching halves their cost, and a 5 am real-time fallback covers the rare item that is slow or expires. Batching the chat is the tempting mistake: students are waiting for those answers."
