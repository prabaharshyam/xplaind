id: chat-assistants-whatsapp-1
stop_id: chat-assistants-whatsapp
stem: "A Pune coaching centre's WhatsApp bot calls the model before its webhook returns. Replies take about 15 seconds, and students sometimes get the same answer twice. What is the best fix?"
options:
  - { id: a, text: "Move to a faster model and a bigger server so each webhook call finishes sooner" }
  - { id: b, text: "Skip any incoming message whose text matches the student's previous message" }
  - { id: c, text: "Return 200 at once, run the model in the background, skip repeated message ids" }
  - { id: d, text: "Return an error status when a reply is slow, so Meta stops sending it again" }
correct: c
explanation: "Meta retries any delivery that does not get a quick 200, so the fix is to acknowledge first, work afterwards and deduplicate by message id. A faster model only shrinks the gap: one slow call still causes a retry, and an error status makes Meta retry more, not less."
