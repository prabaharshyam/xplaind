stop_id: ai-powered-attacks
stem: "What does a DMARC policy of p=reject on your domain do?"
options:
  - { id: a, text: "Blocks all email from outside the company" }
  - { id: b, text: "Tells receiving servers to reject mail claiming to be from your domain that fails SPF and DKIM" }
  - { id: c, text: "Detects AI-written text in emails" }
  - { id: d, text: "Stops lookalike domains such as your-company.co from being registered" }
correct: b
explanation: "DMARC stops attackers spoofing your exact domain. It does not stop lookalike domains, which need separate monitoring and warnings."
