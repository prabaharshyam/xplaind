id: history-of-ai-2
stop_id: history-of-ai
stem: "A health-tech team in Hyderabad has a promising new neural network design for reading chest X-rays, but only 2,000 labelled images and one laptop to train on. Based on how deep learning took off, what is most likely to hold them back?"
options:
  - { id: a, text: "Too little labelled data and computing power, which held networks back before 2012" }
  - { id: b, text: "Neural networks are an idea that failed in the 1960s and was dropped for good" }
  - { id: c, text: "They have not written enough if-then rules from radiologists for the network to follow" }
  - { id: d, text: "Neural networks only work on text, since they became useful through the transformer" }
correct: a
explanation: "Neural networks needed far more data and arithmetic than existed until about 2010; the 2012 breakthrough came when an old idea met over a million labelled photos and GPUs. The idea was never dropped for good, networks learn from examples rather than rules, and they beat other methods on images in 2012, years before the 2017 transformer."
