id: project-tooling-2
stop_id: project-tooling
stem: "Rahul adds httpx>=0.28 to pyproject.toml by hand and pushes. CI, which runs uv sync --locked, fails: the lockfile needs to be updated. What should the team do?"
options:
  - { id: a, text: "Run uv lock, check the diff, and commit uv.lock with pyproject.toml" }
  - { id: b, text: "Change CI to plain uv sync so the lock file updates itself on every run" }
  - { id: c, text: "Delete uv.lock from the repository, since pyproject.toml lists versions" }
  - { id: d, text: "Pin every package with == in pyproject.toml so no lock file is needed" }
correct: a
explanation: "The --locked failure did its job: it caught a lock that no longer matches pyproject.toml. Dropping --locked hides the problem, because each CI run could then test versions that were never committed or reviewed."
drafted_with_ai: true
reviewed_by: "Shyam Prabahar"
