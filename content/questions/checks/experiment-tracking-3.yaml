id: experiment-tracking-3
stop_id: experiment-tracking
stem: "A Chennai bank's scoring service loads models:/credit-risk@champion when it starts. On Monday the team finds version 22 is rejecting too many self-employed applicants, so they point the champion alias back to version 21. An hour later the logs still show version 22 making decisions. What is the most likely reason?"
options:
  - { id: a, text: "Rollback needs version 21 registered again as a new version before the alias can use it" }
  - { id: b, text: "Aliases are meant for testing; production should use the Production stage instead" }
  - { id: c, text: "The alias moved only in the UI; it also has to be changed in the training script" }
  - { id: d, text: "The service loaded the model once at start-up, so it must reload or restart" }
correct: d
explanation: "Moving an alias changes the registry at once, but a running process keeps the model it loaded at start-up until it reloads. Switching to stages is the tempting fix, yet MLflow deprecated stages in favour of aliases, and a stage would have the same reload problem."
drafted_with_ai: true
