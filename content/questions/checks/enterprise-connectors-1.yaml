id: enterprise-connectors-1
stop_id: enterprise-connectors
stem: "Your nightly job re-reads all 200,000 SharePoint files and is being throttled. What should you change?"
options:
  - { id: a, text: "Run it more often" }
  - { id: b, text: "Use incremental sync with change tokens (delta queries) so only changes are fetched" }
  - { id: c, text: "Request admin rights" }
  - { id: d, text: "Disable rate limits" }
correct: b
explanation: "Incremental sync fetches only what changed, avoiding throttling and cost."
