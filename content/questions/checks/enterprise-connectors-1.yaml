id: enterprise-connectors-1
stop_id: enterprise-connectors
stem: "Your SharePoint connector for a Hyderabad insurer processes Graph delta pages. On page 40 of 120, two of the 200 items fail to parse, and the rest succeed. What should the connector save before it requests page 41?"
options:
  - { id: a, text: "Nothing yet; save the final delta link once all 120 pages succeed" }
  - { id: b, text: "The link to page 41, but only if every item on page 40 succeeded" }
  - { id: c, text: "The link to page 41 plus the ids of the two failed items" }
  - { id: d, text: "The final delta link now, so that the next run starts from here" }
correct: c
explanation: "Saving the next link with a retry list lets a crash resume at page 41 while the two failed items are retried, not skipped. Saving nothing until the end looks safe, but a crash on page 119 would restart the whole load from page 1."
