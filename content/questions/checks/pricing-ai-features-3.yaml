id: pricing-ai-features-3
stop_id: pricing-ai-features
stem: "A Kochi startup sells an AI study plan to consumers at ₹499 a month including 18% GST. Each user costs $3.50 a month in model fees. A year ago, at ₹88.7 to the dollar, the founder worked out a margin of 38%. Suppose the rupee is now ₹94 and the gateway takes 2% of each payment. What is the margin now?"
options:
  - { id: a, text: "Still about 38%, since the plan price has not changed" }
  - { id: b, text: "About 34%, from ₹499 minus the new ₹329 model cost" }
  - { id: c, text: "About 27%, from ₹423 before GST minus the ₹310 cost" }
  - { id: d, text: "About 20%: ₹413 kept, less ₹329 of model cost" }
correct: d
explanation: "Without the 18% GST and the ₹10 gateway fee, the startup keeps about ₹413, and $3.50 now costs ₹329, leaving about ₹84, or 20%. The tempting 34% uses the new exchange rate but still counts GST as revenue."
