id: scoping-automation-2
stop_id: scoping-automation
stem: "A Pune CA firm's automation turns bank statement PDFs from two named banks into Tally import files. The scope gives 30 days of free fixes and prices changes at a day rate. In week two of support, four requests arrive. Which one is a free fix?"
options:
  - { id: a, text: "Statements over ten pages import only the entries from the first ten" }
  - { id: b, text: "A new client banks elsewhere, and the firm wants those statements read too" }
  - { id: c, text: "The partners want a weekly email that lists every large cash withdrawal" }
  - { id: d, text: "The firm moved to a newer Tally release, which rejects the agreed format" }
correct: a
explanation: "Losing entries from long statements means the system does not do what the scope promised, so it is a fix. The Tally upgrade feels like a breakage, but the cause is a change on the client's side to an agreed format, so it is a change request."
