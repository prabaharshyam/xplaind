id: perplexity-and-cross-entropy-2
stop_id: perplexity-and-cross-entropy
stem: "Two models with different tokenizers report perplexity 9 and 14 on the same text. What is the fair comparison?"
options:
  - { id: a, text: "The model with 9 is better" }
  - { id: b, text: "Convert both to bits per byte on that text" }
  - { id: c, text: "Average the two numbers" }
  - { id: d, text: "Compare their parameter counts" }
correct: b
explanation: "Per-token perplexity depends on how text is split. Bits per byte divides by the same text length for both, so it is comparable."
