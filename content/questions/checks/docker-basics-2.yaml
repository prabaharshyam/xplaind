id: docker-basics-2
stop_id: docker-basics
stem: "Why copy pyproject.toml and the lock file before copying the source code in a Dockerfile?"
options:
  - { id: a, text: "Docker requires that order" }
  - { id: b, text: "So code changes do not invalidate the cached dependency layer, making rebuilds fast" }
  - { id: c, text: "It makes the image more secure" }
  - { id: d, text: "To reduce the number of files" }
correct: b
explanation: "Layers are cached until their inputs change. Installing dependencies before copying code keeps that slow layer cached."
