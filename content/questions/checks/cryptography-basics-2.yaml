stem: "What does a browser check in a website's TLS certificate?"
options:
  - { id: a, text: "That the site has no vulnerabilities" }
  - { id: b, text: "That the site's owner is a registered Indian company" }
  - { id: c, text: "That the page loads quickly" }
  - { id: d, text: "That a trusted certificate authority signed it for this domain name and it is within its validity dates" }
correct: d
explanation: "A certificate binds a domain name to a public key, signed by a trusted CA. It proves who you are talking to, not that the site is safe or honest."
