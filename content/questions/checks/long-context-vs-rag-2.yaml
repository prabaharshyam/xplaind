id: long-context-vs-rag-2
stop_id: long-context-vs-rag
stem: "A Mumbai insurer asks its assistant: \"Which of our 2,000 active group policies cite the claims rule that the 2025 circular replaced?\" The answer needs the circular first, to learn which rule it replaced, and then a search of the policies for that rule number. The policies total about 80 million tokens. Which approach fits best?"
options:
  - { id: a, text: "Agentic search: find the circular, see which rule it replaced, then search for that rule." }
  - { id: b, text: "One RAG search using the question as the query, sending the top 10 chunks to the model." }
  - { id: c, text: "Put all 2,000 policies into one long context window and ask the question a single time." }
  - { id: d, text: "Fine-tune a model on all the policies so it remembers which rules each policy cites." }
correct: a
explanation: "The second search depends on what the first one finds, and the question never names the rule number, so a single RAG query misses it. Long context fails on scale: 80 million tokens is 80 times a 1-million-token window."
