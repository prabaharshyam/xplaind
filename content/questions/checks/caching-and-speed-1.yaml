id: caching-and-speed-1
stop_id: caching-and-speed
stem: "A Bengaluru edtech support bot sends a 6,000-token system prompt to Claude Sonnet 5.5 with a cache breakpoint at its end. The prompt opens with \"Current time: 14:32:07 IST\", then the course rules. Logs show cache_read_input_tokens is 0 on every request, even seconds apart. What is the most likely cause?"
options:
  - { id: a, text: "The student's question differs on every request, so the cache never matches" }
  - { id: b, text: "The default 5-minute cache is too short; it only works with the 1-hour lifetime" }
  - { id: c, text: "The time at the very top changes each request, so no prefix ever repeats" }
  - { id: d, text: "A 6,000-token prompt is below the minimum length Claude will cache" }
correct: c
explanation: "The cache matches an exact prefix, so a timestamp in the first line makes every request different from its first bytes. The question comes after the breakpoint and does not matter, and 6,000 tokens is well above the 512-token minimum on current models."
