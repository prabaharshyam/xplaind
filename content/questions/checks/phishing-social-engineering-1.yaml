id: phishing-social-engineering-1
stop_id: phishing-social-engineering
stem: "A supplier's genuine but compromised mailbox emails your accounts team asking to pay an invoice to a new bank account. Which control is most likely to stop the fraud?"
options:
  - { id: a, text: "A DMARC record set to p=reject on your own domain" }
  - { id: b, text: "Calling the supplier on the number already on file and having a second person approve the bank change" }
  - { id: c, text: "Checking the email for spelling mistakes" }
  - { id: d, text: "Blocking all emails with attachments" }
correct: b
explanation: "This is business email compromise from a real account, so it passes SPF, DKIM and DMARC and may be perfectly written. A callback on a known number plus a second approver breaks the scam."
