id: ai-supply-chain-2
stop_id: ai-supply-chain
stem: "You tested a Hugging Face model last month. How do you make sure production loads exactly the same files?"
options:
  - { id: a, text: "Always download the latest version" }
  - { id: b, text: "Check that the model still has many likes" }
  - { id: c, text: "Pin the download to the repository's full commit hash and record the file hashes" }
  - { id: d, text: "Rename the model folder" }
correct: c
explanation: "A repository can change after you test it. A commit hash and file hashes make what you tested what you run."
