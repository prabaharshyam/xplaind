id: web-apis-json-3
stop_id: web-apis-json
stem: "Rohan's nightly job in Bengaluru makes 500 GET calls to an API. The morning log shows four kinds of failed call. Without any change to the code or the key, which failure is worth retrying automatically with backoff?"
options:
  - { id: a, text: "503 Service Unavailable on 12 calls" }
  - { id: b, text: "401 Unauthorized on every call after midnight" }
  - { id: c, text: "422 Unprocessable on calls with an empty city name" }
  - { id: d, text: "404 Not Found for three station ids" }
correct: a
explanation: "503 means the server is temporarily failing, so the same request may succeed a little later. 401, 422 and 404 mean the request itself is wrong (the key, the input or the id), so repeating it unchanged gets the same error and only wastes calls."
