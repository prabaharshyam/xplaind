id: ai-pm-interviews-2
stop_id: ai-pm-interviews
stem: "A health-insurance claims assistant in Hyderabad scored 93% correct on 400 labelled past claims, above the agreed 90% bar. In 2 of the 400 cases it auto-rejected a valid hospitalisation claim. The business head wants to launch next week. What is the strongest PM response?"
options:
  - { id: a, text: "Hold: rejecting a valid claim is a critical error; send rejections to a person, re-test" }
  - { id: b, text: "Launch: 93% beats the agreed bar, and 2 errors in 400 is only half a percent of claims" }
  - { id: c, text: "Switch to the largest model on offer, because a bigger model will remove these rare errors" }
  - { id: d, text: "Add 400 more labelled claims, and launch if the overall score still stays above 90%" }
correct: a
explanation: "An overall score hides which errors happened; denying a valid hospital claim harms a patient, so it needs its own zero-tolerance rule and a human check. Launching on the 93% average is the tempting mistake, and a bigger model or a bigger test set does not fix a missing rule for critical errors."
