id: automation-tools-compared-2
stop_id: automation-tools-compared
stem: "A coaching institute in Kota uses a Make scenario: a polling trigger checks a Google Sheet for new rows every 15 minutes, then three modules act on each new row. Assume Make charges one credit for every trigger check, even when it finds nothing, and one credit per module for each row. About 600 new rows arrive in a 30-day month. Roughly how many credits does the scenario use?"
options:
  - { id: a, text: "About 4,680 credits" }
  - { id: b, text: "About 2,400 credits" }
  - { id: c, text: "About 1,800 credits" }
  - { id: d, text: "About 2,880 credits" }
correct: a
explanation: "The trigger checks 4 x 24 x 30 = 2,880 times, using a credit each time, and the three modules use 600 x 3 = 1,800 more, so about 4,680 in total. The tempting 2,400 counts four credits per row and forgets that the empty checks cost credits too; an instant webhook trigger would remove most of that cost."
