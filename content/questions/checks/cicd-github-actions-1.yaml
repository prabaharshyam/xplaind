id: cicd-github-actions-1
stop_id: cicd-github-actions
stem: "A Pune team's pull request check runs 20 golden questions and fails below 0.85. The same unchanged pull request scored 0.85 and passed, then scored 0.80 and failed on a rerun. What is the best fix?"
options:
  - { id: a, text: "Lower the threshold to 0.70 so normal noise never fails it" }
  - { id: b, text: "Rerun the whole eval job automatically until it passes" }
  - { id: c, text: "Move the eval to nightly only and drop it from pull requests" }
  - { id: d, text: "Use 50 cases at temperature 0 and compare with main's score" }
correct: d
explanation: "With 20 questions, one flipped answer moves the score by 5 points, so the gate is measuring noise. More cases, temperature 0 and a comparison with main make a real drop stand out. A lower threshold stops the flaking but also lets real regressions through."
