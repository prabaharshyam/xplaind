id: ai-threat-modeling-3
stop_id: ai-threat-modeling
stem: "A chatbot's balance tool takes the account number from what the customer types. What is the right fix?"
options:
  - { id: a, text: "Add \"never show other customers' balances\" to the system prompt" }
  - { id: b, text: "Use a bigger model that follows rules better" }
  - { id: c, text: "Log the requests and review them monthly" }
  - { id: d, text: "Make the tool take the customer ID from the logged-in session, never from the chat" }
correct: d
explanation: "This is a design flaw. A prompt line is a request, not a control. Binding the tool to the session removes the threat whatever the model does."
