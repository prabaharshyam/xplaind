stem: "A lending app run for an RBI-registered NBFC asks Meena for access to her contacts, photos and location. Under RBI's digital lending rules, what is allowed?"
options:
  - { id: a, text: "All three, as long as she clicks to give consent" }
  - { id: b, text: "Contacts only, to find references if she stops paying" }
  - { id: c, text: "None of them, until the DPDP Act applies in May 2027" }
  - { id: d, text: "Location once for KYC, not contacts or photos" }
correct: d
explanation: "The rules bar lenders' apps from contacts, files and media, and allow one-time camera, microphone or location access only for onboarding or KYC. Consent does not unlock contacts, and these RBI rules already apply without waiting for the DPDP Act."
