id: scope-of-work-2
stop_id: scope-of-work
stem: "At a Hyderabad hospital chain, the procurement head will sign the SOW for a discharge-summary assistant, because procurement holds the vendor budget. The medical director will decide whether the work is good enough. What should you do before signing?"
options:
  - { id: a, text: "Let procurement sign and also accept, since they own the contract" }
  - { id: b, text: "Show the medical director a demo once the pilot is under way" }
  - { id: c, text: "Replace procurement's signature with the medical director's" }
  - { id: d, text: "Name the medical director as acceptance authority, in writing" }
correct: d
explanation: "Procurement can sign the contract, but the medical director must be named as acceptance authority and agree the criteria in writing first. Swapping signatures is tempting, but procurement usually must sign for the budget; you add the acceptor rather than remove the signer."
