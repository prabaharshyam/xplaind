id: checking-ai-answers-1
stop_id: checking-ai-answers
stem: "Divya, an HR assistant in Hyderabad, has four AI answers to send out today and only 30 minutes to check them. Only the third contains a rule or a figure. Which one deserves most of that time?"
options:
  - { id: a, text: "The welcome email for new joiners, as the whole office will read it" }
  - { id: b, text: "The 20-slide training deck, as it is the longest answer of the four" }
  - { id: c, text: "The notice-period figure, as an employee will resign based on it" }
  - { id: d, text: "The team-lunch venue list, as the assistant sounded least sure of it" }
correct: c
explanation: "Stakes depend on who acts on a claim and whether a mistake can be undone, and only the notice period is a figure someone will act on. A wide audience feels important, but a welcome email with no rules or figures in it carries little risk and can be corrected later."
