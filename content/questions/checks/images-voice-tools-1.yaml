id: images-voice-tools-1
stop_id: images-voice-tools
stem: "Priya in Pune runs an AI transcription on a Hinglish voice note from her wedding caterer. The neat transcript says to pay an advance of ₹15,000 by Friday and the balance on the 12th. What should she do before paying?"
options:
  - { id: a, text: "Ask the AI tool to transcribe the same note again for a cleaner version" }
  - { id: b, text: "Pay as written, since a clean and fluent transcript means the tool heard well" }
  - { id: c, text: "Replay the note at the amount and dates, then confirm them with the caterer" }
  - { id: d, text: "Translate the transcript into English first, which removes the Hinglish errors" }
correct: c
explanation: "Speech-to-text most often goes wrong on numbers, dates and mixed-language speech, and fifteen and fifty sound alike, so the audio and the caterer are the real check. A fluent transcript only shows the tool wrote confidently, not that it heard the amount correctly."
drafted_with_ai: true
