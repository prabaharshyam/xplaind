id: agent-failures-2
stop_id: agent-failures
stem: "A Hyderabad travel agency's agent books 12 hotel rooms for a wedding group. It replies 'All 12 rooms are booked', but three booking calls had returned errors and the hotel's system shows only 9 bookings. Which guard would have caught this before the customer saw it?"
options:
  - { id: a, text: "Count the bookings in the hotel system after the run and compare with 12" }
  - { id: b, text: "Ask the agent to double-check its own answer once before it replies" }
  - { id: c, text: "Add 'never claim success unless sure' to the system prompt in capitals" }
  - { id: d, text: "Raise the step cap so the agent has more time to retry each failed booking" }
correct: a
explanation: "Checking the system of record in code catches a false claim of success whatever the model believes. Asking the agent to re-check itself is tempting, but it reads the same context that produced the wrong claim, so it can confirm the same mistake."
