id: checking-ai-answers-3
stop_id: checking-ai-answers
stem: "Neha, who runs a tuition centre in Kolkata, pastes in 14 fee receipts and asks an assistant for the month's total. It gives ₹2,46,380 and, when asked, shows neat step-by-step working. What is the best check?"
options:
  - { id: a, text: "Add them up in a spreadsheet, and accept the total if it matches" }
  - { id: b, text: "Read the working, and accept the total if every step looks right" }
  - { id: c, text: "Ask it to double-check, and accept the total if it does not change" }
  - { id: d, text: "Ask again in a new chat, and accept the total if both chats match" }
correct: a
explanation: "Recomputing from the receipts is the only independent check of the number. The step-by-step working is tempting, but it is generated text too and may not show how the total was really produced; a self-check or a second chat is the same system again."
drafted_with_ai: true
