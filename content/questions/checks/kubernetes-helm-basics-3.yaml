stem: "A colleague fixed production with kubectl edit. Why is that a problem?"
options:
  - { id: a, text: "kubectl edit is slow" }
  - { id: b, text: "The next Helm upgrade overwrites the change, and nobody has a record of it" }
  - { id: c, text: "It deletes the pod" }
  - { id: d, text: "It is not allowed by Kubernetes" }
correct: b
explanation: "Changes must go into the chart and version control, or they vanish and cannot be reviewed."
