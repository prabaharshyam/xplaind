id: agent-budgets-kill-switches-2
stop_id: agent-budgets-kill-switches
stem: "A Jaipur travel startup is adding limits to its itinerary agent. Over the last month, 95% of tasks finished within 9 steps and ₹3, and the feature's busiest normal day cost ₹6,000. Which set of limits fits these numbers best?"
options:
  - { id: a, text: "About 20 steps and ₹6 per task; a ₹12,000 daily feature cap" }
  - { id: b, text: "9 steps and ₹3 per task, and a ₹6,000 daily feature cap" }
  - { id: c, text: "100 steps and ₹50 per task, so that no real task is ever cut off" }
  - { id: d, text: "No per-task cap, and a provider limit equal to the monthly budget" }
correct: a
explanation: "Caps at about twice what real runs need stop runaways without cutting off normal work. Capping at exactly the 95th percentile and the busiest day would stop one task in twenty and every unusually busy day."
