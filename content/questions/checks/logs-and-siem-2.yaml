id: logs-and-siem-2
stop_id: logs-and-siem
stem: "A rule fires 300 times a day and almost every alert is the nightly backup service logging in. What is the best fix?"
options:
  - { id: a, text: "Delete the rule so analysts are not disturbed" }
  - { id: b, text: "Hire more analysts to close the alerts faster" }
  - { id: c, text: "Tune the rule with a narrow exception for the backup service's known account, host and time, and keep alerting on everything else" }
  - { id: d, text: "Turn off logging for the backup server" }
correct: c
explanation: "This is alert fatigue. A narrow, documented exception removes the known-good noise while the rule still catches real attacks. Deleting the rule or the logs leaves a blind spot."
