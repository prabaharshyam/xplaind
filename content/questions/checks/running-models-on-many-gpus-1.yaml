id: running-models-on-many-gpus-1
stop_id: running-models-on-many-gpus
stem: "Your model fits comfortably on one GPU, but you need to serve more users. What should you do?"
options:
  - { id: a, text: "Split it with tensor parallelism" }
  - { id: b, text: "Run more copies (replicas) behind a load balancer" }
  - { id: c, text: "Use pipeline parallelism" }
  - { id: d, text: "Use a bigger model" }
correct: b
explanation: "Replicas are simplest when the model fits: each copy serves different requests and one failure does not stop the service."
