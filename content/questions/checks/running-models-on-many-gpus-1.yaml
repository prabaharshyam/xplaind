id: running-models-on-many-gpus-1
stop_id: running-models-on-many-gpus
stem: "A Chennai bank will serve a 70B model at 8-bit (about 70 GB of weights) with about 30 GB of busy-hour KV cache. Each server has eight 48 GB GPUs, about 43 GB usable each, and the model has 64 attention heads. What is the smallest tensor-parallel size that works?"
options:
  - { id: a, text: "2 GPUs, because the 70 GB of weights fit in 96 GB" }
  - { id: b, text: "3 GPUs, the fewest whose memory covers the 100 GB" }
  - { id: c, text: "4 GPUs, because 3 does not divide the 64 heads" }
  - { id: d, text: "8 GPUs, because tensor parallelism uses the whole server" }
correct: c
explanation: "The copy needs about 100 GB: 3 GPUs give about 129 GB usable, but the tensor-parallel size must divide the 64 attention heads, so the engine will not start on 3. Two GPUs is the tempting answer, but it forgets the KV cache and the 10% spare memory: 86 GB usable is less than 100 GB."
