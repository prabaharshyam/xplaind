id: python-basics-dict
stop_id: python-basics
stem: Which line adds the key "city" with the value "Pune" to a dictionary named profile?
options:
  - { id: a, text: "profile.add('city', 'Pune')" }
  - { id: b, text: "profile['city'] = 'Pune'" }
  - { id: c, text: "profile = 'city': 'Pune'" }
  - { id: d, text: "profile.append('city', 'Pune')" }
correct: b
explanation: You set a dictionary key with square brackets and an equals sign. Dictionaries have no add or append method for a single key.
