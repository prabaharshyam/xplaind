id: llm-app-threats-2
stop_id: llm-app-threats
stem: "A chatbot's system prompt says which customers get a special discount. Why is this a problem?"
options:
  - { id: a, text: "It makes the prompt too long" }
  - { id: b, text: "Discounts are not allowed in India" }
  - { id: c, text: "Users can extract the prompt and talk the model into applying the rule; such rules belong in code" }
  - { id: d, text: "It is not a problem if the prompt says 'keep this secret'" }
correct: c
explanation: "System prompt leakage: assume the prompt will be read. Secrets and business rules such as discounts and access must be enforced in code, not by the model."
