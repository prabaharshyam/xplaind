id: model-merging-2
stop_id: model-merging
stem: "A Chennai insurer merges three adapters with TIES. Claim triage and email drafting stay within their bar, but policy-number extraction falls from 97% to 86%. The bar is no task more than 2 points below its separate adapter. What should the team do first?"
options:
  - { id: a, text: "Raise the extraction weight, retest on a dev set, and keep extraction separate if it fails." }
  - { id: b, text: "Ship the merge, because the average score across the three tasks has dropped by only a few points." }
  - { id: c, text: "Tune density on the extraction test set until it scores 97% again, then ship the merged model." }
  - { id: d, text: "Give up on merging and retrain one multi-task model from scratch on all three datasets right away." }
correct: a
explanation: "Re-weighting the task that dropped is cheap, and keeping a precise task as its own model is the fallback when the merge still misses the bar. Option b judges by the average, which hides a large drop on one task that the bar exists to catch."
