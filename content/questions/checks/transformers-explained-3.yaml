id: transformers-explained-3
stop_id: transformers-explained
stem: "A Hyderabad startup self-hosts an 8B open model (32 layers, 8 key-value heads) on a 24 GB GPU; the 16-bit weights take 16 GB, and the server already uses an efficient attention kernel. Two users with short chats work fine. When 20 users each upload an 8,000-token contract, the server runs out of memory. What is filling the GPU?"
options:
  - { id: a, text: "A copy of the 16 GB of model weights that is loaded separately for every user" }
  - { id: b, text: "The full 8,000 by 8,000 attention score matrix, kept in memory for each user" }
  - { id: c, text: "Extra parameters that switch on for long prompts, as in a mixture-of-experts model" }
  - { id: d, text: "The key-value cache, which grows with the number of tokens times users" }
correct: d
explanation: "Weights are shared by all users, but every token of every chat keeps its keys and values: about 0.13 MB per token here, so 20 users at 8,000 tokens need about 21 GB on top of the weights. The efficient kernel already avoids storing the full score matrix, and it does not shrink the KV cache."
