id: ai-red-teaming-3
stop_id: ai-red-teaming
stem: "Why combine manual red teaming with tools like PyRIT, garak and promptfoo?"
options:
  - { id: a, text: "People find new, context-specific attacks; tools run large sets of known attacks repeatably" }
  - { id: b, text: "Tools are only for reports, and people do all the real testing" }
  - { id: c, text: "Manual testing is needed only when tools are too expensive" }
  - { id: d, text: "Tools replace the need for a threat model" }
correct: a
explanation: "Each covers the other's gaps. Tools give scale and repeatability; people bring creativity, languages and business knowledge."
