id: serving-ai-apps-1
stop_id: serving-ai-apps
stem: "A Pune team's tutoring API sets the Anthropic SDK to timeout=30 and max_retries=2, has no other deadline, and sits behind a load balancer with a 60-second limit. During a provider slowdown, students get blank 504 errors from the load balancer instead of the app's friendly \"please try again\" message. What is the best fix?"
options:
  - { id: a, text: "Raise the load balancer limit to 120 seconds so the SDK's retries have time to finish" }
  - { id: b, text: "Lower the SDK timeout to 5 seconds, because that timeout caps the whole model call" }
  - { id: c, text: "Wrap the whole call in a 25-second deadline with at most one retry inside it" }
  - { id: d, text: "Run more Uvicorn workers so that slow model calls stop blocking each other" }
correct: c
explanation: "The SDK timeout applies per attempt and per chunk, so two retries can push one call past the balancer's limit; one deadline below that limit, with retries inside it, lets the app answer first. Raising the balancer limit only makes students wait longer for the same failure."
