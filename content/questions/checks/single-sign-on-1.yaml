id: single-sign-on-1
stop_id: single-sign-on
stem: "Which token tells your app who the signed-in user is in OpenID Connect?"
options:
  - { id: a, text: "The access token" }
  - { id: b, text: "The ID token" }
  - { id: c, text: "The refresh token" }
  - { id: d, text: "The API key" }
correct: b
explanation: "The ID token carries the user's identity and claims; access tokens are for calling APIs."
