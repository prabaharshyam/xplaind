id: environments-secrets-terraform-2
stop_id: environments-secrets-terraform
stem: "A Bengaluru team generates the Postgres admin password with random_password, passes it to administrator_password, and marks the output sensitive = true. State is in a locked Azure storage container. A security reviewer flags a problem. What is it?"
options:
  - { id: a, text: "The password sits in plain text in state, so anyone who can read the state blob can read it" }
  - { id: b, text: "The password shows in plan output in CI logs, and sensitive = true does not hide it there" }
  - { id: c, text: "Nothing is exposed, because state is in encrypted cloud storage and the output is marked sensitive" }
  - { id: d, text: "The password is committed to Git, because Terraform writes generated values into the .tf files" }
correct: a
explanation: "Terraform stores resource attributes, including generated passwords, in state; sensitive = true only hides them from the screen. Storage encryption protects the disk, not people with read access to the state, so use managed identity sign-in or a write-only argument instead."
