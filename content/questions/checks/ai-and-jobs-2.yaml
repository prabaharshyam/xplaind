id: ai-and-jobs-2
stop_id: ai-and-jobs
stem: "A news report says more than half of the tasks in bank call-centre jobs are exposed to AI. Your cousin, who works in one in Chennai, concludes that half of those jobs will soon be gone. What is the most accurate reply?"
options:
  - { id: a, text: "He is going too far, because exposure is what AI could do, not what employers will do" }
  - { id: b, text: "He is right, because an exposure score is the share of jobs that AI is going to remove" }
  - { id: c, text: "He is safe, because banks are regulated, so AI cannot change call-centre work at all" }
  - { id: d, text: "He is safe, because the new AI jobs will absorb everyone whose tasks AI takes over" }
correct: a
explanation: "Exposure measures possibility, not loss: a task is handed to AI only when it is good enough, cheaper, safe if wrong and allowed, and the team size also depends on demand. The tempting answer b treats an exposure score as a forecast; c and d swing to the opposite mistake of assuming no one is affected."
