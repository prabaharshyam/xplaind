id: long-context-vs-rag-1
stop_id: long-context-vs-rag
stem: "A Bengaluru legal-tech startup sends each user's 50,000-token contract, placed first, with every question, and turns on prompt caching with the default 5-minute lifetime. Users usually read each answer for about 15 minutes before asking the next question. The input bill goes up, not down. What is the most likely cause?"
options:
  - { id: a, text: "Caching works only for system prompts, so a contract in a user message is never cached." }
  - { id: b, text: "A 50,000-token contract is too long to cache, so every call is billed as normal input." }
  - { id: c, text: "The cache expires between questions, so every call pays the cache-write premium again." }
  - { id: d, text: "Cache reads cost the full input price; caching only makes the first token arrive sooner." }
correct: c
explanation: "The 5-minute cache resets only on a hit, so with 15-minute gaps every call is a fresh write at 1.25 times the input price. Moving the contract into the system prompt would not help; the fix is the 1-hour lifetime or questions closer together."
