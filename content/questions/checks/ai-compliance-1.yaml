id: ai-compliance-1
stop_id: ai-compliance
stem: "Under the DPDP Act, a bank uses your company's AI system to process its customers' data. What is your company's role?"
options:
  - { id: a, text: "Data principal" }
  - { id: b, text: "Data processor acting for the bank, which is the data fiduciary" }
  - { id: c, text: "Data Protection Board" }
  - { id: d, text: "Consent manager" }
correct: b
explanation: "The bank decides why and how; your company processes on its behalf."
