id: data-model-poisoning-2
stop_id: data-model-poisoning
stem: "An attacker edits a wiki page that a company's RAG assistant retrieves, adding a false refund rule. What is the most direct control?"
options:
  - { id: a, text: "Retrain the language model from scratch" }
  - { id: b, text: "Raise the model's temperature" }
  - { id: c, text: "Limit who can edit indexed sources, review changes and log edits" }
  - { id: d, text: "Add more documents to the knowledge base" }
correct: c
explanation: "RAG poisoning needs no retraining. It goes through the documents, so access control, review and edit logs on those sources are the main defence."
