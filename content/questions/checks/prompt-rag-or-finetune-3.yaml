id: prompt-rag-or-finetune-3
stop_id: prompt-rag-or-finetune
stem: "A Hyderabad fintech tags 10 lakh support tickets a month with a large model and a 2,000-token prompt sent fresh on every call. A vendor quotes ₹5 lakh to fine-tune a small model that would cut today's bill by 90%. What should the team do first?"
options:
  - { id: a, text: "Fine-tune now, since a 90% cut in the current bill pays back the build within weeks" }
  - { id: b, text: "Add RAG over past tickets so the prompt can drop most of its examples" }
  - { id: c, text: "Wait to fine-tune until they have ten times more labelled tickets, to be safe" }
  - { id: d, text: "Cache the prompt, test a small model, then redo the break-even from that baseline" }
correct: d
explanation: "Caching a repeated prompt and trying a smaller model can cut the bill by most of that 90% in a day, so the fine-tune's real saving is against that cheaper baseline. Pricing it against the uncached bill makes almost any fine-tune look as if it pays back in weeks."
