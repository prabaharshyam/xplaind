stem: "A Bengaluru team trains a monthly-rent model on listings from January 2024 to October 2026 with a random 80/20 split. Test MAE is ₹1,900. In the first month live, MAE is ₹3,400. What is the most likely cause?"
options:
  - { id: a, text: "The model is too simple, so a deeper boosted model will fix it" }
  - { id: b, text: "The 20% test set was too small to give a stable MAE figure" }
  - { id: c, text: "The model needs a stronger ridge penalty to stop overfitting" }
  - { id: d, text: "Rents drift and a random split hid it; test on recent months" }
correct: d
explanation: "A random split lets the model see every month's rent level, so the test error looks better than the future will be. A more complex model is the tempting fix, but it would be judged by the same leaky split."
