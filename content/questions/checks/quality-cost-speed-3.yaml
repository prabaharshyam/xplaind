stop_id: quality-cost-speed
stem: "A Pune team's HR assistant must reach 90% on a 300-question gate set before launch. It first scored 84%. Over two weeks the team rewrote the prompt after studying every failed gate question, and it now scores 91% on the same set. What should they do next?"
options:
  - { id: a, text: "Score it once on fresh questions; treat the 91% as optimistic" }
  - { id: b, text: "Launch now, since 91% clears the 90% bar with a point to spare" }
  - { id: c, text: "Add the failed questions to the prompt as examples, then rescore" }
  - { id: d, text: "Run the same 300 questions three more times and average them" }
correct: a
explanation: "The prompt was fitted to the gate questions, so 91% on that set overstates real quality; only fresh questions nobody tuned on give a fair score. Launching on the 91% is tempting, but the set stopped being a gate once the team studied its failures."
