id: ai-cost-of-ownership-1
stop_id: ai-cost-of-ownership
stem: "A Pune fintech's support bot handles 200,000 requests a month. Traces show 2,000 input and 500 output tokens per request, one model call each. The model costs an illustrative $2 per million input tokens and $8 per million output tokens, and the team uses ₹93 to the dollar. What is the monthly model bill before caching and GST?"
options:
  - { id: a, text: "About ₹74,400, since input tokens are most of each request" }
  - { id: b, text: "About ₹14.9 crore, pricing every 1,000 tokens at the listed rate" }
  - { id: c, text: "About ₹1.49 lakh, pricing input and output tokens separately" }
  - { id: d, text: "About ₹1,600, adding the token costs without converting dollars" }
correct: c
explanation: "Each request costs 2,000 × $2 ÷ 1,000,000 + 500 × $8 ÷ 1,000,000 = $0.008, about ₹0.74, so 200,000 requests cost about ₹1.49 lakh. The ₹74,400 answer drops the output tokens, which cost four times as much per token and here make up half the bill."
