id: phishing-social-engineering-3
stop_id: phishing-social-engineering
stem: "Generative AI can now write fluent, personalised phishing in any language. Which response makes most sense?"
options:
  - { id: a, text: "Teach staff to look harder for grammar mistakes" }
  - { id: b, text: "Rely more on controls that do not depend on the message looking wrong, such as phishing-resistant MFA, payment callbacks and easy reporting" }
  - { id: c, text: "Stop using email" }
  - { id: d, text: "Allow only messages written in English" }
correct: b
explanation: "When lures look perfect, spotting mistakes stops working. Passkeys or security keys, process checks for money and fast reporting still work however good the message is."
