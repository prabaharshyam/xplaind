id: use-ai-safely-1
stop_id: use-ai-safely
stem: "Your company has not approved any AI tool. A client asks you to summarise their contract quickly. What is the safest choice?"
options:
  - { id: a, text: "Paste the contract into a public chat assistant and ask for a summary" }
  - { id: b, text: "Remove the company name and then paste the full contract" }
  - { id: c, text: "Summarise it yourself, or ask your manager which approved tool to use" }
  - { id: d, text: "Ask a friend to summarise it with their AI account" }
correct: c
explanation: "Unapproved tools may keep what you paste. Removing a name is not enough, because the rest of the contract is still confidential."
drafted_with_ai: true
