id: prompt-rag-or-finetune-2
stop_id: prompt-rag-or-finetune
stem: "A Lucknow university's bot answers students from its 50,000-token exam regulations through RAG, correct on 97% of test questions. Students ask about 40 single-fact questions a day, scattered from morning to midnight. A teammate proposes cached long context to cut cost. What is the best call?"
options:
  - { id: a, text: "Keep RAG, since at 40 scattered questions a day the cache would mostly be cold" }
  - { id: b, text: "Switch to cached long context, since a cache read costs only 5% of normal input" }
  - { id: c, text: "Fine-tune the model on the regulations so each question needs no context at all" }
  - { id: d, text: "Send the whole document uncached, since a 1-million-token window holds it easily" }
correct: a
explanation: "Caching pays only when the same prefix is reused within its lifetime, 5 minutes by default; with questions minutes or hours apart, most calls pay to write the whole document to the cache again. RAG already works on these single-fact questions and sends only a few thousand tokens, so there is nothing to gain."
