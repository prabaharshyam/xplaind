id: executive-communication-1
stop_id: executive-communication
stem: "Your draft memo to a Hyderabad hospital chain's CFO reads: 'Recommendation: roll out the discharge-summary assistant to all 12 hospitals. Doctors save about 2,000 hours a year, worth roughly ₹30 lakh. Running cost: ₹4 lakh a month. Decision needed: approve the budget this week.' What should you fix before sending it?"
options:
  - { id: a, text: "Add the model name and architecture so the CFO trusts the result" }
  - { id: b, text: "Remove the cost line so the memo opens on the benefit, not the spend" }
  - { id: c, text: "Show cost per year: ₹48 lakh against ₹30 lakh of value is a loss" }
  - { id: d, text: "Expand it into a slide deck with a slide for each pilot week" }
correct: c
explanation: "Put value and cost in the same unit: ₹4 lakh a month is ₹48 lakh a year, more than the ₹30 lakh of value, and the CFO will spot it at once. Hiding the cost is tempting, but it fails the same check in the room and costs your credibility."
