id: gpus-quantization-1
stop_id: gpus-quantization
stem: "A Bengaluru startup serves a model whose config.json lists 32 layers, 32 attention heads, 8 key-value heads and head size 128. At peak it has 50 active requests of 8,000 tokens, with a 16-bit cache. About how much KV cache memory does the peak need?"
options:
  - { id: a, text: "About 26 GB, from layers × key-value heads × head size × 2 bytes per token" }
  - { id: b, text: "About 210 GB, counting all 32 attention heads in every layer" }
  - { id: c, text: "About 52 GB, from 0.13 MB per token across 400,000 tokens in flight" }
  - { id: d, text: "About 0.13 GB, because only the newest token's keys and values are kept" }
correct: c
explanation: "Per token the cache is 2 (keys and values) × 32 × 8 × 128 × 2 bytes, about 0.13 MB, and 50 × 8,000 = 400,000 tokens gives about 52 GB. The tempting 210 GB uses attention heads, but with grouped-query attention only the 8 key-value heads are stored."
