id: design-speech-to-text-service
question: "Design a speech-to-text service for a call centre product that transcribes 50,000 hours of calls a day. Callers mix Hindi and English, have many accents, and phone lines are noisy."
kind: use-case
short_answer: "Clarify live or batch transcription, languages, accuracy target and privacy rules. Then: audio ingestion, voice activity detection and chunking, a pretrained speech model fine-tuned on real call audio with code-mixed speech, domain vocabulary, batched GPU inference, and word error rate measured separately for each accent, language mix and noise level."
deeper_answer: "First clarify the mode. Live captions for agents need streaming with about a second of delay. Transcripts for quality review can run in batch, which is much cheaper. Ask about storage of recordings and masking of personal data.\n\nPipeline: phone audio arrives at 8 kHz. Voice activity detection removes silence and cuts the audio into segments. A speech recognition model transcribes each segment. Start from a pretrained multilingual model and fine-tune it on real call audio that includes code-mixed Hindi and English, regional accents and line noise. Product names and domain terms are added through vocabulary biasing or a correction step. Post-processing adds punctuation and masks personal data.\n\nServing: 50,000 hours a day is about 2,000 hours of audio per clock hour, so GPU throughput and batching decide the cost. Batch jobs use a queue and can run on cheaper capacity at night.\n\nEvaluate with word error rate on a labelled test set, reported per accent, language mix and noise level. Trade-offs: bigger models are more accurate but slower and more expensive. At scale, rare accents, mixed scripts in the output and GPU queues at peak hours break first."
follow_ups:
  - "How do you measure quality fairly across accents?"
  - "What changes if the transcript must appear live during the call?"
  - "How would you get training data for code-mixed speech?"
common_mistakes:
  - "Reporting one average word error rate"
  - "Testing on clean audio instead of real phone calls"
  - "Ignoring personal data in recordings and transcripts"
level: P2
topic: system-design
