answer_seconds: 160
example: "For 50,000 hours of calls a day, I would first clarify whether we need live streaming or batch transcripts. I will assume batch for quality review, which is cheaper, and I would ask about privacy rules. Phone audio is 8 kHz and noisy. Voice activity detection removes silence and cuts each call into segments. For the model I start from a pretrained multilingual speech model and fine-tune it on a few thousand hours of our own calls, with code-mixed Hindi and English, several accents and real line noise. I add a domain vocabulary for product names, and I mask card numbers in the output. Segments go through a queue to GPU workers that process them in batches, mostly at night. I measure word error rate on a labelled test set and report it per accent and noise level, not as one average. The trade-off is accuracy against cost: a larger model gives fewer errors but needs more GPU hours."
