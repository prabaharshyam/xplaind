id: notice-period-and-joining
question: "What is your notice period, and how soon can you join?"
kind: real-life
short_answer: "State your official notice period exactly as in your contract. Say whether it can be shortened through a buyout or early release, and whether that is confirmed or only possible. Give a realistic joining date. Do not promise a date you cannot keep. Freshers should say when their exams and results end."
deeper_answer: "The interviewer needs to plan. A team with an open position wants the real date, and wants to know the risk that you take a counter-offer during a long notice period. Ninety-day notice periods are common in Indian service companies, so this question decides many offers.\n\nBe exact and honest: the contract term, what your company usually allows, and what you will do to speed it up. For example: \"My notice period is 60 days. Some colleagues were released in 45 days after handover, so I will ask, but I can only promise 60.\" Ask if the company supports a buyout. Do not agree to leave without serving notice, because it harms your relieving letter and your name."
follow_ups:
  - "Can you join earlier if we buy out your notice period?"
  - "Have you already resigned?"
  - "What if your current company makes a counter-offer?"
common_mistakes:
  - "Promising an early date and then asking for more time"
  - "Offering to leave without a proper handover"
  - "Being unsure of what the contract says"
level: I1
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "States the official notice period exactly"
    keywords: ["notice period", "days", "months", "contract"]
  - point: "Says whether it can be shortened and how sure that is"
    keywords: ["buyout", "early release", "released", "shorten", "reduce", "do not want to promise"]
  - point: "Gives a realistic joining date"
    keywords: ["joining date", "can join", "last working day", "earliest", "week of"]
  - point: "Shows commitment to a proper handover"
    keywords: ["handover", "knowledge transfer", "hand over", "responsib"]
answer_seconds: 60
example: "My notice period is 60 days as per my contract. I have not resigned yet, and I will do so as soon as I have a written offer. If I resign in the first week of December, my last working day would be in the first week of February. My company does allow a buyout, and two people in my team were released after 45 days once their handover was done. I will ask for that, but I do not want to promise it. I run the model deployment pipeline for two clients as an MLOps engineer, so I need about three weeks for a proper handover. A safe joining date is the second week of February, and I will tell you at once if I can come earlier."
