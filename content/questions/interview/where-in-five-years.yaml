id: where-in-five-years
question: "Where do you see yourself in five years?"
kind: real-life
short_answer: "Give a realistic direction, not a job title or a fixed plan. Say what skills you want to master, what kind of responsibility you want to hold, and how this role is the right start. Show you plan to stay and grow. Admit that AI changes fast and you will adjust."
deeper_answer: "Nobody expects you to predict the future. The interviewer is checking three things: that you have ambition, that it is realistic, and that this job fits the path so you will not leave in six months.\n\nStructure it as skill, responsibility, link. First the depth you want to build in the next two years. Then the wider responsibility after that, such as owning a system or guiding juniors. Then why this role starts that path. For example: \"In five years I want to be the person a team trusts to secure an AI product from design to launch. The first step is to learn the basics well here.\" Talk about the part of your plan that this job truly serves, and do not promise things you do not mean."
follow_ups:
  - "What will you do if AI tools change your job in two years?"
  - "Do you plan to study further?"
  - "Would you prefer a technical path or a management path?"
common_mistakes:
  - "Naming only a title, such as manager or lead"
  - "Describing a plan that this job does not fit"
  - "Saying \"I have not thought about it\""
level: B3
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
asked_often: true
rubric:
  - point: "Describes the skills they want to master"
    keywords: ["skills", "learn", "strong at", "basics", "expert", "master"]
  - point: "Describes growing responsibility, such as owning a system or guiding others"
    keywords: ["own", "lead", "responsib", "guide", "mentor"]
  - point: "Links the plan to this role and company"
    keywords: ["this role", "here", "your team", "first step", "right start"]
  - point: "Stays realistic and open to change"
    keywords: ["realistic", "changes", "adapt", "adjust", "cannot give an exact"]
answer_seconds: 90
example: "I cannot give an exact title, because this field changes every year, but I know the direction. I have just finished my BTech in Bhubaneswar, and my final project tested a chatbot against prompt injection attacks. In the first two years I want to become strong at the basics here: testing AI systems for attacks, writing clear reports and fixing what I find. By year three or four I want to own the security review for one full product, from design to launch. By year five I hope to guide one or two juniors and be someone the team trusts on this subject. Your AI security analyst role is the right start, because your team does this testing every day."
