id: difficult-stakeholder
question: "Tell me about a difficult stakeholder and how you handled them."
kind: real-life
short_answer: "Pick a stakeholder who was hard for a reason, such as fear, pressure or different goals. Describe their behaviour without insults. Explain how you found out what they really needed, what you changed in how you worked with them, and how the relationship and the project ended."
deeper_answer: "The interviewer is checking patience and judgement. In AI projects many stakeholders do not trust the model, or expect too much from it. They want to see that you look for the reason behind the behaviour.\n\nSituation: who the stakeholder was and what made it hard. Task: what you needed from them. Action: how you learned their real worry and what you did about it. A good line is: \"I stopped defending the model and asked him what would happen to him if it made a mistake.\" Result: the project outcome and the relationship now. Never call the person stupid or political. The interviewer may imagine you saying that about them."
follow_ups:
  - "What would you have done if they had still refused?"
  - "How do you explain to a stakeholder that no model is 100 percent correct?"
  - "When do you take such a problem to your manager?"
common_mistakes:
  - "Insulting the stakeholder or calling them political"
  - "Avoiding them, or complaining about them, without trying to understand them first"
  - "Ending without saying what happened to the project"
level: P1
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Describes the stakeholder and the difficulty fairly"
    keywords: ["stakeholder", "head", "client", "rejected", "asked for"]
  - point: "Found the real concern behind the behaviour"
    keywords: ["worried", "concern", "fear", "blame", "understood"]
  - point: "Changed their approach to meet that concern"
    keywords: ["changed", "design", "low confidence", "went to a person"]
  - point: "Kept regular, honest communication"
    keywords: ["weekly", "report", "each monday", "every week", "update"]
  - point: "Gives the project result and the relationship now"
    keywords: ["approved", "result", "fell", "second phase", "trust"]
answer_seconds: 120
example: "I was a consultant on a document sorting project for a bank's operations team in Mumbai. The operations head rejected every demo and asked for 100 percent accuracy, which no model can give. Our pilot was stuck for a month. I asked him for a one-to-one meeting and asked what worried him most. He said that if a loan file went to the wrong desk, the audit team would blame him, not us. So I changed the design. Files with low confidence, about 12 percent, went to a person. I gave him a weekly report of every error by type, and we reviewed it for fifteen minutes each Monday. After six weeks he approved the pilot. Sorting time fell from two days to four hours, and he later asked for the second phase himself."
