id: ai-pm-decision-story
question: "Tell me about an AI product decision you made and how it turned out."
kind: real-life
short_answer: "Pick a real decision with a trade-off, such as build versus buy, whether to launch with known errors, or where to put a human in the loop. Explain the options, the evidence you gathered, why you chose, how you measured the result, and what you learned, including anything you would change."
deeper_answer: "Good AI PM answers show judgement under uncertainty. The decision should involve something AI-specific: error rates, evaluation, cost per use, data, risk or user trust.\n\nShow your process: you defined what good looks like, worked with engineers on an eval, talked to users, estimated cost, and decided with clear criteria. Then share the outcome honestly, including if it partly failed. If you have not worked as a PM yet, a decision from a college project, a startup or your current role, told with the same structure, works."
follow_ups:
  - "What would you have done if the eval scores were lower?"
  - "Who disagreed, and how did you handle it?"
common_mistakes:
  - "A decision with no trade-off"
  - "Taking credit for the whole team's work"
level: I1
topic: behavioral
stop_id: ai-pm-interviews
rubric:
  - point: "Describes a real decision with a trade-off"
    keywords: ["decision", "trade-off", "options", "choose"]
  - point: "Explains the evidence used, such as evals or user research"
    keywords: ["eval", "data", "users", "evidence", "research"]
  - point: "Gives the reasoning and criteria"
    keywords: ["because", "criteria", "reason"]
  - point: "Shares the measured outcome"
    keywords: ["result", "measured", "outcome", "metric"]
  - point: "States what they learned"
    keywords: ["learned", "differently", "lesson"]
answer_seconds: 120
example: "At an ed-tech startup I had to decide whether to launch AI-graded essay feedback for Class 10 students. On our test set of 300 teacher-graded essays, the AI's scores matched teachers closely for most essays but were badly off for some answers in Hinglish. Instead of a full launch, we shipped feedback comments without scores and kept teachers grading. Students used the feedback a lot, teachers said grading went faster, and we added Hinglish essays to the eval set before considering scores again."
