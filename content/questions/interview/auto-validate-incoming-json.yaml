id: auto-validate-incoming-json
question: "What is schema validation, and why would you validate incoming JSON at the start of a workflow instead of handling errors later?"
kind: concept
short_answer: "Schema validation compares incoming data with a definition of what is expected: which fields are required, and the type and format of each. I do it first, before any write, because bad data often does not raise an error later: a renamed field just becomes a blank. Bad records go to a review list, and many failures trigger an alert."
deeper_answer: "Without a check at the entrance, bad data fails late or does not fail at all. A renamed field becomes an empty value, and the workflow writes hundreds of blank phone numbers into the CRM before anyone sees it. Cleaning a CRM is much more work than rejecting a record.\n\nSo the first step after the trigger compares the input with a schema. Some tools have a node for this; a short script works too. I normalise at the same place: trim spaces, fix letter case in emails, and convert '9876543210' and '+91 98765 43210' to one format. I decide per field what is fatal: no phone and no email means reject, but a missing city can pass. A sudden rise in rejects is a signal that the source changed. Interviewers listen for validation before writes, a place for rejected records, and the alert."
follow_ups:
  - "What do you do with a record that fails validation?"
  - "How would you notice that someone renamed a field in the form?"
  - "Which is safer for an unknown extra field: ignore it or reject the record?"
common_mistakes:
  - "Writing to the CRM first and cleaning later"
  - "Dropping bad records with no record of them"
  - "Treating every missing field as fatal"
level: I1
topic: automation
stop_id: shaping-json
rubric:
  - point: "Defines schema validation: expected fields, types and formats"
    keywords: ["schema", "required", "format", "expected"]
  - point: "Validates first, before any write"
    keywords: ["before any write", "first step", "at the start"]
  - point: "Explains that bad data can pass without an error, such as a blank field"
    keywords: ["blank", "no error", "renamed", "empty"]
  - point: "Normalises values such as phone numbers and emails"
    keywords: ["normalise", "trim", "one format", "lower case"]
  - point: "Sends bad records to a review list and alerts when many fail"
    keywords: ["review list", "reason", "alert"]
answer_seconds: 120
example: "Schema validation means I compare the incoming JSON with a definition of what I expect. For a course enquiry form, name and phone are required, the phone must be a 10-digit Indian mobile number, the email must have a valid format, and the course must be one of our six courses. I put this as the first step after the webhook, before any write to the CRM. The reason is that bad data often gives no error later. If someone has renamed a field in the form, the CRM just gets a blank value. In the same step I normalise: trim spaces, make the email lower case, and store the phone in one format with +91. A bad record goes to a review list in a Google Sheet with the reason. If more than ten records fail in an hour, the team gets an alert."
