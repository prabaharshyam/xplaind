id: monitor-llm-app
question: "How do you monitor an LLM application in production?"
kind: use-case
short_answer: "Log every request with latency, tokens, cost, errors and the model version, plus user feedback. Track quality with sampled human or judge reviews and specific checks such as refusal rate and format errors. Set alerts for error spikes, latency and spend, and turn bad conversations into new test cases."
deeper_answer: "Traditional monitoring covers availability, latency and errors. LLM apps also need quality monitoring, because a response can be fast, successful and wrong. Useful signals: thumbs up or down, edits users make to drafts, follow-up questions that suggest confusion, escalations to humans, and automated checks on samples.\n\nProtect privacy while logging: mask personal data and set retention limits. Watch cost per user and per feature, and break metrics down by segment, such as language or customer type, because averages hide problems."
follow_ups:
  - "How would you detect that answer quality dropped after a provider update?"
  - "What would you avoid logging?"
common_mistakes:
  - "Monitoring only uptime and latency"
  - "Logging full conversations with personal data and no retention limit"
level: P2
topic: system-design
stop_id: deploy-and-monitor
rubric:
  - point: "Logs latency, tokens, cost, errors and model version"
    keywords: ["latency", "token", "cost", "error", "version"]
  - point: "Collects user feedback"
    keywords: ["feedback", "thumbs"]
  - point: "Samples outputs for quality review"
    keywords: ["sample", "review", "judge"]
  - point: "Alerts on errors, latency and spend"
    keywords: ["alert", "spike", "threshold"]
  - point: "Turns bad cases into test cases"
    keywords: ["test case", "test set", "regression"]
answer_seconds: 90
example: "For a tutoring chatbot, every request logged model version, tokens, latency, cost and whether the student clicked thumbs-up or down. Each day a judge model and one teacher reviewed 50 sampled conversations for correctness. We alerted on error rate above 2%, p95 latency above 6 seconds and daily spend above budget. Thumbs-down conversations with a teacher's correction went into the test set every week."
