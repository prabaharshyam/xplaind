id: semantic-cache-tradeoffs
question: When would you use a semantic cache for an LLM app, and what can go wrong?
kind: concept
short_answer: A semantic cache reuses an earlier answer when a new question means the same thing, matched
  by embedding similarity above a threshold. It pays off when many questions repeat with different wording
  and answers do not depend on user-specific details. It goes wrong when similar-looking questions need
  different answers, such as different order numbers, names or dates.
deeper_answer: 'It adds an embedding call and a vector search to every request, so the hit rate must be
  high enough to save more than it costs. The threshold needs testing on real pairs: too loose returns
  wrong answers, too strict rarely hits.


  Safer options come first: stock answers for the top FAQs, an exact cache on a normalised question plus
  prompt version, model and date, and provider prompt caching. Include anything that changes the answer
  in the cache key, expire entries when the source data changes, and measure the cache''s error rate,
  not only its hit rate.'
follow_ups:
- How would you choose the similarity threshold?
- What belongs in a cache key?
common_mistakes:
- Caching answers that depend on user details
- Measuring hit rate but not wrong answers
level: P2
topic: deployment
