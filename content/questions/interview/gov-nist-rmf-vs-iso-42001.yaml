example: "They do different jobs. The NIST AI Risk Management Framework is voluntary guidance. It has four functions: Govern, Map, Measure and Manage. I use it as a working method, for example to map the risks of a new chatbot and decide how to measure them. ISO/IEC 42001 is a management system standard, like ISO 27001 but for AI. It sets requirements for policy, roles, risk assessment, internal audit and improvement, and a company can be audited and certified against it. Neither is a law, so we still check legal duties such as the DPDP Act separately. In practice I would use them together: NIST for the method inside the 42001 structure, and the certificate when enterprise clients ask for proof."
