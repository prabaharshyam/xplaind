id: gov-nist-rmf-vs-iso-42001
question: "What is the difference between the NIST AI Risk Management Framework and ISO/IEC 42001, and how would you use each in a company?"
kind: concept
short_answer: "The NIST AI RMF is voluntary guidance for managing AI risk, built around four functions: Govern, Map, Measure and Manage. ISO/IEC 42001 is a management system standard that a company can be audited and certified against. Use the RMF as a working method and 42001 as the structure and external proof."
deeper_answer: "They answer different questions. The NIST framework, from the US standards body, asks how you find and handle risk in an AI system: set up governance, map the context and risks, measure them, and manage them. It gives no certificate. ISO/IEC 42001 asks whether the organisation runs AI in a controlled, repeatable way: policy, roles, risk and impact assessment, controls, internal audit and continual improvement, in the same style as ISO 27001 for information security.\n\nNeither is a law. A company might use the RMF functions to shape its risk reviews, and seek 42001 certification because enterprise clients ask for it in vendor questionnaires. Both still need mapping to legal duties such as the DPDP Act or the EU AI Act. Interviewers listen for accurate basics, the difference between certifiable and voluntary, and a practical view of when each is worth the effort."
follow_ups:
  - "Name the four functions of the NIST AI RMF and give one activity for each."
  - "Does ISO 42001 certification mean a company complies with the EU AI Act?"
