id: serve-llm-streaming-api
question: "How would you serve an LLM feature as an API for a web app?"
short_answer: "Put a backend service, for example FastAPI, between the browser and the model provider so keys stay secret and you can add auth, rate limits and logging. Stream tokens to the client with server-sent events so users see text at once, set timeouts and retries, validate inputs and outputs, and run it with multiple workers behind a load balancer."
deeper_answer: "Calls to model APIs are slow and I/O-bound, so async handlers or enough workers matter. Handle client disconnects so you stop paying for tokens nobody reads. Return clear errors when the provider is down, and consider a fallback model.\n\nLog request IDs, latency, token counts and cost per request from day one; they are what you will need when something goes wrong."
follow_ups:
  - "Why not call the model API directly from the browser?"
  - "How do you handle the provider being down?"
common_mistakes:
  - "Exposing API keys in the frontend"
  - "No timeouts on model calls"
