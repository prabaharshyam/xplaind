id: choose-chunk-size
question: "How do you choose a chunk size for RAG?"
kind: use-case
short_answer: "Start from the documents and the questions: chunks should be big enough to make sense alone and small enough to be about one thing. Try a few sizes, often a few hundred tokens with some overlap, split on natural boundaries such as headings, and pick the one with the best retrieval recall on a test set."
deeper_answer: "Small chunks give precise matches but lose context; large chunks keep context but dilute the embedding and waste the context window. Structure matters more than a magic number: splitting by section or paragraph keeps ideas whole, and overlap reduces the chance of cutting a key sentence in half.\n\nUseful tricks: store the document title and section heading with each chunk, add a short generated context to each chunk, or retrieve small chunks but pass the surrounding larger section to the model. Decide with measurements on real questions, not by default settings."
follow_ups:
  - "What would you change for tables or code?"
  - "How does overlap help, and what does it cost?"
common_mistakes:
  - "Quoting one universal chunk size"
  - "Choosing chunk size without measuring retrieval"
level: I2
topic: rag
stop_id: chunking
rubric:
  - point: "Starts from the documents and questions"
    keywords: ["document", "question"]
  - point: "Chunks make sense alone and are about one thing"
    keywords: ["make sense", "self-contained", "one topic", "one thing"]
  - point: "Uses overlap and natural boundaries such as headings"
    keywords: ["overlap", "heading", "boundar", "paragraph"]
  - point: "Tests a few sizes on a test set and measures recall"
    keywords: ["test set", "recall", "measure", "evaluat", "experiment"]
answer_seconds: 90
example: "For a university's admissions FAQ, I tried 200, 400 and 800-token chunks, splitting at headings with about 15% overlap, and ran 50 real student questions. The 400-token chunks had the right passage in the top five most often; 800 mixed several courses in one chunk, and 200 lost the course name. I also prepended the section heading to every chunk, which helped all three sizes."
