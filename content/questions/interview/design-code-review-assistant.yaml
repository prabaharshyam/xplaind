answer_seconds: 150
example: "I would clarify the goal first: catch likely bugs and security problems, while a human still gives the approval. For 2,000 pull requests a day, a webhook puts each one on a queue and workers process it inside the 5 minutes. A worker takes the diff and adds context: the changed files, related definitions from code search and the team's guidelines. Static analysis and the test results run first because they are exact and cheap. Then the model returns structured findings with a line, a severity and a confidence score. A filter keeps at most five high-confidence comments, because noise is what makes engineers ignore a reviewer. The trade-off is context against cost, so a cheaper model does a first pass. The code is untrusted input, so access is read-only. I would measure how many comments lead to a change in the code."
