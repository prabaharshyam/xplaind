id: design-multitenant-document-qa
question: "You are building document Q&A as a product for 500 customer companies. Each uploads up to 1 million documents. Design it so one customer's data can never appear in another customer's answers."
kind: use-case
short_answer: "Clarify isolation needs, tenant sizes and compliance. Carry a tenant ID from authentication through every layer: storage, index, cache, logs and prompts. Choose isolation per tier: shared index with a mandatory tenant filter for small tenants, separate indexes or keys for large or regulated ones. Add per-tenant rate limits, cost tracking, deletion, and cross-tenant leak tests."
deeper_answer: "Requirements: how strong isolation must be by contract, whether some tenants need their own region or encryption key, the size spread between tenants, and whether customer data may be used for training (normally no). The key metric is zero cross-tenant leaks, then answer quality and cost per tenant.\n\nDesign: the tenant ID comes from the verified login token, never from the request body. Every store is scoped by it: object storage prefix, database rows with row-level security, vector index namespace, cache keys, logs and traces. The retrieval layer adds the tenant filter itself, so a developer cannot forget it. Small tenants share one index with namespaces, which is cheap. Large or regulated tenants get a separate index and key, which costs more to run but limits the damage of a bug.\n\nWhat breaks first: one large tenant slows the others, so add per-tenant rate limits, queues for ingestion and quotas. Also shared caches and any fine-tuning on mixed data. Test with planted canary documents in one tenant and automated queries from another, in CI and in production. Support full deletion when a tenant leaves."
follow_ups:
  - "When would you give a tenant its own index instead of a namespace?"
  - "Where could data leak even if retrieval is filtered correctly?"
  - "How do you delete one tenant's data completely?"
common_mistakes:
  - "Trusting a tenant ID sent by the client"
  - "Sharing a semantic cache across tenants"
  - "One large tenant slowing everyone because there are no limits"
level: P3
topic: system-design
stop_id: security-privacy
rubric:
  - point: "Clarifies isolation level, tenant sizes and compliance needs"
    keywords: ["clarify", "isolation", "compliance", "requirement", "contract"]
  - point: "Tenant ID from the verified token, enforced in every layer"
    keywords: ["tenant id", "token", "every layer", "row-level"]
  - point: "Chooses shared namespaces or separate indexes by tier"
    keywords: ["namespace", "separate index", "shared index", "tier"]
  - point: "Scopes caches, logs and prompts by tenant too"
    keywords: ["cache", "logs", "trace"]
  - point: "Per-tenant rate limits, quotas and cost tracking"
    keywords: ["rate limit", "quota", "per-tenant", "cost per tenant"]
  - point: "Tests for cross-tenant leaks and supports deletion"
    keywords: ["leak", "canary", "delet", "test"]
answer_seconds: 180
example: "I would clarify the isolation each contract needs, because a bank and a small startup differ. The tenant ID comes from the verified login token and is enforced in every layer: storage prefix, row-level security in the database, a namespace in the vector index, and cache keys. The retrieval service adds the tenant filter itself, so no developer can forget it. For 500 customers I would put small tenants in a shared index with one namespace each, and give large or regulated tenants a separate index and encryption key. The trade-off is cost against the size of the damage if a bug appears. Each tenant has a rate limit and an ingestion quota, so one upload of 1 million documents does not slow the others. I would plant canary documents in one tenant and run automated leak tests from another on every release, and support full deletion when a customer leaves."
