answer_seconds: 150
example: "I would ask first if you want the full rows, and how ties should be handled. I will assume full rows and exactly two per city. I sort the table by amount, descending, and then take the first two rows of each group with df.sort_values(\"amount\", ascending=False).groupby(\"city\").head(2). Because head works on the sorted order, I get the two largest orders in every city, with all columns. The sort is the main cost, O(n log n). A city with only one order returns one row, which I would test. If tied amounts should all be kept, I would filter on a dense rank within each city instead. This is the same idea as ROW_NUMBER with PARTITION BY in SQL. For Pune with 500, 900 and 700, I get the 900 and 700 rows."
