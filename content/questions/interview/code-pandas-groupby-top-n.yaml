id: code-pandas-groupby-top-n
question: "From an orders table with city, order_id and amount, return the 2 largest orders in each city. For example, if Pune has orders of 500, 900 and 700, keep the 900 and 700 rows."
kind: use-case
short_answer: "Sort by amount descending, then take the first n rows of each group: df.sort_values(\"amount\", ascending=False).groupby(\"city\").head(2). It keeps all columns. The sort makes it O(n log n). Use rank with method=\"dense\" instead when tied values should all be kept."
deeper_answer: "First clarify the output. Ask whether you want whole rows or only the values, what to do with ties at the cut-off, and whether a city with fewer than n orders should still appear. Check for missing amounts.\n\nThe main approach is df.sort_values(\"amount\", ascending=False).groupby(\"city\").head(2). After the sort, head(2) keeps the first two rows of every city and keeps every column. A city with one order returns one row. Ties are cut at exactly two rows, by sort order. When ties must all be kept, filter on a rank: df[df.groupby(\"city\")[\"amount\"].rank(method=\"dense\", ascending=False) <= 2]. If only the values are needed, df.groupby(\"city\")[\"amount\"].nlargest(2) returns a Series.\n\nThe sort costs O(n log n). Test a city with one order, tied amounts and a missing amount, which sort_values puts last. Say that this is the pandas form of ROW_NUMBER() OVER (PARTITION BY city ORDER BY amount DESC) in SQL, and add a second sort column such as order_id when the result must be the same on every run."
follow_ups:
  - "How would you keep every row that ties for second place?"
  - "How would you write the same thing in SQL?"
  - "What happens to rows where the amount is missing?"
common_mistakes:
  - "Calling head(2) on the whole table, not per group"
  - "Forgetting ascending=False, which returns the smallest orders"
  - "Not deciding how ties are handled"
level: I1
topic: coding
stop_id: pandas-tables
