id: pm-acceptance-rate-misleads
question: "Your AI reply suggestions for support agents have a 70% acceptance rate. Why might that number still not mean the feature is working?"
kind: concept
short_answer: "Acceptance shows that agents clicked, not that the reply was right. Agents under time pressure may accept weak suggestions, or accept and then rewrite. Check edits after acceptance, audit a sample for correctness, and compare outcomes such as reopen rate and customer satisfaction against a group without suggestions."
deeper_answer: "Acceptance rate is a usage signal. It moves with incentives. If agents are measured on handling time, accepting is the fastest path, so the rate climbs even when quality is flat. It also hides the mix of work: suggestions may only appear on easy tickets, where anything would be accepted.\n\nTo trust the number, pair it with three checks. First, edit distance: how much of the suggestion survives in the sent reply. Second, a weekly audit where a senior agent marks 100 accepted replies as correct or not. Third, an outcome comparison with a holdout group: do tickets with accepted suggestions reopen less? Interviewers listen for the difference between a proxy metric and the outcome, and for awareness that people trust machine suggestions too easily."
follow_ups:
  - "What would a low acceptance rate tell you?"
  - "How would you set up the holdout group?"
  - "Which single metric would you report to leadership?"
common_mistakes:
  - "Reporting acceptance rate as proof of quality"
  - "Ignoring agent incentives"
  - "No comparison group"
level: I1
topic: product
stop_id: kpi-that-matters
rubric:
  - point: "Separates a usage or proxy signal from correctness"
    keywords: ["proxy", "usage signal", "use the button"]
  - point: "Explains time pressure or too much trust in suggestions"
    keywords: ["pressure", "incentive", "fastest", "handling time"]
  - point: "Checks edits made after acceptance"
    keywords: ["edit", "rewrit", "changed before"]
  - point: "Audits a sample of accepted replies"
    keywords: ["audit", "sample"]
  - point: "Compares outcomes against a holdout group"
    keywords: ["holdout", "reopen", "control group"]
answer_seconds: 110
example: "A 70% acceptance rate tells me agents use the button. It is a proxy, and it does not tell me the replies are correct. Our agents are measured on handling time, so accepting is the fastest way to close a ticket. I would check three things. First, edits: how much of the suggestion is changed before sending. Second, a weekly audit where a senior agent reads a sample of 100 accepted replies and marks wrong ones. Third, outcomes: I would keep a holdout group of agents without suggestions and compare reopen rate and customer satisfaction. If accepted replies reopen more often, the feature is making us faster but worse."
