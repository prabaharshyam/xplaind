id: executive-update
question: "How do you update a client's executives on an AI project?"
kind: real-life
short_answer: "Lead with the outcome and the decision you need, in one or two sentences. Then progress against the agreed metrics, the top risks with what you are doing about them, and next steps with dates. Keep it short, use the client's business language, show a real example or demo where possible, and never hide bad news."
deeper_answer: "Executives care about business impact, risk and what they need to do. Replace model jargon with outcomes: not 'recall improved to 0.82', but 'the assistant now finds the right policy for 8 of 10 questions, up from 6'.\n\nA consistent weekly format builds trust: green, amber or red status, metric trend, risks and asks."
follow_ups:
  - "How would you report a delay?"
  - "How do you translate a technical metric into business terms?"
common_mistakes:
  - "Burying the ask at the end"
  - "Model jargon"
level: P1
topic: client-delivery
stop_id: executive-communication
rubric:
  - point: "Leads with outcome and the decision needed"
    keywords: ["outcome", "decision", "ask", "lead with"]
  - point: "Progress against agreed metrics"
    keywords: ["metric", "progress", "kpi"]
  - point: "Risks and mitigations"
    keywords: ["risk", "mitigat"]
  - point: "Business language, not jargon"
    keywords: ["business", "jargon", "plain"]
  - point: "Honest about bad news; next steps"
    keywords: ["bad news", "honest", "delay", "next step"]
answer_seconds: 90
example: "For a logistics client's COO, my fortnightly update started with one line: 'Invoice automation is live in two warehouses and cutting processing time; we need your decision on rolling out to the other five by month end.' Then the metric against target, the two biggest risks, one being a delayed IT approval and what we were doing about it, a 30-second screen recording, and next dates. When a pilot slipped, I said so in the first paragraph."
