id: what-to-trace
question: "What would you capture in traces for an LLM application?"
short_answer: "One trace per user request, with a span for each step: retrieval (query, document IDs, scores), each model call (model and version, prompt template version, input and output tokens, latency, cost, parameters), each tool call with arguments and results, and errors. Link user feedback to the trace. Mask personal data and sample if volume is high."
deeper_answer: "Tools such as Langfuse or OpenTelemetry-based platforms make this easy. The payoff is debugging: when a user reports a bad answer, you can see exactly what was retrieved and what the model saw.\n\nTraces also feed evals: pick bad or interesting production traces and add them to your test set."
follow_ups:
  - "How would you link a thumbs-down to the right trace?"
  - "What personal data would you mask?"
common_mistakes:
  - "Logging only the final answer"
  - "Storing full personal data in traces forever"
level: P1
topic: deployment
stop_id: tracing-llm-apps
rubric:
  - point: "One trace per request with spans per step"
    keywords: ["trace", "span", "per request", "step"]
  - point: "Retrieval details"
    keywords: ["retriev", "document", "score", "query"]
  - point: "Model, prompt version, tokens, latency, cost"
    keywords: ["model", "prompt version", "token", "latency", "cost"]
  - point: "Tool calls and errors"
    keywords: ["tool", "error"]
  - point: "Feedback linked; personal data masked"
    keywords: ["feedback", "mask", "personal", "pii", "redact"]
answer_seconds: 90
example: "For a single question to a support assistant, the trace shows: the retrieval span with the rewritten query and the IDs and scores of five chunks; the model span with model version, prompt version 12, 3,200 input and 280 output tokens, 2.1 seconds and ₹0.40; a tool span calling get_order with its result; and the user's thumbs-down linked to it. Phone numbers are masked before the trace is stored."
