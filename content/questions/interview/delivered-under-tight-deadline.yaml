id: delivered-under-tight-deadline
question: "Tell me about a time you delivered under a very tight deadline."
kind: real-life
short_answer: "Describe a real deadline that was very short. Explain how you made it possible: you cut the scope with the stakeholder's agreement, planned the days, asked for help and kept the checks that mattered. Give the result. Then say what you would do to avoid such a rush next time."
deeper_answer: "The interviewer is checking how you work under pressure. They want planning and clear choices, not a story about no sleep. They also check that you did not lower quality without telling anyone.\n\nSituation: the deadline and why it was tight. Task: what had to be ready. Action: what you cut, who agreed to the cut, and how you used the days. A good line is: \"I told the client contact, in five days I can do one document type well or three badly, and she chose one.\" Result: what was delivered and what it led to. Mention the one check you refused to skip, such as testing on real questions. It shows judgement."
follow_ups:
  - "What did you leave out, and who agreed to that?"
  - "What would you do to avoid such a rush next time?"
  - "How did you make sure quality did not drop?"
common_mistakes:
  - "Making it a story about working without sleep"
  - "Cutting scope or testing without telling anyone"
  - "Not saying what was left out"
level: I1
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "States the deadline and why it was tight"
    keywords: ["five days", "deadline", "moved", "three weeks", "short notice"]
  - point: "Cut the scope with the stakeholder's agreement"
    keywords: ["scope", "one type", "she chose", "he chose", "confirmed", "agreed"]
  - point: "Planned the time and asked for help"
    keywords: ["split the days", "plan", "senior colleague", "review", "help"]
  - point: "Kept the checks that mattered"
    keywords: ["testing", "tested", "did not skip", "real questions"]
  - point: "Gives the result"
    keywords: ["worked", "approved", "delivered", "result", "pilot"]
answer_seconds: 120
example: "At a service company in Bengaluru, I was in a team of three building a document question-answering demo for an insurance client. We had three weeks. Then the client's leadership meeting moved, and we had five days. The full plan covered three types of policy document. I told our client contact that in five days we could do one type well or three badly. She chose motor policies, and I confirmed it by email. I split the days: two for loading and searching the documents, two for answers and the screen, one for testing. I asked a senior colleague to review my search code on day two. I did not skip testing. We ran 40 real questions and fixed the 7 that failed. The demo worked in the meeting, and the client approved a paid pilot worth 18 lakh rupees."
