id: gov2-agent-autonomy-stages
question: "An operations team wants an AI agent to issue refunds and update customer records without a human. How do you decide how much autonomy to give it, and how would that change over time?"
kind: use-case
short_answer: "I classify each action by how much harm it can do and how easily it can be reversed. Low-value, reversible actions can run alone within limits; high-value or irreversible ones need human approval. The agent starts in shadow mode, then supervised, and gains autonomy only on evidence. Limits are enforced in code, with an owner, logs and a stop switch."
deeper_answer: "The governance question for agents is not 'is the model good' but 'what can it do, to whom, and how do we find out and undo it'. So I work from the list of actions, not from the model. A ₹300 refund to the original payment method is small and reversible. A change of bank account on a customer record is the kind of action fraudsters want, so it stays with a human.\n\nAutonomy is earned in stages. In shadow mode the agent proposes and people act; we compare. Then it acts with approval, then alone under caps such as an amount per refund and a total per day. Moving up a stage needs agreed evidence, for example an error rate below a level over a number of cases, and a sign-off. Moving down is automatic when an indicator is crossed. Prompt, tool or model changes go back through testing. Interviewers listen for action tiers, hard limits outside the prompt, staged rollout and criteria for both directions."
follow_ups:
  - "What evidence would you ask for before removing human approval for small refunds?"
  - "Why must the limits be enforced outside the prompt?"
  - "What would make you reduce the agent's autonomy again?"
common_mistakes:
  - "One approval decision for the whole agent instead of per action"
  - "Writing the limits only in the prompt"
  - "No criteria for increasing or reducing autonomy"
level: P2
topic: governance
