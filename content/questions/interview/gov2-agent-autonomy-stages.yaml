    keywords: ["evidence", "error rate", "sign-off", "reduce autonomy", "named owner"]
answer_seconds: 150
example: "I would list each action the agent can take and classify it by harm and how reversible it is. A refund up to ₹500 to the original payment method is small and reversible. A refund above ₹5,000 or a change of phone number or bank details is not, so that stays with human approval. Then I would give autonomy in stages. For the first month the agent works in shadow mode: it proposes, and the team acts. If the evidence is good, for example an error rate below one percent on 2,000 cases, the operations head gives sign-off for small refunds without approval. The limits are enforced in code, not in the prompt: a cap per refund and a total per day, plus a stop switch. If complaints or errors cross a threshold, we reduce autonomy again. One named owner is accountable."
