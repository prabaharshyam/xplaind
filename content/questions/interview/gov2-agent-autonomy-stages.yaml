    keywords: ["per action", "can be cancelled", "never leaves", "reversible"]
  - point: "Entry criteria and a sign-off for each move up, agreed in advance"
    keywords: ["criteria", "sign-off", "agreement with"]
  - point: "Hard caps in code and sampling of actions in the autonomous stage"
    keywords: ["enforced in code", "caps", "review a sample"]
  - point: "Written triggers to step down; a model, prompt or tool change means testing again"
    keywords: ["back one stage", "trigger", "tested again"]
answer_seconds: 150
example: "I would decide per action, not for the whole agent. Raising a purchase order below ₹20,000 with an approved vendor can be cancelled, so it can become automatic later. A change of vendor bank details never leaves human approval. Then I set three stages. In shadow mode the agent only proposes orders and the buyers act. In stage two it raises orders after one click of approval. In stage three it acts alone under caps that are enforced in code: an amount per order and a total per day. The criteria for each move are written before we start, for example agreement with the buyers on 98% of 1,000 cases, and the procurement head gives sign-off. We review a sample every week. If errors or overrides cross a trigger, the agent goes back one stage. A new model version also sends it back until it is tested again."
