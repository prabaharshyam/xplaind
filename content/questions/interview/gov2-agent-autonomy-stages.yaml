id: gov2-agent-autonomy-stages
question: "A procurement team wants an AI agent that raises purchase orders and updates vendor records. How would you set up the stages by which it gains autonomy, and what would make you take autonomy away?"
kind: use-case
short_answer: "Autonomy is earned in stages, per action. First shadow mode: the agent proposes and people act. Then it acts after approval. Then it acts alone on low-risk actions under hard caps. Each move up needs agreed evidence and a sign-off. Defined triggers move it down, and any change to model, prompt or tools means testing again."
deeper_answer: "I work per action, not per agent. Raising a purchase order for stationery from an approved vendor is small and can be cancelled. A change of bank account on a vendor record is the kind of action fraudsters want, so it may never leave human approval.\n\nFor each stage I write down entry criteria before the pilot starts, so that the decision rests on numbers: for example, agreement with human decisions on at least 98% of 1,000 shadow cases, and no serious error. A named owner signs each move. In the autonomous stage, caps are enforced in code, and a sample of actions is reviewed every week. Step-down triggers are also written in advance: errors above a set value, a rise in overrides or complaints, or an incident. A new model version, prompt or tool sends the agent back one stage until it is tested again. Interviewers listen for criteria in both directions, limits outside the prompt and evidence per action."
follow_ups:
  - "What evidence would you ask for before the agent may raise purchase orders alone?"
  - "Why must the caps be enforced outside the prompt?"
  - "The model provider releases a new version. What happens to the agent's stage?"
common_mistakes:
  - "One approval decision for the whole agent instead of per action"
  - "No written criteria for increasing or reducing autonomy"
  - "Keeping the same autonomy after the model or prompt changes"
level: P2
topic: governance
