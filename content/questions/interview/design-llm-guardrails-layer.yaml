answer_seconds: 150
example: "I would start by ranking the risks for a fintech chat: leaking personal data, investment advice, prompt injection and wrong numbers. Then two stages. On input, I validate length, mask card and phone numbers, and run a small classifier for off-topic requests and injection attempts. On output, I check the schema, run a policy check for advice, scan for a leak of personal data, and add a grounding check that amounts match the retrieved account data. To stay inside 300 ms, rules and small classifiers run in parallel, and a slower model check runs only on risky cases. Each failure has an action: block with a clear message, retry once, or hand off to a person. The trade-off is safety against false blocks, so I measure false blocks on 500 labelled normal messages and attack success from red-team tests. I log every decision and version the rules."
