id: pairwise-vs-pointwise
question: What is the difference between pointwise and pairwise evaluation, and when would you use each?
kind: concept
short_answer: Pointwise evaluation scores each answer on its own, for example 1 to 5 against a rubric.
  Pairwise evaluation shows two answers side by side and asks which is better. Pairwise is easier and
  more consistent for subjective quality and for choosing between two systems; pointwise is better for
  tracking one system over time and for absolute pass or fail bars.
deeper_answer: 'Many pairwise votes can be turned into a ranking with methods such as Elo or Bradley-Terry,
  which is how public chatbot arenas rank models. Its limits: the number of pairs grows quickly with more
  models, voters need to know enough to judge, and position and length bias must be controlled by randomising
  order.


  Neither replaces exact checks for facts. In practice I use exact checks on every answer, pointwise judge
  scores for monitoring, and pairwise comparisons when deciding between two prompts or models.'
follow_ups:
- How would you remove position bias in pairwise judging?
- How many comparisons would you need to decide between two prompts?
common_mistakes:
- Treating preference as correctness
- Comparing answers always in the same order
