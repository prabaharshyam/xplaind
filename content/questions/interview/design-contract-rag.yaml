id: design-contract-rag
question: "Design a RAG system that lets a law firm search and ask questions about 50,000 contracts."
kind: use-case
short_answer: "Parse contracts carefully, keeping clause structure and tables, and store metadata such as client, contract type, dates and parties. Use hybrid search with filters and a reranker, answer only from retrieved clauses with citations, and say so when the answer is not found. Enforce per-matter access control, keep data in an approved region, and evaluate with lawyers' real questions."
deeper_answer: "Legal work needs precision and trust. Chunk by clause rather than fixed size, keep the clause number and heading with each chunk, and store structured fields so a lawyer can say 'indemnity clauses in supplier contracts signed after 2024'. Exact terms matter in law, so keyword search alongside vectors helps.\n\nEvery answer should quote and link the clause it relies on, and say 'not found' rather than guess. Access control is essential: lawyers must see only matters they are cleared for. Build a test set with the firm's lawyers, measure retrieval and answer accuracy, and keep a human lawyer responsible for any advice."
follow_ups:
  - "How would you handle scanned contracts?"
  - "How would you measure whether it is good enough to use?"
common_mistakes:
  - "Fixed-size chunks that split clauses"
  - "Ignoring which lawyer may see which matter"
level: I2
topic: rag
stop_id: rag-app
rubric:
  - point: "Parses and chunks by clause, keeping structure"
    keywords: ["clause", "structure", "parse", "chunk"]
  - point: "Stores metadata and supports filters"
    keywords: ["metadata", "filter", "date", "party", "type"]
  - point: "Uses hybrid search and reranking"
    keywords: ["hybrid", "keyword", "rerank"]
  - point: "Answers with citations and refuses when not found"
    keywords: ["cite", "citation", "not found", "refuse", "source"]
  - point: "Enforces access control per matter"
    keywords: ["access", "permission", "matter", "who can see"]
  - point: "Evaluates with real lawyer questions"
    keywords: ["evaluate", "test set", "lawyers", "accuracy"]
answer_seconds: 150
example: "I would start with fifty real questions from the firm's associates, like 'which supplier contracts have uncapped liability?'. Contracts go through a parser that keeps clause numbers; each chunk carries client, matter ID, contract type and signing date. Search combines BM25 and embeddings, filtered first by the matters the user is allowed to see, then reranked. The answer lists the matching clauses with links. We would launch to one practice group first and compare its answers with an associate's manual review."
