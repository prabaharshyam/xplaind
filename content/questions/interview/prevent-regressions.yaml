id: prevent-regressions
question: "How do you stop a prompt or model change from breaking things that used to work?"
kind: scenario
short_answer: "Keep a regression test set of past inputs, including every bug you have fixed, with checks for each. Run it automatically on every change, compare scores with the previous version, and block or review changes that make any category worse. Do the same before switching model versions."
deeper_answer: "Prompts are code with unpredictable side effects: fixing one case can quietly break five others. Automating the eval set in CI turns this into a visible number. Fast deterministic checks run on every push; slower judge-based or human checks run before releases.\n\nPin model versions in production so behaviour does not shift under you, and treat a model upgrade as a change that must pass the same tests. Watch per-category results, not only the average."
follow_ups:
  - "What would you do when a new model is better on average but worse in one category?"
  - "Which checks run on every push, and which only before release?"
common_mistakes:
  - "Testing only the case you were fixing"
  - "Letting the provider's model updates reach production untested"
level: P1
topic: evals
stop_id: regression-tests
rubric:
  - point: "Keeps a regression set of past inputs and fixed bugs"
    keywords: ["regression", "past", "bug", "test set"]
  - point: "Runs it automatically on every change"
    keywords: ["automatic", "every change", "ci", "pipeline"]
  - point: "Compares scores with the previous version"
    keywords: ["compare", "previous", "baseline", "score"]
  - point: "Blocks or reviews changes that get worse"
    keywords: ["block", "review", "gate"]
  - point: "Does the same before switching models"
    keywords: ["model version", "switch", "upgrade"]
answer_seconds: 90
example: "After a teammate improved our summarisation prompt for long documents, short documents started getting padded summaries. Our regression set had only long cases, so it missed this. We added a 'short document' category with 20 cases, ran the set on every pull request, and set a rule that no category may drop more than three points without a review. The next prompt change that hurt short summaries was caught before merge."
