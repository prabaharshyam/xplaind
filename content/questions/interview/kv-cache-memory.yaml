id: kv-cache-memory
question: What is the KV cache, and why can it cause out-of-memory errors when serving an LLM?
kind: concept
short_answer: The KV cache stores the key and value vectors for every earlier token, so each new token
  does not recompute them. It saves work but uses GPU memory that grows with context length, model size
  and the number of requests served at once, so long chats from many users can exceed memory.
deeper_answer: 'A rough size is 2 times layers times model width times tokens times batch size times bytes
  per number. A 13-billion-parameter model with 32 requests of 2,048 tokens can need over 50 GB, more
  than its weights.


  Fixes include shorter contexts and summarised history, serving engines with paged KV memory such as
  vLLM, models that share keys and values across heads, a quantised cache, and limits on concurrent requests.'
follow_ups:
- How would you estimate the cache size for a given model?
- Which serving features help with this?
common_mistakes:
- Saying the KV cache is used during training
- Only counting model weights when sizing a GPU
