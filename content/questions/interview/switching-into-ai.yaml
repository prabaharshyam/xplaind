id: switching-into-ai
question: "You come from a different field. Why are you moving into AI, and why should we believe you can do it?"
kind: real-life
short_answer: "Give a real reason for the move, linked to something you saw in your old field. Then give proof: projects you built, what you studied, and results. Show what carries over from your earlier work, such as domain knowledge. Be honest about what you still need to learn."
deeper_answer: "The interviewer has two doubts: is this a serious move or a reaction to news about AI, and can you do the work without years of practice. Words will not remove the doubt. Evidence will.\n\nUse four parts: the trigger, the work you have done, what transfers, and the gaps. The trigger should be a real problem you met. The proof should be something they can open and check. For example: \"I inspected welds by eye for four years, so I built a model that finds defects in weld photos. It is on my GitHub with the test results.\" Then say plainly what you have not done yet, such as running a model in production, and how you plan to learn it."
follow_ups:
  - "What was the hardest part of learning this on your own?"
  - "Are you ready to start at a more junior level or at lower pay?"
  - "What from your old field will help you here?"
common_mistakes:
  - "Saying AI is the future with no personal reason"
  - "Showing only course certificates and no project"
  - "Hiding or looking down on the earlier career"
level: I2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Gives a real, personal reason for moving into AI"
    keywords: ["reason", "because", "curious", "problem", "noticed", "made me"]
  - point: "Shows proof of ability: a project built and what was measured"
    keywords: ["built", "project", "github", "accuracy", "percent", "per cent"]
  - point: "Explains what carries over from the earlier field"
    keywords: ["what i bring", "domain", "background", "i know how", "carries over", "years in"]
  - point: "Is honest about gaps and has a plan to close them"
    keywords: ["not done yet", "not yet", "still need", "learn that", "junior level"]
answer_seconds: 120
example: "I am a mechanical engineer with four years in quality control at an auto parts plant near Pune. Every day my team checked about 2,000 castings by eye, and we still missed cracks. That made me curious about computer vision. Over the last year I studied in the evenings and built a model that finds surface cracks in casting photos. I collected 3,000 images from our own line, with permission, and the model catches 93 percent of defects on new images. What I bring is that I know how a factory floor works and what a false alarm costs. What I have not done yet is run a model in production. I expect to learn that here, and I am ready to start at a junior level."
