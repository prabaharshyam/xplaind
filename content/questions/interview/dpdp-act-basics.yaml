id: dpdp-act-basics
question: "What does India's DPDP Act mean for a company using AI?"
short_answer: "The Digital Personal Data Protection Act, 2023 governs how organisations process personal data. A company must have a lawful basis, usually consent, give clear notice, use data only for the stated purpose, keep it secure, delete it when no longer needed and respect people's rights to access and correct it."
deeper_answer: "Its Rules were notified in November 2025 with an 18-month phase-in, and penalties can reach ₹250 crore. For AI work this means: know what personal data goes into prompts, training data and logs; minimise it; check where your AI provider processes and stores it; and be able to delete a person's data on request. Children's data needs verifiable parental consent.\n\nThe EU AI Act is worth knowing too if you serve European users, because it sets duties by risk level. In an interview, it is enough to show you know these rules exist and how they shape design, not to quote sections."
follow_ups:
  - "What changes in your AI feature if a user asks you to delete their data?"
  - "How does the EU AI Act differ from the DPDP Act?"
common_mistakes:
  - "Thinking the law only applies to big tech"
  - "Forgetting logs and training data hold personal data too"
