id: experiment-tracking-why
question: "Why does experiment tracking matter, and what do you record?"
short_answer: "Without tracking you cannot reproduce or compare results, and you forget which run produced the model in production. Record the code version, data version, parameters, metrics, the environment and the model artefact for every run, in a tool such as MLflow or Weights and Biases."
deeper_answer: "Tracking turns 'I think the second run was better' into a table you can sort. It also answers audit questions later: which data trained this model, and who approved it.\n\nGood habits: log automatically from the training script, tag runs with the question they answer, keep the evaluation set fixed so scores are comparable, and register the chosen model in a model registry with its run linked. For LLM work the same applies to prompts and model versions."
follow_ups:
  - "How would you make a run fully reproducible?"
  - "What is a model registry for?"
common_mistakes:
  - "Tracking metrics but not data or code versions"
  - "Comparing runs evaluated on different data"
level: I3
topic: deployment
