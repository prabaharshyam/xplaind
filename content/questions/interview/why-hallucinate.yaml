answer_seconds: 60
example: "Ask a model 'What is the return policy of Sharma Electronics?' and, without access to that shop's policy, it may invent a believable '30-day return policy' because that pattern is common. In the shop's own assistant, we retrieve the actual policy and pass it in, tell the model to answer only from it and to say 'I don't know' otherwise, and check that answers quote the policy."
