id: why-hallucinate
question: "Why do language models hallucinate, and how do you reduce it in an app?"
short_answer: "A model generates likely text, not checked facts, so when it lacks the right information it can produce a confident, plausible answer that is false. In an app you reduce this by giving it the right source text (RAG), asking it to cite and to say when it does not know, and checking outputs."
deeper_answer: "Hallucination is a side effect of how models work: they are trained to continue text fluently, and nothing in plain generation checks claims against reality. Gaps in training data, questions about recent events, and very specific details such as citations, numbers and names are where it shows most.\n\nPractical defences: ground answers in retrieved documents and instruct the model to answer only from them; allow and reward \"I don't know\"; ask for citations and verify that cited text exists; use structured output so code can validate fields; and measure hallucination rate on a test set so you know whether a change helped."
follow_ups:
  - "How would you detect a made-up citation automatically?"
  - "Can RAG remove hallucination completely?"
common_mistakes:
  - "Claiming a better prompt alone can eliminate hallucination"
  - "Not giving the model a way to say it does not know"
level: B1
