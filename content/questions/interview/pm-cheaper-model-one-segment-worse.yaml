id: pm-cheaper-model-one-segment-worse
question: "Engineering wants to move your support assistant to a model that costs 60% less, and the overall eval score is the same, but answers in Hindi score 8 points lower. Do you ship?"
kind: scenario
short_answer: "Not on the average alone. Size the Hindi segment and read the failed answers to see how serious they are. Then compare options: route Hindi to the current model and move the rest, fix the prompt and retest, or wait. Ship the change only where quality holds, and monitor by language."
deeper_answer: "An unchanged average can hide a real loss for one group. If Hindi is 30% of conversations, an 8 point drop affects a large share of customers, and often the customers with the fewest other support options. The first step is to look at the failures. Are they small grammar issues, or wrong answers about refunds?\n\nThe decision is rarely yes or no. Routing by language keeps most of the saving: if 70% of traffic moves to the cheaper model, most of the 60% cut still arrives. Prompt changes or better Hindi examples may close the gap later. Interviewers listen for segment thinking, a look at real outputs, and a plan that captures savings without lowering quality for one user group."
follow_ups:
  - "What if routing by language is not possible this quarter?"
  - "How big a drop would you accept for a 60% saving?"
  - "How would you monitor Hindi quality after the change?"
common_mistakes:
  - "Deciding from the overall score only"
  - "Treating the Hindi drop as noise without reading outputs"
  - "Seeing only two choices: ship fully or not at all"
level: P1
topic: product
stop_id: evals-test-sets
rubric:
  - point: "Does not decide on the average; looks at the segment"
    keywords: ["overall score", "average", "segment"]
  - point: "Sizes the segment: share of traffic or customers"
    keywords: ["share of", "traffic", "volume"]
  - point: "Reads failed outputs to judge severity"
    keywords: ["failed", "serious", "native speaker"]
  - point: "Proposes routing or a partial rollout"
    keywords: ["rout", "partial", "stays on the current"]
  - point: "Monitors quality by language after the change"
    keywords: ["monitor", "track", "by language"]
answer_seconds: 120
example: "I would not ship on the overall score. First I would check the share of Hindi conversations. If it is 30% of traffic, an 8 point drop is a real problem. Then I would read 50 failed Hindi answers with a native speaker to see if they are serious, like a wrong refund rule, or only awkward wording. My likely proposal is routing: English moves to the cheaper model now, and Hindi stays on the current model until prompt fixes close the gap. That still gives us most of the saving. After the change I would monitor resolution rate and satisfaction by language every week, so we notice a slow drop early."
