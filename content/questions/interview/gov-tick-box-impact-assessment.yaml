id: gov-tick-box-impact-assessment
question: "A product team sends you a finished impact assessment one day before launch, with every risk marked low and nobody outside the team consulted. What do you do?"
kind: scenario
short_answer: "Do not sign it as it is. Check the risk tier. For a high-risk system, hold or limit the launch and run a focused session on the top risks, asking for evidence behind each rating. If leadership still wants to launch, record their risk acceptance. Then move the assessment to the design stage."
deeper_answer: "An assessment where every risk is low and nobody outside the team was asked is a form, not an analysis. But the response should fit the risk. For an internal tool, a one-hour review may be enough. For a system that affects customers, the missing work is the point: no test results, no view from support staff or affected users.\n\nA practical path is a short working session on the three or four risks that matter, with evidence for each rating: eval results, bias checks, the fallback plan. Launch can go ahead in a limited form if gaps are small. If you and the team disagree, the accountable executive decides and signs the accepted risk. Interviewers listen for firmness that still fits the level of risk, evidence over opinion, and a fix to the process such as a gate at design review."
follow_ups:
  - "What evidence would you accept for a 'low' rating?"
  - "What if the launch date is fixed by a client contract?"
  - "How do you get teams to start the assessment earlier?"
common_mistakes:
  - "Signing to avoid delaying the launch"
  - "Blocking every launch in the same way, whatever the risk"
  - "Fixing this one case but not the process"
level: P1
topic: governance
stop_id: ai-risk-frameworks
rubric:
  - point: "Does not sign without evidence"
    keywords: ["not sign", "no evidence", "proof", "test results"]
  - point: "Scales the response to the risk tier"
    keywords: ["tier", "customer-facing", "high risk"]
  - point: "Runs a focused review of the top risks with the right people"
    keywords: ["session", "top risks", "consult"]
  - point: "Offers a limited launch or records risk acceptance by an executive"
    keywords: ["limited launch", "risk acceptance", "escalat"]
  - point: "Moves the assessment earlier in the process"
    keywords: ["design stage", "earlier", "gate"]
answer_seconds: 130
example: "I would not sign it as it stands, because a rating with no evidence is only an opinion. First I check the tier. If this is a customer-facing system, I ask for a two-hour session the same day on the top risks: wrong answers, personal data and unfair outcomes. For each one I ask for proof, such as test results, and I consult the support team who know the customers. If the gaps are small, I can agree to a limited launch to 5% of users with monitoring. If the team wants a full launch anyway, the business head signs a risk acceptance. Afterwards I change the process: the assessment starts at the design stage and is a gate in design review."
