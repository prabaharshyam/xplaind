answer_seconds: 90
example: "Suppose I am on a team in Hyderabad with a coding agent that edits files well but often says a task is done when the tests still fail. I keep the same model and add one harness part: the loop may only finish after the test command passes, and test output goes back to the model. That one change is harness engineering. I run the same 20 tasks before and after to see whether more tasks now pass."
