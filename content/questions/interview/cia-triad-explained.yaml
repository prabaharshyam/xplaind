id: cia-triad-explained
question: "What is the CIA triad, and how would you use it to judge a security problem?"
kind: concept
short_answer: "CIA stands for confidentiality, integrity and availability. Confidentiality means only the right people see data. Integrity means data is not changed without permission. Availability means systems work when people need them. For any incident or design, I ask which of the three is at risk, how badly, and which control protects it."
deeper_answer: "The triad is a checklist for impact. A leaked customer list is a confidentiality problem; a changed bank account number in an invoice is an integrity problem; a website knocked offline is an availability problem. One incident can hit more than one: ransomware encrypts files (availability) and often steals them first (confidentiality).\n\nEach goal has typical controls. Confidentiality: access control, encryption, data minimisation. Integrity: hashing, digital signatures, change approval, audit logs. Availability: backups, redundancy, rate limits and tested recovery. The goals can pull against each other, so a good answer names the trade-off, such as strict access slowing down an urgent fix."
follow_ups:
  - "Which part of the triad does ransomware hit, and why is the answer often more than one?"
  - "How does the triad apply to an LLM chatbot?"
common_mistakes:
  - "Saying encryption alone covers all three goals"
  - "Forgetting availability, as if security were only about secrecy"
level: B2
topic: security
stop_id: how-attacks-work
rubric:
  - point: "Names confidentiality, integrity and availability correctly"
    keywords: ["confidentiality", "integrity", "availability"]
  - point: "Gives an example of each goal being broken"
    keywords: ["leak", "changed", "offline", "tamper", "outage"]
  - point: "Links each goal to controls"
    keywords: ["access control", "encryption", "backup", "hash", "signature"]
  - point: "Notes one incident can hit more than one goal, or that goals trade off"
    keywords: ["more than one", "both", "trade-off", "tradeoff"]
answer_seconds: 75
example: "At a hypothetical Jaipur e-commerce firm, I would sort three past problems with the triad. Order data exposed through a public storage bucket was confidentiality, fixed with access rules and an alert on public buckets. A refund script that changed amounts without approval was integrity, fixed with approval and an audit log. The sale-day outage was availability, fixed with load tests and autoscaling."
