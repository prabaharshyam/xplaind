id: poc-to-production-gates
question: "How do you move an AI solution from proof of concept to production?"
short_answer: "Use stage gates. A proof of concept shows feasibility on real samples in weeks. A pilot puts it in front of real users in a limited scope, with monitoring, feedback and the agreed metrics. Production adds security review, integration, scale, support, documentation and ownership. Each gate has written exit criteria, so the client decides on evidence."
deeper_answer: "Many AI projects stall after an impressive demo because nobody planned the pilot: no users, no metric, no owner. Agree the pilot's success criteria and the production requirements before the proof of concept ends.\n\nProduction readiness for AI also means evals in CI, cost controls, incident processes and a plan for model updates."
follow_ups:
  - "Why do so many proofs of concept never reach production?"
  - "What exit criteria would you set for a pilot?"
common_mistakes:
  - "Treating the demo as the finish line"
  - "No owner after launch"
