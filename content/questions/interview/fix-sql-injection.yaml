id: fix-sql-injection
question: "You find code that builds a SQL query by joining strings with user input. What is the risk and how do you fix it?"
kind: scenario
short_answer: "It is open to SQL injection: an attacker can type input that changes the query itself, to read, change or delete data. The fix is parameterised queries, so input is always treated as data and never as SQL. I would add least-privilege database accounts, input validation as a second layer, and a test with malicious input."
deeper_answer: "When code does something like \"SELECT * FROM users WHERE email = '\" + email + \"'\", a quote in the input ends the string and the rest is run as SQL. Parameterised queries, or an ORM used properly, send the query and the values separately, so the database never parses the input as code.\n\nEscaping by hand and blocklists of words like DROP are weak because attackers find encodings and edge cases. Defence in depth helps: the app's database user should have only the rights it needs, errors should not show SQL to users, and a web application firewall can catch common payloads. Search the codebase for the same pattern, because one bad query usually means others."
follow_ups:
  - "Why is escaping quotes by hand not enough?"
  - "Can an ORM still be vulnerable to SQL injection?"
common_mistakes:
  - "Relying on a blocklist of SQL keywords"
  - "Fixing the one query and not searching for the same pattern elsewhere"
level: B3
topic: security
stop_id: web-app-security
rubric:
  - point: "Names SQL injection: input changes the query"
    keywords: ["sql injection", "changes the query", "run as sql", "input"]
  - point: "Fix is parameterised or prepared statements"
    keywords: ["parameterised", "parameterized", "prepared statement", "placeholder", "bind"]
  - point: "Adds least-privilege database account"
    keywords: ["least privilege", "permission", "database user", "rights"]
  - point: "Rejects blocklists or hand escaping as the main fix"
    keywords: ["blocklist", "escaping", "filter"]
  - point: "Tests and searches for the same pattern elsewhere"
    keywords: ["test", "search", "codebase", "other queries"]
answer_seconds: 90
example: "In a code review for a hypothetical Chennai college's results portal, the roll-number search joined strings into SQL. I showed the risk with a harmless test input on our staging copy, replaced the query with a parameterised one, searched the repo and fixed four similar queries, removed DELETE rights from the app's database user, and added a unit test that sends a quote character and expects a normal 'not found' reply."
