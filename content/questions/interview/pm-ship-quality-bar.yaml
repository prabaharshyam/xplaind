id: pm-ship-quality-bar
question: "How do you decide how good an AI feature must be before you ship it?"
kind: concept
short_answer: "Start from the baseline: how well does the current process or a person do the task? Then set separate bars by error type: zero tolerance for severe errors, a target rate for minor ones. The bar is lower if a human reviews output and mistakes are easy to undo. Agree it before seeing results."
deeper_answer: "There is no universal number. 90% correct is excellent for draft email subject lines and unacceptable for medicine reminders. Three things set the bar: the baseline you replace, the cost of each kind of error, and whether a person can catch and reverse a mistake. One overall score hides this, so strong candidates split it: severe errors, minor errors, and refusals.\n\nIf the feature cannot reach the bar, change the scope before lowering the bar. For example, an invoice reader that is 99% right on printed invoices and 85% on handwritten ones can launch for printed invoices only, and send the rest to people. Interviewers listen for a bar fixed in advance, tied to user harm, and for the option of a narrower launch."
follow_ups:
  - "What if the human baseline is unknown?"
  - "Who signs off the bar?"
  - "How do you handle pressure to lower the bar near the launch date?"
common_mistakes:
  - "Picking a round number such as 95% with no reason"
  - "Using one average score for all error types"
  - "Moving the bar after seeing the results"
level: I3
topic: product
stop_id: evals-test-sets
rubric:
  - point: "Compares against the current baseline, human or existing process"
    keywords: ["baseline", "current process"]
  - point: "Sets different bars by error severity"
    keywords: ["severe", "severity", "minor", "serious"]
  - point: "Considers human review and how easily errors are undone"
    keywords: ["review", "undo", "revers"]
  - point: "Agrees the bar before seeing results"
    keywords: ["before we run", "in advance", "agree the bar"]
  - point: "Narrows scope if the bar is not met"
    keywords: ["scope", "narrow", "printed invoices only"]
answer_seconds: 120
example: "I do not start with a number like 95%. I start with the baseline. If our data entry team reads invoices with 97% accuracy today, the model must match that or come with a check. Then I split errors by severity. A wrong GST number or amount is severe, so my bar there is close to zero on the test set. A missing address line is minor. I also ask whether a person will review the output and whether a mistake is easy to undo. We agree the bar with finance before we run the final eval, so nobody moves it later. If handwritten invoices fail, I narrow the scope and launch for printed invoices only."
