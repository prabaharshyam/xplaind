id: fresher-no-experience
question: "You have no work experience. Why should we take a chance on you?"
kind: real-life
short_answer: "Do not apologise for being a fresher. Show proof of ability from projects, internships, competitions or open-source work, with what you built and the result. Show that you learn fast and finish what you start. Be honest about what you do not know, and say how you will become useful quickly."
deeper_answer: "The interviewer already knows you are a fresher. They called you anyway. They are checking three things: can you build something real, do you learn quickly, and will you need to be told every step.\n\nUse proof, learning, attitude. Proof is a project you can explain in depth, including what failed. Learning is one example of learning a tool fast. Attitude is being ready for basic tasks at first. For example: \"I have no job experience, but I have built and deployed a project that 30 real users tried, and I fixed the problems they found.\" That one line does more than any list of courses. Do not claim skills you cannot show in the next question."
follow_ups:
  - "Explain that project in detail. What was the hardest part?"
  - "What will you do if you are given a task you know nothing about?"
  - "Your marks are average. Why?"
common_mistakes:
  - "Apologising or sounding unsure of your own worth"
  - "Listing courses and certificates with no project"
  - "Claiming skills that fail on the first follow-up"
level: B1
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Shows proof of ability from a project or internship"
    keywords: ["project", "built", "internship", "deployed", "github"]
  - point: "Gives a concrete result or real users"
    keywords: ["users", "tried it", "result", "fixed", "test questions"]
  - point: "Shows the ability to learn fast, with an example"
    keywords: ["learned", "weeks", "taught myself", "documentation", "quickly"]
  - point: "Is honest about limits and ready to start with basic tasks"
    keywords: ["do not know", "not yet", "ready to start", "small tasks", "willing"]
answer_seconds: 120
example: "It is true that I have not held a job. But I have done real work. I finished my BSc in computer science in Indore this year. For my final project I built a chatbot that answers admission questions from our college prospectus. I put it online, and 30 juniors tried it during admission week. They found it gave wrong fee amounts, because the fee table was being split into pieces. I fixed that and wrote 40 test questions to check every change. I learned the tools for it in about three weeks from documentation and videos, with nobody to guide me. I do not know yet how a large production system runs. I am ready to start with testing and small tasks, and I will ask good questions."
