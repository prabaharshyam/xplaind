id: sec-llm-key-in-mobile-app
question: "During a review you find the LLM provider's API key inside your company's mobile app, and a database password written in the system prompt. What do you do?"
kind: scenario
short_answer: "Treat both as leaked. Revoke and rotate the key and the password now, and check usage and billing logs for abuse. Then fix the design: the app calls our backend, which holds the key in a secret manager and adds authentication, rate limits and spend caps. Nothing secret goes in a prompt, because prompts can be extracted."
deeper_answer: "Anything shipped to a user's device can be read by that user: a key in an app is public, whatever obfuscation is used. Attackers look for such keys to run their own workloads on someone else's bill. A system prompt is not a safe place either. Users can often make the model repeat it, and the OWASP Top 10 for LLM applications lists system prompt leakage as a risk. A database password there could give direct access to data.\n\nOrder matters. First contain: rotate, then review logs for unknown IP addresses, unusual volume or unusual database queries, and treat it as an incident if there are signs of use. Then redesign: a backend proxy holds the key; each user is authenticated; limits apply per user; the model reaches data only through a narrow service with its own least-privilege credentials. Then prevent: secret scanning in CI and on the built app, separate keys per environment, and budget alerts. Interviewers listen for rotate first, then the architecture fix."
follow_ups:
  - "Why is hiding or encrypting the key inside the app not enough?"
  - "How should the model get data from the database if it cannot hold the password?"
  - "What would you look for in the provider's usage logs?"
common_mistakes:
  - "Removing the key from the next release without rotating it"
  - "Believing a system prompt is secret"
  - "Giving the model's database access more rights than it needs"
level: I2
topic: security
