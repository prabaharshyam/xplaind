answer_seconds: 120
example: "I would treat both as leaked from the day the app was published. First I would rotate the API key and the database password, and revoke the old ones. Then I would check the provider's usage and billing page and our database logs for unusual activity, such as calls at night from other countries. If I see abuse, I open an incident. Next is the design fix. The mobile app should call our backend, and only the backend holds the key, in a secret manager. The backend checks that the user is logged in and applies a rate limit and a monthly spend cap. The password must leave the system prompt, because a prompt can be extracted by users. The model should get data through a narrow read-only service with least privilege. Last, I would add secret scanning in CI for the code and the app build."
