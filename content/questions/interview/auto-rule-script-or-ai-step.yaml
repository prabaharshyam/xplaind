id: auto-rule-script-or-ai-step
question: "For one step in a workflow, how do you choose between a no-code rule, a script and an AI step?"
kind: concept
short_answer: "I use the simplest option that handles the input. Fixed, structured input with clear rules: a no-code node or filter. Logic that is exact but too complex for nodes, such as date maths or matching records: a small script. Messy language input, such as emails or scanned text: an AI step, with output checks and a fallback to a person."
deeper_answer: "The three options differ in cost, predictability and who can maintain them. A rule or a script gives the same output for the same input every time and costs almost nothing per run. An AI step can read unclear text, but it can be wrong in new ways, costs money per call and is slower. So I use AI only where the input is language or images that rules cannot handle.\n\nExample: for refund requests, a rule checks if the order is within 7 days, a script calculates the refund amount with tax, and an AI step reads the customer's message to find the reason. I never let the AI step do the arithmetic. I also ask who will maintain it: a script needs someone who can read code. Interviewers listen for a clear decision rule, not for 'AI everywhere'."
follow_ups:
  - "When is a no-code tool the wrong choice for the whole workflow?"
  - "How do you check the output of an AI step before the next step uses it?"
  - "Why not let the AI step calculate the refund amount?"
common_mistakes:
  - "Using an AI step where a simple rule works"
  - "Forgetting who will maintain a script"
  - "No check on the output of the AI step"
level: B3
topic: automation
stop_id: what-is-automation
