answer_seconds: 120
example: "I start with the simplest option that can handle the input. For a refund workflow at an online store, the order data is structured, so a simple rule checks if the order is within 7 days. The refund amount needs tax and partial quantity, so I wrote a small JavaScript script to calculate it, because that must be exact. The customer's message is messy language, sometimes in Hinglish, so an AI step reads it and returns one reason from a fixed list. If the reason is not in the list, the fallback is a person. I do not use AI for the first two steps because a rule gives the same output every time and costs nothing per run, and the team can maintain it without me."
