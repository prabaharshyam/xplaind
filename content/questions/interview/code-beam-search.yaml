  - point: "Mentions length normalisation, or that width 1 is greedy"
    keywords: ["normalise by length", "greedy", "longer sequences"]
answer_seconds: 180
example: "I would confirm the interface first: a function that takes a prefix and returns the probabilities of the next token, plus a beam width, a maximum length, and an end token. I keep a list of beams, where each beam is a sequence and a score. The score is the sum of log probabilities, not a product, to avoid underflow. I start with one empty sequence at score 0. At each step I expand every beam with every possible token, add the log probability, and then keep only the top B candidates overall. A sequence that produces the end token goes to a finished list and is not expanded again. At the end I return the best finished sequence, and I normalise by length, because longer sequences always have lower scores. The cost is steps times beam width times vocabulary. A width of 1 is greedy search. I would test it against a full enumeration on a tiny vocabulary."
