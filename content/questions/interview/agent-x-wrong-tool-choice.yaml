id: agent-x-wrong-tool-choice
question: "Your support agent has two tools, search_orders and search_tickets, and it often calls the wrong one or passes a phone number where an order ID is needed. How do you fix it?"
kind: scenario
short_answer: "I would read the failing traces first, then fix the tools before the prompt. Rewrite each description to say when to use it and when not to, state the exact format of each parameter with an example, and return clear error messages on bad input. If two tools still overlap, merge them. Then measure with a small tool-selection test set."
deeper_answer: "The model sees only the tool name, the description and the parameter schema. If a new team member could not choose between the two tools from that text, the model cannot either. So the description should read like a note to a colleague: what the tool returns, when to use it, when to use the other one, and what an order ID looks like.\n\nThe second fix is in code. Validate arguments, and when a phone number arrives in the order ID field, return an error that says what was wrong and what to do next, for example to call find_customer_by_phone first. The model can then correct itself in the next step. Interviewers listen for a method: look at traces, change one thing, and rerun a fixed set of test requests to see whether the wrong-tool rate fell. They also like hearing that fewer, clearer tools are better than many similar ones."
follow_ups:
  - "How would you build the test set for tool selection?"
  - "When would you merge the two tools into one?"
  - "What makes a tool error message useful to a model?"
common_mistakes:
  - "Adding more rules to the system prompt and leaving the tool descriptions vague"
  - "Returning a raw stack trace or an empty result on bad input"
  - "Changing several things at once without measuring"
level: I3
topic: agents
stop_id: agent-tool-design
rubric:
  - point: "Starts from traces of the failing calls, not from guesses"
    keywords: ["trace", "log", "failing calls", "looked at"]
  - point: "Rewrites descriptions to say when to use each tool and when not to"
    keywords: ["description", "when to use", "when not"]
  - point: "States parameter formats clearly, with an example value"
    keywords: ["format", "parameter", "example", "order id"]
  - point: "Validates arguments and returns error messages the model can act on"
    keywords: ["validat", "error message"]
  - point: "Measures the change on a fixed set of test requests"
    keywords: ["test set", "measure", "test requests", "rate"]
answer_seconds: 120
example: "I would start with the traces. In a support agent I worked on, I looked at 50 failing calls and found that both tools had a one-line description: search orders, and search tickets. So I rewrote each description to say what it returns, when to use it, and when not to use it. For the order ID parameter I gave the format and an example, such as OD followed by ten digits. I also added validation in code. If a phone number came in, the tool returned an error message that said: this is a phone number, call find_customer_by_phone first. Then I ran a test set of 80 real requests and measured the wrong-tool rate. It fell from about one in five to almost zero, without any change to the system prompt."
