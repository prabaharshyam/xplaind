    keywords: ["cheaper", "cost", "faster", "scale"]
  - point: "RAG enables access control and citations"
    keywords: ["access control", "permission", "cite", "source"]
  - point: "Models miss details in very long inputs"
    keywords: ["miss", "lost in the middle", "middle", "long input"]
answer_seconds: 90
example: "A client with a 40-page product manual asked whether they needed RAG. For that, I put the whole manual in the prompt with caching, and it worked well and was simple. Another client had 30,000 documents with different access rights per department; there, RAG was the only practical option, because we could filter by permission, keep cost per question low and cite the exact page."
