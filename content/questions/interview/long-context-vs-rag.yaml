id: long-context-vs-rag
question: "Models now have very large context windows. Why not put all the documents in the prompt instead of using RAG?"
kind: scenario
short_answer: "For a small, stable document set, putting it all in the prompt can be simpler and work well, especially with prompt caching. For large or changing collections, RAG is cheaper, faster and scales: you send only relevant text, can enforce access control per user, and can cite sources. Models can also miss details buried in very long inputs."
deeper_answer: "Cost and latency grow with input tokens on every request, so a full-corpus prompt is expensive at volume, though caching a fixed prefix helps. Very long inputs can reduce attention to material in the middle. And a corpus of millions of documents will not fit anyway.\n\nA practical answer is \"it depends, and here is how I would decide\": if the knowledge base fits comfortably and rarely changes, try long context with caching and measure; otherwise use retrieval, perhaps retrieving larger sections to give the model more context."
follow_ups:
  - "How does prompt caching change this decision?"
  - "How would you handle per-user document permissions?"
common_mistakes:
  - "Saying RAG is obsolete because of long context"
  - "Ignoring cost per request at scale"
level: P3
topic: approach-choice
stop_id: prompt-rag-or-finetune
rubric:
  - point: "Small stable sets can go in the prompt"
    keywords: ["small", "stable", "all in the prompt", "whole"]
