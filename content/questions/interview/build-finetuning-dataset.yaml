id: build-finetuning-dataset
question: How would you build a dataset to fine-tune an LLM for a business task?
kind: use-case
short_answer: Define the task, output format and a test set first. Write a labelling guide with hard cases
  and pilot it with two people until they agree. Label a varied first set of 50 to 100 excellent examples,
  then deduplicate, fix formats and mask personal data. Fine-tune, test, and grow the set only while scores
  keep rising.
deeper_answer: 'Quality beats volume: examples should be relevant, aligned with the task, consistent,
  correctly formatted, unique and allowed to be used. Coverage matters as much: list how real inputs vary
  (language, length, topic, format) and sample across them.


  To move faster, have a strong model draft outputs and let experts correct them, while spot-checking
  that reviewers do not wave drafts through. A learning curve at 25%, 50% and 100% of the data tells you
  whether to collect more or fix quality.'
follow_ups:
- How would you check that two labellers agree?
- Where would new examples come from after launch?
common_mistakes:
- Labelling at scale before a guide and pilot
- Collecting whatever data is easiest
level: P1
topic: approach-choice
stop_id: building-training-data
