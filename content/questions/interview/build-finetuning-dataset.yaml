answer_seconds: 90
example: For a rental-agreement summariser, two lawyers first agreed on only 70% of fields. We added twelve
  hard examples to the guide and reached 92% on the next pilot. A model drafted summaries that the lawyers
  corrected, which tripled their speed, and a learning curve from 150 to 600 examples showed scores still
  rising, so we kept collecting.
