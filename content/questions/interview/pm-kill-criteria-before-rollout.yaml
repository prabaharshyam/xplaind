id: pm-kill-criteria-before-rollout
question: "What stop or rollback criteria do you agree before rolling out an AI feature, and who gets to act on them?"
kind: concept
short_answer: "Write them before launch, as numbers: for example, any severe harmful output, a complaint rate above a set level, or a guardrail metric falling past a threshold. Name one owner who can switch the feature off without a meeting, test the switch, and define what users see instead."
deeper_answer: "During an incident, people argue for keeping the feature on: the launch was announced, the data is early, the case may be a one-off. Criteria written in advance remove that debate. Good criteria are measurable and few. One type is a hard stop: one confirmed case of a severe harm, such as leaking another user's data. Another is a threshold over a window, such as thumbs-down above 15% for two days.\n\nA criterion is useless without authority and a working switch. Name the on-call person who may turn the feature off, including at night, and practise it once. Decide the fallback: the old screen, or a message that hands over to a person. Interviewers listen for thresholds fixed before launch, a named owner, and a fallback, not only 'we will monitor closely'."
follow_ups:
  - "Give an example of a hard stop and a threshold stop."
  - "Who should own the kill switch, product or engineering?"
  - "How do you decide when to turn the feature back on?"
common_mistakes:
  - "Saying 'we will monitor' with no thresholds"
  - "Needing a leadership meeting to switch off"
  - "No fallback experience for users"
level: P1
topic: product
