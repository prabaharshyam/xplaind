answer_seconds: 120
example: "Before launch I write the stop criteria with engineering and support, as numbers. There are two kinds. A hard stop: one confirmed case of severe harm, such as the assistant showing another customer's data, and the feature goes off at once. And a threshold: for example, thumbs-down rate above 15% for two days, or complaint tickets doubling. I name an owner, usually the on-call engineer, who has authority to use the kill switch without calling a meeting, and we test the switch in staging. I also define the fallback, so users see the old search screen and not an error. Turning it back on needs a fix and a clean eval run."
