id: model-size-choice
question: "How do you decide which model size to use for a feature?"
short_answer: "Run your eval set on a few model sizes and compare quality, latency and cost per request. Choose the cheapest model that meets your quality bar for that task. Many products use a mix: a small, fast model for simple steps such as classification, and a larger one only where reasoning quality matters."
deeper_answer: "Quality differences between models vary by task: on easy tasks a small model may match a large one; on hard reasoning it may not. Only your own test set tells you.\n\nRouting is a common pattern: classify the request, send easy ones to a cheap model and hard ones to a strong model, or try the cheap model first and escalate when a check fails. Revisit the choice when new models are released, because the price and quality frontier moves quickly."
follow_ups:
  - "How would you route requests between two models?"
  - "How often would you revisit the choice?"
common_mistakes:
  - "Always defaulting to the largest model"
  - "Choosing by public benchmarks instead of task-specific tests"
