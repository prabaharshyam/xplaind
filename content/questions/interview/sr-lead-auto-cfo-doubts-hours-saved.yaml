id: sr-lead-auto-cfo-doubts-hours-saved
question: "Your automation programme reports 60,000 hours saved in a year, which you valued at ₹2 crore. The CFO says the salary bill has not changed and asks what the company really gained. How do you answer?"
kind: scenario
short_answer: "The CFO has a fair point: hours saved are not cash until the time is used elsewhere. I would split the benefit into cash saved, cost avoided, such as hires not made, capacity moved to other work, and quality gains like fewer errors. I would show evidence, subtract running costs, and agree with finance how to count future benefits."
deeper_answer: "Hours multiplied by an hourly rate is an estimate of capacity, not money the company can spend. If 200 people each save an hour a day and no role changes, the salary bill stays the same. A senior answer accepts this and then shows where value did appear. Hard cash: cancelled software licences, less overtime, fewer agency staff, penalties avoided. Cost avoided: volume grew 25% and the team did not grow. Capacity moved: staff shifted to collections or customer work, with a result you can measure. Quality: error rates and processing time.\n\nAlso show the cost side: licences, the team's salaries and maintenance. The trade-off is that the honest number will be smaller than ₹2 crore, but finance will trust it. From then on, agree the baseline and the benefit type with finance before each project starts, and have the department head confirm the result. Interviewers listen for a clear difference between time and money, evidence, net figures, and a better method agreed with finance."
follow_ups:
  - "Would you ever recommend reducing headcount to turn the hours into cash?"
  - "How do you count a hire that was avoided?"
  - "Which projects would you stop after this review?"
common_mistakes:
  - "Defending the ₹2 crore figure as cash"
  - "Leaving out the programme's own costs"
  - "Measuring hours with no baseline"
level: P2
topic: automation
stop_id: measuring-roi
rubric:
  - point: "Accepts that hours saved are not cash by default"
    keywords: ["not cash", "capacity", "fair point", "not money"]
  - point: "Splits benefits into cash, cost avoided, capacity and quality"
    keywords: ["cost avoided", "overtime", "quality", "error"]
  - point: "Shows evidence of where the time went"
    keywords: ["evidence", "moved", "did not hire", "redeploy"]
  - point: "Subtracts the programme's own costs"
    keywords: ["net", "licence", "maintenance", "running cost"]
  - point: "Agrees the counting method and baseline with finance"
    keywords: ["finance", "baseline", "confirm"]
answer_seconds: 165
example: "I would start by agreeing with the CFO. 60,000 hours is capacity, not cash, unless the time is used for something. Then I would split the ₹2 crore into parts with evidence. Real cash: overtime in accounts payable fell by about ₹25 lakh, and we stopped one agency contract. Cost avoided: invoice volume grew 25% and the team did not hire. Capacity moved: six people now work on collections, and overdue payments fell. Quality: the error rate in data entry dropped. I would also show the net figure after licences and maintenance, even though it is smaller. For next year, I would agree the baseline and the type of benefit with finance before each project starts, and the department head would confirm the result."
