id: chinchilla-scaling-law
question: What is the Chinchilla scaling law, and why do labs now train models far beyond it?
kind: concept
short_answer: Chinchilla found that for a fixed training compute budget, the best model comes from growing
  parameters and training tokens together, about 20 tokens per parameter. Many earlier large models were
  undertrained. Labs now train smaller models far longer, because a smaller model is cheaper to run for
  millions of users and keeps improving with more data.
deeper_answer: 'DeepMind trained over 400 models to fit how loss depends on size and data. Their 70B Chinchilla,
  trained on 1.4 trillion tokens, beat larger models trained on less. The rule minimises training cost
  only.


  When inference dominates, it pays to over-train: Llama 3 8B saw about 15 trillion tokens, nearly 1,900
  per parameter. Training compute is roughly 6 times parameters times tokens. Returns diminish, and the
  next limits are high-quality data and energy.'
follow_ups:
- How would you estimate the training compute of a model?
- Why might a newer small model beat an older large one?
common_mistakes:
- Saying bigger is always better
- Treating Chinchilla as the target for product models
