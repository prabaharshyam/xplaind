example: "The input is one vector of logits over the vocabulary. First I apply the temperature: I divide the logits by it, then take a stable softmax. A temperature below 1 makes the distribution sharper, and above 1 makes it flatter. If the temperature is 0, I just return the argmax. Then nucleus sampling: I sort the probabilities in descending order, take the cumulative sum, and keep the smallest prefix whose cumulative probability reaches p. I include the token that crosses the threshold, so I always keep at least one token. Then I renormalise the kept probabilities so they sum to 1, and sample from them. The cost is the sort, so V log V. With probabilities 0.5, 0.3, 0.15, 0.05 and p of 0.7, I keep the first two and sample with 0.625 and 0.375. I would test p equal to 1, which should keep every token."
