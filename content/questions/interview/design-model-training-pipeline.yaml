answer_seconds: 150
example: "For a weekly loan default model on 50 million rows, I would first clarify the trigger and the label delay. A default takes months to show, so my training window ends where the label is reliable. An orchestrator runs the steps. First it validates the data: schema, null rates and distribution against last week. If that fails, the run stops and alerts. Then it builds features from a versioned snapshot and trains with pinned code and configuration, tracking parameters and metrics so the run is reproducible. Next it scores the candidate and the production model on the same time-based holdout, overall and by slice, for example new borrowers. A gate promotes the candidate only if it beats the champion by a set margin. It goes into the registry and out as a canary, with rollback ready. The trade-off is freshness against risk: weekly retraining follows the market, but each release can break something."
