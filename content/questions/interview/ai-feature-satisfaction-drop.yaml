id: ai-feature-satisfaction-drop
question: "Your AI feature launched, usage is high, but customer satisfaction dropped. What do you do?"
kind: scenario
short_answer: "High usage with falling satisfaction suggests people are forced through it or it is failing them. I segment the data to see who is unhappy and on which tasks, read real conversations, and check quality metrics and escalations. Then I fix the biggest failure, make it easy to reach a person, and measure outcomes, not just usage."
deeper_answer: "Usage alone is a weak metric for AI features, especially if the feature sits in front of what users actually wanted, such as a chatbot before human support. Satisfaction, task completion, repeat contacts and escalations tell you whether it helps.\n\nStart with evidence: sample conversations from unhappy users, tag the failure types, and quantify them. Common causes are wrong answers, no way to reach a human, slow responses or a tone that feels dismissive. Fix the top cause, run a controlled test, and report the trade-off honestly to leadership."
follow_ups:
  - "Which metrics would you have tracked from launch?"
  - "Would you roll the feature back?"
common_mistakes:
  - "Celebrating usage numbers"
  - "Changing the model before understanding the failures"
level: P3
topic: product
stop_id: kpi-that-matters
rubric:
  - point: "Recognises usage is not success"
    keywords: ["usage", "not success", "forced", "vanity"]
  - point: "Segments data and reads real conversations"
    keywords: ["segment", "conversations", "transcripts", "read"]
  - point: "Checks quality, escalations and outcomes"
    keywords: ["quality", "escalation", "resolution", "outcome"]
  - point: "Fixes the biggest failure and allows reaching a human"
    keywords: ["fix", "human", "handoff", "escalate"]
  - point: "Sets outcome-based success metrics"
    keywords: ["metric", "satisfaction", "resolution rate", "outcome"]
answer_seconds: 90
example: "We launched an AI assistant in a bank app's help section, and within a month most help sessions went through it, but app-store ratings mentioning support fell. Reading 200 conversations, we found a third were about card blocks and disputes, which the assistant could only explain, not do, and there was no button to reach an agent. We added a 'talk to a person' option for those topics and measured resolution rate instead of sessions. Ratings mentioning support improved over the next two months."
