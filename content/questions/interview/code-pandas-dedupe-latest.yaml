id: code-pandas-dedupe-latest
question: "A table of user profile updates has user_id, plan and updated_at, with several rows per user. Keep only the latest row for each user. For example, if user 1 has rows from January and March, keep the March row."
kind: use-case
short_answer: "Sort by the timestamp, then drop duplicates on the id and keep the last one: df.sort_values(\"updated_at\").drop_duplicates(\"user_id\", keep=\"last\"). The sort costs O(n log n). Make sure updated_at is a real datetime, and decide what to do with ties and missing timestamps."
deeper_answer: "First clarify what latest means. Ask which column defines it, whether two rows for one user can share the same timestamp, and whether updated_at can be missing. Check the type: timestamps stored as text can sort in the wrong order.\n\nThe steps are: convert with pd.to_datetime(df[\"updated_at\"]), then run df.sort_values(\"updated_at\").drop_duplicates(\"user_id\", keep=\"last\"). After an ascending sort, the last row for each user is the newest one. For ties, add a second sort key, such as sort_values([\"updated_at\", \"version\"]), so the result is the same on every run. An alternative that avoids a full sort is df.loc[df.groupby(\"user_id\")[\"updated_at\"].idxmax()], which needs a unique index.\n\nWatch missing timestamps: sort_values puts them last, so with keep=\"last\" a row with no timestamp would win. Pass na_position=\"first\" or drop those rows before sorting. Test a user with one row, tied timestamps and a missing timestamp, and check that the row count equals df[\"user_id\"].nunique(). Say that this matches ROW_NUMBER() with ORDER BY updated_at DESC in SQL."
follow_ups:
  - "What if two rows for a user have the same timestamp?"
  - "How would you do this in SQL?"
  - "How would you keep the latest non-missing value of each column instead of the latest row?"
common_mistakes:
  - "Calling drop_duplicates without sorting first, which keeps an arbitrary row"
  - "Sorting timestamps that are stored as text"
  - "Letting a row with a missing timestamp win because missing values sort last"
