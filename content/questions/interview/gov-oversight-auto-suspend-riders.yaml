id: gov-oversight-auto-suspend-riders
question: "A delivery platform wants a model to automatically suspend rider accounts that it flags for fraud. How would you design human oversight for this?"
kind: use-case
short_answer: "Suspension affects income, so treat it as high risk. Let the model flag and a trained person decide, except perhaps a short temporary hold in extreme cases with fast review. Give reviewers evidence, time and authority to disagree. Tell riders the reason, offer an appeal to another person, and track overturn rates."
deeper_answer: "Human oversight means a person can understand, question and reverse the system, not that a person exists somewhere in the process. If reviewers handle 300 flags a day with a target of one minute each, they will agree with the model. So design the conditions: the evidence behind each flag, a realistic caseload, training on known false alarms, and no penalty for overturning.\n\nThe rider's side matters as much. A rider who is suspended needs a reason in a language they read, and a route to appeal that reaches a different person within a fixed time. Measure whether oversight works: overturn rate on review and on appeal, false flags by city and by rider tenure, and time to restore wrongly suspended accounts. Interviewers listen for decisions matched to harm, real authority for the reviewer, an appeal path, and accountability that sits with a named manager."
follow_ups:
  - "Is there any case where fully automatic suspension is acceptable?"
  - "How would you know reviewers are not simply agreeing with the model?"
  - "Who is accountable if a rider is wrongly suspended for two weeks?"
common_mistakes:
  - "Counting any human click as oversight"
  - "No reason or appeal for the affected person"
  - "Measuring reviewer speed but not decision quality"
level: P2
topic: governance
