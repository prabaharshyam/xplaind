answer_seconds: 130
example: "A suspension stops a rider's income, so I treat this as high risk. My design: the model only flags, and a trained reviewer decides. For extreme cases, like clear GPS spoofing, I would allow a temporary hold, with human review within four hours. Each reviewer sees the evidence behind the flag, has a caseload that gives enough time, and has the authority to overturn it without penalty. The rider gets the reason in their language, in the app, and can appeal to a different person within 48 hours. To check that oversight is real, I measure the overturn rate, false flags by city, and time to restore accounts. One named operations head is the accountable owner."
