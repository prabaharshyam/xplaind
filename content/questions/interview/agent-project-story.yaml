id: agent-project-story
question: "Tell me about an agent you built. What broke, and what did you learn?"
kind: real-life
short_answer: "Use a real example: what the agent did and for whom, its tools, the failure you hit, how you found it in the logs, the fix, and a number that shows the result. End with the lesson, such as 'limits and logs before features'. Interviewers want evidence that you have debugged agents, not only demoed them."
deeper_answer: "Structure the story as situation, task, action, result. Keep the agent's job specific: 'it triaged supplier emails and created tickets' is better than 'an AI agent'. Name the failure honestly: loops, wrong tool arguments, hallucinated IDs, a prompt-injection test that succeeded.\n\nShow your method: you read the trace, reproduced the failure, fixed it in the design (a schema, a limit, an approval step) and added a test. Close with what you would do differently now. If you have only built it for practice, say so; a well-told personal project beats an exaggerated work story."
follow_ups:
  - "How did you evaluate it?"
  - "What would you change if you built it again?"
common_mistakes:
  - "Describing only the happy path"
  - "Claiming numbers you cannot explain"
level: I3
topic: behavioral
stop_id: agent-logs
rubric:
  - point: "Describes a specific agent, its job and tools"
    keywords: ["tool", "agent", "built", "task"]
  - point: "Names a real failure honestly"
    keywords: ["broke", "failed", "bug", "loop", "wrong"]
  - point: "Explains how it was debugged with logs or traces"
    keywords: ["log", "trace", "reproduce", "debug"]
  - point: "Gives the fix and a result"
    keywords: ["fix", "result", "improved", "reduced"]
  - point: "States a lesson learned"
    keywords: ["learned", "lesson", "next time", "differently"]
answer_seconds: 120
example: "I built an agent that read supplier emails for a friend's distribution business and created entries in their order sheet. It worked in demos, but in the first week it created duplicate orders whenever a supplier replied to the same thread. The logs showed it treated each reply as a new order. I gave it a tool to look up existing orders by thread, made create_order refuse duplicates, and added those threads to my test set. Duplicates went to zero, and I learned to test on messy real threads, not clean samples."
drafted_with_ai: true
reviewed_by: "Shyam Prabahar"
