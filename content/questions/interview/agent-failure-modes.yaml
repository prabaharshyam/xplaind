id: agent-failure-modes
question: "What are common failure modes of agents, and how do you guard against them?"
short_answer: "Agents loop on the same action, pick the wrong tool or wrong arguments, stop too early or never stop, run up cost, and take risky actions they should not. Guards: a step and spend limit, detecting repeated calls, strict tool schemas, least-privilege permissions, human approval for irreversible actions, and full logging."
deeper_answer: "Most failures compound: one wrong tool result leads to a confident wrong plan. Logging every step lets you find where it went off course. Evaluating agents means checking not just the final answer but the path: did it use the right tools, how many steps, how much it cost.\n\nSecurity belongs here too. An agent that reads untrusted content and can act, such as sending email or changing records, is exposed to prompt injection. OWASP calls the related risk excessive agency: limit what tools can do, and keep a person in the loop for actions with real consequences."
follow_ups:
  - "How would you evaluate an agent, beyond its final answer?"
  - "Which actions would you never let an agent take without approval?"
common_mistakes:
  - "Relying only on the system prompt to keep the agent safe"
  - "Measuring only final answers and ignoring cost and path"
