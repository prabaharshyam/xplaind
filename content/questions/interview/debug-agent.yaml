id: debug-agent
question: "An agent completes a task correctly most of the time but sometimes goes badly wrong. How do you debug it?"
short_answer: "Collect traces of the failing runs: every model call, tool call, argument, result and token count. Compare them with good runs to find the step where they diverge, usually a bad tool result, a misread instruction or missing context. Fix that step, then rerun a set of tasks to check the fix and catch regressions."
deeper_answer: "Without traces you are guessing. Use structured logs or a tracing tool so each run is a tree of steps you can inspect. Group failures by cause: tool errors, wrong tool choice, poor planning, context overflow. Fixes differ: improve tool descriptions or error messages, add a validation step, shrink the context, or turn part of the agent into a fixed workflow.\n\nTurn every real failure into a test case, so the eval set grows with production experience. Track success rate, steps and cost per task over time."
follow_ups:
  - "What would you log for each step?"
  - "How do you turn production failures into tests?"
common_mistakes:
  - "Debugging by rerunning and hoping"
  - "Logging only the final answer"
level: I3
topic: agents
stop_id: agent-logs
rubric:
  - point: "Collects traces of failing runs"
    keywords: ["trace", "log"]
  - point: "Compares with good runs to find where they diverge"
    keywords: ["compare", "diverge", "good run", "successful"]
  - point: "Finds the step: bad tool result, instruction or missing context"
