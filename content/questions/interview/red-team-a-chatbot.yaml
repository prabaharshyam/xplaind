id: red-team-a-chatbot
question: "You are asked to red-team your company's customer support chatbot before launch. How do you go about it?"
kind: use-case
short_answer: "First get written scope and permission, and test a staging copy. Then list what could go wrong: data leaks, prompt injection, off-policy answers, tool misuse, cost abuse. Run manual tests plus automated attack suites with tools like promptfoo, garak or PyRIT, score results, report findings by severity, fix, and keep the attacks as regression tests."
deeper_answer: "Scope: which system, which environment, what is off-limits, who to call if something breaks. Build the attack list from the threat model and the OWASP LLM Top 10, plus business harms specific to the bot, such as promising refunds it cannot give or revealing another customer's order.\n\nMix methods: creative manual probing by people who know the domain and languages your users speak, and automated suites that generate many variations of jailbreaks and injections, including indirect injection through documents the bot retrieves. Use a clear pass or fail rule per test, often an LLM judge checked by humans. Report each finding with steps, impact, severity and a suggested fix. Retest after fixes and add every successful attack to the CI suite."
follow_ups:
  - "How do you decide the severity of a finding?"
  - "Why test in the languages your users speak, not only English?"
common_mistakes:
  - "Starting tests without written permission and scope"
  - "Running a tool once and calling the bot safe"
level: P2
topic: security
stop_id: ai-red-teaming
rubric:
  - point: "Written scope and permission, staging environment"
    keywords: ["scope", "permission", "authoris", "authoriz", "staging"]
  - point: "Threat model and attack categories"
    keywords: ["threat model", "data leak", "injection", "jailbreak", "harm", "tool"]
  - point: "Manual and automated testing with named tools"
    keywords: ["manual", "automated", "promptfoo", "garak", "pyrit"]
  - point: "Scoring and a findings report by severity"
    keywords: ["score", "judge", "report", "severity", "finding"]
  - point: "Fix, retest and add to regression suite"
    keywords: ["fix", "retest", "regression", "ci"]
answer_seconds: 120
example: "For a hypothetical Delhi airline's support bot, we agreed scope with the product owner and tested a staging copy. Manual testing in Hindi and Hinglish found that the bot would confirm a free date change if told 'the manager already approved'. promptfoo runs found two system prompt leaks. We fixed the refund policy check in code, retested, and the 40 successful attacks now run in CI on every prompt change."
