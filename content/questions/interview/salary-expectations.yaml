id: salary-expectations
question: "What are your salary expectations?"
kind: real-life
short_answer: "Research the market range for the role, city and your experience before the interview. Give a range, not a single number, with a lower end you would truly accept. Say what it is based on. Ask about the full package, including variable pay and joining bonus. Stay polite and open to discussion."
deeper_answer: "The interviewer wants to know if you fit the budget and if you understand your market value. A number far too high can end the process. A number too low costs you for years, because later raises build on it.\n\nPrepare three numbers: your ideal, a fair middle, and the lowest you would accept. Check salary sites, job posts and people in similar roles. In India, be clear whether you mean fixed pay or total CTC. If asked early, you may say: \"I would like to understand the role fully first. Based on my research for a GenAI engineer with two years in Bengaluru, I am looking at 14 to 17 lakh fixed.\" Give reasons from skills and market data, not personal expenses."
follow_ups:
  - "How did you arrive at that range?"
  - "Is that fixed pay or total CTC?"
  - "What if our budget is below your range?"
common_mistakes:
  - "Saying \"anything is fine\" or \"as per company norms\""
  - "Giving a number with no research behind it"
  - "Justifying the number with rent, loans or family needs"
level: I1
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Gives a clear range, not a vague answer"
    keywords: ["range", "lakh", "between", "per annum", "a year"]
  - point: "Bases the range on market research for the role, city and experience"
    keywords: ["research", "market", "similar roles", "salary data", "based on"]
  - point: "Makes clear whether the figure is fixed pay or total CTC"
    keywords: ["fixed", "ctc", "variable", "total"]
  - point: "Stays open to discussing the full package"
    keywords: ["open to", "discuss", "flexible", "package", "bonus"]
answer_seconds: 90
example: "Thank you for asking. I have looked at job posts and salary data for GenAI engineers with about two years of experience in Bengaluru, and I have spoken to two people in similar roles. Based on that, and on the work I do now, which includes building and evaluating a RAG system used by our support team, I am looking for 14 to 17 lakh rupees a year in fixed pay. I would also like to understand the variable part, the joining bonus if any, and health cover, because I am comparing the full package. I am open to discussion. The role and the team matter to me, and I am sure we can reach a fair number if the work is the right match."
