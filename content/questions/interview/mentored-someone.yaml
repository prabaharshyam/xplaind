id: mentored-someone
question: "Tell me about a time you helped someone else grow."
kind: real-life
short_answer: "Describe one person you helped grow, with their starting point and where they reached. Explain what you did: regular time, a real task slightly above their level, honest feedback, and then letting them own the work. Give the credit for the result to them."
deeper_answer: "The interviewer is checking whether you make the people around you better. For senior roles this matters as much as your own output. They also listen for whether you mentor by doing the work for people, or by helping them do it.\n\nSituation: who the person was and what they found hard. Task: why you took it up. Action: what you did week by week. A good line is: \"I stopped fixing her code and started asking her to explain her plan before she wrote it.\" Result: what they can do now that they could not do before. Freshers can use tutoring a classmate or guiding a junior in a college club. Keep the story about the other person. The growth is theirs."
follow_ups:
  - "What did you learn from mentoring that person?"
  - "What do you do when the person you mentor is not improving?"
  - "How do you find time for this with your own work?"
common_mistakes:
  - "Doing the person's work for them and calling it mentoring"
  - "Making the story only about yourself"
  - "Giving no sign of what the person can do now"
level: P2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Describes the person and their starting point"
    keywords: ["joined", "new graduate", "junior", "afraid", "had never", "struggled"]
  - point: "Gave regular time"
    keywords: ["every week", "weekly", "regular", "minutes"]
  - point: "Gave a real task and let them own it"
    keywords: ["real task", "owned", "herself", "himself", "present"]
  - point: "Guided with questions and feedback, and did not do the work for them"
    keywords: ["reviewed", "asked questions", "feedback", "did not give answers", "guided"]
  - point: "Gives what the person achieved"
    keywords: ["she owned", "he owned", "found", "promoted", "mentoring"]
answer_seconds: 120
example: "I was a senior data scientist at a health technology company in Bengaluru. A new graduate joined my team. She knew the theory well, but she had never worked with messy real data, and she was afraid to ask questions in meetings. I offered to mentor her. We met for 45 minutes every week. I gave her one real task that was slightly hard: build the evaluation script for our medical report summariser. For the first month I reviewed her plan before she wrote code, and I asked questions and did not give answers. Later I asked her to present her results to the team herself. In four months she owned our whole evaluation pipeline, and she found a labelling error that had hidden a 6 percent drop in quality. This year she is mentoring an intern herself."
