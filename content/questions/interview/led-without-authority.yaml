id: led-without-authority
question: "Tell me about a time you led something without being the manager."
kind: real-life
short_answer: "Choose a time you saw a problem nobody owned and got people to act, without the power to order them. Explain how you got support: you did the first piece of work yourself, showed the benefit to each person, and made it easy to join. End with what the group achieved."
deeper_answer: "The interviewer is checking leadership as a behaviour, not as a job title. Can you get people to follow you when they do not have to? This matters in AI work, where projects involve many teams.\n\nSituation: the problem and why nobody owned it. Task: what you decided to take up. Action: how you got others to join. Show that you listened and that you gave credit. A good line is: \"I could not tell the other teams what to do, so I built the first version myself and asked each team to add thirty questions.\" Result: what changed, with a number. Do not make it sound as if you gave orders."
follow_ups:
  - "What did you do when someone did not want to take part?"
  - "How did you keep people involved after the first few weeks?"
  - "How did you share the credit?"
common_mistakes:
  - "Describing a task you simply did alone"
  - "Sounding as if you gave orders to other people"
  - "Taking all the credit for the group's result"
level: I3
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Names a problem that nobody owned"
    keywords: ["nobody", "no owner", "each team", "problem", "own way"]
  - point: "Makes clear they had no formal authority"
    keywords: ["not a lead", "not the manager", "no authority", "not my job", "could not tell"]
  - point: "Did the first piece of work themselves"
    keywords: ["built", "started", "first", "myself"]
  - point: "Got others to join by listening and showing the benefit"
    keywords: ["asked", "met", "listened", "showed", "convinced"]
  - point: "Gives the result for the group"
    keywords: ["caught", "result", "adopted", "required", "all three teams"]
answer_seconds: 120
example: "I was an ML engineer with three years of experience. Three teams in my company used the same language model for different features, and each team tested it in its own way. When the model version changed, nobody knew what had broken. This was not my job and I was not a lead. I built a first shared test set of 60 questions from my own feature and showed it in our engineering meeting. Then I met one person from each team and asked what they feared most in a model change. I asked each team to add 30 questions, and I ran the tests every week and posted the results. In two months we had 150 questions. The set caught two failures before release, and it is now a required step for all three teams."
