id: pickle-model-files-risk
question: "A teammate wants to load a model file they downloaded from a public hub. What supply chain risks do you check?"
kind: scenario
short_answer: "Some model formats, especially Python pickle files such as many .pt, .pkl and .bin files, can run code when loaded, so a malicious file can take over the machine. I would prefer safetensors, which holds only weights, check the publisher and scans, pin the version, sandbox untrusted files, and record the model in our AI inventory."
deeper_answer: "Pickle rebuilds Python objects and can call functions while loading, so opening the file is enough to run an attacker's code. Hub platforms scan uploads, but scanning is not a guarantee. Safer options: safetensors for weights, and in PyTorch loading with weights_only=True where possible.\n\nThe wider AI supply chain also includes the training data, tokenizers, custom code that some models ask you to trust (for example trust_remote_code), Python packages, and the base model behind a fine-tune. Controls: an approved list of sources and publishers, pinned commit hashes, a private mirror for approved models, dependency scanning, model cards reviewed for licence and known limits, and an AI bill of materials so you know what you run when a new issue is announced."
follow_ups:
  - "Why is pinning a commit hash better than using the latest version?"
  - "What does trust_remote_code do, and when would you allow it?"
common_mistakes:
  - "Assuming model files are just data and safe to open"
  - "Pulling the latest version of a model in production without pinning"
level: P1
topic: security
stop_id: ai-supply-chain
rubric:
  - point: "Pickle can execute code on load"
    keywords: ["pickle", "execute", "run code", "on load", "deserializ"]
  - point: "Prefers safetensors or weights-only loading"
    keywords: ["safetensors", "weights_only", "weights only"]
  - point: "Checks publisher, scan results and pins versions"
    keywords: ["publisher", "scan", "pin", "hash", "version"]
  - point: "Sandboxes untrusted files"
    keywords: ["sandbox", "isolated", "container"]
  - point: "Wider supply chain: data, code, packages, AI-BOM"
    keywords: ["ai-bom", "bill of materials", "inventory", "package", "dependency", "remote code"]
answer_seconds: 90
example: "At a hypothetical Mysuru health-tech startup, an intern pulled a fine-tuned model as a .bin pickle file from an unknown account. We found a safetensors version from the original publisher instead, pinned its commit hash, mirrored it in our private registry and added it to our AI inventory. We then made a CI check that fails if code loads pickle files from outside the registry."
