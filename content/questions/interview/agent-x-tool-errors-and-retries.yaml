id: agent-x-tool-errors-and-retries
question: "Which tool errors should an agent retry, and where should the retry logic live: in the model or in the harness? Use a payment tool that times out as your example."
kind: concept
short_answer: "Retry only errors that are temporary, such as timeouts and rate limits, and only if the call is safe to repeat. The harness should do those retries in code, with backoff and a limit. Permanent errors go back to the model as a clear message. For a payment, use an idempotency key and check the status before any retry."
deeper_answer: "Errors fall into three groups. Temporary ones, such as a timeout or a 429, may succeed if tried again. Input errors, such as a wrong ID format, will fail every time until the arguments change, so the model must see the message and fix its call. Permanent ones, such as insufficient balance, need a different plan or a person.\n\nRetries for temporary errors belong in the harness. Code can apply backoff, count attempts and stay cheap. If the model does it, each attempt costs a full model call and may loop. A timeout is a special case, because you do not know whether the action happened. For a read, just repeat it. For a payment, repeating can charge the customer twice. So the tool takes an idempotency key that stays the same across attempts, and the harness checks the payment status before it tries again. Interviewers listen for the three groups, for idempotency, and for error text written so the model can act on it."
follow_ups:
  - "What should the model see after the harness has given up on retries?"
  - "How do you make a tool idempotent if the downstream API is not?"
  - "How would you detect an agent that repeats the same failing call?"
common_mistakes:
  - "Retrying every error, including ones caused by bad input"
  - "Letting the model retry a payment with no idempotency key"
  - "Hiding errors from the model, so it reports success"
level: I3
topic: agents
stop_id: tool-calling
rubric:
  - point: "Separates temporary errors from input errors and permanent errors"
    keywords: ["temporary", "transient", "permanent", "input error", "rate limit"]
  - point: "Puts retries for temporary errors in harness code, with backoff and a limit"
    keywords: ["harness", "backoff", "in code", "attempts"]
  - point: "Returns clear error messages to the model so it can fix its call or change plan"
    keywords: ["error message", "clear message", "back to the model", "fix"]
  - point: "Knows a timeout leaves the outcome unknown, so checks status first"
    keywords: ["unknown", "check the status", "status", "do not know"]
  - point: "Uses an idempotency key for calls with side effects"
    keywords: ["idempoten", "same key", "charged twice", "twice"]
answer_seconds: 120
example: "I sort errors into three groups. Temporary ones, like a timeout or a rate limit, are retried by the harness in code, with backoff and at most three attempts. Input errors go back to the model with a clear message, for example: amount must be in paise, you sent rupees. Then it can fix the call. Permanent ones, like a blocked card, also go back so the agent can tell the user. A payment timeout is the dangerous one, because the outcome is unknown. The UPI collect request may have gone through. So our payment tool takes an idempotency key built from the order ID, and the gateway ignores a second request with the same key. Before any retry, the harness will check the status of the first request. That is how we make sure nobody is charged twice."
