id: proudest-achievement
question: "What achievement are you most proud of?"
kind: real-life
short_answer: "Choose one achievement that shows skills this job needs. Tell it as a story: the situation, the hard part, what you personally did, and the result with a number. Say why it matters to you. A work or project example is best. Give credit to the team, but be clear about your part."
deeper_answer: "The interviewer learns two things from your choice: what you value, and what you count as hard. They also check ownership, so say \"I\" for your own actions and \"we\" for the team's.\n\nPick something recent and relevant, with a difficulty you had to overcome. Use situation, task, action, result, then one line on why you are proud of it. For example: \"I am proud of it not only because the cost fell by 60 percent, but because I found the cause by measuring first, when everyone wanted to buy bigger machines.\" Freshers can use a project, a competition or teaching others. Avoid exam ranks alone, unless you explain the effort behind them."
follow_ups:
  - "What was the hardest moment in that work?"
  - "What would you do differently now?"
  - "Who else contributed, and what did they do?"
common_mistakes:
  - "Choosing an achievement unrelated to the job"
  - "Saying \"we\" throughout and hiding your own part"
  - "Giving no result or number"
level: P1
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Describes the situation and why it was hard"
    keywords: ["problem", "challenge", "difficult", "cost", "wanted the feature closed"]
  - point: "States clearly what they personally did"
    keywords: ["i measured", "i built", "i led", "i found", "i designed", "i owned"]
  - point: "Gives a result with a number"
    keywords: ["percent", "per cent", "lakh", "fell to", "reduced", "saved"]
  - point: "Explains why it matters to them"
    keywords: ["proud", "matters", "because", "learned"]
  - point: "Gives credit to others where it is due"
    keywords: ["team", "colleague", "together", "helped"]
answer_seconds: 120
example: "I am most proud of cutting our model serving cost by more than half. I have been an ML engineer for six years, and last year I led a team of three at a fintech company in Bengaluru. Our document-reading model cost about 9 lakh rupees a month to run, and finance wanted the feature closed. First I measured where the time went. I found that 70 percent of requests were simple forms that did not need the large model. I designed a small model to handle those and send only hard cases to the large one. A colleague built the routing, and I owned the evaluation. Cost fell to about 3.5 lakh a month with the same accuracy. I am proud because we saved the feature by measuring first."
