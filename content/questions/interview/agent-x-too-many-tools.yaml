id: agent-x-too-many-tools
question: "Why does giving an agent more tools often make it worse, and how do you manage an agent that is connected to hundreds of tools?"
kind: concept
short_answer: "Every tool definition is sent to the model on each request. Hundreds of them fill the context, raise cost and latency, and make similar tools easy to confuse. I would give each task only the tools it needs: remove duplicates, group tools by job, load definitions on demand through tool search, and use sub-agents with small tool sets."
deeper_answer: "Tool definitions are part of the prompt. With 300 tools, the model may read tens of thousands of tokens before it sees the user's request. Accuracy drops because many names and descriptions look alike, for example three different search tools from three MCP servers. So the goal is a small, relevant set of tools in context at any moment.\n\nThere are a few ways to get there. Remove tools nobody uses, which traces will show. Give tools clear namespaces, such as jira_create_issue. Route the request first, then attach only that group of tools. Or keep one search tool that finds other tools by description and loads them when needed. A sub-agent for each domain keeps the main agent's context clean. Interviewers listen for the understanding that tools cost context, and for a plan to measure tool-choice accuracy before and after the change."
follow_ups:
  - "How would you find out which tools are never used?"
  - "What are the risks of loading tools on demand?"
  - "How does tool naming help when tools come from many servers?"
common_mistakes:
  - "Connecting every available MCP server by default"
  - "Thinking a larger context window solves the problem"
  - "Not measuring tool-choice accuracy after the change"
level: P1
topic: agents
stop_id: agent-tool-design
rubric:
  - point: "Explains that every tool definition uses context on every request"
    keywords: ["context", "token", "every request", "definition"]
  - point: "Says similar tools get confused, so tool-choice accuracy drops"
    keywords: ["confus", "similar", "overlap", "wrong tool", "accuracy"]
  - point: "Reduces the set: removes unused and duplicate tools, groups by task"
    keywords: ["remov", "duplicate", "unused", "group", "subset"]
  - point: "Loads tools on demand through routing or a tool search step"
    keywords: ["on demand", "tool search", "search", "rout", "load"]
  - point: "Uses sub-agents or namespaces to keep each tool set small and clear"
    keywords: ["sub-agent", "subagent", "namespace", "prefix"]
answer_seconds: 120
example: "Each tool definition is sent with every request, so tools are not without cost. They use context. On one internal assistant we had 12 MCP servers and about 300 tools. Roughly 40,000 tokens went on definitions before the user's question, and the agent kept choosing the wrong tool because several search tools looked similar. First I used traces to find unused tools and removed about half, along with duplicates. Then I added a namespace prefix, like jira_ and hr_, so names were clear. Finally I stopped loading everything. The agent got a small core set plus a tool search step that loads other tools on demand. For big domains such as HR, a sub-agent holds its own tools. Tool-choice accuracy on our test set went up, and cost per request went down."
