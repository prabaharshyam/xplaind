    keywords: ["tool", "context", "test", "verif", "stop rule", "progress"]
  - point: "Uses a fixed task set with the same model and settings"
    keywords: ["task set", "same tasks", "benchmark", "fixed set", "same settings"]
  - point: "Reads traces of failures and labels causes"
    keywords: ["trace", "log", "failure", "label", "cause"]
  - point: "Changes one part at a time and compares pass rate, cost and time"
    keywords: ["one at a time", "one change", "one part", "pass rate", "cost"]
answer_seconds: 120
example: "Suppose I compare two open-source coding agents on the same model with 20 small Python tasks. When I read the failed traces of the weaker one, most failures fall in one group: it says the task is done without running the tests. So I would add a test gate to that agent first, rerun the same 20 tasks three times each, and compare how many pass and what each run costs in rupees."
