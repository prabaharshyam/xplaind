id: same-model-worse-results
question: "Two coding agents use the same model, but one solves far more of your tasks. Why could that be, and how would you find out?"
kind: scenario
short_answer: "The difference is probably the harness, not the model. Check the tools and their descriptions, what context each agent sees, whether it runs tests before finishing, how it handles long tasks and when it stops. Run both on the same fixed task set, read the traces of failed tasks, and change one harness part at a time."
deeper_answer: "With the model fixed, everything else is harness. Common gaps in the weaker agent are: too many tools or vague tool descriptions, so it picks the wrong one; a context window filled with old tool output, so it loses the goal; no verification, so it stops at the first answer that looks right; no progress file, so it forgets earlier work on long tasks; and stop rules that end the run too early or let it loop.\n\nTo find out, do not guess. Build or reuse a fixed task set with automatic checks. Run both agents with the same model, settings and budget. For each failure, read the trace and label the cause: wrong tool, lost context, no check, gave up, ran out of budget. The most common label tells you which harness part to change first. Then change only that part, rerun the same tasks and compare pass rate, cost and time. Run each task more than once, because agent runs vary."
follow_ups:
  - "How would you label failures in the traces?"
  - "Why change only one harness part at a time?"
  - "What if the difference disappears when you rerun the tasks?"
common_mistakes:
  - "Assuming the model must be different or 'tuned'"
  - "Comparing on a few hand-picked demos"
  - "Changing several harness parts at once, so you cannot tell which one helped"
level: P2
topic: agents
stop_id: harness-engineering
rubric:
  - point: "Says the harness, not the model, likely explains the gap"
    keywords: ["not the model", "around the model", "same model", "the harness differ", "harness differ"]
