id: training-vs-inference
question: "What is the difference between training and inference?"
short_answer: "Training is when a model learns: its internal weights are adjusted using data, which is slow and expensive. Inference is when a trained model is used to make predictions or generate text, with the weights fixed. Most GenAI engineers work at inference time, calling a trained model through an API."
deeper_answer: "Training a large language model needs huge datasets, many accelerators and weeks of time, so few companies do it from scratch. Fine-tuning is a smaller round of training on top of an existing model. Inference is each request a user makes; its cost is per call and depends on input and output size.\n\nThis split explains common interview points: the model does not learn from your chats during inference unless the provider later trains on data, its knowledge stops at the training cut-off, and the cheapest way to change behaviour is usually prompting or retrieval at inference time rather than training."
follow_ups:
  - "Does a model learn from the prompts you send it?"
  - "Where does fine-tuning sit between the two?"
common_mistakes:
  - "Saying the model updates itself after every conversation"
  - "Confusing fine-tuning with prompting"
