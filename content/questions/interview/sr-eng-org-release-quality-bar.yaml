id: sr-eng-org-release-quality-bar
question: "Nine product teams in your company ship LLM features, each with its own idea of 'good enough', and two releases this year embarrassed the company in public. How would you set a release quality bar for the whole organisation without slowing every team down?"
kind: use-case
short_answer: "I would set a small shared minimum and let teams own the rest. Every feature needs a versioned eval set, a regression run in CI, and safety checks that block release. Thresholds scale with risk tier, so an internal summariser is not held to a payments assistant's bar. I would provide the tooling centrally, and review exceptions openly."
deeper_answer: "A single number for everyone fails: 90% is too low for refund answers and pointless for brainstorming. What can be common is the process: no release without an eval set that the team itself maintains, automatic regression runs on every prompt or model change, and a few blocking checks such as no personal data in outputs. Risk tiers decide the thresholds and who signs off.\n\nAdoption is the hard part. If the bar arrives as a rule plus paperwork, teams will find ways to avoid it. If it arrives as a shared harness that takes a day to adopt, with a template and one engineer helping each team, it becomes the easy path. For example, start with the three highest-risk features, publish their results, then extend. Interviewers listen for tiering, team ownership, shared tooling, an exception process, and a way to measure whether incidents fall."
follow_ups:
  - "A team says its feature cannot be evaluated automatically. How do you respond?"
  - "Who is allowed to approve an exception, and how is it recorded?"
  - "How would you know after six months that the bar is working?"
common_mistakes:
  - "One accuracy threshold for every feature"
  - "A central team that writes every team's eval set"
  - "Rules with no tooling, so teams work around them"
level: P3
topic: system-design
stop_id: regression-tests
rubric:
  - point: "Shared minimum process, with teams owning their own eval sets"
    keywords: ["eval set", "owns", "minimum"]
  - point: "Regression runs in CI block a release on failure"
    keywords: ["regression", "block", "gate", "regress"]
  - point: "Thresholds depend on risk tier, not one number for all"
    keywords: ["risk tier", "tiers", "threshold"]
  - point: "Central tooling makes the bar the easy path"
    keywords: ["harness", "template", "tooling"]
  - point: "Exception process and a measure of success"
    keywords: ["exception", "incidents", "measure", "sign"]
answer_seconds: 180
example: "I would not give nine teams one accuracy number. I would set a minimum that everyone meets: each feature has an eval set that the team owns, a regression run in CI on every prompt or model change, and a few safety checks that block the release if they fail. Then I would sort features into three risk tiers. A payments assistant needs a high threshold and a second reviewer, an internal summariser needs much less. To avoid slowing teams, my group would build the shared harness and a template, and sit with each team for a day to set it up. Exceptions are allowed, but written down and signed by a director. I would measure success by public incidents and rollbacks per quarter."
