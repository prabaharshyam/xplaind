answer_seconds: 120
example: "Suppose my coding agent fixes a bug in a Django app. Before the harness accepts 'done', it runs ruff, mypy and the tests itself. If a test fails, the harness sends back only the test name and the error lines. The agent gets three tries. The test folder is read-only for the agent, so it cannot pass by deleting a test. After the third failure, the harness stops and opens a note for me to review."
