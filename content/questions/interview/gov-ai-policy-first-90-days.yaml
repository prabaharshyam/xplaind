answer_seconds: 130
example: "In the first 30 days I would find out what is really in use: a short survey, purchase records, and talks with each delivery head. That gives me an inventory of tools, teams and the data going in. In week three I would send one-page interim rules: no client code or personal data in tools that are not approved. From day 30 to 60 I would draft the policy with legal, security, HR and delivery, and check client contracts. It would list approved tools, data rules, and a simple approval form for new uses with a one-week reply. From day 60 to 90 I would train every team with real examples, name an owner, and set a review every six months."
