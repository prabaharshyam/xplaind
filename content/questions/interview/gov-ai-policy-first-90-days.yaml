id: gov-ai-policy-first-90-days
question: "You join a 400-person IT services company as its first AI governance hire, where staff already use many AI tools and there is no policy. How do you put one in place in the first 90 days?"
kind: use-case
short_answer: "First find out what is in use, through a survey, purchase records and team interviews, and build an inventory. Issue short interim rules within weeks. Then write the policy with legal, security, HR and delivery heads: approved tools, data rules, an approval route for new uses, training, an owner and a review date."
deeper_answer: "A policy written without knowing real usage gets ignored. The inventory is the base: which tools, which teams, what data goes in, and which clients' work is involved. In an IT services company, client contracts matter most, because many forbid putting client code or data into outside tools. Interim rules, one page, can go out in the first two or three weeks while the full policy is drafted.\n\nThe policy should make the safe path easy. Give people approved tools and a quick way to request a new one, or they will keep using personal accounts. Sort uses into allowed, allowed with conditions and not allowed. Train with real examples, name an owner, and set a review every six months. Interviewers listen for discovery before drafting, involvement of other functions, and a plan for adoption, not only a document."
follow_ups:
  - "How would you find tools that staff use without telling anyone?"
  - "What goes in the one-page interim rules?"
  - "How do you measure whether the policy is followed?"
common_mistakes:
  - "Banning all AI tools"
  - "Writing the policy alone, without legal, security or delivery teams"
  - "Publishing a document with no training or approval route"
level: I1
topic: governance
