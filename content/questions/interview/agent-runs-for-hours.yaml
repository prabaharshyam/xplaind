  - point: "Verifies each item before marking it done"
    keywords: ["test", "evaluator", "verif", "run the check", "runs the check", "checks pass"]
  - point: "Manages context with resets or compaction"
    keywords: ["reset", "compaction", "compact", "context", "fresh"]
  - point: "Checkpoints, budgets and stopping to ask a person"
    keywords: ["checkpoint", "resume", "crash", "budget", "human", "ask a person", "durable"]
answer_seconds: 150
example: "Suppose I am at a small Pune startup and want an agent to build an expense tracker over an afternoon. First an initializer writes a JSON list of 30 small features, all marked as not passing, and a progress file. Each session then reads the progress file and git log, builds one feature, runs the tests and commits. The run stops after a set time and rupee budget, or when the same feature fails its tests three times, and I look at it."
