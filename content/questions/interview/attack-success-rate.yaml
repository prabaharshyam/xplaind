id: attack-success-rate
question: "What is attack success rate in AI red teaming, and what are its limits as a metric?"
kind: concept
short_answer: "Attack success rate is the share of attack attempts that reached their goal: if 12 of 400 jailbreak prompts got a harmful answer, it is 3%. It is useful for tracking versions on the same suite, by category. But it depends on the attacks chosen and how success is judged, and a low rate does not prove safety."
deeper_answer: "Report it per category (prompt injection, data leakage, harmful content, tool misuse) and per severity, because one critical leak matters more than many mild failures. Keep the attack suite and the judge fixed when comparing versions, or the numbers are not comparable. Check the judge itself: an LLM judge should be compared with human labels on a sample.\n\nLimits: attackers adapt and are not limited to your suite; a model can overfit to known attacks; multi-turn and indirect attacks are often under-tested; and non-determinism means repeating each attack several times gives a fairer picture. Pair the rate with severity, coverage of the threat model and time-to-fix for findings."
follow_ups:
  - "Why should each attack be run more than once?"
  - "How would you check that your LLM judge is reliable?"
common_mistakes:
  - "Comparing rates from different attack suites or judges"
  - "Treating a low rate as proof that the system is secure"
level: P2
topic: security
stop_id: security-testing-ci
rubric:
  - point: "Defines it: successful attempts divided by total attempts"
    keywords: ["share", "divided", "percentage", "successful", "attempts"]
  - point: "Reports by category and severity"
    keywords: ["category", "severity", "per type"]
  - point: "Keeps suite and judge fixed to compare versions"
    keywords: ["same suite", "fixed", "compare", "version", "regression"]
  - point: "Validates the judge and repeats attacks"
    keywords: ["judge", "human label", "repeat", "non-determin", "several times"]
  - point: "Limits: suite choice, adaptive attackers, low rate is not safe"
    keywords: ["adapt", "not safe", "coverage", "limit", "overfit"]
answer_seconds: 90
example: "On a hypothetical Bengaluru edtech tutor bot, our CI suite of 300 attacks ran each prompt three times. The success rate fell from 9% to 2% after a guardrail change, but the remaining 2% included one case where the bot revealed another student's marks, so we treated it as critical and blocked the release until a fix in the retrieval filter brought that category to zero."
