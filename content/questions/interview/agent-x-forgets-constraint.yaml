id: agent-x-forgets-constraint
question: "Forty minutes into a data-cleaning task, your agent starts breaking a rule the user gave at the start: never delete rows. What is happening, and what do you change?"
kind: scenario
short_answer: "The rule has probably left the working context. It was dropped, weakened in a summary, or buried under long tool outputs. I would pin constraints where they always survive, such as the system prompt or a task notes file, make compaction keep them, and trim tool outputs. For a hard rule, I would also enforce it in the tool itself."
deeper_answer: "In a long run the context fills with tool results. The harness then removes old turns or replaces them with a summary, and a summary written by a model can lose one early sentence. Even when the rule is still present, it competes with thousands of newer tokens. I would read the trace to confirm which of these happened: look at the exact context sent on the step that deleted rows.\n\nThe fixes are layered. Keep standing constraints separate from the conversation, in the system prompt or a notes file that is added back after every compaction. Write compaction instructions that keep constraints, decisions and open items. Cut tool output down to what is needed, so compaction happens less often. Most important, a prompt is not a control. If rows must never be deleted, the tool should not offer a delete, or it should reject one. Interviewers listen for a clear picture of what is in the context window, and for enforcement in code."
follow_ups:
  - "How would you confirm from the trace that the rule was lost?"
  - "What should a good compaction summary always keep?"
  - "How would you test for this failure before release?"
common_mistakes:
  - "Repeating the rule in capital letters and hoping it holds"
  - "Assuming a large context window means nothing is forgotten"
  - "Relying on the prompt alone for a rule that must never break"
level: P1
topic: agents
stop_id: context-engineering
rubric:
  - point: "Explains the rule was dropped, summarised away or buried as the context filled"
    keywords: ["summar", "dropped", "compaction", "buried", "context filled", "lost"]
  - point: "Confirms by reading the exact context sent on the failing step"
    keywords: ["trace", "exact context", "what was sent", "failing step"]
  - point: "Pins constraints in the system prompt or a notes file that survives compaction"
    keywords: ["pin", "system prompt", "notes file", "re-read", "added back"]
  - point: "Reduces context pressure by trimming tool outputs"
    keywords: ["trim", "tool output", "shorter", "first 20 rows", "sample"]
  - point: "Enforces the hard rule in the tool or permissions, not only in the prompt"
    keywords: ["enforce", "in the tool", "permission", "reject", "no delete"]
answer_seconds: 120
example: "I think the rule was lost when the context filled. After forty minutes of tool results, the harness ran compaction, and the summary did not mention never delete rows. I would confirm that in the trace by reading the exact context on the failing step. Then I would change three things. I would pin the user's constraints in a notes file that is added back after every compaction, and tell the summariser to always keep constraints and decisions. I would trim tool output, so a query returns the first 20 rows and a count, not 5,000 rows. And I would enforce the rule in the tool. The cleaning tool would reject any delete and only allow a row to be flagged. A prompt can be forgotten, but a tool that cannot delete will not delete."
