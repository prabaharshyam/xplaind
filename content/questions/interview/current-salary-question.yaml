id: current-salary-question
question: "What is your current salary (CTC)?"
kind: real-life
short_answer: "Tell the truth. State your CTC and split it into fixed and variable pay, because companies verify it with payslips. Then move the talk to the value of the new role and your expected range. If you prefer not to share, say so politely, but never give a false figure."
deeper_answer: "In India this question is very common, and many companies ask for payslips or Form 16 before the offer. A false figure can cancel an offer. So the only safe answer is the true one.\n\nThe risk is that the new offer gets tied to your old pay and not to the new job. Handle that with structure: the true figure with its parts, then one line on why the new role is different, then your expectation. For example: \"My current CTC is 6.5 lakh, with 5.8 fixed and 0.7 variable. This role is a move from support into AI engineering, so I am looking at the market range for that work, which is 10 to 12 lakh.\" Mention a pending raise only if it is confirmed."
follow_ups:
  - "Can you share your last three payslips?"
  - "Why are you expecting such a large increase?"
  - "Is a raise or bonus due soon in your current job?"
common_mistakes:
  - "Raising the figure and hoping nobody checks"
  - "Mixing up fixed pay, variable pay and CTC"
  - "Letting the old salary set the new one without making your case"
level: I1
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "States the true current CTC clearly"
    keywords: ["current ctc", "lakh", "my salary", "currently"]
  - point: "Splits it into fixed and variable parts"
    keywords: ["fixed", "variable", "bonus", "in hand"]
  - point: "Explains why the new role should be valued on its own terms"
    keywords: ["this role", "market", "different", "context", "full-time", "full time"]
  - point: "Gives an expected range"
    keywords: ["range", "expect", "hoping for", "looking for", "looking at"]
answer_seconds: 60
example: "My current CTC is 6.5 lakh rupees a year. Of that, 5.8 lakh is fixed and 0.7 lakh is variable pay, which I received in full last year. I can share payslips when you need them. I would like to add some context. I am a support engineer at a service company in Chennai, and that pay is for support work. For the last year I have also built and maintained an AI tool that sorts our incoming tickets, and this role is full-time AI engineering. So I have looked at the market range for a junior AI engineer with my skills, which is around 10 to 12 lakh. That is the range I am hoping for, and I am open to discussing how the package is structured."
