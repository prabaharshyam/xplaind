id: sr-eng-migrate-services-to-gateway
question: "Forty services in your company call LLM providers directly with their own keys, retries and logging, and you want all of them behind one internal gateway within two quarters. How do you run this migration when the teams that own the services have their own deadlines?"
kind: use-case
short_answer: "Make migrating cheaper than not migrating. I would ship a drop-in client so a service moves with a small change, migrate the first three myself to prove it, and sequence the rest by risk and spend. I would publish a tracker, set a date after which direct keys are revoked, and keep a rollback path for every service."
deeper_answer: "Migrations usually fail on the last few services, not on the technology. The first 30 services move in weeks and the last 10 stay for a year, so two systems must be run. The plan must therefore reduce the effort per team and create a firm end date. A compatible client library, automated pull requests, and gateway features that teams actually want, such as per-team cost reports and provider fallback, give them a reason to move.\n\nRisk control is the other half. The gateway becomes a shared point of failure, so it needs load testing, a canary per service, and a quick way back. For example, move low-traffic internal tools first, then the two services that make up 60% of spend, with their owners on the call. Interviewers listen for incentives, sequencing, leadership backing for the cut-off date, and honesty about the new single point of failure."
follow_ups:
  - "Five services are still not migrated one week before the cut-off date. What do you do?"
  - "How do you stop the gateway from becoming a bottleneck for new provider features?"
  - "What would you measure to show the migration was worth it?"
common_mistakes:
  - "Announcing a deadline without lowering the effort for teams"
  - "Moving the highest-traffic service first"
  - "Ignoring that the gateway is a new single point of failure"
level: P2
