example: "I have learned that teams move when moving is easy and staying is not. So first I would build a drop-in client: a service changes one import and a base URL. I would migrate three low-traffic services myself and publish the results. Then I would sequence the other 37 by spend and risk, and open automated pull requests for each team. The benefit for them is a cost report per team and a provider fallback they do not have to build. I would keep a public tracker and agree a date with leadership after which direct keys are revoked. Because the gateway is now a single point of failure, each service moves with a canary at 5% of traffic and a flag to roll back in one minute."
