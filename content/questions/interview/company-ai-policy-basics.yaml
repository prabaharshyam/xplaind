id: company-ai-policy-basics
question: "What should a company's AI usage policy cover?"
short_answer: "Which tools are approved and for what, what data may and may not be entered, who checks AI output before it is used, how to label or disclose AI-generated content, who owns the result, and how to report problems. It should be short, practical and reviewed regularly as tools change."
deeper_answer: "Good policies enable use rather than ban it, because bans push people to unapproved tools. Many frameworks, such as the NIST AI Risk Management Framework, suggest assigning clear owners and keeping an inventory of where AI is used.\n\nAdd training so people know the policy exists, and a fast way to request a new tool."
follow_ups:
  - "Why can a total ban on AI tools backfire?"
  - "Who should own the policy?"
common_mistakes:
  - "A policy that only bans"
  - "Forgetting training and review"
