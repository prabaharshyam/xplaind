id: what-to-automate-first
question: "How do you decide which process to automate first?"
kind: use-case
short_answer: "Map the candidate processes and score them: how often they run, how much time each run takes, how many errors they cause, how rule-based and stable the steps are, and how risky a mistake would be. Start with a frequent, repetitive, low-risk process with clear inputs and outputs, so you can show a quick, measurable win."
deeper_answer: "A simple scoring table works: volume times minutes per run gives the time at stake; add error cost; subtract for exceptions, unstable inputs or approvals that need judgement. Talk to the people who do the work, because the written process and the real one often differ.\n\nA first win builds trust. Invoice data entry or lead routing beats a messy, exception-heavy process even if the messy one looks bigger on paper."
follow_ups:
  - "How would you measure the time a process takes today?"
  - "What makes a process a bad candidate?"
common_mistakes:
  - "Automating a broken process without fixing it first"
  - "Choosing the biggest process instead of the clearest one"
level: B2
topic: automation
stop_id: mapping-a-process
rubric:
