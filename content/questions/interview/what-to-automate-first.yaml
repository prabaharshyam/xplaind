    keywords: ["map", "current process", "steps", "as-is"]
  - point: "Scores frequency and time"
    keywords: ["frequen", "volume", "time", "how often"]
  - point: "Prefers rule-based, stable steps"
    keywords: ["rule", "repetit", "stable", "predictable"]
  - point: "Weighs risk and errors"
    keywords: ["risk", "error", "mistake"]
  - point: "Starts with a quick, measurable win"
    keywords: ["quick win", "measur", "small", "first win"]
answer_seconds: 90
example: "At a distributor, we scored five processes. Order entry from emailed purchase orders ran 80 times a day at about 6 minutes each, was rule-based, and a mistake was caught at dispatch. Credit approvals ran less often and were risky. We started with order entry, showed time saved within a month, and used that win to get support for the next process."
