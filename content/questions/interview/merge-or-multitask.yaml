id: merge-or-multitask
question: You have three LoRA adapters for three tasks on the same base model. Would you merge them, serve
  them separately, or train one multi-task model?
kind: scenario
short_answer: It depends on deployment and precision. If adapters can share one base cheaply, separate
  adapters keep each task at its best. If I need one model on limited hardware, I would try merging, first
  a weighted average, then TIES or DARE, testing each task. With enough data, one multi-task fine-tune
  is also an option.
deeper_answer: 'Merging avoids the forgetting of sequential training and needs no GPUs, but precise tasks
  such as extraction often suffer most. I would compare every option on each task''s own test set, plus
  general and safety checks.


  A mixed plan is common: merge the tasks that tolerate it and keep the most precise one as a separate
  adapter. Whatever I choose, I would version the inputs and settings so the merge can be rebuilt when
  an adapter changes.'
follow_ups:
- Which task would you expect to suffer most from merging?
- How would you serve many adapters efficiently?
common_mistakes:
- Merging without per-task tests
- Assuming one approach fits all tasks
level: P2
topic: approach-choice
