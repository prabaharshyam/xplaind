example: A bank had adapters for complaints, replies and KYC extraction on one base and needed an offline
  laptop model. A TIES merge of all three kept complaints and replies close to their separate scores but
  cut extraction from 96% to 88%. We merged complaints and replies and kept the KYC adapter separate,
  loaded only when a document was scanned.
