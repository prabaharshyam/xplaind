answer_seconds: 120
example: "An API key is a single secret. It is usually long-lived, and anyone who holds it can call the API as that account. OAuth is different: the account owner sees a consent screen and grants named scopes, and the tool gets a token that will expire and that the owner can revoke later. For this workflow I would ask what a leak could do, and keep that small. For the Google Sheet, I would create a service account and share only that one sheet with it as a viewer, so it is read-only. For Slack, I would create an app that can only post messages and add it to the one channel, say the daily sales channel. Both secrets go in the credential store of the tool. I never paste a key into a node field or a URL."
