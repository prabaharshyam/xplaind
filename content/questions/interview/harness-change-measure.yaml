id: harness-change-measure
question: "You changed your agent's harness. How do you prove the change made it better?"
kind: use-case
short_answer: "Keep the model, settings and budget fixed. Run a fixed task set with automatic checks before and after, several times each, because agent runs vary. Compare pass rate, cost and time per task, and read failed traces. Change one thing at a time, and keep the task set in CI so later changes cannot quietly break it."
deeper_answer: "A harness change is an experiment, so the only thing that should differ is the harness. Use the same model version, temperature, tools apart from the one you changed, and the same step and money limits.\n\nThe task set should be small enough to run often and real enough to matter, for example 20 tasks that each have a check a script can run, such as a test suite that must pass. Include easy, hard and long tasks. Do not tune the harness on the same tasks you report on, or keep a few tasks aside.\n\nRun each task several times, because the same agent can pass and fail the same task. Report the pass rate with the number of runs, the cost and time per task, and the number of steps. A change that raises the pass rate but doubles cost may not be worth it. Read some traces, too, because a higher score can hide a new failure. Finally, put the task set in CI so every later harness change is checked against the baseline."
follow_ups:
  - "How many runs per task would you do, and why?"
  - "What would you do if pass rate went up but cost doubled?"
  - "How do you stop yourself from overfitting the harness to the task set?"
common_mistakes:
  - "Running each task once and trusting the result"
  - "Changing the model or prompt at the same time as the harness"
  - "Reporting pass rate without cost and time"
level: P2
topic: agents
stop_id: harness-engineering
rubric:
  - point: "Holds the model, settings and budget fixed"
    keywords: ["same model", "fixed", "same settings", "only the harness", "control"]
  - point: "Uses a fixed task set with automatic checks"
    keywords: ["task set", "automatic check", "test", "benchmark", "fixed set"]
  - point: "Runs tasks several times because runs vary"
    keywords: ["several times", "multiple runs", "repeat", "vary", "variance", "non-determin"]
  - point: "Compares pass rate, cost and time, and reads traces"
    keywords: ["pass rate", "cost", "trace", "per task"]
  - point: "Keeps the task set in CI as a regression check"
    keywords: ["ci", "continuous integration", "github actions", "pipeline", "regression", "baseline"]
answer_seconds: 120
example: "Suppose I added a progress file to my coding agent. I keep the model and limits the same and run my 20 tasks three times each, before and after. Then I make a small table: tasks passed out of 60 runs, average cost in rupees per task and average minutes per task. I read five failed traces from the new version to check for a new kind of failure. If the result holds, the task set goes into a GitHub Actions job."
