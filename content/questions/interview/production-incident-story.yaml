id: production-incident-story
question: "Tell me about a production incident you handled."
kind: real-life
short_answer: "Tell it in order: how you found out, how you assessed impact, what you did first to limit harm, how you found the root cause, the fix, how you communicated, and what you changed afterwards. Emphasise calm steps and the follow-up, such as a new alert, test or runbook entry. A blameless tone shows maturity."
deeper_answer: "Interviewers use this to judge how you behave under pressure. The best answers show that you contained the problem before chasing the cause, kept the right people informed, and turned the incident into a lasting improvement.\n\nFor AI systems, include anything model-specific: a quality drop after a model update, harmful output, a cost spike or a prompt-injection attempt. Give times and numbers where you can, and say honestly what you would do better. If you have only handled a small incident, a small one told well is fine."
follow_ups:
  - "What did the post-incident review change?"
  - "How did you communicate with users?"
common_mistakes:
  - "Blaming a colleague"
  - "Skipping the follow-up and prevention"
level: P1
topic: behavioral
stop_id: ai-incident-response
rubric:
  - point: "Explains how it was detected and its impact"
    keywords: ["alert", "detected", "noticed", "impact"]
  - point: "Contains the harm first"
    keywords: ["contain", "rollback", "disable", "first"]
  - point: "Finds the root cause"
    keywords: ["root cause", "cause", "investigat"]
  - point: "Communicates with stakeholders"
    keywords: ["communicat", "informed", "update", "users"]
  - point: "Describes lasting changes afterwards"
    keywords: ["post-incident", "review", "prevent", "runbook", "test"]
answer_seconds: 120
example: "One Friday our document assistant started answering some questions in the wrong language. A support lead flagged it at 4 p.m. Logs showed it began after that morning's prompt change. I rolled back to the previous prompt version within twenty minutes and posted an update in the support channel. The cause was an instruction we had moved below the retrieved text. On Monday we added twenty multilingual cases to the regression suite, and prompt changes now need that suite to pass before release."
drafted_with_ai: true
