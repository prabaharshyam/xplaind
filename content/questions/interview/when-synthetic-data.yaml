id: when-synthetic-data
question: When would you use synthetic data to train or test a model, and what are the risks?
kind: use-case
short_answer: 'When real labelled data is scarce, slow or private: to grow rare classes, cover edge cases,
  translate into low-resource languages, or label real inputs with a strong model. The risks are errors
  in generated data, unrealistic language, bias copied from the generator, and model collapse if it replaces
  real data. Always filter it and test on real data.'
deeper_answer: 'The best value often comes from keeping inputs real and letting a strong model produce
  the labels, because the data still looks like what users send. Paraphrasing real rare examples is another
  safe win.


  Verification is the heart of it: run generated code or SQL against tests, use an LLM judge with written
  rules, filter duplicates and length outliers, and read a random sample by hand. Keep real data in the
  training mix, never test on synthetic data, and record which model generated which data, because provider
  terms may forbid training competing models on their outputs.'
follow_ups:
- How would you check the quality of 20,000 model-generated labels?
- Why should the final test set be real data?
common_mistakes:
- Testing the model on synthetic data
- Skipping manual review of a sample
- Ignoring the generator's terms of use
level: P1
topic: approach-choice
