answer_seconds: 90
example: On a ticket classifier, three intents had under 30 real examples each. I had a large model paraphrase
  each real example five ways in English and Hinglish, filtered duplicates and had a support lead check
  a sample. Accuracy on the rarest intent went from about 50% to about 80% on real, held-out tickets.
