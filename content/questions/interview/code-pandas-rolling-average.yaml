example: "I would ask two things first: should I sum several transactions on the same day, and do days with no spend count as zero? I will assume one row per customer per day after summing, and that missing days are ignored. I make sure date is a datetime, sort by date and set it as the index. Then I group by customer and use a time-based window: groupby(\"customer_id\")[\"amount\"].rolling(\"7D\").mean(). The \"7D\" window means seven calendar days, where rolling(7) would mean seven rows, which is wrong when a customer has gaps. The sort is O(n log n) and the rolling pass is linear. For spends of 100, 200 and 300 on three days, I get 200 on the third day. I would test a customer with a gap of a week, where the window must start again."
