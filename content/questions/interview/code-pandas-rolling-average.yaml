id: code-pandas-rolling-average
question: "From a transactions table with customer_id, date and amount, compute a 7-day rolling average of daily spend for each customer. For example, a customer who spends 100, 200 and 300 on three days in a row has a rolling average of 200 on the third day."
kind: use-case
short_answer: "Sum to one row per customer and day, sort by date, set date as the index, then use a time-based window inside each group: groupby(\"customer_id\")[\"amount\"].rolling(\"7D\").mean(). \"7D\" means 7 calendar days, while rolling(7) means 7 rows. Sorting dominates at O(n log n)."
deeper_answer: "First clarify the definition. Ask whether several transactions on one day should be summed first, whether days with no spend count as zero or are ignored, and whether the window includes the current day. Check that date is a real datetime column, not text.\n\nThe steps are: convert with pd.to_datetime(df[\"date\"]). Sum per day with daily = df.groupby([\"customer_id\", \"date\"], as_index=False)[\"amount\"].sum(). Then run daily.sort_values(\"date\").set_index(\"date\").groupby(\"customer_id\")[\"amount\"].rolling(\"7D\").mean(). The \"7D\" window covers the current day and the six days before it, and it averages only the days that have rows. If missing days must count as zero, fill them first with resample(\"D\").sum() inside each customer and then use rolling(7, min_periods=1).\n\nThe result has a two-level index of customer and date, so call reset_index() before joining it back. Test a customer with a gap of a week, a customer with one row, and two transactions on the same day. Say why rolling(7) alone is wrong with gaps: it counts rows, so it can reach back many weeks."
follow_ups:
  - "How would you count days with no transactions as zero?"
  - "What is the difference between rolling(7) and rolling(\"7D\")?"
  - "How would you compute this in SQL?"
common_mistakes:
  - "Rolling over the whole table, so one customer's window includes another customer's rows"
  - "Using rolling(7) on rows when dates have gaps"
  - "Not sorting by date before rolling"
