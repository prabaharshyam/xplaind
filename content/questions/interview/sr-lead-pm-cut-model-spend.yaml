id: sr-lead-pm-cut-model-spend
question: "You lead product for five AI features that together cost ₹1.2 crore a year in model spend, and the CFO asks you to cut that by 30% within one quarter. How do you decide what to cut?"
kind: scenario
short_answer: "I would not cut every feature equally. I would work out cost and value per feature, first take savings that do not hurt users, such as cheaper models for easy requests, caching and usage limits, then reduce or close the weakest feature. I would protect quality with evals, and tell the CFO what each option costs in user value."
deeper_answer: "A flat 30% cut on every feature is simple but wrong, because features differ in value. Start with a table: yearly cost, active users, and the outcome each feature drives, such as retention or tickets avoided. Often one or two features carry most of the cost. Engineering savings come first: route simple requests to a smaller model, cache repeated answers, shorten prompts, and cap heavy use. Each change must pass the eval set, so the saving does not come from hidden quality loss.\n\nIf that is not enough, the hard choice is to reduce or close a feature. For example, an AI summary used by 3% of users that costs ₹30 lakh a year is a fair candidate. Interviewers listen for a decision made on value per rupee, a clear statement of what users lose, and a plan to review the result after the quarter."
follow_ups:
  - "The feature you want to close belongs to the CEO's favourite project. What do you do?"
  - "How do you check that a cheaper model has not reduced quality for one user group?"
  - "What would make you argue against the cut instead?"
common_mistakes:
  - "Cutting every feature by the same share"
  - "Counting savings without measuring the quality loss"
  - "Hiding the user impact from the CFO"
level: P3
topic: product
stop_id: cost-control
rubric:
  - point: "Builds a cost and value view per feature before deciding"
    keywords: ["per feature", "each feature", "each of the five", "value per"]
  - point: "Takes engineering savings first: cheaper model, caching, limits"
    keywords: ["smaller model", "cheaper model", "cach", "rout", "limit"]
  - point: "Protects quality with evals while cutting"
    keywords: ["eval", "test set", "quality check"]
  - point: "Makes a clear call to reduce or close the weakest feature"
    keywords: ["close", "retire", "switch off", "shut", "weakest"]
  - point: "Tells the CFO the trade-off and sets a review point"
    keywords: ["trade-off", "review", "cfo"]
answer_seconds: 180
example: "I would start with one table: for each of the five features, yearly cost, active users and the value it brings. In my last role, two features made up about 70% of the spend. First I would take savings users do not feel: route simple requests to a smaller model, add caching for repeated questions, and set a fair limit for very heavy users. Every change must pass our eval set, so quality does not fall quietly. That might give 20%. For the rest, I would close the weakest feature, for example a summary used by 3% of users that costs ₹30 lakh a year. I would tell the CFO the trade-off in plain words, and we would review retention after one quarter."
