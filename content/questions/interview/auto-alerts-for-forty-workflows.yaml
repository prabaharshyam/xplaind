answer_seconds: 150
example: "I would start with a register of the 40 workflows: owner, department, schedule and impact. Then one shared error workflow that every workflow calls on failure. It posts the workflow name, the owner, the error and a link to the run. Three or four workflows are critical, such as the payroll export and the GST data pull, so those alert the person on duty immediately by phone notification. The others go into a daily digest at 9:30 am. For scheduled jobs I add a heartbeat: each run writes a timestamp, and a checker alerts if an expected run did not start. Repeated errors are grouped into one alert with a count to reduce noise. Once a month we review the failure rate per workflow and remove alerts that nobody acted on."
