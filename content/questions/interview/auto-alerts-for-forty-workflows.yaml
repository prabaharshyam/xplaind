id: auto-alerts-for-forty-workflows
question: "Your team of three runs 40 workflows for different departments. How would you set up monitoring and alerts so that problems are seen without flooding the team?"
kind: use-case
short_answer: "One shared error workflow catches failures from all 40 and adds the workflow name, owner and a link to the run. I grade workflows by impact: critical ones alert at once to the person on duty, others go into a daily digest. I add heartbeat checks for scheduled jobs, group repeated errors, and review the alerts monthly."
deeper_answer: "With 40 workflows, the danger is not missing data, it is noise. If every failure posts to one channel, people mute the channel in a week. So every alert must say what broke, who is affected and what to do, and it must reach the right person at the right urgency.\n\nI keep a register: each workflow has an owner, a business impact level and an expected schedule. A failed payroll export is urgent; a failed weekly internal digest can wait until morning. Repeated failures of the same kind become one alert with a count. Heartbeats catch jobs that did not start, which error handlers cannot see. I also track a few numbers per workflow, such as runs, failure rate and duration, to see slow decay. In a monthly review we delete alerts nobody acted on and fix the top repeated cause. Interviewers listen for severity levels, ownership and noise control."
follow_ups:
  - "What information should every alert contain?"
  - "How do you detect a scheduled workflow that never started?"
  - "Who is told when a workflow that another department depends on fails?"
common_mistakes:
  - "Sending every error to one noisy channel"
  - "Alerts without an owner or a next action"
  - "Monitoring only failures, not jobs that never ran"
level: P1
