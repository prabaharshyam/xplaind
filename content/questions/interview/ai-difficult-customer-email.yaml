id: ai-difficult-customer-email
question: "How would you use AI to help write a difficult email to an upset customer?"
kind: use-case
short_answer: "I would describe the situation to the AI without personal details, ask for a calm, clear draft that apologises where we are at fault and states what we will do, then edit it myself. I check every promise and fact, make the tone sound like me, and never send it unread. The AI helps with wording; I own the message."
deeper_answer: "AI is good at finding a calm, polite tone when you are under pressure, and at structuring a reply: acknowledge, explain, fix, next step. It does not know your company's policies or what was actually promised, so it can invent refunds, dates or reasons.\n\nRemove names, account numbers and other personal data before pasting anything into a public tool. After drafting, read it as the customer would: is it honest, specific and kind? Then add the real details yourself."
follow_ups:
  - "What would you never let the AI decide in that email?"
  - "How do you keep it from sounding robotic?"
common_mistakes:
  - "Pasting the customer's personal details into a public chatbot"
  - "Sending a draft without checking its promises"
level: B1
topic: ai-literacy
stop_id: ai-for-writing
rubric:
  - point: "Removes personal details before using the tool"
    keywords: ["personal", "details", "name", "remove", "anonymise"]
  - point: "Asks for a structure: acknowledge, explain, fix, next step"
    keywords: ["apolog", "acknowledge", "structure", "next step"]
  - point: "Checks every fact and promise"
    keywords: ["check", "promise", "fact", "policy"]
  - point: "Edits the tone and owns the final message"
    keywords: ["edit", "tone", "my own", "review", "own"]
answer_seconds: 90
example: "A customer once wrote angrily because their order was delayed twice. I asked an AI assistant to draft a reply for 'a customer whose order was delayed twice because of a courier problem; we can offer free delivery on the next order', with no names. The draft was polite but promised delivery 'within 24 hours', which I could not guarantee, so I removed that, added the real tracking date, and made it sound like me. The customer replied thanking us for being straight with them."
