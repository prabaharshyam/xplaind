id: design-data-labelling-pipeline
question: "Design a data labelling pipeline that labels 100,000 support tickets a month into 40 intent classes, with a team of 30 annotators and a fixed budget."
kind: use-case
short_answer: "Clarify what the labels are for and the quality needed. Then: clear guidelines with examples, a pilot round to fix the classes, a tool with model pre-labels, gold questions and overlap to measure annotator agreement, expert review of disagreements, active learning to choose which tickets to label, and personal data masked before annotators see it."
deeper_answer: "Clarify first what model the labels will train and what accuracy it needs, because that sets the quality bar. With 40 classes, the label scheme itself is the main risk.\n\nProcess: write guidelines with examples and edge cases for each class. Run a pilot where several annotators label the same few hundred tickets, measure agreement, and merge or redefine confused classes. Mask personal data before tickets reach the tool.\n\nQuality control: mix in gold tickets with known answers to score each annotator. Give a share of tickets to two or three annotators and measure agreement with a statistic such as Cohen's kappa. Send disagreements to an expert, and use those cases to update the guidelines.\n\nCost: 30 annotators cannot triple-label everything. Use a model to pre-label, so annotators confirm or correct. Use active learning to send uncertain or rare-class tickets to people, and accept confident predictions after audit. Trade-offs: more overlap raises quality but cuts volume, and pre-labels speed work up but can bias annotators towards the model's answer. Evaluate by auditing a random sample against expert labels. At scale, guideline drift, new intents and annotator fatigue break first."
follow_ups:
  - "How do you measure label quality when there is no ground truth?"
  - "Two annotators often disagree on the same class pair. What do you do?"
  - "What is the risk of showing model pre-labels to annotators?"
common_mistakes:
  - "Starting at full volume without a pilot"
  - "A single label per item and no agreement measure"
  - "Guidelines that are never updated from disagreements"
level: P1
topic: system-design
