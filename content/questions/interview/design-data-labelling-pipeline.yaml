answer_seconds: 150
example: "For 100,000 tickets a month and 40 classes, I would first clarify what the labels train and the quality we need. I would begin with a pilot: five annotators label the same 500 tickets using a written guideline with one example per class. Where they disagree a lot, I merge or redefine those classes. Before any ticket reaches the tool, I mask personal data. In production, about 5 percent of tickets are gold questions with known answers, and 10 percent get an overlap of two annotators, so I can measure agreement for each person and class. An expert resolves each disagreement and those cases update the guideline. To fit the budget, a model gives a pre-label for the annotator to confirm, and active learning sends uncertain tickets to people first. Each month I audit a random sample. The trade-off is quality against volume: more overlap gives cleaner labels but fewer labelled tickets."
