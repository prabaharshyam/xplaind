id: auto-batch-one-bad-row
question: "Every night a workflow sends payment reminders for about 2,000 rows from a sheet. How would you design it so that one bad row does not stop the others?"
kind: use-case
short_answer: "I process rows one by one or in small batches and catch errors per row. A failed row is written to a failed-items list with the reason, and the loop continues. I mark each row as sent so a rerun skips it. At the end I send a summary: sent, skipped, failed. I alert if failures cross a limit."
deeper_answer: "By default many tools stop the whole run at the first error. With 2,000 rows, a wrong phone number in row 212 would then block 1,788 customers. So I separate two kinds of failure. A row problem, such as a missing number, should fail only that row. A system problem, such as the messaging service being down, should stop the run early, because every row will fail.\n\nI validate each row first, set the send step to continue on error, and record the result against the row: sent, with the time, or failed, with the reason. That status column also makes the run safe to restart. A limit such as 'stop if 50 rows fail one after another' protects against a system problem. Next morning the owner gets a summary and the failed list to correct. Interviewers listen for isolation per row, a record of failures and safe reruns."
follow_ups:
  - "How do you tell a bad row from a problem with the whole system?"
  - "The run stopped at row 900. How do you restart without sending reminders twice?"
  - "Who corrects the failed rows, and how do they know?"
common_mistakes:
  - "Letting the first error stop the whole run"
  - "Ignoring failed rows without a record"
  - "No status per row, so a rerun sends duplicates"
level: I1
