    keywords: ["summary", "alert"]
answer_seconds: 120
example: "I would read the 2,000 rows and loop over them one by one. First I validate each row: is there a 10-digit mobile number and an amount. Then I send the reminder with the send step set to continue on error. After each row I write a status back to the sheet: sent with the time, or failed with the reason, for example invalid number. So one bad row only fails itself. If the run is started again, it will skip every row already marked sent. I also add a limit: if 50 rows fail one after another, the messaging service is down, so I stop the run and send an alert. In the morning the accounts lead gets a summary, for example 1,950 sent and 50 failed, with a link to the failed list."
