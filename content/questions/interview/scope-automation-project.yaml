id: scope-automation-project
question: "A client says 'automate our sales process'. What do you do first?"
kind: scenario
short_answer: "Turn the vague goal into a clear scope. Ask what outcome they want and how they measure it, map the current process step by step with the people who do it, find the slowest or most error-prone steps, and agree one workflow to start with, written acceptance criteria, what is out of scope and who owns it after handover."
deeper_answer: "Good questions: Which systems hold the data? What volume? What happens with exceptions? Who approves changes? What does success look like in numbers?\n\nWrite it down in a one-page scope: the trigger, steps, outputs, error handling, success measure and timeline. Saying no to the rest for now protects both you and the client."
follow_ups:
  - "What goes into acceptance criteria?"
  - "How do you handle a request added halfway through?"
common_mistakes:
  - "Starting to build before agreeing scope"
  - "Automating every step at once"
level: I1
topic: client-delivery
stop_id: scoping-automation
rubric:
  - point: "Asks for the outcome and how it is measured"
    keywords: ["outcome", "goal", "measure", "success"]
  - point: "Maps the current process with the people doing it"
    keywords: ["map", "current process", "people", "steps"]
  - point: "Picks one workflow first"
    keywords: ["one workflow", "first", "prioriti", "start with"]
  - point: "Writes acceptance criteria and out-of-scope items"
    keywords: ["acceptance criteria", "out of scope", "written", "scope"]
  - point: "Names systems and the owner after handover"
    keywords: ["system", "owner", "handover", "maintain"]
answer_seconds: 90
example: "A furniture retailer said 'automate our sales process'. I asked what they wanted to change: they said leads were going cold. Mapping the process with two salespeople showed website and Instagram leads were copied by hand once a day. We scoped one workflow: capture leads from both sources into the CRM within five minutes and send a WhatsApp reply, with written acceptance criteria, quotations and follow-ups out of scope, and the sales manager as owner."
