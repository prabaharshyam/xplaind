id: boosting-vs-random-forest
question: "What is the difference between a random forest and gradient boosting?"
short_answer: "Both combine many decision trees. A random forest trains deep trees independently on random samples of rows and features and averages them, which mainly cuts variance. Gradient boosting trains shallow trees one after another, each fixing the errors of the ones before, which mainly cuts bias. Boosting is often more accurate on tables but needs more careful tuning."
deeper_answer: "Random forests are forgiving: sensible defaults work, they rarely overfit badly as you add trees, and training parallelises. Gradient boosting libraries such as XGBoost and LightGBM usually win on tabular data competitions, but you must tune the learning rate, number of trees, tree depth and regularisation, and use early stopping on a validation set because adding trees can overfit.\n\nBoth give feature importance scores, though these can mislead with correlated features; permutation importance or SHAP values are more reliable. For a first model on a table, a random forest is a strong baseline; gradient boosting is usually the one you ship after tuning."
follow_ups:
  - "Why does adding trees to a random forest not cause overfitting the way it can in boosting?"
  - "How does the learning rate interact with the number of trees?"
common_mistakes:
  - "Saying boosting trains trees in parallel"
  - "Forgetting early stopping when boosting"
