example: "On a credit-default dataset I compared both. The random forest, with 500 deep trees averaged, gave a solid result with almost no tuning. Gradient boosting with LightGBM, building shallow trees one after another to correct the previous errors, scored better but overfitted until I tuned the learning rate, tree depth and early stopping. I would start with a forest as a strong baseline and move to boosting when the extra accuracy matters."
