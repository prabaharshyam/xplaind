answer_seconds: 150
example: "First I would ask what the unit is: characters, words or tokens. I will assume a list of tokens, because the embedding model has a token limit. The idea is a sliding window. The step is the chunk size minus the overlap. I start at zero, take the slice from start to start plus size, then move forward by the step. I stop as soon as a window reaches the end, so the last chunk is not a duplicate of the tail. I validate the input first: the overlap must be smaller than the size, otherwise the step is zero and the loop never ends. The cost is linear in the text. I would test an empty text, a text shorter than one chunk, and a text where the last chunk is short. With tokens 1 to 10, size 4 and overlap 1, I expect three chunks. I would also keep the start position of each chunk as metadata."
