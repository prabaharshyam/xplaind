id: handled-unhappy-customer
question: "Tell me about a time you dealt with an unhappy customer or user."
kind: real-life
short_answer: "Describe a real unhappy customer or user. Say what went wrong for them, then what you did: you listened fully, apologised without excuses, found the cause, gave an honest timeline and kept them updated. End with the fix and whether they stayed. Do not blame the customer."
deeper_answer: "The interviewer is checking how you behave when someone is angry with you or your product. AI products make visible mistakes, so this happens often. They want calm, honesty and proof that you do what you promise.\n\nSituation: the customer and the problem. Task: your responsibility in it. Action: how you listened, what you said, and what you did. A good line is: \"I did not explain how language models work. I said, you are right, this answer was wrong, and here is what I will do by Friday.\" Result: the fix, and what the customer did next. Add what you changed so that other customers do not face the same thing. Do not promise in the story something you could not deliver."
follow_ups:
  - "What if the customer had been wrong?"
  - "What did you change so that other customers would not face this?"
  - "How do you stay calm when someone is shouting?"
common_mistakes:
  - "Blaming the customer for using the product wrongly"
  - "Explaining the technology when the customer wants an apology"
  - "Promising a date you cannot keep"
level: I3
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Describes what went wrong for the customer"
    keywords: ["wrong answer", "complained", "angry", "unhappy", "upset"]
  - point: "Listened first and apologised without excuses"
    keywords: ["listened", "let him finish", "let her finish", "apologised", "sorry", "did not argue"]
  - point: "Found the real cause"
    keywords: ["we found", "cause", "exact question", "investigated"]
  - point: "Gave a clear timeline and kept the promise"
    keywords: ["promised", "within the hour", "two days", "update", "timeline"]
  - point: "Gives the fix and what the customer did"
    keywords: ["we changed", "fixed", "renewed", "stayed", "retested"]
answer_seconds: 120
example: "I worked as a solutions engineer for an AI doubt-solving assistant used by coaching institutes. The owner of an institute in Kota called us, very angry. The assistant had given a wrong answer to a physics problem, a student had used it in a test, and a parent had complained. I called him back within the hour and let him finish before I spoke. I apologised and did not argue that such errors are rare. I asked for the exact question, and I promised an update in two days. We found that the model was doing the calculation itself. We changed it to use a calculator step, and to say \"please check with your teacher\" when it was unsure. I showed him 50 retested problems. He renewed his contract, and the same fix helped all our other institutes."
