example: "Imagine placing every sentence on a huge map so that sentences meaning similar things land near each other: 'How do I reset my password?' and 'I forgot my login details' end up close, even though they share few words. That map position is the embedding. To search, I embed all help articles once, embed the user's question, and return the nearest articles."
