id: explain-embeddings
question: "What are embeddings, and how are they used in search?"
short_answer: "An embedding is a vector of numbers that represents the meaning of a piece of text, so texts with similar meaning get vectors that are close together. In search you embed documents ahead of time and the query at search time, then return the documents whose vectors are nearest, often by cosine similarity."
deeper_answer: "Embedding models are trained so that related text lands close together, which lets search match \"forgot login\" to \"reset your password\" without shared words. The vectors are stored in a vector index that can find nearest neighbours quickly, even among millions of items, using approximate search.\n\nLimits matter in interviews: embeddings can miss exact strings such as product codes or names, and quality depends on the embedding model and the domain. That is why many systems combine vector search with keyword search, and why you must use the same embedding model for queries and documents."
follow_ups:
  - "Why must queries and documents use the same embedding model?"
  - "When would keyword search beat vector search?"
common_mistakes:
  - "Saying embeddings store the original text"
  - "Assuming any two embedding models' vectors can be compared"
