    keywords: ["signature", "verified", "secret"]
  - point: "Does not rely on the order of events"
    keywords: ["order of events", "current status", "out of order"]
answer_seconds: 120
example: "At least once means the provider will send an event again if it does not get my reply in time, so the same event can arrive twice. My workflow has to be idempotent. In a Razorpay integration I built, the first node verified the webhook signature with the shared secret. The second node inserted the event ID into a Postgres table with a unique constraint. If the insert failed, we had seen that event, and the workflow ended. Then we replied with a 200 quickly and did the slow work afterwards: marking the invoice paid and sending the receipt. I also did not trust the order of events. Before marking a refund, the workflow read the current status from the provider's API. In testing I sent the same event three times and the customer got one receipt."
