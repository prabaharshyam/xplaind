example: "In a support assistant for a router company, users typed error codes like 'E-1043'. Vector search returned articles about similar-sounding errors, while keyword search found the exact code but missed questions phrased in plain words. Combining both and then reranking the top 30 with a cross-encoder put the right article first far more often, for about 150 milliseconds of extra time."
