id: new-model-tops-leaderboard
question: A new model has just topped a public leaderboard. Your manager wants to switch. What do you
  do?
kind: scenario
short_answer: 'Treat it as a candidate, not a decision. Check hard requirements first: licence, data location,
  languages, price and speed. If it passes, run it on our own test set with the same prompt and rubric
  as the current model, and compare quality, cost and latency together. Switch only if it clearly wins
  on our task.'
deeper_answer: 'Leaderboards use a few chosen public benchmarks, mostly in English, and small differences
  in prompts and scoring can move results. Popular benchmarks may also be contaminated, meaning the questions
  were in the training data.


  Our own test set uses real inputs and our quality bar, so it answers the question that matters. If the
  new model wins, I would roll it out gradually, for example to 10% of traffic, and watch quality and
  cost before a full switch. Having a test set ready is what makes switching models a routine job.'
follow_ups:
- How big should your test set be for this comparison?
- How would you roll out the switch safely?
- What if the new model is better but twice the price?
common_mistakes:
- Switching on the headline score alone
- Comparing on a different prompt from the one in production
- Looking only at quality, not cost and latency
