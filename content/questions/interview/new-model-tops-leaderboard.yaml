example: This happened on a support assistant I worked on. A new model led a popular leaderboard, so I
  ran it on our 250 real questions in English and Hindi with our rubric. It was 1 point better in English,
  3 points worse in Hindi and 40% more expensive. We stayed with our model and re-ran the test when the
  next version came out.
