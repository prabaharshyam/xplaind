answer_seconds: 160
example: "For 10 teams on 16 GPUs, I would first clarify each use case and ask for a prompting baseline, because some teams do not need fine-tuning. A team uploads a dataset, and the platform gives it a version, removes duplicates, checks for personal data and keeps a held-out split. Training jobs enter a queue with a quota per team, and each job saves a checkpoint so it can pause. I would allow only LoRA on two or three approved base models. An adapter is small and trains in hours. Each adapter must pass an evaluation gate: the team's test set and a shared regression set, compared with the base model. Passing adapters go into a registry. For serving, I keep one copy of each base model in memory and load the adapter per request, so 10 teams share the same GPUs. I would give 10 GPUs to serving and 6 to training. The trade-off is choice against sharing: fewer base models, better use of the GPUs."
