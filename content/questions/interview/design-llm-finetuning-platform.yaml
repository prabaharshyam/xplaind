id: design-llm-finetuning-platform
question: "Design an internal platform where 10 product teams fine-tune and serve small language models, sharing a pool of 16 GPUs."
kind: use-case
short_answer: "Clarify the use cases, data sensitivity and whether fine-tuning is needed at all. Then: versioned datasets, a job queue with quotas per team, LoRA adapters on a few approved base models, an evaluation gate against the base model, a registry, serving that loads many adapters on one shared base model, and usage tracking per team."
deeper_answer: "Clarify first what teams want: classification, extraction, or a company writing style. Many requests are solved by prompting or retrieval, so the platform should make a baseline with the base model the first step.\n\nTraining path: a team registers a versioned dataset in a fixed format, with checks for duplicates, personal data and a held-out split. Jobs go into a queue with quotas and priorities per team, because 16 GPUs cannot serve everyone at once. Use parameter-efficient fine-tuning such as LoRA on a small set of approved base models. An adapter trains much faster than a full model, and it is megabytes in size, not gigabytes.\n\nEvaluation gate: every adapter is scored on the team's test set and on shared safety and regression sets, and compared with the base model. Only passing adapters reach the registry.\n\nServing: keep one copy of each base model in GPU memory and attach adapters per request.\n\nTrade-offs: fewer base models means better GPU sharing but less choice. At scale, GPU contention between training and serving, and base model upgrades that make every adapter invalid, break first."
follow_ups:
  - "Why LoRA adapters and not full fine-tuning for each team?"
  - "How do you share 16 GPUs fairly between training and serving?"
  - "What happens to every team's adapter when the base model is upgraded?"
common_mistakes:
  - "Fine-tuning before trying prompting or retrieval"
  - "One full model copy deployed per team"
  - "No evaluation against the base model before release"
level: P2
topic: system-design
