id: design-llm-eval-pipeline
question: "Three teams change prompts and models for a support assistant every week, and bad changes keep reaching users. Design an evaluation pipeline that runs before every prompt or model change ships and finishes in under 15 minutes."
kind: use-case
short_answer: "Build a versioned test set from real cases and past failures. On every change, CI runs the set and scores with code checks first, then an LLM judge calibrated against human labels. Compare with the current baseline, block on regressions in key slices, and show a diff. Keep a small fast set per change and a larger nightly set."
deeper_answer: "Clarify what a good answer means for this assistant and who decides. Then build the test set: a few hundred real questions with expected facts or behaviours, grouped into slices such as refunds, safety refusals and each language. Every production failure becomes a new case.\n\nPipeline: a change to a prompt, model or retrieval setting opens a pull request. CI runs the candidate on the set, with response caching and parallel calls to stay inside 15 minutes. Scoring is layered: exact and schema checks in code, then an LLM judge with a clear rubric for open-ended answers. Calibrate the judge against human labels and re-check it when the judge model changes. The report compares candidate and baseline per slice and shows changed answers side by side.\n\nTrade-offs: a larger set catches more but is slower and costs more, so run a fast set per change and the full set nightly. Model outputs vary, so use thresholds and repeated runs instead of exact equality. The first thing to break is trust: flaky results make teams ignore the gate. Offline evaluation also does not replace a gradual rollout with online metrics."
follow_ups:
  - "How do you know the LLM judge can be trusted?"
  - "What do you do when scores change between two runs of the same prompt?"
  - "Which regressions should block a release and which should only warn?"
common_mistakes:
  - "Testing on the same examples used to write the prompt"
  - "Trusting an LLM judge that was never checked against people"
  - "Reporting one average score and hiding a failing slice"
level: P1
topic: system-design
