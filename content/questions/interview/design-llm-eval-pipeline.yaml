answer_seconds: 150
example: "I would start with a test set of about 300 real support questions with the facts each answer must contain, split into slices such as refunds, refusals and Hindi. It lives in version control, and every production failure is added to it. Any prompt or model change opens a pull request, and CI runs the candidate on the set in parallel so it finishes in under 15 minutes. Scoring uses code checks first, for format and required facts, then an LLM judge with a written rubric that I have compared against human labels. The report shows the candidate against the baseline per slice, and a regression in a key slice blocks the merge. The trade-off is coverage against speed, so there is a fast set per change and a full set nightly. Because outputs vary, I use a threshold, not exact match, so the gate is not flaky."
