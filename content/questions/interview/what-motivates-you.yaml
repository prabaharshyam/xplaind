id: what-motivates-you
question: "What motivates you at work?"
kind: real-life
short_answer: "Name one or two real things that drive you, such as solving a hard problem, seeing people use your work, or learning. Prove each with a short example. Then link it to what this job offers. Money and stability are fair reasons, but they should not be your whole answer."
deeper_answer: "The interviewer is checking fit: will the daily work in this job give you energy, or will you lose interest in three months? There is no single correct answer, but there are answers that do not match the role.\n\nThink about the days when you worked late without being asked. What were you doing? That is your real answer. Use motivation, example, link. For example: \"I am motivated by seeing a real person use what I built. When our hostel warden started using my complaint tracker every morning, I wanted to improve it every week.\" Then connect it: this role has real users, hard problems or a lot to learn. Avoid general lines like \"I love challenges\" unless an example follows."
follow_ups:
  - "What kind of work makes you lose interest?"
  - "How do you stay motivated on boring tasks?"
  - "What did you enjoy most in your last project?"
common_mistakes:
  - "Saying only \"money\" or only \"passion for AI\""
  - "Giving a motivation with no example"
  - "Naming something this job cannot offer"
level: B2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Names one or two specific motivations"
    keywords: ["motivat", "drives me", "enjoy", "energy"]
  - point: "Supports it with a real example"
    keywords: ["for example", "when i", "project", "final year", "we built"]
  - point: "Gives what happened in that example"
    keywords: ["result", "fell", "improved", "used it", "saw that"]
  - point: "Links the motivation to this role"
    keywords: ["this role", "this job", "your team", "every day", "product manager"]
answer_seconds: 90
example: "What motivates me most is watching a real person use something I helped build, and then making it better for them. In the final year of my MBA in Mumbai, I led a small project for our college placement office. We built a tool that uses a language model to match student resumes to job posts. I sat with the two staff members who used it and saw that they ignored the match score and only read the short reason next to it. So we removed the score and improved the reasons. Their screening time fell from three days to one. I did not write the code, but finding that user problem gave me real energy. An associate AI product manager role is that work every day."
