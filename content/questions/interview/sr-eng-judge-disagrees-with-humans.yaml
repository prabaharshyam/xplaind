answer_seconds: 165
example: "I would treat the human audit as the reference, because the judge is only a model. A gap of 12 points means it passes answers that people reject. I would read the cases where they disagree, about 40 of the 300, and look for a pattern. Often the judge accepts fluent answers that miss a step or have no source. Then I would rewrite the judge rubric with clear pass and fail examples and ask it for a reason first. I would keep the 300 as a labelled set and track agreement, aiming above 90%, with a small audit every month. Finally, I would tell my manager that the 93% was overstated and take a corrected number to the board with the explanation, not change it silently."
