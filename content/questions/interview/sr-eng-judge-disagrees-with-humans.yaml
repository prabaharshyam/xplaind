id: sr-eng-judge-disagrees-with-humans
question: "Your LLM judge reports that 93% of the assistant's answers pass, and that number goes to the board each month, but a human audit of 300 answers finds only 81% acceptable. What do you do?"
kind: scenario
short_answer: "Trust the humans, and say so quickly. I would study the answers where judge and humans disagree, find what the judge misses, and fix its rubric or model. Then I would measure judge and human agreement on a labelled set, report it beside the score, and correct the number given to the board with an explanation."
deeper_answer: "A judge is a model that needs its own evaluation. A 12-point gap means it is too lenient on some failure type, often answers that sound fluent but are incomplete or unsupported. Reading the roughly 40 disagreement cases usually shows two or three patterns. Fix the rubric with clear pass and fail examples, ask for a reason before the verdict, and consider a different model from the one being judged.\n\nThen calibrate: keep a human-labelled set of a few hundred answers, track how many real failures the judge catches, and repeat a small human audit every month, because both the product and the judge drift. The harder part is the board number. A senior engineer does not quietly change the metric: they explain that the old figure was overstated, show the corrected trend, and state how confident they are. Interviewers listen for humility about automated metrics and for honest reporting."
follow_ups:
  - "How many human labels do you need before you trust the judge again?"
  - "Would you use the same model as judge and as assistant? Why or why not?"
  - "How do you explain to the board that the number went down but the product did not get worse?"
common_mistakes:
  - "Assuming the judge is right because it is automated"
  - "Fixing the judge quietly and letting the old number stand"
  - "Never re-checking the judge against people after the first setup"
