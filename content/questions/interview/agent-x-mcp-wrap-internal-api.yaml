answer_seconds: 150
example: "I would begin with what agents need to do, which is mostly find a ticket, read it and add a comment. So I would not expose all 60 endpoints. I would ship three tools: search_tickets, get_ticket and add_comment. Each returns a short result with paging, not the full raw JSON. Because many teams will use it, I would run it as a remote server and use authorization so each call carries the signed-in user's identity. The server then applies that user's own permissions, so an agent cannot read a ticket its user cannot read. The first release would be read-only. Write tools such as add_comment come in the second release, with an approval step in the client. I would validate inputs, keep an audit log of every call, and test with a real agent on a test project before launch."
