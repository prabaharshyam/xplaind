id: agent-x-mcp-wrap-internal-api
question: "Your company wants its agents to use the internal ticketing system through MCP. How would you design and ship that MCP server?"
kind: use-case
short_answer: "I would start from the tasks agents need, not from the API. Expose a few task-level tools with clear descriptions and small results, read-only first. Run it as a remote server with authorization, so every call uses the signed-in user's own permissions. Validate inputs, log every call, test with a real agent, and add write tools later behind approval."
deeper_answer: "The common mistake is to wrap every API endpoint as one tool. An agent does better with a few tools shaped around jobs, such as search_tickets, get_ticket and add_comment, that return short, readable results and support paging. MCP also has resources for data the client can read and prompts for reusable templates, but tools are what most agents use, so I would start there.\n\nFor a server shared across the company I would host it remotely over HTTP, not run it locally on each laptop, and use the protocol's authorization so the server knows which user is calling. The server must enforce the ticketing system's own access rules. It should not use one powerful service account. Then the normal service work applies: input validation, rate limits, audit logs, versioning of tool names, and an eval that runs real agent tasks against a test project. Interviewers listen for identity, least privilege and tool shape."
follow_ups:
  - "When would you use a local server instead of a remote one?"
  - "How do you stop one user's agent from reading another team's private tickets?"
  - "How would you change a tool without breaking existing agents?"
common_mistakes:
  - "Wrapping every API endpoint as a separate tool"
  - "Using one admin service account for all users"
  - "Returning huge raw JSON responses to the model"
