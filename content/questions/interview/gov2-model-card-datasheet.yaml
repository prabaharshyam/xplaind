answer_seconds: 120
example: "A model card is a one or two page document for a model. I expect the intended use, the uses that are out of scope, a summary of the training data, the test results split by group, the known limits, and the owner and version. A datasheet is the same idea for a dataset: why it was made, how the data was collected, what consent and licence apply, and what is missing. At a lender where I worked, the card for the default model said it was trained on salaried applicants in metro cities and should not be used for self-employed applicants. When another team wanted to reuse it for small traders, that line helped them decide it did not fit. We made it a rule to update the card at every retraining."
