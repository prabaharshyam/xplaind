id: gov2-model-card-datasheet
question: "What are a model card and a datasheet for a dataset, and what would you expect to find in each?"
kind: concept
short_answer: "A model card is a short document about one model: intended use, uses it is not meant for, training data summary, test results including by group, known limits and owner. A datasheet does the same for a dataset: why and how it was collected, what it contains, consent and licence, known gaps, and allowed uses. Both must be kept current."
deeper_answer: "Both ideas come from research papers: 'Model Cards for Model Reporting' and 'Datasheets for Datasets'. The purpose is practical. A person who did not build the model must be able to decide if it fits their use, and a reviewer must be able to see what was tested. Without this, the knowledge stays with two engineers.\n\nFor governance, the most useful parts are the ones teams like to skip: out-of-scope uses, performance split by relevant groups, and limits. Example: a card for a loan default model should say it was trained on salaried applicants from metro cities and was not tested on self-employed applicants. That one line stops a risky reuse. For a vendor model, I ask for the vendor's card or an equivalent document. I tie the card to a model version and require an update at every retraining. Interviewers listen for intended use, limits, results by group and upkeep."
follow_ups:
  - "Who should write the model card, and who should approve it?"
  - "What do you do when a vendor will not share this information?"
  - "How do you keep the documents from going out of date?"
common_mistakes:
  - "Treating the card as marketing with only good results"
  - "Leaving out uses the model is not meant for"
  - "Writing it once and never updating it"
level: I2
topic: governance
stop_id: ai-compliance
