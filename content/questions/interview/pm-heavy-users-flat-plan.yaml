  - point: "Checks the effect on churn and margin"
    keywords: ["churn", "margin"]
answer_seconds: 130
example: "I would start by finding out who they are. I would segment the top 5%: real power users, shared accounts and scripts. Abuse, such as one login used by a whole office, I would block under the terms. For real heavy use, I would first cut cost per request, for example a smaller model for long document summaries and caching for repeated questions. Then I would add a fair use limit that 95% of users never reach, with a ₹999 tier or top-up credits above it. I would announce it 30 days ahead, show each user their usage, and keep existing subscribers on old terms for three months. Finally I would measure churn and margin in that group."
