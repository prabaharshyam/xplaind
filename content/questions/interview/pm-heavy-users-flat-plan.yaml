id: pm-heavy-users-flat-plan
question: "On your ₹499 flat monthly plan, 5% of users create 60% of the model cost, and the plan loses money on them. What do you do?"
kind: scenario
short_answer: "First learn who they are: real power users, shared accounts or scripts. Block abuse. For real heavy use, add a fair use limit with a higher tier or top-up credits, and lower cost per request with a smaller model or caching. Give notice, and protect existing subscribers for a period."
deeper_answer: "Heavy users are not one group. Some are your best customers and would pay more. Some share one login across an office. Some run scripts. Each needs a different answer, so segment before changing price. Look at what they do: if they run long documents through an expensive model, a cheaper model for that task may solve half the problem with no price change.\n\nA flat plan with unlimited use of a metered cost will always attract this. The usual fix is a generous limit that most users never reach, and a clear paid path above it. How it is done matters: announce it early, show users their own usage, and keep the old terms for current subscribers for some months. Interviewers listen for diagnosis before action and for care with the customers who use the product most."
follow_ups:
  - "Where would you set the fair use limit?"
  - "How would you tell abuse from real heavy use?"
  - "What do you do if a competitor still offers an unlimited plan?"
common_mistakes:
  - "Raising the price for everyone"
  - "Silently slowing down heavy users"
  - "Treating all heavy users as abusers"
level: I3
topic: product
stop_id: pricing-ai-features
rubric:
  - point: "Segments heavy users: real use, sharing or scripts"
    keywords: ["segment", "who they are", "shared accounts", "script", "power user"]
  - point: "Reduces cost per request first where possible"
    keywords: ["smaller model", "cheaper model", "cach", "cost per request"]
  - point: "Adds a fair use limit with a paid path above it"
    keywords: ["fair use", "limit", "tier", "top-up"]
