id: design-model-registry-rollout
question: "Design a model registry and release process for a company with 40 models in production. Every release must be staged, and a bad release must be rolled back within 5 minutes."
kind: use-case
short_answer: "Clarify who can release, what must be recorded and how fast rollback must be. Then: a registry storing immutable model versions with lineage to data, code and metrics, stages with automated checks, shadow traffic, a canary on a small share of users with automatic rollback rules, the previous version kept warm, and an audit log of every change."
deeper_answer: "Clarify what the company needs: a single place that answers which model version is live, what it was trained on, who approved it, and how to go back.\n\nRegistry: each version is immutable and stores the model file, a hash, the training data version, the code commit, parameters, evaluation metrics and the input schema. A version moves through stages, such as candidate, staging and production, and each move needs automated checks and, for high-risk models, a human approval. All changes go to an audit log.\n\nRollout: first shadow traffic, where the new model receives real requests but its answers are not used. Then a canary on a small share of traffic, with metrics compared against the current model. Rules roll back automatically on errors, latency or a shift in the prediction distribution. Rollback within 5 minutes means the old version stays deployed and warm, and the switch is a routing change, not a new build.\n\nTrade-offs: slow ramps are safer but delay improvements. At scale, the first problems are a model and its feature pipeline going out of step, and schema changes that a model rollback does not undo."
follow_ups:
  - "What is the difference between shadow traffic and a canary release?"
  - "What would trigger an automatic rollback?"
  - "A rollback of the model is not enough if the features also changed. How do you handle that?"
common_mistakes:
  - "Overwriting a model version in place"
  - "Rolling back by rebuilding and redeploying"
  - "Versioning the model but not its data, code and features"
