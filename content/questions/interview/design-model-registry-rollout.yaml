answer_seconds: 150
example: "For 40 production models, I would first clarify who can approve a release and what we must record. The registry stores each model as an immutable version with its lineage: the data version, the code commit, the metrics and the input schema. A version moves from candidate to staging to production, and every stage has automated checks, such as a schema test and a comparison with the current model. Release starts with shadow traffic: the new model gets real requests, but its answers are not used. Next comes a canary on five percent of traffic, with automatic rules on errors, latency and the prediction distribution. Then we ramp up. To meet 5 minutes, rollback is only a routing change, because the previous version stays deployed and warm. Every promotion and rollback goes into an audit log. The trade-off is safety against speed: keeping two versions warm costs more, but it makes rollback almost instant."
