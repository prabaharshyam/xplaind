id: llm-bill-doubled
question: "Your LLM bill doubled this month, but traffic did not. How do you investigate?"
kind: scenario
short_answer: "Break the cost down by feature, model, and input versus output tokens, day by day, to find when and where it changed. Typical causes: a prompt or context that grew, retries or agent loops, a switch to a more expensive model, caching that stopped working, or one customer's heavy use. Fix the cause, then add per-feature budgets and alerts."
deeper_answer: "Cost is tokens times price, so a jump with flat traffic means more tokens per request or a higher price per token. Good usage logging, with the feature, model, tokens and cache hits on every call, turns this from guesswork into a quick query.\n\nLook at the date the change started and compare with deployments. A new retrieval setting that sends twenty chunks instead of five, a longer system prompt that broke prompt caching, or a retry bug can each multiply cost. Afterwards, set budgets per feature and alert on cost per request, not just the monthly total."
follow_ups:
  - "What would you log on every model call?"
  - "How would you catch this earlier next time?"
common_mistakes:
  - "Switching to a cheaper model before finding the cause"
  - "Only looking at the monthly total"
level: P2
topic: system-design
stop_id: cost-control
rubric:
  - point: "Breaks cost down by feature, model and token type"
    keywords: ["feature", "model", "input", "output", "break down"]
  - point: "Finds when it changed and links it to deployments"
    keywords: ["when", "date", "deploy", "change"]
  - point: "Names likely causes: longer prompts, retries, model switch, caching"
    keywords: ["prompt", "retry", "loop", "cache", "model"]
  - point: "Fixes the root cause"
    keywords: ["fix", "root cause"]
  - point: "Adds budgets and alerts per feature"
    keywords: ["budget", "alert", "per feature", "cost per request"]
answer_seconds: 90
example: "Our monthly bill jumped from about ₹1.6 lakh to ₹3.4 lakh while requests stayed flat. Our usage table logged feature, model and tokens per call, so I grouped by day and saw input tokens per request triple on the 9th. That day we had raised the retriever's top-k from 5 to 15 to fix a recall issue, and a new date line at the top of the system prompt had stopped prompt caching from matching. We moved the date to the end, reranked down to six chunks, and added an alert on cost per request."
