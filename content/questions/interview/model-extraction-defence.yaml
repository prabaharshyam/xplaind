  - point: "Mentions watermarking, terms, or related privacy attacks"
    keywords: ["watermark", "terms", "membership inference", "training data extraction"]
answer_seconds: 90
example: "A hypothetical Chennai insurtech sold a claim fraud score through an API that returned the full probability. Logs showed one trial account sending tens of thousands of varied, synthetic claims in a week. We moved to a risk band (low, medium, high) instead of a raw score, set per-account daily quotas, required business verification for higher limits, and added an alert for systematic query patterns."
