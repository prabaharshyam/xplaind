id: model-extraction-defence
question: "What is a model extraction attack, and how would you defend a model you serve through an API?"
kind: concept
short_answer: "Model extraction is when an attacker sends many queries to your API and uses the answers to train a copy of your model, stealing its value or helping plan other attacks. Defences: authentication, rate and quota limits, monitoring for unusual query patterns, returning only what users need instead of full probabilities, terms of use, and watermarking where possible."
deeper_answer: "Each answer is a labelled training example for the attacker. Detailed outputs such as full probability scores leak more than a single label. A stolen copy can also be used offline to find adversarial inputs that then work against your real model.\n\nDefences come in layers: require API keys tied to accounts; set quotas and rate limits; watch for many diverse or systematic queries from one account or a group of new accounts; reduce output detail; and price or gate bulk access. For LLMs, watermarking outputs and contract terms help with proof and deterrence. Related privacy attacks, membership inference and training data extraction, need limits on what the model memorises, such as deduplicating training data, and testing whether it repeats sensitive records."
follow_ups:
  - "Why do probability scores make extraction easier?"
  - "How is membership inference different from model extraction?"
common_mistakes:
  - "Assuming a model behind an API cannot be copied"
  - "Relying only on legal terms without rate limits or monitoring"
level: P1
topic: security
stop_id: model-privacy-attacks
rubric:
  - point: "Defines extraction: queries used to train a copy"
    keywords: ["query", "queries", "copy", "train", "steal", "clone"]
