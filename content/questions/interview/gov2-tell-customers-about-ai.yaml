id: gov2-tell-customers-about-ai
question: "An insurance company uses a chatbot for customer questions and a model to help decide claims. How would you set up what customers are told about the AI?"
kind: use-case
short_answer: "Customers should know when they are talking to a machine, in plain words at the start, with a way to reach a person. For claims, the notice says that automated tools help assess claims, what data is used, and how to ask for a human review. The privacy notice matches what really happens, and AI-generated content is labelled."
deeper_answer: "Transparency has layers, and each serves a different need. At the point of use, a short line: 'I am an automated assistant'. At a decision that affects the person, the main reasons and a route to a human. In the privacy notice, what personal data goes into which tools and for what purpose. The EU AI Act includes duties to tell people when they interact with an AI system, and India's DPDP Act requires clear notice about personal data and its purpose.\n\nThe test is whether a normal customer would be surprised. A claim rejected with no reason and no contact fails that test. I also check that our statements are accurate: we must not say 'a person reviews every claim' if that is false. I would test the wording with real customers and in the languages they use. Interviewers listen for layers, a route to a human and honest wording."
follow_ups:
  - "How much should you explain about how the claims model works?"
  - "What should the rejection message for a claim contain?"
  - "Where could too much disclosure cause a problem?"
common_mistakes:
  - "Hiding the disclosure in the terms and conditions"
  - "Saying a human reviews everything when that is not true"
  - "No route to a person"
level: I1
topic: governance
stop_id: ai-rules-india-abroad
rubric:
  - point: "Tells users at the start that they are talking to an AI"
    keywords: ["automated assistant", "at the start", "chatbot says"]
  - point: "Explains decisions that affect the person, with the main reason"
    keywords: ["main reason", "rejected", "decision letter"]
  - point: "Gives a route to a human review"
    keywords: ["human review", "reach a person"]
  - point: "Privacy notice says what data is used and why, and is accurate"
    keywords: ["privacy notice", "personal data", "purpose", "it is true"]
  - point: "Plain wording in the customer's language, tested with users"
    keywords: ["plain words", "hindi", "tested"]
answer_seconds: 120
example: "I would set it up in three layers. First, the chatbot says at the start: I am an automated assistant, and you can type agent at any time to reach a person. Second, for claims, the form and the decision letter say that automated tools help us assess claims. If a claim is rejected or reduced, the letter gives the main reason in plain words, for example the hospital bill date is outside the policy period, and explains how to ask for a human review. Third, the privacy notice lists what personal data goes into these tools and the purpose, and I check with the claims team that it is true. We would not write that a person reviews every claim if that is not so. All of this would be in English and Hindi, and tested with a few customers."
