id: reduce-latency
question: "Users say your LLM feature is slow. How would you make it faster?"
short_answer: "Measure first: find where time goes, such as retrieval, the model call or tools. Then stream the answer so text appears at once, cut input and output length, cache repeated prompt prefixes and common answers, use a smaller model for simple steps, and run independent steps in parallel."
deeper_answer: "Perceived speed matters as much as total time: streaming and showing progress make an app feel fast. Output tokens are generated one by one, so asking for shorter answers often helps most. Long retrieved context adds input time and cost; rerank and send fewer, better chunks.\n\nArchitecture changes help too: precompute what you can, run retrieval and other lookups in parallel, avoid chains of sequential model calls where one call would do, and choose providers or regions close to users. Measure the effect of each change on both latency and quality."
follow_ups:
  - "Which usually matters more for latency: input or output length?"
  - "How would you speed up a pipeline of three sequential model calls?"
common_mistakes:
  - "Optimising without measuring where the time goes"
  - "Cutting quality without checking the eval set"
level: P2
