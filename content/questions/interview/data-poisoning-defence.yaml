example: "A hypothetical Indore agritech startup fine-tuned a crop advice model on farmer feedback from its app. I proposed that feedback goes to a review queue before training, that we track each example's source and user, and that a fixed, trusted test set checks every new model. In one review we found many near-identical messages from a few accounts pushing one pesticide brand, and dropped them."
