id: pm-plan-with-uncertain-feasibility
question: "Engineers cannot promise that a model will reach the accuracy your feature needs. How do you plan and make commitments when feasibility is uncertain?"
kind: concept
short_answer: "Do not commit to a date for an unproven result. Run a time-boxed test with a fixed test set and a target. At the end, decide: go, change scope or stop. Commit to learning milestones first, share ranges with stakeholders, and keep a fallback such as a narrower task or human review."
deeper_answer: "With normal software, effort is uncertain but the outcome is not: the button will work. With models, the outcome itself is uncertain. Nobody knows if extraction from blurred cheque photos reaches 98% until someone tries. So the plan has two stages. Stage one is for learning: two weeks, 200 real examples, one number. Stage two is the build, and only then does a date mean something.\n\nStakeholders can accept uncertainty if it is described clearly. Say: by the 15th we will know if this is feasible, and here are the three possible outcomes. Keep a fallback ready, such as handling only clear images automatically and sending the rest to staff. Interviewers listen for a time box, a target agreed in advance, explicit decision points, and a refusal to let sales announce before evidence exists."
follow_ups:
  - "What if the test reaches 90% and the target was 95%?"
  - "How long should a feasibility test be allowed to run?"
  - "How do you report this kind of uncertainty to leadership?"
common_mistakes:
  - "Giving a firm launch date before any test"
  - "Running an open-ended research phase with no target"
  - "No fallback if the target is missed"
level: I3
topic: product
stop_id: build-vs-buy
rubric:
  - point: "Runs a time-boxed feasibility test"
    keywords: ["time-box", "time box", "two weeks", "feasibility test"]
  - point: "Uses a fixed test set and a target agreed in advance"
    keywords: ["test set", "target", "in advance"]
  - point: "Sets decision points: go, change scope or stop"
    keywords: ["decision point", "change scope", "stop"]
  - point: "Commits to milestones and ranges, not a single date"
    keywords: ["milestone", "range"]
  - point: "Keeps a fallback such as a narrower task or human review"
    keywords: ["fallback", "manual", "staff"]
answer_seconds: 120
example: "I separate finding out from building. First I agree a time-boxed feasibility test with engineering: two weeks, a test set of 200 real cheque photos, and a target of 98% correct on amount and date, set in advance. On day 14 we have a decision point: go, change scope or stop. Until then I do not give a launch date. I tell leadership the milestone, 'we will know by the 15th', and a range for delivery if it works. I also plan a fallback: if we reach only 92%, clear images go through automatically and unclear ones go to staff for manual entry. And I ask sales not to promise the feature before the test result."
