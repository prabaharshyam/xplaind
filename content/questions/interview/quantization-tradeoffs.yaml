example: "A 14-billion-parameter model in 16-bit needs roughly 28 GB just for weights, which does not fit on a 24 GB GPU. Quantised to 4-bit with AWQ, the weights take around 8 GB, leaving room for the KV cache and more parallel requests. On our eval set the 4-bit version lost a little on maths-heavy questions and almost nothing on support answers, so we used it for support only."
