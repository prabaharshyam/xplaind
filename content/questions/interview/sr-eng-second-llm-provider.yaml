id: sr-eng-second-llm-provider
question: "All 12 of your LLM features run on one provider, which had two outages of about three hours each last quarter. Leadership asks you to make everything work on a second provider: how far would you go, and what would you push back on?"
kind: scenario
short_answer: "I would not make all 12 features dual-provider. I would rank features by the cost of downtime, give the top few a tested fallback behind a gateway, and let the rest degrade gracefully. A second provider means a second set of prompts and evals to maintain, so I would buy only the resilience the business needs."
deeper_answer: "A fallback is not a config switch. Prompts tuned for one model behave differently on another, tool calling formats differ, and every prompt change must now pass evals on two models. For 12 features that is extra work for every team, for as long as the fallback exists. So the senior answer starts from the money: what did six hours of outage in a quarter cost, and for which features?\n\nA typical split: the support assistant and checkout help get an active fallback that is exercised weekly with a small share of real traffic, because an untested fallback fails on the day it is needed. Internal tools get a clear error message and a queue. Interviewers listen for a candidate who quantifies downtime, names the maintenance cost, tests the failover path, and gives leadership a tiered proposal instead of a plain yes or no."
follow_ups:
  - "How would you keep the fallback prompts from going stale?"
  - "Which signals would trigger the switch to the second provider, and who decides?"
  - "How would you estimate the cost of one hour of downtime for a feature?"
common_mistakes:
  - "Treating a second provider as a simple configuration switch"
  - "Giving all 12 features the same level of protection"
  - "Building a fallback that is never tested with real traffic"
level: P3
topic: system-design
stop_id: quality-cost-speed
rubric:
  - point: "Ranks features by business cost of downtime instead of treating all 12 alike"
    keywords: ["downtime", "rank", "tier", "revenue", "priorit"]
  - point: "Names the ongoing cost: a second set of prompts and evals per feature"
    keywords: ["prompt", "eval", "maintain", "maintenance"]
  - point: "Fallback behind a gateway, tested regularly with real traffic"
    keywords: ["gateway", "fallback", "failover", "real traffic"]
  - point: "Graceful degradation for low-priority features"
    keywords: ["degrade", "queue", "error message", "degrad"]
  - point: "Gives leadership a tiered proposal with costs"
    keywords: ["proposal", "leadership", "option", "tiers"]
answer_seconds: 180
example: "I would first put a number on the outages. Say six hours down cost us about ₹40 lakh in lost orders, and almost all of it came from two features, the support assistant and checkout help. So I would rank the 12 features by downtime cost and propose tiers to leadership. The top two get a fallback provider behind our gateway, with their prompts and eval sets maintained for both models, and one percent of real traffic sent through the fallback every week so we know it works. The other ten degrade: a clear error message and a queue that retries later. I would explain that making all 12 dual-provider roughly doubles prompt and eval maintenance for every team, and that this cost is not worth it for internal tools."
