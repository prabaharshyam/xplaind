id: multimodal-rag-question
question: "How would you build RAG over documents full of charts and images?"
kind: use-case
short_answer: "Two main options: convert visuals to text, by having a vision-language model describe each chart and image and indexing those descriptions with the text; or embed page images directly with a multimodal retriever and pass the retrieved page images to a vision-capable model. Keep links to the original page so answers can cite it."
deeper_answer: "Describing images is simple and works with existing text pipelines, but descriptions can miss details. Page-image retrieval, in the style of ColPali, keeps layout and visual detail, at higher storage and compute cost.\n\nEvaluate with questions whose answers are only in charts or diagrams, because text-only tests will hide weaknesses."
follow_ups:
  - "What is lost when you describe a chart in text?"
  - "How would you test chart-based answers?"
common_mistakes:
  - "Testing only with text-answerable questions"
  - "Dropping images during parsing without noticing"
level: P1
topic: rag
stop_id: multimodal-rag
rubric:
  - point: "Option one: describe visuals as text"
    keywords: ["describe", "caption", "text description", "convert"]
  - point: "Option two: embed page images directly"
    keywords: ["page image", "multimodal", "image embedding", "colpali"]
  - point: "Vision-capable model to answer"
    keywords: ["vision", "multimodal model"]
  - point: "Keeps links to source pages"
    keywords: ["page", "source", "cite"]
  - point: "Tests with chart-only questions"
    keywords: ["test", "chart", "eval"]
answer_seconds: 90
example: "For a pharma company's research slide decks, much of the content was in charts. We used a vision-capable model to write a description of each chart, including axis labels and key values, indexed those alongside the slide text, and stored the slide image. When a chart was retrieved, the answer cited the deck and slide number, and the user could open the original slide to check."
