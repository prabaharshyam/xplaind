answer_seconds: 150
example: "For a UPI app at 5,000 transactions per second, I would first clarify the latency budget, 100 milliseconds end to end, and the cost of a false positive against a missed fraud. Each payment goes on a stream, and a stream processor keeps velocity features: payments per device in the last minute, new payees today, and the amount against the user's usual amount. The scoring service reads them from an in-memory feature store and runs a gradient-boosted model beside rules. Low scores are approved, middle scores get a step-up check, and high scores are blocked. Labels arrive late from chargebacks, and the data is imbalanced, so I train on a time-based split and measure recall at a fixed false positive rate. I would run in shadow mode first, then monitor drift, because fraud patterns change fast. The trade-off is accuracy against latency: graph features help, but I compute them asynchronously."
