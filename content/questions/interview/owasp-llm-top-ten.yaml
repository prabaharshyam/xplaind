id: owasp-llm-top-ten
question: "Walk me through the OWASP Top 10 for LLM applications. Which risks would you check first in a RAG chatbot?"
kind: concept
short_answer: "The 2025 list covers prompt injection, sensitive information disclosure, supply chain, data and model poisoning, improper output handling, excessive agency, system prompt leakage, vector and embedding weaknesses, misinformation, and unbounded consumption. For a RAG chatbot I would check prompt injection, data disclosure through retrieval, vector store access control, output handling and cost limits first."
deeper_answer: "The list is a shared vocabulary, not a full test plan. Map each item to your design. In a RAG chatbot: indirect prompt injection arrives inside retrieved documents; sensitive information leaks when retrieval ignores the user's permissions; vector and embedding weaknesses include a shared index without per-user filters; improper output handling means rendering model output as HTML or running it as code without checks; system prompt leakage matters if secrets or rules live in the prompt; unbounded consumption is long inputs or loops that run up the bill.\n\nFor each risk, write the control and a test: injected documents in the test set, permission tests per user, output encoding, rate and token limits. Re-check after every major change."
follow_ups:
  - "What does improper output handling look like in practice?"
  - "Why is system prompt leakage a problem only if the design is already weak?"
common_mistakes:
  - "Reciting the list without linking risks to the actual system"
  - "Treating prompt injection as the only LLM risk"
level: I3
topic: security
stop_id: llm-app-threats
rubric:
  - point: "Names most of the ten risks correctly"
    keywords: ["prompt injection", "sensitive information", "supply chain", "poisoning", "excessive agency", "unbounded consumption"]
  - point: "Picks risks relevant to RAG"
    keywords: ["retriev", "vector", "embedding", "permission", "document"]
  - point: "Explains improper output handling"
    keywords: ["output handling", "html", "render", "execute", "encode"]
  - point: "Ties each risk to a control and a test"
    keywords: ["control", "test", "check", "mitigat"]
answer_seconds: 120
example: "Reviewing a hypothetical HR policy chatbot for a Bengaluru IT services firm, I walked the list. Two real findings: the vector index had no permission filter, so any employee could retrieve salary band documents, and the chat window rendered model output as HTML. We added group filters inside the search and output encoding, and turned both into regression tests."
