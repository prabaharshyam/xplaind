example: "In a loan-application agent built with LangGraph, the state holds the application, documents checked and the decision so far. Nodes do 'extract details', 'check documents' and 'draft decision'. A conditional edge loops back to 'check documents' if something is missing. The checkpointer saves state after each node, so when the graph pauses for an officer's approval, it can resume hours later exactly where it stopped."
