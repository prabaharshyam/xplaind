id: langgraph-state-checkpoints
question: "Explain state, nodes, edges and checkpoints in LangGraph."
short_answer: "The state is a typed object shared across the graph, such as messages and intermediate results. Nodes are functions that read the state and return updates. Edges decide what runs next, either fixed or conditional on the state, which allows loops. A checkpointer saves state after each step, enabling memory, resuming, human approval with interrupts and replay."
deeper_answer: "This structure makes agent behaviour explicit and testable: you can unit test a node, draw the graph, and see in traces which path a run took. Reducers define how updates merge, for example appending messages rather than replacing them.\n\nCheckpoints are what make human-in-the-loop practical: the graph pauses at an interrupt, the state is saved, and it resumes when a person approves, even hours later."
follow_ups:
  - "How would you add a human approval step before a refund node?"
  - "What does a reducer do?"
common_mistakes:
  - "Treating LangGraph as only a prompt library"
  - "Forgetting persistence is needed for interrupts"
