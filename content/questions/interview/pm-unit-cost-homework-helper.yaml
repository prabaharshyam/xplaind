id: pm-unit-cost-homework-helper
question: "You plan an AI doubt-solving feature inside a ₹199 per month study plan. How do you work out the cost per user before launch, and whether the plan can carry it?"
kind: use-case
short_answer: "Estimate cost per question from tokens in and out, including the system prompt, chat history and any image. Multiply by questions per active user per month from a pilot, and look at heavy users, not only the average. Add other running costs, then compare with what remains of ₹199 after tax and fees."
deeper_answer: "Unit cost has two parts: cost per request and requests per user. Cost per request is input tokens times the input price plus output tokens times the output price. People forget that the system prompt, earlier turns and retrieved notes are all input tokens, and that a photo of a question adds to the input. Measure it on real pilot traffic.\n\nUsage is uneven. An average of 40 questions a month can hide a student who asks 600 before exams. So model the median, the 90th percentile and exam season. Then set a target margin and choose ways to lower cost: a daily limit, a smaller model for easy questions, or caching common answers. Interviewers listen for a worked calculation with stated assumptions, and for the heavy-user and peak-month cases."
follow_ups:
  - "What would you do if the heaviest 10% of users cost more than they pay?"
  - "How does exam season change your estimate?"
  - "What would you change first to cut cost per question?"
common_mistakes:
  - "Counting only output tokens"
  - "Using the average user and ignoring heavy users"
  - "Forgetting tax and payment fees when comparing with the price"
level: I1
topic: product
stop_id: pricing-ai-features
rubric:
  - point: "Calculates cost per request from input and output tokens"
    keywords: ["token", "cost per question", "cost per request"]
  - point: "Estimates usage per user from a pilot"
    keywords: ["pilot", "per user per month", "usage"]
  - point: "Looks at heavy users and peak periods, not the average"
    keywords: ["heavy", "percentile", "exam", "peak"]
  - point: "Compares against revenue after tax and fees, with a margin target"
    keywords: ["margin", "gst", "fees"]
  - point: "Names ways to reduce cost"
    keywords: ["limit", "smaller model", "cach"]
answer_seconds: 130
example: "I would build it from two numbers. First, cost per question: input tokens, which include the system prompt, chat history and the photo, plus output tokens, each times the provider's price. I would measure this on a pilot, not guess. Say it comes to 50 paise. Second, usage: if the pilot shows 40 questions per user per month, the average cost is ₹20. But I would also check heavy users. A student asking 500 questions before board exams costs ₹250, more than the plan. Then I compare with revenue: ₹199 minus GST and payment fees leaves about ₹165. For a healthy margin I would add a daily limit and send easy questions to a smaller model."
