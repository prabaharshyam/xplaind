  - point: "Offline metrics then A/B test, plus monitoring"
    keywords: ["a/b", "ab test", "offline", "online", "monitor"]
answer_seconds: 120
example: "For a fashion app, I would aim at purchases per session. Candidate generation: items similar to what the user viewed, items bought together, and trending items in their city and language. A ranking model then scores those few hundred candidates on user history, price band, delivery time to their PIN code and freshness. New users get popular items for their region. I would test offline on past sessions, then run an A/B test."
