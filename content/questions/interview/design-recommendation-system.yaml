id: design-recommendation-system
question: "Design a recommendation system for an Indian e-commerce app."
kind: use-case
short_answer: "Clarify the goal and constraints first: what to recommend, where, the metric (clicks, purchases, revenue), scale and latency. Then a two-stage design: candidate generation from collaborative filtering, item similarity and popular items in the user's region and language, then a ranking model on user, item and context features. Handle cold start, evaluate offline then with an A/B test, and monitor."
deeper_answer: "Good answers think about data: views, carts, purchases and returns as implicit feedback; item text and images for new products; signals such as city, language and festival season. Candidate generation narrows millions of items to hundreds quickly, using embeddings and nearest-neighbour search. The ranker, often gradient boosting or a neural model, scores those with richer features.\n\nCold start: new users get popular and regional items or ask a few preferences; new items lean on content embeddings. Offline metrics such as recall at k and NDCG guide development, but the A/B test on business metrics decides. Watch for feedback loops that only show popular items, and add diversity and business rules such as stock availability."
follow_ups:
  - "How would you handle a brand new user?"
  - "Why might offline metrics disagree with the A/B test?"
common_mistakes:
  - "Jumping to a model before clarifying the goal"
  - "Ignoring cold start and evaluation"
level: P2
topic: system-design
stop_id: ml-interviews
