id: pm-legal-blocks-launch
question: "Two weeks before launch, your legal team blocks an AI feature because customer data is sent to an external model provider. How do you handle it?"
kind: scenario
short_answer: "Treat it as a valid risk, not an obstacle. Learn the exact concern, then bring facts: a data flow diagram and the provider's retention and training terms. Offer options: remove or mask personal data, stricter provider settings or contract, an updated privacy notice, or a reduced first launch. Involve legal earlier next time."
deeper_answer: "'Legal blocked it' often means legal lacked information. The concern may be about which fields leave the company, where they are processed, whether the provider keeps or trains on them, or whether the privacy notice covers this use. Each has a different fix, so ask for the precise issue and answer with documents, not assurances.\n\nThen negotiate scope, not principle. If the feature summarises support chats, masking phone numbers and account numbers before the call may remove most of the risk. A version that works without personal data can launch on time while the contract work continues. Be honest with leadership about the date. Interviewers listen for respect for the legal role, concrete options, and a process change: privacy review at the spec stage, not at the end."
follow_ups:
  - "What would you do if leadership asks you to launch anyway?"
  - "Which provider terms would you check first?"
  - "How do you change your process so this does not repeat?"
common_mistakes:
  - "Escalating over legal to save the date"
  - "Arguing without a data flow diagram"
  - "Seeing only two choices: launch fully or not at all"
level: P1
topic: product
stop_id: ai-data-strategy
rubric:
  - point: "Finds the exact legal concern"
    keywords: ["exact concern", "which data", "understand"]
  - point: "Brings a data flow and the provider's terms"
    keywords: ["data flow", "provider's terms", "retention"]
  - point: "Offers mitigations: masking or minimising personal data"
    keywords: ["mask", "redact", "minimi"]
  - point: "Proposes a reduced or phased launch"
    keywords: ["reduced scope", "phase", "without personal data"]
  - point: "Moves legal review earlier in the process"
    keywords: ["earlier", "spec stage", "next feature"]
answer_seconds: 130
example: "I would not fight the block. I would meet legal the same day to understand the exact concern: which data fields, and whether it is about retention, training or our privacy notice. Then I bring facts: a one-page data flow and the provider's terms on retention and training. Next I offer options. We can mask names, phone numbers and account numbers before the text leaves our servers. We can sign the provider's data processing contract. Or we launch a reduced scope first, for example summaries of product questions only, without personal data. I tell leadership honestly if the date moves by two weeks. And for the next feature, legal reviews the data section at the spec stage, much earlier."
