id: code-one-hot-encoding
question: "Implement one-hot encoding with a fit step and a transform step, and handle a category at prediction time that was not in the training data. For example, fit on red, green, red, blue, then transform green and purple: with columns blue, green, red, green becomes (0, 1, 0) and purple becomes all zeros."
kind: use-case
short_answer: "In fit, build a dictionary from each training category to a column index, in sorted order. In transform, make a zero matrix of n rows by that many columns and set one cell per row. An unseen category has no index, so its row stays all zeros or goes to a reserved unknown column. Cost is O(n)."
deeper_answer: "Clarify first: is it one column of strings or several, how many distinct values exist, and what should happen with an unseen value: raise an error, ignore it, or map it to an unknown bucket?\n\nFit builds the mapping once from the training data, for example {v: i for i, v in enumerate(sorted(set(values)))}. Sorting makes the column order the same on every run. Transform creates out = np.zeros((n, len(mapping))) and for each row looks up j = mapping.get(v). If j exists, set out[row, j] = 1. If not, leave the row as zeros, or add one extra column at fit time for unknown values. The mapping must be saved with the model, so training and serving use the same columns.\n\nTest that every known row sums to 1, that an unseen value does not crash, and that the output width is the same for any input. Interviewers watch for a new fit on the prediction data, which changes the column order, and for a KeyError on a new category."
follow_ups:
  - "What would you do with a column that has 50,000 distinct values?"
  - "Why do some models need one column dropped?"
  - "How do you keep training and serving consistent?"
common_mistakes:
  - "Fitting again on the prediction data"
  - "A KeyError on a category that was not seen in training"
  - "Column order that changes between runs"
level: I2
topic: coding
stop_id: ml-feature-engineering
rubric:
  - point: "Fit builds a stable mapping from category to column index"
    keywords: ["mapping", "sort", "column index"]
  - point: "Transform fills a zero matrix with a single 1 per row"
    keywords: ["matrix of zeros", "set that cell"]
  - point: "Handles an unseen category without a crash"
    keywords: ["unseen category", "all zeros", "unknown column"]
  - point: "Never refits at prediction time; train and serve share columns"
    keywords: ["refit", "columns would change"]
  - point: "Mentions the cost, or what to do with many categories"
    keywords: ["linear", "sparse"]
answer_seconds: 150
example: "I would split it into fit and transform. In fit, I collect the distinct categories from the training data, sort them so the order is stable, and build a mapping from category to column index. In transform, I create a matrix of zeros with one row per input and one column per known category. For each row I look up the category in the mapping and set that cell to 1. The edge case is an unseen category at prediction time. A dictionary lookup would fail, so I use a safe lookup, and leave the row as all zeros or send it to an unknown column that I reserved in fit. I must not refit on new data, because the columns would change and the model would read the wrong features. The cost is linear in the rows. With many categories I would use a sparse matrix."
