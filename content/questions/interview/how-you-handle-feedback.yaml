    keywords: ["result", "learned", "improved", "since then", "reached"]
answer_seconds: 120
example: "I try to listen fully first and ask questions before I reply. A real example: in my internship at a health startup in Hyderabad, I built a prompt that pulled medicine names from doctors' notes, and I reported 95 percent accuracy. In the review, my senior said the number could not be trusted, because I had tested on the same 40 notes I used while writing the prompt. Honestly, I felt embarrassed. But I asked him how he would test it. I then collected 100 new notes, and the real accuracy was 81 percent. I spent the next week fixing the errors and reached 90. Since then I keep a separate test set from day one, and I ask for a review in the first week."
