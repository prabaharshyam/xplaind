id: how-you-handle-feedback
question: "How do you handle criticism of your work?"
kind: real-life
short_answer: "Say that you listen first, ask questions to understand, and separate the work from yourself. Then give one real example where feedback was hard to hear, what you changed, and the result. Show that you now ask for feedback early. You may add that you speak up politely when you disagree."
deeper_answer: "The interviewer is checking whether you are easy to work with and whether you improve. In AI work, your prompts, models and test results are reviewed all the time, so someone who gets defensive slows the team.\n\nUse a real story with four parts: the feedback, your first reaction, what you did, and the result. It is fine to admit it hurt at first. That is honest. For example: \"My senior said my accuracy number meant nothing because I had tested on my training examples. I felt bad, but he was right. I built a separate test set that week.\" If you disagree with feedback, say how you check it with evidence and not with argument."
follow_ups:
  - "Tell me about feedback you did not agree with."
  - "How do you give feedback to others?"
  - "What is the most useful feedback you have received?"
common_mistakes:
  - "Claiming you never feel bad about criticism"
  - "Blaming the person who gave the feedback"
  - "Giving no real example"
level: B3
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
