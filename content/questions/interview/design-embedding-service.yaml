answer_seconds: 150
example: "For 20 teams, I would first clarify the two kinds of load. Search queries need low latency, about 50 milliseconds at 2,000 requests per second. Indexing 100 million texts needs throughput. So I build one API with two separate paths. The online path runs on GPU servers with dynamic batching, and a cache keyed by a hash of the text and the model version. The batch path reads from a queue on its own capacity, so a big job cannot slow live traffic. Each team gets a quota, a limit on requests per second. The key rule is that every vector carries a model version, because vectors from two models are not comparable. When we upgrade, teams re-embed their data, rebuild the index, and switch queries and documents together. Before choosing a model, I evaluate recall at 10 on each team's own retrieval data. The trade-off is quality against cost: larger vectors search better but need more storage."
