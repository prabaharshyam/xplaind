id: led-team-through-change
question: "Tell me about a time you led a team through a big change."
kind: real-life
short_answer: "Describe a real change you led: a new tool, process, structure or direction. Explain why it was needed, how you told the team, how you handled fear and objections, and how you kept delivery going during the change. End with a measured result and what you would do better."
deeper_answer: "The interviewer is checking whether you can lead people through a change, not only write a plan. Change makes people worry about their skills and their status. A good leader explains the reason, listens to objections and moves in steps.\n\nSituation: the old way and why it had to change. Task: your role. Action: how you explained the reason, who resisted and why, and what you did about it. A good line is: \"Two senior people were against it, so I asked them to run the pilot and tell me what was wrong with my plan.\" Result: numbers before and after, and how the team felt. Add one thing you got wrong. It makes the story more believable."
follow_ups:
  - "Who resisted the most, and what did you do?"
  - "How did you keep delivery going during the change?"
  - "What would you do differently next time?"
common_mistakes:
  - "Describing the plan and never the people"
  - "Saying nobody resisted"
  - "Giving no number for before and after"
level: P3
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Explains the change and why it was needed"
    keywords: ["because", "reason", "decided", "move", "change"]
  - point: "Describes how they explained it to the team"
    keywords: ["explained", "told", "meeting", "shared"]
  - point: "Handled resistance by listening"
    keywords: ["worried", "critics", "resisted", "concerns", "listened"]
  - point: "Moved in steps, such as a pilot"
    keywords: ["pilot", "step by step", "phase", "one model", "first"]
  - point: "Gives a measured result"
    keywords: ["hours", "days", "percent", "result", "now takes"]
  - point: "Says what they would do better"
    keywords: ["should have", "would do", "earlier", "learned"]
answer_seconds: 150
example: "I led a team of eight data scientists at a lending company. Each person deployed models by hand from notebooks, and a release took about three days. After two bad releases, I decided to move us to one pipeline with automatic tests and a model registry. Several people worried it would slow their work. I explained the reason with the two incidents, not with theory. I asked the two strongest critics to run a pilot on one model and list every problem. We fixed their top five issues before anyone else moved. I ran pairing sessions for a month and kept the old way open for urgent fixes. In four months all 11 models had moved. A release now takes two hours, and we have had no rollback this year. I should have written the guide earlier."
