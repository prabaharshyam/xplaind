id: llm-as-judge
question: "What are the pros and cons of using an LLM as a judge?"
short_answer: "A judge model can grade qualities that code cannot, such as helpfulness or tone, quickly and cheaply at scale. But judges have biases, such as preferring longer answers or the first option, and can be wrong confidently. Use them only after checking their grades agree with careful human grades, and prefer code checks where rules are exact."
deeper_answer: "Make judges reliable by asking narrow questions (pass or fail on one criterion, with a reason) rather than vague 1 to 10 scores, giving clear rubrics and examples, and swapping answer order in comparisons to cancel position bias.\n\nMeasure agreement with human labels on a sample and recheck when you change the judge's model or prompt. Treat the judge as a model you also evaluate, not as ground truth."
follow_ups:
  - "How would you measure whether a judge is trustworthy?"
  - "Why are pass or fail judgements often better than 1 to 10 scores?"
common_mistakes:
  - "Trusting a judge without comparing it with humans"
  - "Using the same model to generate and judge without any checks"
level: P1
