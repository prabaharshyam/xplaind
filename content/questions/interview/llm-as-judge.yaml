answer_seconds: 90
example: "In one project we used a model to grade whether support replies were 'polite and complete'. Before trusting it, two people graded 100 replies, and the judge agreed with them on most but consistently preferred longer replies even when they were padded. We changed the rubric to penalise unnecessary length, rechecked agreement, and kept code checks for things like 'mentions the order number'."
