id: code-kmeans-from-scratch
question: "Implement k-means clustering in NumPy: given n points and k, return the centroids and a cluster label for each point. For example, the points 1, 2, 10 and 11 with k = 2 should end with centroids 1.5 and 10.5."
kind: use-case
short_answer: "Pick k starting centroids from the data. Repeat two steps: assign each point to its nearest centroid, then move each centroid to the mean of its points. Stop when the assignments no longer change or after a maximum number of rounds. Each round costs O(n k d)."
deeper_answer: "Clarify first: X is n by d, k is at most n, and the features should be on a similar scale, because k-means uses Euclidean distance.\n\nInitialise by choosing k distinct rows at random, or with k-means++, which spreads the starting points out. The assignment step computes all squared distances by broadcasting, d2 = ((X[:, None, :] - C[None, :, :]) ** 2).sum(axis=2), and takes labels = d2.argmin(axis=1). The update step sets each centroid to X[labels == j].mean(axis=0). If a cluster has no points, that mean is NaN, so keep the old centroid or move it to a random point. Stop when the centroids no longer move.\n\nEach round lowers the sum of squared distances or leaves it unchanged, so the loop always ends, but only at a local optimum. Run it from several seeds and keep the result with the lowest total. Test on two well-separated groups. Interviewers watch for the empty cluster, for no stopping rule, and for a square root that argmin does not need."
follow_ups:
  - "How would you choose k?"
  - "What does k-means++ change, and why does it help?"
  - "When does k-means give poor clusters?"
common_mistakes:
  - "No handling of an empty cluster"
  - "No stopping rule or maximum number of rounds"
  - "Running on unscaled features"
level: I2
topic: coding
stop_id: unsupervised-learning
rubric:
  - point: "Initialises k centroids from the data"
    keywords: ["starting centroids", "at random", "seed"]
  - point: "Assignment step: each point goes to its nearest centroid"
    keywords: ["nearest centroid", "argmin", "assign"]
  - point: "Update step: each centroid moves to the mean of its points"
    keywords: ["mean of the points", "update step"]
  - point: "Has a stopping rule and states the cost of a round"
    keywords: ["stop", "maximum number", "n times k"]
  - point: "Handles an empty cluster and local optima"
    keywords: ["empty cluster", "local optimum", "several seeds"]
answer_seconds: 180
example: "The input is a matrix of n points by d features, and k. I pick k distinct points at random as the starting centroids, with a seed. Then I repeat two steps. The assignment step computes the squared distance from every point to every centroid with broadcasting, and takes the argmin, so each point gets its nearest centroid. The update step moves each centroid to the mean of the points assigned to it. I stop when the centroids stop moving, or after a maximum number of iterations. Each round costs n times k times d. One edge case is an empty cluster: the mean of nothing is NaN, so I keep the old centroid or move it to a random point. The result is only a local optimum, so I would run several seeds and keep the lowest total squared distance. On 1, 2, 10, 11 I expect 1.5 and 10.5."
