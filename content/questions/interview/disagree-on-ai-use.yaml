id: disagree-on-ai-use
question: "Tell me about a time you disagreed about whether or how to use AI for something."
short_answer: "Describe the disagreement fairly, then how you resolved it with evidence rather than opinion: a small prototype, a test set, a cost estimate or a risk review. Show you listened, changed your mind if the evidence said so, and ended with a decision the team could act on."
deeper_answer: "Strong answers show you can say no to AI when it is the wrong tool, as well as push for it when it fits. For example: a team wanted an agent for a task a simple rules engine could do reliably; you ran both on real cases, showed the comparison, and the team chose the simpler option.\n\nKeep the tone respectful towards the other side, and finish with the outcome and what you learned about making such decisions."
follow_ups:
  - "What would you have done if the evidence had gone against you?"
  - "How do you decide when AI is the wrong tool?"
common_mistakes:
  - "Presenting the other person as simply wrong"
  - "Resolving it by seniority or opinion instead of evidence"
level: P3
topic: behavioral
stop_id: design-interview
rubric:
  - point: "Describes the disagreement fairly"
    keywords: ["disagree", "view", "concern", "they thought"]
  - point: "Resolved it with evidence: prototype, test or estimate"
    keywords: ["prototype", "evidence", "test", "data", "estimate"]
  - point: "Shows listening and openness to change"
    keywords: ["listen", "changed my mind", "understood", "open"]
  - point: "Ends with a decision the team acted on"
    keywords: ["decision", "agreed", "result", "outcome"]
