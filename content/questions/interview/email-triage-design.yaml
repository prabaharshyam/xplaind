id: email-triage-design
question: "How would you build AI triage for a support inbox?"
short_answer: "Classify each incoming email with a model into a fixed set of categories and urgency, extract key fields such as order number, and route it to the right queue or person. Use clear category definitions with examples, ask for structured output, and send uncertain cases to a human. Measure accuracy on a labelled sample and review misroutes weekly."
deeper_answer: "Start with the categories the support team already uses, not new ones. Add a confidence or 'other' category so the model is not forced to guess. Draft replies can come later, with a person approving them before sending.\n\nTrack the business result: time to first response, misroute rate and how often agents change the category."
follow_ups:
  - "How would you measure whether the triage is good enough?"
  - "What would you do with emails in Hindi or Tamil?"
common_mistakes:
  - "Letting the model invent categories"
  - "No fallback for uncertain cases"
level: I1
topic: automation
