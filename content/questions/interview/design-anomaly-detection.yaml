answer_seconds: 140
example: "With 10,000 metrics checked every minute, I would first clarify the cost of a false alert against a missed incident, because alert volume is the real limit here. Metrics come in on a stream. For each one I keep a seasonal baseline, the expected value for this minute of the week, with a normal band around it. I score the deviation from that band, and an anomaly must persist for about three minutes before it counts. Then I group anomalies from the same service into one incident and rank it by business impact, so payment success rate comes before disk usage. There are almost no labels, so I replay past incidents to measure precision and time to detect, and I collect feedback from on-call engineers on every alert to tune each threshold. The trade-off is speed against noise: waiting three minutes delays detection, but it removes most single-point spikes."
