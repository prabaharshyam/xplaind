    keywords: ["tune", "threshold", "exception", "retire", "suppress"]
  - point: "Groups and enriches alerts with context"
    keywords: ["group", "correlate", "enrich", "context", "case"]
  - point: "Prioritises by asset and impact, automates routine steps"
    keywords: ["severity", "priority", "asset", "automate", "playbook", "soar"]
  - point: "Ownership and ongoing metrics"
    keywords: ["owner", "review", "metric", "time to triage"]
answer_seconds: 100
example: "At a hypothetical Hyderabad SOC serving a retail chain, one 'failed login' rule made 60% of alerts and almost none were real. We changed it to fire on many failures followed by a success, from a new country or device, and grouped alerts per user. Alerts fell sharply, analysts had time for real cases, and we kept the old rule running silently for two weeks to confirm we missed nothing."
