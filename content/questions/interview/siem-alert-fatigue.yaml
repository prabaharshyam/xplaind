id: siem-alert-fatigue
question: "Your SOC gets thousands of SIEM alerts a day and analysts are ignoring them. How do you fix alert fatigue?"
kind: scenario
short_answer: "First measure: which rules fire most and how many of their alerts turn out real. Then tune or retire noisy rules, add context so one incident is one alert, set severity by asset and impact, and automate the routine checks. The goal is fewer, better alerts that each have an owner and a clear next step."
deeper_answer: "Alert fatigue is dangerous because the real attack gets lost among false alarms. Start with data: export a month of alerts with their outcomes and rank rules by volume and true-positive rate.\n\nFixes: tune thresholds and add exceptions for known-good behaviour (with an expiry date and a reason); group related alerts into one case; enrich alerts with the user, asset owner and recent history so triage takes minutes; raise severity for crown-jewel systems; automate enrichment and simple closures with a playbook. Each rule should have an owner, a written response step and a review date. Track metrics such as alerts per analyst, true-positive rate per rule and time to triage, and make sure tuning does not silence a rule that catches real attacks."
follow_ups:
  - "How do you make sure tuning a rule does not hide a real attack?"
  - "Which metrics would you show the SOC manager each month?"
common_mistakes:
  - "Turning off noisy rules without checking what they catch"
  - "Adding more rules and dashboards instead of improving the ones that exist"
level: I1
topic: security
stop_id: logs-and-siem
rubric:
  - point: "Measures volume and true-positive rate per rule first"
    keywords: ["measure", "true positive", "per rule", "volume", "data"]
