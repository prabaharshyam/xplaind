id: ci-for-prompts
question: "How would you set up CI/CD for an LLM application?"
kind: use-case
short_answer: "On every pull request run the normal checks (lint, types, unit tests) plus an eval suite: a regression set of prompts with code checks and judge-based scores, compared with the main branch. Block merges that fall below thresholds. Version prompts and model settings in the repository, deploy to staging first, then roll out gradually with monitoring and a quick rollback."
deeper_answer: "Evals cost money and time, so run a fast smoke set on every pull request and a fuller set nightly or before release. Cache model responses where inputs are unchanged.\n\nTreat a model version upgrade like a code change: it goes through the same pipeline. Secrets come from the CI system's secret store, never the repository."
follow_ups:
  - "How would you keep eval costs reasonable in CI?"
  - "How would you roll back a bad prompt change?"
common_mistakes:
  - "Changing prompts outside version control"
  - "No evals in the pipeline"
level: P1
topic: deployment
stop_id: cicd-github-actions
rubric:
  - point: "Normal checks: lint, types, unit tests"
    keywords: ["lint", "type", "unit test"]
  - point: "Eval suite on every change"
    keywords: ["eval", "regression", "test set"]
  - point: "Thresholds block bad merges"
    keywords: ["threshold", "block", "gate", "fail"]
  - point: "Prompts and model settings versioned"
    keywords: ["version", "repository", "git"]
  - point: "Staging, gradual rollout and rollback"
    keywords: ["staging", "rollout", "canary", "rollback", "roll back"]
answer_seconds: 90
example: "In our GitHub Actions pipeline, every pull request ran lint and unit tests, then an eval job over 150 saved support questions with code checks for format and banned phrases, plus an LLM judge for accuracy. The job compared scores with main and failed if accuracy fell more than two points. Merges deployed to staging, then to 10% of users with monitoring, then everyone."
