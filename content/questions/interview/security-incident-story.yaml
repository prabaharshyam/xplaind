id: security-incident-story
question: "Tell me about a security incident or near miss you handled. What did you do and what changed afterwards?"
kind: real-life
short_answer: "Use STAR: the situation, your role, the actions you took in order, and the result. Show calm triage, containment before clean-up, clear communication, and evidence kept. End with what changed: a root-cause fix, a new detection or test, and what you learned. A lab, CTF or college project incident is fine if you are honest about it."
deeper_answer: "Interviewers look for judgement under pressure, not heroics. Pick one incident you know in detail. Explain how it was detected and how you confirmed it was real; what you contained first and why; who you informed and when; how you found the root cause; and how you checked nothing else was affected.\n\nThen the learning: a blameless review, a fix that removes the cause rather than a reminder email, and a regression test or detection rule so it cannot happen silently again. Be honest about mistakes you made. Never share confidential client details or anything that identifies a real victim; describe the company in general terms."
follow_ups:
  - "What would you do differently next time?"
  - "How did you communicate with people who were not technical?"
common_mistakes:
  - "Claiming you fixed everything alone, with no mention of the team or process"
  - "Sharing confidential details about a past employer or client"
level: I2
topic: security
stop_id: incident-response-basics
rubric:
  - point: "Clear STAR structure and own role"
    keywords: ["situation", "task", "action", "result", "my role"]
  - point: "Confirmed and contained before cleaning up"
    keywords: ["confirm", "contain", "isolate", "revoke", "rotate"]
  - point: "Communication and evidence"
    keywords: ["inform", "communicat", "evidence", "timeline"]
  - point: "Root cause fix and a new test or detection"
    keywords: ["root cause", "fix", "test", "detection", "rule"]
  - point: "Honest learning, blameless review"
    keywords: ["learn", "blameless", "mistake", "differently"]
answer_seconds: 120
example: "In my internship at a small Kochi software firm, a teammate pushed an API key for our email service to a public GitHub repo. I noticed an alert from GitHub's secret scanning, told my lead, and we revoked and rotated the key within the hour, then checked the provider's logs for misuse; there was none. Afterwards I added a pre-commit secret scanner and moved keys to the cloud's secret manager. I learned to rotate first and investigate second."
