id: why-vllm
question: "Why use vLLM to serve an open-weight model instead of a simple Hugging Face script?"
short_answer: "vLLM is built for high-throughput inference. PagedAttention manages the key-value cache in small blocks, so far less GPU memory is wasted and more requests fit at once, and continuous batching adds new requests to a running batch instead of waiting. It also offers an OpenAI-compatible server, quantisation support and tensor parallelism across GPUs."
deeper_answer: "A naive generate loop serves one request at a time and wastes memory on padding, so throughput collapses under load. vLLM keeps the GPU busy.\n\nBefore self-hosting, compare total cost with a hosted API: GPUs cost money even when idle, and you take on operations. Self-hosting makes sense for data residency, steady high volume, or customised models."
follow_ups:
  - "When is a hosted API cheaper than self-hosting?"
  - "What is the KV cache?"
common_mistakes:
