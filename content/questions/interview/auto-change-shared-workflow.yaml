answer_seconds: 150
example: "I would treat that workflow as a small product. Nobody would edit the live version. I keep a development copy with test credentials and make every change there. I have 20 saved test inputs with the expected output for each, and I run them before a release. Every release is a version: I export the workflow file to Git with a one-line change log, so I can roll back in five minutes. I also write down the contract: the fields it reads from the order sheet and the fields it writes to the ERP. If a change touches that contract, I tell the five teams a week before and give notice in their channel. I release on a quiet morning, never at month end, and I watch the first few runs. One named owner approves each release."
