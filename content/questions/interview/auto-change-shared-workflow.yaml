id: auto-change-shared-workflow
question: "Five teams depend on one of your workflows. How would you set up the way changes to it are made, so that an edit does not break their work?"
kind: use-case
short_answer: "No edits directly on the live version. I keep a copy for development, test changes with saved real inputs, and keep versions so I can roll back in minutes. I treat inputs and outputs as a contract: users are told before any field changes. Changes go out at a quiet time, with a short change log and a named owner."
deeper_answer: "In visual tools it is easy to open the live workflow, change one node and save. That is how shared workflows break at 4 pm on a month end. Once other teams depend on a workflow, it is a small product and needs light change control, in proportion to the risk.\n\nMy setup: a development copy and a production copy with separate credentials; a set of saved test inputs with expected outputs that I run before each release; and version history, through the tool or by exporting the workflow file to Git. I write down what the workflow promises: which fields it reads and writes, and when it runs. A change inside is my business; a change to that contract needs notice to the five teams and sometimes a period where old and new both work. After release I watch the first runs. Interviewers listen for rollback, a test set and communication."
follow_ups:
  - "How do you roll back if the new version causes a problem?"
  - "What counts as a breaking change for the teams that use it?"
  - "How do you keep the documentation up to date?"
common_mistakes:
  - "Editing the live workflow directly"
  - "No way to return to the last working version"
  - "Changing an output field without telling the users"
level: P2
topic: automation
stop_id: documentation-handover
