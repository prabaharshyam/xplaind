answer_seconds: 150
example: "I would clarify the role first: the assistant helps, and the recruiter makes every decision. For 50,000 applications a month, a pipeline will parse each resume into structured fields such as skills and years of experience. The hiring team writes explicit criteria for the job, and the model checks each criterion separately and shows the evidence, a quote from the resume, not one score. Before that step I remove the name, photo, age and address, which are protected or close to it, and I know that a proxy such as college name still remains. So I would audit: compare selection rates across each group on a test set, and test pairs of resumes that differ only in the name. The trade-off is that ranking saves the most time but hides low-ranked people, so I group candidates by criteria met and sample from every group. I log each assessment, and candidates can appeal to a person."
