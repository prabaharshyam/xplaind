answer_seconds: 180
example: "I will assume the query and the documents are already tokenised in the same way. First I precompute three things: the number of documents, the document frequency of each term, meaning how many documents contain it, and the average document length. Then for each document I loop over the query terms. For each term that appears, I take its term frequency and add idf times a saturating part: tf times k1 plus 1, divided by tf plus k1 times a length normalisation. The length normalisation is 1 minus b plus b times the document length over the average length. For idf I use the log of N minus df plus 0.5 over df plus 0.5, plus 1, which stays positive. The saturation means that repeating a word ten times does not give ten times the score. I would test it by hand on three tiny documents. A document without the term must score zero."
