id: code-bm25-scoring
question: "Given a tokenised query and a small list of tokenised documents, score each document with BM25, using k1 = 1.5 and b = 0.75. For example, with the documents cat sat mat, dog sat and cat cat ran far away, the query cat should score the third document highest (about 0.58), the first next (about 0.49) and the second 0."
kind: use-case
short_answer: "For each query term found in a document, add idf times a saturating term-frequency part: tf * (k1 + 1) / (tf + k1 * (1 - b + b * doc_len / avg_len)). Idf is log((N - df + 0.5) / (df + 0.5) + 1). Precompute document frequencies and lengths once. Cost is O(documents times query terms)."
deeper_answer: "Clarify first: the documents and the query are already tokenised the same way. The parameters are k1, usually 1.2 to 2.0, and b, usually 0.75.\n\nPrecompute three things: N, the number of documents; df[t], the number of documents that contain term t; and avg_len, the mean document length. For each document and each query term in it, with tf as the count of the term in that document, add idf * tf * (k1 + 1) / (tf + k1 * (1 - b + b * doc_len / avg_len)). The idf I use is log((N - df + 0.5) / (df + 0.5) + 1), which is never negative.\n\nThe tf part saturates: it can never be more than k1 + 1 times the idf, so repeating a word many times adds little. The b part normalises for length, so long documents are not favoured only for being long. Test with a hand calculation on three tiny documents. Interviewers watch for df counted as total occurrences, and for a negative idf on very common terms."
follow_ups:
  - "What do k1 and b control?"
  - "Why does BM25 often beat plain TF-IDF?"
  - "How does an inverted index make this fast?"
common_mistakes:
  - "Counting document frequency as total occurrences"
  - "Leaving out length normalisation"
  - "An idf that goes negative for very common terms"
level: I3
