id: ai-vendor-due-diligence
question: "Your company wants to buy an AI tool from a vendor. What do you check before approving it?"
kind: scenario
short_answer: "What data it receives and where it is stored and processed; whether the vendor trains on our data and how long it keeps it; security certifications and controls; which models and sub-processors it uses; how it was tested for accuracy and bias on uses like ours; logging and human oversight; and contract terms for breaches, audits and exit."
deeper_answer: "Buying AI moves risk to a vendor but not responsibility: if the tool harms a customer, your company answers for it. Due diligence checks the vendor's claims with evidence, such as a security report, a data processing agreement, test results and references.\n\nMatch the depth to the risk. A grammar tool used on public text needs a light review; a tool making decisions about customers or employees needs evidence of testing, bias checks and an easy way for a person to override it. Run a pilot on your own data before signing a large contract."
follow_ups:
  - "What would make you reject a vendor outright?"
  - "How would you test their accuracy claims yourself?"
common_mistakes:
  - "Accepting marketing claims without evidence"
  - "Forgetting what happens to your data when the contract ends"
level: P1
topic: governance
stop_id: ai-compliance
rubric:
  - point: "Checks data flows, storage location and retention"
    keywords: ["data", "stored", "retention", "location", "region"]
  - point: "Checks whether the vendor trains on your data"
    keywords: ["train", "training"]
  - point: "Asks for security evidence and sub-processors"
    keywords: ["security", "certification", "soc 2", "iso", "sub-processor"]
  - point: "Asks for accuracy and bias testing on similar uses"
    keywords: ["accuracy", "bias", "tested", "pilot"]
  - point: "Reviews contract terms for breaches, audit and exit"
    keywords: ["contract", "breach", "audit", "exit"]
answer_seconds: 90
example: "When our HR team wanted an AI interview-scoring tool, I sent the vendor a short questionnaire and asked for their security report and data processing agreement. They kept candidate videos for three years and used them to improve their model, which our policy did not allow. They offered a setting to turn training off and delete after 90 days. We then ran a pilot on 50 past interviews and compared scores with our panel's ratings across colleges and genders before approving it for shortlisting support only, never for rejection."
