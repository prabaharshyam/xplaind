id: project-do-differently
question: "Which project would you do differently if you started it again?"
kind: real-life
short_answer: "Name one real project and one or two specific things you would change, with the reason. Show what the first choice cost. Then say what you would do now, and how you have already used that lesson in later work. Also say what went well. Do not say you would change nothing."
deeper_answer: "The interviewer is checking self-awareness and growth. Someone who would change nothing has not thought about their work. Someone who would change everything did not understand it the first time.\n\nSituation: the project and its goal. Task: your part. Action: the choice you made then and what it cost. Result: what happened, and then the new part of this answer, what you would do today. A good line is: \"I spent three months on a complex model before I tried a simple baseline. Today I would build the baseline in the first week.\" Close with a recent case where you used the lesson. Choose a decision that was yours, not a decision by your manager or the client."
follow_ups:
  - "Why did you make that choice then?"
  - "Where have you used this lesson since?"
  - "What went well in that project?"
common_mistakes:
  - "Saying you would change nothing"
  - "Naming a decision that someone else made"
  - "Listing many regrets without one clear lesson"
level: I2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Names a real project and its goal"
    keywords: ["project", "goal", "built", "model"]
  - point: "States a specific choice that was their own"
    keywords: ["i went", "i chose", "i decided", "my choice", "i spent"]
  - point: "Shows what that choice cost"
    keywords: ["three months", "only one", "cost", "late", "it took"]
  - point: "Says what they would do now"
    keywords: ["i would", "started again", "first week", "baseline", "instead"]
  - point: "Shows the lesson already used"
    keywords: ["next project", "since then", "did exactly that", "now i"]
answer_seconds: 120
example: "I would redo a course recommendation project from my second year as a data scientist at an education company. The goal was to raise clicks on recommended courses. I went directly to a deep learning model, because it was interesting to me. It took three months, and it raised clicks by 4 percent. Later a teammate tested a simple rule: show the most popular courses in the learner's own subject. That alone gave 3 percent and took two days. So most of my three months gave only one extra percent. If I started again, I would build the simple baseline in the first week, talk to five learners, and add complexity only where the baseline fails. I did exactly that on my next project, a search ranking task, and we shipped the first version in three weeks."
