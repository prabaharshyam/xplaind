id: why-leaving-current-job
question: "Why are you leaving your current job?"
kind: real-life
short_answer: "Give one honest, forward-looking reason: the kind of work, growth or scope you want next and cannot get where you are. Say something fair about your current employer. Do not complain about your manager or company. Keep it under a minute, then connect the reason to this role."
deeper_answer: "The interviewer is checking for two risks: that you are leaving a problem you will bring with you, and that you will speak badly about them one day too. They also want to know if what you seek is something they can offer.\n\nUse three steps: what you gained in the current job, what is missing, and how this role gives it. For example: \"I have learned a lot in three years, but our projects end at the proof of concept stage. I want to own a model after launch, and this role includes that.\" If the real reason is hard, such as a layoff or a bad manager, state the fact in one neutral sentence and move to what you want next. Do not invent a reason."
follow_ups:
  - "Have you discussed this with your current manager?"
  - "What would make you stay where you are?"
  - "What if you face the same problem here?"
common_mistakes:
  - "Criticising the current manager or team"
  - "Saying only that you want more money"
  - "Giving a reason that does not match the role you applied for"
level: I2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
asked_often: true
rubric:
  - point: "Gives one clear, honest reason for leaving"
    keywords: ["reason", "because", "looking for", "want to", "i want"]
  - point: "Says something fair or positive about the current job"
    keywords: ["learned", "grateful", "good team", "gained", "thankful"]
  - point: "Names what is missing in the current job, without blaming people"
    keywords: ["missing", "limited", "do not get", "never", "cannot", "ends"]
  - point: "Connects the reason to what this role offers"
    keywords: ["this role", "your team", "here", "ownership", "production"]
answer_seconds: 90
example: "I have worked for three years as an ML engineer at a service company in Bengaluru, and I have learned a lot there. I have built models for four clients, in retail and insurance. But each project ends when we hand over the model. I never see how it performs after six months, and I do not get to fix it when the data changes. I want that long-term ownership now. Your team runs its own recommendation models for your own users, so the people who build a model also maintain it. That is the main reason I am here. I have no complaint about my current team, and I will complete my handover and notice period properly."
