id: human-approval
question: "When should an AI agent ask a human for approval before acting?"
kind: scenario
short_answer: "Before actions that are irreversible, costly, affect other people or touch sensitive data: sending messages or email, payments, deleting or changing records, deploying code, or sharing private information. Reading and drafting can usually be automatic; acting on the world should start gated and loosen only as measured reliability grows."
deeper_answer: "Think in terms of blast radius: what is the worst outcome if the agent is wrong or manipulated? Low-risk, reversible steps can run freely. High-risk steps need a confirmation that shows the person exactly what will happen.\n\nApproval should not be the only control: also limit permissions so the agent physically cannot do more than the task needs, and log every action. Too many approval prompts train people to click yes without reading, so gate the actions that truly matter."
follow_ups:
  - "How would you design the approval screen?"
  - "How do you decide when an action can move from gated to automatic?"
common_mistakes:
  - "Requiring approval for everything, which makes people stop reading"
  - "Relying on approval without limiting the agent's permissions"
level: I3
topic: agents
stop_id: agent-failures
rubric:
  - point: "Irreversible or costly actions need approval"
    keywords: ["irreversible", "costly", "cannot undo"]
  - point: "Examples: payments, emails, deleting records, deploying"
    keywords: ["payment", "email", "delete", "deploy", "money"]
  - point: "Sensitive data or other people affected"
    keywords: ["sensitive", "personal", "other people"]
  - point: "Loosen gates only as measured reliability grows"
    keywords: ["reliab", "measure", "loosen", "trust"]
answer_seconds: 60
example: "In an HR assistant, reading leave balances and drafting a leave request happen automatically. But approving leave, changing salary details or sending an email to the whole company always waits for a person. When we started, even sending a reply to one employee needed approval; after three months with very few corrections, we allowed it automatically for routine questions."
