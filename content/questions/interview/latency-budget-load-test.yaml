id: latency-budget-load-test
question: "How would you load test an LLM feature and set a latency budget?"
kind: use-case
short_answer: "Start from the user experience: for example, first token within one second and a full answer within six seconds at the 95th percentile. Break that budget into parts (retrieval, model, tools). Then simulate realistic traffic with a tool such as Locust or k6, ramping up concurrency, and measure time to first token, latency percentiles, errors and rate limits."
deeper_answer: "Use realistic prompts and output lengths, because latency scales with tokens. Test against provider rate limits and your own quotas, and watch for queueing in your service before the model is even called.\n\nReport percentiles, not averages: a 2-second average can hide 10-second tails that users feel. Re-run the test after model, prompt or infrastructure changes."
follow_ups:
  - "Why do percentiles matter more than averages?"
  - "What happens when you hit the provider's rate limit?"
common_mistakes:
  - "Testing with tiny prompts"
  - "Reporting averages only"
level: P2
topic: deployment
stop_id: latency-load-testing
rubric:
  - point: "Starts from user experience targets"
    keywords: ["user", "target", "budget", "first token"]
  - point: "Splits budget across steps"
    keywords: ["split", "retrieval", "model", "tools", "break"]
  - point: "Simulates realistic traffic with a load tool"
    keywords: ["locust", "k6", "load test", "concurren", "ramp"]
  - point: "Measures percentiles and errors"
    keywords: ["percentile", "p95", "p99", "error rate"]
  - point: "Checks rate limits and realistic token lengths"
    keywords: ["rate limit", "realistic", "token"]
answer_seconds: 90
example: "For a chat feature in an insurance app, we set the budget at first token under 1.5 seconds and full answer under 8 seconds at the 95th percentile, split into 300 ms for retrieval, under a second to first token, and the rest for generation. Using k6 we ramped from 10 to 200 concurrent users. At 120 users, the provider's rate limit kicked in and the 95th percentile doubled, so we requested a higher limit and added a queue with a friendly wait message."
