id: sr-lead-pm-no-to-ceo-refund-agent
question: "Your CEO wants an AI agent that approves refunds with no human check to go live in 6 weeks, before an investor meeting. In testing it makes a wrong decision on 8% of refunds. What do you say and do?"
kind: scenario
short_answer: "I would say no to the full version and offer a safer one that still meets the date. I would show what 8% means in money and complaints, then propose that the agent approves only small, clear refunds automatically and sends the rest to staff. I would agree the numbers that must be met before the limit is raised."
deeper_answer: "The CEO's real goal is a strong story for investors, not this exact design. So the answer is a no with a better option. Turn the error rate into terms a CEO feels: at 20,000 refunds a month, 8% is 1,600 wrong decisions, some paying out money wrongly and some refusing customers who are right. Then offer a version that can ship: automatic approval for refunds under ₹500 with clear evidence, and a drafted decision for staff on everything else.\n\nThis still gives a live product and a real number to show, such as the share of refunds handled without staff. Agree in writing what must be true before the limit rises, for example under 2% wrong decisions for four weeks. Interviewers listen for respect for the goal, a firm position on risk, numbers in place of opinion, and a clear statement of who makes the final decision."
follow_ups:
  - "The CEO says: launch anyway, I accept the risk. What now?"
  - "How did you choose ₹500 as the limit?"
  - "What would you show investors instead?"
common_mistakes:
  - "Saying no with no other option"
  - "Agreeing, then hoping the error rate improves in time"
  - "Arguing from opinion in place of numbers"
level: P3
topic: product
stop_id: choosing-ai-problem
rubric:
  - point: "Understands the CEO's real goal behind the request"
    keywords: ["goal", "investor", "needs from"]
  - point: "Turns the 8% error rate into money and customer impact"
    keywords: ["wrong decision", "money", "complaint"]
  - point: "Offers a limited version that can ship on time"
    keywords: ["refunds under", "small refund", "limit", "low risk"]
  - point: "Keeps staff on the risky cases"
    keywords: ["staff", "human", "person"]
  - point: "Agrees measurable conditions before expanding"
    keywords: ["condition", "raising the limit", "four weeks", "criteria"]
answer_seconds: 180
example: "I would first ask what the CEO needs from the investor meeting. Usually the goal is a live product and a strong number, not this exact design. Then I would show what 8% means: at 20,000 refunds a month, that is 1,600 wrong decisions, which is real money paid out wrongly and real complaints. So I would say no to full automation in 6 weeks, and offer this instead: the agent approves refunds under ₹500 with clear evidence, and for the rest it drafts a decision that staff review. That can launch on time. I would also write down the condition for raising the limit, for example under 2% wrong decisions for four weeks."
