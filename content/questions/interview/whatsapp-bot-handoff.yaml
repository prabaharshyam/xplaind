id: whatsapp-bot-handoff
question: "How would you design a WhatsApp assistant for a small business, and when should it hand over to a person?"
kind: use-case
short_answer: "Use the WhatsApp Business Platform through an approved provider, answer common questions from the business's own FAQ and catalogue with retrieval, and use templates for messages the business starts, as Meta requires. Hand over to a person when the customer asks, when the bot is unsure, for complaints, payments or anything sensitive, and tell the customer it is happening."
deeper_answer: "Keep the scope narrow at first: opening hours, prices, order status and booking. Store conversation history securely and follow the DPDP Act for personal data. Meta's rules require opt-in before sending business-initiated messages.\n\nMeasure resolution rate, handover rate and customer satisfaction, and read a sample of conversations every week to find gaps."
follow_ups:
  - "How would the bot know it is unsure?"
  - "What should never be automated in this bot?"
common_mistakes:
  - "No way to reach a human"
  - "Sending promotional messages without opt-in"
level: I2
topic: automation
stop_id: chat-assistants-whatsapp
rubric:
  - point: "Uses the WhatsApp Business Platform"
    keywords: ["whatsapp business", "platform", "api", "provider", "meta"]
  - point: "Answers from the business's own content"
    keywords: ["faq", "catalogue", "catalog", "retriev", "own content"]
  - point: "Templates and opt-in rules"
    keywords: ["template", "opt-in", "opt in", "consent"]
  - point: "Hands over on request, uncertainty, complaints or payments"
    keywords: ["hand over", "handover", "human", "complaint", "payment", "unsure"]
  - point: "Measures resolution and reviews conversations"
    keywords: ["measur", "resolution", "review", "satisfaction"]
answer_seconds: 90
example: "For a bakery taking cake orders on WhatsApp, the assistant answers prices, flavours and delivery areas from their menu sheet, and uses an approved template for order-ready messages. It hands over to the owner when a customer asks for a person, wants a custom design, complains, or when it is unsure, and it says 'I'm passing you to Anita, who will reply shortly.'"
