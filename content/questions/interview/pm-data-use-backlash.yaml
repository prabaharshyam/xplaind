id: pm-data-use-backlash
question: "Users learn from a social media post that their chats in your app are used to improve your AI feature, and many are angry. What do you do?"
kind: scenario
short_answer: "Get the facts within hours: what data is used, for what, by whom, and what users were told. Pause any use that lacks clear consent. With legal, check the notice and consent duties. Then explain plainly what happened, give users a visible control and a way to delete, and fix the default."
deeper_answer: "Anger usually comes from surprise, so the gap between what users were told and what happens is the centre of the problem. Check the facts before speaking: are chats used to train a model, only reviewed for evals, or sent to a vendor who trains on them? Each has a different answer. A statement that later proves wrong does more damage than a short delay.\n\nUnder India's DPDP Act, consent has to be specific and informed, and people can withdraw it, so a line hidden in long terms is not enough. The repair is practical: pause, say clearly what was done, offer a setting that users can see, honour deletion requests, and make data use a section in every future spec. Interviewers listen for facts first, a real pause, plain words, and a lasting product change, not only a press reply."
follow_ups:
  - "Would you make the setting opt-in or opt-out, and why?"
  - "What happens to models already improved with this data?"
  - "How would you rebuild trust over the next three months?"
common_mistakes:
  - "Replying that it was in the terms and conditions"
  - "Issuing a statement before checking the facts"
  - "Continuing the data use while the review goes on"
level: P1
topic: product
stop_id: ai-data-strategy
rubric:
  - point: "Establishes the facts: what data, what use, what users were told"
    keywords: ["facts", "what data", "notice told", "terms"]
  - point: "Pauses the data use where consent is unclear"
    keywords: ["pause", "halt", "stopped"]
  - point: "Works with legal on consent and notice duties"
    keywords: ["legal", "consent", "dpdp"]
  - point: "Communicates plainly and takes responsibility"
    keywords: ["plain message", "plainly", "apolog", "statement"]
  - point: "Gives users control and fixes the default"
    keywords: ["setting", "delete", "default", "opt-in", "opt out"]
answer_seconds: 130
example: "In the first hours I would get the facts: what data from chats we use, whether it trains a model or is only read for quality checks, and what our notice told users. If the consent is not clear, I would pause that use the same day. I would sit with legal to check our duties on consent under the DPDP Act. Then we send a plain message in the app: what we did, what we have stopped, and what changes now. The change must be real: a visible setting in the chat screen, an easy way to delete past chats, and the default set to off until a user agrees. After that, every spec gets a data use section."
