answer_seconds: 60
example: "Say a user asks a travel assistant, 'Is my flight on time?'. I have described a tool get_flight_status(flight_number). The model replies not with text but with a request: call get_flight_status with '6E 204'. My code calls the airline API, sends back 'delayed 40 minutes', and the model then writes the answer. The model only asks; my code decides whether to run it."
