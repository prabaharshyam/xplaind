id: how-tool-calling-works
question: "How does tool calling work?"
short_answer: "You describe tools to the model with a name, description and input schema. When a tool would help, the model replies with a structured request to call it with arguments. Your code runs the tool and sends the result back, and the model uses it to continue. The model never runs your code itself."
deeper_answer: "The loop: send the user message and tool definitions; if the response stops for tool use, parse the requested tool and arguments, validate them, run the function, and send a tool result message; repeat until the model answers in text. Some providers also run certain server-side tools, such as web search, for you.\n\nQuality depends heavily on tool design: clear names and descriptions, tight input schemas, and useful error messages returned as tool results. Validate arguments before acting, because the model can produce wrong or harmful ones, especially if its input was manipulated."
follow_ups:
  - "What should your code return when a tool call fails?"
  - "Why validate the arguments the model sends?"
common_mistakes:
  - "Saying the model executes the tool"
  - "Writing vague tool descriptions and blaming the model for wrong calls"
