    keywords: ["injection", "untrusted", "as data"]
answer_seconds: 180
example: "I would first classify the 200 tools by risk: read, reversible write and irreversible write. Each tool sits in a registry with a typed schema, an owner and a version, and an agent only sees the few tools that fit its task. Every call passes through a gateway that validates the arguments and checks permission in code, using a short-lived token scoped to the employee who asked. So the agent has least privilege and can never do more than that user. Irreversible actions, such as a payment or a deployment, wait for human approval with a preview. Code runs in a sandbox, each task has a budget and a rate limit, and every call goes to an audit log. Tool results are treated as untrusted data, because a ticket can contain a prompt injection. The trade-off is speed against safety, so approval depends on risk level."
