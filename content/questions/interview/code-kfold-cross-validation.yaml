id: code-kfold-cross-validation
question: "Implement k-fold cross-validation without a library: return the train and validation indices for each fold. For example, 10 rows and k = 3 should give validation folds of sizes 4, 3 and 3, and every row should be in a validation fold exactly once."
kind: use-case
short_answer: "Shuffle the row indices once with a seed and cut them into k nearly equal folds with np.array_split. For fold i, validation is fold i and training is every other fold joined. Train and score k times and report the mean and spread. Building the folds is O(n); the real cost is k model fits."
deeper_answer: "Clarify first: how many rows, what k, and should the rows be shuffled? Shuffling is right for independent rows, but wrong for time series, where each fold must train on the past only. Ask about groups too, such as many rows from one customer, which must stay in one fold.\n\nThe steps: idx = rng.permutation(n), then folds = np.array_split(idx, k), which handles n not divisible by k by making the first folds one row larger. For fold i, the validation indices are folds[i] and the training indices are the other folds joined with np.concatenate. Fit a new model on the training part each time, score it on the validation part, and report the mean and standard deviation of the k scores.\n\nTest that the validation folds do not overlap and that together they cover every row once. Interviewers watch for leakage: fitting a scaler or selecting features on all rows before the loop. Every step that learns from data must be fitted inside the loop on the training part only."
follow_ups:
  - "How would you change this for time series data?"
  - "How do you keep all rows from one customer in the same fold?"
  - "How do you choose k?"
common_mistakes:
  - "Fitting a scaler on all rows before the loop"
  - "Shuffling time-ordered data"
  - "Losing rows when n is not divisible by k"
level: I2
topic: coding
stop_id: cross-validation-leakage
rubric:
  - point: "Shuffles once and splits the indices into k nearly equal folds"
    keywords: ["shuffle", "k folds", "nearly equal"]
  - point: "Each fold is the validation set once; the rest is training"
    keywords: ["validation", "the other folds", "training"]
  - point: "Fits a fresh model per fold and reports mean and spread"
    keywords: ["fresh model", "mean", "standard deviation"]
  - point: "Avoids leakage: preprocessing is fitted inside the loop"
    keywords: ["leakage", "inside the loop", "training part only"]
  - point: "Knows when not to shuffle"
    keywords: ["time series", "independent"]
answer_seconds: 150
example: "I would first ask whether the rows are independent, because for time series I must not shuffle. Assuming they are independent, I shuffle the indices once with a seed, and split them into k folds of nearly equal size. With 10 rows and 3 folds that gives sizes 4, 3 and 3. Then I loop: fold i is the validation set, and all the other folds joined together are the training set. I fit a fresh model on the training part, score it on the validation part, and at the end I report the mean and the standard deviation of the k scores. The main mistake to avoid is leakage. Any scaler or feature selection must be fitted inside the loop, on the training part only. I would test that every row is in a validation fold exactly once. The cost is k model fits."
