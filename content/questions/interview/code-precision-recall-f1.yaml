answer_seconds: 120
example: "I would first confirm that both lists have the same length, and that 1 is the positive class. Then I make one pass and keep three counts. True positives are pairs where the label and the prediction are both 1. False positives are predicted 1 but really 0. False negatives are really 1 but predicted 0. Precision is true positives over everything I predicted positive. Recall is true positives over everything that is really positive. F1 is the harmonic mean, so 2 * p * r / (p + r). I guard each division, because if the model predicts no positives the denominator is zero, and I return 0 there. It is one pass, so linear time. On the example I get 2 true positives, 1 false positive and 1 false negative, so all three numbers are two thirds."
