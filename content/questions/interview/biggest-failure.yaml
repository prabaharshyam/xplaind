id: biggest-failure
question: "Tell me about your biggest failure."
kind: real-life
short_answer: "Choose a real failure with a real cost, not a small one made to look good. Say plainly what went wrong and what your part was. Spend most of the time on what you did next: how you fixed it, what you told people, and what you changed so it does not happen again."
deeper_answer: "The interviewer is checking honesty and learning. Everyone fails. They want to see if you can look at your own failure clearly, without blaming others and without hiding it.\n\nKeep the situation short. State the failure in one clear sentence and own it: \"I did not check for data leakage, and that was my job.\" Then give the action: how you found the cause, who you told, and how you repaired the damage. End with the result and the habit you built from it. Choose a failure that is in the past and that you have fixed. Do not pick a weakness that is central to the job you are applying for and still unsolved."
follow_ups:
  - "How did the people affected react when you told them?"
  - "What do you do differently today because of it?"
  - "How do you know the same thing will not happen again?"
common_mistakes:
  - "Choosing a success and calling it a failure"
  - "Blaming the team, the data or the deadline"
  - "Stopping at the failure without the fix and the lesson"
level: I2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Names a real failure with a real cost"
    keywords: ["failure", "failed", "mistake", "cost", "lakh", "went wrong"]
  - point: "Owns their part without blaming others"
    keywords: ["my mistake", "my failure", "my fault", "i had skipped", "i did not"]
  - point: "Told the people affected honestly"
    keywords: ["told", "informed", "manager", "same day"]
  - point: "Explains the fix"
    keywords: ["rebuilt", "fixed", "corrected", "trial"]
  - point: "Says what changed in how they work"
    keywords: ["now every", "learned", "since then", "leakage check", "habit"]
answer_seconds: 150
example: "Two years ago I built a customer churn model for a subscription company in Bengaluru. In testing it scored 92 percent, and I was proud of it. The retention team used it to send offers worth about 4 lakh rupees. After six weeks, churn had not changed. I checked and found my mistake: one feature used data recorded after the customer had already left, so the test score was false. That was my failure, because I had skipped a time-based split to save a week. I told my manager and the retention head the same day, with the real number, 71 percent. I rebuilt the model with a correct split and ran a small trial first. Churn in the trial group fell by 9 percent. Now every model I build gets a leakage check before anyone sees a result."
