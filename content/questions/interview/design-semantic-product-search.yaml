id: design-semantic-product-search
question: "Design semantic search for an online store with 10 million products. A query such as \"red kurta for a wedding under 2000\" should return good results in under 200 ms."
kind: use-case
short_answer: "Clarify the metric, latency and query types. Parse the query into filters such as price and colour plus plain text. Run hybrid search, keyword and vector together, with metadata filters, then rerank the top results with relevance and business signals. Keep the index fresh for price and stock, evaluate offline with labelled queries, then A/B test."
deeper_answer: "Requirements: what success means (clicks, add to cart, purchases), the latency target, languages and spelling variety, and how fast price and stock change. Exact queries such as a model number must still work, so keyword search stays.\n\nDesign: at index time, embed each product's title, description and attributes, and store structured fields such as price, colour, category and stock. At query time, extract filters: \"under 2000\" becomes a price filter and \"red\" a colour. Then run keyword search and approximate nearest-neighbour vector search, merge the two lists, and apply the filters. A reranker scores the top 100 or so with query relevance plus signals such as popularity, rating and availability.\n\nTrade-offs: a cross-encoder reranker improves relevance but costs latency, so rerank a small set and keep a strict time budget. A language model call per query is too slow and costly at this scale, so use it offline or only for rare queries. Filtered vector search can slow down or lose recall with very selective filters. Measure NDCG and recall on labelled queries, then confirm with an A/B test on conversion. Watch queries with zero results."
follow_ups:
  - "Why not use only vector search?"
  - "How do you keep price and stock correct in the index?"
  - "How would you handle a query typed in Hinglish?"
common_mistakes:
  - "Dropping keyword search and failing exact product codes"
  - "Treating price and colour as text instead of filters"
  - "Calling a large model on every query"
level: P1
topic: system-design
