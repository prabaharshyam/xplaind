answer_seconds: 150
example: "I would clarify the metric, which I take as purchases per search, and the latency target of 200 ms. For the kurta query, a small parser turns \"under 2000\" into a price filter and \"red\" into a colour attribute, and the rest stays as text. Then I run hybrid search: keyword search for exact words and product codes, and vector search on product embeddings for meaning such as \"wedding\". I merge both lists, apply the filters, and rerank the top 100 with relevance, popularity and stock signals. The trade-off is that a stronger reranker adds latency, so I rerank only a small set and do not call a large model per query. Price and stock update in the index within minutes. I would measure NDCG offline on 1,000 labelled queries, then run an A/B test on conversion, and watch zero-result queries."
