id: evaluate-llm-app
question: "How would you evaluate an LLM application?"
short_answer: "Build a test set of realistic inputs with what a good answer needs. Check what you can with code (format, required facts, forbidden content), use human or model review for subjective quality, and track scores for every change. In production, add user feedback and monitoring, and turn failures into new test cases."
deeper_answer: "A layered approach, as Hamel Husain describes: level 1 is fast unit-test style assertions run on every change; level 2 is human and model-based review of samples, with the judge checked against human labels; level 3 is A/B testing with real users for product-level impact.\n\nStart by looking at real outputs and writing down how they fail, then design checks for those failures. Keep the eval set versioned, add cases from production bugs, and report results by category, so a gain in one area does not hide a loss in another."
follow_ups:
  - "Where do your first test cases come from?"
  - "How do you evaluate subjective quality such as tone?"
common_mistakes:
  - "Relying on vibe checks of a few examples"
  - "Using only generic benchmarks instead of task-specific tests"
