id: agent-x-undo-over-approval
question: "How would you design an agent's actions so that most mistakes can be undone, instead of asking a person to approve every step?"
kind: use-case
short_answer: "Sort every action by how reversible it is. Make as many as possible reversible by design: drafts, not sends; soft delete; changes on a branch or staging copy; a dry-run preview; a short delay window before sending. Record enough to roll back. Keep human approval for the few actions that cannot be undone, such as payments and external messages."
deeper_answer: "Approval on every step is slow and wears out the reviewer. The better question is: if this action is wrong, what does it cost to undo? Reading costs nothing. Editing a document with version history is cheap to undo. Sending an email to a customer or moving money cannot be taken back.\n\nSo I would design the tools to push actions towards the cheap side. The agent writes to a draft or a staging table, and a separate publish step makes it live. Deletes become a flag with a retention period. Bulk changes run first as a dry run that reports what would change. Each action is logged with the earlier value, so a rollback is one command. For actions with no undo, use a compensating action where one exists, such as a refund reversal, or else an approval that shows the exact effect. Interviewers listen for tiers of reversibility, undo built into the tools, and approval kept for what truly needs it."
follow_ups:
  - "Give an example of an action that looks reversible but is not."
  - "How long would you keep the data needed for a rollback?"
  - "How would you decide when an approval step can be removed?"
common_mistakes:
  - "Asking for approval on every action, including reads"
  - "Calling an action reversible without testing the rollback"
  - "Forgetting that messages to other people cannot be recalled"
level: P1
topic: agents
stop_id: human-approval
rubric:
  - point: "Classifies actions by how reversible they are"
    keywords: ["reversib", "undo", "tier", "classif", "sort"]
  - point: "Uses drafts, staging or a branch so changes are not live at once"
    keywords: ["draft", "staging", "branch", "publish"]
  - point: "Uses soft delete, dry run or a delay window"
    keywords: ["soft delete", "dry run", "delay", "preview", "window"]
  - point: "Logs earlier values so a rollback is possible"
    keywords: ["rollback", "roll back", "earlier value", "old value", "version"]
  - point: "Keeps approval for actions that cannot be undone"
    keywords: ["approval", "approve", "cannot be undone", "irreversible", "payment"]
answer_seconds: 120
example: "I would sort each action by how reversible it is, then build undo into the tools. Take an agent that manages a product catalogue for an online store. Price changes go to a staging table as a draft, and a publish step makes them live. Removing a product is a soft delete: it is hidden, and kept for 30 days. A bulk edit first runs as a dry run and reports that 412 rows would change. Every write logs the old value, so a rollback of the last run is one command. With this in place, the agent can work without a prompt on each step. I would keep approval for the few actions that cannot be undone, such as an SMS to customers or a payment to a supplier, and show the exact message or amount."
