answer_seconds: 180
example: "I would ask whether the window is sliding or fixed, and whether this runs on one server. I will assume a sliding window in one process. For each user I keep a deque of timestamps of allowed requests. When a request comes in, I first pop from the left while now - q[0] >= window, which removes old timestamps. Then, if len(q) is already at the limit, I reject. Otherwise I append now and allow. Each timestamp is added once and removed once, so the cost is amortised constant time, O(1), and memory is at most the limit per user. I pass the time in as an argument so the test does not sleep. With limit 3 and window 60, calls at 0, 10 and 20 pass, 30 is rejected, and exactly 60 passes because the first call has expired."
