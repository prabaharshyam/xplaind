id: llm-provider-outage
question: "Your model provider has an outage during peak hours. What should already be in place?"
kind: scenario
short_answer: "A gateway or client layer with timeouts and retries, a fallback to a second model or provider that has been tested on our eval set, graceful degradation such as cached answers or a clear 'try again' message, monitoring that alerts on error rates, and a runbook saying who decides to switch and how we tell users."
deeper_answer: "Outages are a matter of when, not if. The response should be designed in advance, because choosing a backup model in the middle of an incident leads to surprises in quality or format.\n\nA gateway makes switching a configuration change rather than a code change. The fallback model must be evaluated on the same tests so you know its quality, and prompts may need small adjustments. For some features, degrading gracefully is better than switching, for example showing search results without an AI summary. After the incident, review what happened and update the runbook."
follow_ups:
  - "How would you test the fallback before you need it?"
  - "Which features would you degrade rather than switch?"
common_mistakes:
  - "Having a fallback model that was never tested"
  - "No alert until users complain"
level: P1
topic: deployment
stop_id: llm-gateways
rubric:
  - point: "Uses timeouts and retries"
    keywords: ["timeout", "retry"]
  - point: "Has a tested fallback model or provider"
    keywords: ["fallback", "second provider", "backup", "tested"]
  - point: "Plans graceful degradation"
    keywords: ["degrade", "cached", "message", "graceful"]
  - point: "Monitors and alerts on errors"
    keywords: ["monitor", "alert", "error rate"]
  - point: "Has a runbook and owner for the decision"
    keywords: ["runbook", "owner", "decide", "incident"]
answer_seconds: 90
example: "We ran a support assistant through LiteLLM with our main provider and a second one as backup. Every week our eval suite also ran against the backup, so we knew it scored a little lower but acceptably. When the main provider had an hour-long incident at 7 p.m., the gateway's error-rate alert fired, the on-call engineer followed the runbook, and traffic moved in a few minutes. The ticket-summary feature, which was less important, simply showed 'summary unavailable' instead."
