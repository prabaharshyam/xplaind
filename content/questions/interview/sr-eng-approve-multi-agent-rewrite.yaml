answer_seconds: 165
example: "I would not approve three months on a diagram. I would ask the team to take 100 failed runs from the 18% and label the cause of each failure. If most are missing documents or unclear tool descriptions, six agents will not fix that. They will add hand-offs where context gets lost, several times the token cost, and traces that are hard to debug. Multiple agents help when work can run in parallel or one context window is too small. So if, say, 30 failures come from long claim files filling the context, I would approve one sub-agent that reads and summarises documents, as a two-week experiment. We compare it with the current agent on the same eval set, with success rate, cost and time per claim. A rewrite needs that evidence first."
