id: sr-eng-approve-multi-agent-rewrite
question: "Your single-agent claims assistant completes 82% of tasks correctly, and the team proposes a three-month rewrite into six specialised agents to reach 95%. Do you approve it?"
kind: scenario
short_answer: "Not on the proposal alone. I would ask for a failure analysis of the 18% first. If failures come from missing tools, weak context or unclear instructions, more agents will not help and will add cost. I would approve a multi-agent design only for a proven bottleneck, tested on one sub-task against the same eval set."
deeper_answer: "Multi-agent systems are attractive in a design diagram and expensive in production. Each hand-off between agents can lose context, runs use several times more tokens, and debugging means reading traces across six conversations. They help in specific cases: sub-tasks that can run in parallel, work that overflows one context window, or steps that need different permissions.\n\nSo the decision follows from evidence. Take 100 failed runs and label them. If 60 fail because the policy document was not retrieved, fix retrieval. If many fail because long claims fill the context and early details are forgotten, a sub-agent that summarises documents is a targeted change, not a rewrite. Compare variants on the same eval set, including cost and latency per task. A lead also protects the team from a three-month project with no intermediate results by asking for a two-week experiment. Interviewers listen for failure analysis, known multi-agent costs, and incremental change."
follow_ups:
  - "In which situations do several agents really beat one?"
  - "How would you label 100 failed runs so that the result is trusted?"
  - "The team is excited about the rewrite. How do you say no without losing their energy?"
common_mistakes:
  - "Approving a rewrite without analysing the failures"
  - "Assuming more agents means higher accuracy"
  - "Comparing designs on different test sets"
level: P2
topic: agents
