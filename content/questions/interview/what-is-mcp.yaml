example: "Before MCP, connecting an assistant to our Jira, Google Drive and database meant writing three custom integrations for every AI app we used. With MCP, I write one Jira MCP server that exposes tools like search_issues and create_issue, and any MCP client, such as a desktop chat app or a coding IDE, can use it. It is like a standard plug for AI tools."
