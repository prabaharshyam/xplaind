id: what-is-mcp
question: "What is the Model Context Protocol, and why does it matter?"
short_answer: "MCP is an open protocol, introduced by Anthropic in 2024, that standardises how AI applications connect to tools and data. An MCP server exposes tools, resources and prompts; an MCP client inside an app such as an IDE or chat assistant connects to it. Build an integration once as a server, and any MCP-compatible app can use it."
deeper_answer: "Before MCP, every app needed custom code for every integration. MCP plays a role similar to a common port: servers for GitHub, databases or internal systems work across clients. Servers run locally over standard input and output or remotely over HTTP.\n\nSecurity still matters: an MCP server can give a model real power, so use authentication, least-privilege scopes, and approval for risky tools, and only install servers you trust, because tool descriptions and results can carry prompt injection."
