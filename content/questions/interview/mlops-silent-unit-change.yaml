    keywords: ["validat", "range", "distribution", "median", "schema"]
  - point: "Makes validation a gate that stops the pipeline or falls back safely"
    keywords: ["gate", "stop", "fail closed", "fall back", "last good"]
  - point: "Agrees a data contract with the upstream team for schema and units"
    keywords: ["contract", "upstream", "units", "announce"]
  - point: "Monitors input and prediction drift with alerts"
    keywords: ["alert", "drift", "approval rate", "monitor", "prediction"]
answer_seconds: 130
example: "First I would contain it. I would pause automatic decisions and send new cases to manual review, then pull the affected applications from those two days and re-score them with correct amounts. Then the prevention. The type did not change, so a schema check alone would have passed. I would add validation on ranges and on the distribution. For example, the median transaction amount must stay within a band around last week's value. A hundredfold jump would fail that at once. The check is a gate: if it fails, the batch job will stop and keep the last good features. With the upstream payments team I would agree a data contract that names each column and its units, with changes announced in advance. I would also add an alert on the daily approval rate, because it moved on day one."
