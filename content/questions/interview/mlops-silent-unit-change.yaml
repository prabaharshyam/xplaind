id: mlops-silent-unit-change
question: "An upstream team changed the amount column from rupees to paise, nothing crashed, and your credit model made bad decisions for two days. What do you put in place?"
kind: scenario
short_answer: "First stop the damage: roll back or pause decisions, and find and review the affected cases. Then add data validation as a gate in the pipeline, covering schema, ranges and distribution against a reference, for both training and serving inputs. Agree a data contract with the upstream team, alert on input and prediction drift, and fail closed when checks fail."
deeper_answer: "The type did not change, so no code broke, but every value became 100 times larger. A model accepts any number, so the only defence is checks that know what normal data looks like. I would add them at two points: when data lands from the upstream source, and just before features reach the model.\n\nThe checks have layers. Schema: column names, types and nulls. Rules: amount between known limits. Statistics: the median and quantiles compared with last week, with an alert on a big shift. A hundredfold jump in the median is easy to catch. On failure, a batch pipeline should stop and keep the last good data. An online service should fall back to a safe path, such as manual review. The organisational fix is a data contract: the upstream team owns a declared schema and units, and changes are announced and versioned. I would also monitor predictions, since approval rates moved at once. Interviewers listen for a gate, not just a dashboard."
follow_ups:
  - "How would you set thresholds so the checks do not alert every day?"
  - "What should an online service do when validation fails for one request?"
  - "How do you find and correct the decisions made in those two days?"
common_mistakes:
  - "Checking only schema and types, which did not change here"
  - "Adding a dashboard that nobody watches, with no gate"
  - "Fixing the pipeline and forgetting the affected customers"
level: P1
topic: deployment
stop_id: monitoring-drift
rubric:
