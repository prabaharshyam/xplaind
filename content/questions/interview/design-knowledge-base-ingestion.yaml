    keywords: ["quality", "confidence", "labelled", "recall", "review"]
answer_seconds: 120
example: "I would clarify the mix of file types and look at a sample of each before choosing tools. Each of the 500,000 files becomes a job on a queue. A detector checks whether a PDF has a text layer. Digital PDFs go to text extraction, a scan goes to OCR with a confidence score per page, and web pages lose their menus and footers. I keep every table as a table, with the header repeated on each part, because flattened text loses its meaning. All output goes into one format with headings and page numbers. Then I chunk along the heading structure, add metadata such as title, date and source link, remove any duplicate, embed and index. The trade-off is that a vision model reads hard pages better than OCR but costs more, so I use it only for low-confidence pages. Failed jobs get a retry. I would check quality on 200 labelled pages."
