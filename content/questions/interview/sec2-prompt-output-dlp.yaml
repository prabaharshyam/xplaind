id: sec2-prompt-output-dlp
question: "Staff paste code, contracts and customer lists into your company's approved internal AI assistant. How would you set up data loss prevention for what they send in and for what the model sends back?"
kind: use-case
short_answer: "Put a gateway between staff and the model. On input, detect secrets and personal data such as API keys, card and Aadhaar numbers, then block, mask or warn by data class. On output, scan for the same patterns and for data the user should not see. Protect the logs, and tune the rules so staff keep using the tool."
deeper_answer: "Data leaves through the prompt and can come back through the answer, so DLP sits on both sides. A central gateway gives one place to apply policy and to log. Detection mixes methods: patterns for structured items such as PAN numbers, with checksums where a number format has one, as card numbers do, secret scanners for keys and tokens, and classifiers for unstructured confidential text, which is harder.\n\nThe action depends on the class of data. A leaked API key should be blocked. A customer's phone number could be replaced with a token and put back after the model replies. Output scanning matters most when the assistant is connected to internal search, because it can surface a document the user has no right to see. That is first an access control problem, with DLP as the second layer. The prompt logs are sensitive too and need masking and retention limits. Too many false blocks push staff towards unapproved tools. Interviewers listen for both directions, graded actions and usability."
follow_ups:
  - "How would you detect confidential text that matches no pattern?"
  - "What do you do with the prompt logs?"
  - "How would you measure the false positive rate of the DLP rules?"
common_mistakes:
  - "Scanning only prompts and ignoring outputs"
  - "Blocking so much that staff move to unapproved tools"
  - "Storing full prompts with personal data in open logs"
level: P1
topic: security
stop_id: guardrails
rubric:
  - point: "Places a central gateway or proxy where policy is applied and logged"
    keywords: ["gateway", "proxy", "central", "one place"]
  - point: "Scans input for secrets and personal data using patterns and classifiers"
    keywords: ["pattern", "secret", "pan", "aadhaar", "classif", "api key"]
  - point: "Grades the action by data class: block, mask or warn"
    keywords: ["block", "mask", "warn", "token", "redact"]
  - point: "Scans output and relies on access control for connected data"
    keywords: ["output", "access control", "response", "permission"]
  - point: "Protects logs and tunes false positives so staff keep using the tool"
    keywords: ["log", "false positive", "retention", "tune", "unapproved"]
answer_seconds: 140
example: "I would route all traffic through a gateway, so there is one place for policy. On the way in, it scans each prompt. A pattern check finds PAN and Aadhaar numbers, a checksum confirms card numbers, and a secret scanner finds an API key or password. The action depends on the data. I block secrets outright. I mask customer identifiers with a placeholder and restore them in the reply. For softer matches, I warn the user and say why. On the way out, I scan the output for the same patterns. But for anything the assistant retrieves from our own documents, access control comes first: it should only search what that user has permission to read. The prompt logs are masked and have a retention limit of 30 days. I would review the false positive rate every week, because if we block too much, people go back to unapproved tools."
