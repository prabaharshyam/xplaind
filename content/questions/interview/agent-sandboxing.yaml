id: agent-sandboxing
question: "How do you limit what an agent can do?"
kind: use-case
short_answer: "Give it the least privilege it needs: scoped credentials per tool, read-only access by default, allow-lists for commands, domains and file paths, and separate credentials per user rather than one admin key. Run code and browsing in a sandbox such as a container with no secrets and limited network. Gate irreversible actions with human approval and log everything."
deeper_answer: "The OWASP Top 10 for LLM applications calls the risk 'excessive agency': too much functionality, permission or autonomy. Prompt injection turns that into a real attack, because any document or web page the agent reads could try to steer it.\n\nSo assume the model can be tricked, and make the damage small: no tool should be able to do more than the user could do themselves, and destructive operations should be impossible without a person."
follow_ups:
  - "Why should an agent use the user's permissions rather than a service account?"
  - "What would you put in a sandbox for a coding agent?"
common_mistakes:
  - "One powerful API key for everything"
  - "Relying on the system prompt for safety"
level: P1
topic: governance
stop_id: agent-permissions-sandboxing
rubric:
  - point: "Least privilege and scoped credentials"
    keywords: ["least privilege", "scoped", "minimal", "per user"]
  - point: "Read-only by default; allow-lists"
    keywords: ["read-only", "read only", "allow-list", "allowlist", "whitelist"]
  - point: "Sandbox for code or browsing"
    keywords: ["sandbox", "container", "isolat"]
  - point: "Human approval for irreversible actions"
    keywords: ["approval", "human", "irreversible"]
  - point: "Assumes injection; logs everything"
    keywords: ["injection", "excessive agency", "log", "audit"]
answer_seconds: 90
example: "When I gave a coding agent access to our repo, it ran in a container with no cloud credentials, a read-only mount of the main branch, network access only to the package registry, and a separate GitHub token that could open pull requests but not merge. Commands were limited to tests and linters. A person reviewed every pull request it opened."
