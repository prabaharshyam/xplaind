id: mlops-model-service-page
question: "You are on call, and at 2 am an alert says the p99 latency of the recommendation model service has gone from 80 ms to 2 seconds. Walk me through what you do."
kind: scenario
short_answer: "Mitigate first, diagnose second. I check user impact and look for a recent change: a deploy, a new model version, a config change or a traffic spike. If something changed, I roll it back. If not, I check resource saturation and dependencies such as the feature store. If needed I fall back to a simpler response. The postmortem comes later."
deeper_answer: "At 2 am the goal is to restore service, not to find the perfect cause. Confirm that the alert is real and how wide it is: all users or one region, errors or only slow responses. Then look at what changed in the last few hours, because most incidents follow a change. A model service has extra suspects: a new model version that is larger or not warmed up, a feature store lookup that became slow, GPU or memory saturation, a batch job sharing the node, or autoscaling that did not start.\n\nRollback is the first tool, and it must already be one command. If nothing changed on our side, I check dependencies and saturation and add capacity. A good service also has a degraded mode, such as cached or popular-item recommendations, so users get something. I would post short updates to the incident channel, and hold a blameless review afterwards. Interviewers listen for mitigation first, structure and communication."
follow_ups:
  - "What would be different if the service were healthy but recommendation quality had dropped?"
  - "What would you put in the runbook for this service?"
  - "How do you decide whether to wake up someone else?"
common_mistakes:
  - "Debugging the root cause for an hour while users are affected"
  - "Having no fast rollback or fallback path"
  - "Skipping the review after the incident is over"
level: P1
topic: deployment
