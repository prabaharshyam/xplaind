answer_seconds: 140
example: "My first job is to restore service, not to find the root cause. I acknowledge the page and check the impact: is it all users or one region, and are requests failing or only slow? Then I ask what changed. I look at the deploy log for the last six hours. In a real case I had, a new model version had gone live at midnight. It was twice the size and memory was saturated. So I rolled back to the earlier version with one command, and latency recovered in five minutes. If there had been no recent change, I would check the feature store latency and the node's CPU and memory, and switch to the fallback of cached popular items. I posted an update in the incident channel every 15 minutes. The next day we held a blameless review and added a load test to the release pipeline."
