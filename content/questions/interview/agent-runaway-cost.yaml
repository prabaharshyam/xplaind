id: agent-runaway-cost
question: "Your agent ran overnight and ran up a large API bill. What probably happened, and what do you change?"
kind: scenario
short_answer: "Most likely it got stuck in a loop: retrying a failing tool, re-planning, or calling itself with ever-growing context. I would read the trace to find the loop, then add hard limits: maximum steps and spend per run, a daily budget with alerts, detection of repeated identical calls, and a kill switch. Then add a test that reproduces it."
deeper_answer: "Agents fail expensively because each step adds tokens, and a loop multiplies them. Common causes are a tool that keeps returning an error the agent tries to fix by calling it again, a goal it cannot reach so it never decides it is done, or memory that keeps the whole history so each call is larger than the last.\n\nThe fix is layered. Per-run caps on steps, tokens and money stop one task; a budget at the account or gateway level stops many; alerts tell a person early. Logging every step with its cost lets you find the cause, and a regression test keeps it from coming back."
follow_ups:
  - "How would you set the step and spend limits?"
  - "What should the agent do when it hits a limit?"
common_mistakes:
  - "Only raising the provider's spending cap"
  - "Fixing the one bug without adding limits"
level: P1
topic: agents
stop_id: agent-budgets-kill-switches
rubric:
  - point: "Names likely causes such as loops, retries or growing context"
    keywords: ["loop", "retry", "context", "stuck"]
  - point: "Reads the trace or logs to find the cause"
    keywords: ["trace", "log", "step"]
  - point: "Adds per-run step and spend limits"
    keywords: ["step limit", "max steps", "budget", "spend", "limit"]
  - point: "Adds alerts and a kill switch"
    keywords: ["alert", "kill switch", "stop"]
  - point: "Adds a test so it does not return"
    keywords: ["test", "regression", "reproduce"]
answer_seconds: 90
example: "On a research agent I built, a search tool started returning a timeout for one website. The agent kept rewording the query and trying again, about four hundred times in a night, with the whole conversation sent each time. The trace showed the same tool call repeating. I added a cap of 25 steps and a rupee limit per task, a check that stops after three identical failing calls, and an alert at half the daily budget. I also saved that run as a test case."
