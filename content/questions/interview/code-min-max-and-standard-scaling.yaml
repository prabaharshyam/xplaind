id: code-min-max-and-standard-scaling
question: "Write min-max scaling and standard scaling for a feature matrix, and show how to apply them to train and test data without leakage. For example, a training column 1, 2, 3 and a test value 4 gives a min-max test value of 1.5, because the minimum and range come from training only."
kind: use-case
short_answer: "Min-max scaling is (x - min) / (max - min); standard scaling is (x - mean) / std, both per column. Compute the statistics on the training rows only, store them, and reuse them to transform validation, test and live data. Guard against a zero range or zero std. Cost is O(n d)."
deeper_answer: "Clarify first: X is n by d and the statistics are per column, so use axis=0. Ask whether there are missing values or constant columns, and which model will use the features. Tree models do not need scaling; distance-based and gradient-based models do.\n\nWrite two steps, fit and transform. Fit stores mn = X_train.min(axis=0) and mx = X_train.max(axis=0), or mu = X_train.mean(axis=0) and sd = X_train.std(axis=0). Transform applies (X - mn) / (mx - mn) or (X - mu) / sd to any data. A constant column makes the denominator zero, so replace a zero denominator with 1 and the column becomes all zeros.\n\nLeakage is the point of the question. If you fit on all rows, the test rows shape the mean and the range, and the test score looks better than it should. In cross-validation, fit the scaler inside each fold. Test values can fall outside 0 to 1 after min-max scaling, and that is correct. Interviewers watch for fitting on the full dataset, and for fitting a second scaler on the test set."
follow_ups:
  - "Which models need scaling and which do not?"
  - "How do outliers affect each of the two scalers?"
  - "Where does the scaler go when you use cross-validation?"
common_mistakes:
  - "Fitting the scaler on train and test together"
  - "Fitting a second scaler on the test set"
  - "Dividing by zero on a constant column"
level: I2
topic: coding
stop_id: ml-feature-engineering
rubric:
  - point: "Min-max: subtract the minimum, divide by the range"
    keywords: ["minimum", "range", "min-max"]
  - point: "Standard: subtract the mean, divide by the standard deviation"
    keywords: ["mean", "standard deviation"]
  - point: "Separates fit from transform and stores the statistics"
    keywords: ["fit and transform", "stores", "stored"]
  - point: "Fits on training data only, to avoid leakage"
    keywords: ["training set only", "leakage", "leaks"]
  - point: "Handles a constant column"
    keywords: ["constant column", "zero denominator"]
answer_seconds: 150
example: "Both scalers work per column. Min-max scaling subtracts the column minimum and divides by the range, so training values land between 0 and 1. Standard scaling subtracts the mean and divides by the standard deviation. I would write it as two steps, fit and transform. Fit computes the statistics on the training set only, and stores them. Transform applies those stored numbers to any data: validation, test or production. That is how I avoid leakage. If I fit on everything, information from the test rows leaks into training. With a training column 1, 2, 3 and a test value 4, min-max gives 1.5, which is outside 0 to 1, and that is fine. One edge case is a constant column, where the range or the standard deviation is zero, so I replace a zero denominator with 1. The cost is linear in the data."
