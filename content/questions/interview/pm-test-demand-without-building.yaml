id: pm-test-demand-without-building
question: "Your CEO wants an AI study helper added to a test-prep app. How would you check demand and feasibility in two weeks, before engineers build anything?"
kind: use-case
short_answer: "Decide the pass marks first. Study what learners already ask in search logs and support tickets, and interview eight to ten of them. Add a fake door button to measure interest. Then run a manual pilot where a simple prompt answers real doubts, and have teachers grade the answers."
deeper_answer: "A request that starts with a solution still needs a problem. Existing data is the fastest evidence: what doubts do learners post, at what hour, in which subjects, and how long do they wait for a teacher? A fake door, meaning a button that leads to a 'coming soon' note, shows how many people want the feature without any model work.\n\nFeasibility needs real questions, not a demo. Take 100 real doubts, including photos of handwritten maths and Hinglish text, run them through a model with a simple prompt, and ask two teachers to mark each answer. If 30% of the maths answers are wrong, you have learned that cheaply. Interviewers listen for success criteria set before the test, and for honesty with the CEO if the evidence says no, or says a smaller version."
follow_ups:
  - "What result would make you tell the CEO not to build it?"
  - "What are the risks of a fake door test?"
  - "How would you test it for Hindi-medium learners?"
common_mistakes:
  - "Building a full prototype before talking to users"
  - "Testing only on easy, clean questions"
  - "Setting success criteria after seeing results"
level: B3
topic: product
stop_id: choosing-ai-problem
rubric:
  - point: "Sets success criteria before testing"
    keywords: ["criteria", "pass mark", "target", "before any test"]
  - point: "Uses existing data and learner interviews"
    keywords: ["logs", "tickets", "interview"]
  - point: "Measures interest with a fake door or similar"
    keywords: ["fake door", "button", "waitlist"]
  - point: "Runs a manual or prompt-only pilot on real questions"
    keywords: ["manual", "pilot", "real doubts", "real questions", "simple prompt"]
  - point: "Has experts grade answer quality"
    keywords: ["teacher", "grade", "expert", "accuracy"]
answer_seconds: 120
example: "I would not start by building. First I would write the criteria with the CEO before any test: for example, at least 20% of learners tap the feature, and teachers rate 90% of answers as correct. Then I would read our search logs and doubt tickets to see what learners already ask, and interview ten learners in classes 11 and 12. Next, a fake door: an 'Ask AI' button that shows a waitlist note, to measure real interest. For feasibility, I would take 100 real doubts, including photos of handwritten maths, run them through a model with a simple prompt, and ask two teachers to grade each answer. In two weeks we would know demand, quality and the weak subjects."
