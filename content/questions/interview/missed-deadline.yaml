id: missed-deadline
question: "Tell me about a time you missed a deadline."
kind: real-life
short_answer: "Give a real case. Say what you promised, why it was late, and your part in that. The key point is when you told people: early, with a new date and a plan, not on the last day. Then say what you delivered and what you changed in how you estimate work."
deeper_answer: "The interviewer knows that deadlines are sometimes missed. They are checking whether you warn people early and whether you learn to plan better. A late warning hurts more than a late delivery.\n\nSituation and task: what was due, for whom, and by when. Action: when you saw the risk, what you told the stakeholder, and what you offered. A good line is: \"On day nine I told her I would miss the date, and I offered a smaller version on time and the full one five days later.\" Result: what was delivered and how the other person reacted. Close with one planning habit you use now. Own the cause, even if other people also added to the delay."
follow_ups:
  - "When did you first know you would miss it?"
  - "How do you estimate work now?"
  - "What did the delay cost the other team?"
common_mistakes:
  - "Saying you have never missed a deadline"
  - "Blaming other teams or unclear requirements"
  - "Telling the stakeholder only on the last day"
level: I2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "States what was promised and that it was missed"
    keywords: ["promised", "deadline", "date", "miss", "late"]
  - point: "Owns the cause"
    keywords: ["i had not", "my estimate", "underestimated", "i did not", "my mistake"]
  - point: "Warned the stakeholder early"
    keywords: ["told", "informed", "that day", "early", "as soon as"]
  - point: "Offered a plan or a smaller version"
    keywords: ["offered", "new date", "smaller", "top 50", "plan"]
  - point: "Says what they changed in planning"
    keywords: ["now i", "buffer", "estimate", "first day"]
answer_seconds: 120
example: "Last year I was a data scientist at a retail company in Hyderabad. I promised the planning team a demand forecast for the Diwali sale in two weeks. I had not checked the data first. In the second week I found that store codes had changed in March, so half the sales history did not match. On day nine I knew I would miss the date. I told the planning head that day, explained the cause, and offered two things: a forecast for the top 50 products on the promised date, and the full forecast five days later. She agreed, and both arrived as promised. The top 50 covered most of her sale stock, so planning was not blocked. Now I spend the first day of any project checking the data, and I add a buffer to my estimate."
