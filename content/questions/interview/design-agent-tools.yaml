id: design-agent-tools
question: "What makes a good tool for an agent?"
kind: use-case
short_answer: "A clear name and description that say when to use it, a small strict input schema with meaningful parameter names, outputs that are concise and useful to a model (not raw dumps), helpful error messages the agent can act on, and the least power needed. Fewer, well-designed tools that match tasks beat many thin wrappers around API endpoints."
deeper_answer: "Write tool descriptions as you would brief a new colleague: what it does, when not to use it, and examples of inputs. Return identifiers the agent can use in the next call, and paginate or truncate large results with a note saying more exist.\n\nThen test tools with the model: watch traces for wrong tool choices or bad arguments, and fix the description or schema rather than adding more prompt instructions. Anthropic's guide to writing tools for agents is a good reference."
follow_ups:
  - "Why might many fine-grained tools make an agent worse?"
  - "What should a tool return on error?"
common_mistakes:
  - "Wrapping every API endpoint as a tool"
  - "Returning huge raw payloads"
level: I3
topic: agents
stop_id: agent-tool-design
rubric:
  - point: "Clear name and description of when to use it"
    keywords: ["name", "description", "when to use"]
  - point: "Small strict input schema"
    keywords: ["schema", "parameter", "strict", "input"]
  - point: "Concise, useful outputs"
    keywords: ["concise", "output", "truncat", "paginat", "useful"]
  - point: "Actionable error messages"
    keywords: ["error"]
  - point: "Least privilege and fewer, task-shaped tools"
    keywords: ["least privilege", "fewer", "task", "permission"]
answer_seconds: 90
example: "For a CRM agent, instead of exposing 30 raw API endpoints, I gave it four tools: find_customer(name or phone), get_open_deals(customer_id), log_call_note(customer_id, summary) and schedule_followup(customer_id, date). Each had a one-line description of when to use it, strict types, short results, and errors like 'No customer found for that phone. Ask for the email instead.' The agent made far fewer wrong calls."
