id: prompt-injection-defence
question: "What is prompt injection, and how do you defend against it?"
short_answer: "Prompt injection is when text the model reads, from a user or from a document, web page or email, contains instructions that override yours. There is no complete fix, so design to limit damage: least-privilege tools, human approval for risky actions, treat retrieved content as data, validate outputs, and never put secrets in prompts."
deeper_answer: "Direct injection comes from the user typing it. Indirect injection is hidden in content the app processes, which is more dangerous because the user may be the victim. It tops the OWASP list for LLM applications.\n\nDefences in layers: keep sensitive actions outside the model's reach or behind confirmation; enforce permissions in code, not instructions; separate untrusted content clearly in the prompt; filter and validate outputs before acting; monitor for unusual tool use. Detection classifiers help but can be bypassed, so they are not the only control."
follow_ups:
  - "Why is indirect injection more dangerous than direct injection?"
  - "Why does a keyword filter not solve it?"
common_mistakes:
  - "Claiming a better system prompt fully prevents injection"
  - "Ignoring indirect injection through documents and web pages"
