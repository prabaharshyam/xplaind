id: ai-data-strategy-question
question: "What does a good data strategy for an AI product look like?"
kind: use-case
short_answer: "Know what data you need for evals, retrieval and possibly fine-tuning; how you collect it with consent; how you label and keep quality high; who can access it; and how product usage creates new data, such as corrections and feedback, that improves the product over time. Treat a well-maintained eval set as one of your most valuable assets."
deeper_answer: "Many teams think 'data strategy' means training a model, but for most AI products the data that matters is: documents for retrieval, examples for evals, and logs of real usage. Design feedback capture into the product from day one: thumbs, edits and escalations are labels.\n\nRespect limits: consent and purpose under the DPDP Act, customer contracts, and retention rules. A data flywheel only works if users trust you with their data."
follow_ups:
  - "What product signals can act as labels?"
  - "How would you keep the eval set from going stale?"
common_mistakes:
  - "Equating data strategy with training a model"
  - "Collecting data without consent or purpose"
level: I3
topic: product
stop_id: ai-data-strategy
rubric:
  - point: "Data for evals, retrieval and fine-tuning"
    keywords: ["eval", "retriev", "fine-tun", "fine tun", "training"]
  - point: "Collection with consent and purpose"
    keywords: ["consent", "purpose", "collect"]
  - point: "Labelling and quality"
    keywords: ["label", "quality", "clean"]
  - point: "Feedback loop from product usage"
    keywords: ["feedback", "flywheel", "correction", "usage", "log"]
  - point: "Access control and retention"
    keywords: ["access", "retention", "privacy", "dpdp"]
answer_seconds: 90
example: "For a resume-feedback product I would start by building an eval set of 300 resumes with expert feedback, collected with the users' consent. Every time a user edits the AI's suggestion, we log the before and after as a signal of what it got wrong. Access to resumes is restricted and deleted after the retention period. Over six months that loop gives us better evals and, if it ever makes sense, data to fine-tune on."
