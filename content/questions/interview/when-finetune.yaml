id: when-finetune
question: "When is fine-tuning worth the effort?"
kind: scenario
short_answer: "When a narrow, repeated task needs behaviour that prompting cannot reliably produce, you have hundreds to thousands of high-quality examples, and an eval set to prove the gain. Common wins: a strict output format, a house style, a specialised classification, or making a smaller model match a larger one to cut cost and latency."
deeper_answer: "Fine-tuning has real costs: collecting and cleaning data, training runs, evaluating, hosting or paying for the tuned model, and redoing it when the base model improves. A newer base model may make your fine-tune unnecessary.\n\nBefore fine-tuning, try better prompts with examples, structured output, and retrieval. If you do fine-tune, keep a held-out test set, compare against the best prompted baseline, and watch for losing general abilities the task still needs."
follow_ups:
  - "What would your baseline be before fine-tuning?"
  - "What happens to your fine-tune when the provider releases a better base model?"
common_mistakes:
  - "Fine-tuning before trying a well-prompted baseline"
  - "Ignoring the ongoing cost of maintaining training data"
level: P3
topic: approach-choice
stop_id: prompt-rag-or-finetune
rubric:
  - point: "Narrow repeated task prompting cannot handle"
    keywords: ["narrow", "repeated", "prompting cannot", "consistent"]
  - point: "Hundreds to thousands of quality examples"
    keywords: ["examples", "hundreds", "thousands", "data"]
  - point: "An eval set to prove the gain"
    keywords: ["eval", "measure", "prove"]
  - point: "Typical wins: format, style, classification, smaller model"
    keywords: ["format", "style", "classif", "smaller model", "distil"]
answer_seconds: 90
example: "A company classifying support tickets into 60 categories found that even a large model with detailed instructions was inconsistent on similar categories, and each call was expensive. They had 20,000 tickets labelled by agents over two years. Fine-tuning a small model on them gave higher accuracy on a held-out set and a fraction of the cost and latency, which made it worth the effort."
