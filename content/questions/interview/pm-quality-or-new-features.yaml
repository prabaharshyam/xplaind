id: pm-quality-or-new-features
question: "Next quarter you can either raise your assistant's answer quality from 85% to 92%, or ship three new AI features that sales has asked for. How do you decide?"
kind: scenario
short_answer: "Put numbers on both. What do the 15% wrong answers cost in churn, tickets and lost trust, and are failures concentrated in a few fixable types? What revenue is tied to each requested feature? Usually quality on the core task comes first, with one feature kept if a signed deal depends on it."
deeper_answer: "New features on an unreliable base multiply the problem: each one inherits the same failure rate and adds support load. So the first check is whether users who meet wrong answers leave. Compare retention for users who had a failed answer in their first week against those who did not. If the gap is large, quality is the growth work.\n\nThe other check is how hard 92% is. If two failure types cause most errors, the fix may take half the quarter and leave room for one feature. On the sales side, separate requests backed by a contract from wishes. Interviewers listen for evidence on both sides, a clear decision rule, and a message to sales that includes a date and a reason, not only a no."
follow_ups:
  - "What data would change your decision?"
  - "How do you tell sales their features are delayed?"
  - "How do you know 92% is reachable in one quarter?"
common_mistakes:
  - "Choosing features because they are easier to show"
  - "Treating the quality gap as an engineering detail"
  - "Deciding without retention or revenue data"
level: P2
topic: product
stop_id: ai-pm-interviews
rubric:
  - point: "Quantifies the cost of wrong answers: churn, tickets, trust"
    keywords: ["churn", "retention", "tickets", "trust"]
  - point: "Checks whether failures are concentrated and fixable"
    keywords: ["failure types", "concentrat", "most errors"]
  - point: "Weighs revenue tied to the requested features"
    keywords: ["revenue", "signed deal", "contract"]
  - point: "States a decision rule or split of capacity"
    keywords: ["decision", "split of capacity", "quality first"]
  - point: "Communicates the trade-off to sales with dates"
    keywords: ["tell sales", "date", "explain"]
answer_seconds: 130
example: "I would put numbers on both sides. For quality, I would compare retention of users who got a wrong answer in their first week with those who did not. If churn is clearly higher, 85% is costing us growth. I would also look at failure types. If two categories, say date questions and long documents, cause most errors, the fix may need only half the quarter. For features, I would ask sales which ones have revenue attached: a signed deal or a renewal at risk. My decision would probably be a split of capacity: quality first, plus the one feature tied to a contract. Then I tell sales the plan, with a date for the other two and the data behind it."
