example: "For a news app with 20 million daily users in 8 languages, I would first clarify the goal. I would not use clicks alone, because that rewards clickbait. My metric would combine click, reading time and share, with return visits as a guardrail. The design is two-stage. Candidate generation collects a few hundred recent stories from followed topics, the user's language and city, similar stories by embedding, and trending items. A ranking model then predicts several signals for each story and combines them with weights. After that I apply diversity rules, remove duplicate stories and boost freshness. A new article has no history, so a small exploration share gives it some traffic. To stay inside 200 milliseconds I precompute user features. The trade-off is model size against latency. I evaluate offline with NDCG, correcting for position bias, and then run an A/B test."
