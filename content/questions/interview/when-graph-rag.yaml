answer_seconds: 90
example: "A consulting firm asked, 'Across all 400 client reports from last year, which risks came up most often in banking clients?'. Vector RAG retrieved a few passages and missed the big picture. A graph approach that extracted clients, sectors and risks into a graph, with summaries of each community of related entities, answered such whole-collection questions much better. For simple 'what does report X say' questions, plain RAG was still cheaper and fine."
