id: when-graph-rag
question: "When would you use graph RAG instead of standard vector RAG?"
kind: scenario
short_answer: "Use it when questions depend on relationships across many documents or need a summary of a whole collection, such as 'what are the main themes in these reports'. Graph RAG extracts entities and relationships into a knowledge graph and retrieves along links. It costs far more to build, so try it only where vector RAG fails."
deeper_answer: "Vector RAG finds chunks similar to the question, which works for most fact lookups. It struggles with global questions, because no single chunk holds the answer, and with multi-hop questions that chain facts.\n\nMicrosoft's GraphRAG popularised the approach. The extraction step uses many model calls over the whole corpus, so measure cost, check extraction quality, and plan how to update the graph when documents change."
follow_ups:
  - "What is a multi-hop question?"
  - "How would you keep the graph current?"
common_mistakes:
  - "Using graph RAG for simple lookups"
  - "Ignoring indexing cost"
level: P1
