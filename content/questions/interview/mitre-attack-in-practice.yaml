answer_seconds: 90
example: "For a hypothetical Bengaluru SaaS company, I mapped our 80 SIEM rules to ATT&CK and found nothing for credential dumping or scheduled-task persistence, both common in ransomware reports for our sector. We wrote two rules, tested them with a safe simulation in a lab machine, and then reported coverage to leadership as 'techniques that matter to us', not a single score."
