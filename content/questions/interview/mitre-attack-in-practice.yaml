id: mitre-attack-in-practice
question: "What is MITRE ATT&CK, and how does a detection team actually use it?"
kind: concept
short_answer: "MITRE ATT&CK is a free public knowledge base of attacker tactics, the goals such as initial access or persistence, and techniques, the ways to reach them, based on real observed attacks. Teams map their detection rules to techniques to see coverage gaps, prioritise techniques their likely attackers use, and describe incidents in a shared language."
deeper_answer: "Tactics are the why (for example credential access), techniques are the how (for example phishing or brute force), and each technique page lists examples, data sources and mitigations. It is not a checklist to score 100% on.\n\nIn practice a team: maps each rule to a technique ID; builds a coverage view to see which relevant techniques have no detection; picks gaps based on threat intelligence about groups that target their sector; writes and tests new rules, often as Sigma rules, with simulated activity; and tags incident timelines with technique IDs so lessons are shared. For AI systems, MITRE ATLAS plays a similar role for attacks on machine learning."
follow_ups:
  - "How would you decide which uncovered techniques to work on first?"
  - "What is the difference between ATT&CK and MITRE ATLAS?"
common_mistakes:
  - "Treating full coverage of every technique as the goal"
  - "Mapping rules to techniques without ever testing that they fire"
level: I1
topic: security
stop_id: threat-detection-attack
rubric:
