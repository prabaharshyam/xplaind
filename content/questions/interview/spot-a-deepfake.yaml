id: spot-a-deepfake
question: "How would you spot a deepfake or AI-generated misinformation?"
short_answer: "Do not rely on spotting glitches; good fakes have few. Check the source: who posted it first, and do trusted news outlets or official accounts confirm it? Look for emotional urgency, odd details such as mismatched lip movement or lighting, and use reverse image search or fact-checkers such as PIB Fact Check. When in doubt, do not forward it."
deeper_answer: "Deepfake videos and cloned voices are used in scams, for example a fake call in a relative's voice asking for money urgently, and in political misinformation. A family code word or calling back on a known number defeats voice-clone scams.\n\nThe safest habit is lateral reading: leave the post and check what reliable sources say. India's government has proposed rules requiring labelling of AI-generated content, but labels will never catch everything."
follow_ups:
