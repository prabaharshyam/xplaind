id: golden-test-set
question: "How would you build a test set for an LLM feature when you have no labelled data?"
kind: use-case
short_answer: "Start from real or realistic inputs: logs, support tickets, or examples written with domain experts. Cover common cases, edge cases and known failure types. For each, write what a good answer must include or avoid. Begin small, around 30 to 50 cases, review them with people who know the domain, and grow the set from production failures."
deeper_answer: "Synthetic examples generated by a model can fill gaps, but review them, because they tend to be easier and more uniform than real inputs. Balance the set across categories that matter to the business, and include adversarial inputs such as prompt injection attempts and off-topic questions.\n\nWrite criteria, not just one reference answer, since many good answers are possible. Version the set, and keep a held-out part you do not tune against, so you can confirm improvements are real."
follow_ups:
  - "How do you stop your test set from becoming too easy?"
  - "How large should it be at first?"
common_mistakes:
  - "Using only synthetic, model-written examples"
  - "Writing one exact reference answer and checking for an exact match"
level: P1
topic: evals
stop_id: evals-test-sets
rubric:
