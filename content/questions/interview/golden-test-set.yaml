    keywords: ["small", "30", "50", "grow", "production"]
answer_seconds: 90
example: "When we started an AI assistant for a telecom's support team with no labelled data, I took 200 recent tickets, worked with two senior agents to pick 50 that covered common and tricky cases, and for each wrote what a correct reply must say and must not say. Every week we added the cases where the assistant went wrong in production. Within two months the set had about 150 cases."
