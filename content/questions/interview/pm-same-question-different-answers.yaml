id: pm-same-question-different-answers
question: "A business head reports a bug: the assistant gave two different answers to the same question on two days. How do you explain why this happens, and what requirements does it lead to?"
kind: concept
short_answer: "It is expected behaviour. The model picks each next word with some randomness, and the context can differ: chat history, retrieved documents or a new model version. The requirement is to decide where variation is acceptable. Wording may vary. Facts such as prices, policy and eligibility must come from fixed sources and stay the same."
deeper_answer: "A language model does not look up one stored answer. It generates text word by word from probabilities, so two runs can differ, more so at a higher temperature setting. The input also changes without anyone noticing: a different chat history, a different set of retrieved passages, or an updated model from the provider.\n\nThe product answer is to separate style from substance. For substance, take facts from a database or approved text, use a low temperature, return structured output, and add a consistency check to the evals: ask the same question five times and compare the facts. For example, an EMI amount should be calculated by code, and the model only explains it. Interviewers listen for a plain explanation that does not blame the user, and a concrete requirement that follows from it."
follow_ups:
  - "Would you set temperature to zero everywhere? Why or why not?"
  - "How would you test consistency before launch?"
  - "How do you explain this to a customer who received two different answers?"
common_mistakes:
  - "Promising the business head it will never happen again"
  - "Explaining with jargon instead of an everyday comparison"
  - "Letting the model generate numbers that code should calculate"
level: B3
topic: product
stop_id: how-ai-products-work
rubric:
  - point: "Explains that the model generates text with some randomness"
    keywords: ["random", "probab", "sampl", "temperature"]
  - point: "Notes that context or model version can change"
    keywords: ["context", "history", "retriev", "version"]
  - point: "Separates acceptable variation in wording from facts"
    keywords: ["wording", "facts", "style"]
  - point: "Takes facts from fixed sources or code"
    keywords: ["database", "code", "approved", "fixed source"]
  - point: "Adds a consistency test to evals"
    keywords: ["consisten", "same question", "five times"]
answer_seconds: 120
example: "I would tell the business head it is not a bug in the usual sense. The model writes each answer word by word with a little randomness, like two trained agents who explain the same rule in different words. The context can also change, for example the chat history or the documents we retrieve. So the real question is where variation is acceptable. Wording can vary. Facts cannot. For our lending app, the interest rate and EMI must come from the database and be calculated by code, and the model only explains them. I would add a consistency test to our evals: ask the same question five times and check the facts match every time."
