id: said-no-to-a-request
question: "Tell me about a time you said no to a request."
kind: real-life
short_answer: "Pick a request you refused for a good reason: risk, quality or a higher priority. Explain how you said no: you understood the need first, gave a clear reason, and offered another option or a later date. End with how the person reacted and what happened."
deeper_answer: "The interviewer is checking whether you can protect quality and focus without damaging relationships. People who say yes to everything deliver late. People who say no rudely lose trust.\n\nSituation: who asked and for what. Task: why you could not agree. Action: how you said it. Show the three parts: the need you understood, the reason, and the other option. A good line is: \"I said, I cannot do it this sprint because the security fix would be delayed, but I can give you a manual export by Friday and the feature two weeks later.\" Result: what the person did and how things ended. Do not choose a story where you refused only because it was not your job."
follow_ups:
  - "What if the request had come from a very senior person?"
  - "Have you said no and later found you were wrong?"
  - "How do you decide when to say yes?"
common_mistakes:
  - "Refusing because it was not your job"
  - "Saying no without a reason or another option"
  - "Saying yes first and then not delivering"
level: I3
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "States the request and who made it"
    keywords: ["asked me", "request", "wanted", "manager", "customer"]
  - point: "Understood the real need first"
    keywords: ["really needed", "they needed", "asked what", "understood"]
  - point: "Gave a clear reason for saying no"
    keywords: ["said no", "because", "risk", "reason", "priority"]
  - point: "Offered another option or a later date"
    keywords: ["offered", "instead", "later", "next sprint", "option"]
  - point: "Gives how it ended"
    keywords: ["accepted", "shipped", "result", "signed", "agreed"]
answer_seconds: 120
example: "I was an ML engineer on an AI assistant used by about forty business customers. A sales manager asked me to build a custom summary feature for one large prospect within the same sprint. That sprint was reserved for fixing a prompt injection weakness that could expose one customer's data to another. I asked what the prospect really needed and by when. They needed weekly summaries for a review meeting. I said no to the feature that sprint and explained the risk in plain words. I offered two things: a manual summary export every Friday for two weeks, and the real feature in the next sprint. He was not happy at first, but he took it to the prospect and they accepted. The security fix shipped on time, the feature shipped two weeks later, and the prospect signed."
