id: ai-pm-vs-pm
question: "How is an AI product manager's job different from a regular PM's?"
short_answer: "The core is the same: find valuable problems and ship solutions. The differences: output is probabilistic, so you define quality with evals rather than fixed specs; you design for errors and trust; costs grow with usage, so unit economics matter; data and feedback loops are part of the product; and responsible AI and regulation need explicit attention."
deeper_answer: "Show you have done it, or practised it: describe an eval you wrote, a trade-off between model quality and cost, or a design choice you made because the model is sometimes wrong.\n\nInterviewers also look for enough technical depth to talk with engineers about prompting, retrieval and fine-tuning trade-offs, without pretending to be an engineer."
follow_ups:
  - "Give an example of an AI-specific trade-off you made."
  - "How technical does an AI PM need to be?"
common_mistakes:
  - "Saying it is the same job"
  - "Claiming deep ML expertise you cannot back up"
level: I1
topic: behavioral
