answer_seconds: 90
example: "As a regular PM for a payments screen, my spec could say 'the button shows the amount'. As an AI PM for a 'categorise my spending' feature, I cannot spec every output, so I define quality as 'at least 90% of transactions correctly categorised on our 500-transaction test set', design an easy way to fix a wrong category, watch cost per user, and plan how corrections improve the model."
