answer_seconds: 150
example: "For 50 million products and a 200 millisecond budget, I would first clarify the goal: purchases per search, with the share of searches with no results as a guardrail metric. The query goes through query understanding: I normalise it, fix spelling and predict the category. Retrieval then combines keyword search on an inverted index with embedding search, and returns about a thousand candidates that are in stock. A learning-to-rank model, gradient-boosted trees with a pairwise loss, scores them on text match, rating, price, popularity and the user's history. For labels I use the click log, but clicks have position bias, so I show randomised order to a small share of traffic to correct it. I evaluate offline with NDCG and then run an A/B test. The trade-off is relevance against latency: a neural reranker on the top 50 helps, but it uses much of the time budget."
