id: design-search-ranking
question: "Design learning-to-rank for the search results page of an e-commerce app with 50 million products. Results must be returned within 200 milliseconds."
kind: use-case
short_answer: "Clarify what success means: clicks, add to cart, purchases, and how to handle queries with no results. Then: query understanding, retrieval that combines keyword and embedding search to get about a thousand candidates, a learning-to-rank model on query, product and user features, business rules, labels from click logs corrected for position bias, then offline NDCG and an A/B test."
deeper_answer: "Clarify the goal first. Purchases per search is a better target than clicks, with guardrails such as the rate of searches with no results and latency. Ask about languages, spelling mistakes and mixed Hindi and English queries, because these shape query understanding.\n\nData flow: the query is normalised, spell-corrected and classified into a category. Retrieval combines an inverted index for exact terms with embedding search for meaning, and returns about a thousand candidates after filters such as stock and delivery area. A learning-to-rank model, often gradient-boosted trees with a pairwise or listwise loss, scores candidates on text match, product quality, price, popularity and user signals.\n\nLabels come from click logs, but users click higher positions more, so raw clicks carry position bias. Correct for this with position as a training feature that is fixed at serving time, or with a small share of randomised results.\n\nTrade-offs: a neural reranker on the top 50 improves relevance but adds latency and cost. Evaluate offline with NDCG, then an A/B test. At scale, the long tail of rare queries and the freshness of price and stock break first."
follow_ups:
  - "How do you get training labels from click logs?"
  - "How would you improve results for rare queries?"
  - "Where would you add a neural reranker, and what does it cost?"
common_mistakes:
  - "Running the ranking model over the whole catalogue"
  - "Treating raw clicks as relevance labels"
  - "Ignoring spelling and mixed-language queries"
level: P2
