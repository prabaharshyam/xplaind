id: mlops-stable-eval-gate
question: "LLM outputs change from run to run. How do you build an eval gate in CI that blocks real regressions but does not fail at random?"
kind: concept
short_answer: "First measure the noise: run the unchanged baseline several times and see how much the score moves. Set the threshold outside that range. Use deterministic checks where possible, enough examples, and a comparison with the baseline on the same cases. Keep a small set of critical cases as hard failures. Pin the judge model and its prompt."
deeper_answer: "A gate that fails at random gets disabled, and then it protects nothing. Flakiness has three main sources: a test set too small for one changed example to mean anything, a judge model that itself varies, and a threshold chosen without data. So measure before setting rules. Run the current version five times. If the score moves between 86% and 90%, a rule of fail under 88% will pass or fail by chance.\n\nThen reduce the variance. Use code checks for anything that can be checked exactly: valid JSON, required fields, a forbidden phrase, the correct tool call. Use a model judge only for what needs judgment, with a fixed judge version, a clear rubric and low temperature. Compare the candidate with the baseline case by case, which is more sensitive than comparing two averages. Split the suite: a few must-pass safety cases, each run several times, and an aggregate score with a margin. A fast subset can run on every pull request. Interviewers listen for measured noise."
follow_ups:
  - "How many examples do you need before a 2-point drop means something?"
  - "What do you do when a critical case fails one time in five?"
  - "How do you make sure the judge model itself does not change without notice?"
common_mistakes:
  - "Setting the pass threshold without measuring run-to-run noise"
  - "Rerunning the pipeline until it passes"
  - "Using a model judge for checks that plain code could do"
level: P1
topic: deployment
stop_id: regression-tests
rubric:
  - point: "Measures run-to-run noise by repeating the unchanged baseline"
    keywords: ["noise", "baseline", "five times", "several times", "varia"]
  - point: "Sets the threshold with a margin outside the noise range"
    keywords: ["threshold", "margin", "outside", "range"]
  - point: "Uses deterministic code checks wherever an exact check is possible"
    keywords: ["determin", "code check", "json", "exact"]
  - point: "Pins the judge model and prompt and keeps the rubric clear"
    keywords: ["judge", "pin", "rubric", "fixed version"]
  - point: "Separates must-pass critical cases from the aggregate score"
    keywords: ["critical", "must-pass", "must pass", "hard fail", "aggregate"]
answer_seconds: 130
example: "A gate that fails at random gets switched off, so I start by measuring noise. On our support bot I ran the unchanged baseline five times on 300 cases. The score moved between 87 and 90 percent. Our rule had been fail under 88, so the result depended on chance. I changed three things. Checks that can be exact became code: valid JSON, the right tool name, no account number in the reply. Those are deterministic. For tone and correctness we kept a model judge, but I pinned the judge version and gave it a short rubric. Then I set the threshold as a drop of more than 4 points against the baseline on the same cases, which is outside the noise range. Separately, 25 critical cases about refunds and privacy must pass on every run."
