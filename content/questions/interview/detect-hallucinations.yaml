id: detect-hallucinations
question: How would you detect hallucinations in a production RAG application?
kind: use-case
short_answer: Check each claim in the answer against the retrieved passages. Split the answer into single
  claims, then judge each as supported or not with an entailment model or a judge model, and flag unsupported
  ones. Check that citations exist and support the claim. Run cheap checks on every answer, deeper judge
  reviews on a sample, and track rates by topic.
deeper_answer: 'Before detection, I would find where the system hallucinates: rare topics and questions
  with false premises are the usual culprits, so the test set must include them. Prevention helps most:
  answer only from sources, say when they do not cover the question, and cite passages.


  Self-consistency, sampling several answers and comparing, works without a source but costs several times
  as much, so I keep it for spot checks. I also track refusal rates, because stricter checks can make
  the assistant refuse too often.'
follow_ups:
- Why do models hallucinate on questions about things that do not exist?
- How would you stop fixes from making the assistant refuse too much?
common_mistakes:
- Judging a long answer with a single verdict
- Testing only common questions
level: P1
topic: rag
stop_id: catching-hallucinations
