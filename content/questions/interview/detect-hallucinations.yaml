answer_seconds: 90
example: On a tax-help assistant, a lawyer found unsupported claims in 9 of 100 answers, mostly rare deductions
  and circulars that did not exist. We added false-premise questions to the test set, told the model to
  answer only from retrieved sections, and ran an entailment check on every claim. Unsupported answers
  fell from 11% to 2%, while refusals rose from 1% to 4%, which we accepted.
