answer_seconds: 150
example: "I separate input and output. On the input side, if a developer pastes client source code or a marketer pastes an unreleased plan into a public tool, that confidential material may be stored or used for training, and it may break our client contract. On the output side, the tool can produce text, images or code that copy protected work, and it may be hard to claim copyright in output that has no human author. The law is unsettled and varies by country, so I involve legal. In practice I would allow only approved tools whose terms say they do not train on our data, and set a rule on what may be pasted. For code we keep a licence scan in the build. For campaigns a designer must edit the final work, and we do not prompt with the name of a living artist."
