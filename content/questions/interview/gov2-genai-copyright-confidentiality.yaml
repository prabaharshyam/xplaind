id: gov2-genai-copyright-confidentiality
question: "Your marketing and software teams use generative AI every day. What copyright and confidentiality risks does that create, and how would you manage them?"
kind: concept
short_answer: "Two sides. Input: confidential or client material pasted into a tool may be stored or used for training, and may break a contract. Output: it may copy protected text, images or code, and purely AI-made work may not get copyright protection in some countries. Controls: approved tools with no-training terms, rules on inputs, human review and editing, and legal advice."
deeper_answer: "The law here is unsettled and differs by country, so I avoid strong legal claims and manage the risk. On the input side the questions are contractual and practical: what do the tool's terms say about retention and training, and do our client contracts allow their data to go to a third party at all? On the output side there are two separate questions: could this output infringe someone else's rights, and can we protect it ourselves? In the United States, for example, the Copyright Office has said that work without human authorship is not protected.\n\nSo controls differ by use. For code, keep licence scanning in the build and review suggestions like any other code. For a brand campaign, a person should create or substantially edit the final work, and we avoid prompts that name a living artist or a competitor's brand. For client work, follow the client's contract. Legal decides the hard cases. Interviewers listen for input against output, care about the law and practical controls."
follow_ups:
  - "A client contract forbids sharing their data with third parties. Can the team use an AI assistant on that project?"
  - "Who owns an image that was made fully by an AI tool?"
  - "What would you check in the terms of a generative AI tool?"
common_mistakes:
  - "Stating as fact that AI output is always safe to use or always owned by the user"
  - "Looking only at outputs and forgetting what is pasted in"
  - "Ignoring client contract terms"
level: I2
