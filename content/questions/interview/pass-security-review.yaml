id: pass-security-review
question: "A client's security team sends a long questionnaire about your AI system. How do you handle it?"
short_answer: "Treat it as a design input, not paperwork. Prepare clear documentation in advance: a data-flow diagram, where data is stored and processed, which model providers are used and their retention terms, encryption, access controls, logging, incident response and certifications. Answer honestly, flag gaps with a plan, and offer a call with their security team."
deeper_answer: "Common AI-specific questions: is our data used to train models, can prompts leak between customers, how is prompt injection handled, can we choose the data region, and how are outputs monitored. Standard frameworks such as the Cloud Security Alliance's CAIQ cover the general controls.\n\nA short security note that answers the top twenty questions saves weeks on every deal."
follow_ups:
  - "What AI-specific questions do security teams ask?"
  - "How would you answer if you lack a certification they ask for?"
common_mistakes:
  - "Vague or over-confident answers"
  - "Not knowing your model provider's data terms"
level: P2
topic: governance
