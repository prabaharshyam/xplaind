id: query-rewriting-hyde
question: "What are query rewriting and HyDE, and when do they help?"
short_answer: "Users ask short, vague or conversational questions that do not match how documents are written. Query rewriting has a model turn it into a clearer standalone query, or several variants. HyDE, hypothetical document embeddings, asks the model to write a fake answer and searches with its embedding, because an answer looks more like the documents than the question does."
deeper_answer: "Rewriting is essential in chat, where 'what about for seniors?' only makes sense with history. Multi-query retrieval searches with several phrasings and merges the results, improving recall.\n\nBoth add a model call, so latency and cost go up, and a bad rewrite can drift from the user's intent. Measure on your eval set; for keyword-heavy queries such as error codes, hybrid search may help more."
follow_ups:
  - "Why does HyDE work at all if the fake answer may be wrong?"
  - "How would you rewrite a follow-up question in a chat?"
common_mistakes:
  - "Adding rewrites without measuring recall"
  - "Ignoring conversation history"
