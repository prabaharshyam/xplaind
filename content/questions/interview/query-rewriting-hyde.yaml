answer_seconds: 90
example: "In a chat about leave policies, a user asks 'and for maternity?'. Alone, that query retrieves nothing useful. Query rewriting turns it into 'How many days of maternity leave are employees entitled to?'. HyDE would instead have the model draft a plausible answer, such as 'Employees are entitled to 26 weeks of paid maternity leave…', and search with that, because it reads like the policy text."
