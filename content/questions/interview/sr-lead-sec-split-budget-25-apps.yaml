id: sr-lead-sec-split-budget-25-apps
question: "You are given ₹1.5 crore and 2 new headcount to secure 25 AI applications across the company this year. How do you split the money and the people?"
kind: scenario
short_answer: "I would start from risk, not from tools. Rank the 25 apps by data, actions and exposure, and spend most on the top five. People first: one engineer for design reviews and one for testing and detection. Money on gateway controls and logging that cover all apps, an external red team for the riskiest, and developer training. Keep a reserve."
deeper_answer: "The common mistake is to buy a product first. With 25 apps and 2 people, the budget must buy coverage and focus together. Coverage comes from shared controls: a gateway that every app calls, with logging, secrets handling and basic filters, so each fix helps all 25. Focus comes from ranking the apps. An internal summariser is not equal to an agent that can move money or read customer records. The top five should get threat models, deep testing and an external red team.\n\nThe trade-off is people against tools. Tools need people to run them, so I would fill the 2 roles before signing large licences. A possible split is 40% shared controls, 25% external testing, 15% developer training and 20% reserve. The exact figures matter less than the logic. Interviewers listen for risk ranking, controls that scale, an honest statement of what will not be covered, and measures to show the board at year end."
follow_ups:
  - "Which of the 25 apps would you leave with only baseline controls, and how do you explain that?"
  - "The budget is cut by half in the middle of the year. What goes first?"
  - "How do you show at year end that the money reduced risk?"
common_mistakes:
  - "Buying a tool before ranking the risks"
  - "Spreading effort equally over all 25 apps"
  - "Spending the full amount with no reserve"
