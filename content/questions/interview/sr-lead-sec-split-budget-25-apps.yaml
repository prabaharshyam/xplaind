example: "First I would rank the 25 apps by risk: what data they touch, what actions they can take, and who can reach them. Usually about five carry most of the risk, for example an agent that can issue refunds. For people, I would hire one engineer for design reviews and threat models, and one for testing and detection. For money, about ₹60 lakh goes to shared controls: a gateway with logging and secrets handling that all 25 apps must use. About ₹40 lakh pays for an external red team on the top five. About ₹20 lakh is for developer training. I keep ₹30 lakh in reserve. I would also tell leadership plainly that the low-risk apps get baseline controls only this year."
