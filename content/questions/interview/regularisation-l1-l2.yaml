example: "On a model predicting customer spend with 200 features, plain linear regression overfitted. Ridge (L2) shrank all the weights and improved validation error. Lasso (L1) set about 150 weights to exactly zero, leaving a smaller model the business could understand, with similar error. I chose the penalty strength by cross-validation."
