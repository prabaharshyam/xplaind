id: regularisation-l1-l2
question: "What do L1 and L2 regularisation do?"
short_answer: "Both add a penalty on the size of the model's weights to the loss, which discourages overfitting. L2 (ridge) penalises squared weights and shrinks them all smoothly towards zero. L1 (lasso) penalises absolute weights and pushes many to exactly zero, so it also selects features. The strength is a hyperparameter you tune on validation data."
deeper_answer: "Without a penalty, a model with many features can give large weights to noise. Regularisation trades a little training error for simpler weights that generalise better.\n\nUse L2 when many features each carry a little signal, and L1 when you suspect only a few matter and want a sparse, explainable model. Elastic net mixes both and behaves better when features are correlated, where lasso tends to pick one at random. Scale features first, because the penalty treats all weights alike. In neural networks, L2 appears as weight decay, alongside other regularisers such as dropout."
follow_ups:
  - "Why should you scale features before regularising?"
  - "What happens as the penalty strength grows very large?"
common_mistakes:
  - "Saying L2 sets weights to exactly zero"
  - "Not scaling features first"
