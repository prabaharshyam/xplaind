id: questions-for-the-interviewer
question: "Do you have any questions for us?"
kind: real-life
short_answer: "Always say yes. Prepare four or five questions and ask two or three: about the work, the team, how success is measured, and what the first months look like. Show you listened by linking one question to something said earlier. Keep salary and leave policy for the HR round."
deeper_answer: "This is still part of the interview. The interviewer is checking your interest and how you think. It is also your chance to learn if you want the job, so ask what you truly need to know.\n\nGood questions cover three areas: the work (\"What would I work on in the first three months?\"), the team (\"How do you review and test a model before release?\"), and growth (\"What does a strong first year look like in this role?\"). Do not ask things the website answers. Match the question to the person: technical questions for an engineer, process and policy for HR. If everything was covered, say which points were answered and ask one deeper question on them."
follow_ups:
  - "Is there anything about the role that worries you?"
  - "Was anything in our process unclear?"
common_mistakes:
  - "Saying \"No, I have no questions\""
  - "Asking only about salary, leave or work from home"
  - "Asking something the company website already answers"
level: B2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Asks about the actual work or the first months in the role"
    keywords: ["first three months", "work on", "day to day", "projects", "take up"]
  - point: "Asks about the team or how they work"
    keywords: ["team", "review", "process", "how do you", "how does"]
  - point: "Asks about success, growth or feedback"
    keywords: ["success", "first year", "grow", "learn", "feedback"]
  - point: "Links a question to something discussed earlier"
    keywords: ["you mentioned", "earlier", "you said"]
answer_seconds: 90
example: "Yes, I have three questions. First, you mentioned earlier that the team is moving its support assistant from a pilot to all customers. If I join, which part of that work would I take up in the first three months? Second, how does the team decide that a new prompt or model is good enough to release? I would like to know if you have a fixed test set or if people review samples by hand. Third, what would a strong first year look like for a junior AI engineer here, and how often do you give feedback? I am asking because I learn fastest with regular review. Thank you, those are the main things I wanted to understand."
