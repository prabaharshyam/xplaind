answer_seconds: 140
example: "In the first hour I would contain it: switch off the order lookup in the chatbot and preserve all logs. I would call the incident team: security, legal and our privacy lead. In the first day we use the logs to find the scope, meaning how many customers saw someone else's data and which fields, and the cause, for example a cache that mixed two sessions. This is a personal data breach under the DPDP Act, so with legal we notify the Data Protection Board and inform the affected customers in plain language: what happened, what data, what we did. Legal also checks CERT-In and client contract duties. Before the feature returns, we fix the root cause, add a test for it, and hold a review."
