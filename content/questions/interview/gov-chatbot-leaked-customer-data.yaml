id: gov-chatbot-leaked-customer-data
question: "Your support chatbot showed one customer's address and order history to another customer. Walk me through the first 48 hours, including who must be told."
kind: scenario
short_answer: "Contain first: switch off the feature or the data lookup, and preserve logs. Bring in security, legal and the privacy lead. Find how many customers were exposed and why. It is a personal data breach, so notify the Data Protection Board and affected customers as the rules require, and check other reporting duties. Then fix and review."
deeper_answer: "The first hours are about stopping further exposure and keeping evidence. Turning off the order lookup is better than leaving a leaking feature live while the cause is studied. Logs show the scope: which sessions received another person's data, and what fields. Causes are often ordinary, such as a caching error or a missing permission check in a tool, not the model itself.\n\nReporting has several tracks. Under the DPDP Act, a personal data breach must be notified to the Data Protection Board and to each affected person, in the form and time the rules set. Depending on the incident and sector, CERT-In, a sector regulator or business clients may also need to be told, so legal should confirm each one. Messages to customers should be plain: what happened, which data, what you have done, what they can do. Interviewers listen for containment before analysis, correct escalation, honest notification and a root cause fix."
follow_ups:
  - "What would you write in the message to affected customers?"
  - "Who decides whether the incident must be reported to a regulator?"
  - "How do you make sure it cannot happen again?"
common_mistakes:
  - "Keeping the feature live while investigating"
  - "Treating it as a model quality issue, not a data breach"
  - "Delaying notification until every detail is known"
level: P1
topic: governance
stop_id: ai-incident-response
