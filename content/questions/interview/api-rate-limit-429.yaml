id: api-rate-limit-429
question: "An API your workflow calls starts returning 429 errors. What do you do?"
kind: scenario
short_answer: "429 means too many requests. I would read the API's rate-limit documentation and the Retry-After header, slow down with batching or a delay between calls, and retry with exponential backoff instead of hammering it. If volume truly needs more, I would ask for a higher limit or use a bulk endpoint, and make sure failed items are retried, not lost."
deeper_answer: "Rate limits protect the provider's service. A workflow that loops over hundreds of records as fast as it can will hit them. The right response respects the limit rather than fighting it.\n\nPractical steps: honour Retry-After if present; add backoff with jitter; process records in batches with pauses; cache results you fetch repeatedly; and queue failed items for a later retry so nothing silently disappears. Log how often you hit the limit, because a steady increase usually means the business has grown and the design needs to change."
follow_ups:
  - "What is exponential backoff?"
  - "How would you make sure no records were lost?"
common_mistakes:
  - "Retrying immediately in a tight loop"
  - "Letting failed records drop silently"
level: B3
topic: automation
stop_id: web-apis-json
rubric:
  - point: "Knows 429 means too many requests or rate limited"
    keywords: ["too many requests", "rate limit"]
  - point: "Reads docs and honours Retry-After"
    keywords: ["retry-after", "documentation", "docs"]
  - point: "Uses backoff and batching"
    keywords: ["backoff", "batch", "delay", "slow down"]
  - point: "Ensures failed items are retried, not lost"
    keywords: ["queue", "retry later", "not lost", "failed items"]
  - point: "Considers asking for higher limits or bulk endpoints"
    keywords: ["higher limit", "bulk", "plan"]
answer_seconds: 90
example: "A workflow that synced contacts from a form tool to a CRM ran fine until a webinar brought in two thousand sign-ups in an hour. The CRM started returning 429s and some contacts never arrived. I changed it to batches of fifty with a pause between them, retries with backoff that read the Retry-After header, and a 'failed' sheet that a second workflow retried every hour. Everything synced that evening, and I set an alert if the failed sheet ever grows."
