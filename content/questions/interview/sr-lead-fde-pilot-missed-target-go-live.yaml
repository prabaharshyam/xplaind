example: "I would not recommend full production at 78%, and I would say that to the client and to my sales team. I would make it concrete: at 2,000 documents a day, about 440 would be wrong, and their staff would lose trust in a week. Then I would break the result down by document type. In a similar project, standard forms were at 93% and scanned handwritten ones at 55%. So I would propose a staged plan: go live now for standard forms with a human review on low-confidence cases, and take eight more weeks to fix the scanned ones. The contract can follow the same stages. If the vice president still wants everything live, I would put the risk in writing and ask who accepts it."
