id: sr-lead-fde-pilot-missed-target-go-live
question: "A 10-week pilot for a client reached 78% accuracy against an agreed target of 90%. The client's vice president still wants to go to production, and your own sales team wants the ₹3 crore contract signed. As delivery lead, what do you recommend?"
kind: scenario
short_answer: "I would not recommend full production now, and I would say so to both sides. I would explain what 78% means for their users, find why the target was missed, and offer a staged path: production for the document types that already pass, with human review, and a fixed period to close the gap. The contract should follow those stages."
deeper_answer: "The pressure comes from two sides, and both want a yes. But a system that is wrong on 22% of cases will produce complaints within weeks, and the delivery team will own them. The target was agreed for a reason, so the first step is to make the gap concrete: how many wrong outputs a day, and what each one costs. Then look inside the 78%. Often results are uneven, for example 93% on standard documents and 55% on scanned ones.\n\nThat opens a third option between yes and no. Go live for the part that passes, keep a human check, and fund a clear plan for the rest, with the contract split into stages tied to results. The sales team still gets a signature, and the client gets value without a public failure. If the client insists on full launch, write down the risk and who accepts it. Interviewers listen for honesty with both client and employer, use of data, a commercial option, and care for the long-term relationship."
follow_ups:
  - "The vice president says 78% is better than the current manual process. Does that change your view?"
  - "Your sales head tells you not to raise this with the client. What do you do?"
  - "What would make you recommend stopping the project?"
common_mistakes:
  - "Agreeing in order to protect the deal"
  - "Saying no with no other option"
  - "Reporting only the average and hiding the weak segment"
level: P3
