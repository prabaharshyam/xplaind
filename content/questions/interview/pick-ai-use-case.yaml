id: pick-ai-use-case
question: "How do you decide whether a problem is a good fit for AI?"
kind: use-case
short_answer: "Start from the user problem, not the technology. A good fit is a task that is frequent and valuable, tolerates some errors or lets a person check the output, has data or examples to learn from, and is hard to solve with simple rules. If a rule, a better form or a search box solves it, do that instead."
deeper_answer: "Ask: what does a wrong answer cost, and who catches it? Drafting a reply that an agent edits tolerates errors; approving a loan does not. Check feasibility with a quick prototype on real examples before committing a roadmap.\n\nAlso weigh the four classic product risks: value, usability, feasibility and viability. AI adds a fifth in practice: trust, meaning whether users will rely on output that is sometimes wrong."
follow_ups:
  - "What would make you say no to an AI feature request?"
  - "How would you test feasibility in a week?"
common_mistakes:
  - "Starting from 'we need AI'"
  - "Ignoring the cost of wrong answers"
level: I1
topic: product
stop_id: choosing-ai-problem
rubric:
  - point: "Starts from the user problem"
    keywords: ["user", "problem", "need", "pain"]
  - point: "Frequent and valuable task"
    keywords: ["frequen", "valuable", "value", "volume"]
  - point: "Tolerates errors or has human checking"
    keywords: ["error", "wrong", "mistake", "human", "check"]
  - point: "Has data or examples"
    keywords: ["data", "examples"]
  - point: "Simpler non-AI solutions first; prototype to test"
    keywords: ["rule", "simpler", "prototype", "feasib"]
answer_seconds: 90
example: "A hospital asked whether AI could 'improve patient experience'. Of their ideas, appointment reminders were better solved with a simple SMS rule, and diagnosis suggestions were too risky to start with. Discharge summaries were a good fit: written many times a day, time-consuming for doctors, checkable by the doctor before signing, and with thousands of past examples. We started there."
