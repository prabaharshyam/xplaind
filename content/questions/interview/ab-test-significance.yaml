id: ab-test-significance
question: "How would you tell whether a new model really performs better in an A/B test?"
short_answer: "Decide the metric and the smallest effect worth detecting before starting, work out the sample size needed, randomly split users, and run for full weeks. Then compare the groups with a significance test and a confidence interval, and only call a winner when the interval excludes no difference and the effect is large enough to matter."
deeper_answer: "A p-value below 0.05 means a difference this large would be unlikely if there were truly no effect; it is not the probability that the new model is better. Peeking daily and stopping when it looks good inflates false positives, so fix the duration or use a sequential method.\n\nWatch for novelty effects, weekday patterns and segments that react differently, and check guardrail metrics such as latency or complaints. For ML, offline gains often shrink online, which is exactly why the test matters."
follow_ups:
  - "What is wrong with stopping the test as soon as it looks significant?"
  - "What does a 95% confidence interval tell you?"
