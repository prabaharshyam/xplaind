answer_seconds: 90
example: "On a food app's 'reorder' recommendations, we decided up front that a 1-point rise in reorder rate was the smallest change worth shipping, which needed about 40,000 users per group for two full weeks. After one week the new model looked 2 points better, and a product manager wanted to stop early. I explained that weekends behave differently and that peeking inflates false wins. At two weeks the difference was 0.6 points with an interval that included zero, so we did not ship it."
