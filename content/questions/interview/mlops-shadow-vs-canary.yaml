id: mlops-shadow-vs-canary
question: "What is the difference between a shadow release and a canary release for a model, and when would you use each?"
kind: concept
short_answer: "In a shadow release the new model receives a copy of live requests, but its predictions are only logged, so users are never affected. In a canary release a small share of real traffic gets the new model's answers. I use shadow to check correctness, latency and stability, then a canary to measure the real effect on users, with rollback."
deeper_answer: "Shadow mode answers one question: does the new model behave sensibly on real traffic? You compare its predictions, latency and error rate with the current model. It carries almost no user risk, but it doubles the compute, and it cannot show how users react, because nobody sees the output. For a fraud model that is fine, since you can score later against confirmed fraud labels.\n\nA canary answers a different question: what happens when real users get the new model? You send 1% to 5% of traffic, watch business and system metrics, and roll back automatically if a guard metric crosses its limit. The risk is real but small. A common order is offline tests, shadow, canary, then full rollout. Interviewers listen for the trade-off, for what you compare in each stage, and for a rollback rule that was agreed before the release started."
follow_ups:
  - "How is a canary different from an A/B test?"
  - "What metrics would trigger an automatic rollback?"
  - "When is shadow mode not possible or not useful?"
common_mistakes:
  - "Treating shadow and canary as the same thing"
  - "Running a canary with no rollback rule agreed in advance"
  - "Forgetting that shadow mode doubles the serving cost"
level: I2
topic: deployment
