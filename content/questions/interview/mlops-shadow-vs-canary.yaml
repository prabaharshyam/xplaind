answer_seconds: 100
example: "In shadow mode, the new model gets a copy of every live request, but its output is only logged. Users never see it. In a canary, a small share of real users, say 2 percent, get the new model's answer. I use them in that order. For a UPI fraud model, I would first run shadow for a week and compare its scores, latency and error rate with the current model. That has no user risk, but it does double the compute for that week. Then I would run a canary on 2 percent of transactions with a rollback rule agreed in advance: if false declines go above an agreed limit, traffic moves back automatically. Only after that would I go to full rollout."
