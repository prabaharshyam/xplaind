answer_seconds: 60
example: "For classifying photos of crop diseases with only 2,000 labelled images, training a network from scratch overfitted. Starting from a model pretrained on ImageNet, I first trained only a new final layer, then fine-tuned the last few blocks with a small learning rate. Validation accuracy was far higher than from scratch, and training took under an hour."
