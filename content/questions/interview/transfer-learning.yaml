id: transfer-learning
question: "What is transfer learning, and when would you use it?"
kind: use-case
short_answer: "Transfer learning starts from a model pretrained on a large dataset and adapts it to your task, instead of training from scratch. You can freeze the pretrained layers and train a new head, or fine-tune some or all layers with a small learning rate. Use it whenever data is limited and a related pretrained model exists."
deeper_answer: "The early layers of a vision model learn general features such as edges and textures that transfer to almost any images; later layers are more task-specific. With a few hundred labelled images you might freeze the backbone and train only a classifier; with tens of thousands you can fine-tune more layers.\n\nThe same idea drives language models: a pretrained LLM fine-tuned or prompted for your task is transfer learning. Watch for domain mismatch, such as models pretrained on photos used for X-rays, and use the same preprocessing the pretrained model expects."
follow_ups:
  - "How do you decide how many layers to unfreeze?"
  - "Why use a smaller learning rate when fine-tuning?"
common_mistakes:
  - "Using different input normalisation from the pretrained model"
  - "Fine-tuning everything at a high learning rate on tiny data"
level: I2
topic: deep-learning
stop_id: cnns-images
