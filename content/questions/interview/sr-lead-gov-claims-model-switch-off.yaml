id: sr-lead-gov-claims-model-switch-off
question: "You head AI governance at an insurer. A model that helps decide health claims has wrongly rejected about 1,800 claims over 3 weeks, and turning it off will put 30,000 claims a month back on manual review. What do you decide in the first 24 hours?"
kind: scenario
short_answer: "I would stop the model from rejecting claims today, and keep it for approvals or drafts if those are shown to be safe. Then find and re-review all 1,800 rejections, starting with urgent medical cases. I would inform senior management, legal and compliance at once, record every decision, and agree what must be proven before automatic rejection returns."
deeper_answer: "The choice is not only on or off. A wrong rejection of a health claim harms a person, while a slow approval is a smaller harm. So the first decision is to remove the model's power to reject, and send those cases to people. If the fault is limited to one claim type, the rest can continue with closer checks. This keeps part of the capacity while stopping the harm.\n\nThe second decision is about the people already affected. Find all 1,800, re-review them by hand, and contact customers before they complain. Legal and compliance should decide what must be reported to the regulator, and it is better to be early and open. The trade-off is a backlog and extra cost for some weeks. Interviewers listen for harm to customers placed first, a decision made with partial facts, clear ownership, a written record, and conditions for restart, such as a fixed cause and a clean test on past claims."
follow_ups:
  - "The operations head says manual review will break service targets. How do you respond?"
  - "What must be true before the model may reject claims again?"
  - "How do you make sure no affected customer is missed?"
common_mistakes:
  - "Waiting for the full root cause before acting"
  - "Treating it as only a technical fault"
  - "Fixing the model and forgetting the 1,800 customers"
level: P3
topic: governance
stop_id: ai-incident-response
rubric:
  - point: "Stops the harm first: no automatic rejections"
    keywords: ["stop the model", "pause", "switch off", "turn off", "rejecting", "rejection"]
