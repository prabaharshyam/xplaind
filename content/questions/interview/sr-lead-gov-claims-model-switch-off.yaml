    keywords: ["harm", "backlog", "trade-off"]
  - point: "Finds and re-reviews all affected claims, urgent ones first"
    keywords: ["re-review", "affected", "urgent", "review again"]
  - point: "Brings in management, legal and compliance early"
    keywords: ["legal", "compliance", "regulator"]
  - point: "Sets written conditions before restart"
    keywords: ["root cause", "written record", "condition", "restart", "returns only"]
answer_seconds: 180
example: "In the first hours I would stop the model from rejecting any claim. A wrong rejection of a health claim is serious harm, and a backlog is a smaller harm, so that trade-off is clear to me. If approvals look safe, the model can still suggest those, with staff checking. Next, we pull the list of all 1,800 affected claims and re-review them by hand, with urgent cases such as ongoing hospital treatment first. I would inform the CEO, legal and compliance the same day, and they decide what goes to the regulator. I would keep a written record of every decision. Automatic rejection returns only after the root cause is fixed and the model passes a test on past claims."
