example: I explain it with a support bot. The base model, given "My refund is late", might just write
  more complaints, because that is likely text. After SFT on agents' best replies, it answers like an
  agent. After preference tuning, where reviewers picked the better of two replies, it learns that a short
  answer with a clear next step beats a long, formal one.
