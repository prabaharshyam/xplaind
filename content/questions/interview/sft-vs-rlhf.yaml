id: sft-vs-rlhf
question: How is a chat model like ChatGPT trained? What is the difference between SFT and RLHF?
kind: concept
short_answer: In three stages. Pre-training on huge text makes a base model that predicts the next token.
  Supervised fine-tuning (SFT) trains it on prompt and ideal-answer pairs so it follows instructions.
  RLHF then uses human comparisons of two answers to train a reward model, and tunes the chat model to
  give answers that score well.
deeper_answer: 'Pre-training uses most of the compute and gives the model its knowledge. SFT and preference
  tuning, together called post-training, use a small share of compute but turn a text-continuer into an
  assistant.


  SFT data is expensive because experts must write ideal answers. Preference data is cheaper, because
  comparing two answers is easier than writing a perfect one. RLHF keeps the tuned model close to the
  SFT model so it does not drift into odd text that happens to fool the reward model. Many teams now use
  DPO, which learns from the same pairs without a separate reward model.'
follow_ups:
- Why is comparison data cheaper to collect than demonstration data?
- What is DPO and why would a team choose it over RLHF?
- Why do chat models sometimes agree with users too readily?
common_mistakes:
- Saying RLHF adds new knowledge to the model
- Forgetting the reward model step in RLHF
- Mixing up the base model and the instruct model
