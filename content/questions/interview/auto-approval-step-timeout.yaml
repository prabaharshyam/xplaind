id: auto-approval-step-timeout
question: "An automation prepares vendor payments, and a manager must approve any payment above ₹50,000. How would you design the approval step?"
kind: use-case
short_answer: "The workflow pauses and sends the approver everything needed to decide: vendor, amount, invoice link and what the checks found. Approve and reject are logged with name and time. If nobody answers, it reminds, then escalates to a backup, and never approves by itself. The approver cannot be the person who raised the payment."
deeper_answer: "An approval step fails in two common ways. Either the approver gets too little information and approves blindly, or requests wait for days and people start to work around the workflow. So I design for a fast, informed decision and for the case of no answer.\n\nThe request shows the key facts and the reasons the workflow flagged it, for example 'bank account changed since last payment'. The buttons go to a link that checks who is clicking, because a forwarded email must not let anyone approve. A timeout sends a reminder after 4 working hours and escalates to a named backup after one day. The default on timeout is 'not paid'. After approval, the workflow checks that the amount and bank details have not changed before paying. Every decision is stored for audit. Interviewers listen for timeout handling, separation of duties and the audit record."
follow_ups:
  - "What happens if the payment details change after approval?"
  - "How do you stop approvers from clicking approve without reading?"
  - "Would you allow approval by replying to an email?"
common_mistakes:
  - "Approving automatically when nobody answers"
  - "Sending a request with too little information to decide"
  - "Letting the requester approve their own payment"
level: I3
topic: automation
stop_id: human-approval
rubric:
  - point: "Pauses the workflow and sends the approver the facts needed to decide"
    keywords: ["pause", "vendor name", "amount", "invoice"]
  - point: "Handles no answer: reminder, escalation to a backup, never auto-approve"
    keywords: ["reminder", "escalat", "backup", "no answer"]
  - point: "Checks who approves; the requester cannot approve their own payment"
    keywords: ["login", "identity", "own payment", "requester"]
  - point: "Logs each decision with name and time"
    keywords: ["into a log", "audit", "name and time"]
  - point: "Checks again that details are unchanged before paying"
    keywords: ["unchanged", "checks again", "before paying"]
answer_seconds: 150
example: "For payments above ₹50,000 the workflow would pause and wait. The manager gets a message in Teams with the vendor name, the amount, a link to the invoice, and any warning, for example that the bank account changed since the last payment. Approve and reject open a page behind company login, so we know the identity of the person, and the requester cannot approve their own payment. If there is no answer in 4 working hours the workflow sends a reminder, and after one day it escalates to a backup approver. It never approves by itself. Each decision goes into a log with name and time for audit. Just before paying, the workflow checks again that the amount and account are unchanged since approval."
