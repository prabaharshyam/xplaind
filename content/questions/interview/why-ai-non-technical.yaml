id: why-ai-non-technical
question: "Why do you want to work with AI when you don't come from a technical background?"
kind: real-life
short_answer: "Because most of AI's value at work comes from people who understand the work itself and can use AI well, not only from those who build it. I bring knowledge of my field, I have already used AI to improve real tasks, and I know its limits. I am learning steadily and can show what I have done."
deeper_answer: "Interviewers ask this to see whether you have a real reason and realistic expectations. A strong answer connects your background to AI: an accountant who understands invoices can design better automation; a teacher knows what good explanations look like; a salesperson knows customers.\n\nBack it with evidence: a task you improved, a course you finished, a small project. Show that you know AI makes mistakes and needs checking, and say what you are learning next. Honesty about what you do not know yet reads as maturity, not weakness."
follow_ups:
  - "What have you already done with AI?"
  - "What do you still need to learn?"
common_mistakes:
  - "Saying 'AI is the future' with no personal reason"
  - "Overclaiming technical skills you do not have"
level: B1
topic: behavioral
stop_id: ai-careers-india
rubric:
  - point: "Connects their own background to AI's value at work"
    keywords: ["background", "domain", "my field", "experience"]
  - point: "Gives evidence of using AI already"
    keywords: ["used", "project", "task", "built", "course"]
  - point: "Shows awareness of AI's limits"
    keywords: ["limit", "mistake", "check", "wrong"]
  - point: "Says what they are learning next"
    keywords: ["learning", "next", "plan"]
answer_seconds: 90
example: "I spent four years in operations at a logistics company, handling delivery complaints. When we started using AI to draft replies, I noticed I was the one who could tell when a reply was wrong, because I knew our routes and policies. I took a free AI course, built a set of prompts the team still uses, and cut our reply time noticeably. I want a role where that mix of knowing the work and knowing the tools is the job, and I am now learning basic automation with n8n."
