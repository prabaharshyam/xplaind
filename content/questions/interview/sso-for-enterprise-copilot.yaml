id: sso-for-enterprise-copilot
question: "How would you add single sign-on to an enterprise AI assistant?"
short_answer: "Integrate with the client's identity provider, such as Microsoft Entra ID or Okta, using OpenID Connect (or SAML if that is what they use). Users sign in with company accounts, the app receives an ID token with their identity and groups, and you use those groups to enforce document permissions in retrieval. Add provisioning so leavers lose access."
deeper_answer: "OAuth 2.0 is for delegated access to APIs; OpenID Connect adds identity on top, which is what sign-in needs. Validate tokens properly: signature, issuer, audience and expiry.\n\nGroup membership can change, so refresh it on each session or sync it, and make sure the RAG permission filters use the same identity."
follow_ups:
  - "What is the difference between OAuth 2.0 and OpenID Connect?"
  - "How do you make sure a leaver loses access?"
common_mistakes:
  - "Building your own password system"
  - "Not linking identity to retrieval permissions"
