answer_seconds: 180
example: "The shapes first: X is n by d, y is a vector of zeros and ones, w has length d, and there is one bias. The forward pass is a linear score, X @ w plus b, then the sigmoid to turn it into a probability. The loss is the mean log loss, also called binary cross-entropy. The nice part is the gradient. The sigmoid and the log loss cancel, so the gradient with respect to the score is just p minus y. For the weights that gives X transpose times p minus y, divided by n, and for the bias the mean of p minus y. Then I subtract the learning rate times each gradient. The cost is n times d. I clip the probabilities before taking the log, so I never take log of zero. As a test, with zero weights every probability is 0.5, so the loss must be ln 2."
