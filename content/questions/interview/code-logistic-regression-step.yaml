id: code-logistic-regression-step
question: "Write one training step of logistic regression in NumPy: given X, y, the weights and a learning rate, return the loss and the updated weights. For example, with all weights at zero, every predicted probability is 0.5 and the loss is ln 2, about 0.693."
kind: use-case
short_answer: "Compute z = X @ w + b, pass it through the sigmoid to get probabilities, and measure the mean log loss. The gradient is simple: X.T @ (p - y) / n for the weights and the mean of p - y for the bias. Subtract the learning rate times each gradient. One step costs O(n d)."
deeper_answer: "Clarify the shapes first: X is n by d, y is a vector of 0 and 1 with length n, w has length d and b is one number.\n\nThe forward pass is z = X @ w + b and p = 1 / (1 + np.exp(-z)). The loss is the mean of -(y * log(p) + (1 - y) * log(1 - p)). The backward pass is short because the sigmoid and the log loss cancel: the gradient with respect to z is p - y. So grad_w = X.T @ (p - y) / n and grad_b = (p - y).mean(). Then w -= lr * grad_w and b -= lr * grad_b.\n\nFor stability, clip p away from 0 and 1 before the log, or compute the loss from z with np.logaddexp(0, z) - y * z. Test that zero weights give a loss of ln 2 and that one step lowers the loss. Interviewers watch for the sign of the update, for log of zero, and for forgetting to divide by n."
follow_ups:
  - "Why is the gradient just p minus y?"
  - "How would you add L2 regularisation?"
  - "How does this extend to more than two classes?"
common_mistakes:
  - "Adding the gradient when it should be subtracted"
  - "Taking the log of a probability that is exactly 0"
  - "Forgetting to divide by the number of rows"
level: I3
