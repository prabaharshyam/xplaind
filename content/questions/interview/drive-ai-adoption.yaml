id: drive-ai-adoption
question: "You launched an AI tool internally and nobody uses it. What do you do?"
kind: scenario
short_answer: "Find out why before pushing harder: talk to intended users, watch them work and check usage data. Common causes are a weak fit with their real workflow, lack of trust in output quality, no time to learn, or fear about jobs. Fix the biggest cause, find champions, train on real tasks and have leaders use it visibly."
deeper_answer: "Change management models such as ADKAR (awareness, desire, knowledge, ability, reinforcement) are a useful checklist: people need to know why, want to, know how, be able to and have it reinforced.\n\nMeasure adoption by team and task, not just log-ins, and close the loop: when users report a problem, fix it quickly and tell them, which builds trust faster than any announcement."
follow_ups:
  - "How would you find out why people are not using it?"
  - "What role do managers play?"
common_mistakes:
  - "Sending more announcement emails"
  - "Blaming users instead of the fit"
level: I3
topic: product
stop_id: change-management
rubric:
  - point: "Investigates why first"
    keywords: ["why", "talk to", "interview", "usage data", "watch"]
  - point: "Names likely causes: workflow fit, trust, time, fear"
    keywords: ["workflow", "trust", "quality", "time", "fear", "job"]
  - point: "Fixes the biggest cause"
    keywords: ["fix", "improve", "change"]
  - point: "Champions, training on real tasks"
    keywords: ["champion", "train", "real task", "workshop"]
  - point: "Leadership support and measuring adoption"
    keywords: ["leader", "manager", "measure", "adoption"]
answer_seconds: 90
example: "We launched an AI writing assistant for a 50-person sales team and usage stayed near zero. I sat with five reps for a day and saw why: it lived in a separate website, while they wrote everything in the CRM. We added it as a button inside the CRM, built three templates for their real emails, and asked the top seller to share how she used it. Weekly users rose to most of the team within a month."
