answer_seconds: 180
example: "At 100,000 requests per second with 20 milliseconds for scoring, I would first clarify how the score is used. It goes into an auction as bid times click probability, so the model must be calibrated, not only ranked well. Training data is the impression log joined to each click, which can be delayed. Clicks are rare, so I downsample negatives and correct the probabilities afterwards. Features are sparse ids for user, ad and page, which I hash into embedding tables, plus recent counts. For serving I use a funnel: a light model cuts thousands of ads to a few hundred, and a deeper model scores each candidate in one batch. I compute user features once per request. The model trains with incremental updates every hour, so each new ad is learned quickly. I check log loss and calibration offline on later days, then run an A/B test on revenue. The trade-off is model size against latency."
