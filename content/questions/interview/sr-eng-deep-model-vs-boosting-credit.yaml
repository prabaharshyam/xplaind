id: sr-eng-deep-model-vs-boosting-credit
question: "After four months of work, your team's deep learning credit model beats the gradient boosting model in production by 0.4% AUC offline, but costs eight times more to serve and is harder to explain to risk and compliance. Do you ship it, and how do you tell the team?"
kind: scenario
short_answer: "Probably not as it is. I would check whether 0.4% AUC is real and what it means in defaults avoided, then weigh it against serving cost, explanation needs and operational risk. If it does not clearly win, I keep boosting, reuse what the deep model taught us, and tell the team honestly, with credit for the work."
deeper_answer: "On tabular data, gradient boosting is often very hard to beat, so a small offline gain deserves suspicion. Check confidence intervals, performance on recent months, and key segments such as customers who are new to credit. Then convert to money: at the approval threshold, how many bad loans does the new model avoid in a year? Compare this with eight times the serving cost, new monitoring, and the effort of giving a reason for each decline, which risk and compliance teams will ask for.\n\nThere are middle paths: use the deep model's learned embeddings as features in the boosting model, or run it in shadow to learn more. The people side matters as much. Four months of work with no ship criteria is a leadership failure to fix, not a team failure. Agree the criteria before the next project starts. Interviewers listen for a decision by business value, respect for the team, and a lesson about process."
follow_ups:
  - "How would you turn a 0.4% AUC gain into rupees?"
  - "What ship criteria would you agree before the next modelling project?"
  - "How could the work on the deep model still be used?"
common_mistakes:
  - "Shipping because the offline metric is higher"
  - "Ignoring serving cost and the need to explain decisions"
  - "Avoiding an honest conversation with the team"
level: P3
topic: deep-learning
stop_id: neural-networks
rubric:
  - point: "Tests whether the gain is real: intervals, recent data, segments"
    keywords: ["confidence interval", "segments", "noise", "significan", "segment"]
  - point: "Converts the AUC gain into money at the decision threshold"
    keywords: ["bad loans", "money", "threshold", "default", "rupee", "business value"]
  - point: "Weighs serving cost, explainability and operational risk"
    keywords: ["serving cost", "explain", "compliance", "interpret", "eight times"]
  - point: "Considers middle paths: embeddings as features or a shadow run"
    keywords: ["embeddings", "shadow", "middle path", "hybrid", "embedding"]
  - point: "Tells the team honestly and agrees ship criteria up front"
    keywords: ["ship criteria", "criteria", "honest", "credit", "direct"]
answer_seconds: 180
example: "My honest answer is that I would probably not ship it yet. First I would check that 0.4% AUC is not noise: confidence intervals, the last three months, and segments like first-time borrowers. Then I convert it to money at our approval threshold. If it avoids ₹40 lakh of bad loans a year but serving cost rises by ₹60 lakh, the answer is clear. I would also ask compliance how we would explain each declined application. A middle path is to feed the deep model's embeddings into the boosting model as features, or run it in shadow for a quarter. With the team, I would be direct: the work was good, the result does not pay yet, and the mistake was mine for not agreeing ship criteria before we started."
