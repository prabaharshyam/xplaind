id: why-llm-gateway
question: "What does an LLM gateway do, and when do you need one?"
short_answer: "A gateway sits between your apps and model providers and gives one API for many models. It handles routing, fallbacks when a provider fails, retries, rate limits and budgets per team, caching, and central logging of cost and usage, and it keeps provider keys in one place. You need one once several teams or models are in play."
deeper_answer: "Tools such as LiteLLM or managed gateways provide this. Routing can also be smart: send easy requests to a cheap model and hard ones to a strong one, as RouteLLM research explored.\n\nThe gateway is also where you enforce policy: which models are approved, data rules, and spending caps. Keep it highly available, because it becomes a single point of failure."
follow_ups:
  - "How would you route between a cheap and an expensive model?"
  - "What new risk does a gateway introduce?"
common_mistakes:
  - "Hard-coding one provider in every app"
  - "Making the gateway a single point of failure"
