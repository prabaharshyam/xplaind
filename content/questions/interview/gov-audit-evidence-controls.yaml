id: gov-audit-evidence-controls
question: "An auditor asks you to prove that your AI controls actually work, not only that a policy exists. What evidence do you show?"
kind: concept
short_answer: "Show records that controls operated over time: the AI inventory with owners and risk tiers, signed impact assessments dated before launch, test and bias reports tied to model versions, change approvals, samples of human review logs, training records, and incident files with corrective actions. Evidence must be dated, attributable and hard to alter."
deeper_answer: "Auditors separate two things: is the control designed well, and did it operate? A policy proves design at best. Operation is proved by records produced while the work happened. If the policy says every high-risk system gets an impact assessment before launch, the auditor will pick a sample of systems and ask for each assessment, its date, who signed it, and the launch date.\n\nSo good evidence has four qualities: it has a date, it names a person, it links to a specific system and version, and it cannot be quietly edited later. A screenshot made the day before the audit is weak. A ticket history or a log export is strong. Gaps should be shown honestly with a corrective action. Interviewers listen for the difference between design and operation, concrete records, and the habit of collecting evidence as part of the work, not just before the audit."
follow_ups:
  - "What makes a piece of evidence weak?"
  - "How do you prove a human really reviewed the outputs?"
  - "What do you do when you find a control did not operate for three months?"
common_mistakes:
  - "Showing the policy document as proof"
  - "Creating evidence just before the audit"
  - "Evidence with no date, owner or system version"
level: I2
topic: governance
stop_id: audit-logs
rubric:
  - point: "Separates control design from control operation"
    keywords: ["design", "operation", "policy alone"]
  - point: "Shows an inventory with owners and risk tiers"
    keywords: ["inventory", "owner", "risk tier"]
  - point: "Shows dated, signed assessments and test reports per version"
    keywords: ["impact assessment", "test report", "model version", "signed"]
  - point: "Shows logs or samples proving human review and approvals"
    keywords: ["logs", "approval", "time stamps"]
  - point: "Explains evidence quality: dated, attributable, hard to alter"
    keywords: ["date", "who did it", "hard to alter", "tamper"]
answer_seconds: 120
example: "A policy alone shows design, not operation, so I would show records. First, our AI inventory: each system with an owner and a risk tier. Then, for a sample the auditor picks, the impact assessment signed before the launch date, and the test report and bias results linked to the exact model version. For human oversight I would export a sample of review logs showing which officer approved or changed each output, with time stamps. I would add change approval tickets, training completion records and one incident file with its corrective action. I make sure each item is dated, shows who did it, and comes from a system where it is hard to alter. If a control was missed, I show the gap and the fix."
