answer_seconds: 60
example: "A client wanted invoices entered into both their cloud accounting tool and an old desktop inventory system. The accounting tool had an API, so we used it, which was fast and reliable. The inventory system had no API and no import, and its screens had not changed in years, so we used RPA for that part, with screenshots and an alert if a screen looked different."
