id: rpa-vs-api
question: "When would you use RPA instead of an API integration?"
kind: scenario
short_answer: "Use an API whenever one exists: it is faster, more reliable and easier to maintain. Use RPA, software robots that click through screens like a person, when a system has no API, such as an old desktop app or a government portal, and the process is stable. RPA breaks when screens change, so monitor it closely."
deeper_answer: "RPA tools such as UiPath or Power Automate Desktop record or script interactions with the user interface. They are a bridge, not a foundation: every layout change can break a bot.\n\nGood practice: confirm there really is no API or export, keep bots to stable screens, handle pop-ups and timeouts, and log screenshots on failure."
follow_ups:
  - "What breaks RPA bots most often?"
  - "How would you monitor a bot that runs overnight?"
common_mistakes:
  - "Choosing RPA when an API exists"
  - "No plan for screen changes"
level: B3
topic: automation
stop_id: rpa-basics
rubric:
