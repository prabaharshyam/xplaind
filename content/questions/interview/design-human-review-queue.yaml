id: design-human-review-queue
question: "An insurance company uses a model to extract data from 100,000 claim documents a day. Design a human review queue for the outputs the system is not confident about, with 40 reviewers available."
kind: use-case
short_answer: "Clarify error cost and reviewer capacity. Decide what goes to review using validation rules, risk and calibrated confidence, with thresholds set from labelled data to fit capacity. Build a queue with priority, deadlines and assignment, a review screen that shows the source next to the output, and feed corrections back into evaluation sets. Audit a random sample of auto-approved items."
deeper_answer: "Requirements: what a wrong field costs, which claims are high value, how long a claim may wait, and how many items 40 reviewers can handle. If each handles about 300 a day, capacity is near 12,000, so roughly 12 percent of documents can be reviewed. The threshold must fit that.\n\nRouting: a model's own stated confidence is often poorly calibrated, so combine signals. Use validation rules (dates, totals that must add up, policy numbers that must exist), agreement between two extraction passes, and a confidence score calibrated on labelled data. High-value claims go to review whatever the score. The queue has priorities, deadlines and assignment with locks. The review screen shows the document with the source region highlighted next to each field.\n\nTrade-offs: a lower threshold catches more errors but needs more reviewers. If the queue grows, do not auto-approve silently: alert and adjust. Reviewers who see mostly correct output start to approve without looking, so insert known test items and measure agreement. Audit a random sample of auto-approved items to estimate the real error rate. Corrections become labelled data for evaluation sets and prompt fixes."
follow_ups:
  - "How do you choose the confidence threshold?"
  - "How do you know the auto-approved documents are actually correct?"
  - "The queue has grown to three days of backlog. What do you do?"
common_mistakes:
  - "Trusting the model's self-reported confidence without calibration"
  - "Sizing the queue without checking reviewer capacity"
  - "Throwing away reviewer corrections"
level: P1
