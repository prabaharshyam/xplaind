answer_seconds: 150
example: "I would clarify what a wrong field costs and check capacity first. If each reviewer handles about 300 documents a day, 40 reviewers cover 12,000, so about 12 percent of the 100,000 can go to review. To choose those, I would not trust the model's own confidence alone. I combine a validation rule set, such as totals that must add up, with a confidence score calibrated on labelled claims, and I set the threshold to fit capacity. High-value claims always go to a person. The queue has priority, a deadline and assignment with locks. The review screen shows each field next to the highlighted source text. The trade-off is a lower threshold against more reviewers. I would also audit a random sample of auto-approved documents each day to measure the real error rate. Every correction is saved as labelled data for the evaluation set."
