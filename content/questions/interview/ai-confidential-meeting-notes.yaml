id: ai-confidential-meeting-notes
question: "Would you use AI to summarise a confidential meeting? How would you decide?"
kind: scenario
short_answer: "Only with a tool my company has approved for confidential data, where the contract says our data is not used for training. I check the AI policy, make sure everyone agrees to the recording, and never paste confidential notes into a free public tool. If no approved tool exists, I write the summary myself."
deeper_answer: "The question tests whether you know that tools differ. Enterprise versions of AI assistants often come with agreements about data use, retention and access, while free consumer versions may keep or use what you type under different terms. Your company's policy should say which tools are allowed for which kinds of data.\n\nConsent matters too: people should know if a meeting is recorded or transcribed. And a summary is still checked by a person before it is shared, because AI can misattribute who said what."
follow_ups:
  - "What would you do if a colleague was already pasting meeting notes into a free tool?"
  - "What should an AI policy say about meetings?"
common_mistakes:
  - "Assuming all AI tools treat data the same way"
  - "Forgetting to tell participants about recording"
level: B1
topic: governance
stop_id: company-ai-policy
rubric:
  - point: "Uses only a company-approved tool for confidential data"
    keywords: ["approved", "enterprise", "company tool"]
  - point: "Checks the company AI policy"
    keywords: ["policy", "rules", "allowed"]
  - point: "Considers how the tool stores or uses data"
    keywords: ["training", "stored", "retention", "data use"]
  - point: "Asks for participants' agreement to recording"
    keywords: ["consent", "agree", "tell", "participants"]
  - point: "Reviews the summary before sharing"
    keywords: ["review", "check", "before sharing"]
answer_seconds: 90
example: "At my last job our board meetings were confidential, and someone suggested pasting the transcript into a free chatbot. I checked our policy, which allowed only our company's licensed assistant for internal documents. We used that, told everyone at the start that the meeting was being transcribed, and I read the summary before sending it. It had swapped who proposed one decision, which I corrected."
