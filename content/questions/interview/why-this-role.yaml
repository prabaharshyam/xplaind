id: why-this-role
question: "Why do you want this role?"
kind: real-life
short_answer: "Show you understand what the role does every day, then match it to what you are good at and what you enjoy. Use one piece of past work as proof. Add what you want to learn next. Avoid reasons that are only about pay, title or AI being popular."
deeper_answer: "The interviewer is checking that you know what the job really is. Many people apply to AI roles because the field is popular, and then find the daily work is data cleaning, testing and monitoring. They want someone who has seen that side and still wants it.\n\nRead the job description closely and pick the two or three duties that match you. Structure: what the role involves, your proof that you can do it and like it, and what you want to grow into. For example: \"In my current job I chose to own model deployments, and it was the part of the week I enjoyed most. This role makes that my main work.\" Be specific about the role, not AI in general."
follow_ups:
  - "Which part of this job do you think you will find hardest?"
  - "How is this role different from what you do now?"
  - "Why this role and not a data scientist role?"
common_mistakes:
  - "Saying only that AI is the future"
  - "Describing a different job from the one advertised"
  - "Giving pay or title as the main reason"
level: I1
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
asked_often: true
rubric:
  - point: "Shows understanding of what the role does day to day"
    keywords: ["day to day", "the role", "job description", "deploy", "monitor", "production", "pipeline"]
  - point: "Matches the role to their strengths, with past work as proof"
    keywords: ["in my current job", "i built", "i owned", "experience", "volunteered"]
  - point: "Says what they enjoy about this kind of work"
    keywords: ["enjoy", "liked", "like", "interest"]
  - point: "Mentions what they want to learn or grow into"
    keywords: ["learn", "grow", "next"]
answer_seconds: 90
example: "I have been a backend developer in Hyderabad for two years. Last year our data science team had a fraud model that worked in a notebook but took three weeks to reach production. I volunteered to help. I put the model in a container, added a pipeline that retrains it every week, and set an alert for when its accuracy falls. Releases now take two days. I found I liked this work more than writing normal APIs, because it sits between the model and the real users. Your MLOps role is exactly that work, done full time and at a larger scale. I also want to learn GPU cost management, which my current team does not need."
