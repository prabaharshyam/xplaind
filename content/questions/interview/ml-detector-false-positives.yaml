id: ml-detector-false-positives
question: "A vendor says their ML intrusion detector is 99% accurate. Why might it still drown your SOC in false alarms?"
kind: scenario
short_answer: "Because attacks are rare. If one event in 10,000 is malicious, a model that wrongly flags just 1% of normal events still raises about 100 false alarms for each real attack. Accuracy hides this. I would ask for precision, recall and the false positive rate on data like ours, and test it on our own logs first."
deeper_answer: "This is the base rate problem. With a tiny share of positives, even a small false positive rate produces far more false alerts than true ones, so precision is low. Accuracy looks great because predicting 'normal' every time is already almost perfectly accurate.\n\nBetter questions for the vendor: precision and recall at the threshold they recommend, the false positives per day expected at our event volume, what data they tested on, and how the model handles drift and attackers who adapt. Then run a pilot on our own logs, label a sample of alerts, and tune the threshold to what analysts can handle. Combine ML scores with rules and context instead of alerting on the score alone."
follow_ups:
  - "How would you pick the alert threshold?"
  - "What happens when attackers learn how the model works?"
common_mistakes:
  - "Accepting accuracy as the measure on rare events"
  - "Trusting the vendor's test results without a pilot on your own data"
level: I2
topic: security
stop_id: ml-threat-detection
rubric:
  - point: "Explains the base rate: attacks are rare"
    keywords: ["base rate", "rare", "imbalanced", "few attacks"]
  - point: "Shows the arithmetic or that false alarms outnumber real ones"
    keywords: ["false alarm", "false positive", "outnumber", "for each real"]
  - point: "Asks for precision, recall and false positive rate instead of accuracy"
    keywords: ["precision", "recall", "false positive rate", "accuracy"]
  - point: "Pilots on own data and tunes the threshold"
    keywords: ["pilot", "own data", "own logs", "threshold", "tune"]
answer_seconds: 90
example: "At a hypothetical Noida payments company, we piloted an anomaly detector on two weeks of login logs, about 2 million events. Its '1% false positive rate' meant roughly 20,000 alerts, against a handful of real incidents. We raised the threshold, only alerted when the score combined with a rule such as a new device plus a password reset, and measured precision on 300 labelled alerts before buying."
