id: design-for-wrong-answers
question: "How do you design a product experience when the AI is sometimes wrong?"
kind: use-case
short_answer: "Set expectations honestly, make output easy to check and edit, show sources or reasoning where possible, and keep the user in control of anything consequential. Offer clear ways to correct, undo or give feedback, and design graceful fallbacks when the model is unsure, such as asking a clarifying question or saying it does not know."
deeper_answer: "Patterns from Google's People and AI Guidebook and Microsoft's guidelines for human-AI interaction: explain what the system can do, show confidence where it is meaningful, make it easy to dismiss suggestions, and learn from corrections.\n\nMatch autonomy to the cost of errors: suggest rather than act for high-stakes tasks. Then measure: how often users edit, accept or reject outputs tells you where quality falls short."
follow_ups:
  - "When would you show a confidence score, and when not?"
  - "How would you use user corrections?"
common_mistakes:
  - "Hiding that output is AI-generated"
  - "Designing only the happy path"
level: I2
topic: product
stop_id: ux-uncertain-output
rubric:
  - point: "Sets honest expectations"
    keywords: ["expectation", "honest", "what it can do", "disclos"]
  - point: "Easy to check, edit or undo"
    keywords: ["edit", "undo", "check", "correct", "dismiss"]
  - point: "Shows sources or reasoning"
    keywords: ["source", "citation", "explain", "why"]
  - point: "User stays in control of consequential actions"
    keywords: ["control", "approve", "confirm", "suggest"]
  - point: "Feedback and graceful fallbacks"
    keywords: ["feedback", "fallback", "don't know", "clarif"]
answer_seconds: 90
example: "In an AI feature that drafts insurance claim summaries, we labelled the draft clearly, showed the document line behind each fact so the officer could click and check it, made every field editable, and kept 'Submit' as a human action. When the model was unsure about a date, it left the field blank and said why, instead of guessing."
