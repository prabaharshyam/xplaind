id: auto-backfill-old-records
question: "You built a workflow that enriches each new CRM contact. Now the business wants it run on the 20,000 contacts that already exist. How do you do that safely?"
kind: use-case
short_answer: "I treat it as a separate job. I check the API limits and cost first, then process in small batches with a delay, saving progress so it can resume. I switch off side effects meant for new contacts, such as welcome emails. I try 100 records first, check the results, take a backup, then run the rest outside busy hours."
deeper_answer: "A workflow designed for one new record at a time behaves differently at 20,000. It can hit rate limits, use up a month of the tool's quota, and trigger every downstream action: 20,000 'new contact' notifications to sales, or a welcome email to customers from five years ago. The second kind of damage is the one people forget.\n\nSo I make a backfill version. It reads contacts in pages, in batches of perhaps 50, with a pause between batches based on the documented limit. It writes a marker on each contact when done, so a stopped run continues from where it ended and never does a contact twice. Notifications and emails are disabled or sent to a log. Before the full run I export the affected fields as a backup, and I run 100 contacts and compare by hand. I estimate the time and cost and tell the owner. Interviewers listen for side effects, limits, resume and backup."
follow_ups:
  - "How do you estimate how long the full run will take?"
  - "The job stops at contact 12,000. What happens next?"
  - "Which downstream actions would you check before starting?"
common_mistakes:
  - "Pointing the live workflow at all old records at once"
  - "Forgetting emails and notifications that fire for each record"
  - "No backup before a bulk update"
level: I2
topic: automation
stop_id: web-apis-json
rubric:
  - point: "Checks rate limits, quota and cost before starting"
    keywords: ["rate limit", "quota", "cost"]
  - point: "Processes in batches with a pause"
    keywords: ["batches", "pause", "delay"]
  - point: "Saves progress so the job can resume without repeats"
    keywords: ["resume", "marker", "done twice"]
  - point: "Switches off side effects such as emails and notifications"
    keywords: ["welcome email", "notification", "disable"]
  - point: "Trial on a small set and a backup before the full run"
    keywords: ["trial", "backup", "100 contacts"]
answer_seconds: 120
example: "I would not point the live workflow at 20,000 contacts. I would build a backfill copy. First I read the API documentation for the rate limit and check the cost of the enrichment service for 20,000 calls, and I get that approved. The copy reads contacts in batches of 50 with a pause between batches. It writes a marker field on each contact when done, so if it stops at 12,000 it can resume and no contact is done twice. I disable the welcome email and the notification to sales in this copy, because these are old customers. Before the full run I export the fields that will change as a backup, and run a trial on 100 contacts and check 20 by hand. Then I run the rest at night over the weekend."
