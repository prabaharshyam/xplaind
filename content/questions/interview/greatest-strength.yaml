id: greatest-strength
question: "What is your greatest strength?"
kind: real-life
short_answer: "Name one strength that matters for this job, not a list. Prove it with a short example: the situation, what you did, and the result. Then say how it will help in this role. Pick something true that a teammate or teacher would confirm."
deeper_answer: "The interviewer is checking self-awareness and fit. A strength with no example is only a claim. A strength that has nothing to do with the job is wasted.\n\nRead the job description and choose a real strength that it needs: careful testing, clear writing, learning fast, staying calm with unclear problems. Use claim, example, benefit. For example: \"My strength is that I test before I trust. In my project I wrote 50 test questions before changing any prompt, so I could show that each change helped.\" Keep it to one strength. If asked for more, add a second with its own example. Do not use a word like perfectionist unless you can show what it looks like in your work."
follow_ups:
  - "Can you give another example of that strength?"
  - "When has that strength caused you a problem?"
  - "What would your teammates say your strength is?"
common_mistakes:
  - "Listing five strengths with no example"
  - "Choosing a strength the job does not need"
  - "Using general words like hardworking or passionate"
level: B2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
asked_often: true
rubric:
  - point: "Names one clear strength that is relevant to the role"
    keywords: ["strength", "good at", "strong in"]
  - point: "Backs it with a specific example"
    keywords: ["for example", "in my project", "when i", "internship", "during"]
  - point: "Gives the result of that example"
    keywords: ["result", "passed", "percent", "per cent", "improved", "could show"]
  - point: "Links the strength to this job"
    keywords: ["this role", "this job", "your team", "useful", "ai engineer"]
answer_seconds: 90
example: "My greatest strength is that I check my work with numbers before I say it works. During my six-month internship at a small startup in Pune, I was asked to improve a prompt that summarised customer calls. Before changing anything, I collected 50 real calls and wrote down what a good summary should contain for each. The first prompt passed 29 of 50. I tried four versions, and the best one passed 43. Because I had the test set, I could also show that one popular change made things worse. My mentor now uses that test set for every release. For a junior AI engineer, I think this habit is useful, because a model can sound correct and still be wrong."
drafted_with_ai: true
