answer_seconds: 165
example: "I would first ask whether 6% recall matters after our reranker. I would run the full pipeline on 500 real questions and look at answer quality end to end. If the gain falls to 1%, I stop, or try a cheaper fix like better chunking. If it holds, I would estimate the cost: 80 million chunks is several days of batch embedding and a clear budget line. Then I build a parallel index. A backfill job embeds old chunks in batches with checkpoints, and new documents are written to both indexes. Before switching, I send live queries to the new index in shadow and compare the top results. Then I move traffic by flag, 5% then 50% then all, and keep the old index for two weeks so we can roll back."
