id: sr-eng-embedding-model-migration
question: "Your search index holds 80 million chunks, and a new embedding model gives 6% better recall on your test set, but moving to it means re-embedding everything. Would you do it, and how would you run the change with no downtime?"
kind: use-case
short_answer: "First I would check that 6% recall changes the answers users see, not only a retrieval number. If it does, I would estimate re-embedding cost and time, build the new index beside the old one, write new documents to both, compare on live traffic in shadow, then switch by flag and keep the old index until we are sure."
deeper_answer: "Vectors from two embedding models cannot be mixed in one index, so this is a full rebuild, not an upgrade in place. That makes it a cost and risk decision. A recall gain on a test set may vanish after reranking, so measure end-to-end answer quality first. Sometimes a reranker or better chunking gives the same gain for far less work.\n\nIf the gain is real, run a parallel index: backfill 80 million chunks in batches with rate limits and checkpoints, write new and changed documents to both indexes, and verify counts. Send a copy of live queries to the new index and compare results before any user sees them. Then shift traffic gradually and keep the old index for a rollback window, accepting double storage cost for some weeks. Interviewers listen for questioning the benefit, dual writes, shadow comparison and a rollback plan."
follow_ups:
  - "Why can you not mix vectors from the old and the new model in one index?"
  - "The backfill will take nine days. What can go wrong in that time?"
  - "When would you decide that the 6% is not worth it?"
common_mistakes:
  - "Trusting a recall number without checking final answers"
  - "Re-embedding in place with no way back"
  - "Forgetting documents that change during the backfill"
level: P2
topic: rag
