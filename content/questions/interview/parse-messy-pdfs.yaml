id: parse-messy-pdfs
question: "Your RAG system must handle scanned PDFs, tables and slides. How do you ingest them?"
kind: use-case
short_answer: "Parsing quality caps everything after it. Use a layout-aware parser such as Docling or Unstructured that keeps headings, reading order and tables; run OCR on scanned pages; turn tables into Markdown or row-wise text with headers; and keep page numbers and titles as metadata. Spot-check parsed output against the originals before tuning anything else."
deeper_answer: "Plain text extraction often scrambles columns, drops tables or merges headers into body text. For slides and image-heavy pages, a vision-language model can describe charts, or you can index page images directly with multimodal retrieval.\n\nBuild a small ingestion test set: a few tricky documents with known content, and check that facts from tables and footnotes survive parsing. Re-run it whenever you change the parser."
follow_ups:
  - "How would you represent a large table so retrieval works?"
  - "When would you index page images instead of text?"
common_mistakes:
  - "Tuning embeddings while parsing is broken"
  - "Losing page numbers needed for citations"
level: I2
topic: rag
stop_id: document-parsing-ocr
rubric:
  - point: "Parsing quality limits everything downstream"
    keywords: ["parsing", "quality", "garbage", "downstream", "first"]
  - point: "Layout-aware parser keeps structure"
    keywords: ["layout", "docling", "unstructured", "heading", "reading order"]
  - point: "OCR for scanned pages"
    keywords: ["ocr", "scanned"]
  - point: "Tables converted with headers"
    keywords: ["table", "markdown", "header", "row"]
  - point: "Keeps metadata and spot-checks output"
    keywords: ["metadata", "page number", "spot-check", "check", "compare"]
answer_seconds: 90
example: "For a manufacturer's documents, a third were scanned maintenance logs, many had specification tables, and some were slide decks. We used Docling with OCR enabled, converted tables to Markdown with headers repeated on each row group, and kept page and section as metadata. Before touching chunking or prompts, I compared twenty parsed pages with the originals and found that two-column pages were read in the wrong order, which we fixed first."
