id: indian-language-token-cost
question: Your chatbot costs about three times more per reply in Tamil than in English. Why, and what
  would you do?
kind: scenario
short_answer: APIs charge per token, and many tokenizers were built mainly for English, so they split
  Tamil into several times more tokens for the same meaning. I would measure tokens per reply for each
  language and model, compare models with more efficient tokenizers or Indian-language models, keep prompts
  lean, and budget cost per language.
deeper_answer: 'Higher token counts also mean slower replies and less room in the context window, so the
  effect is not only cost. Newer tokenizers handle Indian scripts much better, so the gap varies a lot
  between models.


  Options include a model with an efficient tokenizer for Tamil, an Indian-language model, or translating
  to English and back for some steps, each tested on the same Tamil test set for quality, since saving
  tokens is no use if answers get worse. Romanised Tamil may also tokenise differently from Tamil script.'
follow_ups:
- How would you measure token fertility for a language?
- What are the risks of translating to English and back?
common_mistakes:
- Assuming the model is simply more verbose in Tamil
- Optimising tokens without checking quality
