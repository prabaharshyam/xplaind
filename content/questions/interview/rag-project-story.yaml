id: rag-project-story
question: "Tell me about a RAG system you built and how you measured whether it worked."
kind: real-life
short_answer: "Describe the documents and users, the pipeline choices (parsing, chunking, search, prompt), and above all the test set: how many questions, where they came from, and the metrics, such as how often the right passage was retrieved and how often answers were correct and grounded. Then one improvement and its measured effect."
deeper_answer: "What separates strong candidates is measurement. Saying 'it worked well' is weak; saying 'on 60 real questions, the right passage was in the top five 78% of the time, and hybrid search raised that to 90%' is strong, as long as you can explain how you counted.\n\nCover both halves: retrieval quality and answer quality. Mention a failure you found through evaluation, such as tables parsed badly or questions needing two documents, and how you fixed it. If it was a personal project, say so and describe the real documents you used."
follow_ups:
  - "How did you build the test set?"
  - "What was the hardest kind of question?"
common_mistakes:
  - "No numbers, or numbers with no explanation of how they were measured"
  - "Only evaluating final answers, not retrieval"
level: I2
topic: rag
stop_id: check-retrieval
rubric:
  - point: "Describes the documents, users and pipeline"
    keywords: ["documents", "pipeline", "chunk", "embedding"]
  - point: "Explains the test set and where it came from"
    keywords: ["test set", "questions", "real"]
  - point: "Measures retrieval quality"
    keywords: ["retrieval", "recall", "top", "right passage"]
  - point: "Measures answer quality or grounding"
    keywords: ["correct", "grounded", "faithful", "answer quality"]
  - point: "Gives an improvement with its measured effect"
    keywords: ["improved", "raised", "from", "to"]
answer_seconds: 120
example: "I built a question-answering app over twenty public FAQ documents for a state scheme. I wrote forty questions with the passage that answers each, plus eight that the documents cannot answer. At first the right passage was in the top five for 29 of the 40, and the app answered three of the eight unanswerable ones. Adding headings to chunks and keyword search raised retrieval to 36 of 40, and a stricter prompt with a 'not in the documents' rule fixed all eight."
drafted_with_ai: true
reviewed_by: "Shyam Prabahar"
reviewed_on: 2026-10-27
