id: bank-chatbot-threat-model
question: "Threat model an LLM chatbot for a retail bank that can answer questions and show a customer's recent transactions."
kind: use-case
short_answer: "I would draw the data flow: app, login, chatbot service, model provider, policy documents and the transactions API. For each part I ask what could go wrong, using STRIDE plus AI threats: prompt injection, one customer seeing another's data, data sent to the provider, wrong financial advice, and abuse. Each threat gets a control, an owner and a test."
deeper_answer: "Key trust boundaries: the user's message, retrieved documents, the model provider and the transactions API. Main threats and controls: spoofing is handled by the bank's existing login and session checks, never by the model; information disclosure is prevented by having the transactions tool take the account ID from the verified session, not from the model's output; tampering and injection are limited by keeping the bot read-only, with no money movement; repudiation is handled by audit logs of prompts, tool calls and answers; denial of service and cost abuse by rate limits and token caps.\n\nAI-specific: system prompt leakage, hallucinated rates or fees (ground answers in approved documents and cite them), data residency and retention with the provider, and RBI and DPDP Act obligations reviewed with compliance. MITRE ATLAS helps list attacks on the model itself."
follow_ups:
  - "Why must the account ID come from the session and not from the model?"
  - "What changes if the bot can also make payments?"
common_mistakes:
  - "Letting the model decide which customer's data to fetch"
  - "Listing threats without owners, controls and tests"
level: P1
topic: security
stop_id: ai-threat-modeling
rubric:
  - point: "Draws a data flow with trust boundaries"
    keywords: ["data flow", "trust boundar", "diagram", "component"]
  - point: "Uses STRIDE or a structured method"
    keywords: ["stride", "spoofing", "tampering", "repudiation", "disclosure", "atlas"]
  - point: "AI threats: injection, data leakage across customers, hallucination"
    keywords: ["prompt injection", "another customer", "hallucinat", "leak"]
  - point: "Controls in code: session-bound account ID, read-only tools"
    keywords: ["session", "read-only", "in code", "least privilege"]
  - point: "Audit logs, rate limits and compliance"
    keywords: ["audit", "log", "rate limit", "dpdp", "rbi", "compliance"]
answer_seconds: 120
example: "In a design review for a hypothetical cooperative bank in Nagpur, the first version let the model pass an account number to the transactions tool. A test prompt asking for 'account ending 4417' returned someone else's transactions in staging. We changed the tool to read the account from the signed session, kept the bot read-only, and added that prompt to the regression suite."
