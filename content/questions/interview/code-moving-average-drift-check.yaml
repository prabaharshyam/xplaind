example: "The reference window is usually the training data or a stable past period, and the current window is the last day or week of the feature. The simplest check compares the means. I compute a z-score: the difference in means, divided by the reference standard deviation over the square root of the current window size. If the absolute value is above about 3, I raise an alert. That misses changes in shape, so I would add the population stability index. I take bin edges from the reference quantiles, with the two end bins open, compute the share of each window in each bin, and sum the difference in shares times the log of their ratio. I add a small floor so an empty bin does not give a log of zero. Above about 0.2 I would investigate. Both are linear in the window size. I would test that two samples from the same distribution do not alert."
