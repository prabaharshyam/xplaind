answer_seconds: 90
example: "In a coding agent working on a large repository, if every file it reads stays in the context, after twenty steps the window is full of old files and it forgets the task. Good context engineering keeps the task and a short plan at the top, replaces old file contents with one-line notes, and reads files again only when needed. The agent stays focused and cheaper per step."
