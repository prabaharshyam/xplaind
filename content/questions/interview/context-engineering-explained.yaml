id: context-engineering-explained
question: "What is context engineering, and why does it matter for agents?"
short_answer: "Context engineering is deciding what information goes into the model's limited context at each step: instructions, tool definitions, retrieved documents, memory and previous results. Agents run many steps, so context fills with tool output and history. Good practice keeps it small and relevant: compact or summarise old steps, load details only when needed, and store notes outside the context."
deeper_answer: "Models get worse and costlier as context grows with irrelevant material, sometimes called context rot. Techniques: just-in-time retrieval instead of loading everything; summarising and clearing old tool results; giving sub-agents their own clean context; and structured note files the agent can read back.\n\nIt is the agent version of prompt engineering: less about wording, more about choosing which tokens earn their place."
follow_ups:
  - "How would you handle a tool that returns a 50-page document?"
  - "What should stay in context for every step?"
common_mistakes:
  - "Loading every document up front"
  - "Letting tool output pile up unchecked"
