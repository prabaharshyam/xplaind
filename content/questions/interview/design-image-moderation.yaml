answer_seconds: 150
example: "For 2 million uploads a day, I would first clarify the policy categories and confirm that we check before the image is shown, so the check sits in the upload path with a few seconds of budget. Step one is a perceptual hash match against known harmful images, which is cheap and exact. Step two is a multi-label classifier, a pretrained vision model that I fine-tune on our own labelled images. Each category has its own threshold pair: clearly safe images are allowed, clear violations are blocked, and the uncertain middle goes to human review. Reviewer decisions and user reports come back as labels, and sellers can appeal. I would also audit a random sample of allowed images, to find what the model misses. I measure precision and recall per category. The trade-off is recall against review cost: a lower threshold for severe categories catches more, but sends more images to people."
