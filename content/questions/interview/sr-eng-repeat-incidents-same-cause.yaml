answer_seconds: 165
example: "Four incidents with the same cause tells me the postmortems are not the problem, the follow-through is. I would not blame the engineers who made the changes. First, every action item gets one owner and a date, and moves from the document into the team backlog. I would review open items weekly with my manager and reserve 20% of each sprint as capacity for them. Second, I remove the cause. All configuration goes into Git, with code review and validation in CI, and rolls out to a canary first with a one-command rollback. If this path takes five minutes, people will use it. I would keep an emergency route for real outages, but with an audit log and a review the next day. My success measure is zero manual production changes in the next quarter."
