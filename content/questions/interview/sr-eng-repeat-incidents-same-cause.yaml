id: sr-eng-repeat-incidents-same-cause
question: "In six months your ML platform has had four serious incidents, and all four postmortems name the same cause, a manual configuration change, with action items that were never completed. As the new lead, what do you change?"
kind: scenario
short_answer: "The postmortems are written but not acted on, so I would fix the follow-through. Every action item gets an owner, a date and a place in the normal backlog, with a weekly review and reserved capacity. Then I remove the cause: configuration changes go through code review, automated checks and a canary, with manual access only for emergencies."
deeper_answer: "Four incidents with one cause means the organisation has learned nothing yet, and that is a management problem more than a technical one. Action items are usually forgotten because they sit in a document, have no owner, and compete with features that have deadlines. Making them visible to leadership, with a count of open items older than 30 days, changes that quickly.\n\nOn the technical side, asking people to be more careful is not a fix. People make manual changes because the safe path is slow or missing. So make the safe path fast: config in Git, validation in CI, automatic rollout to a canary, and one command to roll back. Keep an audited emergency route, or people will invent one. Interviewers listen for a blameless tone, fewer but stronger action items, capacity that is really reserved, for example 20% of each sprint, and a way to verify the fix, such as zero manual changes in production for a quarter."
follow_ups:
  - "Product managers say there is no room in the sprint for these items. What do you say?"
  - "How would you make the safe path faster than a manual change?"
  - "How would you know the problem is truly fixed?"
common_mistakes:
  - "Telling people to be more careful"
  - "Writing a fifth postmortem with the same unowned action items"
  - "Removing all manual access with no emergency route"
level: P2
topic: deployment
