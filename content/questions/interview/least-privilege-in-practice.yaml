answer_seconds: 90
example: "For a new analytics team at a hypothetical Gurugram fintech, I created three groups: analysts with read-only access to the reporting warehouse, two engineers with deploy rights to their project only, and no one with org-wide admin. Production write access was just-in-time with a manager's approval for four hours. The dashboard service got its own read-only role, and we reviewed the groups every quarter."
