id: least-privilege-in-practice
question: "Explain least privilege. How would you apply it to a new team's cloud and app access?"
kind: scenario
short_answer: "Least privilege means every person, service and AI agent gets only the access it needs, for only as long as it needs it. In practice I start from no access, grant roles per job, avoid shared admin accounts, use short-lived credentials, require MFA, and review access regularly so leftovers are removed when people change roles or leave."
deeper_answer: "Least privilege limits the blast radius. If an account is phished or a key leaks, the attacker gets only what that account could do. It applies to machines too: a reporting service needs read access to one database, not admin on the whole cloud account. AI agents with tools need the same care, because an injected instruction can only use the rights the agent holds.\n\nPractical steps: role-based groups instead of per-person grants, separate admin accounts used only for admin work, just-in-time elevation with approval, secrets in a vault rather than in code, and a quarterly access review. Log privileged actions so you can see when broad rights are actually used."
follow_ups:
  - "How do you handle an engineer who needs production access during an outage?"
  - "How does least privilege apply to an AI agent with tools?"
common_mistakes:
  - "Giving everyone admin to move fast and promising to tighten later"
  - "Never reviewing access, so old rights pile up"
level: B3
topic: security
stop_id: identity-and-access
