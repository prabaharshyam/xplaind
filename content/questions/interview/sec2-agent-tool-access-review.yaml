answer_seconds: 150
example: "I start with a data flow map. Untrusted content enters through supplier emails and PDFs. The agent can read confidential price records, and it can commit money and send messages out. With all three present, I assume a prompt injection will arrive. Then I go through the tools one by one. The price lookup should return only the records for this purchase request, not other suppliers' quotes. The purchase order tool should run as a narrow service account, with a cap of ₹50,000 and human approval above that. A reply can go only to the supplier's registered address, and it is checked so that no other supplier's price appears in it. Next I test with 30 injected quotations, for example a PDF with hidden text asking for a higher price. I sign off only with written conditions, a full audit log, a kill switch and a named owner."
