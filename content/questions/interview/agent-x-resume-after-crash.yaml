id: agent-x-resume-after-crash
question: "An agent runs a 12-step employee onboarding task that sends emails and creates accounts, and the worker crashes at step 7. How do you design it so the run can resume without repeating what is already done?"
kind: use-case
short_answer: "Save a checkpoint of the run's state to a durable store after every step, so a new worker can load it and continue. Make every tool with a side effect idempotent, using a key built from the run and step, so a repeated call does nothing new. For a step that was in progress, check the real system before retrying."
deeper_answer: "Two things are needed: durable state and safe repeats. State means a small structured record, not only the chat transcript: which steps are done, the IDs that were created, and what is next. It is written to a database after each step. Graph frameworks such as LangGraph call this a checkpoint, and a workflow engine gives the same result.\n\nThe hard case is the step that was running during the crash. The worker may have sent the email and died before saving. So each side-effect call carries an idempotency key, for example run ID plus step number. The tool, or a small table in front of it, refuses a second call with the same key and returns the first result. If the downstream system has no such support, the agent first reads the real state: does the account already exist? Interviewers listen for the gap between doing an action and recording it, and for a candidate who does not simply restart from step one."
follow_ups:
  - "What exactly would you store in the checkpoint?"
  - "How would you handle a tool that cannot accept an idempotency key?"
  - "What changes if the crash happens while a human approval is pending?"
common_mistakes:
  - "Restarting the whole run from step one"
  - "Keeping state only in the worker's memory"
  - "Assuming a step did not happen because it was not recorded"
level: P1
topic: agents
stop_id: langgraph-basics
