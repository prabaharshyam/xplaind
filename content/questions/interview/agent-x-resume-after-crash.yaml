    keywords: ["idempoten", "key", "same key"]
  - point: "Handles the in-progress step by checking the real system before retrying"
    keywords: ["real system", "already exist", "check", "in progress"]
  - point: "A new worker resumes from the last checkpoint, not from the start"
    keywords: ["resume", "new worker", "continue", "last checkpoint"]
answer_seconds: 150
example: "I would save a checkpoint to a database after every step. It is a small structured record: which steps are done, the IDs created so far, such as the email account ID, and the next step. When the worker crashes, a new worker loads the last checkpoint and can resume from step 7, not step 1. The risky part is step 7 itself. It was in progress, so the welcome email may have gone out before the crash. To handle that, every tool with a side effect takes an idempotency key made from the run ID and step number. If the tool sees the same key again, it returns the first result and does nothing. For our old HR system, which has no such key, the agent would first check whether the account already exists and only then create it."
