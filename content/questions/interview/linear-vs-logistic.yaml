id: linear-vs-logistic
question: "What is the difference between linear and logistic regression?"
short_answer: "Linear regression predicts a number, such as a house price, by fitting a weighted sum of the features with squared error loss. Logistic regression predicts the probability of a class, such as spam or not, by passing that weighted sum through a sigmoid and training with log loss; you then pick a threshold to make a decision."
deeper_answer: "Despite its name, logistic regression is a classification model. Its weights are interpretable as changes in the log odds, which is why it is still used in credit scoring and medicine where explanations matter.\n\nBoth are strong baselines: fast, explainable and hard to beat when relationships are roughly linear. Both benefit from scaling and regularisation. For more than two classes, logistic regression extends to softmax regression."
follow_ups:
  - "Why not use linear regression for a yes or no target?"
  - "How do you interpret a logistic regression weight?"
common_mistakes:
