id: code-linear-regression-gradient-descent
question: "Implement linear regression trained with batch gradient descent in NumPy. For example, on data generated from y = 2x + 3 with a little noise, the weight should end close to 2 and the bias close to 3."
kind: use-case
short_answer: "Start the weights and bias at zero. Each step: predict with X @ w + b, compute the error, and move against the gradient of the mean squared error, which is (2 / n) * X.T @ (pred - y) for the weights. Repeat until the loss stops falling. Each step costs O(n d)."
deeper_answer: "Clarify the shapes first: X is n by d, y has length n, w has length d and b is one number. Ask whether the features are scaled. Gradient descent is slow or unstable when columns have very different ranges, so standardise them first.\n\nThe loss is the mean of the squared error. Each step: err = X @ w + b - y, then the gradients are grad_w = (2 / n) * X.T @ err and grad_b = 2 * err.mean(). Update with w -= lr * grad_w and b -= lr * grad_b. Stop when the loss changes by less than a small tolerance.\n\nTest against the closed-form answer from np.linalg.lstsq on the same data, and check the gradient against a numerical difference. The loss should fall on every step; if it grows, the learning rate is too large. Interviewers watch for a y of shape (n, 1) against a prediction of shape (n,), which broadcasts to an n by n array without an error, and for a missing bias term."
follow_ups:
  - "How do you choose the learning rate?"
  - "When would you use the closed-form solution and not gradient descent?"
  - "How would you add L2 regularisation to the update?"
common_mistakes:
  - "Shape mismatch that broadcasts to an n by n array"
  - "Forgetting the bias term"
  - "Training on unscaled features with one learning rate"
level: I2
topic: coding
