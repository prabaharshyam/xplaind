    keywords: ["scale", "closed-form", "least squares"]
answer_seconds: 180
example: "First the shapes: X is n rows by d features, y has length n, the weights have length d, and the bias is one number. I start both at zero. Each step, I predict with X @ w plus b, and take the error as prediction minus y. The loss is the mean squared error. Its gradient for the weights is 2 over n times X transpose times the error, and for the bias it is 2 times the mean error. I subtract the learning rate times each gradient, and repeat until the loss stops falling. Each step costs n times d. I would scale the features first, because unscaled features force a tiny learning rate. To test it, I would compare with the closed-form least squares answer, and check that the loss goes down every step. If the loss grows, the learning rate is too large."
