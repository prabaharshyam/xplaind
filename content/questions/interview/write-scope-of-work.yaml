id: write-scope-of-work
question: "What goes into a scope of work for an AI project?"
kind: use-case
short_answer: "The problem and goal, the specific use case and users, what will be delivered, measurable acceptance criteria (for example 90% correct field extraction on an agreed test set), what is out of scope, assumptions and client responsibilities such as data access, the timeline with milestones, and how changes are handled."
deeper_answer: "AI projects need acceptance criteria tied to an eval set agreed with the client, because 'it works' means different things to different people. State that quality is measured on that set, not on every possible input.\n\nName dependencies clearly: data access, security approvals, subject experts' time. Most AI project delays come from these, not from the model."
follow_ups:
  - "How would you write acceptance criteria for a RAG assistant?"
  - "What client responsibilities would you list?"
common_mistakes:
  - "Vague acceptance criteria"
  - "No change process"
level: P1
topic: client-delivery
stop_id: scope-of-work
rubric:
  - point: "Problem, goal and use case"
    keywords: ["problem", "goal", "use case"]
  - point: "Deliverables"
    keywords: ["deliverable", "deliver"]
  - point: "Measurable acceptance criteria on an agreed test set"
    keywords: ["acceptance criteria", "measurable", "test set", "eval"]
  - point: "Out of scope and assumptions"
    keywords: ["out of scope", "assumption"]
  - point: "Client responsibilities, timeline and change process"
    keywords: ["responsib", "data access", "timeline", "milestone", "change"]
answer_seconds: 90
example: "For an invoice-extraction project, our scope said: extract ten named fields from supplier invoices for the accounts team; deliver a workflow, a review screen and documentation; acceptance is at least 90% of fields correct on an agreed set of 200 invoices; out of scope are handwritten invoices and payment processing; the client provides sample invoices and system access by week one; four milestones over eight weeks; changes go through a written change request."
