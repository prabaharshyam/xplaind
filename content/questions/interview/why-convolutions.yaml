example: "To recognise a cat in a photo, it should not matter whether the cat is in the top corner or the centre. A convolution uses the same small filter, say one that detects a vertical edge, everywhere in the image, so it finds that edge wherever it is, with very few weights. Early layers find edges, later ones combine them into ears and eyes, and the final layers recognise the cat."
