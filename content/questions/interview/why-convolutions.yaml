id: why-convolutions
question: "Why do convolutional neural networks work well for images?"
short_answer: "Convolutions slide small learned filters across the image, so the same weights detect a pattern such as an edge anywhere in the picture. That weight sharing needs far fewer parameters than a fully connected layer and builds in translation equivariance. Stacked layers combine edges into textures, parts and objects, and pooling or strides shrink the image as features grow richer."
deeper_answer: "A 224 by 224 colour image has about 150,000 input values; a dense layer on that is huge and ignores that nearby pixels relate. Convolution uses local receptive fields: each output looks only at a small patch, and stacking layers widens what deeper units see.\n\nModern practice rarely trains a CNN from scratch: you take a pretrained backbone such as a ResNet or EfficientNet and fine-tune it. Vision transformers now compete with CNNs on large datasets, but CNNs remain strong and efficient, especially on smaller data and edge devices."
