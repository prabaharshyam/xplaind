example: "Think of a team that lost a match by 30 runs. Backpropagation is the review that works backwards from the result to ask how much each decision contributed: the bowling change, the batting order, a dropped catch. In a network, the chain rule does this for every weight, giving each one a gradient, and gradient descent then adjusts each a little so the next 'match' goes better."
