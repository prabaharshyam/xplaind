id: worked-with-difficult-person
question: "Tell me about working with someone you found hard to work with."
kind: real-life
short_answer: "Choose someone whose working style was hard for you, and describe the behaviour, not their character. Explain how you tried to understand them, what you changed on your side, and what you asked them to change. End with how the work went after that. Stay respectful."
deeper_answer: "This is different from the conflict question. There may be no single disagreement, only daily difficulty. The interviewer is checking whether you adjust to people who work differently, or wait for them to change.\n\nSituation: the person's role and the behaviour that made work hard. Task: what you needed from them. Action: how you learned their side and what you changed first. A good line is: \"I asked him what would make my pull requests easier to review, and his answer was fair.\" Result: how the work improved. Describe only what the person did, such as late replies or short comments. Do not use labels such as lazy or arrogant."
follow_ups:
  - "What did you learn about your own working style?"
  - "What if the person had refused to change anything?"
  - "When would you involve your manager?"
common_mistakes:
  - "Using labels such as lazy, rude or arrogant"
  - "Changing nothing on your own side"
  - "Complaining to others before speaking to the person"
level: I2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Describes the behaviour, not the person's character"
    keywords: ["took", "comments", "replies", "late", "one word", "days to review"]
  - point: "Tried to understand the other person's side"
    keywords: ["asked what", "understood", "he said", "she said", "listened"]
  - point: "Changed something on their own side first"
    keywords: ["i started", "i changed", "small changes", "with tests", "my side"]
  - point: "Made a clear and polite request"
    keywords: ["asked him", "asked her", "requested", "he agreed", "she agreed"]
  - point: "Gives how the work improved"
    keywords: ["dropped", "improved", "one day", "result", "faster"]
answer_seconds: 120
example: "At a product company in Chennai, I was an ML engineer and my model code had to be reviewed by a senior backend engineer. He took four or five days to review, and his comments were one word, such as \"No\" or \"Redo\". My releases kept getting delayed. Then I asked him for twenty minutes and asked what would make my pull requests easier to review. He said they were too large, had no tests, and came when he was on call for production issues. That was fair. I started sending small changes with tests, and I added a short note on what to check. I also asked him to write one line of reason with each rejection, and he agreed. Review time dropped to about one day, and he later asked me to join a design discussion."
