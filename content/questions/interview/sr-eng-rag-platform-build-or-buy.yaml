id: sr-eng-rag-platform-build-or-buy
question: "Six teams have each built their own RAG pipeline, and leadership offers you a choice: buy a vendor RAG platform for about ₹1.5 crore a year, or put five engineers on a shared internal one. How do you decide?"
kind: use-case
short_answer: "I would decide by where our difficulty is. If the six pipelines struggle with the same generic work, such as parsing and indexing, buying is reasonable. If quality depends on our data and ranking, we must own retrieval and evals. I would test the vendor on our evals, check permissions and exit cost, and compare three-year cost."
deeper_answer: "Five engineers cost roughly as much as the licence, so price alone does not decide. The question is what the company must control. Evaluation sets, the document permission model and the data itself should stay ours in both cases, because they are how we judge any platform and how we leave one. Connectors, parsing and index operations are generic and expensive to maintain.\n\nA concrete test: take the two hardest pipelines, for example legal contracts and Hindi support articles, and run the vendor for four weeks against our existing recall and answer-quality numbers. Check that per-document permissions are enforced at query time, how data is exported, and what the price is at five times the volume. Interviewers listen for a candidate who separates generic work from what makes the product different, insists on a trial with their own evals, counts migration and exit cost, and considers a mixed answer."
follow_ups:
  - "The vendor does well on four pipelines and badly on two. What now?"
  - "What would you put in the contract to keep your exit cost low?"
  - "How do you get six teams to give up pipelines they built?"
common_mistakes:
  - "Deciding from the vendor demo instead of your own eval sets"
  - "Comparing licence price with salaries only"
  - "Forgetting document permissions and data export"
level: P3
topic: rag
stop_id: rag-app
rubric:
  - point: "Separates generic plumbing from the parts that decide quality"
    keywords: ["generic", "parsing", "connector", "commodity", "differentiat", "pars"]
  - point: "Keeps eval sets and data under own control either way"
    keywords: ["eval sets", "control", "own our", "our evals"]
  - point: "Runs a trial on the hardest pipelines with existing metrics"
    keywords: ["hardest", "trial", "recall", "bake", "pilot", "proof of concept"]
  - point: "Checks permissions, export and exit cost"
    keywords: ["permission", "export", "exit", "lock"]
  - point: "Compares multi-year cost including migration and maintenance"
    keywords: ["three years", "migration", "maintenance", "three-year", "total cost", "maintain"]
answer_seconds: 180
example: "I would not start from price, because five engineers and ₹1.5 crore are in the same range. I would ask where the six teams lose time. If it is generic work like parsing PDFs, connectors and reindexing, a vendor can do that. But our eval sets and our data must stay under our control, because that is how we judge any platform. So I would run a four-week trial on our two hardest pipelines, legal contracts and Hindi support articles, and compare recall and answer quality with what we have today. I would also check that document permissions are enforced at query time, how we export our index, and the exit cost. Then I compare cost over three years, including migration of six pipelines and the maintenance we still keep."
