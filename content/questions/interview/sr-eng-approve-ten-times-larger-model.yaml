answer_seconds: 180
example: "Before approving ₹3 crore I would want to know what limits the model. I would ask the team for two learning curves: quality against model size at fixed data, and quality against data size, using subsets of 25, 50 and 100%. If the data curve is still rising and the size curve is flat, the bottleneck is data or label noise, and the money should go there instead. If size still helps, I convert the gain: at our volume, 0.3% better ranking may be worth ₹1 crore a year, or ₹10 crore. Then I add serving cost, because a model ten times larger may miss our 50 millisecond latency budget. I would fund one small run at three times the size first, with a clear stop rule if the gain is under 0.2%."
