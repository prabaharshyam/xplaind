id: sr-eng-approve-ten-times-larger-model
question: "Your ranking model's gains are slowing: the last doubling of parameters gave 0.3% better accuracy, and the team asks for ₹3 crore of GPU budget to train a model ten times larger. How do you decide whether to approve it?"
kind: scenario
short_answer: "I would ask what limits the model today: capacity, data or labels. Learning curves on model size and on data size answer that cheaply. Then I translate the expected gain into business value, add the higher serving cost and latency, and compare with other uses of ₹3 crore. I would fund a small test before the full run."
deeper_answer: "Bigger models help when the model is the bottleneck. If training and validation error are both high, more capacity may help. If the model already fits the training data well and validation lags, more or cleaner data usually gives more. A plot of quality against data size at fixed model size, and against model size at fixed data, costs a few small runs and shows which curve is still rising.\n\nThe second half is economics. A model ten times larger costs more for every prediction, not only for training, and may break a latency budget, which can force distillation later. A 0.3% gain can still be worth crores at very large volume, so the candidate should convert it to revenue instead of dismissing it. Interviewers listen for a diagnosis of the bottleneck, inclusion of serving cost, a comparison with other uses of the money, and a staged decision with a stop rule."
follow_ups:
  - "How do you tell from training and validation error whether a bigger model will help?"
  - "The larger model is better but too slow to serve. What are your options?"
  - "What stop rule would you set before the first run?"
common_mistakes:
  - "Approving because bigger models usually win"
  - "Counting training cost and ignoring serving cost"
  - "Rejecting a small percentage gain without converting it to value"
level: P3
