answer_seconds: 180
example: "I would ask which columns I need and how big the result is. Here I need only city and amount, and the result is one row per city, so it fits in memory. I read the file in chunks with pd.read_csv, passing usecols for the two columns and a chunksize of one million rows. For each chunk I group by city and compute the sum and the count of amount. I add these to running totals, with fill_value=0 for a city that is absent from a chunk. At the end the mean is the total sum divided by the total count. I do not take a mean of the chunk means, because chunks have different numbers of rows per city. It is one pass over the file. I would test it on a small file with a chunksize of 3 and compare with the result of loading it all at once."
