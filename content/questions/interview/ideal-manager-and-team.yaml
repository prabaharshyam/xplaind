id: ideal-manager-and-team
question: "What kind of manager and team do you work best with?"
kind: real-life
short_answer: "Describe the working conditions where you do your best, such as clear goals, regular feedback and open discussion, and give a short example. Then show you can adapt to other styles. Do not describe a perfect manager or criticise a past one. Keep it about how work gets done."
deeper_answer: "The interviewer may be your future manager. They are checking whether their style suits you, and whether you are easy to manage. A list of demands worries them. So does \"I can work with anyone\", because it tells them nothing.\n\nUse three parts: what helps you most, an example of it working, and how you adjust when you do not get it. For example: \"I do my best work when the goal is clear and I am trusted with the method. My last lead gave me the target and a weekly review, and that worked well.\" Then say what you offer the team in return: clear updates, help for juniors, honest views. You can end by asking how their team works."
follow_ups:
  - "Tell me about a manager you found difficult to work with."
  - "How do you handle a teammate who does not deliver?"
  - "Do you prefer working alone or in a team?"
common_mistakes:
  - "Criticising a previous manager"
  - "Listing demands with nothing offered in return"
  - "Saying \"I can work with anyone\" and stopping there"
level: I3
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Describes specific conditions where they work best"
    keywords: ["clear goal", "feedback", "trust", "review", "openly"]
  - point: "Gives an example from a past team or manager"
    keywords: ["my lead", "my manager", "my last", "current team", "for example"]
  - point: "Shows they can adapt to different styles"
    keywords: ["adapt", "adjusted", "adjust", "flexible", "also worked"]
  - point: "Says what they contribute to the team"
    keywords: ["i share", "updates", "help juniors", "from my side", "contribute"]
answer_seconds: 90
example: "I do my best work with a manager who sets a clear goal, trusts me with the method and reviews my work often. In my current team in Pune, where I have tested AI systems for security problems for three years, my lead gives me a target such as \"find how this chatbot can leak customer data\" and then reviews my findings every Friday. That weekly review has caught weak reports before they reached the client. I have also worked under a lead who checked every step. It was slower for me, but I adjusted by sending short daily notes, and it worked. In a team, I like people who question each other's findings openly. From my side, I share what I learn and help juniors write reports."
