id: changed-your-mind
question: "Tell me about a time you were wrong and changed your mind."
kind: real-life
short_answer: "Choose a time you held a view firmly and it was wrong. Say what you believed and why, what evidence or person changed your mind, and how you said so openly. Then say what you did next. Show that being right matters less to you than getting the right result."
deeper_answer: "The interviewer is checking whether you can update your view when the facts change. In AI work, strong opinions about models and methods go out of date quickly. People who cannot admit a mistake slow the whole team.\n\nSituation: the decision and your first view. Task: what depended on it. Action: what challenged your view and how you tested it. A good line is: \"I said in the team meeting that I had been wrong and that her approach was better, and I thanked her.\" Result: what the team did and how it turned out. Give credit to the person who was right. Do not choose a case where you were only slightly wrong."
follow_ups:
  - "How did it feel to say you were wrong in front of the team?"
  - "What do you believe strongly now that could be wrong?"
  - "How do you tell when to hold your view and when to change it?"
common_mistakes:
  - "Choosing a case where you were in fact right"
  - "Changing your mind only because a senior person said so"
  - "Not giving credit to the person who was right"
level: I2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "States the view they held and why"
    keywords: ["i was sure", "believed", "thought", "convinced", "said so strongly"]
  - point: "Says who or what challenged it"
    keywords: ["teammate", "suggested", "evidence", "colleague", "asked if"]
  - point: "Tested it fairly"
    keywords: ["test both", "tested", "queries", "compared", "measured"]
  - point: "Admitted the mistake openly and gave credit"
    keywords: ["had been wrong", "i was wrong", "thanked", "admitted", "credit"]
  - point: "Gives what happened next"
    keywords: ["shipped", "result", "one week", "decided", "added"]
answer_seconds: 120
example: "I was an ML engineer building search for an online shop with about 2,000 handicraft products. I was sure we needed vector search with embeddings, and I said so strongly in our planning meeting. A newer teammate suggested plain keyword search first. I dismissed it as old technology. She asked if we could test both, which was fair. We wrote 100 real customer queries and marked the correct products. Keyword search found the right product in the top five for 82 queries, and vector search for 84. Vector search also needed an extra service and more money each month. I had been wrong about how big the gap was. I said so in the next team meeting and thanked her. We shipped keyword search in one week and added vector search later, only for the queries where keywords failed."
