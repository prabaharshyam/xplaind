example: "First the shapes: the documents are a matrix of n rows by d columns, and the query is one vector of length d. Cosine similarity is the dot product divided by the two lengths. So I normalise each row to unit length, normalise the query, and then one matrix product gives all n scores. In one line, sims is M @ q on the normalised arrays. I guard the division with a small epsilon, so a zero vector scores 0 and not NaN. For the top k I do not sort everything. I use argpartition to pull out the k best in linear time, then sort only those k, because argpartition returns them unordered. The cost is n times d for the scores, plus k log k. I would test it against a simple loop, and with k larger than n, where I clamp k."
