id: competing-priorities
question: "Tell me about a time you had too many things to do. How did you decide what to do first?"
kind: real-life
short_answer: "Describe a real week with too much work. List the tasks briefly, then explain your rule for ordering them: user impact, deadline and who was blocked. Say what you did first, what you moved or gave to someone else, and that you told the people affected. End with what got done."
deeper_answer: "The interviewer is checking whether you have a method, or whether you simply work longer hours. They also check whether you tell people when their work has to wait.\n\nSituation: the tasks and why they came at the same time. Task: you could not do all of them well. Action: how you ranked them and who you spoke to. A good line is: \"I asked my manager to confirm the order, because the report was his priority and I was about to delay it.\" Result: what was delivered, what moved, and whether anyone was surprised. Do not say you did everything by working all night. That is not a method, and it cannot be repeated."
follow_ups:
  - "What did you choose not to do, and who did you tell?"
  - "What if two tasks are equally urgent?"
  - "How do you plan your week now?"
common_mistakes:
  - "Saying you worked all night and did everything"
  - "Giving no rule for the order you chose"
  - "Delaying someone's work without telling them"
level: I1
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Lists the competing tasks clearly"
    keywords: ["three things", "tasks", "same week", "bug", "demo", "report"]
  - point: "Explains the rule used to rank them"
    keywords: ["ranked", "impact", "priority", "urgent", "fixed dates"]
  - point: "Asked for help or moved a deadline openly"
    keywords: ["asked my manager", "teammate", "moved", "help"]
  - point: "Told the people affected and got agreement"
    keywords: ["told", "informed", "agreed", "confirm"]
  - point: "Gives what was delivered"
    keywords: ["went live", "delivered", "went well", "new date", "done"]
answer_seconds: 120
example: "Six months into my first job as an ML engineer, three things came in the same week. Our product recommendation model had a bug that showed out-of-stock items to about 20 percent of users. A client demo was on Thursday. And my quarterly evaluation report was due on Friday. I could not do all three well. I ranked them by user impact and by fixed dates. The bug hurt real users every hour, so it came first. The demo date could not move, so it came second. I asked my manager if the report could move to the next Monday, and he agreed. I also asked a teammate to prepare the demo data while I fixed the bug. The fix went live on Tuesday, the demo went well, and the report reached him on the new date."
