id: sr-eng-disagree-with-finetune-decision
question: "Your CTO has approved ₹2 crore to fine-tune your own model because the assistant gets 30% of policy questions wrong, but your analysis says most errors come from retrieval returning the wrong documents. How do you handle the disagreement?"
kind: real-life
short_answer: "I would bring evidence, not opinion. I would label a sample of failures by cause, show that most are retrieval misses, and propose a cheap two-week retrieval fix with a target. I would say clearly what fine-tuning can and cannot fix, ask what the CTO knows that I do not, and commit fully once the decision is made."
deeper_answer: "Fine-tuning changes how a model behaves, such as tone, format and domain language. It does not give the model a document that retrieval failed to find. If 70% of wrong answers had the wrong context, fine-tuning addresses at most the rest. That is the technical case, and it should be shown with a failure breakdown on 200 real questions, not argued in the abstract.\n\nThe leadership part is how you raise it. Ask for the CTO's reasons first: there may be a data residency, cost or strategy reason you have not seen. Offer a sequence instead of a veto: fix retrieval for two weeks, measure again, and fine-tune only the remaining gap, which protects most of the budget. Put the recommendation in writing. If the CTO still decides to fine-tune, support it and build the eval that will show the result. Interviewers listen for evidence, respect, a reversible proposal and full commitment after the decision."
follow_ups:
  - "The CTO says fine-tuning is also about owning the model. Does that change your view?"
  - "How would you label 200 failures by cause quickly and fairly?"
  - "What do you do if the fine-tuned model ships and the errors stay?"
common_mistakes:
  - "Arguing from opinion with no failure analysis"
  - "Challenging the CTO in public before asking for the reasons"
  - "Quietly doing the minimum after losing the argument"
level: P3
topic: approach-choice
stop_id: prompt-rag-or-finetune
rubric:
  - point: "Brings a failure breakdown by cause from real questions"
    keywords: ["breakdown", "label", "by cause", "failure analysis", "categor", "root cause"]
  - point: "Explains what fine-tuning can and cannot fix"
    keywords: ["cannot fix", "tone", "behaviour", "behavior", "fine-tun", "fine tun"]
  - point: "Asks for the CTO's reasons before arguing"
    keywords: ["ask for the reasons", "reason i do not know", "reasons", "understand", "listen"]
  - point: "Proposes a cheap, time-boxed retrieval fix with a target first"
    keywords: ["two weeks", "target", "fix retrieval", "experiment", "time-box", "pilot"]
  - point: "Commits to the final decision and measures it"
    keywords: ["support the decision", "commit", "measure", "decision"]
answer_seconds: 180
example: "I would not say 'this is wrong' in a meeting. I would take 200 failed policy questions and label each one by cause. Suppose 140 had the wrong documents retrieved, 40 had the right documents but a bad answer, and 20 were unclear questions. That breakdown shows that fine-tuning, which changes tone and behaviour, cannot fix 70% of the errors. Then I would meet the CTO alone and first ask for the reasons, because there may be a strategy or data reason I do not know. My proposal would be a sequence: give me two weeks to fix retrieval with a target of 15% errors, then fine-tune only for the gap that remains. If the CTO still chooses fine-tuning now, I would support the decision and build the eval that will measure it."
