answer_seconds: 150
example: "I would clarify what is worth remembering and the privacy rules, then build three layers. The recent turns go into the context word for word. Older turns in the session become a rolling summary. After each session, a background job will extract facts and preferences, such as a food preference or a current project, and save each one to a long-term store for that user with a timestamp and a source. On a new message, the system retrieves only the five or so memories that are relevant, using embeddings and recency, so the prompt stays within a fixed token budget. When a fact changes, the new one will replace the old one, not sit next to it. The trade-off is recall against noise and privacy, so I store little and let users view and delete every memory. I would evaluate with long test conversations that ask about earlier facts."
