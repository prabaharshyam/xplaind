answer_seconds: 90
example: "For a travel-booking assistant: short-term memory is this chat, such as 'Mumbai to Goa next Friday, window seat'. Long-term memory is what we store after the user agrees, such as 'vegetarian, prefers morning flights', in a profile table, loaded at the start of the next session. A past-trips log is episodic memory we search when the user says 'book the same hotel as last time'. The user can see and delete it in settings."
