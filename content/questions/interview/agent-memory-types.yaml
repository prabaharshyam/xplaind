id: agent-memory-types
question: "What kinds of memory can an agent have, and how do you implement them?"
short_answer: "Short-term memory is the conversation and working state in the context window. Long-term memory persists across sessions: facts about the user, past decisions or summaries, stored in a database or vector store and retrieved when relevant. Some systems separate episodic memory (what happened) from semantic memory (what is true). Write memory selectively and let users see and delete it."
deeper_answer: "Implementation choices: keep recent turns verbatim and summarise older ones; extract durable facts with a model call after a session and store them with a timestamp and source; retrieve by similarity or by key when a new session starts. LangGraph, for example, separates thread-level checkpoints from a cross-thread store.\n\nThe hard parts are deciding what is worth remembering, updating facts that change, and privacy. Storing everything bloats context and can surface stale or sensitive information."
follow_ups:
  - "How would you handle a remembered fact that is now out of date?"
  - "What memory would you never store?"
common_mistakes:
  - "Stuffing the whole history into every prompt"
  - "No way for users to see or delete memories"
