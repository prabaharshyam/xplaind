id: attention-high-level
question: "At a high level, what does attention do in a transformer?"
short_answer: "Attention lets each token look at the other tokens in the input and decide which ones matter for understanding it. For example, in \"the bank of the river\", attention helps \"bank\" draw meaning from \"river\". Stacking many attention layers lets the model build up context across a whole passage."
deeper_answer: "In a transformer each token is turned into a vector. In an attention layer, every token computes how relevant every other token is to it and takes a weighted mix of their information. Multi-head attention does this several ways at once, so different heads can track different relationships, such as grammar or reference.\n\nFor generation, models use causal attention: a token can attend only to earlier tokens, which is what makes next-token prediction possible. Attention cost grows with the square of the input length in the basic form, which is one reason long context is expensive."
follow_ups:
  - "Why can a generating model only attend to earlier tokens?"
  - "Why does long input make attention expensive?"
common_mistakes:
  - "Describing attention as the model looking things up on the internet"
  - "Going deep into maths without first giving the intuition"
