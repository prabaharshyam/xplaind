id: how-much-training-data
question: How do you know whether you have enough training data?
kind: concept
short_answer: There is no fixed number; it depends on the task, base model and method. Start with 50 to
  100 excellent examples and check they help. Then train on 25%, 50% and 100% of the data and score each
  on the same test set. A rising curve says collect more; a flat one says improve quality or coverage.
deeper_answer: 'Simple tasks and strong base models need less data; light methods like LoRA work with
  hundreds to thousands of examples, while full fine-tuning usually wants far more. Gains usually shrink
  as the set grows.


  If a small set shows no gain at all, more of the same rarely fixes it: check the format, prompt and
  settings. Look at scores by segment too, since a flat overall curve can hide one weak group, such as
  a second language, that needs targeted examples.'
follow_ups:
- What would you do if the curve is flat but one segment is weak?
- How does the choice of LoRA or full fine-tuning change the answer?
common_mistakes:
- Quoting a fixed number of examples
- Never measuring a learning curve
