id: sr-lead-pm-did-ai-programme-work
question: "After one year and ₹3 crore spent on 6 AI features, the board asks you one question: did it work? How do you answer?"
kind: use-case
short_answer: "I would answer feature by feature against the targets agreed at the start, not with one total. For each: the outcome with and without the feature, using a holdout group where we have one, and the full cost. Then a plain verdict: which worked, which did not, which we closed, and what we will fund next year."
deeper_answer: "A board does not want usage charts. It wants to know if the money produced an outcome and what you learned. The honest structure is a portfolio view: 6 features, each with its target, its result and its full cost, including model spend, people and support. Where possible, show the difference against a holdout group that did not get the feature, because a metric can rise for other reasons, such as a festival season or a price change.\n\nThe trade-off is between a simple story and an accurate one. Most portfolios have two clear wins, two unclear results and two failures. Saying so builds trust and makes the next budget request stronger. For example: the support assistant cut cost per ticket by 22%, while the AI search feature showed no change in conversion and was closed. Interviewers listen for targets set in advance, attribution, full cost, and a clear decision about each feature."
follow_ups:
  - "One feature has high usage but no measurable outcome. Keep it or close it?"
  - "You had no holdout group. How do you estimate the effect now?"
  - "What would you set up differently at the start of next year?"
common_mistakes:
  - "Reporting usage as proof of value"
  - "One blended number for all features"
  - "Leaving people cost out of the total"
level: P3
topic: product
stop_id: kpi-that-matters
rubric:
  - point: "Reports each feature against targets agreed in advance"
    keywords: ["target", "agreed", "each feature"]
  - point: "Shows attribution with a holdout or comparison group"
    keywords: ["holdout", "control group", "comparison", "experiment"]
  - point: "Counts the full cost, not only model spend"
    keywords: ["full cost", "people", "total cost"]
  - point: "Gives a plain verdict, including failures"
    keywords: ["did not", "closed", "no change", "failed"]
  - point: "Says what will be funded or stopped next"
    keywords: ["next year", "fund", "stop"]
answer_seconds: 180
example: "I would not give the board one big number. I would show a single page with all 6 features: the target we agreed at the start, the result, and the full cost including people, not only model spend. Where we kept a holdout group, I would show the difference. For example, the support assistant cut cost per ticket by 22% against the holdout, so it clearly worked. AI search showed no change in conversion, so we closed it in month nine. Two features are still unclear and I would say that plainly. My summary would be: two worked, two did not, two need one more quarter. Then I would say what we will fund next year and what we will stop."
