id: context-window
question: "What is a context window, and what happens when a conversation gets too long?"
short_answer: "The context window is the maximum number of tokens the model can consider in one request: system prompt, conversation history, documents and its own reply together. When you go past it, the request fails or something must be cut, so apps trim, summarise or retrieve only the relevant parts."
deeper_answer: "Everything the model sees in one call shares the window. In a long chat, each turn resends the earlier turns, so the input grows. Common strategies are to drop the oldest turns, summarise earlier parts, or store information outside the prompt and retrieve only what the current question needs.\n\nA bigger window is not free: more input tokens cost more and take longer, and models can pay less attention to material buried in the middle of a very long input. So even with a large window, sending only what is relevant usually gives better and cheaper answers."
follow_ups:
  - "If the window is huge, why use RAG at all?"
  - "How would you handle a chat that runs for hundreds of turns?"
common_mistakes:
  - "Thinking only the latest message counts towards the limit"
  - "Assuming a larger window always gives better answers"
