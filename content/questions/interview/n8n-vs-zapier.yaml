id: n8n-vs-zapier
question: "How would you choose between n8n, Zapier, Make and Power Automate?"
short_answer: "Match the tool to the client. Zapier is the easiest with the most app connectors; Make handles complex visual flows at lower cost; n8n is open source and can be self-hosted, which suits data control and heavy use; Power Automate fits companies already on Microsoft 365. Compare connectors needed, pricing at expected volume, data residency, and who will maintain it."
deeper_answer: "Pricing models differ: some charge per task or operation, so a workflow with many steps running thousands of times a day can get expensive; self-hosted n8n trades licence cost for hosting and maintenance effort. Check prices on the vendors' pages at the time, because they change.\n\nThe maintainer matters as much as the features: a tool the client's team can understand and fix beats a cleverer one only you can run."
follow_ups:
  - "How would volume change your choice?"
  - "When would you recommend self-hosting?"
common_mistakes:
  - "Picking a tool before knowing the apps and volume"
  - "Quoting prices from memory"
