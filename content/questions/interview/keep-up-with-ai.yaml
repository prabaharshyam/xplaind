id: keep-up-with-ai
question: "How do you keep up with changes in AI?"
short_answer: "Name a small, real routine: a few trusted sources such as provider docs and changelogs and practitioners' blogs, building small experiments when something new appears, and checking claims against your own tests rather than hype. Give a recent example of something you tried and what you learned."
deeper_answer: "Interviewers want to see curiosity with judgement. Specific beats general: \"when structured outputs came out I rebuilt my extraction script with it and compared error rates\" is stronger than \"I follow AI news\".\n\nMention how you filter: preferring primary sources such as documentation, papers and engineering write-ups, and testing on your own tasks before adopting something. Being honest that you cannot follow everything is fine."
follow_ups:
  - "What is something new you tried recently, and was it useful?"
  - "How do you decide whether a new tool is worth adopting?"
common_mistakes:
  - "Listing influencers instead of describing what you actually do"
  - "Claiming to follow everything"
level: I1
topic: behavioral
stop_id: design-interview
rubric:
  - point: "Names a small set of trusted sources"
    keywords: ["source", "docs", "changelog", "blog", "newsletter", "papers"]
  - point: "Builds small experiments"
    keywords: ["experiment", "try", "build", "prototype"]
  - point: "Checks claims against own tests, not hype"
    keywords: ["hype", "test", "verify", "check"]
  - point: "Gives a recent concrete example"
    keywords: ["recent", "example", "last week", "last month", "recently"]
answer_seconds: 60
