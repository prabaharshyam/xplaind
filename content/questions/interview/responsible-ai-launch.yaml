id: responsible-ai-launch
question: "What responsible AI checks would you run before launching an AI feature?"
kind: use-case
short_answer: "Identify who could be harmed and how; test quality and fairness across user groups and languages; red-team for misuse, prompt injection and harmful output; check privacy and data handling against the DPDP Act and your policies; make sure users know they are dealing with AI; set up monitoring, an incident process and an owner; and document decisions."
deeper_answer: "Frameworks help structure this: the NIST AI Risk Management Framework's govern, map, measure and manage functions, and the EU AI Act's risk tiers if you serve EU users. Scale effort to risk: a writing helper needs less than a credit decision.\n\nA launch checklist with named sign-offs turns principles into practice, and a post-launch review after a few weeks catches what testing missed."
follow_ups:
  - "How would you scale these checks for a low-risk feature?"
  - "Who should sign off?"
common_mistakes:
  - "Treating responsible AI as a one-time checkbox"
  - "No owner after launch"
level: I3
topic: governance
stop_id: ai-risk-frameworks
rubric:
  - point: "Identifies potential harms and affected people"
    keywords: ["harm", "who could", "affected", "impact"]
  - point: "Tests fairness across groups and languages"
    keywords: ["fair", "group", "language", "bias"]
  - point: "Red-teams misuse and injection"
    keywords: ["red team", "red-team", "misuse", "injection", "abuse"]
  - point: "Privacy and law, such as DPDP"
    keywords: ["privacy", "dpdp", "data", "law"]
  - point: "Transparency, monitoring, owner and incident process"
    keywords: ["transparen", "disclos", "monitor", "owner", "incident"]
answer_seconds: 120
example: "Before launching an AI loan-eligibility explainer, we listed who could be harmed: applicants misled about eligibility. We tested answers in English, Hindi and Tamil, checked results across income groups, red-teamed for prompts asking it to promise approval, confirmed only needed data was used under our privacy policy, labelled it as AI, named a product owner, and set up a kill switch and an incident channel."
