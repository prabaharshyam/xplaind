id: decision-without-full-information
question: "Tell me about a decision you made without all the information."
kind: real-life
short_answer: "Pick a decision where waiting for full information had a cost. Say what you knew, what you did not know, and why you could not wait. Explain how you limited the risk: a reversible step, a small test or a clear point to stop. Then give the outcome and what you learned."
deeper_answer: "The interviewer is checking judgement under uncertainty. Senior people rarely have all the facts. They want to hear how you compare the cost of waiting with the cost of being wrong.\n\nSituation: the decision and the time pressure. Task: what could be lost. Action: what you knew, what was missing, and how you chose. A good line is: \"I did not know the cause, but a rollback took five minutes and could be undone, so I chose it over thirty more minutes of looking.\" Result: what happened, and what you found later. If the decision turned out wrong, you can still use it. A sound decision and a good outcome are not the same thing."
follow_ups:
  - "What would you have done if the decision could not be undone?"
  - "What information did you wish you had?"
  - "Tell me about such a decision that turned out wrong."
common_mistakes:
  - "Describing a guess with no reasoning behind it"
  - "Not saying what was unknown"
  - "Judging the decision only by the outcome"
level: P2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "States the decision and the time pressure"
    keywords: ["2 am", "urgent", "every minute", "pressure", "had to decide"]
  - point: "Says what was known and what was not"
    keywords: ["did not know", "not sure", "unknown", "unclear", "without knowing"]
  - point: "Explains the cost of waiting"
    keywords: ["waiting", "could take", "every minute", "cost", "failed payments"]
  - point: "Limited the risk with a reversible or small step"
    keywords: ["rollback", "rolled back", "undone", "reversible", "small test", "pilot"]
  - point: "Gives the outcome and what was learned"
    keywords: ["returned to normal", "we found", "result", "learned", "we added"]
answer_seconds: 120
example: "I was the MLOps engineer on call for a fraud detection model at a payments company. At 2 am, response time rose from 80 to 600 milliseconds, and some payments started to time out. We had released a new model version that evening, but traffic was also high because of a sale. I did not know which one was the cause. Finding out could take an hour, and every minute meant failed payments. A rollback took five minutes and could be undone, so I rolled back without knowing the cause and told the team channel why. Response time returned to normal in ten minutes. Next morning we found the new version used more features, which slowed each request. We added a load test before every release. If I had been wrong, we would have lost only five minutes."
