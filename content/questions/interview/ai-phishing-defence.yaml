id: ai-phishing-defence
question: "Attackers now use LLMs to write phishing emails. What changes for defenders, and what still works?"
kind: concept
short_answer: "AI makes phishing fluent, personalised and cheap, in any language, so spotting bad grammar no longer works. What still works are controls that do not depend on the wording: DMARC and sender checks, link and attachment analysis, phishing-resistant MFA, process checks for payments and data requests, and training people to verify the request rather than judge the writing."
deeper_answer: "LLMs help attackers research targets from public profiles, write convincing messages in Hindi, Tamil or English, and run many variations, which weakens filters that match known text. They also power chat-based scams that keep a conversation going.\n\nDefenders should lean on signals attackers cannot easily fake: sender authentication, domain age and reputation, unusual sending patterns, links to newly registered domains, and requests that break normal process. Phishing-resistant MFA removes much of the payoff of stolen passwords. Update training: teach 'check the request and the channel', not 'look for typos'. Defenders can also use AI, for example classifiers and LLM triage of reported emails, while keeping a human in the loop."
follow_ups:
  - "Which detection signals still work when the text is perfect?"
  - "How would you change your phishing training?"
common_mistakes:
  - "Still teaching staff to look for spelling mistakes"
  - "Assuming a better content filter alone is enough"
level: I2
