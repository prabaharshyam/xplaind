answer_seconds: 90
example: "At a hypothetical Coimbatore college, staff received a flawless Tamil email from the 'principal' asking for gift card codes. Our filter missed it because the text was new, but the sender domain was two days old. We added a rule to flag mail from newly registered domains that mention payment or gift cards, and changed training to 'verify through a known channel'."
