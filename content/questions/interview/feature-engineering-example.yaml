rubric:
  - point: "Gives a concrete domain example"
    keywords: ["example", "delivery", "sales", "customer", "fraud", "house"]
  - point: "Explains the transform: dates, ratios, aggregates or encodings"
    keywords: ["hour", "day", "ratio", "average", "aggregate", "encod"]
  - point: "Reasons from what drives the target"
    keywords: ["drive", "because", "signal", "reason"]
  - point: "Validates the gain and avoids leakage"
    keywords: ["validat", "compare", "leak", "importance"]
answer_seconds: 90
example: "On a project predicting late deliveries for a grocery app, the raw order time and addresses gave a weak model. I added hour of day, whether it was raining from a weather feed, the store's average picking time over the last hour, and road distance instead of straight-line distance. The rain and recent-picking-time features made the biggest difference on validation data, and I checked neither used information from after the order."
