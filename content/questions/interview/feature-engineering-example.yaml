id: feature-engineering-example
question: "Give an example of feature engineering that made a model better."
short_answer: "Turn raw data into signals the model can use. For a food delivery time model, a raw timestamp helps little, but hour of day, day of week, whether it is a festival day, distance from restaurant to customer and the restaurant's recent average preparation time capture what really drives delay. Check each feature on validation data and watch for leakage."
deeper_answer: "Good answers name the domain reasoning, not just the technique. Common transforms: extracting parts of dates, ratios such as amount over the customer's average, counts and aggregates over a time window, text length or keyword flags, and encodings for categories, such as target encoding fitted inside training folds.\n\nThen prove value: compare validation scores with and without the feature, and look at feature importance. Be careful that aggregates use only past data at prediction time. Tree models need less scaling and fewer interaction features than linear models, which is worth saying if you mention model choice."
follow_ups:
  - "How would you encode a category with thousands of values?"
  - "How do you know a new feature really helped?"
common_mistakes:
  - "Listing techniques with no domain reason"
  - "Building aggregates that include the future"
