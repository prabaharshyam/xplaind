id: ai-invoice-extraction
question: "Design an automation that reads supplier invoices from email and enters them into accounting software."
kind: use-case
short_answer: "Trigger on new emails with attachments, extract text from the PDF or image, then ask a language model to return fixed JSON fields (supplier, GSTIN, invoice number, date, line items, tax, total) using structured output. Validate in code (totals add up, valid GSTIN, no duplicates), send failures to a person, then create the bill."
deeper_answer: "The model does the reading; code does the checking. Keep a human approval step at first and measure accuracy on a sample of real invoices before letting clean ones go straight through.\n\nAlso think about data: invoices contain business and sometimes personal data, so use an approved provider, keep files in the company's storage, and log every action for audit."
follow_ups:
  - "What checks would you run on the extracted totals?"
  - "When would you remove the human approval step?"
common_mistakes:
  - "Trusting model output without validation"
  - "No duplicate check"
level: I1
topic: automation
stop_id: document-extraction-automation
rubric:
  - point: "Email trigger and text extraction or OCR"
    keywords: ["email", "trigger", "attachment", "ocr", "pdf"]
  - point: "Model returns fixed structured fields"
    keywords: ["json", "structured", "schema", "fields"]
  - point: "Validates in code: totals, formats, duplicates"
    keywords: ["validat", "total", "gstin", "duplicate", "check"]
  - point: "Human review for failures or low confidence"
    keywords: ["human", "review", "approval", "exception"]
  - point: "Measures accuracy and logs actions"
    keywords: ["accuracy", "measure", "log", "audit"]
answer_seconds: 120
example: "For a trading company I built this in n8n: an email trigger for the accounts inbox, a PDF-to-text step, and a model call returning JSON with supplier, GSTIN, invoice number, date, line items, tax and total. A code step checked that totals added up, the GSTIN was 15 characters in the right pattern, and the invoice number was not already in Tally. Anything failing went to the accountant's queue; the rest created a draft bill."
