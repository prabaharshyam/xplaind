answer_seconds: 150
example: "I would first ask about the line format and whether some lines can be malformed. I will assume five space-separated fields with the status last. I open the file and loop with for line in f, which reads line by line, so only one line is in memory at a time. I would not call readlines, because that loads the whole file. For each line I split it, and if it does not have five parts I skip it and count it as a bad line. If the status is 500, I do counts[path] += 1 on a Counter. That is one pass, O(n) in the number of lines, and memory depends only on the number of distinct paths. On a small sample with two 500s for /predict and one for /health, I get 2 and 1. I would also test a blank line."
