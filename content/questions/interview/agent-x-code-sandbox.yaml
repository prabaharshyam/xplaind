    keywords: ["limit", "memory", "seconds", "delete", "destroy", "timeout"]
answer_seconds: 140
example: "I treat both the generated code and the uploaded file as untrusted, because a spreadsheet cell can contain instructions in plain text. Each session gets its own environment: a hardened container that starts in a few seconds and lives only for that session. It runs as a non-root user from a read-only image with pandas and matplotlib already installed. There are no credentials inside it, not even a read key for our storage. The user's file is copied in, and nothing else is mounted. Outbound network is off by default, so even if the code tries to post data somewhere, it cannot. I set a limit of 2 GB of memory and 60 seconds per run. Charts and tables come back through one output folder with a size cap. When the session ends, I delete the container and its disk."
