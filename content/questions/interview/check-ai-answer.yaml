id: check-ai-answer
question: "How do you check whether an answer from an AI assistant is correct?"
short_answer: "Treat it as a draft, not a fact. Check claims that matter against a trusted source, such as an official website, the original document or a person who knows. Ask the assistant for its sources and open them. Be extra careful with numbers, dates, names, quotes, laws and anything medical or financial."
deeper_answer: "AI assistants can produce confident, fluent answers that are wrong, a problem called hallucination. Fact-checkers use lateral reading: leave the answer and see what other reliable sources say about the same claim.\n\nUseful habits: ask the same question a different way and see if the answer changes; ask the assistant what it is unsure about; and for work, keep a human responsible for anything that goes out under your name."
follow_ups:
  - "What kinds of answers would you never use without checking?"
  - "What is lateral reading?"
common_mistakes:
  - "Trusting an answer because it sounds confident"
  - "Asking the same AI to confirm its own answer and stopping there"
level: B1
