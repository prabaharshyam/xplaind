id: sr-lead-gov-exception-and-risk-acceptance
question: "Business units ask you for about 14 exceptions to the AI policy every quarter, and some heads simply approve their own. Design the exception and risk acceptance policy: who may accept which risk, and for how long?"
kind: use-case
short_answer: "Exceptions are allowed, but never self-approved. The person who accepts a risk must be senior enough to answer for the loss and must not be the requester. Low risk: the unit head with my team's advice. High risk: a risk committee or a named executive. Every exception is written, has added controls, an end date, and goes in a register."
deeper_answer: "A policy with no exceptions gets ignored, and a policy with easy exceptions means nothing. The design question is who has the authority to accept a risk on behalf of the company. Two rules help. The person who gains from the exception should not be the person who approves it. And the level of approval should rise with the possible harm: a unit head for low risk, the chief risk officer or a committee for anything that affects customers' money, jobs or health.\n\nGovernance advises and records. It should not own the business risk, or it becomes the team that always says no. Each exception needs a reason, the extra controls, an owner and an end date, for example 90 days, after which it is renewed or closed. Some things cannot be excepted at all, such as legal duties. Review the register each quarter: 14 exceptions on the same rule means the rule needs to change. Interviewers listen for separation of duties, time limits and learning from patterns."
follow_ups:
  - "A unit head says an exception is urgent and the committee meets in three weeks. What do you do?"
  - "What would you never allow an exception for?"
  - "What do you do when the same exception is requested every quarter?"
common_mistakes:
  - "Letting requesters approve their own exceptions"
  - "Exceptions with no end date"
  - "Governance accepting the risk in place of the business"
level: P3
topic: governance
stop_id: writing-ai-policy
rubric:
  - point: "Separates the requester from the approver"
    keywords: ["own exception", "requester", "different people", "self-approv", "separat"]
  - point: "Raises the approval level with the size of the risk"
    keywords: ["high risk", "committee", "approval level", "chief risk"]
  - point: "Requires a written record with added controls and an owner"
    keywords: ["register", "extra controls", "compensating", "owner", "written"]
  - point: "Sets an end date and a review"
    keywords: ["end date", "90 days", "renew", "expir", "time limit"]
  - point: "Uses patterns to fix the policy; some rules allow no exception"
    keywords: ["no exception", "change the rule", "same rule", "legal duty", "pattern"]
answer_seconds: 180
example: "My first rule is that nobody approves their own exception. The requester and the approver must be different people. Second, the approval level depends on the risk. For low risk, the unit head can accept it after my team gives advice. For high risk, such as anything that affects customer money or hiring, it goes to the risk committee. Every exception is written in a register with the reason, the extra controls, an owner and an end date of 90 days. After that it is renewed or closed. Some things get no exception at all, for example a legal duty on personal data. Each quarter I review the register. If the same rule causes many requests, I change the rule."
