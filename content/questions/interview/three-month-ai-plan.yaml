id: three-month-ai-plan
question: "If you had three months to get comfortable using AI in your job, what would your plan be?"
kind: real-life
short_answer: "Month one: learn the basics and use an assistant daily on low-risk tasks, keeping notes on what works. Month two: pick two real tasks from my job, build a repeatable way to do them with AI, and measure the time saved. Month three: learn the risks and company rules, share what I learned, and pick the next skill."
deeper_answer: "A plan works when it is tied to your real work, not to watching videos. Daily practice on small tasks builds intuition about where AI is reliable and where it makes mistakes.\n\nMeasuring matters because it turns 'I use AI' into a result you can talk about, such as 'reports that took two hours now take forty minutes'. Learning the safety side, such as what data not to share and how to check answers, shows maturity. Teaching others is the fastest way to deepen your own understanding."
follow_ups:
  - "Which free courses would you use?"
  - "How would you show your manager it was worth the time?"
common_mistakes:
  - "Only watching courses without applying them to real tasks"
  - "Having no way to show results"
level: B1
topic: ai-literacy
stop_id: choosing-your-path
rubric:
  - point: "Starts with basics and daily practice on low-risk tasks"
    keywords: ["daily", "basics", "practice", "low risk"]
