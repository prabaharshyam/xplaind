answer_seconds: 90
example: "When my company encouraged everyone to use AI, I gave myself a twelve-week plan. For the first month I did a free beginner course and used an assistant every day for small things like rewriting emails. In the second month I picked my two biggest weekly chores, the sales summary and meeting notes, and built prompts I could reuse; the summary went from about ninety minutes to thirty. In the third month I read our AI policy, ran a short session for my team, and started learning spreadsheet automation next."
