id: trigger-action-workflow
question: "Walk me through building a simple automation in n8n or Zapier."
short_answer: "Every workflow starts with a trigger, such as a new form submission or a new row in a sheet. Then actions run in order: transform the data, call a service, send a message. For example: when a Google Form is submitted, add the lead to a CRM, send a WhatsApp or email confirmation, and post in the sales channel."
deeper_answer: "Good answers show the habits that make automations reliable: pin or save sample data while building, name each node clearly, map fields deliberately rather than by guesswork, and add an error path that notifies someone.\n\nMention where it runs: Zapier and n8n Cloud are hosted; n8n can also be self-hosted, which matters for cost and data residency."
follow_ups:
  - "How would you stop duplicate leads?"
  - "What happens if the CRM is down when the form is submitted?"
common_mistakes:
  - "Skipping testing with real-looking data"
  - "No error handling"
level: B2
