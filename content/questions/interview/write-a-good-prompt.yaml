id: write-a-good-prompt
question: "What makes a good prompt? Give an example."
short_answer: "A good prompt says who it is for, what you want, the context the assistant needs, and the format of the answer. Instead of 'write an email', say: 'Write a polite, three-line email to a customer whose order is delayed by two days, apologise, give the new date and offer free delivery next time.'"
deeper_answer: "Think of briefing a capable new colleague who knows nothing about your situation. Add examples when you want a particular style, ask for a table or bullet list when you need one, and say what to avoid.\n\nPrompting is a conversation: the first answer is a draft, and short follow-ups such as 'shorter', 'more formal' or 'use Indian rupees' usually get you the rest of the way."
follow_ups:
  - "How would you get the assistant to match your company's tone?"
  - "What do you do when the first answer is not right?"
common_mistakes:
  - "One vague line with no context"
  - "Giving up after the first answer"
level: B1
topic: ai-literacy
stop_id: prompting-without-jargon
rubric:
  - point: "States the task clearly"
    keywords: ["task", "what you want", "clear", "specific"]
  - point: "Gives context and audience"
    keywords: ["context", "audience", "who it is for", "background"]
  - point: "Specifies the format"
    keywords: ["format", "length", "bullet", "table", "lines"]
  - point: "Gives a concrete example prompt"
    keywords: ["example", "for instance", "email", "write a"]
  - point: "Iterates with follow-ups"
    keywords: ["follow-up", "follow up", "iterate", "refine", "change"]
