id: gov2-vendor-switches-on-ai
question: "A software tool your company already uses, for example the HR or CRM system, has switched on new AI features in an update. Nobody reviewed them. What do you do?"
kind: scenario
short_answer: "Find out what the feature does with our data: what is sent, to which model provider, and if it is used for training. Check the contract and the settings, and switch the feature off until reviewed if the data is sensitive. Then assess it like any new AI use, and fix procurement so vendor changes trigger a review."
deeper_answer: "Most AI now enters a company through tools it already bought, not through new projects. The original vendor review covered a product without these features, so the old approval does not cover the new data flows. A new sub-processor can also change what we promised our own customers and employees.\n\nI start with facts from the vendor's documentation and admin console: is it on by default, can it be disabled per group, does the vendor train on customer data, what is retained. I read the contract for terms on new features and sub-processors. For an HR system the data is sensitive, and a feature that ranks candidates has a higher risk than one that drafts an email. Then the lasting fix: contract clauses that require notice of material AI changes and no training on our data without agreement, an owner for each vendor, and a periodic check of release notes. Interviewers listen for data flow facts, a response based on risk and the procurement fix."
follow_ups:
  - "Which contract terms would you ask for at the next renewal?"
  - "The business likes the feature and wants it left on. How do you respond?"
  - "How do you keep track of AI features across 200 vendors?"
common_mistakes:
  - "Assuming the original vendor approval still covers it"
  - "Blocking everything without looking at the risk"
  - "No change to the contract or the review process"
level: I3
topic: governance
stop_id: security-questionnaires
rubric:
  - point: "Finds the facts: what data is sent, to whom, training and retention"
    keywords: ["what data", "train on", "retention", "sub-processor"]
  - point: "Checks the contract and the admin settings"
    keywords: ["contract", "admin console", "settings"]
  - point: "Switches off or limits the feature for sensitive data until reviewed"
    keywords: ["switch off", "until we assess", "sensitive"]
  - point: "Assesses by risk: a ranking feature differs from a drafting feature"
    keywords: ["risk", "ranks", "drafting", "assessment"]
  - point: "Fixes procurement: notice clauses, a vendor owner, an inventory"
    keywords: ["clause", "notice", "renewal", "inventory"]
answer_seconds: 120
example: "I would first get the facts. In the admin console and the vendor's documentation I would check what data the new feature sends, which model provider is the sub-processor, if they train on our data, and the retention period. Then I would read our contract for terms on new features. Suppose it is our HR system and the feature ranks candidates and drafts feedback. That is sensitive data and a high risk use, so I would ask the admin to switch off the ranking feature until we assess it, and maybe allow the drafting of job descriptions. Then I would run our normal AI assessment with HR. For the long term, at renewal I would add a clause that the vendor must give notice of AI changes and may not train on our data, and add this tool to our AI inventory with an owner."
