id: biased-applicant-ranking
question: "An AI tool your team uses to shortlist job applicants seems to favour one group. What do you do?"
kind: scenario
short_answer: "I would raise it with my manager and HR straight away, with the evidence I saw, and suggest pausing its use for decisions until it is checked. Then we compare the tool's results across groups, find what drives the difference, such as biased past data or proxies like college or area, and keep a person reviewing every shortlist."
deeper_answer: "Hiring tools can learn bias from past decisions: if a company mostly hired one kind of candidate, a model trained on that history will prefer similar people. Even without using gender or caste directly, features like college, location or gaps in a CV can act as proxies.\n\nThe responsible response is to stop relying on it, measure, and fix: compare selection rates across groups, remove or test suspicious features, ask the vendor how the tool was tested, and keep human review. Unfair hiring can also break the law and hurts the company's reputation."
follow_ups:
  - "How would you measure whether the tool is fair?"
  - "What questions would you ask the vendor?"
common_mistakes:
  - "Ignoring it because the tool is 'objective'"
  - "Quietly adjusting results without telling anyone"
level: B1
topic: governance
stop_id: bias-fairness
rubric:
  - point: "Raises it with the right people, with evidence"
    keywords: ["manager", "hr", "raise", "evidence", "report"]
  - point: "Suggests pausing its use for decisions"
    keywords: ["pause", "stop", "suspend"]
  - point: "Compares results across groups to measure bias"
    keywords: ["compare", "groups", "measure", "selection rate"]
  - point: "Looks for causes such as biased data or proxies"
    keywords: ["past data", "proxy", "historical", "training data"]
  - point: "Keeps human review of decisions"
    keywords: ["human", "review", "person"]
answer_seconds: 90
example: "In a college placement project we tried a free CV-screening tool and noticed almost every shortlisted student came from two branches. We showed the placement officer the list and stopped using the scores. When we checked, the tool weighted certain keywords that those branches' CV templates happened to use. We switched to a simple checklist that a person applied to every CV, and the shortlist became much more varied."
