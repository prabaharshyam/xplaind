id: agent-x-knowing-when-done
question: "How should an agent decide that a task is finished? Use this case: it is asked to update 30 product descriptions, updates 12, and reports that the work is complete."
kind: concept
short_answer: "The model's own feeling of being done is not reliable. The task needs explicit completion criteria, a tracked list of items, and a check against the real state before the agent may stop. Here the harness should hold a checklist of 30 products, and code should verify that all 30 were changed. If it cannot finish, it should say so."
deeper_answer: "Agents stop early for a few reasons. The goal was vague, so partial work looks complete. The list of remaining items fell out of context after many tool results. Or the model writes a confident summary of the plan and not of what happened. None of these is fixed by telling the model to try harder.\n\nThe fix is to move the definition of done outside the model. Write the acceptance criteria into the task. Keep progress in a structured to-do list or a file that the agent updates and re-reads. Before the final answer, run a check in code or with a separate verifier: query the catalogue and count the updated rows. Give the agent an honest exit too, such as a status of partial with the reason, so it does not claim success to end the run. Interviewers listen for verification against real state, not against the agent's own report."
follow_ups:
  - "What stopping conditions would you add besides task completion?"
  - "How do you verify completion when the result is open-ended, such as a research report?"
  - "Why might the agent claim success when it has failed?"
common_mistakes:
  - "Trusting the agent's final message as proof of completion"
  - "Only adding the words 'do not stop early' to the prompt"
  - "Giving the agent no way to report partial progress"
level: I3
topic: agents
stop_id: agent-loop
rubric:
  - point: "Says the model's own claim of completion is not reliable"
    keywords: ["not reliable", "cannot trust", "do not trust", "claim", "own report"]
  - point: "Defines explicit completion or acceptance criteria in the task"
    keywords: ["criteria", "definition of done", "acceptance", "explicit"]
  - point: "Tracks progress in a checklist or to-do list outside the chat history"
    keywords: ["checklist", "to-do", "todo", "list", "file"]
  - point: "Verifies against real state in code before the agent may stop"
    keywords: ["verif", "check", "count", "query"]
  - point: "Allows an honest partial or failed status"
    keywords: ["partial", "could not", "failed", "status"]
answer_seconds: 120
example: "I do not trust the agent's claim that it is done. In this case I think the list of 30 products fell out of its context after many tool results, so 12 looked like everything. I would fix it in three ways. First, explicit criteria in the task: all 30 product IDs must have a new description. Second, a checklist that lives in a file. The agent ticks each product and re-reads the file before it decides what to do next. Third, a check in code before the run can end. The harness queries the catalogue and counts updated rows. If the count is 12, the agent gets that result back and continues. I would also allow a partial status, so that if a product is locked the agent reports 29 done and one failed, with the reason."
