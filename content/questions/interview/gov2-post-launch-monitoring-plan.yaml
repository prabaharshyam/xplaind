id: gov2-post-launch-monitoring-plan
question: "Your company has launched a model that decides credit limit increases. From the governance side, how would you set up monitoring after launch?"
kind: use-case
short_answer: "Agree before launch what is measured, by whom, how often, and what triggers action. I track performance against real outcomes, fairness across groups, drift in inputs, overrides by staff, complaints and incidents. A named owner reviews a monthly report, thresholds trigger an investigation or a pause, and significant changes go through a new risk review."
deeper_answer: "Approval at launch is a statement about one moment. Data, customers and the business change, so a model that was acceptable in January can be unfair or inaccurate by September. Frameworks such as the NIST AI RMF and ISO 42001 treat monitoring and review as a continuing duty, not a single gate.\n\nThe engineering team runs the technical monitors. Governance makes sure the right questions are asked and somebody acts. So I define indicators with thresholds: approval rates by group, default rates of approved customers against the prediction, the share of decisions overridden by staff, and complaint counts. Each has an owner and a set response, for example 'gap between groups above the agreed level: investigate within two weeks'. I add a periodic full review, and I define which changes, such as a new data source or retraining, need a new approval. Findings go to the risk committee and into the risk register. Interviewers listen for thresholds with actions, ownership and triggers for a new approval."
follow_ups:
  - "Which indicator would make you pause the model?"
  - "Who should own the monitoring report?"
  - "What kind of change to the model needs a new approval?"
common_mistakes:
  - "Treating launch approval as the end of governance"
  - "Dashboards with no thresholds and no owner"
  - "Watching accuracy only, not fairness or complaints"
level: P1
topic: governance
stop_id: ai-risk-frameworks
rubric:
  - point: "Agrees indicators, owners and frequency before launch"
    keywords: ["before launch", "indicator", "owner", "monthly"]
  - point: "Tracks performance against real outcomes, and drift"
    keywords: ["default rate", "drift", "outcome"]
  - point: "Tracks fairness across groups, overrides and complaints"
    keywords: ["by group", "override", "complaints"]
  - point: "Thresholds with defined actions such as investigate or pause"
    keywords: ["threshold", "pause", "investigate"]
  - point: "New review for significant changes; reports to a risk committee"
    keywords: ["new review", "risk committee", "retraining"]
answer_seconds: 150
example: "I would agree the monitoring plan before launch, as a condition of approval. For a model that decides credit limit increases, I would define five indicators: default rate of approved customers against the prediction, drift in the input data, approval rate by group such as gender and city tier, the share of decisions where staff override the model, and customer complaints. Each indicator has an owner and a threshold. For example, if the approval gap between groups crosses the agreed level, the model owner must investigate within two weeks, and for a large gap we pause automatic decisions. The model owner sends a monthly report, and I take a summary to the risk committee each quarter. Any retraining or new data source needs a new review before it goes live."
