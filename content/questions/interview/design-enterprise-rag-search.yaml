id: design-enterprise-rag-search
question: "Design an internal search assistant for a company with 5,000 employees and 2 million documents in wikis, shared drives and tickets. Each employee must only get answers from documents they are allowed to open."
kind: use-case
short_answer: "Clarify sources, the permission model and freshness. Ingest each document with its access list as metadata, sync permission changes quickly, and filter retrieval by the user's identity and groups before any text reaches the model. Use hybrid search and reranking, answer with citations, refuse when nothing relevant is found, and test for leaks."
deeper_answer: "Requirements first: which sources, how permissions work in each (users, groups, inherited folders), how fresh answers must be, and the latency target, for example 3 seconds to the first word. Success means correct, cited answers and zero cases of a user seeing text they cannot open.\n\nData flow: connectors pull documents and their access lists, a pipeline parses, chunks and embeds them, and each chunk stores the allowed groups. At query time the service takes the user's identity from single sign-on, resolves groups, and applies the filter inside the search engine, in code, not in the prompt. Hybrid search finds candidates, a reranker keeps the best few, and the model answers only from those with citations.\n\nTrade-offs: copying access lists into the index is fast but can go stale, so sync permission changes within minutes or check access again at read time for sensitive sources. What breaks first is usually permission sync and filtered search speed for users in many groups. Measure retrieval recall, answer faithfulness, and a leak test where test users ask about restricted documents."
follow_ups:
  - "A user loses access to a folder. How quickly does the assistant stop using it, and how do you prove that?"
  - "Why is filtering after retrieval weaker than filtering inside the search?"
  - "How would you handle a shared cache of answers?"
common_mistakes:
  - "Enforcing permissions in the prompt instead of in code"
  - "Filtering after retrieval so restricted text still shapes results"
  - "Caching answers across users with different access"
level: P2
topic: system-design
stop_id: permission-aware-rag
rubric:
  - point: "Clarifies sources, permission model, freshness and latency"
    keywords: ["clarify", "source", "freshness", "latency", "requirement"]
  - point: "Stores access lists as metadata on every chunk"
    keywords: ["access list", "metadata", "acl", "group"]
  - point: "Filters by user identity inside retrieval, in code"
    keywords: ["filter", "identity", "single sign-on", "in code"]
  - point: "Hybrid search and reranking, answers with citations"
    keywords: ["hybrid", "rerank", "citation", "cite"]
  - point: "Keeps permissions in sync when they change"
    keywords: ["sync", "stale", "revoke", "permission change"]
  - point: "Tests for leaks and measures retrieval quality"
    keywords: ["leak", "test", "recall", "measure"]
answer_seconds: 150
example: "I would first clarify the sources and how permissions work in each one, and agree a latency target of about 3 seconds. For 2 million documents, connectors pull each document with its access list, and every chunk stores the allowed groups as metadata. At query time I take the user's identity from single sign-on and apply a filter inside the search engine, in code, so restricted chunks are never retrieved. Hybrid search finds candidates, a reranker keeps the top five, and the model answers with citations or says it found nothing. The trade-off is that access lists copied into the index can go stale, so I sync permission changes within minutes and check access again for sensitive sources. Before launch I run a leak test: test users ask about documents they cannot open, and the pass mark is zero leaks. I also measure retrieval recall on 200 real questions."
