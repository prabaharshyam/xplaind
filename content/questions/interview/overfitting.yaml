id: overfitting
question: "What is overfitting, and how do you spot it?"
short_answer: "Overfitting is when a model learns the training data too closely, including its noise, so it does well on training data but badly on new data. You spot it when training performance keeps improving while validation performance stops improving or gets worse."
deeper_answer: "A model that memorises rather than generalises looks great in training and fails in use. The standard check is to hold out data the model never trains on and compare scores. A large gap between training and validation scores is the signal.\n\nCommon remedies are more and more varied data, a simpler model, regularisation, early stopping and data augmentation. The same idea appears with LLM apps: a prompt tuned on five examples can overfit to them, which is why you test prompts on a separate, varied set."
follow_ups:
  - "How does the idea of overfitting apply to prompt engineering?"
  - "What is the opposite problem, and how does it look?"
common_mistakes:
  - "Judging a model only by its score on training data"
  - "Thinking more training always helps"
