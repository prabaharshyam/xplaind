id: debug-rag
question: "Your RAG app gives wrong answers. How do you find the cause?"
short_answer: "Separate retrieval from generation. For a set of failing questions, check whether the right chunk was retrieved. If not, fix retrieval: chunking, embeddings, query rewriting or hybrid search. If it was retrieved but the answer is still wrong, fix the prompt, context order or model. Measure each change on a test set."
deeper_answer: "A practical sequence: collect failing examples; for each, log the retrieved chunks and see whether the answer was in them. Count how many failures are retrieval misses and how many are generation errors. Retrieval misses often come from chunks cut in the wrong place, missing metadata, vocabulary mismatch, or the document not being indexed at all.\n\nGeneration errors come from too much irrelevant context, instructions that do not force grounding, or the model ignoring the context. Build a small test set with the expected source for each question, track recall at k and answer correctness, and change one thing at a time."
follow_ups:
  - "What metrics would you track for retrieval?"
  - "How would you build the test set if you have no labelled data?"
common_mistakes:
  - "Jumping straight to a bigger model"
  - "Changing several things at once so you cannot tell what helped"
