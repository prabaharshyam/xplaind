answer_seconds: 150
example: "I would first check that customer_id is unique in the customers table and that the key has the same type on both sides. Then I do a left join from orders with the indicator turned on: orders.merge(customers, on=\"customer_id\", how=\"left\", indicator=True). That adds a _merge column, and the rows marked left_only are the orders with no matching customer. I would also pass validate=\"many_to_one\", so pandas raises an error if a customer id appears twice, because duplicate keys would multiply my rows. After the merge I compare the row count with the number of orders. The merge is a hash join, so roughly linear in the two table sizes. On a small test, an order with customer_id 99 and no such customer comes back as left_only, and so does an order with a missing id."
