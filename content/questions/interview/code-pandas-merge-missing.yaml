id: code-pandas-merge-missing
question: "You have an orders table and a customers table that share customer_id. Join them and list the orders that have no matching customer. For example, if order 3 has customer_id 99 and no customer has that id, order 3 should be in the result."
kind: use-case
short_answer: "Do a left join from orders with indicator=True, then keep rows where _merge is left_only: orders.merge(customers, on=\"customer_id\", how=\"left\", indicator=True). A merge is a hash join, about O(n + m). Check that customer_id is unique in customers first, or the join will multiply rows."
deeper_answer: "First clarify the keys. Ask whether customer_id is unique in customers, whether the key columns have the same type in both tables, and whether orders can have a missing customer_id.\n\nThe steps are: merged = orders.merge(customers, on=\"customer_id\", how=\"left\", indicator=True, validate=\"many_to_one\"). The indicator adds a _merge column with the values both, left_only and right_only. Then unmatched = merged[merged[\"_merge\"] == \"left_only\"]. The validate argument raises a MergeError when customers has duplicate keys, so the row count cannot grow without you noticing. Compare len(merged) with len(orders) as a second check. If you only need the orders, an anti-join is shorter: orders[~orders[\"customer_id\"].isin(customers[\"customer_id\"])].\n\nThe cost is roughly O(n + m) time, plus memory for the merged table. Test an order with an unknown id, an order with a missing id, and keys stored as text in one table and integers in the other, which pandas refuses to merge. Say that how=\"outer\" also shows customers with no orders as right_only."
follow_ups:
  - "How would you also find customers who have no orders?"
  - "Why did the row count grow after a left join?"
  - "What happens if the key is text in one table and a number in the other?"
common_mistakes:
  - "Using an inner join, which silently drops the unmatched rows"
  - "Not checking that the key is unique on the right side"
  - "Looking for missing values in a customer column that can be empty for matched rows too"
