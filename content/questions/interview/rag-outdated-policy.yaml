id: rag-outdated-policy
question: "Your HR assistant keeps quoting last year's leave policy. How do you fix it?"
kind: scenario
short_answer: "The old document is still in the index and is being retrieved. I would find it, then fix the pipeline: remove or archive replaced documents, store an effective date and version as metadata, filter retrieval to the current version by default, and re-index on every change. Then add test questions about the new policy so it cannot slip back."
deeper_answer: "Stale answers are usually an ingestion problem, not a model problem. If old and new versions sit side by side, the retriever may prefer the old one simply because its wording matches the question better.\n\nThe durable fix is lifecycle management: each document has an owner, a version, an effective date and a status; the index updates when the source changes; and retrieval filters out superseded versions. Showing the source and its date in the answer lets employees spot problems, and evaluation questions on recent changes catch regressions."
follow_ups:
  - "How would you handle a policy that changes mid-year for some employees only?"
  - "How do you know which documents are superseded?"
common_mistakes:
  - "Trying to fix it with a prompt telling the model to prefer new policies"
  - "Deleting old files by hand without fixing the pipeline"
level: I2
topic: rag
stop_id: retrieval-metadata
rubric:
  - point: "Identifies that the old document is still indexed and retrieved"
    keywords: ["old document", "still indexed", "stale", "retrieved"]
  - point: "Adds version or effective-date metadata"
    keywords: ["metadata", "version", "effective date", "date"]
  - point: "Filters retrieval to current documents"
    keywords: ["filter", "current", "latest"]
  - point: "Updates the index when sources change"
    keywords: ["re-index", "reindex", "update", "sync", "pipeline"]
  - point: "Adds test questions for the change"
    keywords: ["test", "eval", "question"]
answer_seconds: 90
example: "At a mid-sized company the HR bot said we had 18 days of earned leave when the new policy said 21. The search results showed both PDFs, and the old one matched the question's wording better. We added an effective_from date and a status field to every document, filtered to status 'current', and connected the index to the HR SharePoint folder so updates re-index overnight. We also added five questions about this year's changes to our test set."
