id: work-under-pressure
question: "How do you handle pressure and tight deadlines?"
kind: real-life
short_answer: "Give one real example. Describe the deadline and what was at risk, then how you handled it: you listed the work, dropped what was not needed, told people early about risks, and stayed careful on quality. Share the result and one thing you changed afterwards."
deeper_answer: "The interviewer wants evidence, not a claim that you \"work well under pressure\". They are checking whether you plan, communicate and protect quality, or whether you stop communicating, panic or skip checks in a way that hurts users.\n\nUse situation, task, action, result. In the action part, show three behaviours: you prioritised, you told the people affected early, and you kept a check that mattered. For example: \"With three days left, I told my manager we could fix the top two failure types but not all five, and she agreed that with the client.\" End with what you learned. It is also fine to say how you stay steady, such as breaking work into small steps, but keep it short."
follow_ups:
  - "What would you have done if you still could not finish?"
  - "How do you decide what to drop?"
  - "How do you look after yourself in a long busy period?"
common_mistakes:
  - "Saying only \"I work well under pressure\""
  - "Describing long hours as the only solution"
  - "Leaving out how you kept others informed"
level: I2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Describes a specific deadline and what was at risk"
    keywords: ["deadline", "days", "demo", "client", "launch"]
  - point: "Shows prioritising: what was done first and what was dropped"
    keywords: ["priorit", "first", "sorted", "most important", "not everything", "scope"]
  - point: "Shows early communication about risk"
    keywords: ["told", "informed", "manager", "update", "raised"]
  - point: "Keeps a quality check despite the time limit"
    keywords: ["test", "check", "review", "quality"]
  - point: "Gives the result and a lesson"
    keywords: ["result", "error rate", "learned", "since then", "now i"]
answer_seconds: 120
example: "Last year our team had to show a claims chatbot to an insurance client in three days, and testing found that it gave wrong answers on about one question in five. I was the ML engineer on it. First I sorted the 60 failed questions into types. Two types, old policy documents and questions with dates, caused most of the failures. I told my manager the same afternoon that we could fix those two but not everything, and she agreed that scope with the client. I removed the old documents, fixed the date handling, and reran the full test set each evening. On demo day the error rate was about one in fifteen, and we showed the known gaps openly. Now I run the test set from week one."
