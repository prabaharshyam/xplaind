id: will-ai-take-jobs
question: "Will AI take your job? How are you preparing?"
kind: real-life
short_answer: "AI changes tasks before it removes whole jobs: it is good at drafting, summarising and routine analysis, and weaker at judgement, relationships and responsibility. The people most at risk are those who do not learn to use it. Show how you prepare: using AI on real tasks, checking its work, and building skills it cannot replace."
deeper_answer: "Studies such as the International Labour Organization's work on generative AI find that most jobs are more likely to be changed than fully automated, with clerical work most exposed. That still means real disruption for some roles, so a balanced answer is better than either fear or hype.\n\nMake it personal: name two tasks you now do faster with AI, what you check, and a skill you are building, such as data analysis or domain expertise."
follow_ups:
  - "Which parts of your current work could AI do?"
  - "What skill are you building that AI cannot replace?"
common_mistakes:
  - "Answering with fear or hype"
  - "No personal example"
level: B1
topic: ai-literacy
stop_id: ai-and-jobs
rubric:
  - point: "AI changes tasks more than whole jobs"
    keywords: ["task", "change", "augment", "not replace"]
  - point: "Names what AI does well and badly"
    keywords: ["draft", "summar", "routine", "judgement", "judgment", "relationship"]
  - point: "Balanced, evidence-based view"
    keywords: ["study", "ilo", "research", "some roles", "balanced"]
  - point: "Personal preparation with examples"
    keywords: ["i use", "i learn", "i am learning", "skill", "example", "myself"]
answer_seconds: 90
example: "I work in customer support, and AI already drafts many replies. My work has shifted towards the cases AI cannot handle: angry customers, unusual problems and decisions about exceptions. I prepared by learning to use our AI tools well, catching their mistakes, and teaching two colleagues. I also started a course on automation, so I can help design how our team uses AI, not just use it."
