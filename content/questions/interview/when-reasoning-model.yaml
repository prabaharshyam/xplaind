id: when-reasoning-model
question: A reasoning model is more accurate on your task but five times the cost and much slower. How
  do you decide whether to use it?
kind: scenario
short_answer: 'Measure on our own test set first, against the cheaper options: a step-by-step prompt and
  a majority vote of a few samples. If the reasoning model still wins clearly, route only the hard cases
  to it, such as when cheap samples disagree or a check fails, and keep everything else on the fast model.'
deeper_answer: 'The decision is quality, cost and latency together. I would break results down by difficulty:
  reasoning models usually help most on multi-step maths, code and planning and add little on simple questions.


  To control cost I would cap the effort setting and output length and track cost per request. For latency
  I would show progress, run work in the background where possible, and measure time to the first word
  the user sees, because hidden thinking delays it.'
follow_ups:
- How would you detect which questions are hard?
- What would you show the user while it thinks?
common_mistakes:
- Switching everything to the reasoning model
- Comparing only against a lazy prompt
level: P1
