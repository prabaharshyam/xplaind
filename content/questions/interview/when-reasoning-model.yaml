example: On a maths-checking feature, a step-by-step prompt took accuracy from 71% to 81% at little cost.
  A majority vote of five reached 88%. We sent only the problems where the five samples disagreed, about
  one in six, to a reasoning model, which reached 91% overall at about half the cost of using it for everything.
