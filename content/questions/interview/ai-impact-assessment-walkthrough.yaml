id: ai-impact-assessment-walkthrough
question: "Walk me through how you would assess the risks of a new AI feature before launch."
kind: use-case
short_answer: "Describe the system and its data flow, list who could be harmed and how, rate each risk, check which laws and policies apply, plan tests with pass bars for the main risks, set controls with named owners, and end with a clear go, conditional or not-yet recommendation. Revisit it after launch with real data."
deeper_answer: "A good assessment is practical, not a form-filling exercise. It starts from how the feature is really used: who sees the output, what decisions depend on it and what happens when it is wrong. Harms include ordinary mistakes, not only attacks.\n\nEach serious risk needs evidence, such as a test result, a control and an owner. Frameworks like the NIST AI Risk Management Framework or ISO/IEC 42001 help structure the work, and India's governance guidelines point to existing laws. The output is a decision, with conditions, that the product owner signs."
follow_ups:
  - "Which risks would you accept rather than control?"
  - "Who should sign off the assessment?"
common_mistakes:
  - "Listing generic risks with no tests or owners"
  - "Doing it once and never revisiting it"
level: P1
topic: governance
stop_id: ai-risk-frameworks
rubric:
  - point: "Describes the system, its data and who is affected"
    keywords: ["data flow", "system", "affected", "users"]
  - point: "Lists and rates harms"
    keywords: ["harm", "risk", "likelihood", "severity", "rate"]
  - point: "Checks applicable laws and policies"
    keywords: ["law", "policy", "dpdp", "regulation"]
  - point: "Plans tests with pass bars"
    keywords: ["test", "pass bar", "evaluate", "red team"]
  - point: "Sets controls with owners and makes a decision"
    keywords: ["control", "owner", "recommendation", "go", "decision"]
answer_seconds: 120
example: "At a lending company, we assessed a chatbot that explains loan eligibility. The main harms were telling someone they qualify when they do not, and giving worse answers in Hindi than in English. We tested 300 real questions in both languages with a pass bar of 95% correct, red-teamed it for promises of approval, and checked that no chat logs kept PAN numbers. The recommendation was 'go with conditions': launch in English first, add Hindi once it passed, and review the logs monthly with the compliance lead as owner."
