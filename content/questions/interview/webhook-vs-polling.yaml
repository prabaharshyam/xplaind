example: "Polling is like phoning the courier every ten minutes to ask if your parcel has arrived. A webhook is the courier ringing your doorbell when it arrives. With Razorpay, for example, a webhook tells your system the moment a payment succeeds, so you do not have to keep asking. You should verify the webhook's signature and ignore repeats of the same event."
