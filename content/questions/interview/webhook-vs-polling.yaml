id: webhook-vs-polling
question: "What is a webhook, and how is it different from polling?"
short_answer: "Polling means your workflow asks a service every few minutes whether anything changed. A webhook is the reverse: the service sends an HTTP request to your URL the moment an event happens, such as a payment succeeding. Webhooks are faster and use fewer requests, but you must secure the endpoint and handle repeats."
deeper_answer: "With a webhook you get a URL from your automation tool and register it in the other service. Security matters: verify the signature the sender includes, use HTTPS, and never trust the payload blindly.\n\nSenders retry when your endpoint fails, so the same event can arrive twice; make the workflow idempotent by checking an event ID before acting. Polling is still fine when a service offers no webhooks or near-real-time is not needed."
follow_ups:
  - "How would you stop a duplicate payment webhook from creating two orders?"
  - "How do you verify a webhook really came from the sender?"
common_mistakes:
  - "Not verifying signatures"
  - "Assuming each event arrives exactly once"
