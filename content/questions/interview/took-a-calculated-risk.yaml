id: took-a-calculated-risk
question: "Tell me about a risk you took. How did it turn out?"
kind: real-life
short_answer: "Pick a risk you chose on purpose, not an accident. Explain the possible gain, what could go wrong, and how you limited the damage: a small rollout, a stop rule or a way to undo it. Say who you informed. Then give the real outcome, good or bad, and what you learned."
deeper_answer: "The interviewer is checking whether you take risks with thought. Never taking risks is a problem in AI work, where nothing is certain. Taking them without thinking is worse.\n\nSituation: the choice in front of you. Task: what you were responsible for. Action: how you compared gain and loss, and how you reduced the loss. A good line is: \"I wrote down one rule before launch: if more than one in ten summaries needs heavy editing, we pause.\" Result: what happened. A risk that failed is a fine answer if the loss was limited and you learned from it. Make sure it was your decision, and that the people affected knew about it."
follow_ups:
  - "What would you have done if it had gone badly?"
  - "How did you decide the risk was worth taking?"
  - "Tell me about a risk that failed."
common_mistakes:
  - "Describing luck or a careless act as a planned risk"
  - "Not saying what could have gone wrong"
  - "Taking the risk without telling the people affected"
level: P2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "States the risk and the possible gain"
    keywords: ["risk", "believed", "learn more", "gain", "benefit"]
  - point: "Says what could go wrong"
    keywords: ["could send", "could go wrong", "could fail", "could lose", "bad summary"]
  - point: "Limited the damage with a small rollout or a stop rule"
    keywords: ["limited", "pilot", "stop rule", "pause", "volunteer"]
  - point: "Informed the people affected"
    keywords: ["director", "manager", "sales head", "both agreed", "told"]
  - point: "Gives the real outcome and the learning"
    keywords: ["we found", "result", "percent", "learned", "we fixed"]
answer_seconds: 150
example: "I was the product manager for an AI feature that wrote summaries of sales calls. Our plan said to finish a three-month evaluation before any launch. I believed we would learn more from real use, but a bad summary could send wrong details to a customer. I proposed a limited launch: 50 volunteer sales staff, every summary editable before saving, and a written stop rule. If more than 10 percent of summaries needed heavy edits, we would pause. I took this to my director and the sales head, and both agreed. In week two we found the tool was weak on calls that mixed Hindi and English, which our test set lacked. The edit rate reached 9 percent, close to the limit. We fixed it before the full launch, and 60 percent of the sales team now uses the feature."
