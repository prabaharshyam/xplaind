id: data-leakage
question: "What is data leakage, and how do you prevent it?"
short_answer: "Leakage is when information that would not be available at prediction time gets into training, so validation scores look great but production disappoints. Causes include features computed from the future or the target, and preprocessing fitted on the whole dataset. Prevent it by splitting first, fitting every transform inside the training fold, and splitting by time or group where needed."
deeper_answer: "Classic examples: predicting loan default with a feature like \"number of collection calls\", which only exists after default; scaling or imputing with statistics from the full dataset before splitting; or random splits on time-series data so the model sees the future.\n\nThe defence is mostly discipline. Split before any exploration that drives modelling choices. Put preprocessing in a pipeline so cross-validation refits it on each training fold. Use time-based splits for anything that changes over time, and group splits when the same customer or patient appears in many rows. A suspiciously high score is itself a warning sign worth investigating."
follow_ups:
  - "How would you split data for a model predicting next month's sales?"
  - "Why does fitting a scaler before the split leak information?"
common_mistakes:
