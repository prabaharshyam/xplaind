example: "I would use all three, in stages. In the first month I would pick three people from the current team and train them on real projects. Most of the work is still threat modelling and access control. The new parts are prompt injection, unsafe tool use and data leaks, and those can be learned. For the first two launches I would bring in an outside firm for red teaming, with one condition: my engineers work beside them, so the skills transfer to us. During the same months I would hire one senior specialist to lead and set our standards. To cover 10 features with 8 people, I would name a security champion in each product team with a checklist. My measure is simple: every launch has a threat model before it goes live."
