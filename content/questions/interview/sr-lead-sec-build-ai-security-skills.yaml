id: sr-lead-sec-build-ai-security-skills
question: "Your application security team has 8 people and none has worked on AI systems. The company plans to launch 10 LLM features this year. Do you hire AI security specialists, train the current team, or use outside firms, and in what order?"
kind: use-case
short_answer: "I would do all three, in order. Train two or three of the current team first, because they know our systems and most AI risks build on normal security. Use an outside firm for the first red-team exercises while the team learns from them. Hire one specialist to lead, and set up security champions in product teams to scale."
deeper_answer: "Each option has a weakness alone. Specialists are few and costly, and one new hire cannot cover 10 launches. An outside firm gives skill quickly, but the knowledge leaves when the contract ends. Training takes months. So the order matters. Start with the current team: threat modelling, access control and secure design still apply, and the new parts, such as prompt injection, unsafe tool use and data leaks through models, can be learned on real projects.\n\nUse the outside firm with a condition: your engineers work beside them, so skills transfer. Hire one senior specialist to set standards and guide the others. To scale past 8 people, name a security champion in each product team and give them a checklist and training. Interviewers listen for a staged plan, attention to keeping and growing people, building on existing skills, and a way to check progress, such as how many launches got a threat model."
follow_ups:
  - "Your two best engineers are trained and then leave for better pay. How do you reduce that risk?"
  - "What would you ask the outside firm to hand over at the end?"
  - "How do you decide which of the 10 features get a full review?"
common_mistakes:
  - "Waiting to hire a perfect specialist before starting"
  - "Depending fully on an outside firm"
  - "Treating AI security as separate from normal application security"
level: P2
