id: planning-and-reflection
question: "What are planning and reflection in agents, and when do they help?"
short_answer: "Planning means the agent breaks a goal into steps before acting, then follows or revises the plan. Reflection means it reviews its own output or progress, such as checking a draft against criteria or noticing a failed step, and tries again. Both help on multi-step tasks with clear checks, but they add calls, cost and latency, so measure the gain."
deeper_answer: "ReAct interleaves reasoning and actions; plan-and-execute writes a plan first; reflection patterns add a critique step, sometimes with a separate grader model. Modern reasoning models do much of this internally, so explicit loops matter most when you can check against something external, such as running tests or validating a schema.\n\nCap the number of reflection rounds, because models can talk themselves into worse answers or loop."
follow_ups:
  - "Why does reflection work better with an external check?"
  - "How would you stop endless revision?"
common_mistakes:
  - "Adding reflection without measuring"
  - "Unlimited revise loops"
