id: pm-sales-promised-full-accuracy
question: "Your sales team has told a large client that the AI document extraction feature is 100% accurate, but the measured figure is about 94%. What do you do?"
kind: scenario
short_answer: "Correct it quickly, together with sales. Tell the client the measured accuracy, on which documents, and what errors look like. Show how the product handles them: confidence flags, review of low-confidence fields and sample audits. Offer a test on their own documents, and give sales a short note on what to claim."
deeper_answer: "No model-based extraction is right every time, and a client who finds the first error after a 100% promise will stop trusting everything else. An early correction costs less. Talk to the sales lead first, so it is one message and nobody is embarrassed in front of the client.\n\nThe true figure can still win the client. 94% of fields correct, with the uncertain ones flagged for a person, can give a better end result than manual entry alone, and it is checkable. Offer a trial on 500 of the client's own documents and put the measured number, not a promise, in the contract. Interviewers listen for speed, a clear explanation of what accuracy means, a design that makes errors manageable, and a fix at the source so sales does not repeat the claim."
follow_ups:
  - "How do you explain 94% to a client in plain words?"
  - "What would you put in the contract about accuracy?"
  - "What if the client says a competitor promises 100%?"
common_mistakes:
  - "Staying silent and hoping the client does not notice"
  - "Correcting the client without telling sales first"
  - "Quoting one accuracy number with no context"
level: I1
topic: product
stop_id: ux-uncertain-output
rubric:
  - point: "Corrects the claim quickly, together with sales"
    keywords: ["correct", "within a day", "sales lead"]
  - point: "States measured accuracy and what it was measured on"
    keywords: ["measured accuracy", "test set", "94"]
  - point: "Explains how the product handles errors"
    keywords: ["confidence", "flag", "review only"]
  - point: "Offers a trial on the client's own documents"
    keywords: ["trial", "their own documents", "pilot"]
  - point: "Fixes the source: guidance for sales and contract wording"
    keywords: ["one-page note", "can claim", "contract"]
answer_seconds: 120
example: "I would correct this within a day, because the first wrong invoice will break the client's trust. I would speak to the sales lead first and then join the client call with them. I would say: on our test set of 5,000 documents, measured accuracy is 94% of fields. Then I explain how we handle the rest: every field has a confidence score, low scores get a flag, and the client's team will review only those. I would offer a two-week trial on their own documents, so the number in the contract is one they have seen. Finally I would write a one-page note for sales on what they can claim, so this does not happen again."
