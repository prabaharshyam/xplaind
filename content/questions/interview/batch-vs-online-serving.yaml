id: batch-vs-online-serving
question: "When would you serve predictions in batch, and when online?"
short_answer: "Batch scoring runs on a schedule over many records and stores the results, which is cheap and simple when predictions can be a few hours old, such as nightly churn scores. Online serving computes a prediction per request behind an API, needed when the answer depends on fresh input, such as fraud checks at payment time."
deeper_answer: "Ask how fresh the prediction must be and how many entities there are. Recommendations for millions of users can be precomputed nightly; a search ranking that depends on the query cannot.\n\nOnline serving needs a model server, features available at request time (often a feature store to keep training and serving features consistent), a latency budget, autoscaling and fallbacks. A common hybrid precomputes heavy features in batch and does a light model call online."
follow_ups:
  - "What is training-serving skew, and how do you avoid it?"
  - "How would you add a fallback if the model server is down?"
common_mistakes:
  - "Choosing online serving when batch would do"
  - "Computing features differently in training and serving"
