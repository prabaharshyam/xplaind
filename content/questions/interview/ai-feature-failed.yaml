id: ai-feature-failed
question: "Tell me about a time something you built did not work as expected."
short_answer: "Choose a real failure, own it, and focus on how you found the cause and what you changed: the symptom, how you investigated (logs, tests, talking to users), the root cause, the fix, and what you now do differently, such as adding an eval case or a monitoring alert."
deeper_answer: "Good failure stories show judgement, not perfection. For AI work, examples are natural: a prompt change that broke other cases, a RAG system that failed on certain document types, an agent that looped and ran up cost.\n\nShow the learning turning into practice: \"since then I keep a regression set and run it before every prompt change.\" Avoid blaming others or tools, and avoid fake failures such as \"I work too hard\"."
follow_ups:
  - "How did you communicate the problem to others?"
  - "What process did you change afterwards?"
common_mistakes:
  - "Choosing a failure that was really someone else's fault"
  - "Ending without saying what you learned"
level: P3
topic: behavioral
stop_id: design-interview
rubric:
  - point: "Describes the symptom of a real failure"
    keywords: ["symptom", "fail", "broke", "wrong"]
  - point: "Explains how they investigated"
