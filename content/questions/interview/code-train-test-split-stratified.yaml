id: code-train-test-split-stratified
question: "Write a train and test split that keeps the class balance the same in both parts, without a library. For example, with 80 rows of class 0, 20 rows of class 1 and a test share of 0.2, the test set should hold 16 rows of class 0 and 4 rows of class 1."
kind: use-case
short_answer: "Group the row indices by class. Shuffle each group with a seeded generator, send the first share of each group to test and the rest to train, then shuffle the combined train indices. Every class keeps its proportion. Cost is O(n), or O(n log n) if you sort to group."
deeper_answer: "Clarify first: is this classification with a single label per row, what is the test share, and is a fixed seed wanted so the split can be repeated? Ask about very small classes, because a class with one row cannot be in both parts.\n\nWork with indices, not copies of the data. For each class c, take idx = np.flatnonzero(y == c), shuffle it with rng.shuffle(idx), and send the first round(len(idx) * test_share) indices to test and the rest to train. Join the parts and shuffle the train indices once more, so the rows are not ordered by class. Then slice features and labels with the same index arrays so they stay aligned.\n\nTest that train and test do not overlap, that together they cover every row, and that the class shares match within one row. Interviewers watch for a plain random split that leaves a rare class out of the test set, for no seed, and for rounding that gives a small class zero test rows."
follow_ups:
  - "What would you do with a class that has only one or two rows?"
  - "When is a stratified random split the wrong choice?"
  - "How would you add a validation set as well?"
common_mistakes:
  - "A plain random split on imbalanced data"
  - "No seed, so the split cannot be repeated"
  - "Shuffling features and labels separately"
level: I2
topic: coding
stop_id: cross-validation-leakage
rubric:
  - point: "Splits inside each class, not over the whole dataset"
    keywords: ["for each class", "each class"]
  - point: "Shuffles with a seed so the split can be repeated"
    keywords: ["seed", "shuffle"]
  - point: "Works on indices and keeps features and labels aligned"
    keywords: ["indices", "aligned"]
  - point: "Checks no overlap, full coverage and matching proportions"
    keywords: ["no overlap", "proportion", "cover every row"]
  - point: "Handles a rare class and rounding"
    keywords: ["rare class", "rounding", "at least one"]
answer_seconds: 150
example: "First I would confirm it is a classification problem with one label per row, and ask for the test share and a seed. I work with row indices, not the data itself. For each class I collect its indices, shuffle them with a seeded random generator, and send the first 20 percent to test and the rest to train. Then I join the parts and shuffle the train indices again, so the rows are not grouped by class. I slice the features and labels with the same indices, so they stay aligned. The cost is linear in the rows. I would test that train and test have no overlap, that together they cover every row, and that the proportion of each class is the same in both. One edge case is a rare class with two rows: rounding could give it zero test rows, so I would force at least one."
