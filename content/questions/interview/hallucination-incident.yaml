answer_seconds: 90
example: An insurance assistant once stated a waiting-period exception that did not exist. The trace showed
  retrieval had returned the right section, but the model added a sentence from general knowledge. We
  blocked waiting-period answers for a day, contacted the two affected customers through the client, added
  a claim check against retrieved passages, and put twenty waiting-period questions into the test set.
