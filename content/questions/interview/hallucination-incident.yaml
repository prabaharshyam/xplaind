id: hallucination-incident
question: A client tells you their AI assistant invented a policy clause and a customer acted on it. What
  do you do?
kind: real-life
short_answer: 'First contain it: tell the client, correct the customer''s information, and block similar
  answers for now. Then read the trace to find the cause: wrong documents, poor retrieval, or the model
  answering beyond its sources. Fix that, add the case and similar ones to the test set, and add an automatic
  check of claims against sources.'
deeper_answer: 'I would look at the full trace: the question, the retrieved passages and the answer. If
  the clause was not in any passage, the model answered beyond its sources, so I would tighten the instruction
  to answer only from sources and say when they are silent, and add an entailment or judge check on every
  claim.


  If retrieval missed the real clause, I would fix chunking, filters or the index. I would search logs
  for other answers on the same topic, report findings and fixes to the client in writing, and agree a
  review step for policy answers until the checks prove themselves.'
follow_ups:
- How would you find other affected customers?
- What would you change so this is caught automatically next time?
common_mistakes:
- Only changing the prompt and moving on
- Not checking whether other users got the same wrong answer
level: P1
topic: client-delivery
stop_id: catching-hallucinations
rubric:
- point: Contains the harm and informs the client
  keywords:
  - contain
