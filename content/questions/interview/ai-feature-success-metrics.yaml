id: ai-feature-success-metrics
question: "How would you measure the success of an AI feature?"
kind: use-case
short_answer: "Use three layers. A business outcome, such as tickets resolved without escalation or time saved per user. Product usage, such as adoption, acceptance or edit rate of suggestions, and retention. And quality and safety guardrails from evals and monitoring, such as accuracy on a test set, harmful output rate, latency and cost per task. Agree targets before launch."
deeper_answer: "Model metrics alone mislead: a more accurate model that nobody trusts does not help. Usage alone misleads too: people may use a feature that quietly gives wrong answers.\n\nPick one primary metric tied to the user's goal, a few guardrails that must not get worse, and run an experiment or a staged rollout to attribute the change to the feature."
follow_ups:
  - "What is a guardrail metric?"
  - "How would you know users trust the feature?"
common_mistakes:
  - "Only model accuracy"
  - "No targets agreed before launch"
level: I2
topic: product
stop_id: kpi-that-matters
rubric:
  - point: "Business outcome metric"
    keywords: ["business", "outcome", "time saved", "revenue", "resolved", "conversion"]
  - point: "Usage: adoption, acceptance or edits"
    keywords: ["adoption", "usage", "accept", "edit", "retention"]
  - point: "Quality from evals"
    keywords: ["eval", "accuracy", "quality", "test set"]
  - point: "Guardrails: safety, latency, cost"
    keywords: ["guardrail", "safety", "latency", "cost", "harm"]
  - point: "Targets agreed up front; experiment to attribute"
    keywords: ["target", "before launch", "a/b", "experiment", "rollout"]
answer_seconds: 90
example: "For an AI reply-suggestion feature in a support tool, I would agree three layers before launch. Business: average handling time down by 15% without a drop in satisfaction. Usage: share of tickets where agents accept or lightly edit the suggestion. Guardrails: accuracy on a 200-ticket test set above an agreed bar, no suggestions containing another customer's data, and cost per ticket under ₹2."
drafted_with_ai: true
reviewed_by: "Shyam Prabahar"
reviewed_on: 2026-10-27
