answer_seconds: 165
example: "I would not start at finding number one. First I would group all 140 by root cause. In a past exercise, about 40 findings came from one cause: no output filter at the gateway. One central fix closed them all. After grouping, I would rank what is left by impact and how easy the attack is. Anything that exposes another customer's data or makes an agent take an action goes first, with an owner and a date in this quarter. For findings that must wait, we add a temporary control, such as a lower rate limit and extra monitoring. For the low ones, the business owner signs a risk acceptance with a review date. And we retest every fix, because a closed ticket is not proof."
