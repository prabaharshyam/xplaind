id: sr-lead-sec-140-findings-30-fixes
question: "A red-team exercise across your company's AI applications produced 140 findings, and the product teams can fix about 30 in a quarter. How do you decide what gets fixed, what waits and what is accepted?"
kind: scenario
short_answer: "I would first group the 140 findings by root cause, since many share one fix. Then rank by impact and how easy the attack is, with data exposure and unsafe actions on top. Fix shared causes centrally and give teams the top items with dates. Findings that wait get temporary controls. The remainder needs written risk acceptance from business owners."
deeper_answer: "A list of 140 items looks impossible, but findings are rarely independent. Thirty jailbreak findings may come from one missing output filter, and twenty may come from tools with too much access. Grouping by root cause can turn 140 items into 15 pieces of work, and a central fix in a gateway or shared library closes many together. This is the highest value step.\n\nNext, rank by harm, not by count. A finding that lets one user read another user's data, or makes an agent take an action, comes before a chatbot that can be made to say something rude. For work that must wait, add a temporary control, such as tighter limits or extra monitoring. For the remainder, the business owner signs a risk acceptance with a review date, because security should not quietly accept risk for them. Interviewers listen for root cause thinking, ranking by real impact, clear owners and dates, and retesting after fixes."
follow_ups:
  - "A team says its 12 findings are all low priority. How do you check that?"
  - "Who signs the risk acceptance, and for how long is it valid?"
  - "How do you confirm that a fix really worked?"
common_mistakes:
  - "Working through the list from the top one by one"
  - "Ranking by number of findings per app"
  - "Leaving findings open with no owner or date"
level: P2
topic: security
stop_id: ai-red-teaming
