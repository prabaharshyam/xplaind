answer_seconds: 150
example: "I would clarify the scope first, for example sales and finance tables only, because 1,500 tables cannot fit in a prompt. I would build a semantic layer with each metric definition, such as what \"active customer\" means, and descriptions of tables and columns. For each question, retrieval picks the relevant tables and a few verified question and SQL examples. The model writes the query. A validator allows only SELECT and checks that the columns exist. The query then runs on a read-only role with the user's own permissions, a row limit and a timeout. The answer shows the SQL and each assumption, such as the date range, and the assistant asks a clarifying question when a term is ambiguous. The trade-off is coverage against reliability: a curated layer answers fewer questions but gives fewer wrong numbers. I would evaluate on 300 questions by comparing results with a reference answer."
