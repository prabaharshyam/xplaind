id: design-text-to-sql-assistant
question: "Design an assistant that lets 2,000 business users ask questions in plain English and get answers from a data warehouse with 1,500 tables. Wrong numbers are worse than no answer."
kind: use-case
short_answer: "Clarify users, scope and how correctness is judged. Retrieve only the relevant tables, column descriptions and metric definitions into the prompt, generate SQL, validate it, and run it read-only with the user's own permissions, row limits and timeouts. Show the SQL and assumptions, ask when the question is ambiguous, and test on question and SQL pairs."
deeper_answer: "1,500 tables cannot go in a prompt, and raw schemas rarely explain what \"active customer\" or \"revenue\" means. So start with a curated scope and a semantic layer: agreed metric definitions, table and column descriptions, and join paths.\n\nFlow: the question is matched to relevant tables and metrics with retrieval over that metadata, plus a few similar verified question and SQL examples. The model writes SQL in the warehouse dialect. A validator parses it, allows only SELECT, checks tables and columns exist, and estimates cost. The query runs on a read-only role with the user's own row and column permissions, a row limit and a timeout. The answer shows the result, the SQL, and a plain statement of the filters and date range used.\n\nTrade-offs: generating against a semantic layer is more reliable than against raw tables, but covers fewer questions. The real danger is SQL that runs and gives a wrong number through a bad join or a wrong definition. So ask a clarifying question when terms are ambiguous. Evaluate by comparing query results with a reference set, not SQL text, and track user corrections."
follow_ups:
  - "How do you catch a query that runs fine but answers the wrong question?"
  - "How do you stop a user from seeing salary data through the assistant?"
  - "How would you evaluate this before launch?"
common_mistakes:
  - "Putting the whole schema in the prompt"
  - "Running generated SQL on an account with write or admin rights"
  - "Evaluating by SQL text match instead of results"
level: P2
topic: system-design
stop_id: design-interview
