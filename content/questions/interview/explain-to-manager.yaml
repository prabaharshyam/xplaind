id: explain-to-manager
question: "How would you explain RAG to a non-technical manager?"
kind: real-life
short_answer: "Use a plain comparison: \"Instead of trusting the AI's memory, we first look up the relevant pages from our own documents and hand them to it, like giving someone the right file before asking a question. That keeps answers current and lets us show the source.\" Then say what it means for them: cost, risks and timeline."
deeper_answer: "Explaining clearly to non-experts is a skill interviewers test directly. Lead with the business outcome, use one analogy, avoid jargon, and be honest about limits: \"it can still be wrong if the documents are wrong or the search misses the right page, so we measure that.\"\n\nCheck understanding and invite questions. Being able to adjust depth for the audience is often what separates senior candidates."
follow_ups:
  - "How would you explain why the system sometimes says it does not know?"
  - "How would you explain the cost to them?"
common_mistakes:
  - "Using jargon such as embeddings and vectors with a non-technical audience"
  - "Overpromising that the system will never be wrong"
level: I2
topic: behavioral
stop_id: design-interview
rubric:
  - point: "Uses a plain analogy, no jargon"
    keywords: ["like", "imagine", "analogy", "look up"]
  - point: "Looks up our own documents before answering"
    keywords: ["our documents", "own documents", "look up", "search"]
  - point: "Benefits: current answers with sources"
    keywords: ["source", "current", "up to date", "cite"]
  - point: "Covers cost, risk and timeline"
    keywords: ["cost", "risk", "time"]
answer_seconds: 90
example: "When a finance manager asked why our chatbot was better than plain ChatGPT, I said: 'ChatGPT answers from memory, which may be old or wrong for us. Ours first finds the relevant pages in our policy documents and answers from those, like handing a new employee the right file before asking. It shows which page it used, it costs about this much a month, and when a policy changes, we just update the document.'"
