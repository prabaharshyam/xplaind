id: design-support-bot
question: "Design a customer support assistant for an Indian bank."
kind: use-case
short_answer: "Clarify goals and limits first: languages, channels, which questions it may answer, and what must go to a human. Then: RAG over approved policy documents, read-only tools for account information behind strong authentication, strict guardrails against advice and data leaks, handoff to agents, evaluation before launch, and monitoring of quality, cost and escalations."
deeper_answer: "Requirements: users ask in English, Hindi and other languages; answers must follow current policy; no account changes without verification; regulators expect privacy and auditability. Success metrics: resolution rate, correct escalation, customer satisfaction, cost per conversation.\n\nComponents: an intent router; retrieval over versioned policy documents with citations; tools for balance or transaction status with the user's verified identity, least privilege and full logging; a response check for forbidden content such as investment advice; human handoff with the conversation summary.\n\nRisks: hallucinated policy, prompt injection through user messages, leaking another customer's data, and wrong answers in regional languages. Address each with grounding, permission checks in code (not in the prompt), and an eval set per language. Roll out to a small share of users, watch metrics, then expand."
follow_ups:
  - "How would you handle questions in Tamil if your documents are in English?"
  - "What would you never let the bot do, and how would you enforce it?"
  - "What metrics would you watch in the first week?"
common_mistakes:
  - "Jumping to model choice before clarifying requirements"
  - "Enforcing data access rules only through the prompt"
level: P3
topic: system-design
stop_id: ai-system-design
rubric:
  - point: "Clarifies goals, languages, channels and scope first"
    keywords: ["clarify", "language", "channel", "scope", "requirement"]
  - point: "RAG over approved policy documents"
    keywords: ["rag", "retriev", "policy", "document"]
  - point: "Account tools behind strong authentication"
    keywords: ["authenticat", "otp", "read-only", "account"]
  - point: "Guardrails and handoff to a human"
    keywords: ["guardrail", "handoff", "hand off", "human", "escalat"]
  - point: "Evaluates before launch and monitors after"
    keywords: ["evaluat", "test", "monitor"]
answer_seconds: 120
example: "For a bank, I would start by agreeing what the assistant may do: answer product and fee questions in English and Hindi, show balance and recent transactions after login, and hand over anything about disputes, fraud or complaints to a person. It would retrieve only from approved policy pages, call read-only account tools, refuse investment advice, and be tested on 500 real customer questions before a small launch."
