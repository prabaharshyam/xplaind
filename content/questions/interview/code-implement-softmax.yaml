example: "I would first check the shape. I will assume a batch of shape n by classes, so I work along the last axis and keep the dimensions. The naive version overflows, because np.exp of 1000 is infinity and the division gives NaN. So I subtract the max of each row first. That is safe because softmax does not change when you add a constant to every logit: the constant cancels in the ratio. Then I exponentiate and divide by the row sum. In one line it is np.exp(x - x.max()) divided by its sum. The cost is linear in the number of logits. I would test that every row sums to 1, that the logits 1000, 1001, 1002 give the same answer as 1, 2, 3, which is about 0.09, 0.24 and 0.67, and that equal logits give a uniform distribution."
