answer_seconds: 60
example: "Here is how I explain it. Turning invoices into ledger entries is a workflow: extract fields, validate, post, always in that order. Investigating why a customer's payment failed is better as an agent: it might check the payment gateway log, then the bank status, then the order history, in whatever order the evidence leads. I start with a workflow and only move to an agent when the steps genuinely cannot be fixed in advance."
