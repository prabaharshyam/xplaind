id: gov2-train-staff-on-ai-policy
question: "Your company has published an AI usage policy, but a survey shows most staff have not read it. How would you train 2,000 employees on it?"
kind: use-case
short_answer: "Make it short, by role and practical. Everyone gets a 20-minute session with real examples of allowed and not allowed use, and a one-page guide. High-risk teams such as HR, finance and developers get deeper sessions. I name a contact for questions, test understanding with scenarios, repeat it for new joiners and yearly, and measure behaviour, not only attendance."
deeper_answer: "People rarely break an AI policy because they are careless. They break it because the policy is long, abstract and does not answer the question in front of them: 'can I paste this customer email into the assistant?' So training must translate rules into the situations each role really meets, and say what to use, not only what to avoid. If there is no approved tool, people will use an unapproved one.\n\nI would build it with the departments, so that the examples are real. Managers get a short brief, because staff ask them first. I would measure in three ways: completion, a short scenario quiz, and signs of behaviour such as questions to the helpdesk, use of the approved tool, and incidents. I update the training when the policy or the tools change. The EU AI Act also expects organisations to ensure AI literacy among staff who use AI, which matters for companies serving Europe. Interviewers listen for content by role, examples and measurement."
follow_ups:
  - "How would you know the training changed behaviour?"
  - "What goes on the one-page guide?"
  - "How do you reach staff who do not use a laptop at work?"
common_mistakes:
  - "One long slide deck for everyone"
  - "Only listing what is forbidden, with no approved option"
  - "Measuring attendance and nothing else"
level: I1
topic: governance
stop_id: writing-ai-policy
rubric:
  - point: "Short and practical, with real examples of allowed and not allowed use"
    keywords: ["real examples", "allowed", "20-minute", "one-page"]
  - point: "Content by role, deeper for high-risk teams"
    keywords: ["by role", "finance", "developer", "deeper"]
  - point: "Tells people which approved tool to use and whom to ask"
    keywords: ["approved tool", "contact", "ask"]
  - point: "Checks understanding with scenarios or a quiz"
    keywords: ["quiz", "scenario"]
  - point: "Repeats for new joiners and measures behaviour, not only attendance"
    keywords: ["new joiners", "every year", "behaviour", "incidents"]
answer_seconds: 120
example: "I would replace the long document with short training by role. Everyone gets a 20-minute session and a one-page guide with real examples: can I paste a customer complaint into the assistant, can I use it to draft an appraisal. For each example we show what is allowed and which approved tool to use. HR, finance and developer teams get a deeper one-hour session, because they handle salary data, payment data and source code. There is a channel where anyone can ask the AI governance contact a question. At the end there is a five-question scenario quiz. New joiners get it in induction, and everyone repeats it every year. I would measure completion, quiz results, and behaviour: use of the approved tool, questions asked, and the number of incidents."
