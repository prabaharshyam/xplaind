id: mistake-you-made
question: "Tell me about a mistake you made at work and what you did about it."
kind: real-life
short_answer: "Pick a real mistake that was your own. Say what happened in one or two sentences, then how you noticed it, who you told and how quickly, and how you fixed it. End with the check or habit you added. Speed and honesty matter more than the size of the mistake."
deeper_answer: "This is a smaller question than the failure question. The interviewer wants to see how you behave in the first hour after a mistake. Do you hide it, or do you report it and fix it?\n\nStructure: the situation and your task, the mistake in plain words, the action you took, and the result. Say the time gap clearly, for example: \"I told my lead within ten minutes, before any customer complained.\" Then say how you checked the damage and what you added to stop a repeat, such as a test, a checklist or a review step. Do not choose a mistake that hurt nobody and taught nothing."
follow_ups:
  - "How did your lead react when you told them?"
  - "What stops the same mistake from happening again?"
  - "What would you have done if nobody had noticed?"
common_mistakes:
  - "Choosing a mistake that was really someone else's"
  - "Hiding how long it took to report it"
  - "Giving no check or habit that came out of it"
level: I1
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "States a real mistake that was their own"
    keywords: ["mistake", "i changed", "i pushed", "without running", "my error", "i forgot"]
  - point: "Reported it quickly to the right person"
    keywords: ["told", "informed", "lead", "manager", "at once", "immediately"]
  - point: "Fixed it and checked the damage"
    keywords: ["rolled back", "fixed", "checked", "read all", "correction"]
  - point: "Added a check so it does not repeat"
    keywords: ["added", "test questions", "checklist", "review", "step"]
  - point: "Gives the result"
    keywords: ["since then", "result", "no wrong", "users"]
answer_seconds: 120
example: "In my first year as an AI engineer, I looked after the prompts for our customer support chatbot. One Friday I changed the refund prompt to make answers shorter and pushed it live without running our test questions, because the change looked small. Within an hour, a support agent noticed the bot was telling users that refunds take 2 days and not 7. I rolled back the change in five minutes and told my lead at once. Then I read all 46 chats from that hour, and we sent a correction to the 9 users who got the wrong answer. The next week I added a step so that no prompt goes live unless 120 test questions pass. Since then we have had no wrong refund answers from a prompt change."
