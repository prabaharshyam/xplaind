id: sec-llm-abuse-logging-detection
question: "What would you log from an LLM application for security, and which signs of abuse would you build detections for?"
kind: concept
short_answer: "Log who called, when, the prompt and response, retrieved documents, tool calls with arguments, guardrail decisions, tokens and cost. Detect repeated jailbreak or injection attempts, attempts to extract the system prompt, unusual volume or spend per user, denied tool calls, and outputs that contain secrets or personal data. Protect the logs and send the events to the SIEM."
deeper_answer: "For an LLM app the attack is inside the text and in what the model then does, so I need the content and the actions: prompts, retrieved chunks and tool calls, tied to an authenticated user and a session. Prompts often contain personal data, so the logs themselves are sensitive: restrict access, mask where possible and set retention.\n\nDetections then follow the threats. Many guardrail blocks from one account suggest someone probing for a jailbreak. A high volume of systematic queries can mean model extraction or scraping of the knowledge base. A spike in tokens can be a stolen key or an attack that aims to run up our bill. A tool call that was denied, or a tool sequence never seen before, can mean a successful injection. I would start with a few high-signal rules, send them to the SIEM with user and session fields so analysts can correlate with other logs, and tune for false positives. Interviewers listen for tool-call logging, privacy of logs and concrete detections."
follow_ups:
  - "Prompts contain personal data. How do you log them safely?"
  - "How would you tell a curious user from an attacker?"
  - "Which detection would you build first, and why?"
common_mistakes:
  - "Logging only latency and errors, with no content or tool calls"
  - "Keeping raw prompts with personal data open to everyone"
  - "Alerts on single keywords that fire all day"
level: P1
topic: security
stop_id: logs-and-siem
rubric:
  - point: "Logs prompts, responses, retrieved documents and tool calls, tied to a user"
    keywords: ["the prompt", "tool call", "retrieved documents", "user id"]
  - point: "Protects the logs: access control, masking, retention"
    keywords: ["mask", "retention", "limit access", "personal data"]
  - point: "Detects repeated jailbreak or injection attempts and guardrail blocks"
    keywords: ["jailbreak", "injection", "guardrail blocks"]
  - point: "Detects unusual volume, tokens or spend"
    keywords: ["spike", "token use", "spend", "stolen key"]
  - point: "Sends events to the SIEM and tunes for false positives"
    keywords: ["siem", "correlate", "false positives"]
answer_seconds: 150
example: "For every request I would log the user id and session, the prompt and the response, the retrieved documents, each tool call with its arguments, the guardrail decision, and the token count. These logs hold personal data, so I would mask things like phone and PAN numbers, limit access to the security team, and set a retention period. Then I would build a few detections. One: more than five guardrail blocks from one user in ten minutes, which suggests jailbreak or injection attempts. Two: prompts that ask to repeat the system prompt. Three: a spike in token use or spend for one key, which can mean a stolen key. Four: a tool call that was denied by the permission layer. All events go to the SIEM with the user id, so analysts can correlate them with login logs, and we tune the rules to cut false positives."
