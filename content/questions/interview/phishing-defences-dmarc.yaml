answer_seconds: 100
example: "For a hypothetical Ahmedabad textile exporter, DMARC reports showed our invoicing tool sending mail that failed SPF. We fixed that, moved DMARC from none to reject over two months, and spoofed mail in our name stopped reaching buyers. Separately, a look-alike domain targeted our accounts team, and the call-back rule for bank detail changes stopped the payment."
