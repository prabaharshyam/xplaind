id: phishing-defences-dmarc
question: "How would you defend a company against phishing? Where do SPF, DKIM and DMARC fit in?"
kind: concept
short_answer: "Use layers. SPF lists which servers may send mail for our domain, DKIM signs messages, and DMARC tells receivers what to do when those checks fail and sends us reports, which stops others spoofing our exact domain. Add mail filtering, phishing-resistant MFA, link and attachment checks, an easy report button, and short, regular training."
deeper_answer: "SPF, DKIM and DMARC protect your own domain from being forged. Roll DMARC out in stages: start with p=none to collect reports and find all legitimate senders, such as the payroll or marketing tool, then move to quarantine and reject. They do not stop look-alike domains such as a letter swapped or a different ending, or mail from a real but hacked account.\n\nSo other layers matter: filtering and sandboxing of attachments, warnings for external senders and new domains, phishing-resistant MFA such as passkeys or security keys so a stolen password is not enough, and processes such as call-back checks before payment changes. Make reporting one click and thank people who report; measure report rate, not just click rate."
follow_ups:
  - "Why does DMARC not stop a look-alike domain?"
  - "Why start DMARC with p=none?"
common_mistakes:
  - "Thinking DMARC stops all phishing"
  - "Relying only on training and blaming people who click"
