answer_seconds: 165
example: "A drop from 91 to 89.5 does not tell me enough, so I would slice the eval. If the loss is spread evenly, it may be fine. If English is flat and Tamil falls six points, we would be hurting one group of users to save money. Next I check the saving is real with a load test, because 4-bit cuts memory but throughput and latency depend on our serving stack. Say it truly saves 8 GPUs, about ₹15 lakh a month. I put that beside the cost of the extra errors. I would also test middle options: 8-bit, or a route that sends legal and regional language requests to the full model. I would agree the bar with the product owner, then ship as a canary on 5% of traffic with a quick roll back."
