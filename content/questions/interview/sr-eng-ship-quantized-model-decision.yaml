id: sr-eng-ship-quantized-model-decision
question: "Serving your model with 4-bit weights instead of 16-bit would cut the fleet from 20 GPUs to 12, but your eval score falls from 91% to 89.5%. How do you decide whether to ship the quantized model?"
kind: use-case
short_answer: "I would not decide on the average score. I would find which cases got worse, because a 1.5 point drop may be concentrated in one language or task. Then I put the saving beside the cost of those errors, test real latency and throughput, and consider a mix: quantized for most traffic, full precision for sensitive requests."
deeper_answer: "Quantization lowers memory and cost by storing weights with fewer bits, and the quality loss is rarely even. Rare words, long reasoning chains, numbers and lower-resource languages often suffer first. So slice the eval: if English is unchanged but Tamil answers fall by six points, the average hides a real harm to one group of users.\n\nAlso confirm the saving. Fewer bits reduce memory, but throughput depends on the serving stack and hardware support, so run a load test before promising 8 fewer GPUs. Then look at options between yes and no: 8-bit instead of 4-bit, routing sensitive or hard requests to the full model, or a canary on 5% of traffic with online quality signals. This is a business trade-off, so the engineer brings numbers and the product owner agrees the bar. Interviewers listen for sliced evaluation, verified savings, intermediate options and a rollout that can be reversed."
follow_ups:
  - "Which kinds of request would you expect to suffer most from quantization?"
  - "How would you check that 12 GPUs really carry the peak load?"
  - "Who should make the final decision, and what do you give them?"
common_mistakes:
  - "Judging only by the average eval score"
  - "Assuming fewer bits always means higher throughput"
  - "Treating it as a yes or no choice with nothing in between"
