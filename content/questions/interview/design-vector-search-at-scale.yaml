answer_seconds: 180
example: "First I would clarify the recall target, the queries per second and how selective each filter is. Then I estimate the size: 500 million vectors of 768 floats need about 1.5 TB of memory raw, so exact search is not possible. I split the data into shards, around 20, each with a replica, and query them in parallel. Inside each shard I use an approximate index: vectors are grouped into clusters and compressed with product quantization. The search runs on the compressed codes, returns a few hundred results, and I rerank those with the full vectors stored on disk. For category I partition the index, and for price I filter inside the search, because filtering after it can leave too few results. New items go into a small fresh segment. I measure recall at 10 against exact search on a sample of queries, at p99 under 50 milliseconds. The trade-off is memory against recall: stronger compression is cheaper, but it loses neighbours."
