answer_seconds: 150
example: "I would ask whether a store and month pair can appear twice, and what to show when a pair is absent. If pairs are unique I can use pivot, which raises an error on duplicates. I will assume duplicates are possible and should be summed, so I use df.pivot_table(index=\"store\", columns=\"month\", values=\"sales\", aggfunc=\"sum\", fill_value=0). I name the aggfunc on purpose, because the default is the mean. The index gives one row per store, and each distinct month becomes a column. The wide table has stores times months cells, so I check how many distinct months there are first. For S1 with Jan 10 and Feb 20, I get one row with both values. I would test a store with no February row, which should show 0. The reverse step, wide to long, is melt."
