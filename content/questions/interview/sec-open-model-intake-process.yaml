id: sec-open-model-intake-process
question: "Data science teams in your company download open models and datasets from public hubs every week. How would you set up a process that controls the supply chain risk without blocking their work?"
kind: use-case
short_answer: "A light intake path. Models and datasets come through an internal registry or mirror, from known publishers, pinned to an exact revision and hash. Automated checks scan files for unsafe formats and malware and record the licence. New items are tested in a sandbox with no network access. Everything is listed in an inventory, so we can respond fast."
deeper_answer: "The risks differ from normal software. Model files can contain executable code. A model can carry a backdoor that no file scanner sees, because it is in the weights. A dataset can be poisoned, or can contain personal or copyrighted material. And a public repository can change after review, so the same name does not mean the same file.\n\nThe process must be faster than going around it. Low-risk cases pass automatically: a weights-only format from a verified organisation with a permissive licence. Pinning by hash means that what was reviewed is what runs. For backdoors there is no complete test, so I rely on provenance, behaviour tests on our own evaluation set, and limits on what the model can reach in production. Datasets get a check of source, licence and personal data. An inventory, sometimes called an AI bill of materials, lets us answer 'where do we use this model' in minutes. Interviewers listen for pinning, provenance, the limits of scanning, and a process developers will use."
follow_ups:
  - "A scanner reports a model file as clean. What can still be wrong with the model?"
  - "How do you handle a licence that forbids commercial use?"
  - "A model you use is reported as malicious. What do you do in the first hour?"
common_mistakes:
  - "Checking only code dependencies and ignoring models and datasets"
  - "Pulling the latest version by name at build time"
  - "A review process so slow that teams bypass it"
level: P2
topic: security
