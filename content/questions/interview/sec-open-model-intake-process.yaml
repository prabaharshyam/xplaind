answer_seconds: 150
example: "I would give the teams a fast, approved path. All models and datasets are pulled through an internal registry that mirrors the public hub. A request names the publisher and the exact revision, and we pin it by hash, so what we reviewed is what runs. An automated pipeline does a scan of the files: it prefers safetensors, flags pickle files, checks for malware and records the licence. Low-risk requests pass the same day without a person. I would be clear that a scan cannot find a backdoor in the weights. So new models first run in a sandbox with no network, and we run behaviour tests on our own evaluation set. For datasets we check the source, the licence and personal data. Everything goes into an inventory, so when a model is reported as malicious we know in minutes where we use it."
