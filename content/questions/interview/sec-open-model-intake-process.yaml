id: sec-open-model-intake-process
question: "Data science teams in your company pull open models and datasets from public hubs every week, and model files are already scanned. What supply chain risks remain, and how would you set up a process that handles them without blocking the teams?"
kind: use-case
short_answer: "A scan finds unsafe files, not everything. A backdoor can sit in the weights, a dataset can be poisoned or hold personal data, a licence can forbid our use, and a repository can change after review. So: pin by hash, check provenance and licence, run behaviour tests in a sandbox, keep an inventory, and give low-risk requests a fast path."
deeper_answer: "The risks differ from normal software. A model can carry a backdoor that no file scanner sees, because it is in the weights: it behaves normally until a trigger input appears. A dataset can be poisoned, or can contain personal or copyrighted material that becomes our problem when we train on it. A licence may forbid commercial use. And a public repository can change after review, so the same name does not mean the same file.\n\nThe process must be faster than going around it. Pinning by hash means that what was reviewed is what runs. For backdoors there is no complete test, so I rely on provenance, behaviour tests on our own evaluation set, and limits on what the model can reach in production. Datasets get a check of source, licence and personal data, and a person reads a sample. An inventory lets us answer 'where do we use this model' in minutes. Interviewers listen for the limits of scanning, datasets, pinning, and a process developers will use."
follow_ups:
  - "A scanner reports a model file as clean. What can still be wrong with the model?"
  - "How do you handle a licence that forbids commercial use?"
  - "A model you use is reported as malicious. What do you do in the first hour?"
common_mistakes:
  - "Believing a clean scan means a safe model"
  - "Reviewing models but not datasets"
  - "Pulling the latest version by name at build time"
level: P2
topic: security
stop_id: ai-supply-chain
rubric:
  - point: "Knows a scan cannot find a backdoor in the weights; uses provenance and behaviour tests"
    keywords: ["backdoor", "behaviour tests", "known publisher", "sandbox"]
  - point: "Covers datasets: source, poisoning, personal or copyrighted data"
    keywords: ["dataset", "personal data", "poisoned"]
  - point: "Checks the licence against the intended use"
    keywords: ["licence", "commercial use"]
  - point: "Pins by hash, because a repository can change after review"
    keywords: ["hash", "pin it", "change after", "exact revision"]
  - point: "Inventory for fast response, and a fast path so teams do not bypass the process"
    keywords: ["inventory", "in minutes", "same day"]
answer_seconds: 150
example: "A scan cannot find a backdoor in the weights, and it says nothing about datasets or licences. So I would add four things. One: every model comes through an internal registry, with a known publisher and an exact revision, and we pin it by hash, because a public repository can change after our review. Two: new models run in a sandbox with no network, and we run behaviour tests on our own evaluation set. Three: each dataset gets a check of its source, its licence and personal data, and a person reads a sample to look for poisoned or strange records. A licence that forbids commercial use is rejected. Four: everything goes into an inventory, so if a model is reported as malicious we know in minutes where we use it. Low-risk requests are approved the same day, so teams do not go around the process."
