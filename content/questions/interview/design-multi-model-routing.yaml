answer_seconds: 150
example: "I would first clarify what the 5 million requests are. I would sample real traffic, group it by task, and build an evaluation set for each task, then run both models on it. Where the cheap model matches the strong one, for example classification and extraction, that traffic can move. The router starts as simple rules on task type and input length, then a small classifier trained on cases where the cheap model failed. For mixed tasks I would use a cascade: the cheap model answers, a quick check validates the output, and failures escalate to the strong model. The trade-off is that escalated requests cost more and are slower, so the cascade only helps when most requests pass. Unknown request types go to the strong model. I would roll out gradually at 5 percent, and monitor cost, latency and quality per route, not only the average."
