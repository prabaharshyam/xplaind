answer_seconds: 180
example: "I would ask whether the total restarts for each customer, and whether two orders can have the same date. I will assume yes to both. I use a window function, because I need to keep every row: SUM(amount) OVER (PARTITION BY customer_id ORDER BY order_date, order_id ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW). PARTITION BY restarts the sum for each customer and ORDER BY decides the order. I add order_id as a tiebreaker and write the ROWS frame myself, because the default frame treats rows with the same date as peers and gives them the same total. The cost is one sort per partition. For orders of 100, 50 and 25, I get 100, 150 and 175. I would test two orders on the same date and check that the totals are 150 and then 175, not 175 twice."
