answer_seconds: 90
example: "On an AI feature that answers sellers' questions about marketplace fees, I wrote what a good answer must do, such as quote the exact fee for that category, link the policy and never guess, and gathered 120 real seller questions with the support team. Engineers turned these into automated checks. Every Thursday we reviewed the failures together, and I decided that reaching 95% on fee questions was the bar for launch."
