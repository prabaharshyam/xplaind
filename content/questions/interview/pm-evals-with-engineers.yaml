id: pm-evals-with-engineers
question: "As a PM, how do you work with engineers on evals?"
short_answer: "Own the definition of good: write down what a good answer must do and avoid for the main user tasks, help collect realistic examples with domain experts, and agree on the pass bar for launch. Engineers automate the checks; you review failures with them regularly, decide trade-offs and make sure new production failures become test cases."
deeper_answer: "Evals are the AI version of acceptance criteria. A PM who can read twenty outputs and say why each is good or bad is far more useful than one who asks only for an accuracy number.\n\nKeep the eval set tied to product priorities: weight the cases users care about most, add segments such as language or customer type, and track scores on a simple dashboard reviewed in every planning meeting."
follow_ups:
  - "What is the PM's role versus the engineer's in evals?"
  - "How do you set a launch bar?"
common_mistakes:
  - "Leaving quality definitions to engineers alone"
  - "Asking for one accuracy number"
