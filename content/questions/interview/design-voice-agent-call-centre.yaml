    keywords: ["handoff", "hand off", "human", "resolution", "transfer"]
answer_seconds: 180
example: "I would clarify the call types first: here it is order status and returns, in English and Hindi. The design is a streaming pipeline: telephony audio goes into speech-to-text, the text goes to a model with tools for order lookup and returns, and the reply streams into text-to-speech. To reach one second I set a latency budget: about 200 ms for transcription, 500 ms to the first token and 200 ms to first audio, with a small, fast model and short replies. The agent must stop talking when the caller starts to interrupt. Before sharing order details it will verify identity, and it will read back the order number and confirm before creating a return. The trade-off is that a pipeline is easier to control and log than one speech-to-speech model, but less natural. Angry callers or repeated failures get a handoff to a human with a summary. I would track resolution rate and transfers."
