id: design-voice-agent-call-centre
question: "Design a voice AI agent for a call centre that takes 50,000 calls a day about order status and returns. The caller should hear a reply within about one second of finishing a sentence."
kind: use-case
short_answer: "Clarify call types, languages and what must go to a person. Pipeline: telephony, streaming speech-to-text, a model with tools for order lookup, streaming text-to-speech. Set a latency budget per stage, handle interruptions and silence, verify identity before sharing data, hand off to a human with a summary, and measure resolution, latency and transfers."
deeper_answer: "Requirements: the top call reasons, languages and accents, noisy phone audio, identity checks, and rules about recording and telling callers they are speaking to an AI.\n\nDesign: audio streams from telephony into speech-to-text. End-of-turn detection decides when the caller has finished. The model gets the conversation and tools for order lookup and return creation, and its output streams into text-to-speech sentence by sentence. Give each stage a latency budget, for example 200 ms for transcription, 500 ms to the first model token and 200 ms to first audio. Use a small, fast model for most turns and short spoken replies. Play a brief phrase such as \"let me check\" while a tool runs. Support barge-in: stop speaking when the caller interrupts.\n\nTrade-offs: a single speech-to-speech model can be faster and more natural, but a pipeline of separate parts is easier to control, test and log. Risks: numbers and names heard wrongly, so read back order numbers and confirm before any action. Hand off to a human, with a summary, on anger, repeated failure or anything outside scope. Tail latency at peak load breaks first, so load test."
follow_ups:
  - "Where does the one second go, and which stage would you speed up first?"
  - "How do you handle a caller who interrupts the agent?"
  - "How would you test this before real customers call?"
common_mistakes:
  - "Designing it as a chat bot and ignoring turn-taking"
  - "No latency budget per stage"
  - "No path to a human agent"
level: P3
topic: system-design
stop_id: design-interview
