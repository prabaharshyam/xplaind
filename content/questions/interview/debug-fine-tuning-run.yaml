example: A grader we fine-tuned looked like the base model. Training loss was flat, and we found the learning
  rate was 1e-6. At 2e-4 the loss fell, validation was best after epoch 2, and that checkpoint beat our
  prompt baseline by 12 points. The remaining gap was in Tamil answers, so we added Tamil examples.
