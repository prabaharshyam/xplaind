id: debug-fine-tuning-run
question: Your fine-tuned model is no better than the base model. How do you debug it?
kind: scenario
short_answer: 'First check the pipeline: can the model overfit 20 examples? If not, check data format,
  masking and the chat template. Then read the loss curves: flat means the learning rate is too low or
  labels are wrong; spikes mean it is too high; rising validation loss means overfitting. Finally, compare
  on a locked test set against a good prompt.'
deeper_answer: 'I would read a sample of training examples for errors and inconsistency, and confirm the
  template used in training matches the one used at inference, a common silent failure. I would change
  one setting at a time: learning rate first, then epochs, then batch size with gradient accumulation
  if memory is tight.


  If 50 to 100 good examples show no gain at all, more data rarely helps; the setup is usually wrong.
  If gains appear but lag in one segment, I would add data for that segment rather than tune further.'
follow_ups:
- What learning rate would you start with for LoRA?
- How do you choose the number of epochs?
common_mistakes:
- Changing many settings at once
- Judging only by training loss
level: P1
topic: approach-choice
