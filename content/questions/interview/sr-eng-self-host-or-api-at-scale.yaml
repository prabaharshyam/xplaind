id: sr-eng-self-host-or-api-at-scale
question: "Your company pays about ₹1.2 crore a month to an LLM API provider, and the CFO asks whether hosting an open-weight model yourselves would halve the bill. How do you decide, and what do you tell the CFO?"
kind: use-case
short_answer: "Not from price per token. I would split the traffic by task, test which tasks an open-weight model handles at our quality bar, and compare full cost: GPUs at real utilisation, engineers, on-call and upgrades. Usually the answer is a hybrid: move high-volume simple tasks, keep hard ones on the API, and decide with a pilot."
deeper_answer: "The API bill is visible and the self-hosting cost is hidden. Reserved GPUs cost the same at 3 a.m. as at peak, so utilisation decides the real price per request. Add two or three engineers for serving, on-call, model upgrades and security patches. Quality is the other half: if 70% of spend is classification and extraction, a smaller open-weight model may pass the same eval set, but complex reasoning tasks may not.\n\nA strong answer proposes a time-boxed pilot on one high-volume task, with the break-even point stated in advance: self-hosting wins only above a certain steady volume. It also names what is lost, such as new provider models arriving with no work on your side, and gives the CFO a range instead of a promise. Interviewers listen for total cost, utilisation, an eval gate and a decision that can be reversed."
follow_ups:
  - "How would you work out the break-even volume?"
  - "What would make you move a task back to the API after self-hosting it?"
  - "Who carries the on-call load for the self-hosted model?"
common_mistakes:
  - "Comparing only price per token with GPU rental price"
  - "Assuming GPUs run at full utilisation all day"
  - "Promising a saving before testing quality on real tasks"
level: P3
