answer_seconds: 180
example: "I would tell the CFO that halving is possible for part of the bill, not all of it. First I would split the ₹1.2 crore by task. Say 65% is extraction and classification, and 35% is long reasoning. I would run our eval set on an open-weight model for the simple tasks. If quality holds, I compare total cost: GPUs sized for peak but idle at night, so utilisation matters, plus two engineers and an on-call rota. My proposal would be a hybrid: a six-week pilot that moves one high-volume task, with a break-even number agreed first. I would give the CFO a range, maybe 20 to 35% saving, and say clearly what we lose: new provider models that arrive with no work from us."
