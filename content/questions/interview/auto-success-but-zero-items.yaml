id: auto-success-but-zero-items
question: "A lead-routing workflow has shown 'success' on every run for two weeks, but the sales team says no new leads arrived in that time. What happened, and how do you prevent it?"
kind: scenario
short_answer: "A run can succeed while doing nothing. Probably the trigger or a filter returned zero items: an expired connection that returns empty, a renamed field, or a changed form. I trace one known lead through the steps, fix the cause, replay the missed leads, and add a check on output counts and a daily comparison with the source."
deeper_answer: "Workflow tools report technical success: no step raised an error. They do not know that 40 leads a day is normal and zero is wrong. Silent failures are worse than loud ones because nobody looks. Typical causes are a filter that no longer matches after a field rename, an API that returns an empty list after a permission change, or a branch that ends without doing anything.\n\nTo find it, I take one real lead from the form tool and follow it through the input and output of each node. To prevent it, I monitor the business result, not the run status: alert if no leads were routed in a working day, and reconcile each evening the count in the form tool against the count in the CRM. I also make unexpected cases fail loudly, for example an error when a required field is missing. Then I recover the two weeks of leads. Interviewers listen for output monitoring and reconciliation."
follow_ups:
  - "How would you recover the leads from the last two weeks?"
  - "What is a sensible alert for a workflow with very uneven volume?"
  - "Why did the run status not show the problem?"
common_mistakes:
  - "Trusting the green status of the run"
  - "Fixing the cause but not recovering the missed leads"
  - "Alerting only on errors, never on low volume"
level: I2
topic: automation
stop_id: automation-error-handling
rubric:
  - point: "Explains that success only means no step raised an error"
    keywords: ["no error", "zero items", "only means"]
  - point: "Traces a known lead through each step to find the cause"
    keywords: ["follow it", "one lead", "each node", "trace"]
  - point: "Names likely causes: filter, renamed field, empty response"
    keywords: ["filter", "renamed", "empty"]
  - point: "Monitors output counts and reconciles with the source"
    keywords: ["count", "compares", "no leads", "reconcile"]
  - point: "Recovers the missed leads"
    keywords: ["replay", "recover", "missed leads"]
answer_seconds: 120
example: "Success in the tool only means that no error was raised. The workflow can run and process zero items. I would take one lead that I know was submitted last week and follow it through each node. In a case like this at a coaching institute in Hyderabad, the marketing team had renamed the form field from city to location, so the filter matched nothing and every run ended early. After the fix, I would replay the missed leads from the export of the form tool and tell the sales head how many there were. To prevent it, I would add an alert if there are no leads on a working day, and an evening check that compares the count of form entries with the count of new CRM leads. I would also make a missing required field raise an error."
