answer_seconds: 160
example: "For 15 teams and 10 million daily users, I would first clarify the unit of randomisation, which is the user, plus one primary metric per experiment and shared guardrail metrics such as latency and returns. An assignment service takes a hash of the user id with a salt, so each user stays in one variant. Experiments sit in layers, so a search test and a recommendation test can overlap without mixing. Every exposure goes into a log with the model version, and a pipeline joins it to orders and reports the difference with a confidence interval. Before launch, the platform calculates the sample size and the duration, and it warns against stopping early. Each model starts at one percent and ramps up, with an automatic alert and a kill switch on guardrails. I would also run a sample ratio check. The trade-off is speed against trust: short tests give quick answers but more false wins."
