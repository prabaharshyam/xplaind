id: agent-x-wrong-memory
question: "Your assistant saved the note 'prefers calls in Hindi' against the wrong customer and now repeats the mistake in every session. How do you fix it, and how do you stop it from happening again?"
kind: scenario
short_answer: "First delete the wrong entry and use the trace to find how it was written. Then tighten memory writes: save only explicit, confirmed facts, keyed by a verified customer ID, with source and date attached. Let users and staff see and correct memories. At read time, treat memory as a hint and check important facts against the system of record."
deeper_answer: "A wrong memory is worse than a wrong answer, because it is loaded into every later session and looks trusted. Most such bugs come from the write path. The model guessed a fact from a weak signal, or the entry was keyed by a name or phone number that two customers share, or by the wrong session.\n\nSo the controls sit on writes. Decide what is allowed into long-term memory. Require a verified customer ID as the key. Store provenance with each entry: which conversation, when, and whether the customer said it or the model inferred it. Inferred items can expire or need confirmation. Give people a way to view, edit and delete entries, which privacy rules often expect anyway. On reads, pass memories to the model as possibly out of date, and prefer the CRM for anything that matters. Interviewers listen for write policy, provenance, correction and a test that covers memory."
follow_ups:
  - "What should never be written to long-term memory?"
  - "How would you find other customers affected by the same bug?"
  - "How do you test memory in an eval suite?"
common_mistakes:
  - "Deleting the one bad entry and stopping there"
  - "Letting the model save anything it infers"
  - "Keying memory by name or phone number, not by a verified ID"
level: P1
topic: agents
stop_id: agent-memory
rubric:
  - point: "Removes the wrong entry and traces how it was written"
    keywords: ["delete", "remove", "trace", "how it was written"]
  - point: "Sets a write policy: only explicit or confirmed facts are saved"
    keywords: ["write", "explicit", "confirm", "policy"]
  - point: "Keys memory by a verified customer ID"
    keywords: ["customer id", "verified", "key"]
  - point: "Stores provenance such as source and date, with expiry for inferred items"
    keywords: ["source", "date", "provenance", "expir", "inferred"]
  - point: "Lets people view and correct memory, and treats it as a hint at read time"
    keywords: ["correct", "edit", "view", "hint", "system of record", "crm"]
answer_seconds: 120
example: "First I would delete the wrong entry and read the trace to see how it was written. My guess is that the memory was keyed by phone number, and two family members share one number. Then I would search for other entries written by the same path. To prevent it, I would change the write policy. The assistant saves a preference only when the customer states it in explicit words, and the key is the verified customer ID from login, never a name or number. Each entry stores its source conversation and date, and anything the model inferred will expire after 90 days unless confirmed. Support staff can view and edit a customer's memories on the CRM screen. At read time the prompt presents memory as a hint, so the assistant can ask: shall I continue in Hindi?"
