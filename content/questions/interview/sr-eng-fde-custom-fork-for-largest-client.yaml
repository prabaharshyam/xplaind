id: sr-eng-fde-custom-fork-for-largest-client
question: "Your largest client, about 30% of revenue, asks for three custom features that would need a separate fork of the product and three engineers for four months, and your product team says no. How do you handle it?"
kind: real-life
short_answer: "I would find the need behind each feature before taking sides. Often one is a real product gap, one can be done with configuration or an integration, and one is a preference. I would price the true cost of a fork, including every future upgrade, offer options with dates and costs, and escalate the decision with a clear recommendation."
deeper_answer: "A forward deployed engineer stands between the client and the product, and both simple answers are wrong. Saying yes creates a fork that must be merged with every release for years, and three engineers for four months is only the first cost. Saying no puts 30% of revenue at risk and ignores that the largest client often sees needs early.\n\nSo separate the requests. Ask what outcome each feature serves and what happens without it. Then design options: build the generally useful one into the main product, deliver the second through an extension point or the client's own integration, and decline the third with a reason. If a fork is truly required, it should be a paid, time-limited engagement with a plan to merge back. This is a business decision above your level, so write a one-page brief with costs, risks and your recommendation. Interviewers listen for discovery, long-term cost, creative options and clean escalation."
follow_ups:
  - "How do you estimate what a fork costs over three years?"
  - "The client threatens to leave if all three features are not built. What now?"
  - "How do you say no to one request and keep the relationship?"
common_mistakes:
  - "Passing messages between client and product team without a view of your own"
  - "Agreeing to a fork to protect revenue this quarter"
  - "Counting only the build cost and not every later upgrade"
level: P2
