answer_seconds: 165
example: "I would not carry a yes or a no between the two sides. First I would sit with the client's users and ask why they need each feature and what outcome it serves. Usually the three are different. Say the audit export is something every bank will want, so I push for it on the product roadmap. The custom approval flow can be done with configuration and their own integration through our API. The third, a new screen layout, is a preference, and I would say no kindly. I would also show the real cost of a fork: three engineers for four months, then a merge with every release after that. I would write a one-page brief for leadership with these options, costs and dates, and recommend no fork, with paid custom work only where it can merge back."
