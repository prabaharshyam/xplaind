id: other-offers-question
question: "Are you interviewing anywhere else? Do you have other offers?"
kind: real-life
short_answer: "Answer honestly and briefly. If you are in other processes or hold an offer, say so. You need not share names or figures. Never invent an offer. Then say clearly why this company interests you and give any real deadline you have. If you have nothing else yet, say you are early in your search."
deeper_answer: "The interviewer wants to know how fast to move and how serious you are about them. Other interviews are not a problem. They show that the market values you. An invented offer is a problem, because recruiters often ask for the letter, and they talk to each other.\n\nUse three parts: the facts, your preference, your timeline. For example: \"I am in the final round with one other company and have no offer yet. This role is my first choice because of the evaluation work. I expect to hear from them by next Friday.\" You do not have to name the other company or its numbers. If you do hold an offer, share the deadline so they can plan, and do not use it as a threat."
follow_ups:
  - "Which companies are they, and for what roles?"
  - "If we make an offer, how soon can you decide?"
  - "How do we compare with your other options?"
common_mistakes:
  - "Inventing an offer to push for more pay"
  - "Using a real offer as a threat"
  - "Saying this is the only company, with no reason why"
level: I2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "States honestly whether there are other interviews or offers"
    keywords: ["other companies", "final round", "offer", "interviewing", "early stage", "speaking to"]
  - point: "Explains why this role or company is preferred"
    keywords: ["first choice", "prefer", "interest", "because", "this role"]
  - point: "Gives a real timeline or deadline"
    keywords: ["deadline", "timeline", "next week", "by the end", "decide", "days"]
answer_seconds: 60
example: "Yes, I am speaking to two other companies. With one I am in the final round for a data scientist role, and I expect an answer by the end of next week. The other is at an early stage. I do not have any written offer today. I would prefer not to name them, but both are product companies in Bengaluru. I want to be open about my preference. This role is my first choice, because your team works on demand forecasting at a scale I have not handled in my three years, and I liked the technical round a lot. If you plan to make an offer, it would help me to know your timeline, so that I can give every company a fair and honest answer."
