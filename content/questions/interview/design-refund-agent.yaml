id: design-refund-agent
question: "Design an agent that handles refund requests for an online store."
kind: use-case
short_answer: "The agent reads the request, looks up the order through read-only tools, checks it against the refund policy, and drafts a decision. Small refunds that clearly meet policy go through automatically; anything above a threshold or unclear goes to a person with the evidence. Tools are narrow, every step is logged, and I measure accuracy against past decisions before launch."
deeper_answer: "Start with the policy, not the model: which refunds are automatic, which need approval, which are refused. The agent's tools should be narrow and least-privilege, for example get_order, get_delivery_status and propose_refund, with the payment action behind an approval step or a hard amount limit.\n\nCustomer messages are untrusted input, so instructions inside them must not change what the agent may do. Evaluate on a set of real past requests with known correct outcomes, track the refund amount and error rate after launch, and keep an easy route to a human for angry or complex cases."
follow_ups:
  - "What threshold would you set for automatic refunds, and why?"
  - "How would you stop a customer from talking the agent into a refund?"
common_mistakes:
  - "Giving the agent direct access to issue any refund"
  - "Testing only on made-up requests"
level: I3
topic: agents
stop_id: human-approval
rubric:
  - point: "Starts from the refund policy and clear rules"
    keywords: ["policy", "rules", "eligible"]
  - point: "Uses narrow, least-privilege tools"
    keywords: ["tool", "read-only", "least privilege", "narrow"]
  - point: "Sends large or unclear cases to a human"
    keywords: ["human", "approval", "threshold", "escalate"]
  - point: "Treats customer text as untrusted"
    keywords: ["untrusted", "prompt injection", "instructions"]
  - point: "Evaluates on past requests and logs every step"
    keywords: ["evaluate", "past", "test set", "log"]
answer_seconds: 90
example: "For a home-goods store I sketched it like this: refunds under ₹1,500 for items marked 'not delivered' by the courier are proposed and paid automatically; anything else goes to the support queue with the order history and the agent's reasoning. The agent could read orders and courier status but could only call propose_refund, and a separate service checked the amount limit. We replayed three hundred past tickets and it matched the human decision on most of them; the mismatches became new test cases."
