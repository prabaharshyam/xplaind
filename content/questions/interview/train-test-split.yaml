id: train-test-split
question: "Why do we split data into training, validation and test sets?"
short_answer: "To measure how a model or system performs on data it has not seen. You train on the training set, tune choices on the validation set, and report final performance once on the test set. If you tune on the test set, your score becomes optimistic and stops predicting real-world results."
deeper_answer: "Each tuning decision leaks a little information about the data you tuned on. Keeping a test set untouched until the end gives an honest estimate. For time-based data, split by time so you do not train on the future.\n\nThe same discipline applies to LLM apps: keep a fixed eval set, and if you iterate heavily on it, keep a second held-out set to confirm the improvement is real. Make sure the sets reflect real user inputs, including messy and adversarial ones."
follow_ups:
  - "How would you split data that changes over time?"
  - "How does this apply when you only change prompts, not train a model?"
common_mistakes:
  - "Tuning repeatedly on the test set"
  - "Letting near-duplicate examples appear in both training and test data"
