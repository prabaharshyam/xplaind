id: ai-report-wrong-figure
question: "Your manager forwards a report a colleague wrote with AI, and one key figure looks wrong. What do you do?"
kind: scenario
short_answer: "Check the figure against its original source before saying anything. If it is wrong, tell the colleague privately first with the correct number and where it came from, then suggest a simple habit for the team: every number in an AI-assisted document is checked against a source before it is shared."
deeper_answer: "AI assistants can produce numbers that look precise but are made up or taken from the wrong year, region or table. The fix is not to stop using AI but to check the parts that matter: figures, dates, names and quotes.\n\nHandle the person kindly. Raising it privately lets the colleague correct the report without embarrassment, and it keeps the focus on the work. Then turn it into a team habit, such as a short checklist or a rule that every figure carries its source, so the same mistake does not repeat."
follow_ups:
  - "What if the report has already gone to a client?"
  - "Which parts of an AI-written document would you always check?"
common_mistakes:
  - "Correcting it publicly and embarrassing the colleague"
  - "Blaming the AI tool instead of fixing the checking step"
level: B1
topic: ai-literacy
stop_id: checking-ai-answers
rubric:
  - point: "Checks the figure against the original source first"
    keywords: ["source", "check", "verify", "original"]
  - point: "Raises it privately and respectfully with the colleague"
    keywords: ["privately", "colleague", "politely", "quietly"]
  - point: "Gives the correct figure with where it came from"
    keywords: ["correct", "where it came from", "reference"]
  - point: "Suggests a habit or rule so it does not happen again"
    keywords: ["habit", "checklist", "rule", "process", "always"]
answer_seconds: 90
example: "In my last job a colleague used ChatGPT to draft a market summary, and it said our city had twice the number of retail outlets I remembered. I found the original government table, saw the AI had picked up the state figure instead of the city one, and messaged her privately with the right number and the link. She fixed it before it went out. After that we agreed that any number in an AI draft gets a source next to it before we share it."
