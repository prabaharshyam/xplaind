id: workflow-fails-midway
question: "Your automation fails halfway through. How do you design for that?"
kind: scenario
short_answer: "Assume steps will fail. Add retries with backoff for temporary errors, an error workflow that alerts a person with the details, and make steps idempotent so re-running does not create duplicates. Log each run with its input, and keep a way to replay failed items once the cause is fixed."
deeper_answer: "Distinguish temporary failures, such as a timeout or rate limit, from permanent ones, such as invalid data; retry the first and route the second to a person. In n8n, an error workflow can catch failures from any workflow and post to a team channel.\n\nFor multi-step actions that must all happen or none, record progress so you can resume, or add a compensating step, such as cancelling an order created before the payment step failed."
follow_ups:
  - "How do you avoid creating a customer twice when a step is retried?"
  - "What should the alert say?"
common_mistakes:
  - "Silent failures nobody notices"
  - "Retrying permanent errors forever"
level: I1
topic: automation
stop_id: automation-error-handling
rubric:
  - point: "Retries with backoff for temporary errors"
    keywords: ["retry", "backoff", "temporary", "timeout", "rate limit"]
  - point: "Alerts a person with details"
    keywords: ["alert", "notify", "error workflow"]
  - point: "Idempotent steps avoid duplicates"
    keywords: ["idempot", "duplicate", "re-run", "rerun"]
  - point: "Logs runs and can replay failed items"
    keywords: ["log", "replay", "resume", "re-process"]
  - point: "Separates temporary from permanent failures"
    keywords: ["permanent", "invalid", "temporary"]
answer_seconds: 90
example: "In a workflow that created a customer in the CRM, then an invoice, then sent an email, the invoice API sometimes timed out after the customer was created. Re-running created duplicate customers. I made each step check first, looking up the customer by email before creating, added retries with backoff on the invoice step, and an error workflow that posted the failed record to a Slack channel with a 'replay' link once fixed."
