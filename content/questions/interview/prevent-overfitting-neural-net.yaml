answer_seconds: 90
example: "On a product-image classifier for an e-commerce catalogue, training accuracy reached 99% while validation stalled around 80% and validation loss rose after epoch six. I first added data augmentation, such as flips, crops and colour changes, which helped most, then dropout and weight decay, and early stopping on validation loss. Finally I switched to a pretrained backbone, which gave the biggest jump. I changed one thing at a time to know what helped."
