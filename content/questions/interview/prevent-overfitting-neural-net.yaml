id: prevent-overfitting-neural-net
question: "Your neural network overfits. What do you try?"
kind: scenario
short_answer: "Confirm it first: training loss keeps falling while validation loss rises. Then get more or augmented data, add regularisation such as dropout and weight decay, use early stopping on validation loss, shrink the model, or start from a pretrained model. Change one thing at a time and compare on the same validation set."
deeper_answer: "Data augmentation is often the biggest win for images and audio: random crops, flips, colour changes or noise make the model see varied examples. Dropout randomly zeroes activations during training; weight decay penalises large weights; early stopping keeps the checkpoint with the best validation loss.\n\nAlso check for problems that look like overfitting: leakage between training and validation, a validation set from a different distribution, or a bug in evaluation mode, such as forgetting model.eval so dropout and batch norm behave as in training."
follow_ups:
  - "Why does model.eval matter for dropout and batch norm?"
  - "How does data augmentation reduce overfitting?"
common_mistakes:
  - "Changing many things at once"
  - "Forgetting to switch to evaluation mode"
level: I2
topic: deep-learning
stop_id: pytorch-basics
