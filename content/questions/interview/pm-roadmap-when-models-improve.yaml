id: pm-roadmap-when-models-improve
question: "Models improve every few months. How does that change the way you plan an AI product roadmap?"
kind: concept
short_answer: "Invest in what stays valuable when models change: evals, your own data, workflow fit and user trust. Avoid heavy engineering that only patches a current model weakness. Keep the model easy to swap, keep a list of ideas that are blocked by capability, and retest them on each new model."
deeper_answer: "A normal roadmap assumes the tools stay still. With AI, a task that fails today may work in six months, and the cost of a call may fall. So the question for each item is: does this get more valuable or less valuable when models improve? A large rule system built to fix a model's weak reasoning tends to become waste. An eval set, your own data and a place in the user's daily workflow gain value.\n\nIn practice, keep a short list of features that are not feasible yet, each with a small test. When a new model arrives, run the tests. Plan in shorter cycles, and commit to user problems more than to techniques. Interviewers listen for a clear split between durable and temporary work, and an example of deciding to wait or to build."
follow_ups:
  - "Give an example of work you would not do because a better model will remove the need."
  - "When is waiting for a better model the wrong choice?"
  - "How do falling model prices change your pricing plans?"
common_mistakes:
  - "Planning as if model capability is fixed"
  - "Waiting for a better model with no test to know when it has arrived"
  - "Treating prompt tricks as a lasting advantage"
level: P2
topic: product
stop_id: ai-pm-interviews
rubric:
  - point: "Separates durable work from work a better model removes"
    keywords: ["durable", "lasting", "stays useful", "patch"]
  - point: "Invests in evals, data and workflow fit"
    keywords: ["eval set", "own data", "workflow"]
  - point: "Keeps the model easy to swap"
    keywords: ["swap", "switch", "one interface"]
  - point: "Keeps a list of capability-blocked ideas and retests them"
    keywords: ["not feasible yet", "rerun", "retest", "new model"]
  - point: "Plans in shorter cycles around user problems"
    keywords: ["six weeks", "shorter", "user problems"]
answer_seconds: 120
example: "I plan around the fact that the model is the fastest changing part. For every roadmap item I ask if it stays useful when models improve. Work on our eval set, our own data and fitting into the user's workflow is durable, so it gets priority. A complex rule layer that is only a patch for a weak model gets less. We keep the model easy to swap behind one interface. I also keep a list of ideas that are not feasible yet, such as reading handwritten Marathi forms, each with 50 test cases. When a new model comes out, we rerun those tests in a day. And I review the roadmap every six weeks, not once a year, framed around user problems."
