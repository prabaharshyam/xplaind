answer_seconds: 130
example: "I cannot rerun the past, so I make sure I can rebuild it. Our traces record every tool call with its full result, plus the model name, the prompt version and the settings for each step. Last quarter a customer said our agent cancelled the wrong order. Three days later the live data was different, so I used replay. The harness fed the recorded tool results back in place of live calls, up to the step where the agent chose which order to cancel. Then I ran that one step 20 times. It picked the wrong order 17 times out of 20, which told me the context was at fault: two orders had the same product name and no dates. Because traces hold personal data, we mask phone numbers, limit access and apply a 30-day retention period."
