id: ethical-dilemma-at-work
question: "Tell me about a time you faced an ethical question at work."
kind: real-life
short_answer: "Choose a real case where the easy path and the right path were different, for example data used without consent, an unfair model or a misleading number. Say what you noticed, who you raised it with, the evidence you brought and the option you proposed. End with what was decided."
deeper_answer: "In AI roles this question is serious. Models touch personal data and decisions about people. The interviewer is checking whether you notice such problems and raise them with the right people, calmly and with evidence.\n\nSituation: the work and what you noticed. Task: why it could not be ignored. Action: how you checked your facts, who you spoke to, and what you proposed. A good line is: \"I did not accuse anyone. I showed the approval rates side by side and asked if we were comfortable with this.\" Result: the decision and its cost. Do not share confidential details, and do not present yourself as the only honest person in the company. If you have no such case, say so and describe how you would act."
follow_ups:
  - "What would you have done if your manager had told you to ignore it?"
  - "How do you check a model for unfair results?"
  - "Where is your limit? What would you refuse to build?"
common_mistakes:
  - "Inventing a dramatic story"
  - "Presenting everyone else as dishonest"
  - "Sharing confidential details of an employer or client"
level: P1
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Describes the ethical issue clearly"
    keywords: ["noticed", "i saw", "unfair", "consent", "penalising", "privacy", "misleading"]
  - point: "Checked the facts before raising it"
    keywords: ["checked", "compared", "comparison", "evidence", "data"]
  - point: "Raised it with the right people"
    keywords: ["my manager", "risk head", "raised", "legal", "compliance"]
  - point: "Proposed a workable option"
    keywords: ["proposed", "suggested", "a test", "remove", "instead"]
  - point: "Gives the decision and its cost"
    keywords: ["agreed", "delayed", "dropped", "decided", "result"]
answer_seconds: 150
example: "I was a senior data scientist at a lending company. While reviewing our loan approval model, I saw that pin code was one of the strongest features. I checked further. Applicants with similar income and repayment history were approved about half as often in some areas of the city. Those areas matched particular communities. Nobody had intended this, but the model was penalising people for where they lived. Removing the feature would lower accuracy, and a launch was three weeks away. I took the comparison to my manager and the risk head, and I proposed a test without pin code. Accuracy dropped by one point, and the gap between areas almost closed. The risk head agreed to remove the feature, and we delayed the launch by one week. We also added a fairness check to every model review."
