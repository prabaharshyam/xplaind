id: what-is-distillation
question: What is model distillation, and when would you use it?
kind: concept
short_answer: Distillation trains a small student model to copy a large teacher model on a task, using
  the teacher's answers as training data. Use it when a large model does the task well but is too slow
  or costly at your volume, and the task is narrow enough for a small model to learn.
deeper_answer: 'The steps are: run the teacher on many real inputs, filter its outputs, fine-tune the
  student on those pairs, and test the student on real, hand-labelled data it has never seen. A good outcome
  is quality close to the teacher at a fraction of the cost and latency.


  The limits matter. A student rarely beats its teacher and copies its mistakes. It can learn the teacher''s
  style without its reasoning, producing confident wrong answers on harder or new inputs. Check the teacher
  provider''s terms, since many forbid using outputs to train competing models.'
follow_ups:
- How would you decide the student is good enough to replace the teacher?
- What would you do with inputs the student is unsure about?
common_mistakes:
- Expecting the student to beat the teacher
- Evaluating the student only against the teacher's outputs
