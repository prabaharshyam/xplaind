example: "The word 'unbelievable' might be split into 'un', 'believ' and 'able'. Hindi and Tamil text often take more tokens per word than English, so the same message can cost more in those languages. If a model charges per million tokens and my app sends 3,000 tokens per question, a 500-token answer and 10,000 questions a day, tokens tell me the daily cost, the speed and whether it fits the context window."
