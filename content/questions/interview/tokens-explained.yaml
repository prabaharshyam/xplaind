id: tokens-explained
question: "What is a token, and why do tokens matter when you build with LLMs?"
short_answer: "A token is a chunk of text, often a word or part of one, that the model reads and writes. Tokens matter because price, speed and limits are all counted in them: you pay per input and output token, longer outputs take longer, and everything must fit in the context window."
deeper_answer: "Tokenizers split text into pieces from a fixed vocabulary. Common English words are often one token, while rare words, code, numbers and many non-English scripts take more tokens per word. That is worth knowing in India: the same sentence in Hindi or Tamil can cost more tokens than in English.\n\nIn practice you count tokens to estimate cost (input tokens times input price plus output tokens times output price), to keep prompts inside the context window, and to set a sensible maximum output length. Providers offer token counting tools so you can measure instead of guessing."
follow_ups:
  - "Why might the same sentence cost more tokens in Hindi than in English?"
  - "How would you estimate the monthly cost of a feature?"
common_mistakes:
  - "Assuming one token equals one word"
  - "Forgetting that output tokens are usually priced higher than input tokens"
