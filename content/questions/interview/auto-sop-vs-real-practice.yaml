id: auto-sop-vs-real-practice
question: "You are asked to automate purchase order approval. The written procedure says one thing, but the staff do it differently. What do you do?"
kind: scenario
short_answer: "I do not automate either version yet. I watch two or three people do the real work, write down each step, input, decision and exception, and count how often each exception happens. Then I ask the process owner which version is correct, agree one target process in writing, and automate that."
deeper_answer: "The written procedure is often old, and the real practice often contains fixes that staff added for good reasons, for example calling a supplier when the GST number is missing. If I automate the document, the workflow breaks on real cases. If I automate the habit, I may lock in a shortcut that skips a control.\n\nSo I map the real process by observation and by reading recent cases, not only by interview. I mark who decides what, where data comes from, and which steps exist only because of an old tool. For example, staff may skip the second approval below ₹10,000. The owner must decide if that is allowed. Interviewers listen for observation of real work, exceptions with counts, and a decision by the owner, not by the automation builder."
follow_ups:
  - "How many cases would you look at before you trust your process map?"
  - "What do you do if the process owner and the staff disagree?"
  - "Which exceptions would you leave to a person?"
common_mistakes:
  - "Automating the written procedure without watching the work"
  - "Deciding the correct process yourself instead of asking the owner"
  - "Ignoring rare exceptions"
level: B2
topic: automation
stop_id: mapping-a-process
rubric:
  - point: "Does not build yet; finds out how the work is really done"
    keywords: ["watch", "observe", "sat with", "real work"]
  - point: "Maps steps, inputs, decisions and exceptions"
    keywords: ["step", "exception", "decision", "map"]
  - point: "Counts how often each exception happens, using recent cases"
    keywords: ["how often", "count", "recent cases", "sample"]
  - point: "The process owner decides the target process, agreed in writing"
    keywords: ["owner", "agreed", "in writing"]
  - point: "Checks that a shortcut does not remove a control"
    keywords: ["control", "second approval", "audit", "shortcut"]
answer_seconds: 120
example: "In my last project the procedure said every purchase order needs two approvals. I sat with three people in the accounts team in Pune for two days and watched the real work. I wrote down each step and each exception. I found that orders below ₹10,000 got only one approval, and that staff phoned the supplier when the GST number was missing. I looked at 200 recent cases to count how often each exception happened. Then I took the map to the process owner, the finance head. She decided that the single approval was acceptable below ₹10,000 but wanted it recorded as a control in the policy. We agreed the target process in writing, and only then I built the workflow. The phone call stayed a manual task for a person."
