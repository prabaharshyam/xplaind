id: pm-experiment-ai-descriptions
question: "A marketplace wants to replace seller-written product descriptions with AI-written ones. How would you design the experiment to know whether it helps?"
kind: use-case
short_answer: "State the hypothesis and one primary metric, such as orders per product view. Randomise by product, because a description belongs to a product, not a user. Add guardrails: return rate and 'not as described' complaints. Fix the sample size and duration in advance, and run long enough to see returns."
deeper_answer: "The first design choice is the unit. If half the users saw AI text and half saw seller text for the same product, search engines and shared links would see mixed pages, so most teams randomise products within each category. The primary metric should be close to the goal: conversion per view, not time on page.\n\nAI text can sell more by promising more. That is why guardrails matter: returns, complaints that the item did not match, and seller objections. Returns can arrive weeks after the order, so a seven day test can declare a false win. Interviewers listen for the unit of randomisation, a guardrail that catches over-promising, and a decision rule written before the test: ship, stop, or ship only in categories where it helps."
follow_ups:
  - "Why not randomise by user?"
  - "What would you do if conversion rises and returns also rise?"
  - "How would you treat categories such as electronics, where a wrong spec is costly?"
common_mistakes:
  - "Measuring clicks only"
  - "Stopping the test as soon as the result looks good"
  - "Ignoring returns that arrive after the test ends"
level: I3
topic: product
stop_id: kpi-that-matters
rubric:
  - point: "States a hypothesis and one primary metric"
    keywords: ["hypothesis", "primary metric", "orders per"]
  - point: "Chooses the unit of randomisation and explains it"
    keywords: ["randomis", "randomiz", "by product", "control group"]
  - point: "Adds guardrail metrics such as returns and complaints"
    keywords: ["guardrail", "return rate", "complaint"]
  - point: "Fixes sample size and duration in advance"
    keywords: ["sample size", "duration", "in advance"]
  - point: "Writes the decision rule before the test"
    keywords: ["decision rule", "before we start"]
answer_seconds: 120
example: "My hypothesis is that AI descriptions raise conversion because many seller descriptions are thin. The primary metric is orders per product view. I would randomise by product, not by user: within each category, half the products get the AI text and half stay as the control group. My guardrail metrics are the return rate and 'item not as described' complaints, because AI text can over-promise. I would fix the sample size and a duration of four weeks in advance, since returns come late. The decision rule is written before we start: ship if conversion rises and returns stay flat, stop if returns rise, and decide category by category, for example sarees yes, electronics maybe not."
