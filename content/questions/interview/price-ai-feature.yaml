id: price-ai-feature
question: "How would you price an AI feature whose cost grows with usage?"
short_answer: "Start from unit economics: estimate the model and infrastructure cost per task and per active user at realistic usage, including heavy users. Then choose a model: include it in existing plans with fair-use limits, charge per seat with usage caps, sell credits, or price on outcomes. Protect margin with caps and cheaper models for simple steps."
deeper_answer: "The risk with flat pricing is a small group of heavy users costing more than they pay. Look at the usage distribution, not the average.\n\nValue matters as much as cost: if the feature saves an hour a day, price against that value. For Indian customers, price sensitivity is high, so a generous free tier with clear limits and a cheap upgrade often works better than metered billing that feels unpredictable."
follow_ups:
  - "How would you find your heaviest users' cost?"
  - "When does usage-based pricing make sense?"
common_mistakes:
  - "Pricing on average usage only"
  - "Ignoring falling model prices"
