id: design-meeting-summariser
question: "Design a service that turns meeting recordings into a summary and a list of action items. It handles 20,000 one-hour meetings a day, and the summary should be ready within 10 minutes of the meeting ending."
kind: use-case
short_answer: "Clarify languages, consent and who may see the output. Pipeline: upload, a queue, speech-to-text with speaker labels, then summarise long transcripts in sections and merge. Extract action items as structured output with owner and due date, link each point to a timestamp, let people edit, and measure accuracy on labelled meetings."
deeper_answer: "Requirements: languages and mixed-language speech, audio quality, consent to record, retention, and who can read the summary. This is a batch job, not real time, so a queue with workers is enough.\n\nFlow: the recording lands in storage and a job goes on a queue. Speech-to-text produces a transcript with timestamps, and speaker diarisation labels who spoke. A one-hour transcript may fit in a large context window, but summarising in sections and then merging is often more reliable and cheaper, and it allows parallel work. The model returns structured output: summary, decisions, and action items with owner, due date and the timestamp that supports each one.\n\nTrade-offs: a stronger model gives better summaries at higher cost per meeting, so test whether a cheaper model is good enough for section summaries. Common failures are wrong names, a wrong owner for an action, and invented decisions, so require a supporting quote for each action item. Measure transcription word error rate, and precision and recall of action items against human-labelled meetings. At scale the first limit is speech-to-text capacity at the end of each hour, when many meetings finish together."
follow_ups:
  - "How do you handle a meeting where people switch between Hindi and English?"
  - "How would you stop the summary from inventing an action item?"
  - "What changes if users want live notes during the meeting?"
common_mistakes:
  - "Ignoring consent, retention and who can read the summary"
  - "No link from summary points back to the transcript"
  - "Assuming transcription is always correct"
level: I3
topic: system-design
