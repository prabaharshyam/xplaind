answer_seconds: 120
example: "I would clarify the languages, whether everyone gave consent to record, and who may read the summary. Because 10 minutes is allowed, this is a batch pipeline. The recording goes to storage and a job goes on a queue. Workers run speech-to-text with timestamps and speaker labels. For a one-hour transcript I would summarise each section and then merge the results, which is cheaper and runs in parallel. The model returns structured output: a short summary, decisions, and each action item with an owner, a due date and a supporting quote with its timestamp, so people can check it. The trade-off is model quality against cost for 20,000 meetings a day, so I would test a cheaper model for the section step. I would measure action items against 100 meetings with human labels. The first limit at scale is transcription capacity when many meetings end at the same time."
