example: "I would ask two things first: are the items hashable, and do we keep the first occurrence? Assuming a list of email strings and first occurrence, I would write list(dict.fromkeys(emails)). A dict keeps insertion order and drops repeated keys, so the order is preserved. It is O(n) time and O(n) memory. If the addresses can differ in case, I would switch to a loop with a seen set: for each email I compute key = email.strip().lower(), and only append the email when the key is not in seen. I would not use list(set(emails)), because a set does not keep order. For a@x.com, b@x.com, a@x.com, c@x.com I get a, b, c in that order. I would also test an empty list, which returns an empty list."
