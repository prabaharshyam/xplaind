id: code-deduplicate-keep-order
question: "Remove duplicates from a list of email addresses and keep the order in which each address first appeared. For example, a@x.com, b@x.com, a@x.com, c@x.com becomes a@x.com, b@x.com, c@x.com."
kind: use-case
short_answer: "Use list(dict.fromkeys(emails)). A dict keeps insertion order and ignores repeated keys, so the first occurrence of each item survives. It is O(n) time and O(n) extra memory. A plain set loses the order, and checking membership in a list makes the whole thing O(n squared)."
deeper_answer: "First clarify the input. Ask whether the items are hashable, such as strings or numbers, or unhashable, such as dicts. Ask whether A@x.com and a@x.com count as the same address, and whether to keep the first or the last occurrence.\n\nFor hashable items the one-line answer is list(dict.fromkeys(emails)). Dicts have kept insertion order since Python 3.7, so the result keeps first-seen order. The explicit version uses a seen set and an output list: loop over the items, and when an item is not in seen, add it to seen and append it to the output. Use this version when you need a key, such as email.strip().lower(), or when the rows are dicts and you deduplicate on row[\"id\"].\n\nBoth are O(n) time and O(n) memory, because set and dict lookups are O(1) on average. Test an empty list, a list with no duplicates, and all items the same. Say out loud why list(set(emails)) is wrong here: a set does not keep order."
follow_ups:
  - "How would you deduplicate a list of dicts by one field?"
  - "What if the list is too large to hold a set of every item in memory?"
  - "How would you keep the last occurrence instead of the first?"
common_mistakes:
  - "Using list(set(items)), which loses the order"
  - "Checking \"if item not in result\" on a list, which is O(n squared)"
  - "Not asking whether the items are hashable"
