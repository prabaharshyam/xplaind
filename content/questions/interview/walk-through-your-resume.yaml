id: walk-through-your-resume
question: "Walk me through your resume."
kind: real-life
short_answer: "Go in time order, but spend most of the time on the last two or three years. For each step give one line on what you did, one result, and why you moved. Show a clear direction towards this role. Explain any switch or gap in one honest sentence. Finish in about two minutes."
deeper_answer: "This is not the same as \"tell me about yourself\". Here the interviewer wants the story behind the document: why you made each move, and whether the dates, titles and claims stay true when you explain them. They also listen for a direction that leads to this job.\n\nFor each role or course, say what you owned, one result, and the reason for the next step. Keep early years to one sentence. A useful linking line is: \"I moved from testing to data work because I was already writing scripts to check model outputs, and I wanted to build the models too.\" Everything you mention should be something you can explain in detail."
follow_ups:
  - "Why did you move from that role to the next one?"
  - "Which point on your resume should I ask you more about?"
  - "What exactly was your part in that project?"
common_mistakes:
  - "Giving equal time to every job and every year"
  - "Claiming work on the resume that you cannot explain"
  - "Skipping over a switch or gap and hoping nobody asks"
level: I1
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
asked_often: true
rubric:
  - point: "Goes in a clear time order and keeps early years short"
    keywords: ["started", "after that", "then", "first job", "graduated", "finished"]
  - point: "Gives the reason for each move"
    keywords: ["because", "moved", "wanted", "want to", "reason", "switched"]
  - point: "Names what they owned and one result in recent work"
    keywords: ["owned", "built", "wrote", "responsible", "reduced", "improved"]
  - point: "Shows a direction that leads to this role"
    keywords: ["this role", "next step", "direction", "that is why"]
answer_seconds: 120
example: "I finished BSc in computer science in Chennai in 2024 and joined a service company as a test engineer. For the first year I tested a banking app by hand. In the second year our client added a chatbot, and I was asked to check its answers. I wrote Python scripts that ran 400 test questions every night and flagged wrong answers, which cut manual checking from two days to two hours. That work made me want to build these systems, not only test them. So for the last eight months I have studied machine learning in the evenings and built a ticket classifier with 88 percent accuracy. An ML engineer role is the next step in that direction."
