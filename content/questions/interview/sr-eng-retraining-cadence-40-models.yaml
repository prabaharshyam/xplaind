id: sr-eng-retraining-cadence-40-models
question: "Your team retrains all 40 production models every night, which costs about ₹18 lakh a month in compute, and nobody remembers why. How would you decide which models really need it?"
kind: use-case
short_answer: "I would measure instead of guessing. For each model, compare a model trained today with ones trained a week and a month ago on fresh data. If the old one is as good, nightly retraining is waste. Then I set cadence per model by decay rate and business value, add drift triggers, and keep the retraining pipeline tested."
deeper_answer: "Retraining frequency should follow how fast the world changes for that model. A fraud model facing new attack patterns may lose value in days. A model that predicts delivery time from distance and city may be stable for months. A staleness test makes this visible: evaluate models of different ages on the newest labelled data and plot quality against age.\n\nThere are trade-offs in both directions. Retraining rarely saves money, but the pipeline then runs seldom and may be broken when you need it, so keep a scheduled dry run. Retraining often adds risk too: every new model is a release that can go wrong, and it needs automatic validation against the current one. A possible result: 5 models stay nightly, 20 go weekly, and 15 go monthly with drift alerts. Interviewers listen for evidence per model, a link between cost and value, triggers, and safe promotion."
follow_ups:
  - "Labels for one model arrive 60 days late. How do you run the staleness test for it?"
  - "What are the risks of retraining too often?"
  - "Which drift signal would you use as a trigger, and why?"
common_mistakes:
  - "Keeping or cutting the nightly schedule with no measurement"
  - "One retraining schedule for every model"
  - "Promoting each retrained model without comparing it to the current one"
level: P2
topic: ml-basics
stop_id: monitoring-drift
