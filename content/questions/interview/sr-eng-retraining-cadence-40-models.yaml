    keywords: ["dry run", "pipeline stays", "test the pipeline", "pipeline"]
answer_seconds: 165
example: "I would run a staleness test on each of the 40 models. I take the model trained today, one from a week ago and one from a month ago, and score all three on fresh data from the last few days. If the month-old model is within noise, nightly retraining adds nothing. I expect a few models, such as fraud, to show real decay in days, and those stay nightly. Most would move to weekly or monthly, with a drift alert as a trigger to retrain early. Each new model must still be validated against the current model before promotion. For the monthly ones I would keep a weekly dry run so the pipeline stays tested. That could cut the ₹18 lakh by more than half."
