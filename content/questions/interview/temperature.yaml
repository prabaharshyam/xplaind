id: temperature
question: "What does the temperature setting do?"
short_answer: "Temperature controls how random the model's choice of the next token is. Low temperature makes it pick the most likely tokens, so answers are more consistent. Higher temperature spreads the choice, giving more varied output. Use low values for extraction and classification, higher ones for brainstorming."
deeper_answer: "The model produces a probability for each possible next token. Temperature reshapes that distribution before sampling: below 1 it sharpens it towards the top choices, above 1 it flattens it. Near zero the output is close to always taking the top token, though many providers do not guarantee identical output even then.\n\nTemperature does not make a model smarter or more truthful. A low temperature makes a wrong answer repeat consistently. For tasks where you need correctness, rely on good prompts, retrieval and checks, and use low temperature mainly for consistency."
follow_ups:
  - "Does temperature zero guarantee the same answer every time?"
  - "Which temperature would you use for a JSON extraction task, and why?"
common_mistakes:
  - "Saying higher temperature makes the model more creative and therefore better"
  - "Believing low temperature makes answers factually correct"
