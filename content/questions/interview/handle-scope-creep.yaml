answer_seconds: 90
example: "Halfway through a document automation project, a client asked us to also handle purchase orders and add Hindi support. I logged both, estimated purchase orders at three extra weeks and Hindi at two, and gave the sponsor three options: extend the date, swap Hindi for a lower-value feature, or move both to phase two. They moved both to phase two, and we delivered the original scope on time."
