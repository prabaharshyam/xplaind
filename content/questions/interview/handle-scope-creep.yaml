id: handle-scope-creep
question: "Midway through a project, the client keeps adding requests. How do you handle it?"
kind: real-life
short_answer: "Acknowledge each request, write it down and assess its impact on timeline, cost and risk. Then give the client a clear choice through the agreed change process: add it and move the date or budget, swap it for something of similar size, or park it for a later phase. Keep the sponsor informed and protect the core deliverable."
deeper_answer: "Saying no is easier when the scope of work is clear, which is why it pays to write it well. Frame trade-offs in the client's terms: 'If we add the Hindi interface now, the pilot moves two weeks. Shall we do it in phase two?'\n\nTrack changes in a log the client can see. Small favours add up; even if you accept them, record them."
follow_ups:
  - "How would you say no to a senior stakeholder?"
  - "What goes into a change log?"
common_mistakes:
  - "Silently absorbing extra work"
  - "Refusing without offering options"
level: P1
topic: client-delivery
