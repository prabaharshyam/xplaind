id: worked-with-non-technical-team
question: "Tell me about working with people who are not technical."
kind: real-life
short_answer: "Describe a project with people outside tech, such as sales, finance, HR or operations. Show that you learned their work first, explained the AI in their words with examples, were honest about its limits, and used their feedback. End with a result they cared about."
deeper_answer: "Many AI projects fail because people do not use the tool, not because the model is weak. The interviewer is checking whether you can explain your work to people who do not know the terms, and whether you respect what they know.\n\nSituation: the team and what they needed. Task: your part. Action: how you learned their process, how you explained the tool, and how you handled their doubts. A good line is: \"I did not say precision. I said, out of ten claims it flags, about eight are real problems, so please check the flagged ones.\" Result: something that matters to them, such as time saved. Do not treat them as less intelligent. They are the experts in their own work."
follow_ups:
  - "How would you explain a model's mistakes to a business user?"
  - "What did that team teach you?"
  - "How did you handle the fear that AI would replace their jobs?"
common_mistakes:
  - "Using technical terms without explaining them"
  - "Treating the other team as less intelligent"
  - "Promising that the tool will never be wrong"
level: B3
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Names the non-technical team and what they needed"
    keywords: ["finance", "sales", "hr", "operations", "marketing", "needed"]
  - point: "Learned their work before building"
    keywords: ["sat with", "watched", "learned", "understood their"]
  - point: "Explained in simple words, without jargon"
    keywords: ["explained", "their words", "simple", "example", "plain"]
  - point: "Was honest about the limits of the tool"
    keywords: ["wrong sometimes", "limits", "final decision", "cannot", "mistakes"]
  - point: "Used their feedback and gives a result"
    keywords: ["feedback", "rules", "asked what", "went from", "days"]
answer_seconds: 120
example: "In my first job after college, at a mid-size IT services company in Noida, I built a tool to check employee expense claims for the finance team. The six people in that team were experts in policy but had never used an AI tool, and two of them feared it would replace them. Before writing any code, I sat with them for two days and watched how they checked claims. I explained the tool in their words: it reads the bill, compares it with the policy, and marks doubtful claims in yellow. I said clearly that it would be wrong sometimes and that they would make the final decision. Every Friday I showed a demo and asked what it got wrong. They gave me 14 rules I would never have found alone. Claim checking went from three days to one."
