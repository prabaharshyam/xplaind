id: why-docker
question: "Why use Docker for an AI application?"
short_answer: "Docker packages the app with its exact Python version, libraries and system dependencies into an image, so it runs the same on a laptop, in CI and in production. That ends 'works on my machine' problems, makes deployments repeatable and lets you run several services together with Docker Compose, such as an API, a vector database and a worker."
deeper_answer: "Good practice: small base images, pinned dependency versions, a .dockerignore, no secrets baked into images, and a non-root user. Multi-stage builds keep images small.\n\nFor GPU work, images based on the CUDA runtime plus the NVIDIA container toolkit let containers use GPUs."
