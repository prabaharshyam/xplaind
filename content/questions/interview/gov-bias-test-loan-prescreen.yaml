id: gov-bias-test-loan-prescreen
question: "A lender plans to use a model to pre-screen personal loan applications. How would you set up bias testing before launch and after it?"
kind: use-case
short_answer: "Choose the groups to compare, such as gender, age band and region, and the measures: approval rates and wrongful rejection rates per group. Test on past data before launch, check for proxies such as PIN code, and set acceptable gaps in advance. After launch, monitor monthly and retest on every model change."
deeper_answer: "Bias testing starts with decisions, not tools. Which groups matter here, and which gaps are unacceptable? Approval rate by group shows who gets through. Error rate by group shows something different: among people who would have repaid, who is rejected more often? Both are needed, and the business, risk and legal teams should agree on thresholds before the results come in.\n\nTwo traps are common. Removing the gender column does not remove bias, because PIN code, employer type or phone model can act as proxies. And past data carries past decisions: if women were approved less often before, the labels teach the model the same habit. After launch, the applicant mix shifts, so monitoring and complaint review must continue. Interviewers listen for chosen groups and metrics, proxy awareness, thresholds set in advance, documentation, and what happens when a gap is found."
follow_ups:
  - "How do you test for gender bias if the lender does not collect gender?"
  - "What do you do if closing one gap makes accuracy worse?"
  - "Which gap would make you stop the launch?"
common_mistakes:
  - "Thinking that removing protected columns removes bias"
  - "Testing once before launch and never again"
  - "Looking only at approval rates, not at errors per group"
level: P1
topic: governance
stop_id: bias-fairness
rubric:
  - point: "Chooses the groups to compare"
    keywords: ["groups", "gender", "age band", "region"]
  - point: "Uses approval rates and error rates per group"
    keywords: ["approval rate", "wrongful rejection", "error rate"]
  - point: "Checks for proxy variables"
    keywords: ["proxy", "proxies", "pin code"]
  - point: "Sets thresholds in advance and documents results"
    keywords: ["threshold", "in advance", "document"]
  - point: "Monitors after launch and retests on model changes"
    keywords: ["monitor monthly", "retest", "after launch"]
answer_seconds: 130
example: "First I would agree the groups with risk and legal: gender, age band, region and salaried versus self-employed. Then the measures. I compare the approval rate per group, and also the wrongful rejection rate: among past applicants who repaid, how many would the model have rejected in each group. I run this on two years of past data before launch. I check for proxy features, because PIN code or employer type can stand in for community or income group even when gender is removed. We set a threshold in advance, for example no group's approval rate below 85% of the highest without a business reason, and document the results. After launch I monitor monthly and retest whenever the model changes."
