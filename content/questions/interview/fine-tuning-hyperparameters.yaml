id: fine-tuning-hyperparameters
question: Which fine-tuning settings matter most, and how do you choose them?
kind: concept
short_answer: 'Learning rate matters most: too high diverges, too low barely learns; LoRA often starts
  around 1e-4 to 2e-4, full fine-tuning far lower. Batch size affects stability and memory, with gradient
  accumulation when memory is tight. Epochs depend on data size; stop when validation loss stops falling.
  Prompt loss weight is usually small or zero.'
deeper_answer: 'I set them by watching curves, not by guessing: a short sweep of a few learning rates,
  plotting training and validation loss, then keeping the checkpoint with the best validation score.


  Very large datasets may need only one or two epochs; small ones may need several. Very small batches
  (under about 8) can be unstable. Learning-rate schedules with a short warm-up and decay are common.
  Every run''s settings and data version should be logged.'
follow_ups:
- What does gradient accumulation do?
- How would the loss curves look if the learning rate were too high?
common_mistakes:
- Copying settings from another model without checking
- Training for a fixed number of epochs regardless of validation loss
