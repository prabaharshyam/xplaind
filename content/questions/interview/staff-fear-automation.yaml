id: staff-fear-automation
question: "The client's staff are worried your automation will replace them. How do you handle it?"
kind: real-life
short_answer: "Take it seriously and involve them early. I meet the people who do the work, map the process with them, and ask which parts they find most tedious. I am honest about what will change, show how the automation removes repetitive steps rather than judgement, give them control over exceptions, and make sure management communicates its plans for their roles."
deeper_answer: "Fear of job loss is reasonable, and ignoring it leads to quiet resistance, workarounds and failed projects. The people doing the work also know the exceptions that will break your automation, so their help makes it better.\n\nBe careful not to make promises that are management's to make. Your part is to involve staff in design, train them, make them owners of the parts that need judgement, and share early wins that make their day easier. Encourage the client's leaders to say clearly how time saved will be used."
follow_ups:
  - "What if management does plan to reduce staff?"
  - "How do you get their help mapping the process?"
common_mistakes:
  - "Promising nobody will lose their job when you cannot know"
  - "Designing the automation without the people who do the work"
level: B3
topic: client-delivery
stop_id: scoping-automation
rubric:
  - point: "Takes the concern seriously and is honest"
    keywords: ["honest", "seriously", "concern", "listen"]
  - point: "Involves staff early in mapping and design"
    keywords: ["involve", "map", "workshop", "early", "staff"]
  - point: "Shows it removes repetitive work, not judgement"
    keywords: ["repetitive", "tedious", "judgement", "exceptions"]
  - point: "Leaves promises about roles to management"
    keywords: ["management", "leaders", "roles"]
  - point: "Trains staff and makes them owners"
    keywords: ["train", "owner", "control"]
answer_seconds: 90
example: "At a logistics client, the billing team of four were cold in our first meeting. I asked to sit with them for a morning and list every step of raising an invoice. They pointed out three exception types I had not heard about. We automated the copying between systems and left exceptions and customer calls with them. I asked their manager to tell the team directly that the time saved would go to clearing a backlog of overdue payments. By launch, the team lead was the one demoing it to other branches."
