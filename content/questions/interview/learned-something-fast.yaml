id: learned-something-fast
question: "Tell me about a time you had to learn something new quickly."
kind: real-life
short_answer: "Pick a real case with a clear time limit. Say what you had to learn and why, then your method: you set a small goal, read the official documentation, built something small, and asked an expert. Give the result and what you still did not know. Show the method, not only effort."
deeper_answer: "AI tools change every few months, so the interviewer cares less about what you know today and more about how you learn. They are listening for a method that you can repeat, and for honesty about how deep your knowledge went.\n\nUse situation, method, result. Good methods include: defining the smallest thing you need to deliver, reading the official documentation before videos, building a tiny working version on day one, and asking someone experienced to review it. For example: \"I had one week, so I did not try to learn the whole tool. I learned the three features our task needed and built a working demo by day three.\" End by saying what you still did not know and how you covered that risk."
follow_ups:
  - "What would you do differently if you had to learn it again?"
  - "How do you keep up with new AI tools and research?"
  - "How did you know you had learned enough?"
common_mistakes:
  - "Saying \"I am a fast learner\" with no example"
  - "Describing only long hours, not a method"
  - "Claiming full mastery after one week"
level: I1
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "States what had to be learned and the time limit"
    keywords: ["had to learn", "never used", "days", "one week", "deadline", "demo"]
  - point: "Describes a clear learning method"
    keywords: ["documentation", "tiny version", "small", "wrote down", "asked", "review"]
  - point: "Gives the result of applying it"
    keywords: ["it worked", "result", "delivered", "on time", "by day"]
  - point: "Is honest about what they still did not know"
    keywords: ["had not tested", "did not know", "not an expert", "not yet", "later"]
answer_seconds: 120
example: "Last March my lead asked me to add search by meaning to our product catalogue, and the demo was in eight days. I was a data engineer in Hyderabad with two years of experience, and I had never used embeddings or a vector database. I did not try to learn everything. On day one I read the official documentation and wrote down the three things I needed: creating embeddings, storing them and querying them. On day two I built a tiny version with 100 products. A senior on another team reviewed it and showed me my text chunks were too large. By day six it worked on 40,000 products. I told my lead that I had not tested it under heavy load, and we did that the next month."
