id: protect-user-data
question: "How do you protect user data in an LLM application?"
short_answer: "Send the model only the data each task needs, keep API keys and secrets on the server, enforce access rules in code so users only retrieve their own data, mask personal data in logs, set retention limits, and check your provider's data use and retention terms. Follow local law, such as India's data protection rules."
deeper_answer: "Data minimisation reduces harm if anything leaks. In RAG, filter documents by the user's permissions before retrieval, not after. Never put secrets in prompts, because system prompts can leak. Review provider terms on whether data is stored or used for training, and choose settings or plans that fit your obligations.\n\nAlso plan for user rights: export and deletion of their data. Logs and analytics are a common leak point, so treat them with the same care as the main database."
follow_ups:
