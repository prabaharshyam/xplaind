example: "An LRU cache keeps a fixed number of items and, when it is full, evicts the one that was used least recently. I need a hash map for fast lookup and an order of use for fast eviction, and OrderedDict gives me both. In get, I return None on a miss, and on a hit I call move_to_end(key) and return the value. In put, I set the value, call move_to_end(key), and if the length is over capacity I call popitem(last=False) to remove the oldest entry. Both get and put are constant time, O(1), and memory is bounded by the capacity. With capacity 2, after put a, put b, get a and put c, the key b is gone and a is still there. Without OrderedDict I would use a dict plus a doubly linked list."
