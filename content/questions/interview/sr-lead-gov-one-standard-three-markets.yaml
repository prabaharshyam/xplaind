id: sr-lead-gov-one-standard-three-markets
question: "Your company sells an AI hiring product to clients in India, the EU and the US, and each of the 3 markets has different rules. Do you set one global standard for the product or a separate one for each market, and how do you decide?"
kind: concept
short_answer: "I would set one global baseline built on the strictest rules that apply to our core risks, then add small local parts for each market. For a hiring product the baseline covers bias testing, human oversight, documentation and logging. Local parts cover consent wording, notices and data location. Legal counsel in each market confirms the mapping."
deeper_answer: "Both extremes have a cost. A separate standard for each market means three versions of the product, three sets of evidence, and mistakes when a client works across borders. One standard at the strictest level everywhere can add cost in markets that do not require it. For a hiring product the choice is easier, because the main risks are the same everywhere: unfair outcomes, weak oversight and poor records. The EU AI Act treats AI used in recruitment as high risk, so its duties make a sensible baseline.\n\nThen keep a small local layer. India's DPDP Act shapes consent, notice and how personal data is handled. In the US, rules for hiring tools differ by state and city. Maintain one control list mapped to each law, so one piece of evidence serves many rules. Interviewers listen for the trade-off between cost and consistency, a baseline with local additions, the use of local legal advice, and a process to track changes in law."
follow_ups:
  - "A sales head says the strict baseline makes the product too costly for Indian clients. How do you answer?"
  - "How do you keep the mapping current when a law changes?"
  - "Which controls would you never vary by market?"
common_mistakes:
  - "Quoting clause numbers from memory"
  - "Building a separate product version for every market"
  - "Treating legal mapping as a one-time task"
level: P3
topic: governance
