answer_seconds: 180
example: "I would not build three products. The trade-off is cost against consistency, and for a hiring tool the main risks are the same in every market. So I would set one global baseline on the strictest core duties. The EU AI Act treats recruitment AI as high risk, so I would use its duties as the base: bias testing, human oversight, documentation and logs. Then I would add a thin local layer. For India, consent and notice under the DPDP Act. For the US, extra steps where a state or city has its own rule for hiring tools. I would keep one control list mapped to each law, ask local legal counsel to confirm it, and track changes every quarter."
