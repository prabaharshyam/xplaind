id: evaluate-agent-trajectory
question: "How do you evaluate an agent, beyond checking its final answer?"
kind: use-case
short_answer: "Build tasks with clear success criteria and check outcomes, ideally in a realistic environment. Also check the trajectory: did it use the right tools with valid arguments, how many steps and tokens it took, whether it asked for approval where required, and whether it avoided forbidden actions. Run each task several times and track the pass rate."
deeper_answer: "Outcome checks can be code (the ticket was updated, the test suite passes) or model graders with rubrics. Trajectory checks catch agents that succeed by luck or by unsafe means.\n\nKeep a regression set of tasks that once failed. Report cost and latency alongside success, because an agent that succeeds at ten times the cost may not be shippable. Anthropic's guide on evals for agents and DeepLearning.AI's course on evaluating agents cover this in depth."
follow_ups:
  - "Why run each task several times?"
  - "How would you grade a task with no single right answer?"
common_mistakes:
  - "Only checking final answers"
  - "Running each task once"
level: P1
topic: evals
stop_id: evaluating-agents
rubric:
  - point: "Tasks with clear success criteria"
    keywords: ["task", "success criteria", "outcome"]
  - point: "Checks the path: tools, arguments, steps"
    keywords: ["trajector", "path", "tool", "argument", "steps"]
  - point: "Tracks cost, tokens and latency"
    keywords: ["cost", "token", "latency"]
  - point: "Checks safety: approvals, forbidden actions"
    keywords: ["approval", "forbidden", "safe", "unsafe"]
  - point: "Repeated runs and pass rate"
    keywords: ["several times", "repeat", "pass rate", "non-determin"]
answer_seconds: 90
example: "For a calendar-booking agent, I wrote 40 tasks such as 'book a 30-minute call with Priya next Tuesday afternoon'. Each run checked the outcome in a test calendar, and the trajectory: did it check availability before booking, ask for confirmation before inviting external people, and stay under eight steps? I ran each task five times, because a task that passes three times out of five is not reliable."
