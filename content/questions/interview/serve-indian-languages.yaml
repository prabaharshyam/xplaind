id: serve-indian-languages
question: How would you build an AI assistant that works well in several Indian languages?
kind: use-case
short_answer: Start with a test set of real user messages in each language and script, including code-mixed
  and Romanised text, checked by native speakers. Compare a general model, translate-to-English-and-back,
  and an Indian-language model on quality, tokens and cost per language. Retrieve local facts and names
  in each language, and monitor every metric per language after launch.
deeper_answer: 'Quality differs a lot by language: models are often decent in Hindi and weaker in lower-resource
  languages like Odia or Assamese, because those are rare in training data. Translation can help weak
  languages but loses nuance such as respect forms and can garble names.


  Indian groups such as AI4Bharat publish open translation, speech and evaluation resources, and the government''s
  Bhashini platform offers language services. For voice, I would test speech recognition with real recordings
  and accents. I would keep glossaries of product and scheme names, reply in the user''s language, and
  re-test after every model change.'
follow_ups:
- Which metrics would you report per language?
- How would you handle Hinglish?
common_mistakes:
- Testing only in English or formal Hindi
- Treating all Indian languages as one
level: P1
topic: approach-choice
