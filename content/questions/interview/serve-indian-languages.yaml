answer_seconds: 90
example: For a farmer helpline in Marathi and Hindi, we built 300 real questions in both scripts with
  agronomists. An Indian-language model with retrieval reached 84% correct and natural answers in Marathi
  against 68% for a general model, at about half the cost per answer. Scheme names were the main errors
  everywhere, so we added a glossary and retrieval of official scheme pages.
