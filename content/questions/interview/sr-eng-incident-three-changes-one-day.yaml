id: sr-eng-incident-three-changes-one-day
question: "At 7 in the evening your support assistant starts telling customers wrong refund amounts in about 4% of chats, and three teams shipped a prompt change, a model version change and a new search index that same day. You are the incident lead: how do you run the first hour?"
kind: scenario
short_answer: "Stop the harm before finding the cause. I would switch refund questions to a human handoff, then roll back all three changes together, because bisecting live costs customers. I would assign clear roles, post updates every 15 minutes, and count affected chats from traces. Root cause comes later, by replaying failed chats against each change offline."
deeper_answer: "The tempting move is to debate which of the three changes is guilty. With 4% of chats wrong, every ten minutes of debate means more customers given wrong amounts. A lead separates mitigation from diagnosis: narrow the feature or roll back everything that changed today, confirm the error rate falls, and only then investigate.\n\nRoles matter with three teams on the call: one incident lead, one person per change who owns its rollback, one person writing the timeline, and one person talking to support and business. Traces that record prompt, model and index versions let you list every affected chat, so that support can contact those customers. Interviewers listen for calm sequencing, a single decision maker, communication at fixed intervals, and a blameless review that asks why three changes shipped on one day without a shared eval gate."
follow_ups:
  - "One team says its change is safe and refuses to roll back. What do you say?"
  - "How would you find every customer who was given a wrong amount?"
  - "What would you change in the release process afterwards?"
common_mistakes:
  - "Debating the cause while customers still get wrong answers"
  - "Rolling back one change at a time in production"
  - "No single person making decisions on the call"
level: P2
topic: deployment
stop_id: deploy-and-monitor
rubric:
  - point: "Mitigates first: restricts the feature or hands off to humans"
    keywords: ["handoff", "hand off", "human", "disable", "switch off"]
  - point: "Rolls back all same-day changes instead of bisecting live"
    keywords: ["roll back", "rollback", "revert"]
  - point: "Assigns roles and communicates at fixed intervals"
    keywords: ["role", "every 15", "timeline", "owner", "communicat", "update"]
  - point: "Uses traces to count and contact affected customers"
    keywords: ["trace", "affected", "contact"]
  - point: "Finds root cause offline and fixes the release process"
    keywords: ["replay", "offline", "root cause", "review"]
answer_seconds: 165
example: "In the first five minutes I would stop the harm: route every refund question to a human agent, so no more wrong amounts go out. Then I would ask each team to roll back its change today, all three, without arguing about whose fault it is. I would name roles: I decide, each team has one owner for its rollback, one person keeps the timeline, and one updates support every 15 minutes. Once the error rate is back to normal, I would pull traces to list the affected chats, maybe 300 customers, so support can contact them. Root cause comes after: we replay those chats offline against each change alone. In the review I would ask why three changes went out in one day without a shared eval gate."
