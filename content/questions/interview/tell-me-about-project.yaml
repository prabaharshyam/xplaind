id: tell-me-about-project
question: "Tell me about an AI project you built."
kind: real-life
short_answer: "Pick one real project and tell it as a story: the problem and who it was for, what you built and why you chose that design, one thing that went wrong and how you found and fixed it, and the result with a number if possible. Keep it to about two minutes and be ready to go deeper."
deeper_answer: "Structure helps: situation, task, action, result. Interviewers listen for ownership (what you did, not the team), decisions and trade-offs (why RAG and not fine-tuning, why this model), and evidence (how you measured success).\n\nA failure handled well is a strength: \"retrieval missed answers in tables, I measured recall at 5 at 60 percent, changed chunking to keep tables whole, and it rose to 85 percent.\" Have the repository or demo ready to share."
follow_ups:
  - "What would you do differently now?"
  - "How did you know it worked?"
common_mistakes:
  - "Listing technologies without explaining decisions"
  - "Talking only about the team and not your own part"
level: P3
topic: behavioral
stop_id: design-interview
rubric:
  - point: "States the problem and who it was for"
    keywords: ["problem", "user", "customer", "team"]
  - point: "Explains what was built and why that design"
    keywords: ["built", "design", "chose", "because"]
  - point: "Describes something that went wrong and the fix"
    keywords: ["went wrong", "problem", "fix", "bug"]
  - point: "Gives a result, ideally a number"
    keywords: ["result", "percent", "per cent", "reduced", "improved", "saved"]
answer_seconds: 120
example: "I built a WhatsApp assistant for my uncle's pharmacy that answered stock and timing questions from their inventory sheet. I chose retrieval over the sheet rather than fine-tuning, because stock changes daily. In week one it told a customer a medicine was in stock when it was not, because the sheet updated only at night; I connected it to the billing system's export every hour instead. It now answers most routine messages, and the staff handle the rest."
