id: gov-fiduciary-and-processor-duties
question: "Your company sends customers' personal data to an external model provider to generate replies. Under India's DPDP Act, who is responsible for what?"
kind: concept
short_answer: "Our company decides why and how the data is used, so it is the Data Fiduciary and stays responsible, even for the provider's handling. The provider is a Data Processor under a contract. We need notice and consent or another lawful ground, minimum data, security safeguards, breach notification and erasure when the purpose ends."
deeper_answer: "The DPDP Act puts the duty on the party that decides the purpose and means of processing. Sending data to a model provider does not move that duty. The fiduciary must use a processor only under a valid contract, and answers for what the processor does. So the contract should cover security, no use of the data for the provider's own purposes, deletion, and help with breaches.\n\nThe other duties follow the data. Tell people what is collected and why, and have consent or a ground the Act allows. Send only what the task needs: a reply about a late order does not need the full profile. Respect rights to access, correction and erasure, which means knowing where the data sits, including logs. If the provider uses the data to train its own models, that needs separate legal review. Interviewers listen for correct roles and for duties turned into practical controls."
follow_ups:
  - "A customer asks you to erase their data. It is in prompts, logs and a vector store. What do you do?"
  - "What should the contract with the model provider say?"
  - "What do you check if the provider processes the data outside India?"
common_mistakes:
  - "Saying the provider is responsible because it runs the model"
  - "Sending full customer records when a few fields are enough"
  - "Forgetting personal data kept in prompt logs"
level: I3
topic: governance
stop_id: data-quality-pii
rubric:
  - point: "Identifies the company as Data Fiduciary and the provider as Data Processor"
    keywords: ["fiduciary", "processor"]
  - point: "Says the company stays responsible and needs a contract"
    keywords: ["stay responsible", "contract", "accountable"]
  - point: "Covers notice and consent or another lawful ground"
    keywords: ["notice", "consent", "lawful ground"]
  - point: "Applies data minimisation and security safeguards"
    keywords: ["only what", "mask", "safeguard", "minim"]
  - point: "Covers breach notification, erasure and individual rights"
    keywords: ["breach", "erasure", "delete"]
answer_seconds: 130
example: "Our company decides the purpose, so under the DPDP Act we are the Data Fiduciary, and the model provider is our Data Processor. We stay responsible for what the provider does with the data, so we need a proper contract: use only on our instructions, no training on our data, security measures and deletion. On our side, the privacy notice must tell customers about this use, and we need their consent or another lawful ground. We send only what the reply needs, for example the order status, and mask phone numbers. We keep security safeguards on logs. If there is a breach, we must notify the Board and the affected customers. And when a customer asks for erasure, we delete from prompt logs and tell the provider to do the same."
