id: hashing-vs-encryption
question: "What is the difference between hashing and encryption, and which do you use for passwords?"
kind: concept
short_answer: "Encryption is two-way: with the key you can get the original data back. Hashing is one-way: you cannot reverse it, you can only hash a new input and compare. Passwords should be hashed, with a slow algorithm made for passwords such as Argon2 or bcrypt and a unique salt, never encrypted or stored as plain text."
deeper_answer: "Use encryption when you need the data back later, such as a scanned ID document stored for KYC, or data in transit with TLS. Its safety depends on protecting the key. Use hashing when you only need to check a value matches, such as a password or a file's integrity.\n\nFast hashes like SHA-256 are good for checking files but poor for passwords, because attackers can try billions of guesses quickly. Password hashing algorithms are deliberately slow and take a salt, a random value per user, so two users with the same password get different hashes and precomputed tables do not work. Never invent your own scheme; use a maintained library."
follow_ups:
  - "What is a salt, and what attack does it stop?"
  - "Why is SHA-256 a poor choice for storing passwords?"
common_mistakes:
  - "Saying passwords should be encrypted so they can be recovered"
  - "Using a fast hash such as MD5 or plain SHA-256 for passwords"
