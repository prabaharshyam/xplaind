example: "On a hypothetical Kochi startup's app, I found passwords stored with plain MD5. I moved to Argon2 through a well-known library and rehashed each password when the user next logged in, then forced a reset for accounts that had not logged in for six months. Card tokens from the payment provider stayed encrypted, because we need them back, with the key in a managed key service."
