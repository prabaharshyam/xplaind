answer_seconds: 180
example: "I would first ask how you define active and when a week starts. I will assume any event counts and weeks start on Monday. I build it in three steps with CTEs. First, each user gets a cohort week, the week of their signup date. Second, I join events to users and compute a week number, the number of whole weeks between the event week and the cohort week. Third, I count distinct users per cohort and week number, and divide by the cohort size. The cohort size comes from the users table, so users with no events still count in the denominator. I use COUNT(DISTINCT user_id), because one user can have many events in a week. On a test with 3 signups in a week and 2 of them active the next week, week 1 retention is 67 percent."
