id: pm-provider-changed-model
question: "Your feature depends on an external model provider, which retires the model version you use, and quality drops with the replacement. What do you do now, and what do you change for the future?"
kind: scenario
short_answer: "Confirm the drop on our eval set and find which tasks got worse. Mitigate fast: adjust prompts, test another model or provider, and tell stakeholders the impact. For the future: track deprecation notices, pin versions, rerun evals on every model change, and plan migration time each quarter."
deeper_answer: "When you buy a model, its life cycle is not yours. Providers retire versions on their own schedule, and a newer model is not better at every task. Without an eval set you cannot even prove the drop, so the first step is measurement: run the new model on the same cases as the old one and see which categories fell.\n\nShort term fixes are prompt changes, a different model from the same provider, or a second provider. Long term, treat model change as a planned event. Keep a calendar of retirement dates, keep prompts and model access behind one internal layer so switching is cheap, and reserve capacity each quarter for migration. Interviewers listen for a PM who owns this dependency as a product risk and does not leave it to engineering alone."
follow_ups:
  - "How would you explain the quality drop to your customers?"
  - "Would you use two providers at once? What does it cost?"
  - "What would you ask for in the provider contract?"
common_mistakes:
  - "Having no eval set to compare old and new model"
  - "Learning about the retirement from an error in production"
  - "Assuming a newer model is always better"
level: P1
topic: product
stop_id: build-vs-buy
rubric:
  - point: "Confirms and locates the drop with an eval set"
    keywords: ["eval set", "test set", "compare", "measure"]
  - point: "Mitigates: prompt changes or another model or provider"
    keywords: ["prompt changes", "another model", "second provider"]
  - point: "Communicates impact to stakeholders"
    keywords: ["inform", "stakeholder", "key customers"]
  - point: "Tracks deprecation or retirement dates"
    keywords: ["deprecat", "retirement", "calendar"]
  - point: "Plans migration time and keeps switching cheap"
    keywords: ["migration", "pin", "internal layer"]
answer_seconds: 130
example: "First I would measure, not guess. We run our eval set of 300 cases on the replacement model and compare with stored results from the old one, to see which task types dropped. Say invoice questions fell from 93% to 84%. Engineering then tries prompt changes and tests another model, including a second provider. Meanwhile I inform support and key customers what changed and when we expect a fix. For the future, I own a calendar of retirement notices from our provider, we pin model versions where the provider allows it, and every quarter has planned migration time. Model access sits behind one internal layer, so switching is a configuration change and an eval run, not a rewrite."
