answer_seconds: 150
example: "Traffic goes from 200 to 5,000 requests per second in one minute, so I would first clarify that the spike is predictable: it comes every morning at the same time. That changes the design. I would run stateless replicas behind a load balancer, each one warm, with the model loaded and a readiness check before it takes traffic. I autoscale on concurrent requests per replica, not CPU, because CPU reacts late. Reactive scaling is still too slow for a one minute ramp, so I add a scheduled scale-up ten minutes before booking opens, with headroom. Each server uses small batches and a timeout. If we are overloaded, we shed load to a fallback, a cached price, so the page still works. I would prove it with a load test that replays the real ramp and check p99 under 150 milliseconds. The trade-off is cost: idle replicas every morning in exchange for no cold start."
