answer_seconds: 90
example: "Predicting a flat's rent from only its area in square feet is high bias: it misses location, floor and furnishing, so it is wrong everywhere. A model that memorises every training flat, down to the owner's name, is high variance: perfect on training data, poor on new listings. I would tune complexity, for example tree depth, using validation error to find the sweet spot."
