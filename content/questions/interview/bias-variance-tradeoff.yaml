id: bias-variance-tradeoff
question: "Explain the bias-variance trade-off."
short_answer: "Bias is error from a model that is too simple to capture the pattern, so it underfits. Variance is error from a model so flexible that it fits noise, so it overfits. Making a model more complex usually lowers bias and raises variance; you look for the complexity that gives the lowest error on validation data."
deeper_answer: "A straight line fitted to curved data has high bias: it is wrong in the same way on every dataset. A very deep decision tree has high variance: train it on a slightly different sample and you get a very different tree. Total error on new data is roughly bias squared plus variance plus noise you cannot remove.\n\nIn practice you see it in learning curves. High bias shows as poor scores on both training and validation data; high variance shows as a big gap between them. Remedies differ: for bias, add features or use a more flexible model; for variance, get more data, regularise, simplify, or average many models, which is what random forests do."
follow_ups:
  - "How would a learning curve look for a high-variance model?"
  - "Why does bagging reduce variance?"
common_mistakes:
  - "Mixing up which of bias and variance means underfitting"
  - "Saying more data fixes high bias"
