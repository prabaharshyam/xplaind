id: legacy-app-no-api
question: "A client's old billing software has no API. How would you automate data entry into it?"
kind: use-case
short_answer: "First look for another way in: an import feature, a supported database or file import, or a newer version with an API. If none exists, use RPA to drive the screen like a person would, with a dedicated bot account, checks after each entry, screenshots and logs, and an alert when the screen changes."
deeper_answer: "RPA works through the user interface, so it is slower and breaks when screens change. It is the right choice when there is truly no better option and the volume justifies it, but it needs care.\n\nGood RPA design uses stable selectors, waits for screens to load, verifies each saved record, runs under its own account with only the permissions it needs, and keeps a queue so failed items can be retried. Agree with the client who maintains it, and document it, because these bots need regular attention."
follow_ups:
  - "What makes RPA bots break?"
  - "How would you test it before going live?"
common_mistakes:
  - "Jumping to RPA without checking for import features"
  - "Running the bot under a person's login"
level: B3
topic: automation
stop_id: rpa-basics
rubric:
  - point: "Looks for imports, files or other integration first"
    keywords: ["import", "file", "database", "other way"]
  - point: "Uses RPA as the fallback, driving the interface"
    keywords: ["rpa", "screen", "user interface", "ui"]
  - point: "Uses a dedicated bot account with limited rights"
    keywords: ["bot account", "dedicated", "permissions"]
  - point: "Validates entries and logs with screenshots"
    keywords: ["validate", "verify", "screenshot", "log"]
  - point: "Plans for maintenance and breakage"
    keywords: ["break", "maintain", "screen changes", "alert"]
answer_seconds: 90
example: "A clinic chain used a 15-year-old desktop billing system, and staff re-typed lab orders from a web form into it. The vendor confirmed there was no API but there was a CSV import for patients, not orders. So we used the import for new patients and Power Automate Desktop for orders, under a separate bot login. The bot checked each saved order number, took a screenshot, and moved failures to a list for the front desk. It needed fixing twice in the first year when the vendor updated a screen, which we had warned them about."
