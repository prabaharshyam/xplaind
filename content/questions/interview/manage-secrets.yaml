id: manage-secrets
question: "How do you manage API keys and secrets across environments?"
kind: use-case
short_answer: "Never commit secrets to code. Keep them in a secret manager or the platform's encrypted environment variables, with different keys for development, staging and production, scoped to least privilege. Inject them at runtime, rotate them regularly and after any leak, restrict who can read them, and scan repositories for accidental commits."
deeper_answer: "If a key does leak, revoke it immediately: deleting the commit is not enough because history and forks keep it. Provider spending limits reduce the damage of a leaked model API key.\n\nInfrastructure as code, such as Terraform, should reference secrets, not contain them, and its state files can hold sensitive values, so store state securely."
follow_ups:
  - "What do you do in the first hour after a key leaks?"
  - "Why separate keys per environment?"
common_mistakes:
  - "Keys in .env files committed to Git"
  - "Sharing one production key across all developers"
level: I3
topic: deployment
stop_id: environments-secrets-terraform
rubric:
  - point: "Never in code or Git"
    keywords: ["never", "commit", "code", "git"]
  - point: "Secret manager or encrypted environment variables"
    keywords: ["secret manager", "vault", "environment variable", "encrypted"]
  - point: "Separate keys per environment, least privilege"
    keywords: ["per environment", "separate", "staging", "production", "least privilege"]
  - point: "Rotate and revoke on leak"
    keywords: ["rotat", "revoke", "leak"]
  - point: "Scan repositories and restrict access"
    keywords: ["scan", "access", "restrict"]
answer_seconds: 60
example: "On one team a developer accidentally pushed an API key to a public GitHub repo. We revoked it within minutes, then moved every secret to AWS Secrets Manager with separate keys for dev, staging and production, gave the app's role read access to only its own secrets, added a secret scanner to CI, and set a 90-day rotation reminder. Local development used a .env file that was in .gitignore."
