id: conflict-with-teammate
question: "Tell me about a time you had a conflict with a teammate."
kind: real-life
short_answer: "Pick a real work disagreement, not a personal fight. Say what each of you wanted and why, in fair words. Then say what you did: you spoke to them directly, listened, and agreed what to do next. End with the result and what you do differently now. Never blame the other person."
deeper_answer: "The interviewer is checking whether you can disagree and still work well with people. They want to hear that you spoke to the person directly, not that you complained to others or stayed silent.\n\nUse four parts. Situation: the project and the two views. Task: what had to be decided. Action: what you said and did, in most detail. Result: what happened to the work and to the relationship. A good line is: \"I asked him to explain his approach first, and I found that half of my worry came from not knowing his plan.\" Keep the conflict small and real. A college project is fine if you have no work experience."
follow_ups:
  - "What would you do if talking to them had not worked?"
  - "How is your relationship with that person now?"
  - "What was your own part in the conflict?"
common_mistakes:
  - "Blaming the teammate for everything"
  - "Saying you never have conflicts"
  - "Describing a personal fight instead of a work disagreement"
level: B3
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
asked_often: true
rubric:
  - point: "Describes a real work conflict and both views fairly"
    keywords: ["wanted", "disagreed", "conflict", "his plan", "her plan", "view"]
  - point: "Spoke to the person directly and listened"
    keywords: ["asked", "listened", "talked", "explain", "meet"]
  - point: "Explains what they agreed to do next"
    keywords: ["agreed", "split", "decided", "compromise"]
  - point: "Gives the result for the work"
    keywords: ["result", "percent", "on time", "submitted", "delivered"]
  - point: "Says what they learned or do differently now"
    keywords: ["learned", "now i", "next time", "since then"]
answer_seconds: 120
example: "In my final-year project, four of us built a model to detect crop disease from leaf photos. Rahul and I both wanted to own the training code, and for a week we overwrote each other's changes. Our guide's review was ten days away, so we had to fix it fast. I asked Rahul to meet after class and let him explain his plan first. He wanted to try a bigger model, and I wanted clean data first. We agreed to split the work: he owned the model, I owned the data pipeline, and we reviewed each other's code before merging. We tested both ideas on the same 500 images. Accuracy went from 78 to 88 percent, and we submitted on time. Now I talk early when two people work on the same part."
