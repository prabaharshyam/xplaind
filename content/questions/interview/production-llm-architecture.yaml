answer_seconds: 120
example: A clinic WhatsApp assistant started as one prompt. Out-of-date fees came first, so we fetched
  fees and schedules at question time. Then we masked Aadhaar and phone numbers before any model call,
  routed the top FAQs to fixed answers, and added an exact cache keyed by date. Booking came last, as
  a tool the patient confirms. Model calls halved.
