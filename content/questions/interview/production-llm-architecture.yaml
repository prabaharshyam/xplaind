id: production-llm-architecture
question: Walk me through how you would grow the architecture of an LLM app from prototype to production.
kind: scenario
short_answer: 'Start with a single model call and real users, and add layers only when a problem needs
  them: retrieval and tools when answers lack facts, guardrails when real data arrives, a router and gateway
  when requests differ or several models are used, caches when questions repeat, and agent loops and actions
  last. Trace every request from day one.'
deeper_answer: 'Each layer brings new risks, so I record why it exists and measure it separately: retrieval
  recall, router accuracy, guardrail false blocks, cache error rate. A router is usually a small fast
  classifier that also sends out-of-scope requests to stock replies and some to people. A gateway centralises
  keys, access control, spend limits, logging, retries and fallbacks.


  Semantic caches need care because similar questions with different details have different answers. Write
  actions need approvals, permissions and budgets. Prompts, router, guardrail rules and cache keys are
  versioned and rolled back together.'
follow_ups:
- What is the difference between a router and a gateway?
- When is a semantic cache unsafe?
common_mistakes:
- Building every layer before having users
- Adding agents before context and guardrails work
level: P2
topic: system-design
