id: ai-audit-trail
question: "What should an audit trail for an AI system record, and who uses it?"
kind: use-case
short_answer: "For each decision or action: who or what made the request, on whose behalf, the input, the model and prompt version, the data or documents used, the output, any tool actions, who approved or overrode it, and when. Auditors, investigators and the product team use it to explain decisions, investigate incidents and prove controls work."
deeper_answer: "An audit trail answers 'what happened and why' months later. It differs from debugging logs: it must be complete for the events that matter, protected from tampering, kept for a defined period and accessible only to authorised people.\n\nRecord versions, because the same input can give a different output after a prompt or model change. Record the human step, because accountability rests with people. Mask or minimise personal data in the trail itself, and set retention to match legal and business needs, not 'forever'."
follow_ups:
  - "How long would you keep audit logs, and who decides?"
  - "How do you keep personal data out of the logs?"
common_mistakes:
  - "Logging outputs without the model or prompt version"
  - "Keeping logs forever with full personal data"
level: P1
topic: governance
stop_id: audit-logs
rubric:
  - point: "Records who acted and on whose behalf"
    keywords: ["who", "on behalf", "user", "requester"]
  - point: "Records input, output and data used"
    keywords: ["input", "output", "documents", "data used"]
  - point: "Records model and prompt versions"
    keywords: ["version", "model", "prompt"]
  - point: "Records human approval or override"
    keywords: ["approval", "override", "human"]
  - point: "Protects logs: tamper-proof, access, retention, minimised data"
    keywords: ["tamper", "access", "retention", "mask"]
answer_seconds: 90
example: "For an insurance claims assistant, every recommendation wrote one audit record: the claim ID, the officer who opened it, the documents the AI read, model and prompt versions, the recommendation and the officer's final decision with a reason if they disagreed. Records were write-once, kept for the period our compliance team set, and readable only by audit and compliance. When a customer complained, we could show within an hour which documents were used and that a person made the final call."
