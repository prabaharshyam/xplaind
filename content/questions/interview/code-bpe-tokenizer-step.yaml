answer_seconds: 180
example: "I would start by confirming the input: a dictionary from each word, split into symbols, to its frequency. One merge step has three parts. First I count every adjacent pair of symbols inside each word, and I weight the count by the word frequency. I never count a pair across a word boundary. Second, I pick the most frequent pair, and I need a fixed rule for ties so the result is deterministic. In the example, e s and s t both have 9, so I would take the first one seen. Third, I rewrite every word by scanning left to right, and where the pair appears I replace it with one merged symbol and skip ahead two positions. I also record the merge in an ordered list, because encoding replays the merges in that order. The cost is linear in the total number of symbols. One edge case is a a a, which should merge only once."
