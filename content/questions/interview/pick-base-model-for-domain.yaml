id: pick-base-model-for-domain
question: How would you choose a base model to continue training or fine-tune for a specialised domain
  or language?
kind: use-case
short_answer: 'Shortlist open models on licence, size and hardware. Measure how well each already models
  your domain: bits per byte on held-out domain text, not per-token perplexity, since tokenizers differ.
  Check token efficiency for your language. Then run a small fine-tune or task test on real tasks, and
  pick on task quality, cost and speed together.'
deeper_answer: 'Per-token perplexity rewards tokenizers that split text into many small pieces, so it
  misleads across models; bits per byte divides the same total surprise by the same text length. A model
  that already predicts your text well is a better starting point and usually needs less data.


  Modelling text well does not guarantee task quality, so a pilot fine-tune on 50 to 100 examples and
  a task test set settle it. Token efficiency also affects training and running cost, especially for Indian
  languages.'
follow_ups:
- Why is per-token perplexity misleading here?
- How big should the pilot be?
common_mistakes:
- Picking the largest model by default
- Comparing per-token perplexity across tokenizers
