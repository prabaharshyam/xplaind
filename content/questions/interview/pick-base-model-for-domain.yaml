example: For Telugu legal text, three base models reported perplexities of 9, 14 and 21. The one at 9
  used more than twice as many tokens, so per token it looked best. On bits per byte the model at 14 was
  clearly best, and its efficient tokenizer made training cheaper. A pilot fine-tune on summaries confirmed
  it.
