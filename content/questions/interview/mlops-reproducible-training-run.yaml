id: mlops-reproducible-training-run
question: "What do you need to pin so that a training run can be reproduced six months later, and why can two runs still differ slightly?"
kind: concept
short_answer: "Pin four things and record them with the run: the code commit, the exact data snapshot, the environment as a container image with locked library versions, and the configuration with random seeds. Results can still differ a little, because some GPU operations are not deterministic and drivers change. So I compare within a tolerance and keep the model file."
deeper_answer: "A model is the output of code, data, environment and configuration. If any one is missing, you cannot rebuild it. The usual gaps are data and environment. A table that is overwritten every night means last month's training set no longer exists, so the run must point at an immutable snapshot or a version hash. A requirements file without locked versions means a fresh install brings newer libraries. A container image tag stored with the run solves that.\n\nEven with all four pinned, exact equality is not guaranteed. Parallel data loading can change the order of examples, some GPU kernels give slightly different results from run to run, and a new GPU type or driver changes the numbers. Deterministic modes exist but can be slower. In practice the target is the same metrics within a small tolerance, plus the original model file kept in the registry, so nobody needs to retrain to answer an audit. Interviewers listen for all four parts and an honest view of the limits."
follow_ups:
