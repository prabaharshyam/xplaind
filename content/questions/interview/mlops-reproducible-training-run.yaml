  - point: "Pins the environment: container image and locked library versions"
    keywords: ["image", "container", "docker", "locked", "library versions"]
  - point: "Records configuration, hyperparameters and seeds with the run"
    keywords: ["seed", "config", "hyperparameter"]
  - point: "Explains remaining differences, such as GPU non-determinism, and uses a tolerance"
    keywords: ["determin", "tolerance", "gpu", "slightly", "driver"]
answer_seconds: 110
example: "I pin four things and store them with the run in the tracking tool. The first is the Git commit of the training code. The second is the data: not the table name, but a snapshot with a version hash, because our loans table is overwritten every night. The third is the environment, as a Docker image tag with locked library versions. The fourth is the config file and the random seed. Even then, two runs can differ slightly. Some GPU operations are not deterministic, and a new driver can change the numbers. So when an auditor asked us to reproduce a model from March, I did not promise the same weights. I showed that a rerun gave the same AUC within a tolerance of 0.002, and I showed the original model file from the registry."
