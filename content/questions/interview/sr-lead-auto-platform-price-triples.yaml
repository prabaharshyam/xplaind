answer_seconds: 165
example: "I would not decide on the licence price alone. I would compare total cost over three years for each path. Paying costs ₹36 lakh more a year. Migration means we rebuild 180 workflows, which is around 540 working days for my team, plus the projects we delay. The 20 critical finance workflows need parallel runs, so I would move them last. Before I negotiate, I would test an alternative: rebuild five typical workflows on a second platform in two weeks. With that result, I would ask the vendor for a lower price and a one year term. I would also remove unused workflows. My likely decision is a shorter renewal, with new workflows built on the second platform, so our dependence falls each quarter."
