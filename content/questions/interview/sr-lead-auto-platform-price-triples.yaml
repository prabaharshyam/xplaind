id: sr-lead-auto-platform-price-triples
question: "At renewal, the vendor of your automation platform raises the price from ₹18 lakh to ₹54 lakh a year. You run 180 workflows on it, and 20 of them are critical to finance. Do you pay, negotiate or migrate, and how do you decide?"
kind: scenario
short_answer: "I would compare the full cost of each path over three years, not only the licence. Migration cost includes rebuilding and testing 180 workflows, risk to the 20 critical ones, and work not done meanwhile. I would negotiate with a real alternative ready, probably sign a shorter term, and move new and simple workflows first to reduce dependence."
deeper_answer: "The extra ₹36 lakh a year looks large, but migration is not cheap. Rebuilding 180 workflows at even three days each is about 540 working days, plus parallel runs for the finance workflows, where an error means wrong payments. So the first step is an honest total: licence, hosting, people, migration effort, risk and the new projects that will be delayed. Over three years moving may still be better, but show it in numbers.\n\nA negotiation works only with a real alternative. Run a two-week test: rebuild five typical workflows on another platform and measure the effort. Then ask the vendor for a lower price, a multi-year cap or a smaller plan, and check the inventory, because some of the 180 may be unused. A common result is a mix: a one-year renewal at a better price, new workflows on the second platform, critical ones moved last. Interviewers listen for total cost, risk to critical work, bargaining position, and a plan to avoid dependence on one vendor next time."
follow_ups:
  - "The vendor refuses to move on price. What is your decision?"
  - "In what order would you migrate the workflows?"
  - "How would you design new workflows so that the next move is easier?"
common_mistakes:
  - "Comparing licence prices only"
  - "Threatening to leave with no tested alternative"
  - "Migrating the critical finance workflows first"
level: P2
