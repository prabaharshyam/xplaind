id: agent-x-eval-environment
question: "You need an eval suite for an agent that books and cancels appointments in a real clinic system. How do you build the test environment so that runs are safe and repeatable?"
kind: use-case
short_answer: "Run the agent against a sandbox copy of the system with seeded, fictional data, and reset it before every run. Keep the tool interfaces identical to production. Judge each task by the final state in the database, not by the agent's words. Use a scripted or simulated patient for multi-turn tasks, and run each task several times."
deeper_answer: "Agent evals are hard to repeat because the agent changes the world. If run one books the 10 am slot, run two sees a different calendar. So the first requirement is a known starting state: a test instance or a faithful fake, loaded from a fixture and reset each time. The tools should be the same code as production and point at the test backend. Otherwise you are testing a different agent.\n\nGrading should look at outcomes. After the task, a script checks the database: one appointment exists for this patient, with the right doctor and time, and nothing else changed. That catches an agent that says it booked but did not, and one that booked twice. For conversations, a simulated user with a fixed persona and goal plays the patient. Include tasks where the right outcome is no action, such as a request to see another patient's booking. Interviewers listen for reset, end-state checks, side-effect checks, and repeated trials, because one pass proves little."
follow_ups:
  - "How do you keep the fake system in line with the real one?"
  - "What are the limits of a simulated user?"
  - "How many times would you run each task, and why?"
common_mistakes:
  - "Testing against production data or real patients"
  - "Grading the agent's final message, not the system state"
  - "Not resetting state, so later runs depend on earlier ones"
level: P2
topic: agents
stop_id: evaluating-agents
rubric:
  - point: "Uses a sandbox or fake backend with seeded fictional data, never production"
    keywords: ["sandbox", "fake", "test instance", "seeded", "fictional"]
  - point: "Resets to a known state before every run"
    keywords: ["reset", "known state", "fixture", "same starting"]
  - point: "Keeps the same tool interfaces as production"
    keywords: ["same tool", "same code", "identical", "interface"]
  - point: "Grades the end state in the system and checks for unwanted side effects"
    keywords: ["end state", "final state", "database", "nothing else", "side effect"]
  - point: "Uses a simulated user and repeated trials, with tasks where no action is correct"
    keywords: ["simulated", "several times", "five times", "refuse", "no action", "trials"]
answer_seconds: 150
example: "I would never test on the live clinic system. I would set up a sandbox instance with seeded, fictional data: ten doctors, two hundred patients and a fixed calendar. Before every run a script will reset it to that known state, so each run starts the same. The agent uses the same tool code as production, pointed at the sandbox. For grading, I check the final state in the database. For a task like book Dr Rao on Friday at 10, the check is that exactly one appointment exists with the right patient, doctor and time, and nothing else changed. A simulated patient with a fixed goal handles the multi-turn tasks. I would also add tasks where the right result is no action, like a caller asking for another patient's details. Each task runs five times, and I report the pass rate."
