answer_seconds: 180
example: "I would ask how you define active and which timezone decides the day. I will assume any event counts. I do it in two steps. First, in a CTE, I group by event_date and take COUNT(DISTINCT user_id) as dau. I need DISTINCT because one user can have many events in a day. Second, I compute the moving average over that result with AVG(dau) OVER (ORDER BY event_date ROWS BETWEEN 6 PRECEDING AND CURRENT ROW). That frame is the current row and the six rows before it. It counts rows, not days, so if a day has no events the window is too long. To handle that I would join to a calendar table and treat missing days as zero. I would test a user with five events in one day, who must count once, and a day with no events."
