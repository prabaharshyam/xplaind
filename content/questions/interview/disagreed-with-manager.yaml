id: disagreed-with-manager
question: "Tell me about a time you disagreed with your manager."
kind: real-life
short_answer: "Choose a real case where you disagreed on a work decision. Explain your manager's view fairly, then how you raised your concern: in private, with evidence, and with another option. Say what was decided. If your manager still chose their way, say that you supported it fully. End with the result."
deeper_answer: "The interviewer wants to know two things. Can you speak up when you see a problem? And can you still support the decision when your view is not accepted? Both matter.\n\nGive the situation and what your manager wanted. Say why you disagreed, and that you raised it in private with evidence, not in front of the team. A good line is: \"I told her I might be missing something, then I showed her the test results and suggested a safer promise.\" Finish with the decision and the result. If your manager did not agree with you, say so honestly, and say you still did the work properly."
follow_ups:
  - "What would you have done if your manager had still said no?"
  - "Has a manager ever been right when you disagreed?"
  - "How do you decide when a disagreement is worth raising?"
common_mistakes:
  - "Making the manager look foolish"
  - "Disagreeing in front of the team, or complaining to a more senior person first"
  - "Saying you always agree with your manager"
level: I2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "States the manager's view fairly and why they disagreed"
    keywords: ["manager", "wanted", "disagreed", "because"]
  - point: "Raised it in private and with respect"
    keywords: ["private", "privately", "one to one", "asked for"]
  - point: "Used evidence, not opinion"
    keywords: ["test", "data", "showed", "evidence", "numbers"]
  - point: "Offered another option"
    keywords: ["suggested", "option", "instead", "proposed"]
  - point: "Gives the decision and the result"
    keywords: ["agreed", "decided", "result", "signed", "percent"]
answer_seconds: 120
example: "I was an ML engineer with two years of experience at a service company in Pune. We were building invoice data extraction for a logistics client. My manager wanted to promise the client 95 percent accuracy, because a competitor had said the same. I disagreed, because our test set of 200 real invoices showed 88 percent. I asked for fifteen minutes in private and showed him the errors, mostly from handwritten invoices. I suggested we promise 85 percent and send low-confidence fields to a person for review. He was worried about losing the deal, so we agreed he would present both options to the client. The client chose the review option and signed. Six months later we were at 91 percent, and we had never missed a promise."
