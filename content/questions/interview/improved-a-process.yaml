id: improved-a-process
question: "Tell me about a process you improved."
kind: real-life
short_answer: "Choose a process that wasted time or caused errors. Say how it worked before, how you measured the problem, and what you changed. Mention that you got the team to agree before changing it. Give the result as before and after numbers, and say whether people still use it."
deeper_answer: "The interviewer is checking whether you notice waste and fix it, or simply accept it. They also check that you measure, because \"it feels faster\" is not a result.\n\nSituation: the old process and who it affected. Task: why you chose to fix it. Action: how you measured it, what you built or changed, and how you got others to use it. A good line is: \"I timed the old process for three weeks first, so I could prove the saving later.\" Result: time saved or errors reduced, and whether the change lasted. Small improvements are fine. A script that saves two hours a week is a good answer for a junior role."
follow_ups:
  - "How did you know the new process was correct?"
  - "Did anyone prefer the old way? What did you do?"
  - "Is it still in use today?"
common_mistakes:
  - "Giving no numbers for before and after"
  - "Changing a shared process without asking anyone"
  - "Describing a tool and not the problem it solved"
level: I1
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Describes the old process and its cost"
    keywords: ["it took", "four hours", "by hand", "copied", "every monday", "manual"]
  - point: "Measured the problem before changing it"
    keywords: ["timed", "measured", "counted", "three weeks"]
  - point: "Explains what they changed or built"
    keywords: ["wrote", "automate", "built", "script", "changed"]
  - point: "Got agreement and checked the new way"
    keywords: ["asked my lead", "side by side", "matched", "agreed"]
  - point: "Gives before and after numbers"
    keywords: ["went from", "minutes", "percent", "caught", "saved"]
answer_seconds: 120
example: "In my first job as a junior ML engineer, I had to prepare a health report every Monday for our credit risk model. I copied numbers from three dashboards into a spreadsheet, and it took about four hours. Twice I pasted a wrong number. I timed the work for three weeks and then asked my lead if I could automate it. I wrote a Python job that pulls the numbers every morning, compares them with last month, and sends a one-page report. I also added an alert when any input changes by more than 10 percent. I ran the old and new process side by side for two weeks to check they matched. The Monday work went from four hours to ten minutes. In the second month, the alert caught a change in the income field within a day."
