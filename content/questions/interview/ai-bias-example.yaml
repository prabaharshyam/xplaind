answer_seconds: 90
example: "A clear Indian example is a loan model trained on past approvals from city branches. It may score rural applicants lower, not because they repay worse, but because few were approved before, so the data has little about them. Checking approval rates and repayment by region would show it, and the fix could be better data, removing proxies like PIN code, and human review of borderline cases."
