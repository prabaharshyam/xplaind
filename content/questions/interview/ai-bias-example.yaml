id: ai-bias-example
question: "What is bias in AI? Give an example and how to reduce it."
short_answer: "AI bias is when a system treats some groups unfairly, usually because it learned from data that reflects past unfairness or leaves groups out. For example, a hiring model trained on past hires may rank women lower if most past hires were men. Reduce it by checking results per group, fixing the data and keeping humans accountable."
deeper_answer: "Bias can come from the data, from how the problem is framed, from what is measured, and from who tested the system. In India, speech and language tools that work well in English and poorly in other languages or accents are a common example.\n\nFairness is not one number: you decide which kind of fairness matters for the decision, measure it for each group, and keep checking after launch."
follow_ups:
  - "How would you test a loan approval model for bias?"
  - "Can removing the gender column remove gender bias?"
common_mistakes:
  - "Saying AI is neutral because it is maths"
  - "Thinking removing a sensitive column fixes bias"
