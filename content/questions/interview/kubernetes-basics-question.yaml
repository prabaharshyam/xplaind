example: "For a document Q&A service I would describe it like this: the API container runs in pods; a deployment keeps, say, four replicas running and rolls out a new version one pod at a time; a service gives them one address and spreads requests. The embedding workers run as a separate deployment on GPU nodes, and an autoscaler adds pods when the queue grows."
