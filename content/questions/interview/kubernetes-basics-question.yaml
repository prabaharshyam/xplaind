id: kubernetes-basics-question
question: "Explain Kubernetes pods, deployments and services, and why you would use Kubernetes for AI apps."
short_answer: "A pod runs one or more containers together. A deployment keeps a set number of identical pods running and handles rolling updates. A service gives those pods a stable network address and load-balances between them. Kubernetes helps AI apps scale replicas with load, schedule GPU workloads, restart failed containers and roll out new versions safely."
deeper_answer: "Helm packages Kubernetes manifests as charts with configurable values, so you can deploy the same app to staging and production with different settings.\n\nKubernetes is powerful but adds operational weight. For a small team with one service, a managed platform or serverless containers may be simpler; say when you would not use it."
follow_ups:
