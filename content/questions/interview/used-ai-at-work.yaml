id: used-ai-at-work
question: "Tell me about a time you used AI to do a task better or faster."
short_answer: "Pick one real task. Say what it was and how long it used to take, how you used the AI (your prompt and the back-and-forth), how you checked and edited the result, and the outcome, ideally with a number such as time saved. Close with what you would do differently or what the AI got wrong."
deeper_answer: "Interviewers want judgement, not just enthusiasm. The strongest stories show you caught a mistake the AI made, protected confidential data, or knew when not to use it.\n\nStructure it as situation, task, action and result, and keep it under two minutes."
follow_ups:
  - "What did the AI get wrong, and how did you notice?"
  - "Is there a task where you decided not to use AI?"
common_mistakes:
  - "A vague story with no result"
  - "Not mentioning how the output was checked"
level: B1
topic: behavioral
stop_id: ai-for-writing
rubric:
  - point: "Names a real task and its context"
    keywords: ["task", "report", "email", "research", "presentation", "analysis"]
  - point: "Explains how AI was used"
    keywords: ["prompt", "asked", "used"]
  - point: "Checked and edited the output"
    keywords: ["check", "verif", "edit", "review", "correct"]
  - point: "States the result, ideally with a number"
    keywords: ["result", "saved", "hours", "minutes", "faster", "percent"]
  - point: "Shows judgement or a lesson learned"
    keywords: ["wrong", "learn", "differently", "mistake", "careful"]
answer_seconds: 120
