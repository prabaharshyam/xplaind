id: auto-portal-bot-keeps-breaking
question: "Your bot logs in to a supplier's web portal every morning to download statements. It breaks every few weeks when the page changes, and now the portal asks for an OTP. What do you do?"
kind: scenario
short_answer: "First I ask the supplier for a supported way: an API, a scheduled email or an SFTP file. If the bot must stay, I make it stable: selectors based on labels, waits for elements, a check that the file is correct, screenshots and an alert on failure. The OTP stays with a person; I do not bypass it."
deeper_answer: "Screen automation depends on something the other side can change at any time, so it is the last choice. A portal that adds an OTP is telling me it wants a person at login. Working around that can break the portal's terms and my company's security policy. So the first action is a conversation: many suppliers can send a statement by email or give API access when asked.\n\nIf there is no other way, I reduce breakage and make it visible. I select elements by stable labels or IDs, not by screen position. I wait for elements, not for fixed seconds. I check the result: the file exists, the date is correct, the row count is above zero. On failure the bot saves a screenshot and alerts the owner the same morning. For the OTP, a named person logs in and the bot continues in that session, or the download stays manual. Interviewers listen for the supported route first and for respect of the OTP."
follow_ups:
  - "How would you know the same day that the bot downloaded the wrong file?"
  - "Who should own the login the bot uses?"
  - "When would you tell the business to keep this task manual?"
common_mistakes:
  - "Trying to bypass the OTP or a CAPTCHA"
  - "Selecting elements by screen position"
  - "No check that the downloaded file is correct"
level: I1
topic: automation
stop_id: rpa-basics
rubric:
  - point: "Asks for a supported route first: API, email or file transfer"
    keywords: ["api", "sftp", "email", "supported route"]
  - point: "Makes selectors and waits more stable"
    keywords: ["selector", "label", "wait for", "screen position"]
  - point: "Checks that the downloaded file is correct"
    keywords: ["check the file", "row count", "date in the name"]
  - point: "Screenshots and a same-day alert on failure"
    keywords: ["screenshot", "alert"]
  - point: "Keeps the OTP with a person and does not bypass it"
    keywords: ["otp", "bypass", "a person"]
answer_seconds: 120
example: "My first step would be to ask the supplier for a supported route, for example an API, an SFTP drop or a daily statement by email. In one case a distributor in Chennai agreed to email a CSV, and we stopped using the bot. If that is not possible, I would rebuild the bot to break less. I would use selectors based on field labels and not on screen position, and wait for each element to appear. After the download the bot would check the file: today's date in the name and a row count above zero. On any failure it saves a screenshot and sends an alert to the owner before 10 am. For the OTP, I would not try to bypass it. A person from accounts enters the OTP at login, and the bot continues from there."
