answer_seconds: 165
example: "First I would find the cause of the delay. If the late project is blocked by the client's data access, I would escalate that, because more engineers will not help. If it is too much work, I would move one experienced engineer from the stable client for a fixed three weeks, with one clear task, and agree a smaller scope for go-live with the client. The stable engagement then runs with one first-year engineer as owner and a senior as named backup for two hours a day. That is good growth for the junior. Discovery keeps my other senior engineer, because a wrong scope there creates the next late project. I would tell all three clients about the changes myself, and review the plan every week."
