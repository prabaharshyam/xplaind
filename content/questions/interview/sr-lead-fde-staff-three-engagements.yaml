id: sr-lead-fde-staff-three-engagements
question: "You lead 5 engineers across 3 client engagements. One client's go-live is 3 weeks away and behind schedule, a second is stable, and a third has just started discovery. Two of your engineers are in their first year. How do you assign people?"
kind: scenario
short_answer: "I would move one experienced engineer to the late project for a fixed three weeks, with a narrow goal, and cut its scope with the client. The stable client gets a lighter team with a junior and a named senior for backup. Discovery keeps one senior, because early mistakes cost most. I would tell each client and review weekly."
deeper_answer: "Adding people to a late project helps only if the work can be split and the new person can be useful in days, so first find the real cause of the delay. If it is a client dependency, such as data access, more engineers will not fix it and an escalation will. If it is volume of work, one senior engineer for a fixed period with a clear task is reasonable, together with a smaller scope agreed with the client.\n\nThe cost is paid elsewhere. The stable engagement can run with less, which is also a good place for a first-year engineer to take ownership with support. Discovery should not be left to juniors alone, because a wrong scope there creates the next late project. Tell all three clients what is changing and why, before they notice. Interviewers listen for diagnosis before moving people, a time limit on the move, growth for juniors with support, and open communication with clients and your own management."
follow_ups:
  - "The stable client complains that its senior engineer has gone. How do you respond?"
  - "After three weeks the late project is still late. What now?"
  - "How do you make sure the first-year engineers grow and are not only used as support?"
common_mistakes:
  - "Moving everyone to the late project"
  - "Leaving discovery to juniors alone"
  - "Changing a client's team without telling the client"
level: P2
topic: client-delivery
stop_id: demos-risk-escalation
