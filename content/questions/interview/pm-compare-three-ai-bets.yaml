id: pm-compare-three-ai-bets
question: "Three teams at a food delivery company each want their AI idea built next quarter: a support chatbot, AI-written menu descriptions, and delivery time prediction. You can fund only one, so how do you compare them?"
kind: use-case
short_answer: "Put all three on one scorecard: size of the problem, cost of a wrong output, data we already have, running cost, and time to a first test. Then run a small check on real samples for the top two. Fund one, and tell the other teams what evidence would reopen their idea."
deeper_answer: "A shared scorecard stops the loudest team from winning. Value comes first: how many users or rupees the problem touches. Then error tolerance: a weak menu description is a small harm, a wrong refund answer is not. Then data readiness and run cost. Delivery time prediction may have years of clean trip data, while the chatbot may need policy documents that nobody has written down.\n\nScores are guesses until tested, so spend a few days on real samples before choosing. For example, generate 50 menu descriptions and ask restaurant partners to rate them. Interviewers listen for a repeatable method, a named cheap test, and a respectful no: the other two ideas go on a list with the condition that would bring them back."
follow_ups:
  - "Which of the three would you expect to win, and why?"
  - "How do you handle a senior leader who insists on their idea?"
  - "What would make you revisit the decision in the middle of the quarter?"
common_mistakes:
  - "Choosing the most impressive demo"
  - "Scoring ideas without any real sample test"
  - "Ignoring the cost of wrong outputs"
level: I2
topic: product
stop_id: choosing-ai-problem
rubric:
  - point: "Compares ideas on one shared scorecard or set of criteria"
    keywords: ["scorecard", "criteria", "same sheet", "score"]
  - point: "Sizes the user or business problem"
    keywords: ["problem", "value", "revenue", "tickets"]
  - point: "Weighs the cost of wrong outputs"
    keywords: ["wrong", "error", "mistake", "risk"]
  - point: "Checks data readiness and running cost"
    keywords: ["data", "running cost", "cost per"]
  - point: "Runs a cheap test on real samples and explains the no"
    keywords: ["sample", "test", "pilot", "prototype"]
answer_seconds: 120
example: "I would put the three ideas on one scorecard with the same criteria. First, the size of the problem: support tickets cost us money every day, so the chatbot scores high on value. Second, what a wrong output costs: a wrong refund answer is serious, a dull menu description is not. Third, the data we have and the running cost per order. At first look, delivery time prediction seems strong because we hold two years of trip data. Before deciding, I would spend one week on a small test with real samples for the top two ideas. Then I would fund one and tell the other teams clearly why, and what result would reopen their idea next quarter."
