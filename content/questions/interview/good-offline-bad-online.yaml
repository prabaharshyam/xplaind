id: good-offline-bad-online
question: "Your model scored well offline but performed badly after launch. What could explain it?"
kind: scenario
short_answer: "Common causes: data leakage made offline scores too optimistic; training data does not match live data (skew); features are computed differently in production; the population changed (drift); or the offline metric does not reflect the business goal. I would compare feature distributions offline versus online, check for leakage, and replay live inputs through the training pipeline."
deeper_answer: "A gap between offline and online results usually means the evaluation did not reflect reality. Leakage, such as a feature that is only known after the event, inflates offline scores. Training-serving skew happens when production code computes a feature differently, uses stale values or fills missing data another way.\n\nTo diagnose, log production inputs and predictions, compare their distributions to training data, and recompute some live predictions offline to see if they match. Also check the metric: a model that improves AUC may not improve the decision the business makes. Fix the cause, then add monitoring so the gap is caught early."
follow_ups:
  - "How would you detect training-serving skew?"
  - "How would you set up an evaluation that predicts online results better?"
common_mistakes:
  - "Retraining immediately without diagnosing"
  - "Assuming it is drift without checking for leakage"
level: P1
topic: deployment
stop_id: monitoring-drift
rubric:
  - point: "Names data leakage"
    keywords: ["leakage", "leak"]
  - point: "Names training-serving skew or feature differences"
    keywords: ["skew", "computed differently", "pipeline", "serving"]
  - point: "Names drift or population change"
    keywords: ["drift", "population", "changed"]
  - point: "Questions whether the offline metric matches the goal"
    keywords: ["metric", "business", "goal"]
  - point: "Diagnoses by comparing distributions or replaying inputs"
    keywords: ["compare", "distribution", "replay", "log"]
answer_seconds: 90
example: "A churn model I worked on had excellent validation scores but did not help the retention team at all. Comparing features, I found 'days since last complaint' was computed from a table that, in training, included complaints logged after the customer had already decided to leave, which was leakage. In production that information did not exist yet. Rebuilding the training set with point-in-time features dropped the offline score, but the new model's online results matched it, and the team could trust it."
