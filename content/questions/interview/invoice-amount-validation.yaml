id: invoice-amount-validation
question: "The AI in your invoice automation sometimes reads the total wrong. How do you stop wrong amounts reaching the accounts?"
kind: scenario
short_answer: "Never trust the extracted total alone. Check it: line items should add up to the subtotal, tax should match the rate, and the total should equal subtotal plus tax. Compare with the purchase order where one exists. Anything that fails a check or is above a set amount goes to a person before posting. Track the error rate."
deeper_answer: "AI extraction is good but not perfect, especially with scans, handwriting or unusual layouts. Because invoices contain numbers that relate to each other, you can catch most mistakes with arithmetic rules instead of trusting the model.\n\nCommon checks: line items times quantities add to the subtotal; GST amounts match the rates and the GSTIN format is valid; the total matches; the vendor exists in your master data; the invoice number is not a duplicate. Route failures to a review queue showing the image beside the extracted fields, and use corrected examples to improve prompts."
follow_ups:
  - "What threshold would you use for human review?"
  - "How would you measure accuracy over time?"
common_mistakes:
  - "Posting whatever the model extracts"
  - "Reviewing everything by hand, which removes the benefit"
level: I1
topic: automation
stop_id: document-extraction-automation
rubric:
  - point: "Validates arithmetic: items, subtotal, tax, total"
    keywords: ["add up", "subtotal", "tax", "total", "arithmetic"]
  - point: "Cross-checks with purchase orders or master data"
    keywords: ["purchase order", "po", "vendor", "master"]
  - point: "Routes failures or high amounts to a person"
    keywords: ["review", "human", "queue", "threshold"]
  - point: "Checks duplicates"
    keywords: ["duplicate", "invoice number"]
  - point: "Tracks the error rate"
    keywords: ["error rate", "accuracy", "track", "measure"]
answer_seconds: 90
example: "For a distributor processing about two hundred supplier invoices a week, the AI occasionally read ₹18,450 as ₹1,845 on faint scans. We added checks: line totals must add up to the subtotal, GST must match the stated rates, and the total must equal the subtotal plus GST. Any mismatch, or any invoice over ₹50,000, went to the accountant with the scan beside the fields. Wrong amounts stopped reaching the ledger, and only a small share of invoices needed a human look."
drafted_with_ai: true
reviewed_by: "UNREVIEWED: drafted by Claude, a person must review"
