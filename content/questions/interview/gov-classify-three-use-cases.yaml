id: gov-classify-three-use-cases
question: "Three proposals reach you in one week: an internal meeting summariser, AI-written marketing emails, and a model that scores loan applicants. How do you classify their risk, and what does each tier require?"
kind: use-case
short_answer: "Use the same questions for each: who is affected and how badly, what personal data is used, whether a human checks the output, and whether harm can be reversed. The summariser is low risk with data rules, the emails are medium, and loan scoring is high: full assessment, bias testing and human oversight."
deeper_answer: "Risk tiers exist so that effort goes where harm is possible. The questions are simple: does the system affect a person's access to money, work, health or education? Does it use personal or sensitive data? Does it act alone or does a person decide? How many people does it reach? Can a mistake be undone?\n\nThe meeting summariser affects staff only, though recordings may hold confidential talk, so it needs an approved tool and retention rules. Marketing emails reach the public: medium, with a human check, consent for contact, and care about claims. Loan scoring decides on individuals, and the EU AI Act lists credit scoring of people among its high-risk uses, so it gets an impact assessment, fairness tests, reasons for refusals, human review and senior sign-off. Interviewers listen for consistent criteria and controls that grow with the tier."
follow_ups:
  - "What would move the meeting summariser to a higher tier?"
  - "Who decides the tier when the product team disagrees?"
  - "How often do you reclassify a use case?"
common_mistakes:
  - "Classifying by technology instead of by impact on people"
  - "Putting every use case through the heaviest process"
  - "Letting the team that builds it choose its own tier with no check"
level: I2
topic: governance
stop_id: ai-risk-frameworks
rubric:
  - point: "Applies the same criteria to every use case"
    keywords: ["same questions", "criteria", "for each one"]
  - point: "Judges impact on people and whether harm is reversible"
    keywords: ["affect", "harm", "revers"]
  - point: "Considers personal data and human review"
    keywords: ["personal data", "human check", "sensitive"]
  - point: "Assigns tiers: low, medium, high, with reasons"
    keywords: ["low risk", "medium", "high risk", "tier"]
  - point: "Scales controls: impact assessment, bias tests, sign-off for high risk"
    keywords: ["impact assessment", "bias testing", "sign-off"]
answer_seconds: 130
example: "I ask the same questions for each one: who does it affect, how serious is the harm, is personal data used, and does a human check the output. The meeting summariser is low risk. It affects staff, so we need an approved tool and rules on recordings. Marketing emails are medium: they reach customers, so a person reviews them and we check consent and claims. The loan scoring model is high risk because it decides who gets credit, and a wrong refusal is hard to reverse for that person. For that tier I require a full impact assessment, bias testing across groups, reasons for refusals, human review of borderline cases and sign-off from the risk committee."
