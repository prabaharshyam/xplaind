id: sr-lead-pm-platform-or-product-teams
question: "At your company, 6 product teams each build AI features with their own prompts, eval methods and model vendors. Would you create a central AI platform team, keep AI work inside each team, or mix the two?"
kind: concept
short_answer: "I would mix them. Product teams keep their own features, prompts and domain evals, because they know the user. A small central team owns what should be the same everywhere: the model gateway, vendor contracts, cost tracking, eval tooling and safety checks. I would start it with two or three people and grow only when teams use it."
deeper_answer: "Each structure has a cost. Fully separate teams move fast at first, but the company pays six times for the same work, signs six vendor contracts, and has no common view of cost or quality. A large central team gives consistency, but becomes a queue, and it is far from the user problem. So most companies settle on a mix: shared tools in the centre, product decisions in the teams.\n\nThe judgement is in where to put the boundary and when. Centralise things that are the same for everyone and risky to get wrong: gateway, logging, security review, vendor terms. Leave prompts, retrieval content and domain test sets with product teams. A good sign of a healthy platform is that teams choose it because it saves them time, not because a rule forces them. Interviewers listen for the trade-off between speed and consistency, a small start, and a way to measure if the platform helps."
follow_ups:
  - "One team refuses to use the platform because its own setup is faster. What do you do?"
  - "How do you measure whether the platform team is worth its cost?"
  - "When would you choose full centralisation?"
common_mistakes:
  - "Presenting one structure as always right"
  - "Building a large platform before any team asks for it"
  - "Moving domain evals away from the product team"
level: P2
topic: product
stop_id: build-vs-buy
rubric:
  - point: "Names the trade-off: speed in teams against consistency in the centre"
    keywords: ["speed", "consisten", "queue", "duplicat", "six times"]
  - point: "Centralises shared parts: gateway, vendors, cost, safety"
    keywords: ["gateway", "vendor", "cost tracking", "security", "logging"]
  - point: "Leaves prompts and domain evals with product teams"
    keywords: ["prompt", "domain", "test set"]
  - point: "Starts small and grows with demand"
    keywords: ["small", "two or three", "grow"]
  - point: "Measures whether the platform helps teams"
    keywords: ["measure", "adoption", "time to ship"]
answer_seconds: 165
example: "I would choose a mix, and say why. Six separate teams give speed, but we pay for the same work six times and nobody sees total cost. One big central team gives consistency but becomes a queue. So I would start with a small platform team of two or three engineers. They own the model gateway, vendor contracts, cost tracking and the security checks. Product teams keep their prompts and their domain test sets, because they know the user best. At my last company this cut vendor contracts from five to two. I would measure the platform by adoption and by time to ship a new feature. If teams do not use it by choice, I would change the platform, not force the teams."
