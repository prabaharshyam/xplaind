id: agent-x-cost-per-task
question: "Your research agent gives good answers but costs about ₹45 and takes three minutes per task, against a target of ₹10 and one minute. Where do you look?"
kind: scenario
short_answer: "Measure tokens and time per step from traces. In agents, input tokens usually dominate because the whole history is sent again at every step. So trim tool outputs, compact history, cache the stable prefix, cut needless steps, run independent tool calls in parallel, and use a smaller model for simple steps. Check quality on the eval set after each change."
deeper_answer: "An agent's cost is not one call. It is the number of steps times a context that grows each time. A run of 25 steps, where each step re-sends everything so far, pays for the early tool results 25 times. So the biggest levers are usually fewer steps and less context per step, before model price.\n\nIn practice I look for large tool results, such as full web pages, and return only the relevant part. I summarise or drop old results. I keep the system prompt and tool definitions stable, so provider prompt caching applies. I look for steps the agent repeats and fix the cause. For latency, independent searches can run in parallel, and slow tools need their own fix. A cheaper model can do routing or extraction while the stronger one writes the final answer. Each change is checked against the eval set, because a cheap agent with wrong answers is worth nothing. Interviewers listen for measurement and for seeing how context growth drives cost."
follow_ups:
  - "Why do input tokens matter more than output tokens in most agent runs?"
  - "What can break prompt caching in an agent loop?"
  - "How would you set a spending cap for each task?"
common_mistakes:
  - "Switching to a cheaper model first, with no measurement"
  - "Ignoring how the context grows with every step"
  - "Cutting cost without checking answer quality again"
level: P2
topic: agents
