  - point: "Uses a smaller model for simple steps and rechecks quality on evals"
    keywords: ["smaller model", "cheaper model", "eval", "quality"]
answer_seconds: 130
example: "I would measure before changing anything. From the traces I want a breakdown of tokens and seconds per step. On a similar agent I found that a typical run took 22 steps, and input tokens were over 90 percent of the bill, because each fetched web page stayed in the context and was sent again at every step. So I changed the fetch tool to return only the relevant part of a page, and I added a step to compact old results into short notes. I kept the system prompt and tools fixed so prompt caching could work. For speed, the first five searches now run in parallel. A smaller model does the page extraction, and the main model writes the answer. After each change I reran our 60-task eval, to confirm that quality did not drop."
