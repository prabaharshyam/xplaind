id: agent-accountability-question
question: "If an AI agent makes a costly mistake, who is accountable, and how do you design for that?"
kind: scenario
short_answer: "People and the organisation are accountable, not the agent. Design so accountability is clear: a named owner for each agent, documented scope and permissions, human approval for consequential actions, complete audit logs of what it did and why, a way to stop it quickly, and an incident process that fixes the cause and informs those affected."
deeper_answer: "Frameworks such as the NIST AI Risk Management Framework stress governance: roles, documentation and oversight. Regulators and courts will look for who deployed the system and what controls they had.\n\nIn practice, keep an inventory of agents, review permissions regularly, and treat agent incidents like production incidents, with blameless post-mortems."
follow_ups:
  - "What would your audit log record for each action?"
  - "What does a kill switch look like for an agent?"
common_mistakes:
  - "Blaming the model"
  - "No owner or audit trail"
level: P2
topic: governance
