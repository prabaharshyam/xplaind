example: "I would say: if a claims agent wrongly approves a ₹3 lakh claim, the insurer is accountable, and inside the company a named product owner answers for that agent. Because we designed for this, the payout above ₹50,000 needed a human approver, the audit log showed which documents the agent read and what it recommended, and we could pause it from a dashboard. The incident review then fixed the rule it misread and we informed the affected customer."
