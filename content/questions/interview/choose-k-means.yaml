    keywords: ["scale", "outlier", "shape", "spherical"]
answer_seconds: 90
example: "For a retail chain's customer segments, I ran k-means for k from 2 to 10 on spending features. The elbow was around 4 to 6 and the silhouette score peaked at 5. But the marketing team found that two of the five clusters needed the same campaign, so we used 4, because each matched a different offer. The number that is useful to the business matters more than the best score."
