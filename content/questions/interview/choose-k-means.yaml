    keywords: ["centre", "center", "nearest", "mean", "assign"]
  - point: "Repeats until stable"
    keywords: ["repeat", "converge", "stop chang"]
  - point: "Elbow method or silhouette score to choose k"
    keywords: ["elbow", "silhouette"]
  - point: "Business usefulness decides"
    keywords: ["business", "useful", "actionable"]
