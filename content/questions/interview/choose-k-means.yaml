id: choose-k-means
question: "How does k-means work, and how do you choose k?"
kind: use-case
short_answer: "k-means picks k centres, assigns each point to its nearest centre, moves each centre to the mean of its points, and repeats until assignments stop changing. To choose k, try several values and look at the elbow in within-cluster distance, the silhouette score, and above all whether the clusters are useful for the business question."
deeper_answer: "k-means assumes roughly round clusters of similar size and is sensitive to feature scale and outliers, so scale features first. It finds a local optimum, so run it several times with different starts; k-means++ initialisation helps.\n\nThe elbow method plots within-cluster sum of squares against k and looks for where improvement flattens. Silhouette measures how much closer points are to their own cluster than to the next one. Neither is decisive: for customer segments, the right k is often the number of groups the marketing team can actually act on. If clusters are irregular in shape, consider DBSCAN or a Gaussian mixture."
follow_ups:
  - "Why must features be scaled for k-means?"
  - "When would DBSCAN be a better choice?"
common_mistakes:
  - "Not scaling features"
  - "Treating the elbow as a precise answer"
level: I1
topic: ml-basics
stop_id: unsupervised-learning
rubric:
