id: demo-went-wrong
question: "Tell me about a time a demo or launch went wrong in front of a client."
kind: real-life
short_answer: "Describe the situation briefly, then what you did in the moment (stayed calm, explained plainly, showed a backup or recorded run), how you followed up with the cause and the fix, and what you changed afterwards, such as rehearsing on the client's data, keeping a backup recording, or adding a test for that failure."
deeper_answer: "Interviewers look for ownership and composure, not perfection. The follow-up matters most: a same-day note with the cause and plan often turns a bad moment into trust.\n\nIf you have no client example, use a team or college demo, and say so plainly."
follow_ups:
  - "What would you have done to prevent it?"
  - "How did the client react to your follow-up?"
common_mistakes:
  - "Blaming the client or the model"
  - "No lesson learned"
level: P1
topic: behavioral
stop_id: demos-risk-escalation
rubric:
  - point: "Sets the situation"
    keywords: ["situation", "demo", "client", "launch"]
  - point: "Stayed calm and handled it live"
    keywords: ["calm", "explain", "backup", "recording", "in the moment"]
  - point: "Followed up with cause and fix"
    keywords: ["follow up", "follow-up", "cause", "fix"]
  - point: "Changed practice afterwards"
    keywords: ["changed", "rehears", "test", "now", "learn"]
  - point: "Takes ownership"
    keywords: ["i took", "my fault", "ownership", "responsib"]
answer_seconds: 120
example: "During a live demo to a client's operations head, our assistant answered a question about their vendor contracts with a confident wrong date. I said plainly that the answer was wrong, showed the correct clause in the source document, and switched to a recorded run of the main workflow. Next day I sent the cause, a scanned contract our parser misread, and the fix. Since then I rehearse demos on the client's own documents and keep a recording ready."
