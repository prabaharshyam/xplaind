id: gov-vendor-changes-data-terms
question: "An approved AI vendor emails that from next month it will use customer inputs to improve its models unless you opt out, and that it is adding a new sub-processor. What do you do?"
kind: scenario
short_answer: "Treat it as a trigger to reassess the vendor. Read the new terms, opt out now, and check what data we send. Review our contract for change and exit rights, and our own promises to clients and users. Assess the new sub-processor. Then accept, restrict the data, or plan an exit, and record the decision."
deeper_answer: "Vendor approval is not permanent. A change in how inputs are used can turn an acceptable tool into a breach of your own commitments: a client contract that bans use of their data for training, or a privacy notice that never mentioned it. So the first questions are factual. What exactly will be used, does the opt-out cover all of it, and what do we send today?\n\nThe contract decides your leverage: notice period for changes, right to object to a new sub-processor, right to end the contract. The sub-processor needs the same checks as the vendor, especially where data is stored and who can access it. Interviewers listen for a fast opt-out, a link back to promises made to others, a documented decision, and a standing process that catches such notices, since they often go to a billing inbox nobody reads."
follow_ups:
  - "What if the opt-out applies only to future data?"
  - "What contract clauses would have protected you here?"
  - "How do you make sure such vendor notices reach you?"
common_mistakes:
  - "Ignoring the email because the vendor was already approved"
  - "Opting out but not checking what was already sent"
  - "Forgetting commitments made to your own clients"
level: I3
topic: governance
stop_id: ai-compliance
rubric:
  - point: "Treats the change as a trigger for reassessment"
    keywords: ["reassess", "trigger", "open a review"]
  - point: "Opts out promptly and checks what data is sent"
    keywords: ["opt out", "opt-out", "what data we send"]
  - point: "Checks the contract: change notice, objection and exit rights"
    keywords: ["notice period", "right to object", "exit"]
  - point: "Checks promises made to clients and users"
    keywords: ["client contracts", "privacy notice", "promise"]
  - point: "Assesses the sub-processor and records the decision"
    keywords: ["sub-processor", "record the decision", "who approved"]
answer_seconds: 130
example: "An approved vendor changing its terms is a trigger to reassess, so I would open a review that day. First I read the actual terms and use the opt out at once. Then I check our inventory for what data we send: if it includes client documents, this matters a lot. I read our contract for the notice period, our right to object to a new sub-processor and our exit rights. I also check our own client contracts, because several say their data must not train any model. For the sub-processor I ask where data is stored and who can access it. Then we decide: continue with the opt out, restrict the data we send, or exit. I record the decision and who approved it."
