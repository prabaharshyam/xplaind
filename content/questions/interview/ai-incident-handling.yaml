id: ai-incident-handling
question: "Your AI assistant gave harmful advice to a customer. What do you do?"
short_answer: "Contain first: disable or restrict the feature or the triggering path, using a kill switch if one exists. Assess impact from logs (who was affected, how often), inform stakeholders and, where required, affected users and regulators. Find the root cause, fix it, add the case to evals and guardrails, and write a blameless post-mortem with follow-up actions and owners."
deeper_answer: "Preparation makes this manageable: a documented incident process, on-call owners, logs that let you search conversations, and switches to fall back to a safer mode. Severity levels help decide how fast to act.\n\nAI incidents often have several causes, such as retrieval of an outdated document plus missing guardrails, so look past the first explanation. Public databases such as the AI Incident Database show common patterns."
follow_ups:
  - "What would your kill switch actually do?"
  - "Who needs to be told, and when?"
common_mistakes:
  - "Quietly patching without assessing impact"
  - "Blaming the model and moving on"
level: P2
topic: governance
