id: code-reciprocal-rank-fusion
question: "Combine two ranked lists of document ids, one from keyword search and one from vector search, into one list with reciprocal rank fusion. For example, the lists a, b, c and b, d, a with the constant 60 should give the order b, a, d, c."
kind: use-case
short_answer: "For each list, give every document 1 / (k + rank), with rank starting at 1 and k usually 60. Add the scores for each document across lists in a dictionary, then sort by total score, highest first. A document missing from a list gets nothing from it. Cost is O(total items) plus the sort."
deeper_answer: "Clarify first: each input is a list of document ids ordered best first, the lists may have different lengths, and a document may appear in only one.\n\nThe steps: keep a dictionary of scores. For each list, loop with for rank, doc in enumerate(results, start=1) and add 1 / (k + rank) to the score of that document. Then sort the ids by score in descending order, with the id as a second sort key so ties are stable. In the example, b gets 1/62 + 1/61 and a gets 1/61 + 1/63, so b wins by a small margin.\n\nSay why this method is used: it needs only ranks, so there is no need to put BM25 scores and cosine scores on one scale. The constant k reduces the weight of the very top ranks; a small k lets the first result of one list dominate. Test a document that is in one list only. Interviewers watch for ranks that start at 0, and for adding raw scores from the two systems."
follow_ups:
  - "What does the constant k change?"
  - "How would you weight one retriever more than the other?"
  - "Why not add the BM25 score and the cosine score directly?"
common_mistakes:
  - "Starting ranks at 0"
  - "Adding raw scores that are on different scales"
  - "Failing on a document that is in only one list"
