answer_seconds: 150
example: "Each input is a list of document ids, best first. Reciprocal rank fusion only uses the rank, not the raw score, which is why it works for BM25 and vector search together: their scores are on different scales. I keep a dictionary from document id to a running total. For each list I enumerate with the rank starting at 1, and add 1 over k plus rank, where k is a constant, usually 60. A document that is missing from a list simply gets no contribution from it. Then I sort the documents by total, descending, and break ties by id so the output is stable. The cost is linear in the list lengths, plus the sort. In the example, b is ranked second and first, so it gets 1 over 62 plus 1 over 61, which beats a with 1 over 61 plus 1 over 63. I would also test a document that is in only one list."
