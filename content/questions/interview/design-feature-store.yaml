example: "For a food delivery company with 30 models, I would first clarify freshness. Restaurant rating can be a day old, but orders in the last 10 minutes must be fresh within seconds. I would keep a registry where each feature has one definition, an owner and a version. Batch jobs and stream jobs both compute from that same definition. They write to an offline store, which keeps the full history with timestamps for training, and to an online key-value store, which keeps only the latest value and answers within 10 milliseconds. Training sets use point-in-time joins, so an order from March only sees values known at that timestamp, and nothing leaks from the future. I would log the features served online and compare them with offline values to monitor skew. The trade-off is freshness against cost: streaming features are fresher, but they cost more and are harder to backfill."
