id: design-feature-store
question: "Design a feature store for a food delivery company where 30 models share features. Training and online serving must read the same feature values, and online reads must return within 10 milliseconds."
kind: use-case
short_answer: "Clarify which features need real-time freshness and which can be daily. Then: one feature definition used for both paths, an offline store with full history for training, an online key-value store with the latest values, batch and stream jobs that write to both, point-in-time joins to avoid leakage, and monitoring of freshness and training-serving skew."
deeper_answer: "Start by asking who uses it and what freshness each feature needs. A restaurant's average rating can be a day old. Orders in the last 10 minutes cannot. Also ask about ownership and access control.\n\nMain parts: a registry holds each feature's definition, owner, entity key and version. Batch jobs and stream jobs compute values from the same definition and write to two stores. The offline store keeps every value with its event timestamp, for training. The online store keeps only the latest value per key in a low-latency key-value database, for serving. Training sets are built with point-in-time joins, so each example only sees values that existed at its own timestamp. Without this, future data leaks into training.\n\nTrade-offs: streaming features are fresher but cost more and are harder to backfill. Precomputing is fast to read but wastes storage for rarely used keys. Check correctness by logging the features served online and comparing them with the offline values, which measures training-serving skew. At scale, the first problems are hot keys, late events that change past values, and backfills that take days when a definition changes."
follow_ups:
  - "What is a point-in-time join and what goes wrong without it?"
  - "How would you detect training-serving skew?"
  - "How do you backfill a new feature for two years of history?"
common_mistakes:
  - "Writing feature logic twice, once for training and once for serving"
  - "Joining on the latest value and leaking future data"
  - "Treating every feature as real-time"
