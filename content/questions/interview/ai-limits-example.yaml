id: ai-limits-example
question: "What can today's AI not do well?"
short_answer: "It can be confidently wrong, it does not know about recent events unless it is given them, it struggles with exact counting and some multi-step reasoning, it lacks real-world accountability and judgement about your situation, and it can reflect bias in its training data. It also cannot take responsibility; a person must."
deeper_answer: "Limits change quickly, so show you test rather than assume. For example, assistants now browse and use tools, which helps with recent events, but they can still misread sources.\n\nA good answer pairs each limit with how you work around it: give it the documents, check facts, keep a human decision-maker, and avoid using it where errors are costly and hard to spot."
follow_ups:
  - "How would you work around the model not knowing recent news?"
  - "Where would you not use AI at all?"
common_mistakes:
  - "Saying AI can do everything or nothing"
  - "Listing limits without workarounds"
level: B1
topic: ai-literacy
stop_id: what-ai-cannot-do
rubric:
  - point: "Can be confidently wrong"
    keywords: ["wrong", "hallucinat", "confident", "made up"]
  - point: "Knowledge cut-off or recent events"
    keywords: ["recent", "cut-off", "cutoff", "up to date", "latest"]
  - point: "Weak at some exact or multi-step tasks"
    keywords: ["count", "maths", "math", "reasoning", "exact"]
  - point: "No accountability or judgement; humans decide"
    keywords: ["accountab", "responsib", "judgement", "judgment", "human"]
  - point: "Pairs limits with workarounds"
    keywords: ["check", "give it", "document", "workaround", "verify"]
answer_seconds: 60
example: "Ask an AI assistant how many times the letter 'r' appears in a long Hindi transliteration, or what happened in yesterday's cricket match, and it may answer confidently and wrongly. It also cannot know that your company's refund policy changed last week, or take responsibility if its advice costs a customer money. That is why I treat it as a fast first draft that a person checks."
