id: greatest-weakness
question: "What is your greatest weakness?"
kind: real-life
short_answer: "Choose a real weakness that is not a core requirement of the job. Describe it honestly in one line, give a short example of how it hurt your work, then explain what you are doing to improve and what has changed. Do not present a strength as a weakness."
deeper_answer: "The interviewer is not looking for a perfect person. They are checking honesty, self-awareness and whether you act on feedback. Answers like \"I work too hard\" fail on all three.\n\nUse three parts: the weakness, the evidence, the fix. Pick something real but manageable, such as speaking up in meetings, estimating time, or asking for help late. Then show progress with a fact. For example: \"I used to spend days stuck on a problem before asking anyone. Now I set a two-hour limit, and after that I post what I have tried and ask.\" Do not choose a weakness that would stop you doing the job, and do not say you have none."
follow_ups:
  - "How do you know you are improving?"
  - "What is another weakness?"
  - "What feedback did your last manager or teacher give you?"
common_mistakes:
  - "Saying \"I am a perfectionist\" or \"I work too hard\""
  - "Naming a weakness with no plan to fix it"
  - "Choosing a weakness that is a core need of the job"
level: B3
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
asked_often: true
rubric:
  - point: "Names a real weakness honestly"
    keywords: ["weakness", "struggle", "not good at", "used to", "too late"]
  - point: "Gives an example of how it affected their work"
    keywords: ["for example", "once", "delay", "lost", "missed", "spent"]
  - point: "Explains the steps taken to improve"
    keywords: ["now i", "rule", "started", "practice", "habit", "since then"]
  - point: "Shows progress or a result since then"
    keywords: ["improved", "better", "clearer", "feedback", "faster", "not missed"]
answer_seconds: 90
example: "My weakness is that I ask for help too late. During my internship at an analytics firm in Noida, I spent four days trying to fix a model that kept giving poor results on new data. I did not want to look weak, so I kept quiet. When I finally asked, a senior found in twenty minutes that the training data had duplicate rows. That delay pushed our delivery by a week. Since then I follow a rule: if I am stuck for more than two hours, I write down what I tried and post it in the team channel. In the last three months of the internship my mentor said my updates were much clearer, and I did not miss a deadline for this reason again."
