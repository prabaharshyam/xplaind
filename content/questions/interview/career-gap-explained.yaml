id: career-gap-explained
question: "I see a gap in your resume. What were you doing in that time?"
kind: real-life
short_answer: "State the real reason in one or two calm sentences, without apology. Then say what you did in that time that keeps you ready: courses, projects, part-time work or caring duties. End with why you are ready to work now. Do not hide the gap or change dates."
deeper_answer: "The interviewer is checking three things: that you are honest, that the reason will not stop you working now, and that your skills are current. A gap is common. Health, family care, exam preparation, a layoff or a failed startup are all normal reasons. A hidden gap found later in a background check is the real problem.\n\nUse reason, activity, readiness. Give the reason briefly. You do not need to share private medical or family details. Then give proof of recent learning. For example: \"I left to care for my father for a year. In the last five months I completed a machine learning course and built two projects, which are on my GitHub.\" Then move to the present."
follow_ups:
  - "How did you keep your skills current?"
  - "Is the situation that caused the gap settled now?"
  - "Why did you not take a part-time job in that period?"
common_mistakes:
  - "Changing dates on the resume to hide the gap"
  - "Giving a long, apologetic explanation"
  - "Showing no learning or activity in that time"
level: I1
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "States the real reason for the gap briefly and calmly"
    keywords: ["reason", "because", "illness", "care", "health", "laid off", "exam"]
  - point: "Says what they did in that time to stay current"
    keywords: ["course", "studied", "learned", "practice", "hours a day"]
  - point: "Gives proof of recent work, such as a project or certificate"
    keywords: ["github", "project", "certificate", "built", "completed"]
  - point: "Confirms they are ready to work full time now"
    keywords: ["ready", "full time", "recovered", "settled", "available", "relocate"]
answer_seconds: 90
example: "Yes, there is a gap of fourteen months. Before that I was a Java developer in Noida for two years. My father had a serious illness, and I moved back to Lucknow to take care of him. He has recovered now, and my brother lives with him. For the first eight months I could not study much. In the last six months I studied machine learning for about three hours a day. I completed two courses and built a project that predicts loan defaults, with the code and a short report on my GitHub. I also answered questions on a Python forum to stay in practice. I am ready to work full time, and I can relocate."
