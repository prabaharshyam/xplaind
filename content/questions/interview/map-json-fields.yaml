id: map-json-fields
question: "An API returns JSON in a different shape from what the next app needs. How do you handle it?"
kind: scenario
short_answer: "Look at a real sample of both shapes first. Then map each target field from the source: rename fields, pull values out of nested objects, split or join text, convert dates and numbers, and loop over arrays. Test with edge cases such as missing fields."
deeper_answer: "Typical traps: dates in different formats or time zones (store in ISO format, and use Asia/Kolkata for display in India), numbers sent as strings, optional fields that are sometimes absent, and arrays where you expected one object.\n\nIn n8n, use the Edit Fields node, or a small Code node for anything complex. Keep transformations in one clearly named step so the next person can see what changes, and add a check that stops the workflow with a clear error if a required field is missing."
follow_ups:
  - "How do you handle an array of line items?"
  - "What would you do if a required field is sometimes missing?"
common_mistakes:
  - "Mapping from memory instead of a real sample"
  - "Ignoring time zones in dates"
level: B3
topic: automation
stop_id: shaping-json
rubric:
  - point: "Starts from real samples of both shapes"
    keywords: ["sample", "example", "both"]
  - point: "Renames and maps fields, including nested ones"
    keywords: ["rename", "map", "nested", "field"]
  - point: "Converts types and dates"
    keywords: ["date", "type", "string", "number", "format", "time zone"]
  - point: "Handles arrays"
    keywords: ["array", "list", "loop", "each item"]
  - point: "Tests edge cases like missing fields"
    keywords: ["missing", "edge case", "test", "null"]
answer_seconds: 90
example: "A payment gateway's webhook sent the amount in paise inside payload.payment.entity, while the accounting tool wanted rupees as a top-level 'total' and the customer name split into first and last. In n8n I mapped each field in an Edit Fields (Set) node, divided by 100, split the name on the first space, converted the Unix timestamp to a date, and tested with a payment that had no customer name. That case used 'Walk-in customer' instead of failing."
