answer_seconds: 130
example: "Each agent has its own context, so it does not know what the others decided, and there is no ownership of files. I would change four things. First, isolate the work. Each agent gets its own branch and a list of the folders it owns, so two agents never edit the same file. Second, one coordinator makes any decision that affects everyone, such as the format of API errors, and writes it to a decisions file that goes into every agent's brief. Third, nothing lands directly. Each branch is merged one at a time and the test suite runs after each merge. Fourth, I would look again at the split. If two tasks touch the same module, they are not parallel work, so I would give both to one agent or run them in sequence."
