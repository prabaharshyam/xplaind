id: agent-x-agents-overwrite
question: "Three agents work in parallel on one codebase, keep overwriting each other's changes, and two of them made opposite design decisions. How do you redesign the system?"
kind: scenario
short_answer: "The agents share state without ownership or a shared record of decisions. I would give each agent a separate area and an isolated workspace such as its own branch, let one coordinator make cross-cutting decisions and write them where all agents read them, and merge through tests. Tightly coupled work should go back to one agent or run in sequence."
deeper_answer: "Parallel agents are like a team that never talks and has no version control. Each one has its own context, so none knows what the others decided. Two fixes are needed: isolation for the work, and a shared source of truth for decisions.\n\nIsolation means each agent works on its own branch or copy, on files it owns, and changes are merged in a controlled step with tests. A shared decision record means choices that affect everyone, such as the API shape or the error format, are made once by the coordinator and written to a file that every agent's brief includes. If two tasks touch the same module, they are not independent, so I would run them one after the other. I would also ask whether three agents are needed at all. Parallel work pays when tasks are truly separate, like research on different topics. Interviewers listen for ownership, isolation, one place for decisions, and the honesty to reduce the number of agents."
follow_ups:
  - "How would the coordinator split the work so that tasks do not overlap?"
  - "What do you do when two branches conflict at merge time?"
  - "How do you measure whether three agents are better than one?"
common_mistakes:
  - "Adding a fourth agent to resolve conflicts between the other three"
  - "Letting all agents write to the same files at the same time"
  - "Assuming agents will discover each other's decisions without being told"
level: P2
topic: agents
