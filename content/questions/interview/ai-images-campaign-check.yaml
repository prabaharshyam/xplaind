id: ai-images-campaign-check
question: "Your team wants to use AI-generated images in a social media campaign. What do you check first?"
kind: use-case
short_answer: "I check the tool's terms allow commercial use, make sure the images do not copy a real person, brand or artist too closely, and look for errors like odd hands or garbled text. I label AI images where the platform or law asks, and a person approves every image before it goes out."
deeper_answer: "AI image tools differ in what their terms allow, especially for commercial use. A safe campaign avoids images of real, identifiable people without permission and avoids imitating protected logos or a living artist's recognisable work.\n\nPlatforms increasingly ask for AI-generated content to be labelled, and India's IT rules, amended in February 2026, require platforms to label synthetically generated content. AI images also often contain visible errors, such as wrong text, extra fingers or unrealistic products, which make a brand look careless. A short checklist and a human approval step cover most of this."
follow_ups:
  - "Would you use AI to make an image of a real customer?"
  - "How would you tell the audience an image is AI-made?"
common_mistakes:
  - "Not checking the tool's licence for commercial use"
  - "Posting images without a person checking them"
level: B1
topic: governance
stop_id: images-voice-tools
rubric:
  - point: "Checks the tool's terms for commercial use"
    keywords: ["terms", "licence", "license", "commercial"]
  - point: "Avoids copying real people, brands or artists"
    keywords: ["real person", "brand", "artist", "copy", "likeness"]
  - point: "Checks images for visible errors"
    keywords: ["error", "hands", "text", "mistake"]
  - point: "Labels AI images where required"
    keywords: ["label", "disclose", "ai-generated"]
  - point: "Has a person approve before posting"
    keywords: ["approve", "review", "human"]
answer_seconds: 90
example: "For a café's Diwali posts we tried an AI image tool. First I read the tool's terms to confirm we could use images commercially. Two of the first images showed a 'menu board' with garbled letters and a mug with a logo that looked like a famous coffee chain's, so we dropped those. We marked the posts as AI-assisted, and the owner approved each final image."
