answer_seconds: 180
example: "I would not force five teams to rewrite working agents. Frameworks change every few months, and a rewrite costs a quarter. What I would standardise is the shared layers. Every agent calls tools through one gateway with the same permission checks, sends traces in one format, and runs in the same eval harness. That fixes most of the security review and on-call pain. For the agent loop, I would pick one default for new agents. To choose it, each team would port one small agent in a week and we score the options against written criteria, so the decision is made with the teams. Existing agents migrate only when they need a big change anyway. The standard comes with a template, so it is the easy path, and any exception needs a short written reason approved by me."
