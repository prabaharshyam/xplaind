id: sr-eng-agent-framework-standardise
question: "Five teams in your company have built agents on four different frameworks, and security reviews, on-call and hiring are getting harder. Would you force one standard, and how would you make the decision stick?"
kind: use-case
short_answer: "I would standardise the layers the company must share, not every line of code: tool access and permissions, tracing, evals and deployment. For the agent loop itself, I would name one default framework for new work, chosen with the teams, and migrate existing agents only when they need major changes. Exceptions need a written reason."
deeper_answer: "Agent frameworks change quickly, so a forced rewrite of five working agents spends months to land on a choice that may soon be out of date. But full choice has real costs: four sets of security review, traces in four formats, and engineers who cannot move between teams. The useful question is which differences hurt.\n\nUsually the problems are at the boundaries. If every agent reaches tools through one gateway with the same permission checks, emits traces in one format, and passes the same eval harness, then the loop inside matters much less. Open protocols such as MCP for tools help to keep that boundary stable. For the default, run a short comparison where each team ports one small agent, and decide with written criteria. Decisions stick when the standard path is clearly easier and when leaders of the affected teams helped to choose. Interviewers listen for standard interfaces, respect for work already done, and a clear exception path."
follow_ups:
  - "Which layer would you standardise first, and why?"
  - "A team says the default framework cannot do what its agent needs. How do you handle it?"
  - "How do you avoid repeating this exercise when the next framework appears?"
common_mistakes:
  - "Forcing every team to rewrite working agents"
  - "Standardising the framework but not tools, traces and evals"
  - "Choosing the standard alone and announcing it"
level: P3
topic: agents
stop_id: agent-sdks-subagents
