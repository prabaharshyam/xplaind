id: sr-lead-sec-agent-write-access-policy
question: "In your company, 11 teams want their AI agents to have write access to production systems such as the CRM, the payment system and the code repository. As security lead, what company-wide policy do you set?"
kind: use-case
short_answer: "A tiered policy by what the action can damage. Read access is easy to get. Writes that can be undone need scoped credentials, limits and logging. Writes that move money, delete data or change production code need human approval for each action. Every agent has its own identity, an owner and a kill switch. Access widens only with evidence."
deeper_answer: "A flat yes or no fails. Banning all write access stops useful work, and teams then use personal tokens, which is worse. Allowing it freely means one prompt injection can change records or send money. So the policy sorts actions by how reversible and how costly they are. Updating a CRM note is not the same as issuing a refund or merging code.\n\nFor each tier the policy states the required controls. All agents: a separate identity, not a shared or human account, least privilege, full logs, and a named owner. Middle tier: limits on volume and amount, a sandbox test, and alerts. Top tier: a person approves each action, or the agent only prepares it. Enforcement must sit in the platform, for example in the tool layer or gateway, not in the prompt. Review access every quarter and remove what is unused. Interviewers listen for reversibility as the main test, controls in code, a path for teams to earn wider access, and how exceptions are handled."
follow_ups:
  - "A team says per-action approval makes its agent useless. What do you offer?"
  - "How do you enforce this policy technically across 11 teams?"
  - "What evidence would let an agent move to a wider tier?"
common_mistakes:
  - "A total ban that teams work around"
  - "Putting the rules only in the agent's prompt"
  - "Giving agents a shared or personal account"
level: P2
topic: security
stop_id: agent-permissions-sandboxing
rubric:
  - point: "Rejects both a total ban and open access, and says why"
    keywords: ["ban", "work around", "avoid", "personal token"]
  - point: "Sorts actions into tiers by damage and reversibility"
    keywords: ["tier", "revers", "undo", "undone"]
  - point: "Sets controls per tier, with human approval for top-tier actions"
    keywords: ["approv", "scoped", "own identity", "least privilege"]
  - point: "Enforces in a shared platform, not in each team's prompt"
    keywords: ["tool layer", "gateway", "platform", "not in the prompt"]
  - point: "Names owners, reviews access, and gives a path to wider access"
    keywords: ["owner", "each quarter", "every quarter", "wider tier", "kill switch"]
answer_seconds: 165
example: "I would not ban write access, because teams would find ways to avoid a ban. I would set three tiers based on whether an action can be undone. Tier one is read access. Tier two is writes we can reverse, like a CRM note: the agent gets its own identity with scoped credentials, a daily limit and full logs. Tier three is anything that moves money, deletes data or merges code: a human must approve each action, for example every refund. These rules are enforced in the tool layer, not in the prompt. Every agent has a named owner and a kill switch, and we review access each quarter. A team can move to a wider tier after three months of clean logs."
