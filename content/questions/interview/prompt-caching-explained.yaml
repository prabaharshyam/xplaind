id: prompt-caching-explained
question: "What is prompt caching, and when does it help?"
short_answer: "Prompt caching lets the provider reuse the processing of a repeated prompt prefix, such as a long system prompt, documents or tool definitions, so later requests that start with the same prefix are cheaper and faster. It helps when many requests share a large, unchanging beginning."
deeper_answer: "Caches match on an exact prefix, so put stable content first and anything that changes, such as the user's question, last. Caches expire after a short time unless refreshed or a longer duration is chosen, so they suit steady traffic and multi-turn conversations.\n\nThis is different from caching responses, where you store and reuse whole answers for identical or very similar questions. Response caching saves more but risks stale or wrong answers, so use it only where repeated questions should get the same answer."
follow_ups:
  - "Where in the prompt should the changing part go?"
  - "What is the difference between prompt caching and response caching?"
common_mistakes:
  - "Putting the user's question before the long fixed instructions"
  - "Confusing prompt caching with storing final answers"
