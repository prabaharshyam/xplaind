example: "In a contract-review tool, every request started with the same 15,000-token instruction and clause library, followed by a short contract excerpt. With prompt caching, that long prefix is processed once and reused for following requests within the cache lifetime, so later calls cost less and return the first token faster. Putting anything that changes, such as today's date, before the fixed part breaks the cache."
