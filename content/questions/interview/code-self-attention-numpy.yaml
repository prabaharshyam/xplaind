answer_seconds: 180
example: "Let me fix the shapes. The input X is n tokens by d features. I have three weight matrices that project X into queries, keys and values. The scores are Q times K transpose, which is an n by n matrix, and I divide by the square root of the key dimension. That scaling keeps the softmax from saturating when the dimension is large. Then I take a softmax over each row, so each token has weights over all tokens that sum to 1. The output is the weights times V, so each output is a weighted mix of the values. For a decoder I add a causal mask: I set the scores for future positions to a large negative number before the softmax. The cost is n squared times d, and the memory is n squared. I would test that every row of weights sums to 1, and that with the mask the first token attends only to itself."
