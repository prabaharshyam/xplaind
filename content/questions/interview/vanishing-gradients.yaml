answer_seconds: 90
example: "If each layer multiplies the gradient by about 0.5, after 20 layers it is around one-millionth of its size, so the first layers barely learn; that is vanishing. If each multiplies by 2, it grows about a million times and training blows up; that is exploding. ReLU activations, good initialisation, batch or layer normalisation and residual connections keep gradients healthy, and clipping caps them when they explode."
