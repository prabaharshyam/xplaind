id: agent-x-fixed-steps-no-agent
question: "A finance team asks you for an AI agent to process supplier invoices: read the PDF, extract the fields, match them to the purchase order, and post to the ledger. Would you build an agent?"
kind: scenario
short_answer: "Probably not. The steps are fixed and known, so I would build a workflow: code controls the order, and a model does only the extraction step with a strict schema. An agent adds cost, latency and unpredictable paths with no gain here. I would consider an agent only for the exceptions, where the next step depends on what is found."
deeper_answer: "An agent is useful when you cannot write the steps down in advance, because the model must choose the next action from what it sees. Invoice processing is the opposite: the same four steps run every time. Letting a model choose the order only adds ways to fail, such as skipping the match or posting twice. It also makes testing harder, because each run can take a different path.\n\nSo the design is a pipeline. A model extracts fields into a schema. Code validates totals and the GST number, matches the purchase order with rules, and posts to the ledger. Mismatches go to a person, or to a small agent that can look up related documents. Interviewers listen for a candidate who can say no to an agent, and who names the real costs: money, latency, and behaviour that is hard to predict."
follow_ups:
  - "What would have to change about this task before you chose an agent?"
  - "How would you handle the invoices where the match fails?"
  - "How do you explain this choice to a manager who asked for an agent?"
common_mistakes:
  - "Building an agent because the request used the word agent"
  - "Letting the model decide the order of fixed steps"
  - "Putting the matching rules in the prompt, not in code"
level: I3
topic: agents
stop_id: agent-loop
rubric:
  - point: "Says the steps are fixed and known, so a workflow fits better than an agent"
    keywords: ["workflow", "fixed", "same steps", "pipeline"]
  - point: "Uses the model only for the narrow step that needs it, with structured output"
    keywords: ["extract", "schema", "structured"]
  - point: "Names what an agent costs: money, latency, unpredictable paths, harder testing"
    keywords: ["cost", "latency", "unpredictable", "slower", "harder to test"]
  - point: "Keeps validation, matching and posting as rules in code"
    keywords: ["code", "rule", "validat", "match"]
  - point: "Says where an agent could be justified: open-ended exceptions"
    keywords: ["exception", "mismatch", "open-ended", "depends on"]
answer_seconds: 120
example: "I would not start with an agent. At my last company we processed about 9,000 supplier invoices a month, and the steps never changed. So I would build a workflow where code runs the fixed steps in order. A model does one job: it extracts the invoice number, GST number, line items and total into a strict schema. Then plain code validates the totals and matches the purchase order with rules. An agent here would add cost and latency, and its path would be unpredictable, which is a bad fit for a ledger. The one place I might use an agent is the exception queue. When there is a mismatch, a small agent could look up earlier invoices and emails and prepare a note for the accounts person, who still decides."
