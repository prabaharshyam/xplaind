answer_seconds: 120
example: "For a cooperative bank that would not let data leave its data centre, I laid out two options. If their policy accepted their own cloud account in an Indian region, a private deployment of a managed model there was quickest and strongest. They said no cloud at all, so we chose an open-weight model served with vLLM on two GPUs in their data centre, accepting somewhat lower quality and that their IT team would run it, with our eval set to confirm it was good enough."
