id: on-prem-deployment
question: "A bank wants your AI system but says no data may leave its network. What are the options?"
kind: scenario
short_answer: "Options include a private deployment of a hosted model in the bank's cloud tenancy and region, such as Azure OpenAI or Bedrock in its own account, if policy allows; or self-hosting open-weight models with vLLM on the bank's own GPUs, on-premise or even air-gapped. Each changes cost, model quality and who operates it."
deeper_answer: "Clarify what 'leave the network' means: their cloud account may count as inside. Regulators such as the RBI have outsourcing and data localisation expectations, so involve the bank's risk team early.\n\nAir-gapped deployments need offline model updates, internal monitoring and a support model, which take real planning. Benchmark the open-weight model on the bank's tasks before promising parity with frontier models."
follow_ups:
  - "What changes when the deployment is air-gapped?"
  - "How would you compare open-weight and hosted model quality for this client?"
common_mistakes:
  - "Assuming open-weight models match frontier quality"
  - "Not clarifying what the rule actually requires"
level: P2
topic: deployment
stop_id: deployment-models
rubric:
  - point: "Clarifies what the rule requires"
    keywords: ["clarify", "what counts", "rule", "policy", "requirement"]
