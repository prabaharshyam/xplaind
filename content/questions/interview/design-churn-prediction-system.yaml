answer_seconds: 140
example: "For 5 million subscribers, I would first clarify the definition of churn. I would use: the user cancels or does not renew in the next 30 days. I would also clarify the weekly budget. For labels I pick a snapshot date, build each feature only from data before it, and label what happened in the window after, so nothing leaks. Features are the watch time trend, days since the last session, plan, payment failures and support tickets. I train a gradient-boosted classifier and calibrate the probabilities. A weekly batch job scores everyone. I would not simply target the highest scores, because some of those users leave anyway. I would use uplift from a small randomised experiment, and target users whose decision the offer can change. I always keep a holdout group with no offer to measure retained revenue, and I monitor the scores each week. The trade-off is a larger holdout against budget spent on learning."
