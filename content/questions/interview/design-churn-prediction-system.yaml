id: design-churn-prediction-system
question: "Design a churn prediction system for a video streaming service with 5 million subscribers. Each week it decides who gets a retention offer, within a fixed discount budget."
kind: use-case
short_answer: "Clarify the definition of churn, the prediction window and the offer budget. Then: features from viewing, payments and support contacts, labels built with a time cutoff, a gradient-boosted classifier with calibrated probabilities, weekly batch scoring, targeting users the offer can actually change (uplift), a holdout group with no offer, and monitoring."
deeper_answer: "Start with definitions. Churn could mean cancelling, not renewing, or going inactive. Pick a window, such as churn in the next 30 days, and predict early enough to act.\n\nData and labels: take a snapshot date, build features only from data before it, and label whether the user churned in the window after it. Features include watch time trends, days since last session, plan type, payment failures and support tickets. A gradient-boosted classifier is a strong start. Calibrate its probabilities, because they are used with money. Scoring runs as a weekly batch job and writes a list for the campaign system.\n\nThe key trade-off is who to target. The highest-risk users may leave anyway, and some users would stay without a discount. The offer should go where it changes the outcome, which is uplift modelling, trained from a randomised experiment. Evaluate offline with precision in the top group and calibration on a time-based split. Online, keep a random holdout group that gets no offer, and compare retained revenue. At scale, the first problem is feedback: offers change behaviour, so later training data is biased."
follow_ups:
  - "Why is the highest-risk user not always the best target for an offer?"
  - "How do you build labels without leaking future data?"
  - "How would you prove the offers made money?"
common_mistakes:
  - "Using features from after the prediction date"
  - "Measuring accuracy on imbalanced data"
  - "Sending offers to everyone with a high score and no control group"
level: I3
topic: system-design
