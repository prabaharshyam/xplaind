id: ai-build-vs-buy
question: "Should we build our own AI feature or buy a vendor product?"
kind: scenario
short_answer: "Buy when the need is common and not what makes you different, such as meeting notes or a generic support bot, and a vendor meets your security and data rules. Build when the feature is core to your product, needs your own data, or vendors cannot meet your quality, cost or compliance needs."
deeper_answer: "Compare total cost over two or three years: licences or API spend, engineering time, maintenance, evals and support. Check lock-in: can you export data and switch? Run both through the same eval on your real cases before deciding.\n\nMost teams today 'buy' the model through an API and 'build' the product around it: prompts, retrieval over their data, workflows and UX."
follow_ups:
  - "How would you compare a vendor's quality claims with your needs?"
  - "What lock-in risks would you check?"
common_mistakes:
  - "Deciding on gut feel"
  - "Ignoring maintenance cost of building"
level: I2
topic: product
stop_id: build-vs-buy
rubric:
  - point: "Buy for common, non-differentiating needs"
    keywords: ["buy", "common", "commodit", "not core", "differentiat"]
  - point: "Build for core features using your data"
    keywords: ["build", "core", "own data", "workflow"]
  - point: "Checks security, data and compliance"
    keywords: ["security", "data", "complian", "privacy"]
  - point: "Compares total cost over time"
    keywords: ["total cost", "cost", "maintenance", "years"]
  - point: "Evaluates both on real cases; considers lock-in"
    keywords: ["eval", "test", "lock-in", "lock in", "switch"]
answer_seconds: 90
example: "At a healthtech company we needed meeting notes for internal calls and a symptom-triage feature for patients. For notes we bought an enterprise tool that met our data rules, in a week. For triage we built, because it used our own clinical protocols and needed strict testing and control. That split saved months and kept our effort on what made us different."
