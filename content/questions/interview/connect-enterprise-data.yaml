id: connect-enterprise-data
question: "How would you connect an AI assistant to a client's SharePoint, Salesforce and Jira?"
kind: use-case
short_answer: "Use the official APIs or existing connectors, authenticated with scoped service accounts or delegated user tokens through the client's identity provider. Ingest content incrementally with change tracking, keep source permissions with each item, handle rate limits and pagination, and log every sync. Start with one source, prove value, then add others."
deeper_answer: "Microsoft Graph covers SharePoint and Teams; Salesforce and Jira have REST APIs with their own permission models. Mapping permissions correctly is usually the hardest part, because each system models users and groups differently.\n\nAgree with the client's IT team which data is in scope, where copies may be stored, and how quickly changes must appear. MCP servers are becoming a common way to expose these systems to assistants for live lookups."
follow_ups:
  - "How would you keep permissions in sync?"
  - "When would you query live instead of indexing?"
common_mistakes:
  - "One admin account with access to everything"
  - "Ignoring rate limits"
level: P1
topic: client-delivery
stop_id: enterprise-connectors
rubric:
  - point: "Official APIs or connectors"
    keywords: ["api", "connector", "microsoft graph", "rest"]
  - point: "Scoped authentication via the identity provider"
    keywords: ["scoped", "service account", "delegated", "token", "oauth"]
  - point: "Incremental sync with change tracking"
    keywords: ["incremental", "sync", "change", "delta"]
  - point: "Keeps source permissions"
    keywords: ["permission", "access"]
  - point: "Rate limits, logging and starting with one source"
    keywords: ["rate limit", "log", "one source", "start"]
answer_seconds: 90
example: "For an engineering services client I connected SharePoint first, using Microsoft Graph with an app registration approved by their IT team. We synced only the project folders they chose, used delta queries to pick up changes every hour, and stored each document's access list so the assistant only answered from files the user could open. After the team used it for a month, we added Jira the same way."
