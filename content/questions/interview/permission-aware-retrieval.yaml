id: permission-aware-retrieval
question: "How do you make sure users only get answers from documents they are allowed to see?"
short_answer: "Enforce permissions at retrieval time, in code, not in the prompt. Store access control data, such as allowed users or groups, with every chunk, sync it from the source system, and filter the search by the signed-in user's identity before anything reaches the model. Also check caches and logs, test with two users who have different access, and audit regularly."
deeper_answer: "If a forbidden chunk ever reaches the model, it can appear in an answer, so post-filtering the answer is too late. Mirror the source system's permissions, such as SharePoint groups, and handle changes quickly: when someone loses access, their next query must reflect it.\n\nShared caches are a common leak: a cached answer for one user can be served to another. Key caches by permission set or user."
follow_ups:
  - "How would you handle a permission change in SharePoint?"
  - "Why is filtering in the prompt not enough?"
common_mistakes:
  - "Relying on the prompt to hide documents"
  - "Sharing a cache across users"
