id: auto-test-before-go-live
question: "Your new workflow writes to the live CRM and emails real customers. How do you test it before it goes live?"
kind: use-case
short_answer: "I build it against test accounts or a sandbox, with real past inputs including the difficult ones. For steps with no sandbox, I redirect output: emails go to my own address, writes go to test records. Then a dry run on live data that logs what it would do, then a small pilot, with a way to switch it off."
deeper_answer: "The risk in testing an automation is that the test itself does damage: one click can email 5,000 customers. So I separate credentials for test and live, and I make the dangerous steps safe by design, for example a single setting that sends all emails to a test address.\n\nI test with real historical inputs, not invented clean ones: empty fields, long names, two attachments, a duplicate. I test the failure paths too, by giving a wrong API key or a missing field and checking that the alert arrives. Then I run in dry-run mode on live data for a few days and compare its planned actions with what staff did. Then a pilot on one region or 5% of records, with the owner reviewing results daily. I write down the pass conditions before starting. Interviewers listen for safe test data, tests of the failure paths and a staged start."
follow_ups:
  - "How do you test the error path of a workflow?"
  - "What would make you stop the pilot?"
  - "The CRM has no sandbox. What do you do?"
common_mistakes:
  - "Testing only the normal case with clean data"
  - "Testing with live credentials and real customer emails"
  - "Going from the first success straight to full volume"
level: I1
topic: automation
stop_id: n8n-in-depth
rubric:
  - point: "Uses a sandbox or test accounts with separate credentials"
    keywords: ["sandbox", "test account", "separate credentials"]
  - point: "Tests with real past inputs, including difficult cases"
    keywords: ["real past", "difficult", "duplicate", "empty"]
  - point: "Redirects risky outputs such as emails during tests"
    keywords: ["test address", "own inbox", "redirect"]
  - point: "Tests the failure paths and the alerts"
    keywords: ["fail on purpose", "wrong api key", "alert"]
  - point: "Dry run, then a small pilot with a way to switch it off"
    keywords: ["dry run", "pilot", "turn it off", "switch"]
answer_seconds: 120
example: "I would first connect the workflow to the CRM sandbox with separate credentials, and add one setting that sends every email to a test address, which is my own inbox. Then I would run about 50 real past leads through it, including difficult ones: an empty phone field, a duplicate lead, and a name in Tamil script. I would also make it fail on purpose, with a wrong API key, to see that the alert reaches the team channel. Next is a dry run on live data for three days. The workflow only logs what it would do, and I compare that with what the sales team did. After that I start a small pilot with one city, Jaipur, and the owner checks results daily. There is one switch to turn it off."
