answer_seconds: 60
example: "In a dataset of loan applicants, 'monthly income' was missing for about 12% of rows. Checking why, I found most were self-employed applicants who left it blank, so missingness itself carried information. I imputed the median income within each occupation, fitted only on the training split, and added an 'income_missing' flag. The flag turned out to be one of the more useful features."
