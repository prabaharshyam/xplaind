id: missing-values
question: "How do you deal with missing values in a dataset?"
kind: use-case
short_answer: "First find out why values are missing, because that decides the fix. Then drop rows or columns only if little is lost, impute with the median, most frequent value or a model, and often add a flag saying the value was missing. Fit any imputation on training data only."
deeper_answer: "Missing can carry meaning: a blank income field on a loan application may itself predict risk, so a missing-value indicator often helps. Values missing completely at random are the easy case; values missing for a reason need care.\n\nIn pandas, start with isna().sum() to see how much is missing per column. Use a scikit-learn pipeline with SimpleImputer so cross-validation refits it per fold. Gradient boosting libraries can handle missing values natively, which is worth mentioning."
follow_ups:
  - "Why fit the imputer on training data only?"
  - "When would you drop a column instead?"
common_mistakes:
  - "Filling with the mean computed on all data"
  - "Dropping rows without checking how many are lost"
level: B3
topic: ml-basics
stop_id: pandas-tables
rubric:
  - point: "Asks why values are missing"
    keywords: ["why", "reason", "random", "pattern"]
  - point: "Drop only when little is lost"
