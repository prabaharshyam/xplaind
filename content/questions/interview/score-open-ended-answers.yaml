answer_seconds: 90
example: For an email-reply assistant, ROUGE said our new prompt was worse, but reading the drafts showed
  shorter, clearer replies. We switched to exact checks on order numbers and refund amounts, plus side-by-side
  reviews by two senior agents on 150 emails. The new prompt won 51% to 38%, with fewer factual errors,
  and we dropped ROUGE.
