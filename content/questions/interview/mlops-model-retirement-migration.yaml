id: mlops-model-retirement-migration
question: "Your LLM provider has announced that it will retire the model version that 14 of your features are pinned to. Plan the migration."
kind: use-case
short_answer: "List every feature and prompt that uses the model, with an owner for each. Run each feature's eval set on the replacement and compare quality, latency and cost. Fix prompts where behaviour changed. Then roll out feature by feature behind a flag or canary, while the old model still exists for rollback. Finish well before the retirement date."
deeper_answer: "A new model version rarely behaves the same as the old one. It can format output differently, refuse different things, follow instructions more or less literally, and cost or respond differently. Prompts tuned for the old model often need changes. So I would treat the migration as 14 small releases, not one switch of a config value.\n\nThe gateway or request logs give the inventory. Features with no eval set are the real risk, so the first task for those is to build a small one from logged requests. Then run old and new side by side offline, and read the differences, not only the scores. Go in order of risk: low-risk internal features first, customer-facing ones last. The deadline shapes the plan. Rollback is possible only while the old version is alive, so each canary must finish weeks early. Record which model each feature uses, so the next retirement is routine. Interviewers listen for inventory, evals per feature, staged rollout and awareness of the rollback window."
follow_ups:
  - "What do you do for a feature that has no eval set?"
  - "The new model is better on 12 features and worse on 2. What now?"
  - "How would you make the next migration cheaper?"
common_mistakes:
  - "Changing the model name everywhere in one release"
  - "Assuming the old prompts will work unchanged"
  - "Starting so late that rollback is no longer possible"
level: P2
topic: deployment
stop_id: versioning-prompts-models
rubric:
  - point: "Builds an inventory of every feature and prompt on the model, with owners"
    keywords: ["inventory", "list", "owner", "every feature", "gateway"]
  - point: "Runs each feature's evals on the new model for quality, latency and cost"
    keywords: ["eval", "compare", "side by side", "latency", "cost"]
  - point: "Expects prompts to need changes for the new model"
    keywords: ["prompt change", "format", "behav", "retune", "adjust"]
  - point: "Rolls out per feature behind a flag or canary, lowest risk first"
    keywords: ["canary", "flag", "feature by feature", "low-risk", "one by one"]
  - point: "Finishes while the old version still exists, so rollback is possible"
    keywords: ["rollback", "roll back", "before the retirement", "deadline", "weeks to spare"]
answer_seconds: 140
example: "I would start with an inventory. From the gateway logs I would list every feature and prompt that calls the old version, and name an owner for each. That gives 14 small migrations. For each one I would run its eval set on the old and new model side by side and compare quality, latency and cost. Three of our features had no evals, so I would build a set of 100 logged requests for each first. I expect some prompt changes, because the new model may format JSON or handle refusals in a different way. Then I would roll out feature by feature behind a flag, starting with low-risk internal tools and ending with the customer-facing loan assistant, each as a canary. I can roll back only while the old model exists, so everything must finish a month before the retirement date."
