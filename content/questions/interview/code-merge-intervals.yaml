answer_seconds: 150
example: "I would ask if the slots are sorted and if touching slots, like 1 to 2 and 2 to 3, should merge. I will assume unsorted input and that touching slots do merge. First I sort by start time. Then I keep a merged list and go through the slots once. If start <= merged[-1][1], the slot overlaps the last one, so I set merged[-1][1] = max(merged[-1][1], end). If not, I append a new slot. I use max because a slot can be contained inside a longer one, such as 1 to 10 and 2 to 3. The sort is O(n log n) and the pass is linear. For 9 to 10, 9.5 to 11 and 13 to 14, I get 9 to 11 and 13 to 14. I would also test an empty list."
