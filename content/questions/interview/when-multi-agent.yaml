id: when-multi-agent
question: "When is a multi-agent system worth it, and what are the risks?"
kind: scenario
short_answer: "Use several agents when a task splits into parts that need different tools, instructions or context, or can run in parallel, such as research across many sources with an orchestrator and sub-agents. Risks: more tokens and cost, harder debugging, agents miscommunicating or duplicating work, and errors compounding. Start with one agent and split only when evals show a gain."
deeper_answer: "Anthropic reported that its multi-agent research system beat a single agent on broad research tasks while using many times more tokens, which shows the trade-off clearly: parallel exploration helps when the task is wide and the value justifies the cost.\n\nDesign tips: give each sub-agent a clear, bounded task and output format; have the orchestrator check results; and trace every agent so you can find where things went wrong."
follow_ups:
  - "How would sub-agents share information?"
  - "What would you measure to justify a multi-agent design?"
common_mistakes:
  - "Starting multi-agent by default"
  - "Ignoring token cost"
level: P1
topic: agents
stop_id: multi-agent-systems
