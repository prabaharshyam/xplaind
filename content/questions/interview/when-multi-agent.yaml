answer_seconds: 120
example: "For due diligence on a company, one orchestrator agent split the work: one sub-agent searched news, one read financial filings, one checked legal cases, each with its own tools and a clean context, running in parallel. It finished faster and covered more than a single agent. But it used several times the tokens, and when one sub-agent misread a filing, finding the error took longer, so we only used this setup for large research tasks."
