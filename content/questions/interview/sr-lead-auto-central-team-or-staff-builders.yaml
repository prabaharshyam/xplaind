id: sr-lead-auto-central-team-or-staff-builders
question: "In a 1,500-person company, staff in different departments have built about 200 automations on their own, and your central team of 4 cannot build everything people ask for. What operating model and rules do you set?"
kind: use-case
short_answer: "A mixed model. Staff may build low-risk automations for their own team on an approved platform with company accounts. The central team builds or reviews anything that touches money, customer data or core systems. Every automation is registered with an owner and a backup. We give training, templates and a simple review, so the safe way is the easy way."
deeper_answer: "Both pure models fail. If only the central team may build, 4 people become a queue for 1,500 and staff build in secret. If anyone may build anything, the company ends up with 200 workflows that nobody can list, some running on personal accounts and some writing to finance systems. The middle path sorts automations by risk and gives each class a clear rule.\n\nThe central team's job changes from builder to platform owner and coach. It provides the approved tool, shared connections, templates, training and monitoring, and it builds only the critical workflows. Rules that others must follow should be few: register it, name an owner and a backup, use company credentials, keep customer data inside approved tools, and get a review before anything touches payments. Start by asking people to register the existing 200 without blame. Interviewers listen for the trade-off between speed and control, a realistic role for a team of 4, and how you would measure the model, for example by incidents and delivery time."
follow_ups:
  - "How do you find the 200 automations that already exist?"
  - "A department head says registration is needless paperwork. How do you answer?"
  - "When would you take an automation built by staff into the central team?"
common_mistakes:
  - "Banning staff from building anything"
  - "Rules with no training or templates"
  - "No list of what is running and who owns it"
level: P3
topic: automation
stop_id: documentation-handover
rubric:
  - point: "Names the trade-off between speed and control"
    keywords: ["queue", "lose control", "in secret", "trade-off"]
  - point: "Sorts automations by risk with a rule for each class"
    keywords: ["low-risk", "money", "customer data"]
  - point: "Requires a register with an owner and a backup"
    keywords: ["register", "owner", "backup"]
  - point: "Moves the central team to platform, training and review"
    keywords: ["template", "training", "reviewed by", "platform"]
  - point: "Requires company accounts and approved tools"
    keywords: ["company accounts", "approved platform", "personal"]
answer_seconds: 180
example: "I would choose a mixed model, because both extremes fail. If only my team of 4 builds, we become a queue and people build in secret. If everyone builds with no rules, we lose control. So staff may build low-risk automations for their own team on one approved platform, using company accounts and not personal ones. Anything that touches money, customer data or the ERP is built or reviewed by the central team. First, I would ask every department to register its existing automations, with no blame, and name an owner and a backup for each. My team then spends half its time on templates, training and monitoring. I would track incidents and delivery time to see if the model works."
