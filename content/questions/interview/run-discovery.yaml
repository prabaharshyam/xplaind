id: run-discovery
question: "You start with a new enterprise client. How do you run discovery?"
kind: real-life
short_answer: "Meet the sponsor to learn the business goal and how success is measured, then interview the people who do the work and watch them do it. Map the current process, collect real data samples, note systems and security rules, and find where AI could help most. End with a short written summary and a proposed first use case to confirm."
deeper_answer: "Good discovery separates what people say from what they do: shadowing a claims processor for an hour reveals more than a requirements meeting. Ask about volumes, error costs, exceptions and who approves changes.\n\nGet access to sample data early, under the client's rules, because data quality problems decide feasibility. Play back what you learned before proposing anything; clients trust engineers who show they listened."
follow_ups:
  - "What would you ask the people who do the work?"
  - "How do you handle a sponsor whose goal differs from the users' pain?"
common_mistakes:
  - "Jumping to a solution in the first meeting"
  - "Not getting real data samples"
level: P1
topic: client-delivery
stop_id: client-discovery
rubric:
  - point: "Learns the business goal and success measure"
    keywords: ["goal", "success", "measure", "sponsor", "kpi"]
  - point: "Interviews and shadows the people doing the work"
    keywords: ["interview", "shadow", "watch", "users", "people"]
  - point: "Maps the current process"
    keywords: ["map", "process", "workflow"]
  - point: "Collects real examples, data, systems and constraints"
    keywords: ["data", "sample", "example", "system", "constraint", "security"]
  - point: "Plays back findings and proposes a first use case"
    keywords: ["summary", "play back", "propose", "first use case", "written"]
answer_seconds: 120
example: "With a logistics client, I started with the COO: the goal was faster billing and the measure was days from delivery to invoice. Then I spent two days with the billing team watching them work, collected thirty real delivery notes, and listed their systems and the IT rules on data access. My one-page summary proposed starting with extracting delivery-note data, which took most of their time, and the COO confirmed it the same week."
