id: pm-prd-for-model-feature
question: "You are writing the requirements for a feature that turns a doctor's consultation notes into a summary the patient can read. What goes into this document that a normal feature spec would not have?"
kind: use-case
short_answer: "Add what a normal spec lacks: examples of good and bad summaries, a quality bar on a test set, error types ranked by harm, what the system does when unsure, the human review step, limits for latency and cost, data handling rules, and how quality is monitored after launch."
deeper_answer: "A normal spec says what the feature does. A model-backed feature also needs a spec for how wrong it may be. So the document carries examples: real notes with the summary a good doctor would accept, and outputs that must never appear. It ranks errors by harm. A missing greeting is minor. A wrong dose or an invented diagnosis is a blocker, with a target of zero on the test set.\n\nIt also states behaviour under doubt: if the note is unclear, the summary says so and does not guess. It names the review step, here the doctor approves before the patient sees anything, plus budgets for response time and cost per summary, and rules for patient data. Interviewers listen for acceptance criteria written as evals, not as vague words like 'accurate and helpful'."
follow_ups:
  - "How many examples would you include, and who writes them?"
  - "How do you write acceptance criteria for tone and reading level?"
  - "What changes if the summary must also be in Tamil?"
common_mistakes:
  - "Writing 'must be accurate' with no measurable bar"
  - "Treating all errors as equal"
  - "Leaving out what happens when the model is unsure"
level: I2
topic: product
stop_id: how-ai-products-work
rubric:
  - point: "Includes examples of good and bad output"
    keywords: ["examples", "good and bad", "sample outputs"]
  - point: "Sets a measurable quality bar on a test set"
    keywords: ["test set", "eval", "quality bar", "threshold"]
  - point: "Ranks error types by harm, with errors that are never allowed"
    keywords: ["dose", "harm", "severity", "never"]
  - point: "Defines behaviour when unsure and the human review step"
    keywords: ["unsure", "unclear", "approve", "review"]
  - point: "Adds budgets and data rules: latency, cost, patient data"
    keywords: ["latency", "cost", "seconds", "patient data"]
answer_seconds: 120
example: "For this feature I would add five things to the spec. One, examples: twenty real consultation notes with the summary a doctor would accept, and a few bad outputs we must never see. Two, a quality bar on a test set of 200 notes, agreed with our medical lead. Three, errors ranked by harm: a wrong dose or an invented diagnosis must never pass, while a clumsy sentence is minor. Four, behaviour when the note is unclear: the summary says 'please ask your doctor' and does not guess, and the doctor must approve every summary before it goes to the patient. Five, budgets: under five seconds, a cost limit per summary, and rules that keep patient data out of logs."
