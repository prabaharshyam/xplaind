id: pm-pilot-sales-call-summaries
question: "You are rolling out AI call summaries to 800 sales agents in six cities. How do you plan the pilot and the wider rollout?"
kind: use-case
short_answer: "Pilot with about 40 agents across two cities, mixing strong, average and sceptical agents, and record a baseline first. Put summaries inside the CRM they already use. Train team leads, collect feedback weekly, fix the top problems, then expand city by city against agreed success numbers."
deeper_answer: "The pilot group decides what you learn. Volunteers alone make the tool look better than it is, so include sceptics and agents who speak mixed Hindi and English on calls, since that is where transcription fails. Measure the baseline before the pilot: minutes spent on call notes, CRM fields filled, follow-ups missed. Without it, you cannot show a gain.\n\nAdoption is a people problem as much as a quality one. Agents may fear that summaries are used to monitor them, so say plainly what managers can and cannot see. Team leads matter most: if they ask for the AI summary in reviews, usage follows. Expand in waves, fixing the top three complaints between each wave. Interviewers listen for a representative pilot, a baseline, attention to agent trust, and clear criteria to expand or stop."
follow_ups:
  - "How would you pick the two pilot cities?"
  - "What would you do if agents in one city refuse to use it?"
  - "How do you handle calls in Tamil or Bengali?"
common_mistakes:
  - "Piloting only with keen volunteers"
  - "No baseline measured before the pilot"
  - "Launching to all 800 agents on one day"
level: I3
topic: product
