answer_seconds: 130
example: "I would start with a pilot of 40 agents in Pune and Lucknow, with a mix of top performers, average agents and a few sceptics. Before the pilot I would record a baseline: minutes spent writing call notes and the share of CRM fields filled. The summary must appear inside the CRM, not in a separate tool. I would train the team leads first, and tell agents clearly that summaries are for their notes, not to monitor them. Every week I would collect feedback and fix the top three issues, for example Hinglish product names. Our criteria to expand: note time down by half and 70% weekly use. Then we go city by city in three waves."
