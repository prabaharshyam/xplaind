example: "I treat the model reply as untrusted input. First I would ask which fields are required and what values are allowed. Here I need a sentiment that is positive, negative or neutral, and a score from 0 to 1. Step one, I extract the text between the first and last curly brace, because models often wrap JSON in a code fence. Step two, I parse it with json.loads inside a try block and catch JSONDecodeError. Step three, I validate against a schema, checking the allowed values and that the score is a number in range. I would use a pydantic model for that. If any step fails, I retry once with the error message added to the prompt, and after that I return a fallback value and log the raw reply. I would test a reply that is cut off in the middle, which has no closing brace and must count as a failure."
