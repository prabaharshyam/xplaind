id: prefill-and-decode
question: Why does an LLM reply have a wait before the first word and then a different speed after it?
kind: concept
short_answer: Generation has two stages. Prefill reads the whole prompt at once and fills the KV cache;
  it is limited by computing power and sets the time to first token. Decode then writes one token at a
  time, reloading the weights each step; it is limited by memory speed and sets the time per output token.
deeper_answer: 'Total time is roughly time to first token plus time per token times the number of output
  tokens. Long prompts and queueing raise the first wait; model size and memory speed set the streaming
  speed.


  This tells you which lever to pull: shorten or cache the prompt for a slow first word; use a smaller
  or quantised model or speculative decoding for a slow stream; use continuous batching for throughput.
  Measure p50 and p95, not averages.'
follow_ups:
- What is the KV cache and why does it use so much memory?
- How does speculative decoding speed up decode?
common_mistakes:
- Treating latency as one number
- Thinking decode is limited by computing power
