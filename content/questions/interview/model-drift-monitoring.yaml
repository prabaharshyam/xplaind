id: model-drift-monitoring
question: "How do you detect and handle model drift in production?"
kind: scenario
short_answer: "Monitor inputs and outputs, not just uptime. Data drift is when input distributions change; concept drift is when the relationship between inputs and the target changes. Track feature statistics, prediction distributions and, when labels arrive, real performance. Alert on meaningful shifts, investigate, and retrain or roll back with a tested pipeline."
deeper_answer: "Labels often arrive late: you learn whether a loan defaulted months later. So use proxies in the meantime: compare live feature distributions with training data using measures such as population stability index or a statistical test, watch the share of each predicted class, and track business metrics.\n\nNot every shift needs retraining; a festival season can shift spending without breaking the model. Set thresholds with care to avoid alert fatigue, keep a reference dataset per model version, and make retraining a routine, versioned pipeline with evaluation gates rather than a manual scramble."
follow_ups:
  - "What would you monitor when labels arrive months later?"
  - "When is retraining the wrong fix?"
common_mistakes:
  - "Monitoring only latency and errors"
  - "Retraining automatically without an evaluation gate"
level: P1
topic: deployment
stop_id: monitoring-drift
rubric:
  - point: "Distinguishes data drift and concept drift"
    keywords: ["data drift", "concept drift", "distribution"]
  - point: "Tracks input features and predictions"
    keywords: ["feature", "prediction", "input"]
  - point: "Measures real performance when labels arrive"
    keywords: ["label", "performance", "ground truth"]
  - point: "Alerts with sensible thresholds"
    keywords: ["alert", "threshold", "psi", "statistical test"]
  - point: "Retrains or rolls back through a tested pipeline"
    keywords: ["retrain", "roll back", "rollback", "pipeline"]
answer_seconds: 90
example: "Our delivery-time model's errors grew during the monsoon. Feature monitoring showed the share of orders in rainy hours had jumped, which is data drift, and late-delivery labels showed the model underestimated rain delays more than before, which looked like concept drift. We alerted on the error trend, retrained with the last two monsoon seasons weighted more, tested on held-out recent weeks, and deployed with the old model ready for rollback."
