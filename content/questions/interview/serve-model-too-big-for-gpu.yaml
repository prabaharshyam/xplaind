answer_seconds: 90
example: For a 70B model on servers with eight 80 GB GPUs, 16-bit weights were about 140 GB, so we used
  tensor parallelism across 4 GPUs and ran two copies per server. That met a 2-second p95 first-token
  budget at the busy hour with failover. Pipeline across two servers was slower and unnecessary.
