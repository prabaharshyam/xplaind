id: design-ml-observability
question: "Design observability for 25 models in production at a lending company. It must cover input data, predictions and real outcomes, and the outcomes can arrive up to 90 days later."
kind: use-case
short_answer: "Clarify who acts on an alert and what each model failure costs. Then monitor four layers: service health, input data quality and drift, prediction distribution, and outcome metrics once labels arrive. Log every prediction with features and model version, join outcomes later, track slices, alert with owners and runbooks, and link alerts to retraining or rollback."
deeper_answer: "Clarify the purpose first. Observability must lead to action: someone owns each model, and each alert has a response. Ask which models are high risk and what regulators expect to be recorded.\n\nFoundation: log every prediction with a request id, the feature values, the model version and the output.\n\nLayers: first, service metrics such as latency, errors and traffic. Second, data quality: schema, missing values, ranges and freshness of each feature. Third, drift: compare the distribution of inputs and of predictions with a reference window. Fourth, outcomes: when repayment labels arrive, join them to the logged predictions and compute real performance and calibration, overall and by slice.\n\nThe 90 day delay is the central problem. For weeks you only have proxies: input drift, prediction drift and early signals such as a first missed payment. Treat them as warnings, not proof, because drift does not always reduce accuracy.\n\nTrade-offs: sensitive alerts catch more but create noise, so alert on a few important features and review the others on dashboards. At scale, alert fatigue, storage cost of full logs and missing ownership break first."
follow_ups:
  - "Labels arrive after 90 days. How do you know today if the model is failing?"
  - "Input drift fired but accuracy is unchanged. What do you do?"
  - "Which slices would you track for a lending model?"
common_mistakes:
  - "Monitoring only latency and errors"
  - "Alerts on every feature with no owner"
  - "Not logging features and model version with each prediction"
level: P2
topic: system-design
stop_id: monitoring-drift
