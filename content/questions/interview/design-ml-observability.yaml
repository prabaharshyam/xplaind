  - point: "Tracks drift in inputs and predictions against a reference"
    keywords: ["drift", "distribution", "reference", "stability"]
  - point: "Joins late outcomes to compute real performance by slice"
    keywords: ["outcome", "join", "slice", "calibrat", "performance"]
  - point: "Uses proxies during the label delay, with alerts tied to action"
    keywords: ["proxy", "early", "alert", "runbook", "retrain"]
answer_seconds: 160
example: "For 25 lending models, I would first clarify who is the owner of each model and what action follows an alert. The base is a log of every prediction with a request id, the feature values and the model version. On top of that I monitor four layers. One: service health. Two: data quality, meaning schema, missing values and how fresh each feature is. Three: drift in the input and prediction distribution against a reference month. Four: outcomes. When repayment data arrives, up to 90 days later, I join it to the log and compute performance and calibration for each slice, such as new borrowers. During the delay I only have a proxy, like an early missed payment or drift, so I treat it as a warning. Each alert has a runbook that can lead to rollback or a retrain. The trade-off is sensitivity against noise, so only a few key features send an alert."
