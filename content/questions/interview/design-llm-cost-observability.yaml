id: design-llm-cost-observability
question: "A company's LLM bill has grown to 40 lakh rupees a month across 30 features and 8 teams, and nobody can say which feature caused the increase. Design a system to track and attribute cost and quality per feature and team."
kind: use-case
short_answer: "Route all model calls through one gateway. Tag every request with team, feature, environment and prompt version, record tokens, model, latency and outcome, and compute cost from a price table. Build dashboards per feature, budgets and anomaly alerts. Join cost with quality signals to get cost per successful task, then act: caching, cheaper models, shorter prompts."
deeper_answer: "Clarify the questions the system must answer: who spent what, why it changed, and whether the spend bought quality.\n\nDesign: a gateway or shared client library that every team must use. Each request carries required tags: team, feature, environment, user or tenant, prompt version. The gateway records model, input, output and cached tokens, latency, retries and errors, and sends events to a pipeline. A versioned price table turns tokens into money, so past cost stays correct when prices change. Tracing links the calls of one user task, which matters for agents, where one task may cause twenty calls. Dashboards show cost per feature, per team and per request over time, with alerts for sudden jumps and budgets with soft and hard limits.\n\nQuality: cost alone pushes teams to weaker models, so join each trace with quality signals such as user feedback, task completion and sampled evaluation scores. The key number is cost per successful task. Trade-offs: logging full prompts helps debugging but raises storage cost and privacy risk, so sample and mask. What breaks first is tag discipline: untagged calls make reports useless, so reject them at the gateway."
follow_ups:
  - "A feature's cost doubled overnight with the same traffic. How do you investigate?"
  - "What would you do at a hard budget limit: block, degrade or alert?"
  - "How do you attribute the cost of an agent that calls the model many times per task?"
common_mistakes:
  - "Tracking only the monthly invoice total"
  - "Measuring cost without any quality signal"
  - "Letting teams call providers directly with their own keys"
