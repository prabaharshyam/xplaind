answer_seconds: 150
example: "I would route every model call through one gateway, so there is a single place to measure. Each request must carry a tag for team, feature, environment and prompt version, and the gateway rejects calls without them. It records the model, input and output tokens, latency and errors, and a versioned price table turns tokens into rupees. A trace ID links all the calls of one user task, which matters for an agent that calls the model many times. Dashboards show cost per feature and per team each day, with a budget and an alert when spend jumps. To explain the 40 lakh, I would compare features week by week. Cost alone is misleading, so I join it with quality signals such as user feedback and report cost per successful task. The trade-off is that storing full prompts helps debugging but adds privacy risk, so I sample and mask them."
