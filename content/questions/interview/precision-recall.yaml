id: precision-recall
question: "Explain precision and recall with an example."
short_answer: "Precision is the share of items you flagged that were truly relevant; recall is the share of all relevant items that you found. A spam filter that flags only obvious spam has high precision but misses some spam, so lower recall. Which matters more depends on the cost of each kind of mistake."
deeper_answer: "Precision = true positives / (true positives + false positives). Recall = true positives / (true positives + false negatives). Raising one often lowers the other, which is why F1, their harmonic mean, is used as a single number.\n\nIn retrieval for RAG, recall at k asks whether the chunk you needed was in the top k results, and precision asks how much of what you retrieved was useful. Missing the needed chunk (low recall) usually hurts answers more than retrieving a few extra chunks, so teams often tune for recall first, then rerank."
follow_ups:
  - "In a medical screening test, which matters more and why?"
  - "How do precision and recall apply to RAG retrieval?"
common_mistakes:
  - "Swapping the definitions"
  - "Quoting accuracy on a heavily imbalanced dataset"
