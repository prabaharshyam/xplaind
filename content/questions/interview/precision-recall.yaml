example: "Imagine a bank's fraud alert. Of 100 transactions it flags, 80 are really fraud: that is 80% precision. If there were 200 frauds in total and it caught those 80, recall is 40%. Lowering the threshold might catch 150 frauds but flag many more honest customers, so the bank chooses based on what each kind of mistake costs."
