id: sr-lead-gov-review-queue-bypassed
question: "Your AI governance review takes 6 weeks on average, 40 requests are waiting, and you learn that two teams launched without review. As head of governance, with a team of 3, what do you change?"
kind: scenario
short_answer: "The queue is the cause, so I would fix the process before I punish anyone. Triage every request in two days. Low-risk uses get a self-assessment and a standard approval. My team spends its time on the high-risk few. I would train a contact in each business unit, publish review times, and bring the two launched systems into review now."
deeper_answer: "When review takes 6 weeks, teams learn to avoid it, and then governance sees nothing. So speed is a control in its own right. Most requests are low risk: summarisers, drafting tools, internal search. A short intake form can sort them in two days. Low-risk uses follow pre-approved conditions, such as approved tools and no sensitive data. Only the high-risk ones, for example decisions about credit, hiring or health, need a full assessment by the central team.\n\nThe trade-off is that lighter review will miss some things. Manage this with spot checks on a sample of self-assessed uses, and a rule that any change in data or purpose brings the use back for review. The two teams that launched should be reviewed now and treated as a signal, not only as a breach. Interviewers listen for risk-based triage, a target for review time, shared responsibility with business units, and checks that the fast path is not abused."
follow_ups:
  - "How do you stop teams from describing a high-risk use as low risk?"
  - "What do you do about the two teams that launched without review?"
  - "What review time would you promise, and how would you report it?"
common_mistakes:
  - "Asking only for more headcount"
  - "Punishing the two teams and keeping the 6-week process"
  - "Applying the same depth of review to every request"
level: P2
