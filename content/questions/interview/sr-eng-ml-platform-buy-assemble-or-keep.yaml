id: sr-eng-ml-platform-buy-assemble-or-keep
question: "Twelve teams train and deploy models with their own scripts, and a new model takes about six weeks to reach production. You can buy a managed ML platform, assemble open-source tools on Kubernetes, or improve what exists: how do you choose?"
kind: use-case
short_answer: "I would find where the six weeks go before choosing a tool. If the delay is approvals and hand-offs, no platform fixes it. Then I match the option to our capacity: managed if we cannot staff a platform team, open source if we need control and can run it. I would pilot with two teams and measure lead time."
deeper_answer: "Platform decisions fail when they start from a product comparison. Map one model's path first: maybe data access takes two weeks, security review two, and actual deployment three days. Then the highest-value work is a standard template and a pre-approved path, whatever the tooling.\n\nFor the tooling itself, the deciding question is who operates it. Open-source components on Kubernetes give control and avoid licence cost, but may need four engineers permanently for upgrades, security and support. A managed platform costs more per unit and limits customisation, but a team of two can support twelve teams. Improving existing scripts is cheapest now and worst later if every team keeps diverging. A good answer picks a small common core, such as registry, pipelines and deployment, pilots it with one eager and one sceptical team, and sets a target such as six weeks down to one. Interviewers listen for diagnosis, operating cost and adoption."
follow_ups:
  - "What would you standardise first, and what would you leave to the teams?"
  - "How do you count the cost of running open-source tools yourselves?"
  - "Two strong teams refuse to leave their own scripts. What do you do?"
common_mistakes:
  - "Choosing a platform before finding where the time is lost"
  - "Forgetting the engineers needed to operate open-source tools"
  - "Rolling out to all twelve teams at once"
level: P3
topic: deployment
stop_id: experiment-tracking
