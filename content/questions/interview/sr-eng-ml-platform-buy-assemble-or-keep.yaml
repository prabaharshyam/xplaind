answer_seconds: 180
example: "I would first map where the six weeks go for two recent models. If four of them are spent waiting for data access and security approval, buying a platform changes little, and a standard template with a pre-approved path helps more. For the tooling, my deciding question is who will operate it. Open source on Kubernetes gives us control and no licence, but I would need about four engineers to run it for twelve teams. A managed platform costs more, but two engineers can support it. I would choose a small core first: model registry, training pipeline and one deployment path. Then I would pilot with two teams, one keen and one doubtful, and measure lead time from trained model to production. My target would be one week."
