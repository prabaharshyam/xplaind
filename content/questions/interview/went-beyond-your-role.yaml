id: went-beyond-your-role
question: "Tell me about a time you went beyond what your role asked."
kind: real-life
short_answer: "Pick a time you saw a problem outside your assigned work and solved it. Say what your role was, what you noticed, and why you acted. Mention that you checked with the owner before you acted, and that your own work did not suffer. End with the benefit to the team."
deeper_answer: "The interviewer is checking ownership: do you care about the result, or only about your task list? They also check judgement. Going beyond your role is good. Ignoring your own work or taking over another person's work is not.\n\nSituation: your role and what you noticed. Task: why it mattered and why nobody was handling it. Action: what you did, and how you kept the owner informed. A good line is: \"It was not part of my internship, so I first asked my mentor if I could try a fix in my spare hours.\" Result: the benefit, with a number if you have one. Freshers can use an internship, a college project or a club."
follow_ups:
  - "Did your own work suffer while you did this?"
  - "How did the person who owned that area react?"
  - "How do you decide when not to get involved?"
common_mistakes:
  - "Describing work that was already part of your job"
  - "Working in someone else's area without asking them"
  - "Giving no benefit to the team"
level: B3
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "States their actual role and its limits"
    keywords: ["my job", "role", "intern", "internship", "assigned"]
  - point: "Noticed a problem outside that role"
    keywords: ["noticed", "saw", "found", "not my job"]
  - point: "Checked with the owner before acting"
    keywords: ["asked my mentor", "asked my manager", "permission", "she said", "he said"]
  - point: "Describes the extra work done"
    keywords: ["wrote", "built", "script", "guide", "created"]
  - point: "Gives the benefit, and their own work did not suffer"
    keywords: ["rose", "percent", "result", "daily target", "saved"]
answer_seconds: 120
example: "During my six-month internship at a data labelling company in Coimbatore, my job was only to label customer reviews as positive, negative or neutral. I noticed that the eight of us often gave different labels to the same review, mostly for sarcasm and mixed reviews. It was not my job to fix this, so I asked my mentor first, and she said I could try. In the evenings I wrote a short script to find reviews where labellers disagreed. I took the 100 most common cases and wrote a two-page guide with examples for each. My mentor shared it with the team. In three weeks, agreement between labellers rose from 72 to 89 percent, and I still met my own daily target. The guide is now given to every new intern."
