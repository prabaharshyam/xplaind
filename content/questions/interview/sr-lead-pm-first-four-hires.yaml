answer_seconds: 165
example: "It depends on the first product bet, so I would agree that with leadership first. Say it is an AI assistant inside our accounting product. My first hire is a senior engineer who has shipped LLM features to production, because reliability is the first block. Second, an engineer who owns data and evals, so we know if a change is better. Third, a designer, because users must see sources and correct wrong output. I would keep the fourth hire open for three months, then choose between another engineer and a domain expert from finance. I would not hire a research scientist yet, since we do not train models. Legal and security time I would borrow from existing teams."
