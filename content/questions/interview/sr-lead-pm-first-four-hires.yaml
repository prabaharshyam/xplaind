id: sr-lead-pm-first-four-hires
question: "You are asked to start an AI product group at a 300-person software company and have budget for 4 hires this year. Which roles do you hire first, and why?"
kind: use-case
short_answer: "It depends on the first product bet, so I would fix that first. My usual order: a strong engineer who has shipped LLM features, a second engineer for data and evals, a designer for uncertain output, and then either a domain expert for labelling or another engineer. I would borrow legal and security time, not hire it."
deeper_answer: "There is no single right list, so interviewers want the reasoning. Hiring follows the plan: what is the first product, and what is most likely to block it? For most application teams the first block is not research. It is shipping a reliable feature and knowing if it is good. So the early hires are engineers who have put LLM features into production, and one person who owns data and evals. A research scientist is usually a late hire unless you train your own models.\n\nThe trade-off is depth against range. With only 4 people, each must cover two jobs, so people with broad skills are better than narrow experts. A designer matters early because users need to see and correct wrong output. Also say what you will not hire: governance, security and legal can be shared with existing teams at first. Mention how you would grow the team: clear ownership, shared evals, and a review after two quarters."
follow_ups:
  - "Why not hire a research scientist first?"
  - "Would you move existing engineers into the group or hire from outside?"
  - "How would you know after six months that the hires were right?"
common_mistakes:
  - "Listing roles before naming the product bet"
  - "Hiring narrow experts for a 4-person team"
  - "Forgetting who owns evals and data"
level: P2
