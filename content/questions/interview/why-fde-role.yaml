id: why-fde-role
question: "Why do you want to be a forward deployed engineer?"
short_answer: "Connect the role to real experiences: you enjoy working directly with users, you like turning messy business problems into working software, and you can switch between coding and conversations. Give one example where you did this, such as building something for a team and changing it after watching them use it, and say what you want to learn."
deeper_answer: "FDE roles, popularised by Palantir and now common at AI companies, mix engineering with client work: discovery, building, deployment and adoption. Interviewers probe for ownership, comfort with ambiguity and travel or client time.\n\nBe honest about trade-offs you accept, such as less time on deep infrastructure work, and why that suits you."
follow_ups:
  - "What part of the role would you find hardest?"
  - "Tell me about a time you worked directly with a user to change what you built."
common_mistakes:
  - "Generic enthusiasm with no example"
  - "Describing a pure software engineering role"
level: I3
topic: behavioral
