answer_seconds: 150
example: "I would first check the cause: detection, processing, missing deletes or a cache. Then I set a freshness target of 15 minutes for policy sources. Each source sends a change event through a webhook or change data capture, and sources without events get a scan every few minutes. Every change goes on a queue. A worker parses the document, compares a hash of each chunk with the stored one, and embeds only changed chunks. It writes with an upsert keyed by document and chunk ID, so a retry is safe. The same step will remove chunks from the old version, and a delete in the source is an event too. The trade-off is that incremental updates can miss events, so a weekly full reconciliation compares source and index. For 50,000 changes a day this is cheap. I would monitor index lag and queue depth, and clear cached answers for changed documents."
