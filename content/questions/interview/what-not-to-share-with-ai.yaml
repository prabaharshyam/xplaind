id: what-not-to-share-with-ai
question: "What information should you never paste into a public AI chatbot at work?"
kind: scenario
short_answer: "Anything confidential or personal unless your company has approved the tool for it: customer details such as names, phone numbers, Aadhaar or account numbers, passwords and keys, unreleased financials, contracts and source code. Check your company's AI policy and use approved tools, and remove or mask personal details first."
deeper_answer: "Free consumer tools may keep conversations and, depending on settings, use them to improve models. Business plans usually offer stronger terms, which is why companies approve specific tools.\n\nIndia's Digital Personal Data Protection Act makes organisations responsible for how they handle personal data, so a careless paste can become a compliance problem as well as a security one. A safe habit is to replace real names and numbers with placeholders before asking for help."
follow_ups:
  - "How would you get help drafting a reply to a customer complaint without sharing their data?"
  - "What should a company AI policy say about this?"
common_mistakes:
  - "Assuming a chat is private because only you can see it"
  - "Forgetting that code and contracts are confidential too"
level: B1
topic: governance
stop_id: use-ai-safely
rubric:
  - point: "Personal data: names, phone, Aadhaar, account numbers"
    keywords: ["personal", "name", "phone", "aadhaar", "account", "customer"]
  - point: "Secrets: passwords, keys, confidential business data"
    keywords: ["password", "key", "confidential", "financial", "contract", "code"]
  - point: "Follows company policy and approved tools"
    keywords: ["policy", "approved"]
  - point: "Masks or removes details first"
    keywords: ["mask", "remove", "placeholder", "anonym", "redact"]
answer_seconds: 60
example: "A colleague once pasted a customer complaint into a free chatbot, including the customer's full name, phone number and account number, to get help drafting a reply. I suggested redoing it with the details replaced by placeholders such as [Customer] and [Account], which gave just as good a draft, and pointed them to our approved company assistant for anything containing customer data."
