id: computer-use-agent-risks
question: "What are computer-use or browser agents good for, and what are their risks?"
short_answer: "They control a screen or browser like a person, so they can work with sites and apps that have no API. They are slower, more expensive and less reliable than API calls, and riskier: a malicious page can inject instructions, and they could click something irreversible. Use a sandbox, allow-listed sites and approval before submitting."
deeper_answer: "Use an API when one exists. For browser automation with fixed steps, a script with Playwright is cheaper and more predictable than an agent. Computer-use agents fit tasks that vary each time and where a person would otherwise click through.\n\nLog screenshots, cap steps and keep credentials out of the agent's reach where possible."
follow_ups:
  - "When would you choose Playwright over a computer-use agent?"
  - "How would you stop the agent from submitting a payment?"
common_mistakes:
  - "Using it when an API exists"
  - "No approval before irreversible clicks"
