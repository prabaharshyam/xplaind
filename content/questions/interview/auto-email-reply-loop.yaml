    keywords: ["alert", "volume", "close the"]
answer_seconds: 120
example: "First I would switch off the workflow, because every minute adds more emails. Then I would check the damage: how many tickets were created and if our mail provider has put a hold on sending. I would close the 3,000 tickets in bulk with a clear tag. To prevent it, I would add four guards. One: skip any email with an Auto-Submitted header, and skip senders like no-reply and bounce addresses. Two: send the acknowledgement only for the first message of a thread. Three: a limit of three replies per sender per hour, and after that the email goes to a person. Four: an alert if the inbox gets more than 200 emails in an hour, which is far above the normal volume for our support team in Bengaluru."
