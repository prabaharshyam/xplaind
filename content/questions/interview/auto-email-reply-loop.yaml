id: auto-email-reply-loop
question: "Your support inbox automation sends an acknowledgement to every incoming email. Overnight it exchanged 3,000 emails with another company's auto-responder. How do you stop it and prevent it?"
kind: scenario
short_answer: "I switch the workflow off first and check for harm, such as tickets created or a blocked sending account. Then I add guards: do not reply to automatic messages, to no-reply addresses or to our own address; one acknowledgement per thread; a limit of replies per sender per hour; and an alert on unusual volume."
deeper_answer: "A mail loop happens when two automatic senders answer each other. Each reply is a new incoming email, so the trigger fires again. It can fill inboxes, create thousands of tickets and get the sending domain flagged as spam, so stopping the workflow comes before analysis.\n\nPrevention uses several layers, because no single one catches all cases. Automatic emails usually carry headers such as Auto-Submitted or a bulk precedence value, and my reply should carry Auto-Submitted too, so that other systems can skip it. I skip senders like no-reply and mailer-daemon, and delivery failure reports. I acknowledge only the first message of a thread. A rate limit, for example 3 replies to one address per hour, stops whatever passes the other checks. Interviewers listen for stop first, then layered guards and a volume alert, and for cleaning up the tickets created."
follow_ups:
  - "Which email headers show that a message was sent automatically?"
  - "How do you clean up the 3,000 tickets it created?"
  - "What limit would you set, and what happens when it is reached?"
common_mistakes:
  - "Analysing the cause while the loop is still running"
  - "Relying on one check only"
  - "Replying to bounce messages"
level: I1
topic: automation
