id: retrieval-without-vectors
question: "Can you do retrieval for long documents without a vector database?"
short_answer: "Yes. For long, well-structured documents such as annual reports or contracts, you can build a tree of the document's sections, like a table of contents with summaries, and let a model navigate it and open the relevant parts, as PageIndex does. Keyword search such as BM25 is another vector-free option. These can beat chunk similarity when structure matters."
deeper_answer: "Vector search splits documents into chunks that lose context, such as which section a clause belongs to. Tree navigation keeps that structure and gives explainable paths: you can show which sections the model read.\n\nThe trade-offs are more model calls per query, slower answers and dependence on good document structure. For large collections of short documents, vectors or hybrid search usually remain the better choice."
follow_ups:
  - "What kinds of documents suit tree navigation?"
  - "What are the costs compared with vector search?"
common_mistakes:
  - "Assuming RAG always needs embeddings"
  - "Ignoring latency of multi-step navigation"
