id: automation-personal-data
question: "Your automation handles customer personal data. What precautions do you take?"
short_answer: "Collect and pass only the fields each step needs, use tools and AI providers the company has approved, keep credentials in the tool's secure store, restrict who can view executions, mask personal data in logs, and set retention so old run data is deleted. Under India's DPDP Act the company must use data only for the purpose customers agreed to."
deeper_answer: "Automation tools keep execution history, which can quietly become a copy of customer data; set them to prune old executions. Check where a hosted tool stores data, and whether sending data to an AI model is allowed by the company's policy.\n\nDocument the data flow: which systems, which fields, who can access them. That document is what a security review or a customer will ask for."
follow_ups:
  - "Where can personal data leak in an n8n setup?"
  - "What would you put in a data-flow document?"
common_mistakes:
  - "Logging full payloads forever"
  - "Sending personal data to unapproved AI tools"
