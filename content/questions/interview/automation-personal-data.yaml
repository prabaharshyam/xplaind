id: automation-personal-data
question: "Your automation handles customer personal data. What precautions do you take?"
kind: scenario
short_answer: "Pass only the fields each step needs, use approved tools and AI providers, keep credentials in the tool's secure store, restrict who can view executions, mask personal data in logs, and delete old run data. Under India's DPDP Act, data should be used only for a lawful purpose, usually the one customers consented to."
deeper_answer: "Automation tools keep execution history, which can quietly become a copy of customer data; set them to prune old executions. Check where a hosted tool stores data, and whether sending data to an AI model is allowed by the company's policy.\n\nDocument the data flow: which systems, which fields, who can access them. That document is what a security review or a customer will ask for."
follow_ups:
  - "Where can personal data leak in an n8n setup?"
  - "What would you put in a data-flow document?"
common_mistakes:
  - "Logging full payloads forever"
  - "Sending personal data to unapproved AI tools"
level: I1
topic: governance
stop_id: data-quality-pii
rubric:
  - point: "Minimises fields passed"
    keywords: ["only the fields", "minim", "need"]
  - point: "Approved tools and AI providers"
    keywords: ["approved", "provider", "policy"]
  - point: "Secure credentials and access control"
    keywords: ["credential", "secret", "access", "permission"]
  - point: "Masks logs and sets retention"
    keywords: ["mask", "log", "retention", "delete", "prune"]
  - point: "Names DPDP or purpose limitation"
    keywords: ["dpdp", "purpose", "consent", "law"]
answer_seconds: 90
example: "In a workflow that moved patient appointment details from a form to a clinic's calendar, I passed only name, phone and time, not the reason for the visit. Credentials sat in n8n's credential store, only two staff could view executions, and execution data was deleted after 14 days. The AI step that wrote reminder messages used the clinic's approved provider and got only the first name and time."
