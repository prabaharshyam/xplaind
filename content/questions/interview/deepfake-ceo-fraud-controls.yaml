answer_seconds: 100
example: "For a hypothetical Kolkata manufacturing firm, I wrote a one-page rule: any payment over five lakh rupees or any bank detail change needs two approvers and a call-back to the number in our vendor system. We ran a drill where a 'director' left a cloned-voice message asking for an urgent transfer. Two of five staff started the transfer; after the drill and a simple checklist, the next drill had none."
