id: deepfake-ceo-fraud-controls
question: "As a security engineer, how would you protect a company's finance team from deepfake voice or video calls from the 'CEO'?"
kind: scenario
short_answer: "Do not rely on people spotting fakes; change the process. Payments and bank detail changes need a second approval and a call-back on a known number, never on the number or link in the request. Add code words or out-of-band checks for urgent asks, train finance staff with realistic drills, and make reporting easy and blame-free."
deeper_answer: "Voice cloning and live video deepfakes keep improving, so detection by ear or eye fails. Attackers use urgency, secrecy and authority, so the controls must hold even when the request seems genuine.\n\nControls: payment limits with two-person approval; a fixed rule that bank detail changes are verified through the vendor master record and a call-back; a verification phrase or ticket number for executive requests outside normal channels; reducing public voice and video samples where reasonable; and email and chat banners for external or new senders. Drill it: run an announced simulated call, then review what happened. Have an incident path ready, including contacting the bank quickly and reporting to the 1930 cybercrime helpline or cybercrime.gov.in."
follow_ups:
  - "What if the CEO really is travelling and needs an urgent payment?"
  - "Would you buy a deepfake detection tool? Why or why not?"
common_mistakes:
  - "Relying on staff to hear or see that a call is fake"
  - "Allowing exceptions to the approval process for senior people"
level: I2
topic: security
stop_id: ai-powered-attacks
