example: "First I would check if case matters and if duplicates can appear. I will assume lowercase words. Two words are anagrams when their sorted letters are the same, so I use the sorted letters as a key in a dict. I create groups = defaultdict(list), and for each word I run groups[\"\".join(sorted(word))].append(word). Then I return list(groups.values()). Sorting one word of length m costs m log m, so for n words the total is O(n times m log m), with memory for all the words. For listen, silent, enlist, cat, act and dog I get three groups, and dog is a group of one. If words were very long I would use a tuple of letter counts as the key. I would also test an empty list, which returns no groups."
