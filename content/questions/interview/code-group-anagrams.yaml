id: code-group-anagrams
question: "Group the words in a list that are anagrams of each other. For example, listen, silent, enlist, cat, act, dog becomes three groups: listen, silent and enlist; cat and act; and dog alone."
kind: use-case
short_answer: "Give every word a key that all its anagrams share, and group words by that key in a dict. The simple key is the sorted letters: \"\".join(sorted(word)). For n words of average length m this is O(n times m log m) time and O(n times m) memory. A letter-count tuple removes the log factor."
deeper_answer: "First clarify the input. Ask whether case matters, whether words can contain spaces or accents, and whether the same word can appear twice. Ask whether the order of groups or of words inside a group matters.\n\nThe idea is that two words are anagrams exactly when their sorted letters are equal. So build groups = defaultdict(list) and, for each word, run groups[\"\".join(sorted(word))].append(word). At the end return list(groups.values()). Because a dict keeps insertion order, groups appear in the order their first word was seen.\n\nSorting each word costs O(m log m), so the total is O(n times m log m). For long words, use a count key instead: a tuple of 26 letter counts, which is O(m) per word. Test an empty list, single-letter words, a word with no anagram, and mixed case such as Listen and silent, where you call word.lower() before making the key. Say that comparing every pair of words would be O(n squared) and is the approach to avoid."
follow_ups:
  - "How would you avoid sorting each word?"
  - "Why can a list not be used as a dict key here?"
  - "How would you handle upper case and accented letters?"
common_mistakes:
  - "Comparing every pair of words, which is O(n squared)"
  - "Using sorted(word) directly as a dict key, which fails because a list is not hashable"
  - "Dropping words that have no anagram"
