id: ml-project-end-to-end
question: "Walk me through an ML project you did, end to end."
kind: real-life
short_answer: "Cover the problem and the decision it supports, the data and how you cleaned it, the baseline, the features and models you tried, how you validated without leakage, the metric and why it fit, the result against the baseline, and how it was used. End with what you would improve, in about two minutes."
deeper_answer: "Interviewers look for a full loop and for judgement at each step. Starting with the decision, for example 'which loans to send for manual review', shows you understand the business. A simple baseline shows discipline, and an honest comparison shows you can measure.\n\nMention one hard problem you solved, such as imbalanced classes, missing values or leakage, because it gives the interviewer something to ask about. If the project never reached production, say how it would be served and monitored. Numbers should be ones you can explain."
follow_ups:
  - "Why did you choose that metric?"
  - "What would you monitor in production?"
common_mistakes:
  - "Only listing algorithms tried"
  - "No baseline to compare against"
level: P1
topic: ml-basics
stop_id: ml-interviews
rubric:
  - point: "Starts with the problem and the decision it supports"
    keywords: ["problem", "decision", "business", "goal"]
  - point: "Describes data and cleaning"
    keywords: ["data", "clean", "missing", "features"]
  - point: "Has a baseline and compares models"
    keywords: ["baseline", "compared", "model"]
  - point: "Validates properly and picks a fitting metric"
    keywords: ["validation", "cross-validation", "metric", "leakage"]
  - point: "Explains the result and how it is used or deployed"
    keywords: ["result", "deployed", "used", "production"]
answer_seconds: 150
example: "For my final-year project I predicted which customers of a regional electricity distributor would pay late, using two years of anonymised billing data the utility shared with our college. The goal was to decide whom to remind early. The baseline was 'paid late last month', which caught about half the late payers. I cleaned meter gaps, built features like payment streaks and seasonal usage, and used time-based validation so the model never saw the future. Gradient boosting caught noticeably more late payers at the same number of reminders. We handed it over as a weekly batch score."
