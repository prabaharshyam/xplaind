answer_seconds: 150
example: "The first thing I would check is the grain of each table. Orders has one row per order, but payments can have several rows for one order. A join returns one row for every match, so an order paid in two parts appears twice and its amount is counted twice. To confirm, I would group payments by order_id and keep the keys with a count above one, and compare the row count before and after the join. To fix it, I aggregate payments to one row per order in a subquery, with SUM(paid) and GROUP BY order_id, and then join that to orders. I would not add DISTINCT after the join, because that hides the problem and can remove two real orders with the same amount. I would test an order of 100 paid as 60 and 40, and check the revenue is 100."
