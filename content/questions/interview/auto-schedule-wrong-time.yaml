id: auto-schedule-wrong-time
question: "A workflow that should send the daily sales report at 9 am India time ran at 2:30 pm, and one day it did not run at all. What do you check?"
kind: scenario
short_answer: "The 2:30 pm run points to a time zone problem: the schedule is read as 9 am UTC, which is 2:30 pm in India. I set the workflow or server time zone to Asia/Kolkata. For the missed run, I check if the tool or server was down, then add a missed-run alert and a safe way to run it again."
deeper_answer: "A schedule trigger runs on the clock of the tool, not on my clock. Many servers and some tools use UTC unless a time zone is set, and India is 5 hours 30 minutes ahead, so 9 am UTC becomes 2:30 pm IST. I check the time zone setting at workflow level and at instance level, and I write the time zone in the workflow notes.\n\nA schedule also runs only if the tool is running and the workflow is active at that minute. If the server restarted, or the workflow was switched off after an edit, the run is lost, and most tools do not run it later by themselves. So I add a check that alerts if no report went out by 9:15, and I make the report take a date as input so that someone can run it again for the missed day. Interviewers listen for UTC, missed runs and a rerun plan."
follow_ups:
  - "How would you write the schedule for 9 am on working days only?"
  - "What happens if two runs of the same scheduled workflow overlap?"
  - "How do you handle public holidays?"
common_mistakes:
  - "Changing the hour by hand instead of fixing the time zone"
  - "Assuming a missed run will happen later by itself"
  - "No alert when a scheduled run does not happen"
level: B3
topic: automation
stop_id: n8n-in-depth
rubric:
  - point: "Recognises the time zone problem: the schedule was read as UTC, not IST"
    keywords: ["utc", "time zone", "timezone", "ist"]
  - point: "Fixes the time zone setting instead of shifting the hour"
    keywords: ["asia/kolkata", "setting", "by hand"]
  - point: "For the missed run, checks if the tool was down or the workflow inactive"
    keywords: ["restart", "inactive", "execution list"]
  - point: "Adds an alert for a run that did not happen"
    keywords: ["alert", "no report", "missed"]
  - point: "Makes the job safe to run again for a given date"
    keywords: ["run it again", "rerun", "date as input"]
answer_seconds: 120
example: "The 2:30 pm run tells me the schedule was read in UTC. 9 am UTC is 2:30 pm IST. I would open the workflow settings and set the time zone to Asia/Kolkata, and check the instance setting too, and not just move the hour by hand. For the day it did not run, I would look at the execution list. In my experience the server had a restart at that time, or someone edited the workflow and left it inactive. A missed schedule does not run later by itself. So I would add a small second workflow that sends an alert on Slack if no report was sent by 9:15 am. I would also change the report to take a date as input, so anyone can run it again for the missed day."
