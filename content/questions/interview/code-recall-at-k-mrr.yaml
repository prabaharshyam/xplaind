answer_seconds: 150
example: "The input for each query is a ranked list of retrieved ids, and the set of ids that are relevant. For recall at k, I take the first k results, count how many are in the relevant set, and divide by the number of relevant ids for that query. Then I average over queries. For MRR, I go down each list, find the position of the first relevant result, counting from 1, and take 1 over that position. If nothing relevant is found, the reciprocal rank is 0, and it still counts in the average. I use a set for the lookup, so the cost is linear in the list lengths. They measure different things: recall at k tells me whether the needed chunk was retrieved at all, and MRR tells me how high the first good one is. I would test a query where the relevant document is at position 2, which gives 0.5."
