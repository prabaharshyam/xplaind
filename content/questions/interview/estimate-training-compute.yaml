id: estimate-training-compute
question: How would you estimate the compute and cost to train a language model from scratch?
kind: concept
short_answer: Training compute is roughly 6 times parameters times training tokens, in floating-point
  operations. Divide by a GPU's peak speed times a realistic utilisation of 30 to 50% to get GPU-seconds,
  then convert to GPU-hours and cost. Choose tokens with a scaling rule, such as about 20 per parameter
  for compute-optimal training, and check you actually have that much good data.
deeper_answer: 'For example, a 1-billion-parameter model on 20 billion tokens needs about 1.2 × 10^20
  operations, a few hundred hours on one high-end GPU at 40% utilisation. Data is often the real limit,
  especially for Indian languages, where good text may be a few billion tokens.


  Add costs for data cleaning, experiments, failed runs and evaluation, which can exceed the final run.
  Very often, continuing to train an existing open model is cheaper and better than training from scratch.'
follow_ups:
- What usually limits small teams more, compute or data?
- When is training from scratch worth it?
common_mistakes:
- Forgetting utilisation is well below peak
- Ignoring the cost of experiments and data work
