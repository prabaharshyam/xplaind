id: auto-extraction-accuracy-by-field
question: "How do you measure the accuracy of a document extraction step, and why is one overall percentage not enough?"
kind: concept
short_answer: "I measure on a labelled sample of our own documents, field by field. Accuracy per field matters, because a wrong amount costs more than a wrong address line. I also measure per document: the share with every required field correct, since that decides how many pass without a person. I split results by document type and scan quality."
deeper_answer: "One overall number hides the important things. If a document has 20 fields and each is 95% accurate, only about a third of documents have every field right, so most still need a person. And an average over clean PDFs says little about phone photos of handwritten bills.\n\nSo I build a test set of, say, 200 real documents with correct values entered by a careful person, covering the main suppliers, formats and bad scans. I report accuracy per field, the share of fully correct documents, and results per group. I also check if the confidence score is useful: when the tool says it is sure, is it right? That tells me where to set the review threshold. I repeat the test when the model or the document mix changes. Interviewers listen for field level against document level, own data, and the link to human review."
follow_ups:
  - "How would you choose which documents go into the test set?"
  - "How do you decide the confidence level below which a person reviews?"
  - "A new supplier format appears. How do you notice the drop in accuracy?"
common_mistakes:
  - "Trusting a number measured on someone else's documents"
  - "Reporting one average for all fields"
  - "Testing only on clean scans"
level: I2
topic: automation
stop_id: document-extraction-automation
rubric:
  - point: "Uses a labelled sample of the company's own documents"
    keywords: ["own documents", "sample", "correct values", "test set"]
  - point: "Reports accuracy field by field; some fields matter more"
    keywords: ["each field", "field by field", "total amount", "per field"]
  - point: "Reports the share of documents with every field correct"
    keywords: ["every field correct", "fully correct"]
  - point: "Splits results by document type or scan quality"
    keywords: ["scan quality", "phone photos", "supplier format"]
  - point: "Links the result to the confidence threshold for review"
    keywords: ["confidence", "threshold", "review"]
answer_seconds: 120
example: "I would not accept one overall percentage. I would take a sample of about 200 of our own documents, for example GST invoices from our top 30 suppliers, including phone photos, and have a careful person enter the correct values. Then I would measure accuracy for each field. For us the invoice number, GSTIN and total amount matter most. I would also measure how many documents have every field correct, because only those can pass without a person. With 20 fields at 95% each, only about a third of documents are fully correct. I would split the results by supplier format and by scan quality. Last, I would check the confidence score: if high confidence fields are almost always right, I can set a threshold and send only the rest for review."
