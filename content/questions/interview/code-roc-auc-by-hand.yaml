    keywords: ["pair", "p times n"]
  - point: "Gives the sort and rank version in n log n"
    keywords: ["sort", "rank", "n log n"]
  - point: "Counts tied scores as half a pair, or uses the average rank"
    keywords: ["ties", "tied", "a half"]
