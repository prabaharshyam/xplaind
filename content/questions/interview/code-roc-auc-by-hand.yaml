    keywords: ["both classes", "undefined", "0.75"]
answer_seconds: 180
example: "I think of AUC as a probability: the chance that a random positive gets a higher score than a random negative. So the simple version loops over every positive and negative pair, counts 1 when the positive is higher and a half for ties, and divides by the number of pairs. That is P times N work. The faster version sorts the scores once. I rank all the items from lowest to highest, give tied scores their average rank, add up the ranks of the positives, subtract P times P plus 1 over 2, and divide by P times N. That is n log n. I would first check that both classes are present, because otherwise AUC is undefined. On the example, three of the four pairs are ordered correctly, so I expect 0.75. I would also test a perfect ranking, which gives 1, and all equal scores, which gives 0.5."
