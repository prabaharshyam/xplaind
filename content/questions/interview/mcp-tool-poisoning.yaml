example: "For a hypothetical Pune developer tools company, engineers wanted to add community MCP servers to their coding agent. We set up an approved list with pinned versions, a script that alerts when a tool description changes, and a rule that the agent cannot send data to the internet or read files outside the project without a prompt to the user. One community server's description asked the agent to read environment variables, and it was rejected."
