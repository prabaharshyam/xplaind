example: "I would ask first how lists should be handled and whether keys can contain dots. I will assume lists stay as values. I write a recursive function flatten(obj, prefix) that returns a new dict. For each key and value, I build the path with path = f\"{prefix}.{key}\" if prefix else key. If the value is a non-empty dict I recurse with that path as the new prefix and merge the result. Otherwise I store the value under the path. Each key is visited once, so the time is linear in the number of keys, and the recursion depth equals the nesting depth. For a user with name Asha and an address with city Pune, I get user.name and user.address.city. I would test an empty dict as a value, which should be kept and not dropped."
