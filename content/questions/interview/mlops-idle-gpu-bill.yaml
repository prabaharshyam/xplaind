id: mlops-idle-gpu-bill
question: "Finance says the GPU bill has doubled, and you find that average GPU utilisation is under 30%. What do you do?"
kind: scenario
short_answer: "Find where the idle time is, per team and per workload. For serving, right-size replicas, autoscale on real load, and scale down at night. For training and notebooks, shut down idle instances automatically, run jobs through a shared queue, and use spot capacity with checkpoints. Then show cost and utilisation per team, so that owners can see their own waste."
deeper_answer: "Low utilisation with a high bill means paying for GPUs that wait. The causes differ by workload, so I would first tag usage and break it down. Common findings are notebooks left running over the weekend, a GPU reserved per person, serving replicas sized for a peak that lasts one hour, and small models that each hold a whole GPU.\n\nFor interactive work, set an idle timeout and move long jobs to a scheduler with a queue, so that a GPU is released when the job ends. For training, spot or preemptible instances cost less but can be taken away, so jobs must checkpoint and resume. For serving, scale on queue length or concurrency, keep a small warm minimum, and place several small models on one GPU if memory allows. Batching also raises throughput per GPU. Committed capacity makes sense only for the steady base load. A weekly cost report per team also changes behaviour. Interviewers listen for diagnosis before action, and for fixes matched to each workload type."
follow_ups:
  - "What makes a training job safe to run on spot instances?"
  - "Which metric would you autoscale a model server on?"
  - "How do you bring in idle shutdown without angering researchers?"
common_mistakes:
  - "Buying a discount plan before fixing the waste"
  - "Treating training, notebooks and serving as one problem"
  - "Looking only at average utilisation, with no breakdown by owner"
level: P1
topic: deployment
stop_id: gpus-quantization
rubric:
