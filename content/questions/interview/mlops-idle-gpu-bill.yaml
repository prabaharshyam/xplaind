    keywords: ["idle", "notebook", "timeout", "shut down", "shutdown"]
  - point: "Runs training through a queue or scheduler, on spot with checkpoints"
    keywords: ["queue", "scheduler", "spot", "checkpoint"]
  - point: "Right-sizes and autoscales serving, sharing GPUs where possible"
    keywords: ["autoscal", "right-size", "replica", "share", "scale down"]
  - point: "Makes cost visible to owners with regular reports"
    keywords: ["report", "visible", "owner", "dashboard", "weekly"]
answer_seconds: 130
example: "I would not cut anything before I know where the idle time is. So I would tag every GPU instance and break the bill down by team and by workload: notebooks, training and serving. In one case like this, I found that a third of the bill was notebook machines left on at night and over weekends. We added an idle timeout of one hour. Training jobs moved to a shared queue, so a GPU was released when the job ended, and long jobs ran on spot instances and saved a checkpoint every 30 minutes. Serving had eight replicas all day for a peak of two hours, so we turned on autoscaling with a minimum of two. Then I sent each team lead a weekly report of their own GPU hours and cost. That report changed habits faster than any tool."
