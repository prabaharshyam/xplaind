id: what-is-model-merging
question: What is model merging, and when would you use it?
kind: concept
short_answer: Model merging combines the weights of models fine-tuned from the same base into one model,
  by averaging, SLERP, or methods like TIES and DARE that drop small changes first. Use it to join skills
  trained separately without forgetting, to serve one model instead of several, or to fit on a device.
  Always test every task after merging.
deeper_answer: 'The change fine-tuning makes is a task vector: fine-tuned minus base weights. Adding task
  vectors combines skills; subtracting can remove a behaviour. Simple averaging works surprisingly well,
  but tasks can interfere; TIES keeps large changes and resolves sign conflicts, DARE drops changes randomly
  and rescales.


  Unlike an ensemble, which runs several models per request, a merge serves one model at normal cost.
  Merging needs no GPUs for simple methods. Precise tasks may degrade, so keep separate adapters as fallbacks
  and check safety behaviour too.'
follow_ups:
- How is merging different from an ensemble?
- What would you do if one task got worse after merging?
common_mistakes:
- Merging models from different base models
- Testing only one task after merging
