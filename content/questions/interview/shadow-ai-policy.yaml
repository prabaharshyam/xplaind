id: shadow-ai-policy
question: "Staff are pasting company data into public AI tools without approval. How would you handle shadow AI?"
kind: scenario
short_answer: "Banning everything usually drives it underground. I would find out what people use and why, offer an approved tool with proper data terms, write a short policy on what data may go where, add technical controls for the riskiest data, and train people with real examples. Then keep an AI inventory and review new tools through a quick, clear process."
deeper_answer: "Start with discovery: proxy and DNS logs, browser extension lists, expense claims and a no-blame survey. Classify the risk: customer personal data, source code, unreleased financials and credentials are the main concerns, along with DPDP Act duties for personal data.\n\nThen offer a safe path: an enterprise AI tool with data not used for training, sign-on, logging and retention settings. Write a one-page policy with clear examples of allowed and not allowed. Back it with controls: data loss prevention rules for identifiers and secrets, blocking unapproved tools that handle sensitive data, and an intake form so teams can request a new tool and get an answer in days, not months. Measure adoption of the approved tool and repeat discovery every quarter."
follow_ups:
  - "How would you discover which AI tools staff are already using?"
  - "What would your one-page AI policy say?"
common_mistakes:
  - "Banning all AI tools with no approved alternative"
  - "Writing a long policy that no one reads and nothing enforces"
level: P2
topic: security
stop_id: ai-security-program
rubric:
  - point: "Discovers actual use without blame"
    keywords: ["discover", "survey", "logs", "find out", "inventory"]
  - point: "Offers an approved alternative"
    keywords: ["approved tool", "enterprise", "alternative", "safe path"]
  - point: "Short policy on data classes"
    keywords: ["policy", "data class", "personal data", "source code", "allowed"]
  - point: "Technical controls such as DLP or blocking"
    keywords: ["dlp", "data loss prevention", "block", "control"]
  - point: "Ongoing review and a fast intake process"
    keywords: ["review", "intake", "request", "quarter", "measure"]
answer_seconds: 100
example: "At a hypothetical Hyderabad pharma company, proxy logs showed hundreds of staff using free chatbots, some pasting trial data. We rolled out an enterprise assistant with sign-on and no training on our data, published a one-page policy with ten examples, added DLP rules for patient identifiers, and set a five-day review for new tool requests. Unapproved use dropped steadily over the next quarter."
