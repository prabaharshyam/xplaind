id: sr-lead-gov-is-the-programme-working
question: "You have run the AI governance programme at a 5,000-person company for 18 months. The audit committee asks how you know it is working. Which measures do you show, and which do you avoid?"
kind: concept
short_answer: "I would show coverage, speed, outcomes and behaviour. Coverage: share of AI systems in the inventory with an owner and a risk rating. Speed: review time. Outcomes: incidents, repeat incidents and audit findings closed. Behaviour: uses found outside the process. I would avoid counting policies written or people trained as proof."
deeper_answer: "Activity numbers are easy to collect and say little. A line such as 5,000 people trained does not show that risk went down. Stronger measures show whether the programme sees the AI in the company, acts in time, and changes results. Coverage of the inventory matters most, because you cannot govern what you do not know about. Review time shows whether teams can work with you. Incident numbers need care: a rise in reported incidents in the first year can be a good sign that people now report.\n\nThe trade-off is between measures that look good and measures that are honest. Include one or two that may look bad, such as the number of AI uses found outside the process, and show the trend. Test results help too, for example the share of high-risk systems with a current bias test. Interviewers listen for outcome measures over activity counts, careful reading of incident data, and one independent check such as an internal audit sample."
follow_ups:
  - "Reported incidents doubled this year. Is that good or bad?"
  - "How do you estimate the AI use you cannot see?"
  - "Which single measure would you keep if you could keep only one?"
common_mistakes:
  - "Counting training sessions as proof"
  - "Reading fewer reported incidents as success without checking"
  - "No independent check of the numbers"
level: P2
topic: governance
stop_id: ai-compliance
rubric:
  - point: "Prefers outcome measures to activity counts"
    keywords: ["outcome", "activity", "not proof"]
  - point: "Shows inventory coverage with owners and risk ratings"
    keywords: ["inventory", "coverage", "risk rating"]
  - point: "Shows review time as a measure of working with teams"
    keywords: ["review time", "working days", "turnaround"]
  - point: "Reads incident numbers with care"
    keywords: ["incident", "repeat"]
  - point: "Includes uses found outside the process and an independent check"
    keywords: ["outside the process", "unapproved", "shadow", "internal audit", "sample"]
answer_seconds: 165
example: "I would show four groups of measures. First, coverage: 92% of the AI systems found in our yearly survey are in the inventory with an owner and a risk rating, up from 40%. Second, review time: 9 working days on average, down from 30. Third, outcomes: the number of incidents, and how many were repeat incidents with the same cause. Reports doubled this year, and I would explain that this is partly because staff now report. Fourth, what we found outside the process: 14 unapproved uses this year. I would avoid activity counts such as people trained, because they are not proof that risk went down. Last, I would ask internal audit to check a sample of 20 systems, so the numbers are not only mine."
