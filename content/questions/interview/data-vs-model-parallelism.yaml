id: data-vs-model-parallelism
question: What is the difference between data parallelism and model parallelism?
kind: concept
short_answer: 'Data parallelism runs full copies of the model on several GPUs, each handling different
  batches in training or different requests in serving. Model parallelism splits one model across GPUs
  because it is too big or too slow for one: tensor parallelism splits work inside each layer, pipeline
  parallelism splits groups of layers.'
deeper_answer: 'Data parallelism is simple and scales throughput, but each copy must fit. In training
  it also needs gradients and optimiser states, which is why sharded data parallelism (ZeRO, FSDP) spreads
  those across GPUs.


  Tensor parallelism needs fast links because GPUs exchange results every layer; pipeline parallelism
  tolerates slower links but adds per-request delay, using micro-batches to keep stages busy in training.
  Large training runs combine all of these, often with context or sequence parallelism for long inputs.'
follow_ups:
- What does ZeRO or FSDP shard?
- Which would you use to cut latency for one large model?
common_mistakes:
- Calling replicas model parallelism
- Ignoring communication cost
