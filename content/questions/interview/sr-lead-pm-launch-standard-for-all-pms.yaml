id: sr-lead-pm-launch-standard-for-all-pms
question: "You are head of product, and 12 product managers ship AI features with very different quality bars. Last month one feature launched with no eval set at all. What launch standard do you set for all of them?"
kind: use-case
short_answer: "A short standard by risk tier, not one bar for all. Every AI feature needs an owner, an eval set with a pass mark agreed before building, a fallback, monitoring and a rollback plan. Higher-risk features, such as money, health or hiring, also need a review by legal and security. I would publish examples and review exceptions myself."
deeper_answer: "The goal is a minimum that every team meets, without slowing low-risk work. One rule for all features fails both ways: too heavy for a text rewrite tool, too light for a feature that affects loans. So use two or three tiers, decided by what happens when the feature is wrong. Each tier has a short checklist. The base tier covers ownership, an eval set, a pass mark set in advance, user feedback, monitoring and rollback.\n\nA standard that people must follow needs three more things: it must be short, it must come with a worked example, and someone must check it. A one-page template and a 30-minute launch review work better than a long document. Allow exceptions, but in writing, with a named person who accepts the risk. Interviewers listen for a risk-based design, attention to how the 12 managers will really use it, and a way to learn from misses and update the standard."
follow_ups:
  - "A product manager says the standard will delay a launch by three weeks. How do you respond?"
  - "Who decides the tier when you and the team disagree?"
  - "How do you know after six months that the standard is working?"
common_mistakes:
  - "One heavy process for every feature"
  - "A standard with no one checking it"
  - "Setting the pass mark after seeing the results"
level: P2
topic: product
