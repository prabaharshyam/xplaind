answer_seconds: 165
example: "I would write a one-page standard with three tiers, based on what happens when the feature is wrong. For every tier: a named owner, an eval set with a pass mark agreed in advance, monitoring, and a rollback plan. For the top tier, such as features that touch money or hiring, legal and security must review before launch. I would give the 12 product managers a template and one worked example, and hold a 30-minute launch review each week. An exception is possible, but in writing, and I sign it. After the feature that launched with no eval set, I would also ask that team to present what they learned, so the standard is seen as help, not punishment."
