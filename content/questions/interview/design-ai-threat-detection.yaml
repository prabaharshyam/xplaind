answer_seconds: 160
example: "For a public assistant with 1 million conversations a day, I would start with a threat model: the assets are the system prompt, user data and tools, and the attack types are injection in one message and abuse over many requests. I would log each prompt, output and tool call with account signals such as age and device. Detection has two paths. Inline, a rule set and a small classifier check input and output for injection, inside about 30 milliseconds. Offline, a behaviour model looks at each account: request rate, similar prompts across accounts, and a cluster of new accounts acting together, which suggests scraping. Scores map to a tier of actions: rate limit, block the response, suspend, or send to an analyst. Labels come from red-team exercises and each real incident. I measure recall on a fresh red-team set and the false positive rate on normal users. The trade-off is strictness against blocking real users."
