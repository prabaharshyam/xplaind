example: "I would treat each of the 300 prompts as a versioned artefact, not a string in code. A registry stores the template, its variables, the model and settings it was tested with, an owner and the full history. Every prompt has a small test set. When someone edits a prompt, the change goes to review, and CI runs an evaluation that compares the new version with the current one. Versions are immutable, and labels such as staging and production point to them. Services fetch by label and keep a cached copy, so the registry is not a single point of failure. A rollout starts at 5 percent of traffic, and rollback is moving the label back. Every request writes the prompt version to its trace, so I can tie a quality drop to a change. The trade-off is speed for non-engineers against the safety of code review."
