id: design-prompt-management-system
question: "A company has 12 teams and about 300 prompts hard-coded in different services. A small edit last month broke a customer-facing feature. Design a system for versioning, testing and rolling out prompts."
kind: use-case
short_answer: "Treat prompts as versioned artefacts. Store each as a template with variables, model and settings, owner and history. Every change gets review and an automatic evaluation run against that prompt's test set. Roll out by environment and then to a share of traffic, log the prompt version on every request, and make rollback one step."
deeper_answer: "Clarify who edits prompts (engineers only, or product and domain experts too), how fast changes must ship, and what audit rules apply.\n\nDesign: a registry where each prompt has an ID, immutable versions, variables with types, the model and parameters it was tested with, an owner, and a linked test set. A prompt and its model belong together, because the same text behaves differently on another model. A change opens a review, and CI runs the evaluation and compares with the current version. Labels such as staging and production point to versions. Services fetch by label with a local cache and a pinned fallback, so a registry outage does not stop the product. Rollout goes to a small share of traffic first, with online metrics, and rollback means moving the label back.\n\nTrade-offs: prompts in code get the same review and deploy as code, which is safe but slow for non-engineers. A registry allows fast changes without a deploy, but needs its own gates or it becomes a way to skip review. Log the prompt version in every trace, so a quality drop can be tied to a change."
follow_ups:
  - "Should prompts live in the code repository or in a separate registry?"
  - "What happens to your prompts when the model provider retires a model?"
  - "How would you let a non-engineer edit a prompt safely?"
common_mistakes:
  - "Editing production prompts with no review or test"
  - "Versioning the prompt text but not the model and settings"
  - "No record of which prompt version produced an answer"
