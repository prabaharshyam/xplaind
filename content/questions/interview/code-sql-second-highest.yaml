id: code-sql-second-highest
question: "From an employees table with name, department and salary, return the second highest salary in each department. For example, if engineering has salaries 100, 100, 90 and 80, the answer for engineering is 90."
kind: use-case
short_answer: "Rank salaries inside each department with DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC) in a CTE, then filter WHERE rnk = 2. DENSE_RANK gives tied salaries the same rank with no gaps, so two people on the top salary do not hide the second value. The cost is a sort per department, O(n log n)."
deeper_answer: "First clarify the question. Ask whether second highest means the second distinct salary or the second person. Ask what to return for a department with only one distinct salary: no row, or a row with NULL. Ask whether salary can be NULL.\n\nWrite a CTE: WITH ranked AS (SELECT department, name, salary, DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS rnk FROM employees), and then SELECT department, name, salary FROM ranked WHERE rnk = 2. The filter must sit outside the CTE because a window function cannot be used in WHERE at the same level. Explain the three ranking functions on 100, 100, 90: ROW_NUMBER gives 1, 2, 3, so rank 2 is 100 again; RANK gives 1, 1, 3, so there is no rank 2; DENSE_RANK gives 1, 1, 2, which is what we need.\n\nA department with one distinct salary returns no row. To show it with NULL, left join the list of departments to the result. Test ties at the top, ties at second place, which return several rows, and a one-person department."
follow_ups:
  - "What is the difference between ROW_NUMBER, RANK and DENSE_RANK?"
  - "How would you solve it without a window function?"
  - "How would you return NULL for a department that has no second salary?"
common_mistakes:
  - "Using ROW_NUMBER, which returns the top salary again when two people share it"
  - "Filtering on the window function in WHERE at the same level"
  - "Using LIMIT 1 OFFSET 1, which works for one group only"
