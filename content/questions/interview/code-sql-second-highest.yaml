answer_seconds: 150
example: "I would ask first whether second highest means the second distinct salary, and what to do when two people share the top salary. I will assume distinct values. I rank the salaries inside each department in a CTE, using DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC), and then in the outer query I filter WHERE rnk = 2. I choose DENSE_RANK because ties get the same rank and there are no gaps. With ROW_NUMBER, two people on 100 would be ranked 1 and 2, and I would wrongly return 100. The cost is a sort inside each department. For salaries 100, 100, 90 and 80, I get 90. I would test a department with only one person, which returns no row, and I would ask if you want a NULL row there instead."
