id: agent-x-subagent-brief
question: "When a main agent hands a task to a sub-agent, what should go into the hand-off, and what should come back?"
kind: concept
short_answer: "The sub-agent starts with an empty context, so the brief must stand alone: the goal and why it matters, what done looks like, constraints, what is already known, and the output format. It should return a short, structured result with evidence and open doubts, not its whole transcript. The main agent then checks the result before it relies on it."
deeper_answer: "People use sub-agents for two reasons: to keep the main agent's context clean, and to run work in parallel. Both depend on the hand-off. The sub-agent has not seen the conversation, so a brief such as 'look into the login bug' loses everything the main agent already learned. A good brief reads like a note to a contractor. It gives the purpose, the scope, the facts already found, what not to touch, and the shape of the answer.\n\nThe return path matters as much. If the sub-agent sends back 20,000 tokens of raw search results, the benefit to the main context is gone. Ask for a summary with the key findings, references such as file paths, and a clear statement of what was not checked. Limit the sub-agent's tools to what the task needs. The main agent should treat the result as a report from a colleague and verify the important claims. Interviewers listen for context isolation and its cost: more tokens overall, and information lost at each hand-off."
follow_ups:
  - "When is a sub-agent not worth it?"
  - "How would you limit what a sub-agent is allowed to do?"
  - "What happens when a sub-agent returns a confident but wrong result?"
common_mistakes:
  - "Writing a one-line brief that assumes shared context"
  - "Returning the sub-agent's full transcript to the main agent"
  - "Trusting the sub-agent's result without any check"
level: P1
