answer_seconds: 110
example: "A sub-agent has not seen the conversation. It starts with an empty context, so I write the brief as if for a new contractor. Take a coding agent that needs to know where login errors are logged. The brief gives the goal, which is to find every place that writes a login error. It says what is already known, for example that the auth service is in services/auth. It gives the constraint that this is read-only work, and it says what done means. It also sets the output format: a short list of file paths with one line each, plus anything that was not checked. I give that sub-agent only search and read tools. When the result comes back, the main agent opens two of the files to verify before it changes any code."
