id: when-human-in-the-loop
question: "When should a product keep a human in the loop?"
kind: use-case
short_answer: "When mistakes are costly, hard to undo, or affect people's rights, money, health or safety; when the model's accuracy is not yet proven; and when regulation or accountability requires a named person to decide. Design the review so it is real, not rubber-stamping: show the evidence, keep the queue manageable and track how often reviewers change outputs."
deeper_answer: "Human review costs time, so use it where it buys the most: high-risk items, low-confidence outputs and a random sample of the rest for quality monitoring. As measured accuracy improves, you can move from approving everything to reviewing exceptions.\n\nWatch for automation bias, where reviewers approve whatever the AI says. Rotating samples of known-wrong outputs into the queue is one way to check reviewers are paying attention."
follow_ups:
  - "How would you know reviewers are actually reviewing?"
  - "When would you reduce human review?"
common_mistakes:
  - "Review that is a rubber stamp"
  - "Reviewing everything forever"
level: I2
topic: product
stop_id: hitl-product-design
rubric:
  - point: "Costly or irreversible decisions"
    keywords: ["costly", "irreversible", "undo", "high-stakes", "high stakes"]
  - point: "Rights, money, health or safety"
    keywords: ["money", "health", "safety", "rights", "legal"]
  - point: "Unproven accuracy or regulation"
    keywords: ["accuracy", "proven", "regulat", "accountab"]
  - point: "Meaningful review, avoiding rubber-stamping"
    keywords: ["rubber", "automation bias", "evidence", "meaningful"]
  - point: "Targets low-confidence items and samples"
    keywords: ["low confidence", "sample", "exception"]
answer_seconds: 90
example: "In an AI tool suggesting insurance claim approvals, small, clear claims under ₹10,000 that matched policy rules were approved automatically. Larger or unusual claims went to an officer, who saw the documents and the AI's reasoning side by side. We tracked how often officers changed the AI's recommendation; when it stayed low for months, we raised the automatic limit slowly."
