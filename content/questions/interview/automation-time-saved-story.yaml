id: automation-time-saved-story
question: "Tell me about an automation you built and how much time it saved."
kind: real-life
short_answer: "Pick one real automation. Describe the manual process before, with a measured number such as minutes per item and items per week; what you built and with which tool; how you handled errors; and the result after a few weeks, measured the same way. Mention who uses it now and one thing you would improve."
deeper_answer: "Interviewers want evidence that you understand the business, not only the tool. Start with the problem as the user felt it, and give a baseline you actually measured or carefully estimated. Explain the design briefly, including what happens when something fails, because that shows real-world experience.\n\nThe result should be honest and specific: time saved, errors reduced, faster response. If it is a personal or volunteer project, that is fine. Being clear about your assumptions, such as how you estimated the time before, makes your number believable."
follow_ups:
  - "How did you measure the time before?"
  - "What happened when it failed?"
common_mistakes:
  - "Big savings figures with no baseline"
  - "Only describing the tool's features"
level: B3
topic: automation
stop_id: measuring-roi
rubric:
  - point: "Describes the manual process with a baseline"
    keywords: ["before", "manual", "baseline", "minutes"]
  - point: "Explains what was built and the tool used"
    keywords: ["built", "n8n", "zapier", "tool", "workflow"]
  - point: "Covers error handling"
    keywords: ["error", "fail", "retry", "alert"]
  - point: "Gives a measured result"
    keywords: ["saved", "result", "after", "hours"]
  - point: "Mentions users or a next improvement"
    keywords: ["users", "team", "improve", "next"]
answer_seconds: 120
example: "A coaching centre's office copied every new enquiry from their website form, WhatsApp and phone notes into a spreadsheet, then sent a brochure by hand. I timed it with the staff: about six minutes per enquiry, around 300 enquiries a month, so roughly 30 hours a month. I built an n8n workflow that collects form and WhatsApp Business enquiries into the sheet and sends the brochure automatically, with failures posted to a staff group. After a month it was about eight hours of checking and follow-up calls, and replies went out within minutes instead of the next day."
drafted_with_ai: true
