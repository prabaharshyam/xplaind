answer_seconds: 150
example: "I would first ask whether you want values or indexes, and whether repeated numbers should give the same pair twice. I will assume unique pairs of values. I keep a set called seen and go through the list once. For each x, the complement is target - x. If the complement is in seen, I add the pair to a result set as (min, max) so each pair is stored once. Then I add x to seen. A set lookup is constant time, so this is O(n) time and O(n) memory, and it avoids the nested loops that cost n squared. For 2, 7, 4, 5, 7, 2 with target 9, I get 2 and 7, and 4 and 5. I would test a single 5 with target 10, which must return nothing because one element cannot pair with itself."
