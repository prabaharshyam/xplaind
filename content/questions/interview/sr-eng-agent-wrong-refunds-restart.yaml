answer_seconds: 165
example: "Before it runs again I need two answers: why it approved those refunds, and why nobody was told for eight hours. I would read the traces for the 340 cases to find the root cause, maybe a policy update that changed the tool output, and add all of them to the eval set. Then I add limits in code that do not depend on the model: a cap of ₹2,000 per refund, a budget of ₹50,000 per hour, and an automatic stop with an alert to on-call if the approval rate doubles. The restart is in stages. Week one, every refund needs human approval. Then only small refunds under ₹500 are automatic. I would agree the criteria for each stage with finance, for example fewer than 1% wrong approvals in a 200-case sample."
