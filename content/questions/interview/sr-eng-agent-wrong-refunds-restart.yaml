id: sr-eng-agent-wrong-refunds-restart
question: "Overnight your refund agent approved 340 refunds that it should have rejected, worth about ₹6 lakh, before someone noticed in the morning. After it is switched off, how do you decide when and how it may run again?"
kind: scenario
short_answer: "It returns only when we can explain the failure and a repeat would be caught in minutes, not hours. I would find the cause from traces, add the failed cases to the eval set, and add limits in code: caps per refund and per hour, anomaly alerts and an automatic stop. Then restart in stages, with human approval first."
deeper_answer: "Two things failed: the agent made wrong decisions, and nothing stopped it for a whole night. The second is the more serious design gap. An agent that moves money needs limits that do not depend on the model behaving well: a maximum amount per action, a rate and total budget per hour, and a circuit breaker that halts it and pages a person when approvals rise far above the normal rate.\n\nFor the restart, use stages with exit criteria agreed with the business owner. First, replay the 340 cases and confirm the fixed agent rejects them. Second, run with human approval for every refund for a week. Third, auto-approve only small refunds, such as under ₹500, and widen as the error rate stays low. Also handle the past: finance decides on recovery, and affected customers are treated fairly. Interviewers listen for hard limits in code, staged autonomy, measurable exit criteria, and shared ownership of the decision."
follow_ups:
  - "Which limit would have stopped this incident earliest?"
  - "What exit criteria would you set for each restart stage?"
  - "Should the company ask customers to return the ₹6 lakh? Who decides?"
common_mistakes:
  - "Fixing the prompt and switching the agent back on"
  - "Relying on the model to respect limits written in the prompt"
  - "No alert when approval rates change sharply"
level: P2
