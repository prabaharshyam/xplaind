  - point: "Quick rollback"
    keywords: ["rollback", "roll back", "switch back", "revert"]
answer_seconds: 90
example: "We pinned the exact dated model version in config, kept prompts in the repo with a version number, and logged both on every request. When we tried a new model behind a flag for 5% of traffic, complaints about formatting rose, visible within a day in our dashboard split by version. We switched the flag off in a minute, fixed the prompt for the new model, and re-ran the canary."
