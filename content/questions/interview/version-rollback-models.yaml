id: version-rollback-models
question: "How do you version prompts and models so you can roll back safely?"
kind: scenario
short_answer: "Treat prompts, model names and parameters as versioned configuration in the repository or a prompt registry, with each production request logging which versions it used. Pin exact model versions rather than aliases that change underneath you. Release changes behind a flag or as a canary, compare metrics with the previous version, and keep the old version ready to switch back."
deeper_answer: "Providers update and retire models, so an alias such as 'latest' can change behaviour without any change on your side. Pinning plus a scheduled upgrade, run through your evals, keeps changes deliberate.\n\nRegistries such as MLflow's prompt registry or a simple versioned file work; what matters is that any answer in production can be traced to the exact prompt and model that produced it."
follow_ups:
  - "Why pin model versions?"
  - "What would you log to trace an answer back to its prompt?"
common_mistakes:
  - "Editing prompts directly in production"
  - "Using moving model aliases"
level: P1
topic: deployment
stop_id: versioning-prompts-models
