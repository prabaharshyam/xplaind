id: code-knn-classifier
question: "Implement a k-nearest-neighbours classifier in NumPy: given labelled training points and a query point, predict the class of the query. For example, with class 0 points near (0, 0), class 1 points near (5, 5) and k = 3, the query (0.5, 0.5) should be class 0."
kind: use-case
short_answer: "There is no training step: store the data. To predict, compute the distance from the query to every training point, take the k smallest with np.argpartition, and return the most common label among them. Each query costs O(n d). Scale the features first, because distance is sensitive to units."
deeper_answer: "Clarify first: training X is n by d, queries are m by d, labels have length n, and k is at most n. Ask which distance to use, and how to break ties in the vote.\n\nFor one query q, d2 = ((X - q) ** 2).sum(axis=1) gives all squared distances. The square root is not needed, because it does not change the order. Then nearest = np.argpartition(d2, k - 1)[:k] finds the k closest in linear time without a full sort, and the prediction is the most common label among y[nearest]. For many queries, broadcast to an m by n distance matrix, and process the queries in batches if that matrix does not fit in memory.\n\nTest a query equal to a training point, test k = 1, and compare the neighbours with a plain loop. Interviewers watch for unscaled features, where a column in rupees hides a column in years, and for an even k with two classes, which allows tied votes."
follow_ups:
  - "How do you choose k?"
  - "How would you make prediction faster with millions of training points?"
  - "How does this change for regression?"
common_mistakes:
  - "Not scaling the features before measuring distance"
  - "Sorting every distance when only k are needed"
  - "Ignoring tied votes"
level: I2
