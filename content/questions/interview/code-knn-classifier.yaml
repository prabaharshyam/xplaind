example: "KNN has no real training: I just store the points and their labels. To predict, I compute the squared distance from the query to every training point by subtracting, squaring and summing along the feature axis. I skip the square root because it does not change the order. Then I take the k smallest distances with argpartition, which is linear and avoids a full sort, look up their labels, and return the majority vote. The cost is n times d per query, so all the work happens at prediction time. I would scale the features first, because a feature with large units would dominate the distance. For ties I would use an odd k with two classes, or weight votes by closeness. I would test that a query equal to a training point returns the label of that point when k is 1."
