id: measure-automation-roi
question: "How do you measure the return on an automation project?"
kind: use-case
short_answer: "Measure the baseline before you build: runs per month, minutes per run, error rate and cost of errors. After launch, measure the same things plus the cost to build and run the automation (tools, model calls, maintenance). Hours saved times loaded hourly cost, plus errors avoided, minus running cost, gives the monthly return; payback is build cost divided by that."
deeper_answer: "Example: 1,200 invoices a month at 6 minutes each is 120 hours. If automation handles 80% and a person spends one minute checking each automated invoice, the work drops to 40 hours (24 hours for the remaining 240 invoices plus 16 hours of checks), so you save 80 hours a month. At ₹500 an hour that is ₹40,000 a month before tool and maintenance costs.\n\nAlso report benefits that are real but harder to price, such as faster response times, and be honest about time saved that is not redeployed to useful work."
follow_ups:
  - "How would you measure minutes per run before automating?"
  - "What costs do people forget?"
common_mistakes:
  - "No baseline"
  - "Ignoring maintenance and model costs"
level: I1
topic: automation
stop_id: measuring-roi
rubric:
  - point: "Measures a baseline before building"
    keywords: ["baseline", "before"]
  - point: "Volume times time per run"
    keywords: ["per month", "volume", "minutes", "hours"]
  - point: "Counts errors avoided"
    keywords: ["error", "mistake"]
  - point: "Subtracts build and running cost"
    keywords: ["build cost", "running cost", "tool", "maintenance", "subscription"]
  - point: "Computes payback or monthly return"
    keywords: ["payback", "return", "roi", "saving"]
answer_seconds: 90
example: "For a lead-entry automation, the baseline was 600 leads a month at 4 minutes each, about 40 hours, plus a few lost leads from typos. At a loaded cost of ₹400 an hour that is ₹16,000 a month. The automation cost ₹2,500 a month in tools and model calls and ₹60,000 to build. So it saves about ₹13,500 a month and pays back in under five months, before counting the leads no longer lost."
