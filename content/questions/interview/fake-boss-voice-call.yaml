id: fake-boss-voice-call
question: "A caller who sounds exactly like your boss asks you to make an urgent payment today. What do you do?"
kind: scenario
short_answer: "I would not pay on the strength of a voice, because voices can be cloned with AI. I would end the call politely and call my boss back on the number I already have, or check on our office chat. I follow the payment approval process every time, and report a fake call to IT or security."
deeper_answer: "Voice cloning tools can copy a person's voice from short recordings, and scammers combine this with urgency and secrecy to stop people from thinking. The defence is a process, not a sharp ear: verify through a second channel you trust, and never skip payment approvals because a request is urgent.\n\nReporting matters even if you did not pay, because the same scammer is probably trying colleagues too. In India, cyber fraud can also be reported on the 1930 helpline or the national cybercrime portal."
follow_ups:
  - "What if the caller says your boss is in a meeting and cannot be disturbed?"
  - "What rules would you suggest for your finance team?"
common_mistakes:
  - "Trusting the voice because it sounds right"
  - "Calling back on the number the caller gives you"
level: B1
topic: governance
stop_id: deepfakes-misinformation
rubric:
  - point: "Does not act on the voice alone; knows voices can be cloned"
    keywords: ["clone", "fake", "deepfake", "not trust"]
  - point: "Verifies through a separate, known channel"
    keywords: ["call back", "known number", "another channel", "verify"]
  - point: "Follows the normal payment approval process"
    keywords: ["process", "approval", "policy"]
  - point: "Reports the attempt"
    keywords: ["report", "security", "it team", "1930"]
answer_seconds: 90
example: "A friend in accounts at a small firm got exactly this call: her director's voice, asking for ₹2 lakh to a new vendor before noon. Our office had a rule that payments need a written approval in the finance system, so she said she would process it once the request came through there, hung up, and called the director's saved number. He was at home and knew nothing about it. She reported it to IT, and we added a line to our induction about voice scams."
