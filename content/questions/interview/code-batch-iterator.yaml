answer_seconds: 120
example: "I would ask whether the texts are a list in memory or a stream, and whether the limit is only on count. Assuming a list, I step through it with for i in range(0, len(items), size) and yield the slice items[i:i + size]. A slice past the end just returns what is left, so the last batch is shorter and needs no special case. I write it as a generator so only one batch is in memory at a time. It is O(n) time overall. For 250 texts and size 100, I get batches of 100, 100 and 50. On Python 3.12 I could use itertools.batched instead. I would test an empty list, which gives no batches, and an exact multiple like 200, which must not give an empty third batch."
