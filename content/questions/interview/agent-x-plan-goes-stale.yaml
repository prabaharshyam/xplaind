id: agent-x-plan-goes-stale
question: "Your travel agent plans flight, hotel and cab up front, and when the planned flight is sold out it still books the hotel for the old dates. How should the loop be designed?"
kind: scenario
short_answer: "A plan is a guess that must be checked after every step. The loop should look at each tool result, compare it with what the plan assumed, and replan when a step fails or an assumption breaks. Steps that depend on each other should be confirmed in order, and irreversible bookings should wait until the earlier ones are secure."
deeper_answer: "Planning up front is cheap and keeps the agent focused, but the world does not follow the plan. The failure here is that the agent executed step two without reading what step one returned. A good loop has an observe stage: after every action, did it succeed, and are the plan's assumptions still true? If not, the agent revises the remaining steps. It does not just continue.\n\nThe plan should also carry dependencies. The hotel dates depend on the flight, so the hotel step cannot run until the flight is confirmed. Where the tools allow it, hold or reserve first and pay last, so a late failure can be undone. Replanning needs limits too: a maximum number of attempts, and a rule to go back to the user when a hard constraint such as the travel date or the budget must change. Interviewers listen for observe and replan, for dependencies between steps, and for knowing when to ask the user."
follow_ups:
  - "When is a fixed up-front plan better than replanning at every step?"
  - "How do you stop the agent from replanning forever?"
  - "What would you do if the hotel had already been paid for?"
common_mistakes:
  - "Treating the first plan as final"
  - "Not reading the tool result before moving to the next step"
  - "Letting the agent change the user's dates or budget without asking"
level: P1
topic: agents
stop_id: planning-reflection
rubric:
  - point: "Treats the plan as a guess to check after each step, not a script"
    keywords: ["guess", "not a script", "not final", "check after", "assum"]
  - point: "Loop observes each tool result and replans on failure"
    keywords: ["replan", "observe", "tool result", "revise"]
  - point: "Models dependencies so later steps wait for earlier ones to be confirmed"
    keywords: ["depend", "confirmed", "wait", "order"]
  - point: "Does reversible holds first and irreversible payment last"
    keywords: ["hold", "reserve", "irreversible", "pay last", "cancel"]
  - point: "Limits replanning and asks the user when a hard constraint must change"
    keywords: ["ask the user", "limit", "attempts", "constraint"]
answer_seconds: 120
example: "The problem is that the agent followed its plan like a script. A plan is only a guess. After every action the loop must observe the tool result and check the plan's assumptions. Here the flight search said sold out, so the agent should replan before doing anything else. I would also record that the hotel dates depend on the flight. The hotel step has to wait until the flight is confirmed. Where the tools allow, I would hold the flight and the room first and pay last, because payment is irreversible and a hold is easy to cancel. I would limit it to three attempts at a new plan. If the only flights are a day later, that changes a constraint the user gave, so the agent should ask the user and not decide alone."
