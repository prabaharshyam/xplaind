id: metadata-filtering
question: "How do metadata filters improve retrieval?"
short_answer: "Store fields such as source, date, product, region, language and access level with each chunk. At query time, filter on them before or alongside the similarity search, for example only 2025 policies for Karnataka, so results are relevant, current and permitted. Get metadata from the document structure or extract it with a model, and keep it consistent."
deeper_answer: "Pure similarity search cannot tell an old policy from a new one if the wording is similar. Filters fix that cheaply. A model can turn a user's question into filters, such as 'last quarter' into a date range, a pattern often called self-querying.\n\nWatch for over-filtering that removes the right answer, and for missing metadata on some documents, which silently excludes them."
follow_ups:
  - "How would you turn 'last quarter's reports' into a filter?"
  - "What happens to chunks with missing metadata?"
common_mistakes:
  - "Relying on similarity alone for dates and versions"
  - "Inconsistent metadata values"
