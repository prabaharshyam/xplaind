id: sr-lead-sec-agent-leaked-12000-records
question: "At 2 am you are told that an AI support agent with CRM access was manipulated by a prompt injection and sent records of about 12,000 customers to an outside email address. You are the incident lead. What do you decide in the first 6 hours?"
kind: scenario
short_answer: "Contain first: disable the agent's email and CRM tools, revoke its credentials, and keep the logs. Decide to keep the agent off until the path is closed, even if support slows. Give clear roles, set update times, and bring in legal and privacy early to decide on notifying regulators and customers. Confirm the scope from logs before making public statements."
deeper_answer: "The lead's job is decisions and coordination, not doing the analysis personally. The first decision is containment against service: removing the agent's tools stops further loss, but support quality drops. With 12,000 records already sent, containment wins. Remove only what is needed, since switching off whole systems can also destroy evidence. Preserve logs, prompts and tool calls before anything is restarted.\n\nThen organise people: one technical lead, one person for communication, one for legal and privacy, and fixed update times, for example every hour. Scope matters for every later step: which records, which fields, one attacker or several, and are other agents built the same way? Notification duties under laws such as India's DPDP Act are for legal to confirm, but the lead should start that work in the first hours, not on day three. Interviewers listen for calm priorities, clear ownership, decisions made with partial facts, and a check for the same weakness elsewhere."
follow_ups:
  - "The business head wants the agent back online by 9 am. What do you need to see first?"
  - "How do you find out whether other agents have the same weakness?"
  - "What do you tell the executive team at 8 am when the scope is still unclear?"
common_mistakes:
  - "Doing the log analysis yourself in place of leading"
  - "Restarting systems before preserving evidence"
  - "Bringing in legal only after the technical work is finished"
level: P3
topic: security
stop_id: ai-incident-response
rubric:
  - point: "Contains first: disables tools and revokes credentials"
    keywords: ["contain", "disable", "revoke", "cut off"]
  - point: "Preserves evidence before restarting anything"
    keywords: ["preserve", "evidence", "logs"]
  - point: "Assigns roles and fixed update times"
    keywords: ["roles", "update every hour", "technical lead", "communication"]
  - point: "Confirms scope and checks other agents for the same weakness"
    keywords: ["scope", "other agents", "which fields", "which records"]
  - point: "Involves legal and privacy early on notification"
    keywords: ["legal", "privacy", "notif", "regulator"]
answer_seconds: 180
example: "My first decision is to contain. I would have the team disable the agent's email tool and CRM access and revoke its credentials, and accept that support will be slower for a day. Before anyone restarts anything, we preserve the logs, prompts and tool calls as evidence. Then I set roles: one technical lead, one person for communication, and one contact in legal and privacy, with an update every hour. The key question is scope: which 12,000 records, which fields, and whether other agents with the same design can be attacked the same way. I would ask legal to start work on notification to the regulator and to customers in these first hours. I would not let the agent return until the tool path is fixed and tested."
