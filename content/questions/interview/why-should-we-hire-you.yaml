id: why-should-we-hire-you
question: "Why should we hire you?"
kind: real-life
short_answer: "Match yourself to the job in three points: the skill they need most, proof that you have it, and one extra thing you bring that others may not. Use facts and results, not adjectives. Do not compare yourself with candidates you have not met. Finish in about a minute."
deeper_answer: "This is an invitation to summarise your case. The interviewer wants to hear that you understand their main need and can show evidence against it. Confidence is fine. Empty claims like \"I am hardworking and passionate\" are not evidence.\n\nBefore the interview, find the top three needs in the job description. For each, prepare one proof. Then add what is different about you, such as domain knowledge from an earlier field. A sample line: \"You need someone who can build and evaluate RAG systems. I have built one used by 40 people, and I bring three years of working with business data, so I know which wrong answers actually hurt.\" End by saying you want the job."
follow_ups:
  - "What would you do in your first 30 days here?"
  - "What is one area where you would need support?"
  - "Why you and not someone with more AI experience?"
common_mistakes:
  - "Listing adjectives with no proof"
  - "Repeating the resume instead of matching the job"
  - "Sounding either arrogant or apologetic"
level: I2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
asked_often: true
rubric:
  - point: "Names the main need of the role"
    keywords: ["you need", "job description", "looking for", "asks for", "the role needs"]
  - point: "Gives proof of the matching skill with a concrete result"
    keywords: ["built", "result", "percent", "per cent", "users", "reduced"]
  - point: "Adds something different they bring, such as domain knowledge"
    keywords: ["also bring", "what i add", "domain", "background", "in addition", "business"]
  - point: "States clear interest in the job"
    keywords: ["i want", "want this", "keen", "ready", "full time"]
answer_seconds: 90
example: "Your job description asks for someone who can build GenAI features and prove they work. I can do both. For three years I have been a data analyst at a logistics company in Gurugram, so I am strong in SQL, Python and messy business data. Last year I built an assistant that answers delivery questions from our internal documents. Forty operations staff use it, and I track its accuracy every week on 120 test questions. It is at 87 percent now, up from 64. What I add beyond a pure engineer is that I know what business users ask and which errors cost money. I want to do this work full time, and this role lets me."
