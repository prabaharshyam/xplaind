id: evaluate-rag
question: "How do you evaluate a RAG system?"
short_answer: "Evaluate retrieval and generation separately. For retrieval, check whether the needed chunk appears in the top results (recall at k) and how much retrieved text is relevant. For generation, check whether the answer is correct, uses only the retrieved context (faithfulness) and cites the right source. Then test end to end on real questions."
deeper_answer: "Build questions with the source passage that answers them. Retrieval metrics tell you whether the right text reached the model; generation metrics tell you whether the model used it well. Frameworks such as Ragas name these metrics: context precision, context recall, faithfulness and answer relevancy.\n\nInclude questions whose answers are not in the documents, to check the system says it does not know. Track metrics by document type and question type, because averages hide problems."
follow_ups:
  - "What is faithfulness, and how would you measure it?"
  - "Why include questions that have no answer in the documents?"
common_mistakes:
  - "Measuring only final answer quality, so you cannot tell where failures come from"
  - "Leaving out unanswerable questions"
level: I2
topic: evals
stop_id: check-retrieval
rubric:
  - point: "Evaluates retrieval and generation separately"
    keywords: ["separately", "retrieval", "generation"]
  - point: "Retrieval: recall at k"
    keywords: ["recall", "top", "precision"]
  - point: "Generation: correctness and faithfulness to context"
    keywords: ["faithful", "grounded", "correct"]
  - point: "Checks citations and tests end to end"
    keywords: ["citation", "source", "end to end", "end-to-end"]
answer_seconds: 90
example: "For an HR policy assistant, I would have 60 questions with the passage that answers each. Retrieval: is that passage in the top five? Generation: is the answer correct, does every claim come from the retrieved text, and does it cite the right policy? Running both separately tells me whether to fix search or the prompt."
