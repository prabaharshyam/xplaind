id: auto-no-time-saved-check
question: "Three months after launch, the workflow runs well, but the team lead says it has not saved any time. How do you find out if that is true?"
kind: scenario
short_answer: "I compare with the baseline from before launch, for the whole task and not only the automated step. I measure time people now spend on exceptions, checking the output and fixing errors, and how many cases still go the manual way. If saved hours were absorbed by other work, I show where they went. Then I fix the biggest cost."
deeper_answer: "An automation can run without errors and still save little. The common reasons: only 60% of cases go through it and the rest are still manual; people do not trust the output and check every item; exceptions take longer than before because nobody remembers the manual way; or the saved minutes are real but spread thinly and filled by other tasks, so nobody feels them.\n\nSo I measure the end-to-end time per case now, by observing and by timestamps, and compare with the baseline. If there is no baseline, I time the manual path on a sample. I report three numbers: the share of cases handled fully automatically, people minutes per case before and after, and hours spent on maintenance. Example: if staff check every extracted invoice, checking a 10% sample after a month of measured accuracy gives back most of the time. Interviewers listen for end-to-end measurement and honesty when the saving is small."
follow_ups:
  - "There is no baseline from before launch. What do you do?"
  - "How do you count time saved that was filled with other work?"
  - "When would you recommend switching the automation off?"
common_mistakes:
  - "Multiplying runs by an assumed number of minutes saved per run"
  - "Measuring only the automated step"
  - "Ignoring time spent on checking and on exceptions"
level: I2
