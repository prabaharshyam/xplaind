answer_seconds: 120
example: "I would not argue. I would measure. Before launch we had a baseline: 9 minutes per expense claim from start to finish. I would sit with the team for two days and time the whole task per case now, end to end. In a similar case in Mumbai I found three things. Only 65% of claims went through the workflow, and the rest still went the manual way because their receipts were photos. The staff did a full check of every automated claim, which took 4 minutes. And exceptions took longer than before. So the real saving was about 2 minutes per claim, not 8. I gave an honest report with these numbers to the team lead. The fix was to check only a 10% sample, and to add photo receipts to the workflow."
