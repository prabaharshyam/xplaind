id: eu-ai-act-risk-tiers
question: "How does the EU AI Act sort AI systems by risk, and why could it matter to an Indian company?"
kind: concept
short_answer: "It sorts AI uses into tiers: practices that are banned, such as social scoring; high-risk uses, such as hiring, credit and education, with strict duties; uses needing transparency, such as chatbots and deepfakes; and minimal-risk uses. It reaches companies outside the EU when their AI is sold in, or its output used in, the EU."
deeper_answer: "The Act regulates by use, not by technology. A high-risk system needs risk management, good data governance, documentation, logging, human oversight, accuracy and robustness, and registration before it is placed on the market. Providers of general-purpose AI models have separate duties, such as technical documentation and copyright policies.\n\nFor an Indian IT services firm or SaaS company, this matters when it builds or sells AI for EU clients or users: the client will push the duties into contracts. Obligations phase in over several years and some dates have been revisited, so always check the current timeline before giving dates."
follow_ups:
  - "Which tier would an AI resume screener fall into?"
  - "What does a deployer have to do, compared with a provider?"
common_mistakes:
  - "Saying it only applies to EU companies"
  - "Quoting fixed deadlines without checking the current timeline"
level: P1
topic: governance
stop_id: ai-risk-frameworks
rubric:
  - point: "Names the tiers: prohibited, high-risk, transparency, minimal"
    keywords: ["prohibited", "high-risk", "high risk", "transparency", "minimal"]
  - point: "Gives examples of high-risk uses"
    keywords: ["hiring", "credit", "education", "employment"]
  - point: "Mentions duties for high-risk systems"
    keywords: ["documentation", "human oversight", "risk management", "logging"]
  - point: "Explains reach outside the EU"
    keywords: ["outside the eu", "eu users", "placed on the market", "indian"]
  - point: "Mentions general-purpose AI model duties or phased timeline"
    keywords: ["general-purpose", "phase", "timeline"]
answer_seconds: 90
example: "I would explain it with a client case. An Indian firm building an AI screening tool for a German retailer's hiring falls into the high-risk tier, so the retailer will ask for risk management records, documentation of training data, logs and a clear human review step in the contract. A customer-service chatbot for the same retailer is lighter: it mainly has to tell people they are talking to an AI. A tool that scored employees' 'trustworthiness' from social media could fall under the banned practices."
