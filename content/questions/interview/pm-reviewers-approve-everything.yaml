id: pm-reviewers-approve-everything
question: "AI drafts loan file summaries and credit officers must approve each one, but your data shows they approve 99% of them in under ten seconds. What do you do?"
kind: scenario
short_answer: "The review is not working as a check. First audit a sample to find the true error rate. Then redesign: send only risky or low-confidence cases to officers, show the source beside each claim, ask for an active check on key fields, and insert known errors to measure whether reviewers catch them."
deeper_answer: "A person who sees correct output 99 times stops reading. This is automation bias, and it is predictable. Ten seconds is not enough to check a loan file, so the approval step gives a feeling of safety without the safety. Start by measuring: have a senior officer review 200 approved summaries properly. That gives the real error rate and which fields go wrong.\n\nThen make reviewing possible and worthwhile. Fewer, harder cases: let clear files pass with a sample audit and route unusual ones, such as income mismatch, to a person. Show evidence: the summary line next to the payslip it came from. Replace one-click approve with confirming two or three key numbers. Add test cases with planted errors and track the catch rate. Interviewers listen for diagnosis by data, a redesign of the task, and no blame on the officers."
follow_ups:
  - "How do you measure whether the new review step works?"
  - "Is it acceptable to remove human review for low-risk files?"
  - "How would the officers' targets need to change?"
common_mistakes:
  - "Telling officers to be more careful"
  - "Assuming a human in the loop means the output is checked"
  - "Adding more review steps instead of better ones"
level: P1
topic: product
stop_id: hitl-product-design
rubric:
  - point: "Names the problem: approval without reading, or automation bias"
    keywords: ["automation bias", "not reading", "rubber"]
  - point: "Audits a sample to find the true error rate"
    keywords: ["audit", "sample", "error rate"]
  - point: "Routes by risk or confidence so people see fewer, harder cases"
    keywords: ["risk signals", "confidence", "rout"]
  - point: "Shows sources and requires an active check on key fields"
    keywords: ["source", "confirm", "key fields"]
  - point: "Measures reviewer catch rate with planted errors"
    keywords: ["planted errors", "catch rate", "known errors"]
answer_seconds: 130
example: "Ten seconds per file tells me the officers are not reading. That is automation bias, and it is a design problem, not a people problem. First I would ask a senior officer to audit a sample of 200 approved summaries, to learn the true error rate. Then I would redesign the step. Files with high confidence and no unusual signals pass with a random audit. Files with risk signals, such as income that does not match the bank statement, go to an officer. On screen, each line of the summary shows its source, like the payslip, and the officer must confirm three key fields, not click one button. Each week we add a few planted errors and track the catch rate."
