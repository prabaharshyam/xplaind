id: incremental-indexing
question: "How do you keep a RAG index up to date as documents change?"
kind: use-case
short_answer: "Use incremental indexing instead of rebuilding: detect changes with timestamps, content hashes or change data capture from the source, re-parse and re-embed only changed documents, delete chunks of removed ones, and keep stable document IDs so updates replace old chunks. Track freshness and run the pipeline on a schedule or from change events."
deeper_answer: "Deletions are the part teams forget: a removed policy that still sits in the index will be retrieved. Store a document ID and version on every chunk so you can remove all of a document's chunks at once.\n\nChanging the embedding model or chunking means a full re-index, so version the index and switch over only after evaluating the new one."
follow_ups:
  - "How would you detect that a document was deleted at the source?"
  - "What forces a full re-index?"
common_mistakes:
  - "Forgetting deletions"
  - "Mixing embeddings from two models in one index"
level: P1
topic: rag
stop_id: data-pipelines-ai
rubric:
  - point: "Incremental updates, not full rebuilds"
    keywords: ["incremental", "only changed", "rebuild"]
  - point: "Detects changes: timestamps, hashes or CDC"
    keywords: ["timestamp", "hash", "change data capture", "cdc", "detect"]
  - point: "Handles deletions"
    keywords: ["delet", "remove"]
  - point: "Stable document IDs and versions"
    keywords: ["document id", "stable", "version"]
  - point: "Full re-index when the embedding model changes"
    keywords: ["embedding model", "re-index", "reindex", "full"]
answer_seconds: 90
example: "For a company wiki with 40,000 pages, rebuilding the index took six hours. I stored a content hash and the page ID with every chunk. A nightly job pulled pages changed since the last run from the wiki's API, re-embedded only those, deleted chunks of removed pages, and replaced chunks by page ID. It ran in minutes, and a dashboard showed the age of the oldest unsynced change."
