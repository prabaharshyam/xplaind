id: slowed-ai-project-for-risk
question: "Tell me about a time you slowed down or stopped an AI project because of a risk."
kind: real-life
short_answer: "Pick a real case. Explain the risk you saw and the evidence, how you raised it without blocking for its own sake, the options you proposed, what was decided, and the outcome. Show that you helped the project ship safely rather than simply saying no."
deeper_answer: "Governance roles are judged on judgement and relationships. Interviewers want to see that you can spot a real risk, back it with evidence, explain it in business terms and offer a way forward, such as a smaller launch, an added control or a test to run first.\n\nBe honest about the cost of the delay and how you kept it short. If the risk turned out smaller than you feared, say so; it shows you follow evidence. Finish with what the team does differently now."
follow_ups:
  - "How did the project team react?"
  - "What would you have done if leadership overruled you?"
common_mistakes:
  - "Telling it as a story of blocking others"
  - "No evidence for the risk"
level: P1
topic: behavioral
stop_id: writing-ai-policy
rubric:
  - point: "Describes a specific risk with evidence"
    keywords: ["risk", "evidence", "found", "noticed"]
  - point: "Raises it constructively with options"
    keywords: ["options", "proposed", "suggested", "raised"]
  - point: "Explains the decision and its business terms"
    keywords: ["decided", "decision", "business", "cost"]
  - point: "Gives the outcome"
    keywords: ["outcome", "result", "launched", "shipped"]
  - point: "States a lasting change or lesson"
    keywords: ["now", "changed", "lesson", "learned"]
answer_seconds: 120
example: "A marketing team wanted to launch a WhatsApp campaign where AI wrote personalised messages from customers' purchase history. I checked the consent records and found many customers had agreed to order updates only, not marketing. I showed the team the numbers and proposed launching only to customers with marketing consent, plus an opt-in prompt for the rest. The launch moved by a week and reached a smaller list, with no complaints, and consent checks are now part of every campaign review."
