id: sr-eng-fde-pilot-below-contract-bar
question: "Your pilot at an insurance client reaches 72% correct claim summaries against the 88% written in the contract, the ₹4 crore production decision is in three weeks, and your account lead wants the demo to show only the good cases. What do you do?"
kind: real-life
short_answer: "I would not hide the gap. A client who finds it in production will not trust us again. I would break the 72% down by claim type, show where we meet 88%, and propose a first release with human review for weak types, and a dated plan. I would align the account lead before the meeting."
deeper_answer: "This tests judgement under commercial pressure. Showing selected cases might win the contract, but the contract names 88%, the client's own staff will measure it, and trust is the real asset in a long engagement. The better path changes the question from pass or fail to what is ready.\n\nAn average hides structure. Often one group, such as motor claims, is at 93% while health claims with handwritten documents are at 60%. Then an honest and attractive offer exists: go live on motor claims now, keep a human in the loop for health claims, and commit to a milestone with a date and a named cause, such as OCR quality. Inside your own company, bring the account lead and your manager into the decision early with numbers, so nobody is surprised in the room. Interviewers listen for integrity, segment analysis, a smaller scope the client can accept, and escalation done internally first."
follow_ups:
  - "The account lead insists on the selective demo. What is your next step?"
  - "How would you present the 72% so the client still has confidence?"
  - "What would you change in the next contract's success criteria?"
common_mistakes:
  - "Showing only the good cases to win the deal"
  - "Reporting the average and missing that some claim types already pass"
  - "Surprising your own account lead in front of the client"
level: P3
topic: client-delivery
