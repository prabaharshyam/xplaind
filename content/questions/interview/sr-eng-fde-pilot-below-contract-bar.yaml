example: "I would tell the account lead that I will not show only the good cases, because the client will measure 88% themselves and we would lose their trust and the next contract. Then I would make the honest story a strong one. I would break the 72% down by claim type. Suppose motor claims are at 93% and health claims with handwritten forms are at 61%. My proposal: a first release for motor claims now, human review on every health summary, and a plan with a date, eight weeks, to fix the cause, which is OCR on handwriting. I would take this to the account lead and my manager before the meeting so we say the same thing. In my experience, clients sign a smaller scope they can believe."
