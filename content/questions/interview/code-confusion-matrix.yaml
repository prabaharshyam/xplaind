answer_seconds: 150
example: "I would first ask whether the labels are integers from 0 to k minus 1. If they are strings, I map them to indices first. I also state my convention: rows are the true class and columns are the predicted class. Then I create a k by k matrix of zeros, loop over the pairs, and add 1 at the cell for true and predicted. In NumPy I use np.add.at, because plain indexed addition counts a repeated pair only once. The cost is linear in the examples, plus k squared for the matrix. From the matrix, the diagonal is the correct predictions. Recall per class is the diagonal over the row sums, and precision is the diagonal over the column sums. I would test that the whole matrix sums to n, and that a pair that appears twice is counted twice."
