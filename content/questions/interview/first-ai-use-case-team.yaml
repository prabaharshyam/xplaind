id: first-ai-use-case-team
question: "Your team asks you to suggest one place to start using AI. What would you pick, and why?"
kind: use-case
short_answer: "Pick a task that is frequent, takes real time, and is easy to check, where a mistake is cheap: for example, first drafts of routine emails or summaries of long documents. Avoid starting with anything that decides money, health or people's jobs. Try it for two weeks, measure the time saved, and agree rules for what data can be used."
deeper_answer: "A good first use case builds trust. If people can quickly see whether the AI got it right, they learn where it helps and where it does not. Drafting, summarising, reformatting and brainstorming fit this well, because a person reviews the result before it is used.\n\nMeasure something simple, such as minutes per task before and after, and collect examples of good and bad outputs. Agree on what must never be pasted into a public tool, such as customer personal data, before anyone starts."
follow_ups:
  - "How would you measure whether it worked?"
  - "What task would you not give to AI yet, and why?"
common_mistakes:
  - "Starting with a high-stakes decision such as approving loans"
  - "Not agreeing on what data people may paste in"
level: B1
topic: ai-literacy
stop_id: use-an-assistant
rubric:
  - point: "Picks a frequent, time-consuming task"
    keywords: ["frequent", "often", "repetitive", "time"]
  - point: "Picks something easy to check where mistakes are cheap"
    keywords: ["easy to check", "review", "low risk", "cheap"]
  - point: "Avoids high-stakes decisions at first"
    keywords: ["high stakes", "money", "health", "decision"]
  - point: "Measures the result over a short trial"
    keywords: ["measure", "trial", "minutes", "two weeks"]
  - point: "Agrees data rules before starting"
    keywords: ["data", "rules", "policy", "confidential"]
answer_seconds: 90
example: "At a training institute I suggested we start with replies to common student enquiries: fees, batch timings, documents needed. We got about forty such emails a day, each took five or so minutes, and any staff member could spot a wrong reply at a glance. We tried AI drafts for two weeks with the rule that no student's personal details went into the tool. Replies got faster and more consistent, and only then did we look at harder tasks."
