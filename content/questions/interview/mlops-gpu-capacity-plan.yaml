id: mlops-gpu-capacity-plan
question: "You will self-host an open-weight LLM for an internal assistant used by 8,000 employees. How do you work out how many GPUs you need?"
kind: use-case
short_answer: "Estimate peak load, not the average: concurrent requests at the busiest hour, with typical input and output tokens. Load test one replica to find the throughput it sustains while meeting the latency target. Divide peak load by that number, then add headroom for spikes and one failed node. Check the result with a full load test and plan autoscaling."
deeper_answer: "The number of users says little. What matters is how many requests arrive in the busiest minutes and how long each one is. From pilot logs or a careful guess I would get requests per second at peak, and the token profile: perhaps 1,500 tokens in and 300 out. Output length drives the time each request holds a place in the batch.\n\nThen measure. Serve the model on one GPU with a batching server such as vLLM, and raise concurrency until time to first token or total latency breaks the target. That gives the safe capacity of one replica. It depends on the model size, quantisation and context length, so it cannot be looked up. Replicas needed is peak divided by that capacity, plus headroom of perhaps 30%, plus one spare so a node failure does not cause an outage. Because GPU nodes start slowly, autoscaling must act early or keep a warm minimum. Interviewers listen for peak load, measured throughput under a latency target, and headroom."
follow_ups:
  - "How would your plan change if every prompt had 20,000 tokens of context?"
  - "What would you do if the budget covers only half the GPUs?"
  - "Why can you not plan from average requests per day?"
common_mistakes:
  - "Planning from the number of users or the daily average"
  - "Using a benchmark number from the internet as replica capacity"
  - "No spare capacity for a node failure or a slow scale-up"
level: P2
topic: deployment
stop_id: latency-load-testing
rubric:
  - point: "Estimates peak concurrent load, not the average or the user count"
    keywords: ["peak", "concurrent", "busiest", "requests per second"]
  - point: "Uses the token profile: input and output lengths"
    keywords: ["token", "output length", "input"]
  - point: "Load tests one replica to find throughput at the latency target"
    keywords: ["load test", "one replica", "one gpu", "throughput", "latency target"]
  - point: "Divides peak by replica capacity and adds headroom and a spare"
    keywords: ["headroom", "spare", "divide", "node failure"]
  - point: "Plans for slow GPU start-up with a warm minimum or early autoscaling"
    keywords: ["autoscal", "warm", "minimum", "slow to start", "start-up"]
answer_seconds: 140
example: "I would not plan from 8,000 users. I would plan from the peak. From the pilot logs, suppose the busiest hour is 11 am, with about 12 requests per second, and a typical request has 1,500 input tokens and 300 output tokens. Next I would load test one GPU running the model on vLLM, and raise concurrency until we miss the latency target of two seconds to first token. Say one replica holds 4 requests per second safely. Then I divide: 12 by 4 is three replicas. I add about 30 percent headroom and one spare, so that a node failure is not an outage. That gives five. GPU nodes are slow to start, so I would keep a warm minimum of three and set autoscaling to act early. Then I would confirm with a full load test."
