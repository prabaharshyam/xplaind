id: relocation-and-work-mode
question: "Are you open to relocating or working from the office?"
kind: real-life
short_answer: "Be honest about what you can and cannot do. If you are open, say yes and give your timeline. If you have limits, state them clearly and offer what you can do, such as hybrid work or relocating after some months. Ask about relocation support. Do not agree now and refuse after the offer."
deeper_answer: "The interviewer needs a practical answer. Many AI teams in India sit in Bengaluru, Hyderabad, Pune, Gurugram or Chennai and expect three to five office days. They want to avoid a candidate who accepts and then asks for remote work.\n\nCheck the job post for the work mode before the interview, and talk to your family if the move affects them. Then give a clear position, a reason if there is a limit, and a workable option. For example: \"I am open to moving to Bengaluru. I would need about four weeks after the offer to shift.\" If you cannot relocate, say so early. It saves time for both sides, and some companies will adjust for a strong candidate."
follow_ups:
  - "How soon could you move?"
  - "Would you accept five days a week in the office?"
  - "What if the team later shifts to another city?"
common_mistakes:
  - "Saying yes to everything and refusing after the offer"
  - "Giving a vague answer such as \"I will see\""
  - "Not reading the work mode in the job post"
level: B2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Gives a clear yes, no or conditional answer"
    keywords: ["yes", "open to", "cannot", "can relocate", "willing"]
  - point: "States any limit or fixed commitment honestly"
    keywords: ["one thing", "family", "parents", "leave", "wedding", "until"]
  - point: "Gives a timeline or workable option"
    keywords: ["weeks", "months", "hybrid", "days a week", "after the offer"]
  - point: "Asks about or mentions practical support"
    keywords: ["relocation support", "support", "allowance", "stay", "policy"]
answer_seconds: 60
example: "Yes, I am open to relocating. I live with my parents in Kochi now, and I have discussed this with them. I know your AI team works from the Bengaluru office three days a week, and that suits me. As a fresher I think I will learn faster sitting with the team than working alone from home. I would need about three weeks after the offer to find a room and shift. There is one thing I should say now: my sister's wedding is in the second week of January, so I will need four days of leave then. May I ask if the company gives any relocation support or a first-week stay for people joining from another city?"
