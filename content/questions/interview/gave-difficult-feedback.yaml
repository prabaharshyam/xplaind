id: gave-difficult-feedback
question: "Tell me about a time you had to give someone difficult feedback."
kind: real-life
short_answer: "Describe a real case where the feedback was hard to give. Say why it was needed, then how you gave it: in private, soon, with specific examples, about the work and not the person. Say that you asked for their view and agreed next steps. End with what changed."
deeper_answer: "The interviewer is checking whether you avoid hard conversations, and whether you can be honest and kind together. Leads who delay feedback let small problems grow.\n\nSituation: who the person was and what the problem was. Task: why it was yours to raise. Action: how you prepared and what you said. Use real words: \"I said, your last three experiments could not be repeated by anyone else, and I showed him the three cases.\" Say that you listened to their side, because there is often a reason you did not know. Result: what changed in the work and in the relationship. Do not tell a story where you were harsh and proud of it."
follow_ups:
  - "How did the person react when you said it?"
  - "What would you have done if nothing had changed?"
  - "Tell me about difficult feedback you received."
common_mistakes:
  - "Giving the feedback in public or by message only"
  - "Speaking about the person's character and not the work"
  - "Not asking for the other person's side"
level: P1
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Explains why the feedback was needed"
    keywords: ["because", "could not", "problem", "twice", "had to raise"]
  - point: "Gave it in private and without delay"
    keywords: ["privately", "private", "one to one", "alone"]
  - point: "Used specific examples about the work"
    keywords: ["specific", "cases", "examples", "showed"]
  - point: "Asked for the other person's view"
    keywords: ["his view", "her view", "their view", "listened", "he said", "she said"]
  - point: "Agreed next steps and gives the result"
    keywords: ["agreed", "within a month", "result", "improved", "later"]
answer_seconds: 120
example: "I was a senior ML engineer leading a team of five. One engineer, about a year into the job, was fast, but his experiments could not be repeated. He did not save his settings or data versions. Twice we could not rebuild a model that he said was better. I had to raise it before his review cycle. I met him privately and brought three specific cases. I said the speed was valuable, and that results nobody can repeat cannot be used. Then I asked for his view. He said nobody had shown him our tracking setup. That was partly my fault. We agreed that every run would be logged, and I paired with him twice that week. Within a month all his runs could be repeated, and he later taught the setup to two new joiners."
