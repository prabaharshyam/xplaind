id: control-llm-cost
question: "How would you keep the cost of an LLM feature under control?"
short_answer: "Measure cost per request and per user, then cut it: use the cheapest model that passes your evals, shorten prompts and outputs, cache repeated prefixes and answers, batch work that can wait, and stop runaway usage with per-user limits and a provider spending cap. Recheck when traffic or prices change."
deeper_answer: "Cost is tokens times price times volume, so attack each factor. Routing simple requests to a small model often gives the biggest saving. Trimming retrieved context and conversation history cuts input tokens. Batch APIs are cheaper for offline jobs.\n\nGuardrails stop surprises: rate limits per user, maximum steps for agents, a hard monthly cap, and alerts when daily spend jumps. For a product in India, cost per active user has to fit low price points, so model the unit economics before launch."
follow_ups:
  - "How would you calculate cost per active user?"
  - "What would you do if one user generated a large share of the cost?"
common_mistakes:
  - "Only switching to a cheaper model without checking quality"
  - "Having no hard spending limit"
