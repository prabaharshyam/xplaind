id: grounding-and-citations
question: "How do you make a RAG system cite sources and stay grounded?"
short_answer: "Give each retrieved chunk an ID and source details, instruct the model to answer only from the provided context and cite chunk IDs for each claim, and to say it does not know when the context lacks the answer. Then verify that cited chunks support each claim, and measure faithfulness on an eval set."
deeper_answer: "Grounding is mostly about retrieval quality plus clear instructions and checks. Show citations in the interface so users can click through to the page, which builds trust and makes errors visible.\n\nAutomatic checks can compare each sentence with its cited text using a judge model. Track the refusal rate too: a system that never says 'I don't know' is probably guessing."
follow_ups:
  - "How would you check that a citation actually supports the claim?"
  - "What should the app show when nothing relevant is retrieved?"
common_mistakes:
  - "Asking for citations without verifying them"
  - "Never allowing 'I don't know'"
level: I3
topic: rag
stop_id: grounding-citations
rubric:
  - point: "Chunks carry IDs and source details"
    keywords: ["id", "source", "metadata", "page"]
  - point: "Instruct to answer only from context"
    keywords: ["only from", "context", "grounded"]
  - point: "Cite per claim"
    keywords: ["cite", "citation", "claim"]
  - point: "Say 'I don't know' when context lacks the answer"
    keywords: ["don't know", "do not know", "refuse", "not in the context"]
  - point: "Verify citations and measure faithfulness"
    keywords: ["verif", "faithful", "check", "eval"]
answer_seconds: 90
example: "In a compliance assistant, each retrieved passage arrives labelled like [S3: Travel policy, section 4.2]. The model must cite a label after each claim and reply 'The policy does not say' when nothing covers the question. A check after generation confirms that each cited passage really contains the claim, and our eval set measures how often answers are fully supported."
