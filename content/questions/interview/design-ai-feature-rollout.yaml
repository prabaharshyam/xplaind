example: "Before launch I would run an offline evaluation on realistic inputs, red-team tests for harmful output, and a load test. I would also estimate cost: if 5 percent of 20 million users make four requests a day, that is 4 million requests, so I check provider rate limits and set a budget. The feature sits behind a server-side flag with a kill switch. I roll out in stages: staff, then 1 percent, 10 percent, 50 percent and everyone, with an A/B comparison on task completion. Each stage has a stop condition agreed in advance, such as p95 latency, the rate of flagged outputs and cost per user. For peaks there is a per-user rate limit and a fallback message. I monitor quality with sampled scoring and user feedback, split by language. The trade-off is speed against safety: a slow rollout delays value but limits harm. Rollback is one switch."
