id: ambiguous-problem
question: "Tell me about a time you were given a vague problem with no clear answer."
kind: real-life
short_answer: "Choose a time the goal was unclear. Show how you made it clear: you asked who had the problem, looked at real data, wrote down what success means, and chose one small first step. Explain what you assumed and how you checked it. End with what you delivered."
deeper_answer: "AI work is full of vague requests such as \"use AI to help support\". The interviewer is checking whether you can turn a vague request into a clear problem, without waiting for someone to do it for you and without building the wrong thing.\n\nSituation: the vague request. Task: what you had to work out. Action: the questions you asked, the data you looked at, and the success measure you proposed. A good line is: \"Before building anything, I read 300 tickets to see what people were really asking.\" Result: the first thing you shipped and what it showed. State your assumptions openly. Being wrong on one of them is fine if you found it early."
follow_ups:
  - "How did you decide what not to build?"
  - "What did you assume, and was any assumption wrong?"
  - "How did you get agreement on what success means?"
common_mistakes:
  - "Waiting for someone else to define the problem"
  - "Starting to build before asking any questions"
  - "Giving no measure of success"
level: I3
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "States the vague request"
    keywords: ["vague", "unclear", "no target", "no plan", "said"]
  - point: "Asked questions and looked at real data"
    keywords: ["asking", "asked", "read", "tickets", "data"]
  - point: "Defined success in a measurable way"
    keywords: ["success", "goal", "target", "measure"]
  - point: "Chose a small first step"
    keywords: ["first step", "small", "pilot", "only"]
  - point: "Stated and checked an assumption"
    keywords: ["assumed", "assumption", "checked"]
  - point: "Gives the result"
    keywords: ["fell", "result", "launched", "percent"]
answer_seconds: 120
example: "I was a data scientist at an online furniture company. My director said, \"Use AI to reduce the load on the support team.\" There was no target and no plan. I started by asking the support head what took the most time, and I read 300 recent tickets and sorted them by hand. About 40 percent were order status questions that needed no human judgement. I wrote a one-page note: the goal is fewer tickets reaching agents, the first step is automatic replies for order status only, and success is a 15 percent drop in agent tickets. I assumed our order data was reliable, and I checked that on 50 orders first. We launched in five weeks. Agent tickets fell by 18 percent, and the team then asked me to do returns next."
