id: auto-builder-leaves-personal-keys
question: "A colleague who built 15 workflows is leaving next week. They all run on connections made with their own Google account and API keys. What do you do?"
kind: scenario
short_answer: "List every workflow and each connection it uses before the person leaves. Move each connection to a shared service account or a company-owned key with only the access it needs, stored in the tool's credential store. Test each workflow after the move, then revoke the personal access, and get a handover note on what each workflow does."
deeper_answer: "When an employee's account is disabled, every token created from it stops working, and 15 workflows fail on the same day with nobody who understands them. There is also a security side: personal keys usually have the person's full access, and they stay valid outside the company if nobody revokes them.\n\nSo I use the remaining week in order. Day one: an inventory, with owner, purpose, connections and who depends on each workflow. Then I create service accounts or team-owned keys with least privilege, for example access to one shared drive folder, not the whole drive. I switch workflows one by one and run each to confirm. I record walkthroughs with the builder for the complex ones. After the last day, I revoke old tokens and rotate any key the person could see. Then I make it a rule: no production workflow on a personal account. Interviewers listen for the inventory, the service account and the revocation."
follow_ups:
  - "What is a service account, and who should own it?"
  - "How do you find connections you did not know about?"
  - "What rule would you add so this does not happen again?"
common_mistakes:
  - "Waiting until the account is disabled and workflows fail"
  - "Moving the same wide access to a shared login"
  - "Forgetting to revoke the old keys"
level: I2
topic: automation
stop_id: documentation-handover
rubric:
  - point: "Makes an inventory of workflows and the connections each uses"
    keywords: ["inventory", "every workflow", "each connection"]
  - point: "Moves connections to a service account or company-owned key"
    keywords: ["service account", "company-owned"]
  - point: "Gives only the access needed and uses the credential store"
    keywords: ["only the access", "credential store", "one folder", "least privilege"]
  - point: "Tests each workflow after the switch"
    keywords: ["test it", "run each", "one by one"]
  - point: "Revokes and rotates old keys and gets a handover note"
    keywords: ["revoke", "rotate", "handover note", "walkthrough"]
answer_seconds: 120
example: "I would use the week before the last day. First an inventory: I list every workflow, what it does, who depends on it, and each connection it uses. Then I ask IT for a service account in Google Workspace and create company-owned API keys for the other tools. I give each one only the access it needs, for example one folder in the shared drive, and save them in the credential store of the tool, not in a document. I switch the workflows one by one and run each to test it. For the three most complex ones I record a walkthrough with my colleague and write a short handover note. After the last day I revoke the old tokens and rotate any key my colleague had seen."
