answer_seconds: 150
example: "A task of 5 to 20 minutes cannot sit inside a web request, so I would make each run a background job. The API puts the task on a queue and returns a run ID. A pool of workers picks jobs up. Each worker saves state to a database after every step, so that a run can resume on another worker after a restart or a deploy. The real ceiling is the provider's rate limit. So I would set an overall limit of perhaps 150 runs at once, and a limit of two per user so that one team cannot fill the queue. Each run has a budget cap of ₹50 and its own isolated workspace. The user sees progress and has a cancel button. On my dashboard I would monitor queue wait, success rate and cost per task."
