id: automation-duplicate-orders
question: "Your automation created every order twice last night. How do you find and fix it?"
kind: scenario
short_answer: "Stop the workflow, list the duplicates and clean them up with the business. Then check the run history: often the trigger fired twice, a webhook was retried after a timeout, or a step was rerun after a failure. Fix it with idempotency: a unique order ID checked before creating, and safe retries. Add an alert for unusual volumes."
deeper_answer: "Duplicates are one of the most common automation bugs. Webhook senders often retry when they do not get a quick success response, and many platforms rerun failed executions. If your 'create' step does not check whether the record already exists, every retry creates another copy.\n\nThe standard fix is an idempotency key, usually the source system's order or event ID, stored and checked before creating anything. Respond to webhooks quickly and do slow work after. Then add monitoring: a count of records created per hour with an alert when it jumps."
follow_ups:
  - "How would you clean up the duplicates safely?"
  - "What is an idempotency key?"
common_mistakes:
  - "Deleting duplicates by hand and not fixing the cause"
  - "Turning off retries completely"
level: B3
topic: automation
