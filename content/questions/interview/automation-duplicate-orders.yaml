answer_seconds: 90
example: "In an n8n workflow I built for a small online shop, Shopify webhooks created invoices in their accounting tool. One night the accounting API was slow, our workflow responded late, Shopify retried, and about sixty orders were invoiced twice. I paused it, exported the duplicates for the accountant to void, and changed the workflow to respond to the webhook immediately, then check for an existing invoice with the Shopify order ID before creating one. I added a daily count check that messages me if invoices outnumber orders."
