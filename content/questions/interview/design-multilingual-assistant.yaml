  - point: "Cross-language retrieval: multilingual embeddings or query translation"
    keywords: ["multilingual embedding", "translate the query", "translat", "retriev"]
  - point: "Glossary for official terms and source links"
    keywords: ["glossary", "official term", "source"]
  - point: "Evaluation set per language with native speakers"
    keywords: ["per language", "native speaker", "evaluation set"]
  - point: "Knows token cost and weaker quality in some languages"
    keywords: ["token", "cost", "weaker", "fall back"]
answer_seconds: 150
example: "I would clarify the languages and scripts first, because many users type Hinglish or romanised Tamil. For each message I detect the language and script, and reply in the user's language. The documents are in English, so for retrieval I would translate the query to English and also search with multilingual embeddings, then merge the results. The trade-off is that translation adds a step and can change the meaning, but it usually helps the weaker languages. The model writes the answer from the retrieved passages, with a glossary so scheme names and official terms stay the same, and a link to the source. Indian-language text uses more tokens, so cost per answer is higher than in English. I would build an evaluation set of 200 real questions per language, checked by a native speaker, and track scores by language. When confidence is low, the assistant offers English or a human."
