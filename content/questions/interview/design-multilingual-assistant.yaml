id: design-multilingual-assistant
question: "A government services assistant must answer citizens in English, Hindi, Tamil, Bengali and Marathi, including mixed and romanised text such as Hinglish. The source documents are mostly in English. Design it for 1 million users."
kind: use-case
short_answer: "Clarify languages, scripts, channels and risk. Detect language and script per message, retrieve with multilingual embeddings or translate the query to English, generate in the user's language from the retrieved sources, and keep official terms consistent with a glossary. Build an evaluation set per language with native speakers, and monitor quality by language."
deeper_answer: "Requirements: which languages and scripts, whether users type romanised or mixed text, voice or text, and how costly a wrong answer is.\n\nDesign: detect the language and script of each message, and reply in the same one unless the user chooses another. For retrieval over English documents there are two options. Multilingual embeddings match a Tamil question to English text directly, which is simple but weaker for some languages. Translating the query to English first often improves retrieval, at the cost of one more step and possible translation errors. The model then writes the answer in the user's language from the retrieved passages, with a glossary for scheme names and official terms, and a link to the source.\n\nTrade-offs and limits: Indian-language text usually uses more tokens than English, so cost and latency are higher. Models are weaker in lower-resource languages and on romanised text, so test before trusting them. Build an evaluation set of real questions per language, reviewed by native speakers, and report scores by language, not as one average. Fall back to English or a human when confidence is low."
follow_ups:
  - "Would you translate the documents, the query or neither? Why?"
  - "How do you evaluate Tamil answers if nobody on the team reads Tamil?"
  - "What changes when users send voice notes?"
common_mistakes:
  - "Testing only in English and assuming other languages work"
  - "Ignoring romanised and mixed-language input"
  - "Reporting one average quality score across languages"
level: P1
topic: system-design
stop_id: ai-in-indian-languages
rubric:
