id: why-this-company
question: "Why do you want to work at this company?"
kind: real-life
short_answer: "Show that you have studied the company. Name one or two specific things about it: its product, its users, or a technical problem it is solving. Then connect each one to your own skills or interests. End with what you hope to contribute. Praise that could fit any company does not count."
deeper_answer: "The interviewer wants to know two things: did you prepare, and will you stay. A candidate who gives the same answer to fifty companies is easy to notice.\n\nBefore the interview, spend thirty minutes on the product page, the engineering blog, recent news and the job description. Pick two facts that truly interest you. Then use this structure: what they do, why it matters to you, how your work connects. For example: \"Your product answers questions over legal documents, where a wrong answer is costly. My project had the same problem on a small scale, and I want to learn how a real team controls it.\" Be honest. If pay or location is one reason, it should not be the only one you give."
follow_ups:
  - "Which of our products have you tried?"
  - "What would you improve in our product?"
  - "Which other companies are you considering?"
common_mistakes:
  - "General praise such as \"you are a market leader\""
  - "Talking only about salary, brand or location"
  - "Getting basic facts about the company wrong"
level: B3
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Names a specific fact about the company: product, users or technical problem"
    keywords: ["your product", "users", "customers", "your team", "you build", "blog"]
  - point: "Connects that fact to their own skills or interest"
    keywords: ["my project", "i built", "i worked on", "interest", "similar"]
  - point: "Says what they want to contribute or learn here"
    keywords: ["contribute", "learn", "help", "grow"]
answer_seconds: 90
example: "I read that your product lets small law firms search their own case files and get answers with the source page shown. That detail is why I applied. In my MCA project I built a search tool over 300 pages of university rules, and the hardest part was stopping it from giving confident answers with no source. I solved it only partly. Your engineering blog describes how your team checks every answer against the retrieved text, and I want to learn that properly. I also like that your users are small firms in cities like Indore and Jaipur, not only large companies. I think I can contribute first on testing and evaluation, where I already have some practice."
