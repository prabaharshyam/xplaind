id: ai-ml-genai-difference
question: "What is the difference between AI, machine learning and generative AI?"
short_answer: "AI is the broad goal of computers doing tasks that seem to need intelligence. Machine learning is the main way we build AI today: systems learn patterns from data instead of following hand-written rules. Generative AI is a kind of machine learning that creates new content, such as text, images or code, for example ChatGPT, Gemini or Claude."
deeper_answer: "A simple picture is three circles, one inside the other. A spam filter that learned from labelled emails is machine learning. A chess program that follows rules written by people is AI but not machine learning. A chatbot that writes an email for you is generative AI.\n\nIn interviews for non-technical roles, the point is to show you can explain this clearly to a colleague, with an example from daily life or from the company's own work."
follow_ups:
  - "Is a calculator AI? Why or why not?"
  - "Give an example of machine learning you used today."
common_mistakes:
  - "Treating the three terms as the same thing"
  - "Giving definitions with no example"
