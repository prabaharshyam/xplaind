example: "I use a cricket example. AI is the big goal: a computer that can, say, act as a match commentator. Machine learning is how we usually get there: show a model thousands of past matches so it learns to predict a team's score. Generative AI is the part that creates new content, such as writing a match report or a commentary line from the scorecard."
