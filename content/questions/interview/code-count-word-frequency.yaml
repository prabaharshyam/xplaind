    keywords: ["case", "punctuation", "lowercase"]
  - point: "Extracts words with a regular expression, not a plain split on spaces"
    keywords: ["regular expression", "findall"]
  - point: "Counts with Counter or a dict"
    keywords: ["counter", "count"]
  - point: "Gets the top k with most_common instead of sorting by hand"
    keywords: ["most_common", "top k"]
  - point: "States O(n) time and memory that grows with unique words"
    keywords: ["o(n)", "unique words", "memory"]
answer_seconds: 150
example: "I would first ask what counts as a word. I will assume case does not matter and punctuation is dropped, so I lowercase the text first. Then I pull out the words with a regular expression, re.findall(r\"[a-z']+\", text.lower()), which also keeps apostrophes. I count them with Counter and take the top k with Counter(words).most_common(k). Counting is O(n) time in the number of words, and memory grows with the number of unique words, not the length of the text. For \"the cat sat, the cat ran, the end\" with k = 2, I get \"the\" with 3 and \"cat\" with 2. I would also test an empty string, which returns an empty list, and a tie, where most_common keeps the word seen first."
