id: ai-for-research-tips
question: "How would you use AI to research a topic you know little about?"
kind: use-case
short_answer: "Use it to get oriented, not as the final source: ask for an overview, key terms and the main debates, then go to primary sources it points to and check them. Ask for opposing views, keep notes of what you verified, and use tools that cite sources, opening every citation that matters."
deeper_answer: "AI is good at explaining jargon and suggesting what to read next. It is weaker at being right about specific numbers and recent findings, and it sometimes cites papers that do not exist, so verify every reference.\n\nA sound workflow: overview with AI, read two or three trusted sources, return to the AI with specific questions about what you read, and write the summary in your own words."
follow_ups:
  - "How would you check a citation the AI gives you?"
  - "How do you avoid getting only one side of a debate?"
common_mistakes:
  - "Quoting AI-generated facts without checking"
  - "Trusting references without opening them"
level: B1
topic: ai-literacy
stop_id: ai-for-research
rubric:
  - point: "Uses AI for an overview and key terms"
    keywords: ["overview", "key terms", "orient", "explain", "jargon"]
  - point: "Goes to primary or trusted sources"
    keywords: ["primary", "source", "original", "paper", "official"]
  - point: "Verifies citations and facts"
    keywords: ["verif", "check", "citation", "open"]
  - point: "Asks for other viewpoints"
    keywords: ["opposing", "other view", "both sides", "counter"]
answer_seconds: 60
example: "When I had to understand GST input tax credit quickly for a project, I asked an AI assistant for a plain overview, the key terms and the common disputes. Then I opened the GST portal and an official circular it pointed to, and found one rule it had described from an older version. I kept a note of what I had confirmed and where, and asked a CA friend to check my final summary."
