example: "I would start with the three models that failed, not with new rules. In a review without blame, each author walks the team through the model and we look for the cause together. In my experience it is usually leakage, for example a feature that counts events after the prediction date, or a random split where a time-based split was needed. From that we write a one-page standard: split by time, compute features as of the prediction moment, and run every model in shadow for two weeks before launch. To raise skills, I would add a short design review before training starts and pair each junior with a senior, so I teach by asking questions and not by rewriting their code. I would track the gap between offline and live AUC for every model."
