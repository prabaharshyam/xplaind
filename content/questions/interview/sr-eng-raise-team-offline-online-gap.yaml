id: sr-eng-raise-team-offline-online-gap
question: "You join as lead of a six-person ML team where three of the last five models looked strong offline, for example AUC 0.91, and then dropped to about 0.78 in production. How do you raise the team's level so this stops happening?"
kind: real-life
short_answer: "I would treat it as a team practice problem, not individual mistakes. Together we would trace each failed model to its cause, usually leakage or a wrong split, then agree standards: time-based splits, features computed as of prediction time, and a shadow period before launch. I would teach through design reviews and pairing, not by redoing their work."
deeper_answer: "A fall from 0.91 to 0.78 three times is a pattern. Common causes are features that include information from after the prediction moment, random splits on data that has time or user structure, and training data that differs from live traffic. The technical fixes are known. The lead's job is to make the team find and own them.\n\nI would run blameless reviews of the three models, with the authors presenting. Then we write a short validation standard and add a design review before training starts, where the split and each risky feature are questioned. I would pair senior and junior engineers and rotate who reviews. For example, a churn model that used the number of support calls in the last 30 days may have counted calls made after the churn date. Interviewers listen for diagnosis before rules, shared standards, teaching by review, and a measure such as the offline to online gap per model."
follow_ups:
  - "How would you check one feature for leakage?"
  - "A senior engineer says the new reviews slow the team down. What do you answer?"
  - "How would you know in six months that the team has improved?"
common_mistakes:
  - "Rewriting the models yourself instead of teaching the team"
  - "Blaming the engineers who built the failed models"
  - "Adding rules without first finding the real causes"
