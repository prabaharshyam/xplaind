id: sec2-finetune-on-customer-chats
question: "A product team wants to fine-tune a model on two years of customer support chats. What security and privacy risks do you raise, and what controls do you ask for?"
kind: scenario
short_answer: "A fine-tuned model can memorise training text and repeat it, and it has no access control: anyone who can query it may reach what it learned. So I ask for a clear purpose, minimised and scrubbed data, tests for memorisation, strict access to the dataset, checkpoints and the model, and a plan for deletion requests. Retrieval may work instead."
deeper_answer: "Support chats contain names, phone numbers, addresses and sometimes card numbers. Once that text is in the weights, three things follow. The model can reproduce rare strings word for word, which extraction attacks exploit. Row-level permissions are gone, so data that one agent could see for one customer is now available to every user of the model. And removing one person's data later may mean retraining.\n\nThe controls follow from that. Check that this use fits the purpose the data was collected for. India's DPDP Act is relevant for personal data. Remove what is not needed and mask identifiers before training, then test the result with prompts that try to pull out known records. Treat the dataset, the checkpoints and the model as sensitive assets, with encryption and access control. If a vendor does the training, check how it uses the data. Often retrieval with permissions gives the benefit with less risk. Interviewers listen for memorisation and loss of access control."
follow_ups:
  - "How would you test whether the model has memorised personal data?"
  - "A customer asks for their data to be deleted after training. What do you do?"
  - "Is masking names and numbers enough to make the chats anonymous?"
common_mistakes:
  - "Assuming a model cannot leak its training data"
  - "Securing the database but not the dataset copies and checkpoints"
  - "Thinking that pattern-based masking removes all personal data"
level: I3
topic: security
stop_id: model-privacy-attacks
rubric:
  - point: "Explains that the model can memorise and reveal training text"
    keywords: ["memoris", "memoriz", "repeat", "reveal", "extract"]
  - point: "Says access control is lost once data is in the weights"
    keywords: ["access control", "permission", "anyone who", "every user"]
  - point: "Minimises and scrubs personal data before training"
    keywords: ["mask", "scrub", "minimis", "remove", "anonym"]
  - point: "Secures the dataset, checkpoints and model, including with any vendor"
    keywords: ["checkpoint", "dataset", "encrypt", "vendor", "restricted"]
  - point: "Covers purpose, deletion requests and whether retrieval could replace training"
    keywords: ["deletion", "delete", "purpose", "retrieval", "rag", "dpdp"]
answer_seconds: 130
example: "I would raise two main risks. First, a fine-tuned model can memorise rare text and repeat it, so a phone number or address from a chat could appear in an answer to someone else. Second, the model has no access control. Anyone who can query it can reach what it learned. So I would ask what the purpose is. If the goal is the right tone and format, the team does not need raw chats. We can remove most fields, mask names, numbers and order IDs, and train on a few thousand reviewed examples. I would test the result with prompts that try to extract known records. The dataset copies and every checkpoint must be encrypted and restricted, not left in a shared bucket. I would also ask how we would handle a deletion request, and whether retrieval could do the job."
