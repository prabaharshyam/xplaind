id: influenced-with-data
question: "Tell me about a time you used data to change someone's mind."
kind: real-life
short_answer: "Choose a time someone held a strong belief and you changed it with evidence. Say what they believed, what data you collected and how, and how you presented it simply. Show respect for their view. End with the decision that changed and the result it brought."
deeper_answer: "The interviewer is checking whether you argue with facts or by speaking louder. They also check whether you can present data so that a busy person understands it in one minute.\n\nSituation: the belief and who held it. Task: why you needed to test it. Action: what you measured, how large the sample was, and how you showed it. A good line is: \"I did not say he was wrong. I said, can I show you what I found in 300 failed answers?\" Result: the new decision and its effect. Be honest about the limits of your data. If the sample was small, say so. Strong candidates also say what they would have done if the data had supported the other side."
follow_ups:
  - "What if the data had supported their view?"
  - "How did you make sure your sample was fair?"
  - "What do you do when someone does not accept the data?"
common_mistakes:
  - "Presenting the other person as foolish"
  - "Showing many charts when one clear number is enough"
  - "Hiding the limits of the data"
level: I2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "States the belief and who held it"
    keywords: ["believed", "thought", "wanted to", "opinion", "was sure"]
  - point: "Collected evidence in a careful way"
    keywords: ["labelled", "sample", "measured", "data", "analysed"]
  - point: "Presented it simply and with respect"
    keywords: ["showed", "chart", "example failures", "one page", "presented"]
  - point: "Was honest about the limits of the data"
    keywords: ["sample was small", "limits", "not sure", "pattern"]
  - point: "Gives the changed decision and the result"
    keywords: ["agreed", "decided", "percent", "result", "did not need"]
answer_seconds: 120
example: "I was an AI engineer at an insurance company, working on a chatbot that answered policy questions for agents. Accuracy was stuck at 71 percent. Our product head believed the model was weak and wanted to fine-tune it, at a cost of about 6 lakh rupees. I was not sure, so I took 300 failed answers and labelled the cause of each one by hand. It took three days. In 64 percent of cases the right document was missing or out of date, and the model itself was the cause in only 15 percent. I showed him one chart and five example failures. I said the sample was small but the pattern was clear. He agreed to fix the documents first. Accuracy reached 86 percent in a month, and we did not need the fine-tuning."
