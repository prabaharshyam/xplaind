id: what-do-you-know-about-us
question: "What do you know about our company and what we build?"
kind: real-life
short_answer: "Show real research in under two minutes. Cover what the company builds, who uses it, and one recent development such as a launch or funding. Add one technical detail from their blog or product, and your own view of it. Link it to why you applied. Say so honestly if you could not find something."
deeper_answer: "This question checks preparation and real interest. It is easy to answer well, and many candidates still fail it, so a good answer gets you noticed early.\n\nSpend an hour before the interview. Read the product pages, try the product if you can, and read the engineering blog and recent news. Then structure the answer: product, users, something recent, your view. For example: \"You build voice assistants for banks in Indian languages. I tried the demo in Tamil, and it handled mixed Tamil and English well, which I know is hard.\" Your own observation matters most, because it cannot be copied from the website. Do not guess facts. If you are unsure, say what you understood and ask."
follow_ups:
  - "Who do you think our main competitors are?"
  - "What would you improve in our product?"
  - "Where did you find this information?"
common_mistakes:
  - "Repeating the About page word for word"
  - "Stating wrong facts with confidence"
  - "Knowing the company name and nothing about the product"
level: B3
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
rubric:
  - point: "Says what the company builds"
    keywords: ["you build", "product", "platform", "your company", "assistants"]
  - point: "Says who the users or customers are"
    keywords: ["users", "customers", "clients", "banks", "businesses"]
  - point: "Mentions a recent development or a technical detail"
    keywords: ["this year", "recently", "launched", "blog", "announced"]
  - point: "Adds their own observation or view"
    keywords: ["i tried", "i noticed", "i think", "i liked", "in my view"]
  - point: "Links it to why they applied"
    keywords: ["applied", "reason i", "interest", "this role", "my college project"]
answer_seconds: 90
example: "From what I have read, you build voice assistants that banks use to answer customer calls in Indian languages. Your website says you support eight languages and that regional banks use it for loan and balance questions. Your blog says you launched a version this year for callers who mix Hindi and English in one sentence. I tried the public demo in Tamil. It understood me well, but it was slow to reply when I interrupted it. I think that is a hard problem, and it is one reason I applied. My college project was a speech-to-text tool for Tamil lectures, so I know a little about how messy real speech is. I could not find how large the engineering team is, so I would like to ask about that."
