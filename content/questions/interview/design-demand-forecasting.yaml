id: design-demand-forecasting
question: "Design a demand forecasting system for a grocery delivery company with 300 dark stores and 20,000 products. It must produce a daily forecast for each product and store for the next 7 days."
kind: use-case
short_answer: "Clarify the decision the forecast drives, the horizon and the cost of overstock against stockouts. Then: clean sales history corrected for stockouts, features for calendar, festivals, price, promotions and weather, a simple seasonal baseline, one global gradient-boosted model across all series, backtesting over time, quantile forecasts for safety stock, and monitoring."
deeper_answer: "First ask what the forecast is used for. Here it drives daily replenishment, so the horizon is 7 days and the level is product and store. Ask which error costs more: waste on fresh items, or stockouts on staples. That decides whether to forecast a quantile instead of the mean.\n\nData: past sales are not the same as demand. When a product was out of stock, sales were zero but demand was not, so those periods must be marked or corrected. Features include lags and rolling averages, day of week, festivals such as Diwali, salary dates, price, promotions and rain. With 6 million series, many of them sparse, one global model trained across all series, such as gradient boosting, works better than a model per series.\n\nTrade-offs: a seasonal naive baseline is hard to beat for stable items, so always compare against it. Evaluate with backtesting over rolling time windows, with a metric such as weighted absolute percentage error, and check bias, because steady over-forecasting creates waste. At scale, the first problems are promotions with no history, festivals that move dates each year, and feedback from stock limits."
follow_ups:
  - "Why are past sales not the same as demand?"
  - "How do you forecast a product launched last week?"
  - "Which error metric would you use, and why not plain MAPE?"
common_mistakes:
  - "Random train and test split on time series data"
  - "Treating stockout days as zero demand"
  - "No simple baseline to compare against"
level: I3
topic: system-design
stop_id: regression-models
rubric:
  - point: "Clarifies the decision, horizon and cost of each error"
    keywords: ["clarify", "horizon", "replenish", "stockout", "waste"]
  - point: "Corrects sales history for stockouts"
    keywords: ["out of stock", "stockout", "demand", "sales"]
  - point: "Calendar, festival, price and promotion features with lags"
    keywords: ["lag", "festival", "promotion", "price", "weather"]
  - point: "Baseline first, then one global model across series"
    keywords: ["baseline", "global", "gradient", "seasonal"]
  - point: "Backtesting over time and quantile forecasts"
    keywords: ["backtest", "quantile", "rolling", "bias", "error"]
answer_seconds: 140
example: "For 300 dark stores and 20,000 products, I would first clarify what the forecast drives. It is daily replenishment, so the horizon is 7 days, and I need the cost of waste against a stockout. For the data, I would not treat sales as demand. On days when an item was out of stock, I mark the row so the model does not learn a false zero. Features are lags and rolling averages, day of week, festival days, price, promotion flags and weather. I would start with a seasonal baseline, the same weekday last week, and then train one global gradient-boosted model across all stores and products, because most series are sparse. I would evaluate by backtesting on rolling weeks and watch the bias, not only the error. For fresh items I would forecast a quantile to set safety stock. The trade-off is accuracy against cost: a nightly run must finish before ordering starts."
