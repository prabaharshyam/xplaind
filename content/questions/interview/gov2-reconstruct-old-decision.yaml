id: gov2-reconstruct-old-decision
question: "A customer complains about a loan rejection that an AI-assisted process made eight months ago. Your team cannot say which model version or rules were used. What do you do now, and what do you change?"
kind: scenario
short_answer: "Now: gather what exists, such as application data, timestamps, deployment history and reviewer notes, answer the customer honestly, and have a person review the case again. Then change record keeping: each decision stores the input, model and rule versions, output, reasons and reviewer, kept for a defined retention period, so that a decision can be reconstructed."
deeper_answer: "Records exist so that a decision can be explained and, if needed, corrected long after it was made. If we cannot reconstruct it, we cannot show it was fair, and a regulator or a court will not accept 'the model decided'. The honest short-term answer is to say what we can and cannot show, and to review the case again on its facts.\n\nFor the fix, I define the decision record with legal and the business: what to store, who can read it, and how long. Retention is a balance. Disputes and lending rules can need records for years, but privacy law says personal data should not be kept longer than needed. So I set a period per record type with a reason, store only what is needed to explain the decision, restrict access, and delete on schedule. I also test it: twice a year, pick ten old decisions and try to explain each from the records. Interviewers listen for versioning, reasoning about retention and the reconstruction test."
follow_ups:
  - "How long would you keep these records, and who decides?"
  - "How does this fit with the duty to delete personal data?"
  - "How do you prove a log was not changed afterwards?"
common_mistakes:
  - "Guessing the answer for the customer"
  - "Keeping everything for ever to be safe"
  - "Logging outputs but not the model and rule versions"
level: P1
topic: governance
stop_id: audit-logs
rubric:
  - point: "Collects the evidence that exists and has a person review the case again"
    keywords: ["evidence", "deployment history", "review the case again"]
  - point: "Is honest with the customer about what can be shown"
    keywords: ["honestly", "what we can show"]
  - point: "Decision record: input, model and rule version, output, reasons, reviewer"
    keywords: ["model version", "rule version", "main reasons", "reviewer"]
  - point: "Sets a retention period that balances disputes and privacy"
    keywords: ["retention", "delete", "privacy", "years"]
  - point: "Tests that old decisions can be reconstructed"
    keywords: ["reconstruct", "ten old decisions", "explain each"]
answer_seconds: 150
example: "First I would collect the evidence we do have: the application data, the timestamp, the deployment history from the engineering team, and any notes from the credit officer. From the deployment history we can often work out which model version was live that week. I would tell the customer honestly what we can show, and a senior officer would review the case again on its facts. Then the fix. Every decision would store a record: the input, the model version and rule version, the score, the main reasons and the reviewer. With legal we would set a retention period, for example some years for lending disputes, and delete after that for privacy. Finally, every six months I would pick ten old decisions and test if we can reconstruct and explain each one."
