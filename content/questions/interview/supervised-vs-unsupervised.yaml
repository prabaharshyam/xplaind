id: supervised-vs-unsupervised
question: "What is the difference between supervised and unsupervised learning?"
short_answer: "Supervised learning trains on examples with known answers, such as emails labelled spam or not, and learns to predict the label. Unsupervised learning has no labels and finds structure on its own, such as grouping customers into segments. Language model pre-training is often called self-supervised: the next word is the label."
deeper_answer: "In supervised learning you have input and output pairs and measure success by comparing predictions with the true outputs, for example classification and regression. In unsupervised learning you only have inputs and look for patterns: clustering, dimensionality reduction, anomaly detection.\n\nSelf-supervised learning sits between them: the labels come from the data itself. Predicting the next token in text needs no human labelling, which is why models can train on enormous corpora. Fine-tuning a model on labelled examples is then supervised again."
follow_ups:
  - "Where does reinforcement learning fit?"
  - "Why is next-token prediction called self-supervised?"
common_mistakes:
  - "Saying unsupervised means no data is needed"
  - "Mixing up clustering and classification"
