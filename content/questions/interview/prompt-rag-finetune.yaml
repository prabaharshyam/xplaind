id: prompt-rag-finetune
question: "When would you use prompting, RAG or fine-tuning?"
short_answer: "Start with prompting: it is fastest and cheapest to change. Add RAG when the model needs knowledge it lacks, especially private or changing information. Consider fine-tuning when you need a consistent behaviour, style or format that prompting cannot reach, have many good examples, and can evaluate the result."
deeper_answer: "The approaches solve different problems. RAG adds knowledge at question time and keeps it current. Fine-tuning changes behaviour: tone, output format, a narrow skill, or getting a smaller, cheaper model to match a bigger one on one task. It is a poor way to add facts that change, because you must retrain to update them.\n\nThey also combine: a fine-tuned model can still use RAG. A strong answer mentions evaluation first (you cannot choose without a test set), the cost of maintaining training data, and the order: prompt, then retrieval, then fine-tuning, moving on only when measurements show the simpler step is not enough."
follow_ups:
  - "Can you combine RAG and fine-tuning? Give an example."
  - "What do you need before fine-tuning is worth trying?"
common_mistakes:
  - "Proposing fine-tuning to teach a model facts that change weekly"
  - "Choosing an approach without mentioning how you would measure it"
level: P3
