example: "For a bank's FAQ assistant: prompting got the tone and format right in a day. The model did not know the bank's current interest rates, so we added RAG over the rate pages, which update often. Much later, to classify complaints into 40 categories the regulator required, we fine-tuned a smaller model on thousands of labelled complaints, because prompting alone could not hit the accuracy we needed."
