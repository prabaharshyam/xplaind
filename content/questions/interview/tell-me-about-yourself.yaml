id: tell-me-about-yourself
question: "Tell me about yourself."
kind: real-life
short_answer: "Give a two-minute summary in three parts: where you are now, what you have done that matters for this job, and why you are here today. Use one or two proofs, such as a project or a result with a number. End by linking yourself to the role. Do not read out your resume."
deeper_answer: "The interviewer is checking whether you can speak clearly and whether you understand what the job needs. This answer also decides the next questions, so mention the things you want to be asked about.\n\nUse present, past, future. Present: your current role or course in one line. Past: one or two pieces of work that match the job, with what you did and the result. Future: why this role is the next step. A good closing line is: \"That project showed me I enjoy making language models reliable, and that is why I applied for this GenAI role.\" Practise aloud until it takes under two minutes."
follow_ups:
  - "Which of those projects are you most proud of?"
  - "Why did you choose AI and not general software development?"
  - "What are you learning at present?"
common_mistakes:
  - "Reading the resume line by line"
  - "Starting from school marks and family background"
  - "Speaking for five minutes with no clear end"
level: B2
topic: behavioral
stop_id: portfolio-job-search
all_roles: true
asked_often: true
rubric:
  - point: "Starts with the present: current role, course or situation in one line"
    keywords: ["currently", "final year", "working as", "right now", "i am a"]
  - point: "Gives one or two relevant pieces of work and their own part in them"
    keywords: ["built", "project", "worked on", "internship"]
  - point: "Includes a result or proof, ideally a number"
    keywords: ["result", "percent", "per cent", "raised", "improved", "used it", "users"]
  - point: "Ends by linking to this role and why they applied"
    keywords: ["this role", "applied", "next step", "looking for", "that is why"]
answer_seconds: 120
example: "I am in the final year of BTech in computer science at a college in Coimbatore. In the last year I have focused on applied AI. My main project is a question-answering tool over our department's lecture notes. I built the retrieval part, wrote 60 test questions, and raised correct answers from 31 to 49 by fixing how the notes were split. About 80 classmates used it before the exams. I also did a two-month internship where I cleaned support tickets for a classification model. I enjoy the testing and fixing side of this work, more than only calling an API. That is why I applied for your GenAI engineer trainee role."
