id: sr-eng-error-budget-spent-launches-waiting
question: "Your shared inference gateway has a 99.9% availability target, but five incidents this quarter have used up the whole error budget, and product teams still want to ship three launches through it this month. What do you do?"
kind: scenario
short_answer: "I would use the error budget as it was designed: when it is spent, reliability work comes before new launches. I would pause risky changes to the gateway, fix the top causes from the five incidents, and let launches proceed only if they add no risk or accept a lower target. Leadership gets the trade-off with numbers."
deeper_answer: "99.9% allows about 43 minutes of downtime a month. The budget exists so that the argument between speed and stability is decided by data, not by who argues hardest. If the budget is gone and nothing changes, the target means nothing. But a blunt stop on all work is also poor judgement: some launches only add traffic to stable paths, while others need new gateway features.\n\nSo classify the three launches by the risk they add, and classify the five incidents by cause. If three came from one upstream provider timing out with no fallback route, fixing that one weakness gives most of the reliability back. Offer leadership real options: delay two launches by three weeks, or formally accept 99.5% for this quarter and tell dependent teams. Interviewers listen for respect for the target as a contract, grouping of root causes, risk-based exceptions, and a decision owned by the business."
follow_ups:
  - "How much downtime does 99.9% allow in a month, and how do you work it out?"
  - "A vice president insists that all three launches go ahead. What do you do?"
  - "How would you decide whether 99.9% is the right target at all?"
common_mistakes:
  - "Ignoring the error budget when launches are important"
  - "Stopping all changes without looking at the risk of each"
  - "Deciding alone instead of giving the business the trade-off"
