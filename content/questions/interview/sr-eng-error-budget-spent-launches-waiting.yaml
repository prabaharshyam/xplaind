example: "A 99.9% target allows about 43 minutes of downtime a month, and we have spent the error budget for the quarter. For me that means reliability work comes first, or the target means nothing. I would pause risky changes to the gateway itself and group the five incidents by cause. If three came from one provider timing out with no fallback route, we fix that this week. Then I look at each launch. One only adds traffic on an existing path, so after a load test it can go. Two need new routing features, and those are the risk. I would take two options to leadership: delay those two launches by three weeks, or accept a lower target of 99.5% this quarter and tell every team that depends on us. They choose, with the numbers in front of them."
