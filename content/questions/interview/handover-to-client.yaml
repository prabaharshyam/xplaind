id: handover-to-client
question: "How do you hand over an AI system to the client's team?"
short_answer: "Plan it from the start. Provide documentation for different readers: how to use it, how to run and monitor it, how it is built, and why key decisions were made. Hand over the eval set and how to run it, runbooks for common failures, and access and secrets transfer. Pair with their engineers before leaving and agree a support window."
deeper_answer: "The Diátaxis approach separates tutorials, how-to guides, reference and explanation, which helps each reader find what they need.\n\nThe real test of a handover is whether the client's team can change a prompt, re-run evals and fix a common incident without you. Run that test before the engagement ends."
follow_ups:
  - "What goes into a runbook?"
  - "How would you check the client can run it without you?"
common_mistakes:
  - "A single giant document nobody reads"
  - "Leaving without handing over evals"
