id: handover-to-client
question: "How do you hand over an AI system to the client's team?"
kind: real-life
short_answer: "Plan it from the start. Provide documentation for different readers: how to use it, how to run and monitor it, how it is built, and why key decisions were made. Hand over the eval set and how to run it, runbooks for common failures, and access and secrets transfer. Pair with their engineers before leaving and agree a support window."
deeper_answer: "The Diátaxis approach separates tutorials, how-to guides, reference and explanation, which helps each reader find what they need.\n\nThe real test of a handover is whether the client's team can change a prompt, re-run evals and fix a common incident without you. Run that test before the engagement ends."
follow_ups:
  - "What goes into a runbook?"
  - "How would you check the client can run it without you?"
common_mistakes:
  - "A single giant document nobody reads"
  - "Leaving without handing over evals"
level: P1
topic: client-delivery
stop_id: documentation-handover
rubric:
  - point: "Documentation for different readers"
    keywords: ["documentation", "docs", "guide", "reader", "user guide"]
  - point: "Eval set and how to run it"
    keywords: ["eval", "test set"]
  - point: "Runbooks for failures"
    keywords: ["runbook", "incident", "failure"]
  - point: "Access and secrets transfer"
    keywords: ["access", "secret", "credential"]
  - point: "Pairing, training and a support window"
    keywords: ["pair", "train", "support", "shadow", "without you"]
answer_seconds: 90
example: "At the end of a support-assistant project, I left a user guide for agents, an operations runbook covering the five most common failures, an architecture document with why we chose each component, and the eval set with a one-command script to run it. For two weeks their engineers ran deployments while I watched, and we agreed a month of email support. They ran their first model update on their own."
