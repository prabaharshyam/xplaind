id: incident-response-steps
question: "An employee's laptop shows signs of malware at 11 pm. Walk me through your incident response."
kind: scenario
short_answer: "I follow the plan's phases: prepare, detect and analyse, contain, eradicate, recover, and learn. Tonight that means confirming the alert, isolating the laptop from the network without wiping it, disabling or resetting the user's sessions and credentials, scoping whether other machines are affected, keeping evidence, informing the right people, and later writing a blameless review."
deeper_answer: "Analysis first: is it real, what malware, when did it start, which accounts and data did that laptop reach? Contain quickly but carefully: network isolation through the EDR tool keeps memory and disk evidence, while pulling the plug or reimaging destroys it. Reset the user's password and revoke tokens, because stolen sessions outlive the malware.\n\nScope by searching the SIEM and EDR for the same indicators across the company. Eradicate by reimaging and closing the entry point, such as a malicious attachment or an unpatched browser. Recover with monitoring. Keep a timeline as you go. In India, certain cyber incidents must be reported to CERT-In within six hours of noticing them, so legal and leadership need to know early. End with a post-incident review and concrete fixes."
follow_ups:
  - "Why not just reimage the laptop straight away?"
  - "Who do you inform, and when?"
common_mistakes:
  - "Wiping the machine before collecting evidence or scoping"
  - "Forgetting to revoke the user's sessions and tokens"
level: I1
topic: security
stop_id: incident-response-basics
rubric:
  - point: "Names the phases: prepare, detect/analyse, contain, eradicate, recover, lessons"
    keywords: ["contain", "eradicate", "recover", "lessons", "phase"]
  - point: "Isolates without destroying evidence"
    keywords: ["isolate", "evidence", "edr", "not wipe", "preserve"]
  - point: "Resets credentials and revokes sessions"
    keywords: ["reset", "password", "revoke", "session", "token"]
  - point: "Scopes for other affected systems"
    keywords: ["scope", "other machines", "indicator", "ioc", "search"]
  - point: "Communication, reporting and a blameless review"
    keywords: ["inform", "cert-in", "report", "review", "post-incident", "blameless"]
answer_seconds: 120
example: "In a tabletop drill at a hypothetical Pune logistics firm, the EDR flagged a sales laptop. I isolated it through the EDR console, reset the user's password and revoked her sessions, then searched for the file hash and the domain it called. One more laptop matched and was isolated too. We kept a timeline, the security lead decided on CERT-In reporting with legal, and the review led to blocking macro-enabled attachments from outside."
