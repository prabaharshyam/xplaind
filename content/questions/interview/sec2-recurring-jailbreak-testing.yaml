example: "A red-team report describes one version of the system on one day. Since then the model has been updated, the system prompt has had many edits and a new attack style appears every few weeks. So things change on both sides. I would turn the old findings into a versioned attack set of about 400 prompts, grouped by goal: system prompt leak, harmful advice, data theft and tool misuse. Each has a variant in Hindi, in role play and in encoded text. The set runs in CI on every change to the prompt or model, and nightly against production settings. A grader marks each attack, and we track the success rate on a trend chart. A rise above the threshold will block the release. One engineer is the owner. Each quarter we do a manual exercise, and we add every new finding and incident to the set."
