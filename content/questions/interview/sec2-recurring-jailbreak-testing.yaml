id: sec2-recurring-jailbreak-testing
question: "Your chatbot passed a red-team exercise before launch six months ago. Why is that not enough, and what does a regular jailbreak testing process look like?"
kind: concept
short_answer: "The system and the attacks both change: new model versions, prompts, tools and documents, and new jailbreak techniques. So I keep a versioned set of attack prompts, run it automatically on every change and on a schedule, track the success rate, and block releases that get worse. Manual red teaming continues, and each new finding joins the set."
deeper_answer: "A red-team report describes one version of the system on one day. Since then the model, the system prompt and the tools have changed, and new attack styles have been published. Any of these can reopen a closed hole. So the one-off exercise must become a regression suite and a routine.\n\nThe suite holds attack prompts grouped by goal: leaking the system prompt, harmful content, data exfiltration, misuse of tools. It includes variants such as role play, encoding, other languages and multi-turn build-up. It runs in CI when a prompt or model changes, and nightly against production settings, with a grader that decides whether each attack worked. Results go on a trend chart with thresholds that block a release. The set must stay fresh, so someone owns it. That person adds cases from incidents, bug reports, public research and periodic manual testing, since automated sets miss creative attacks. Interviewers listen for automation, upkeep, gating and ownership."
follow_ups:
  - "How do you decide automatically whether an attack succeeded?"
  - "Where do new attack cases come from?"
  - "What would you do when a model upgrade doubles the attack success rate?"
common_mistakes:
  - "Treating a passed red-team exercise as permanent"
  - "Running the same old attack set and never adding to it"
  - "Having no owner and no release gate for the results"
level: P1
