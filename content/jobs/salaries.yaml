# JB-1: AI jobs and salaries in India, one entry per role roadmap.
# Salaries are typical yearly CTC in lakh rupees (LPA), from published salary data and job
# posts. Sources disagree, so these are middle-of-the-road bands, not offers: big tech, global
# AI labs and Bengaluru pay more; IT services and smaller cities pay less. Re-check every quarter
# and update `checked`.
checked: 2026-11-02
sources:
  - name: Glassdoor India salaries
    url: https://www.glassdoor.co.in/Salaries/index.htm
  - name: AmbitionBox salaries
    url: https://www.ambitionbox.com/salaries
  - name: Instahyre, AI/ML engineer salary in India 2026
    url: https://resources.instahyre.com/blog/ai-engineer-salary-in-india/
  - name: foundit (Monster India) job postings
    url: https://www.foundit.in/
roles:
  - path: ai-engineer
    search: AI Engineer
    bands:
      - { years: "0–2 years", min: 6, max: 12 }
      - { years: "3–5 years", min: 12, max: 25 }
      - { years: "6+ years", min: 25, max: 50 }
    skills:
      - Python for production code
      - Calling LLM APIs (OpenAI, Anthropic, Gemini)
      - RAG with a vector database
      - Machine learning basics (scikit-learn)
      - SQL
      - Docker and one cloud (AWS, Azure or GCP)
      - Git and REST APIs
  - path: genai-engineer
    search: Generative AI Engineer
    bands:
      - { years: "0–2 years", min: 8, max: 15 }
      - { years: "3–5 years", min: 18, max: 35 }
      - { years: "6+ years", min: 35, max: 65 }
    skills:
      - Python
      - Prompt engineering and structured outputs
      - RAG pipelines and vector databases
      - LangChain or LlamaIndex
      - Evaluating LLM output
      - Fine-tuning basics (LoRA)
      - Deploying an LLM app on cloud
  - path: agentic-ai-expert
    search: Agentic AI Engineer
    bands:
      - { years: "0–2 years", min: 6, max: 12 }
      - { years: "3–5 years", min: 15, max: 30 }
      - { years: "6+ years", min: 30, max: 60 }
    skills:
      - Python
      - Building multi-step agents with tool use
      - LangGraph, CrewAI or AutoGen
      - MCP (Model Context Protocol)
      - RAG and memory for agents
      - Agent evaluation and monitoring
      - APIs and cloud deployment
  - path: forward-deployed-engineer
    search: Forward Deployed Engineer
    bands:
      - { years: "0–2 years", min: 12, max: 25 }
      - { years: "3–5 years", min: 25, max: 50 }
      - { years: "6+ years", min: 50, max: 90 }
    skills:
      - Strong Python and one more language (TypeScript or Java)
      - Building LLM and RAG apps for real customers
      - SQL and data integration
      - Cloud and Docker
      - Talking to clients and scoping problems
      - Debugging in production
      - Writing clear technical docs
  - path: ml-engineer
    search: Machine Learning Engineer
    bands:
      - { years: "0–2 years", min: 5, max: 10 }
      - { years: "3–5 years", min: 10, max: 20 }
      - { years: "6+ years", min: 20, max: 40 }
    skills:
      - Python, NumPy and pandas
      - scikit-learn and model evaluation
      - Deep learning with PyTorch or TensorFlow
      - Statistics and feature engineering
      - SQL
      - Model deployment (FastAPI, Docker)
      - MLOps basics
  - path: mlops-engineer
    search: MLOps Engineer
    bands:
      - { years: "0–2 years", min: 6, max: 10 }
      - { years: "3–5 years", min: 10, max: 22 }
      - { years: "6+ years", min: 20, max: 35 }
    skills:
      - Docker and Kubernetes
      - CI/CD pipelines
      - MLflow or another experiment tracker
      - One cloud ML platform (SageMaker, Vertex AI, Azure ML)
      - Model monitoring and drift
      - Python and Linux
      - Serving LLMs (vLLM or similar)
  - path: ai-automation-specialist
    search: AI Automation Engineer
    bands:
      - { years: "0–2 years", min: 4, max: 8 }
      - { years: "3–5 years", min: 8, max: 18 }
      - { years: "6+ years", min: 15, max: 28 }
    skills:
      - n8n, Make or Zapier
      - Calling LLM APIs inside workflows
      - APIs, webhooks and JSON
      - Basic Python or JavaScript
      - Google Sheets, CRMs and databases
      - Mapping and documenting business processes
  - path: ai-product-manager
    search: AI Product Manager
    bands:
      - { years: "0–2 years", min: 10, max: 20 }
      - { years: "3–5 years", min: 18, max: 40 }
      - { years: "6+ years", min: 40, max: 75 }
    skills:
      - Product discovery and writing specs
      - How LLMs work and where they fail
      - Defining AI quality metrics and evals
      - Data and SQL for decisions
      - Prioritising and roadmaps
      - Working with engineers and designers
      - Responsible AI basics
  - path: ai-governance-specialist
    search: AI Governance
    bands:
      - { years: "0–2 years", min: 5, max: 10 }
      - { years: "3–5 years", min: 10, max: 22 }
      - { years: "6+ years", min: 20, max: 45 }
    skills:
      - India's DPDP Act and the EU AI Act
      - AI risk assessment and model documentation
      - Bias and fairness testing
      - Privacy and data protection
      - ISO 42001 and NIST AI RMF
      - Audit and policy writing
