id: ai-feature-brief
title: An AI feature brief
difficulty: intermediate
hours: 14
summary: Write the product brief for one AI feature in an Indian consumer app, covering the problem, design, eval
  plan, metrics, pricing, risks and launch plan, with a prototype and 20 eval cases.
lessons:
- choosing-ai-problem
- build-vs-buy
- ux-uncertain-output
- hitl-product-design
- kpi-that-matters
- ai-data-strategy
- pricing-ai-features
- change-management
you_will_need:
- A real Indian consumer app you know well
- A free prototyping tool, or paper and a phone camera
steps:
- title: Pick the problem
  body: Choose one user problem the AI feature solves, with evidence such as reviews or support complaints, and
    say why AI is the right tool.
  hint: If a simpler fix would work, say so and pick another problem.
  done_when: A problem statement with evidence.
- title: Design the experience
  body: Sketch the flow, including how the feature shows uncertainty, how users correct it, and when a person takes
    over.
  hint: Design the moment the AI is wrong.
  done_when: A sketch or prototype of the main flow and the failure case.
- title: Write the eval plan
  body: Write 20 example cases, from easy to adversarial, with what a good output looks like, and the launch bar.
  hint: Include Indian languages or Hinglish if your users write them.
  done_when: Twenty cases and a launch bar.
- title: Define metrics and pricing
  body: Choose a primary metric, guardrails and adoption measure, and estimate cost per use and a pricing or packaging
    choice.
  hint: Cost per user per month decides whether it can be free.
  done_when: A metrics table and a cost and pricing section.
- title: List risks and the launch plan
  body: List risks such as wrong answers, bias, privacy and cost, each with an owner and mitigation, and plan a
    staged launch with a stop condition.
  hint: Say what would make you pause the launch.
  done_when: A risk table and a launch plan.
- title: Assemble the brief
  body: Put it together in six pages with the prototype, and ask someone to read it and say what is unclear.
  hint: Lead with the problem and the decision you need.
  done_when: A six-page brief, reviewed once.
rubric:
- criterion: Problem first
  strong: Real evidence, and AI justified over simpler fixes.
  weak: AI added because it is new.
- criterion: Design for errors
  strong: Uncertainty, correction and hand-off designed.
  weak: Only the happy path.
- criterion: Eval plan
  strong: Twenty varied cases and a clear launch bar.
  weak: '''We will test it''.'
- criterion: Business sense
  strong: Metrics, guardrails, cost and pricing with numbers.
  weak: No cost or success measure.
- criterion: Launch discipline
  strong: Risks owned and a staged launch with stop conditions.
  weak: Launch to everyone at once.
deliverables:
- A six-page brief
- A clickable or annotated prototype
- An eval plan with 20 example cases
stretch:
- Run five user interviews on the prototype.
- Test five eval cases on a real model and report the results.
drafted_with_ai: true
reviewed_by: "Shyam Prabahar"
reviewed_on: 2026-10-27
