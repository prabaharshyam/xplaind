id: red-team-an-llm-app
title: Red-team your own LLM app
difficulty: advanced
hours: 20
summary: Run an authorised red-team exercise on your own RAG chatbot. Threat model it, attack it with manual tests and an
  open-source scanner such as promptfoo or garak, write a findings report, fix the worst issues, and turn every successful
  attack into a regression suite that runs in CI.
lessons:
- llm-app-threats
- prompt-injection
- permission-aware-rag
- ai-threat-modeling
- ai-red-teaming
- guardrails
- evals-test-sets
- security-testing-ci
you_will_need:
- Your own RAG chatbot from an earlier project, running on your own machine or a staging copy you control
- Node.js for promptfoo or Python for garak
- A GitHub repository with GitHub Actions
- An LLM API key with a small spending limit
steps:
- title: Write the scope
  body: Write a one-page scope for your own app only. Name the system and environment, what is in and out of scope, the
    test accounts you will use, and your spending limit. Never point these tools at a system you do not own or have written
    permission to test.
  hint: Real red teams always start with written permission; practise the habit.
  done_when: A signed-off scope page in the repository.
- title: Threat model the app
  body: Draw the data flow, from user to app to retrieval to model to any tools, and mark trust boundaries. List threats with
    STRIDE and the OWASP Top 10 for LLM apps, such as indirect injection through documents, one user seeing another's data,
    system prompt leakage and cost abuse.
  hint: Add two test users with different document permissions so leakage can be tested.
  done_when: A diagram and a threat table with at least eight threats ranked by impact.
- title: Probe by hand
  body: Spend a few hours testing manually against the threat table. Try direct jailbreaks, indirect injection planted in a
    test document, requests for another user's documents, and prompts in Hindi or another Indian language. Record each attempt
    and result.
  hint: Write down failed attempts too; they show coverage.
  done_when: A log of at least 30 manual attempts with outcomes.
- title: Run an automated scan
  body: Configure promptfoo red teaming or garak against your app's endpoint, choose plugins or probes that match your threat
    table, and run it. Check a sample of the judged results by hand, because automated judges make mistakes.
  hint: Start with a small run to check cost and speed.
  done_when: A saved scan report and a note on how many judge verdicts you checked and how many you disagreed with.
- title: Write the findings report
  body: For each real finding, write the steps to reproduce, impact, severity, affected component and a suggested fix.
    Include the attack success rate per category and say clearly what you did not test.
  hint: Severity follows impact on users and data, not how clever the attack was.
  done_when: A findings report with severities and a coverage statement.
- title: Fix the worst issues
  body: Fix the top findings in code, not only in the prompt, for example permission filters inside the search, output
    encoding, tool limits or input length caps. Retest each finding.
  hint: A stronger system prompt alone is not a fix for a permissions bug.
  done_when: Each critical and high finding retested and marked fixed or accepted with a reason.
- title: Add a regression suite to CI
  body: Turn every successful attack into a test case and run the suite in GitHub Actions on every change to prompts,
    retrieval or model version. Fail the build if a fixed attack works again or the success rate rises above your limit.
  hint: Repeat each attack a few times, because model output varies.
  done_when: A CI run that passes, and one deliberately broken commit that fails it.
rubric:
- criterion: Authorisation and scope
  strong: Written scope limited to your own app, with test accounts and a cost limit.
  weak: No scope, or tests against systems you do not own.
- criterion: Threat model
  strong: Data flow with trust boundaries and threats ranked by impact.
  weak: A copied list of risks unrelated to the app.
- criterion: Testing
  strong: Manual and automated tests, judge results checked by hand, multilingual and indirect attacks included.
  weak: One automated run accepted as is.
- criterion: Findings and fixes
  strong: Reproducible findings with severity, fixed in code and retested.
  weak: Vague findings or prompt-only patches.
- criterion: Regression in CI
  strong: Every successful attack runs in CI and a regression fails the build.
  weak: Tests run once by hand.
deliverables:
- A scope page, data-flow diagram and threat table
- A findings report with severities and attack success rate per category
- A GitHub Actions workflow running the attack regression suite
stretch:
- Compare results from promptfoo and garak on the same app and explain the differences.
- Try PyRIT for multi-turn attacks and add the successful ones to the suite.
drafted_with_ai: true
