id: first-llm-app
title: A small app that uses an LLM API
difficulty: intermediate
hours: 8
summary: Build a small command-line or web app that uses an LLM API for one useful job, returns structured output
  your code can check, handles errors and retries, and reports what each request costs.
lessons:
- first-llm-api-call
- prompt-design
- tokens-and-context
- structured-output
- errors-retries-cost
you_will_need:
- Python 3 and an API key for a hosted model, kept in an environment variable
- A small budget limit set in the provider's console
steps:
- title: Pick one job
  body: Choose one narrow job, such as turning a job description into a list of skills or classifying support emails.
    Write three example inputs and the output you expect for each.
  hint: Narrow jobs are easier to check than open chat.
  done_when: You have a job, three inputs and three expected outputs.
- title: Make the first call
  body: Call the model with a clear system prompt and one example input. Print the reply, the input and output tokens
    and the cost.
  hint: Read the token counts from the response usage data.
  done_when: One call works and you can see its cost.
- title: Ask for structured output
  body: Define the output as a schema, such as a list of skills with a level for each, and make the app validate
    every reply against it.
  hint: Pydantic or a JSON schema makes the check one line.
  done_when: Every reply is valid, or the app says why not.
- title: Handle failures
  body: Add a timeout, retry rate-limit and server errors with backoff, and show a friendly message when the call
    still fails.
  hint: Do not retry errors caused by a bad request.
  done_when: Turning off the network gives a clear message, not a crash.
- title: Test on your examples
  body: Run all three examples and five new ones. Record which outputs were right and change the prompt to fix the
    mistakes.
  hint: Keep the examples in a file so you can rerun them after every change.
  done_when: You have a results table before and after your prompt change.
- title: Package and explain
  body: Add a README with what the app does, how to set the key, how to run it, the cost per request and the results
    table.
  hint: State the model you used and the date.
  done_when: Someone else can run it with their own key.
rubric:
- criterion: Useful, narrow job
  strong: A clear task with expected outputs written down first.
  weak: A general chat box with no defined job.
- criterion: Structured output
  strong: Every reply validated against a schema.
  weak: Free text parsed by hope.
- criterion: Robustness
  strong: Timeouts, retries and clear errors.
  weak: Crashes on the first slow call.
- criterion: Measured quality
  strong: A small test set and results before and after a change.
  weak: No testing beyond one example.
- criterion: Cost awareness
  strong: Cost per request measured and reported.
  weak: No idea what a request costs.
deliverables:
- A repository with the app and its test examples
- A results table on at least eight examples
- A README with the cost per request
stretch:
- Add a simple web page with FastAPI or Streamlit.
- Compare a small and a large model on your examples for quality and cost.
