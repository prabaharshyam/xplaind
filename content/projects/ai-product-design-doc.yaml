id: ai-product-design-doc
title: A written design for an AI product, with interview practice
difficulty: advanced
hours: 10
summary: Write a two-to-four page design for an AI product of your choice, covering users, metrics, components,
  failure modes, evaluation and cost, then answer ten interview questions about it out loud to a friend.
lessons:
- prompt-rag-or-finetune
- ai-system-design
- quality-cost-speed
- design-interview
you_will_need:
- A product idea for a real Indian business or public service
- A friend who can play the interviewer for 40 minutes
steps:
- title: Define users and success
  body: Write who uses the product, the task it helps with, and one success metric with today's baseline, such as
    minutes per case or answers per day.
  hint: A number now and a target later makes the design concrete.
  done_when: A short section with users, task, metric and baseline.
- title: Choose the approach
  body: Decide between prompting, retrieval and fine-tuning for each part of the problem, and say why in one or
    two sentences each.
  hint: Knowledge problems usually need retrieval; behaviour problems start with prompting.
  done_when: A table of choices with reasons.
- title: Draw the system
  body: List the components and draw the request flow from the user to the answer, including data stores, models
    and guardrails.
  hint: Boxes and arrows on paper are enough.
  done_when: A diagram and a one-paragraph walk-through.
- title: List failure modes
  body: For each component, write what can go wrong and what catches it, such as stale documents, wrong answers,
    injection, outages and cost spikes.
  hint: Every component fails somehow.
  done_when: A failure-mode table with a guard for each.
- title: Plan evaluation and cost
  body: Describe the test set, the metrics, the launch bar and an estimate of cost per request and per month.
  hint: Show the trade-off between quality, cost and speed for one choice.
  done_when: Evaluation and cost sections with numbers.
- title: Practise the interview
  body: Ask a friend to ask you ten questions about the design, including 'what happens when this part fails?'.
    Answer out loud and note the questions you struggled with.
  hint: Use the mock interview for practice beforehand.
  done_when: A list of the ten questions with notes on your answers.
rubric:
- criterion: Clear problem and metric
  strong: Users, task, baseline and target are concrete.
  weak: A vague goal such as 'use AI to improve service'.
- criterion: Justified approach
  strong: Each choice explained by the problem it solves.
  weak: A technology chosen because it is popular.
- criterion: Failure thinking
  strong: Every component has a failure mode and a guard.
  weak: Only the happy path.
- criterion: Evaluation and cost
  strong: A launch bar and a cost estimate with numbers.
  weak: '''We will test it'' and no numbers.'
- criterion: Communication
  strong: Clear, short document and calm answers under questioning.
  weak: Long text and answers that avoid the question.
deliverables:
- A two-to-four page design document
- A diagram of the system
- Notes on ten interview questions answered out loud
stretch:
- Ask a working engineer to review the design and record their questions.
- Build the riskiest part as a small prototype.
drafted_with_ai: true
reviewed_by: "Shyam Prabahar"
reviewed_on: 2026-10-27
