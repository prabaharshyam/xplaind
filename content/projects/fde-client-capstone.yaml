id: fde-client-capstone
title: An end-to-end client capstone
difficulty: advanced
hours: 40
summary: Pick a real public dataset and an imagined client. Write the discovery notes, scope, architecture and KPI,
  build the system, and present the results as you would to the client's leadership.
lessons:
- client-discovery
- kpi-that-matters
- scope-of-work
- poc-pilot-production
- executive-communication
- documentation-handover
- fde-case-study
- ai-system-design
you_will_need:
- A public dataset from an Indian industry you know, such as hospital, logistics or government scheme data
- Everything you built on this path
steps:
- title: Run a mock discovery
  body: Write the imagined client's problem in their words, map their current process with times and failure points,
    and list three use cases scored on value, feasibility, risk and effort.
  hint: Base the process on something you can observe or read about.
  done_when: A process map and a ranked use-case list with numbers.
- title: Agree the KPI and scope
  body: Choose one primary KPI with a baseline and target, two guardrails, and write a one-page scope of work with
    acceptance criteria and what is out of scope.
  hint: Write acceptance criteria as tests someone else could run.
  done_when: A one-page scope with a measurable KPI.
- title: Design the system
  body: 'Write a short design: components, request flow, failure modes and guards, evaluation plan and cost estimate.'
  hint: Reuse what you built on this path where it fits.
  done_when: A design document with a diagram.
- title: Build the proof of concept
  body: Build the riskiest part first on the real dataset and measure it against the acceptance criteria.
  hint: If it misses the bar, say so and show what you changed.
  done_when: A measured result against the gate.
- title: Build, deploy and evaluate
  body: Finish the system, deploy it, and produce an eval report with quality, cost and speed.
  hint: Keep the eval set from the proof of concept and grow it.
  done_when: A deployed system with an eval report.
- title: Present to leadership
  body: 'Make a ten-slide results deck and record a five-minute demo: the problem, the result against the baseline,
    the cost, the risks and the decision you are asking for.'
  hint: Lead with the result and end with a clear ask.
  done_when: A deck and a recorded demo.
rubric:
- criterion: Problem framing
  strong: A real process with numbers and a ranked choice.
  weak: A solution looking for a problem.
- criterion: Scope and KPI
  strong: Measurable KPI, baseline and testable acceptance criteria.
  weak: '''Improve efficiency with AI''.'
- criterion: Engineering
  strong: A deployed system with evals, guards and cost.
  weak: A notebook demo.
- criterion: Evidence
  strong: Results against the baseline, failures shown honestly.
  weak: Only success stories.
- criterion: Communication
  strong: A short deck and demo a busy leader would act on.
  weak: A long technical walk-through with no ask.
deliverables:
- A one-page scope of work with acceptance criteria
- The working system, deployed, with its eval report
- A ten-slide results deck and a recorded five-minute demo
stretch:
- Write a two-page case study for your portfolio.
- Present it to a working FDE and record their questions.
drafted_with_ai: true
reviewed_by: "Shyam Prabahar"
