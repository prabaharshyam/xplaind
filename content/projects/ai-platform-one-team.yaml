id: ai-platform-one-team
title: An AI platform for one team
difficulty: advanced
hours: 30
summary: Stand up a gateway, an open-weight model and a hosted model behind it, with tracing, cost dashboards, CI/CD
  for prompts and an incident runbook, all built from infrastructure as code.
lessons:
- docker-basics
- kubernetes-helm-basics
- llm-gateways
- vllm-open-weights
- environments-secrets-terraform
- versioning-prompts-models
- tracing-llm-apps
- ai-incident-response
you_will_need:
- A cloud account with a small budget alert, or a local Kubernetes cluster
- A GPU you can rent by the hour, or a small model that runs on CPU for testing
steps:
- title: Write the infrastructure
  body: 'Describe the platform in code: a cluster or container service, a secret store, logging and a database for
    traces, with staging and production.'
  hint: Start with staging only and copy it later.
  done_when: One command builds staging from nothing.
- title: Serve an open-weight model
  body: Serve a small open-weight model with vLLM behind an OpenAI-compatible endpoint, with health checks and resource
    limits.
  hint: Pin the model revision and the engine version.
  done_when: The endpoint answers and reports ready.
- title: Put a gateway in front
  body: Route both the open-weight model and a hosted model through a gateway with aliases, keys per team, budgets
    and a fallback.
  hint: Teams call aliases, never model names.
  done_when: Switching a route needs no app change.
- title: Version prompts and gate them
  body: Keep prompts in the repository with versions, and run an eval set in CI that blocks a release if quality
    drops.
  hint: Record the release id in every trace.
  done_when: A prompt change goes through CI and evals.
- title: Trace and dashboard
  body: Trace every request and build a dashboard with latency, cost and quality per route.
  hint: Tag traces with route, model and prompt version.
  done_when: A dashboard per route.
- title: Write and test the runbook
  body: Write a runbook for a provider outage and a cost spike, run a simulated incident and write a short blameless
    review.
  hint: Practise the fallback and the kill switch.
  done_when: A runbook and a review of one simulated incident.
rubric:
- criterion: Infrastructure as code
  strong: The platform rebuilds from code.
  weak: Hand-built resources.
- criterion: Serving
  strong: A pinned open-weight model with health checks and limits.
  weak: An unpinned model on a laptop.
- criterion: Gateway
  strong: Aliases, budgets, keys per team and a tested fallback.
  weak: Apps call providers directly.
- criterion: Delivery and observability
  strong: Versioned prompts gated by evals; traces and dashboards per route.
  weak: Manual prompt edits and no traces.
- criterion: Operations
  strong: A runbook tested in a simulated incident.
  weak: No plan for an outage.
deliverables:
- Infrastructure as code that builds the platform from scratch
- A dashboard with latency, cost and quality per route
- A runbook and a written review of one simulated incident
stretch:
- Quantize the open model and compare cost and quality.
- Add per-team monthly cost reports.
drafted_with_ai: true
reviewed_by: "Shyam Prabahar"
reviewed_on: 2026-10-27
