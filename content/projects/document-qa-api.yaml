id: document-qa-api
title: A document question-answering API
difficulty: intermediate
hours: 14
summary: Build a FastAPI service that takes a PDF, extracts its text and answers questions about it with a hosted
  model, packaged with Docker so a stranger can start it with one command.
lessons:
- python-for-production
- project-tooling
- fastapi-rest-apis
- files-tables-pdfs
- git-with-a-team
- docker-basics
- first-llm-api-call
- tokens-and-context
you_will_need:
- Python 3, Docker and Git
- An API key for a hosted model, kept in an environment variable
- Three public PDFs to test with, such as annual reports or policy documents
steps:
- title: Set up the project properly
  body: Create the repository with a package layout, a dependency file, a linter, a formatter and pytest. Add a
    .gitignore and an .env.example listing the settings the service needs.
  hint: Set the tooling up first; it is harder to add later.
  done_when: Linting and an empty test run both pass.
- title: Build the API skeleton
  body: 'Write a FastAPI app with three endpoints: upload a PDF, ask a question about an uploaded document, and
    a health check. Validate inputs with Pydantic models.'
  hint: Return a document id from the upload and use it in the question endpoint.
  done_when: The endpoints show in the automatic API docs and reject bad input with clear errors.
- title: Extract the text
  body: Extract text page by page, keep page numbers, and reject files that are not PDFs or are too large. Report
    scanned pages that have no text.
  hint: Put a size limit on uploads from the start.
  done_when: Each test PDF gives text with page numbers; a bad file gives a clear error.
- title: Answer questions
  body: Send the question and the most relevant pages to the model and return the answer with the page numbers it
    used. Fit the text to the context window and log tokens and cost.
  hint: For long documents, pick pages that share words with the question before sending them.
  done_when: Questions on your test PDFs get answers with page references.
- title: Write the tests
  body: 'Write at least five pytest tests: a good upload, a non-PDF, an oversized file, a question about a missing
    document and an answer path with the model call faked.'
  hint: Fake the model in tests so they are fast and free.
  done_when: Five or more tests pass in CI without an API key.
- title: Package with Docker
  body: Write a Dockerfile and a Compose file that start the service with one command, and a README a stranger can
    follow from clone to first answer.
  hint: Ask a friend to follow the README on their machine.
  done_when: docker compose up starts a working service on a fresh machine.
rubric:
- criterion: Clean API design
  strong: Clear endpoints, validated inputs and useful error messages.
  weak: One endpoint that does everything and crashes on bad input.
- criterion: Reliable extraction
  strong: Page numbers kept, bad and scanned files handled.
  weak: Text dumped with no pages and crashes on scans.
- criterion: Grounded answers
  strong: Answers cite the pages used; cost is logged.
  weak: Answers with no reference to the document.
- criterion: Tests
  strong: Five or more tests covering failure cases, with the model faked.
  weak: No tests, or tests that need a real API key.
- criterion: Runs anywhere
  strong: One command starts it from a README a stranger can follow.
  weak: Works only on the author's laptop.
deliverables:
- A public repository with a README that a stranger can follow
- A Dockerfile and a Compose file that start the service with one command
- Five pytest tests, including one for a bad file
stretch:
- Add OCR for scanned pages.
- Add a CI workflow that lints, tests and builds the image on every push.
drafted_with_ai: true
reviewed_by: "Shyam Prabahar"
reviewed_on: 2026-10-27
