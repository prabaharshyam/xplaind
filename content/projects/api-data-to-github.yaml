id: api-data-to-github
title: A script that calls a public API and is pushed to GitHub
difficulty: starter
hours: 6
summary: Write a Python script that calls a free public API, saves the results to a CSV, summarises them with pandas
  and lives in a GitHub repository with a clear history of small commits.
lessons:
- terminal-and-git
- packages-and-venv
- web-apis-json
- pandas-tables
you_will_need:
- Python 3, Git and a GitHub account
- A free public API that needs no payment, such as a public weather or exchange-rate service
steps:
- title: Set up the project
  body: Create a folder, a virtual environment and a Git repository. Add a .gitignore for the environment folder
    and any secrets file, then make your first commit.
  hint: Commit the .gitignore before anything else.
  done_when: git log shows one commit and the environment folder is not tracked.
- title: Call the API
  body: Use the requests library to call one endpoint and print the JSON. Check the status code and stop with a
    clear message if the call fails.
  hint: Set a timeout so the script never hangs.
  done_when: The script prints real data, and a bad URL gives a clear error.
- title: Keep keys out of the code
  body: If the API needs a key, read it from an environment variable, never from the code. Document the variable
    in the README.
  hint: A .env file is fine locally if it is in .gitignore.
  done_when: No key appears in any file in the repository.
- title: Save the results
  body: Turn the fields you need into rows and save them to a CSV with today's date in the file name.
  hint: Pick only the fields you will use.
  done_when: A dated CSV appears after each run.
- title: Summarise with pandas
  body: Load the CSV with pandas and print a short summary, such as averages, the highest values or a count by category.
  hint: groupby and describe cover most summaries.
  done_when: The summary prints and matches the data.
- title: Commit as you go and write the README
  body: 'Make a small commit after each working step with a clear message. Finish with a README: what it does, how
    to set it up, how to run it and an example of output.'
  hint: 'A good message says what changed: ''Save results to a dated CSV''.'
  done_when: The repository has at least five meaningful commits and a README.
rubric:
- criterion: Working call
  strong: Handles success and failure, with a timeout.
  weak: Crashes when the API is slow or down.
- criterion: Secrets
  strong: No key in the code or history.
  weak: A key committed, even once.
- criterion: Data handling
  strong: Only the needed fields, saved with a dated file name.
  weak: Raw JSON dumped with no structure.
- criterion: Git history
  strong: Small commits with clear messages that tell the story.
  weak: One big commit called 'final'.
- criterion: README
  strong: Setup and run steps that work on a fresh machine.
  weak: Missing or wrong instructions.
deliverables:
- A public GitHub repository with at least five meaningful commits
- A dated CSV of results and a printed summary
- A README with setup and run steps
stretch:
- Schedule the script to run daily with a GitHub Actions workflow.
- Add a chart of the results saved as an image.
