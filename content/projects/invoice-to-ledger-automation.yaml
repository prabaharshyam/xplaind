id: invoice-to-ledger-automation
title: An invoice-to-ledger automation
difficulty: intermediate
hours: 14
summary: Build a workflow that reads invoices from an inbox, extracts the fields with an AI step, asks a person
  to approve anything unusual and writes the result to a spreadsheet, then measure its error rate and ROI.
lessons:
- mapping-a-process
- first-n8n-workflow
- webhooks-basics
- document-extraction-automation
- human-approval
- automation-error-handling
- measuring-roi
- documentation-handover
you_will_need:
- n8n (the self-hosted Community Edition is free; n8n Cloud is paid after a trial), or another workflow tool with a free plan
- A test email inbox and 20 sample invoices with no real personal data
- A spreadsheet to act as the ledger
steps:
- title: Map the manual process
  body: Write down how invoices are handled today, step by step, with the time each takes and where mistakes happen.
  hint: Time yourself doing five invoices by hand.
  done_when: A process map with a time per invoice.
- title: Trigger on new email
  body: Build the workflow trigger for new emails with attachments in the test inbox, and save each attachment.
  hint: Filter out emails without invoices early.
  done_when: A new invoice email starts the workflow.
- title: Extract fields with AI
  body: 'Send each invoice to an AI step that returns structured fields: supplier, invoice number, date, amount,
    tax and due date. Validate the output.'
  hint: Reject outputs that fail validation instead of guessing.
  done_when: Fields come back in a fixed structure for your samples.
- title: Route unusual invoices to a person
  body: Flag invoices that are unusual, such as a new supplier, a large amount or a failed validation, and send
    them for approval before writing.
  hint: Write the rules down before building them.
  done_when: A large invoice waits for approval.
- title: Write to the ledger and handle errors
  body: Write approved invoices to the spreadsheet, avoid duplicates by invoice number, and send failures to an
    error queue with a notification.
  hint: Test with a duplicate and a broken file.
  done_when: The ledger fills correctly and failures are reported.
- title: Measure and hand over
  body: Run all 20 invoices, record the error rate and time per invoice, write a one-page ROI estimate and a short
    handover note.
  hint: Compare with the manual time you measured.
  done_when: Error rate, ROI estimate and handover note done.
rubric:
- criterion: Process understanding
  strong: Manual process mapped with times.
  weak: Built without knowing the current process.
- criterion: Reliable extraction
  strong: Structured, validated fields with failures caught.
  weak: Free-text output pasted into the sheet.
- criterion: Human in the loop
  strong: Clear rules route unusual invoices for approval.
  weak: Everything written automatically.
- criterion: Error handling
  strong: Duplicates prevented, failures queued and notified.
  weak: Silent failures and duplicate rows.
- criterion: ROI
  strong: Measured error rate and time saved, with an honest estimate.
  weak: Claims with no numbers.
deliverables:
- The exported workflow and a diagram of it
- A test run over 20 sample invoices with the error rate
- A one-page ROI estimate
stretch:
- Add a WhatsApp or email notification for approvals.
- Track monthly error rates over a longer test set.
drafted_with_ai: true
reviewed_by: 'UNREVIEWED: drafted by Claude, a person must review'
