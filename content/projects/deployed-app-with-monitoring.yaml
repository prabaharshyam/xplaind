id: deployed-app-with-monitoring
title: A deployed app with monitoring and a cost report
difficulty: advanced
hours: 14
summary: Deploy one of your LLM apps so others can use it, with secrets kept safe, logging of latency, errors and
  cost, caching where it helps, alerts, and a one-page cost report for a month of expected use.
lessons:
- deploy-and-monitor
- caching-and-speed
- cost-control
- security-privacy
you_will_need:
- An LLM app you built earlier
- A free or low-cost hosting account and an API key with a spend limit set
steps:
- title: Prepare for deployment
  body: Move every setting and secret into environment variables, add a health-check endpoint and make the app read
    its configuration at start-up.
  hint: The app should refuse to start without its key, with a clear message.
  done_when: The app runs locally with settings only from the environment.
- title: Deploy it
  body: Deploy to a managed platform with HTTPS. Keep the API key in the platform's secret settings, never in the
    code.
  hint: Choose a region close to your users.
  done_when: A public URL that serves the app.
- title: Log every request
  body: Log latency, tokens, cost, model, prompt version and errors for every request, without personal data.
  hint: Give each request an id so you can trace it.
  done_when: A log entry appears for each request.
- title: Add caching and limits
  body: Turn on prompt caching for the fixed part of your prompt, cap the output length and add a per-user daily
    limit.
  hint: Measure cost per request before and after.
  done_when: Cost per request drops and the limit works.
- title: Add a dashboard and alerts
  body: Build a simple dashboard of requests, errors, p95 latency and daily cost, and an alert when cost or errors
    pass a threshold.
  hint: A daily cost alert catches runaway scripts.
  done_when: The dashboard shows a week of data and one alert has fired in a test.
- title: Write the cost report
  body: 'Write one page: cost per request, expected monthly volume, monthly cost, what caching saved and what you
    would do if usage tripled.'
  hint: Use your measured numbers, not guesses.
  done_when: A one-page cost report with real numbers.
rubric:
- criterion: Secure deployment
  strong: Secrets in platform settings, HTTPS, no keys in the repository.
  weak: A key in the code or the front end.
- criterion: Observability
  strong: Every request logged with latency, cost and errors.
  weak: Only platform defaults, no cost data.
- criterion: Cost control
  strong: Caching, output caps and limits, with measured savings.
  weak: No limits and no idea of cost.
- criterion: Alerts
  strong: Thresholds that would catch a real problem, tested once.
  weak: No alerts.
- criterion: Cost report
  strong: Measured numbers, a monthly estimate and a plan for growth.
  weak: A guess with no evidence.
deliverables:
- A live URL for the app
- A dashboard screenshot with latency, errors and cost
- A one-page cost report
stretch:
- Add a fallback model for when the main provider fails.
- Run a load test and report p95 latency at your expected peak.
