id: rag-app-with-test-set
title: A RAG app over 20 documents with a test set
difficulty: intermediate
hours: 12
summary: 'Build a question-answering app over at least 20 public documents: split them into chunks, embed and search
  them, answer with citations, refuse when the documents are silent, and measure it with a 20-question test set.'
lessons:
- embeddings
- chunking
- vector-search
- rag-app
- check-retrieval
you_will_need:
- Python 3 and an API key for a hosted model
- At least 20 public documents on one subject, such as a government scheme's FAQs or a product's help pages
steps:
- title: Collect and clean the documents
  body: Gather at least 20 documents on one subject, convert them to text and keep each document's title and source
    link.
  hint: Public sources keep you clear of private data.
  done_when: A folder of text files with titles and links.
- title: Write the test set first
  body: Write 20 questions people would really ask, each with the document and passage that answers it. Make four
    of them unanswerable from the documents.
  hint: Ask a friend for five questions so the set is not only yours.
  done_when: A file of 20 questions with expected sources.
- title: Chunk and index
  body: Split documents into chunks of a few hundred words with a little overlap, embed them and store them in a
    vector index with their title and link.
  hint: Keep the chunk's heading with the chunk.
  done_when: Searching a test question returns plausible chunks.
- title: Measure retrieval
  body: For each answerable question, check whether the right passage is in the top five results. Record recall
    at five.
  hint: Retrieval problems are cheaper to fix than prompt problems.
  done_when: You have a recall-at-five number.
- title: Answer with citations and refusals
  body: Send the top chunks to the model with an instruction to answer only from them, cite the source for each
    claim and say it does not know when the chunks do not answer.
  hint: Give the model one example of a good refusal.
  done_when: Answers carry citations and the unanswerable questions are refused.
- title: Report
  body: 'Write a short report: recall at five, answer accuracy on the test set, refusal accuracy, and one change
    you made that improved a number.'
  hint: Show the failures, not only the successes.
  done_when: A report with numbers and at least three failure examples.
rubric:
- criterion: Test set
  strong: Written before tuning, with expected sources and unanswerable cases.
  weak: A few questions made up after the app worked.
- criterion: Retrieval measured
  strong: Recall at five reported and used to make changes.
  weak: Only the final answers looked at.
- criterion: Grounded answers
  strong: Each claim cites a real passage.
  weak: Answers with no sources or invented ones.
- criterion: Refusals
  strong: Unanswerable questions are refused politely.
  weak: The app guesses when documents are silent.
- criterion: Honest report
  strong: Numbers, failures and one measured improvement.
  weak: Only screenshots of good answers.
deliverables:
- A repository with the app and the 20-question test set
- A report with recall at five, answer accuracy and refusal accuracy
- Three examples of failures and what you changed
stretch:
- Add keyword search and compare hybrid search with vector search alone.
- Add a reranker and measure the change in recall.
