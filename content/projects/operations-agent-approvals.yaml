id: operations-agent-approvals
title: An operations agent with approval gates
difficulty: advanced
hours: 22
summary: Build an agent that triages support tickets, drafts replies and refund actions, and waits for a person
  to approve anything that changes a customer record, with traces, a budget and a kill switch you can show working.
lessons:
- agent-loop
- agent-tool-design
- langgraph-basics
- mcp-servers-clients
- human-approval
- guardrails
- agent-permissions-sandboxing
- agent-budgets-kill-switches
you_will_need:
- A set of 30 realistic sample support tickets and a fake customer database
- Python 3, an agent framework such as LangGraph, and an API key
steps:
- title: Design the tools
  body: 'Write a small set of tools: read a ticket, look up a customer, draft a reply, propose a refund and update
    a record. Mark which only read and which change data, and give each a strict input schema.'
  hint: Write tools for the task, not one per database table.
  done_when: A tool list with read or write marked and schemas defined.
- title: Build the agent graph
  body: 'Build the flow: triage the ticket, gather facts with read tools, draft the reply or action, then route
    to an approval step for anything that writes.'
  hint: Draw the graph first; it becomes your diagram.
  done_when: A ticket flows through the graph to a draft.
- title: Add approval gates
  body: Pause before every write and show a person the proposed action, the reason and the evidence. Approve, edit
    or reject, and resume from where it paused.
  hint: Saving state lets the agent wait for hours.
  done_when: A refund waits for approval and resumes after it.
- title: Add guardrails and limits
  body: Give tools the least permission, cap refund amounts, treat ticket text as data, and add a step limit, a
    per-run budget and a kill switch.
  hint: Plant an instruction in a ticket to test the guardrail.
  done_when: A malicious ticket cannot trigger an unapproved action.
- title: Trace ten real runs
  body: Run ten tickets, including two it should refuse, and keep a trace of each step with tools, inputs, outputs
    and cost.
  hint: Choose refusals that test judgement, such as a legal threat.
  done_when: Ten traces, two of them correct refusals.
- title: Show the controls
  body: Record the budget stopping a run and the kill switch turning the agent off, and write a README with the
    diagram, the traces and what you learnt.
  hint: Show the controls working, not just described.
  done_when: A recording or screenshots of both controls.
rubric:
- criterion: Tool design
  strong: Few, task-shaped tools with read and write separated.
  weak: One powerful tool that can do anything.
- criterion: Approval
  strong: Every write waits for a person with evidence shown.
  weak: Writes happen automatically.
- criterion: Safety
  strong: Injection test passes, permissions are minimal, limits enforced.
  weak: Ticket text can steer the agent.
- criterion: Evidence
  strong: Ten traces including correct refusals.
  weak: A single demo run.
- criterion: Controls shown working
  strong: Budget and kill switch demonstrated.
  weak: Controls only mentioned.
deliverables:
- A graph or flow diagram of the agent and its tools
- Traces of ten real runs, including two it should refuse
- A budget and kill switch that you show working
stretch:
- Expose the tools through an MCP server.
- Add a trajectory eval over 20 tickets.
drafted_with_ai: true
reviewed_by: 'UNREVIEWED: drafted by Claude, a person must review'
