id: multi-step-agent-with-logs
title: A multi-step agent with logs
difficulty: intermediate
hours: 12
summary: Build an agent that uses at least three tools to complete a multi-step task, logs every step it takes,
  stops safely when something goes wrong, and is tested on ten tasks including two it should refuse.
lessons:
- tool-calling
- agent-loop
- agent-logs
- agent-failures
you_will_need:
- Python 3 and an API key for a hosted model that supports tool calling
- A task with clear steps, such as planning a study timetable from a syllabus and a calendar
steps:
- title: Define the task and tools
  body: Write the task in one paragraph and list three to five tools the agent needs, each with a name, what it
    does and its inputs. Keep at least one tool read-only.
  hint: Fewer, clearer tools work better than many vague ones.
  done_when: A written task and a tool list with inputs.
- title: Build the loop
  body: 'Write the agent loop: call the model with the tools, run the tool it asks for, send the result back, and
    repeat until it answers. Set a maximum number of steps.'
  hint: Start with a limit of ten steps.
  done_when: The agent finishes a simple task in a few steps.
- title: Log every step
  body: 'Record each step as structured data: step number, tool, inputs, output, tokens and time. Save one log file
    per run.'
  hint: JSON lines are easy to read and search.
  done_when: Each run leaves a log you can read step by step.
- title: Handle failures
  body: Make a tool fail on purpose and check the agent stops or recovers instead of looping. Add a clear message
    when the step limit is reached.
  hint: Stop after the same error repeats twice.
  done_when: A broken tool produces a clean stop, not a loop.
- title: Test on ten tasks
  body: 'Run ten tasks: eight it should complete and two it should refuse or hand to a person. Record success, steps
    and cost for each.'
  hint: Refusals test whether the agent knows its limits.
  done_when: A results table for ten tasks.
- title: Explain it
  body: Write a README with a diagram of the loop and tools, the results table, one log walked through step by step,
    and what you would improve.
  hint: Walk through a failure; it shows you understand the agent.
  done_when: A README that someone could learn from.
rubric:
- criterion: Clear tools
  strong: Few tools with precise descriptions and inputs.
  weak: Many overlapping tools with vague names.
- criterion: Safe loop
  strong: Step limit, repeated-error stop and clean messages.
  weak: The agent can loop forever.
- criterion: Useful logs
  strong: Every step recorded with inputs, outputs, tokens and time.
  weak: Only the final answer saved.
- criterion: Tested
  strong: Ten tasks including refusals, with results.
  weak: One happy-path demo.
- criterion: Explanation
  strong: A walk-through of a real log, including a failure.
  weak: A description with no evidence.
deliverables:
- A repository with the agent, its tools and logs from ten runs
- A results table covering success, steps and cost
- A README with a diagram and one log explained
stretch:
- Add a human approval step before any tool that changes something.
- Rebuild it with a graph framework and compare the code.
drafted_with_ai: true
reviewed_by: "Shyam Prabahar"
reviewed_on: 2026-10-27
