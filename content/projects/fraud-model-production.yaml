id: fraud-model-production
title: A fraud model in production
difficulty: advanced
hours: 30
summary: Train a fraud model on a public transactions dataset, choose a cost-weighted metric, serve it behind an
  API, monitor it for drift and document it in a model card.
lessons:
- pandas-tables
- classification-models
- trees-boosting
- cross-validation-leakage
- choosing-a-metric
- experiment-tracking
- serving-ml-models
- monitoring-drift
you_will_need:
- A public fraud or transactions dataset
- Python 3 with pandas, scikit-learn and a gradient-boosting library
steps:
- title: Understand the data
  body: 'Explore the dataset: the fraud rate, time range, features and anything that could leak the label. Write
    down the business cost of a missed fraud and of a false alarm.'
  hint: Check for features computed after the transaction.
  done_when: A short data note with the class balance and leakage risks.
- title: Choose the metric
  body: Pick a metric that reflects the costs, such as precision at the alert volume analysts can handle, and explain
    why accuracy is wrong here.
  hint: With rare fraud, a model that says 'never fraud' looks accurate.
  done_when: A written metric choice with a reason.
- title: Compare three models
  body: Train a simple baseline, logistic regression and gradient-boosted trees with time-aware cross-validation,
    tracking every run.
  hint: Split by time, not at random.
  done_when: A comparison table from tracked runs.
- title: Serve it
  body: Serve the chosen model behind an API with input validation, the model version in each response and a fallback
    rule if the model fails.
  hint: Use the same feature code in training and serving.
  done_when: The API scores a transaction and rejects bad input.
- title: Monitor drift
  body: Save training baselines, compute drift on recent data and build a small dashboard with score distribution
    and alert rate.
  hint: Simulate a broken feature to test the alert.
  done_when: A dashboard and one drift alert from a simulated bug.
- title: Write the model card
  body: Document data, metric, results, limits, fairness checks across groups you can measure, and what would trigger
    retraining.
  hint: Be specific about where the model should not be used.
  done_when: A model card someone else could review.
rubric:
- criterion: Sound evaluation
  strong: Time-aware splits, leakage checked, cost-weighted metric.
  weak: Random splits and accuracy.
- criterion: Fair comparison
  strong: Three tracked models, including a baseline.
  weak: One model and no baseline.
- criterion: Serving
  strong: Validated input, versioned responses, a fallback.
  weak: A notebook as the product.
- criterion: Monitoring
  strong: Baselines, drift checks and a tested alert.
  weak: No monitoring.
- criterion: Documentation
  strong: A model card with limits and fairness checks.
  weak: No documentation.
deliverables:
- A notebook comparing three models with cross-validation
- A served model with a monitoring dashboard
- A model card covering data, metrics, limits and fairness checks
stretch:
- Run a shadow comparison of two model versions.
- Add a random holdout to learn from blocked transactions.
drafted_with_ai: true
