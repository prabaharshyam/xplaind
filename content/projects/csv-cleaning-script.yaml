id: csv-cleaning-script
title: A script that cleans a messy CSV
difficulty: starter
hours: 6
summary: Write a Python script that reads a messy CSV file, fixes common problems such as blank rows, stray spaces,
  mixed date formats and duplicates, writes a clean file and prints a short report of what it changed.
lessons:
- python-setup
- python-basics
- python-functions
- python-data-structures
- python-files-errors
you_will_need:
- Python 3 installed and a code editor
- A messy CSV, such as a sample sales or attendance export with at least 100 rows
steps:
- title: Look at the data
  body: 'Open the CSV and list every problem you can see: blank rows, extra spaces, different date formats, duplicate
    rows, numbers stored with commas or currency signs.'
  hint: Write each problem as one line in a notes file; it becomes your to-do list.
  done_when: You have a list of at least five problems, each with an example row.
- title: Read the file safely
  body: Write a function that reads the CSV with the csv module and returns a list of rows. Handle a missing file
    with a clear error message instead of a crash.
  hint: Use try and except around the open call.
  done_when: Running the script on a wrong file name prints a friendly message.
- title: Write one cleaning function per problem
  body: For each problem, write a small function that fixes one row, such as strip_spaces or parse_date. Keep each
    one short and give it a clear name.
  hint: Test each function on two or three example values in a small test block.
  done_when: Each function works on its examples.
- title: Remove duplicates and blanks
  body: Drop rows that are completely empty, then remove exact duplicates while keeping the first copy. Count how
    many you removed.
  hint: A set of tuples is an easy way to remember rows you have seen.
  done_when: The row counts before and after make sense.
- title: Write the clean file and a report
  body: 'Write the cleaned rows to a new CSV and print a report: rows read, rows removed, values fixed for each
    kind of problem.'
  hint: Never overwrite the original file.
  done_when: A new clean file exists and the report matches what you expect.
- title: Share it
  body: Put the script, a small sample of the messy data and a README on GitHub. The README says what the script
    fixes and how to run it.
  hint: Remove any real personal data from the sample first.
  done_when: Someone else can run it from the README.
rubric:
- criterion: Correct cleaning
  strong: Every listed problem is fixed, and the clean file opens without errors.
  weak: Some problems remain or new errors appear.
- criterion: Readable code
  strong: Small, well-named functions, each doing one thing.
  weak: One long block of code that is hard to follow.
- criterion: Error handling
  strong: A missing or broken file gives a clear message.
  weak: The script crashes with a traceback.
- criterion: Report
  strong: Counts of what changed, so the user can trust the output.
  weak: No report, or numbers that do not add up.
- criterion: README
  strong: Explains the problem, how to run it and an example of output.
  weak: No README, or only a file name.
deliverables:
- A GitHub repository with the script and a sample messy file
- A README with how to run it
- The printed report from one run
stretch:
- Rewrite the cleaning with pandas and compare the code length.
- Add command-line options for the input and output file names.
