id: secure-enterprise-copilot
title: A secure enterprise copilot
difficulty: advanced
hours: 24
summary: Extend your RAG assistant with sign-on, per-user document permissions, personal data masking and an audit
  trail, and write the security and compliance note a client's reviewers would ask for.
lessons:
- single-sign-on
- permission-aware-rag
- audit-logs
- data-quality-pii
- prompt-injection
- security-privacy
- ai-compliance
- security-questionnaires
you_will_need:
- Your RAG assistant from the LLM engineering stage
- A free developer account with an identity provider that supports OpenID Connect
steps:
- title: Add sign-on
  body: Add OpenID Connect sign-in with a maintained library, read the user's groups from the verified token and
    reject users outside the allowed groups.
  hint: Never trust a user id sent from the browser.
  done_when: Two test users can sign in; a user outside the group cannot.
- title: Store permissions with every chunk
  body: Record which groups may read each document and store them on every chunk; chunks with missing permissions
    are visible to nobody.
  hint: Deny by default.
  done_when: Every chunk carries its allowed groups.
- title: Filter inside the search
  body: Apply the user's groups as a filter inside the search, so restricted chunks never reach the model, and write
    tests for what each user must not see.
  hint: Test what users must not see, not only what they should.
  done_when: Two users asking the same question get different, correct answers.
- title: Mask personal data
  body: Detect personal data such as names, phone numbers and identity numbers in logs and in text sent to the model,
    and mask what the task does not need.
  hint: Measure how many test identifiers your masking catches.
  done_when: A masking test with its catch rate.
- title: Add an audit trail
  body: Log who asked what, which documents were retrieved, what the model answered and which versions were used,
    in a store users cannot change.
  hint: Leave answers' personal data out of the audit log unless required.
  done_when: An audit log sample for one session.
- title: Write the security note
  body: 'Write a two-page note: data flow diagram, where data is stored and processed, permissions, masking, injection
    defences, retention and deletion, and open risks.'
  hint: Answer the questions a bank's reviewer would ask.
  done_when: A two-page note a reviewer could sign off.
rubric:
- criterion: Identity
  strong: Verified tokens and group checks.
  weak: User identity taken from the request.
- criterion: Permissions
  strong: Filtered inside the search, deny by default, tested.
  weak: Filtered after retrieval, or not at all.
- criterion: Privacy
  strong: Masking measured and data minimised.
  weak: Personal data in logs and prompts.
- criterion: Auditability
  strong: A complete, tamper-resistant trail with versions.
  weak: No record of who saw what.
- criterion: Security note
  strong: Precise, honest and covers the reviewer's questions.
  weak: Vague claims such as 'industry-standard security'.
deliverables:
- A login flow and a test showing two users see different documents
- An audit log sample and a data-flow diagram
- A two-page security and compliance note
stretch:
- Run your assistant against ten prompt-injection attempts and report the results.
- Answer twenty questions from a public vendor questionnaire for your system.
drafted_with_ai: true
reviewed_by: 'UNREVIEWED: drafted by Claude, a person must review'
