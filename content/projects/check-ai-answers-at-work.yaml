id: check-ai-answers-at-work
title: Three checked prompts for a real work task
difficulty: starter
hours: 3
summary: Pick one task from your work or studies, write three prompts that get an AI assistant to help with it,
  and check every answer against a trusted source. You finish with a short write-up a manager could read.
lessons:
- what-is-ai
- use-an-assistant
- use-ai-safely
you_will_need:
- A free AI assistant account
- One real task you do every week
- A trusted source for that task, such as a policy, a textbook or official documentation
steps:
- title: Choose the task
  body: Pick a task that takes you at least 20 minutes and has an answer you can check, such as summarising a policy,
    drafting an email reply or explaining a concept. Write two sentences on what a good result looks like.
  hint: Avoid tasks that need private data you are not allowed to share.
  done_when: You have a task, a time it takes today and a description of a good result.
- title: Write the first prompt
  body: Write a plain prompt that states the task, who the result is for and the format you want. Save the prompt
    and the answer.
  hint: 'Name the audience and the length: ''for a new joiner, in five bullet points''.'
  done_when: You have one prompt and its answer saved.
- title: Improve it twice
  body: 'Write two better versions: add an example of a good answer, then add the source text and ask the assistant
    to use only it. Save each answer.'
  hint: Change one thing at a time so you can tell what helped.
  done_when: You have three prompts and three answers side by side.
- title: Check every answer
  body: Compare each answer with your trusted source. Mark every claim as correct, wrong or not checkable, and note
    any invented details.
  hint: Look hardest at numbers, dates, names and quotes.
  done_when: Each answer has a list of checked claims.
- title: Decide what not to share
  body: Note any data you would not paste into the assistant, and why, using the safe-use rules from the lessons.
  hint: Think about personal data, client data and passwords.
  done_when: You have a short list of things you kept out.
- title: Write it up
  body: 'Write one page: the task, the three prompts, what each got right and wrong, the time saved, and the prompt
    you would use from now on.'
  hint: 'Lead with the result: time saved and how reliable it was.'
  done_when: A one-page write-up that someone else could follow.
rubric:
- criterion: Real task
  strong: A task the learner actually does, with a time before and after.
  weak: A made-up or vague task with no measure.
- criterion: Prompt improvement
  strong: Each version changes one thing and the write-up says what helped.
  weak: Three similar prompts with no comparison.
- criterion: Checking
  strong: Every claim checked against a named source, with mistakes called out.
  weak: Answers accepted as correct without checking.
- criterion: Safe use
  strong: Clear about what data stayed out and why.
  weak: Private or client data pasted in without thought.
- criterion: Write-up
  strong: One page, result first, easy for a colleague to repeat.
  weak: A long transcript with no conclusion.
deliverables:
- Three prompts with their answers
- A list of checked claims for each answer
- A one-page write-up with the time saved
stretch:
- Try the best prompt in a second assistant and compare.
- Share the write-up with a colleague and ask them to repeat it.
drafted_with_ai: true
reviewed_by: "Shyam Prabahar"
reviewed_on: 2026-10-27
