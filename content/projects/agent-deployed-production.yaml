id: agent-deployed-production
title: The stage-3 agent, deployed
difficulty: advanced
hours: 24
summary: Deploy your operations agent to a cloud with CI/CD, tracing, a cost dashboard and a gateway with a fallback
  model, and show it meets a stated latency budget under load.
lessons:
- serving-ai-apps
- cicd-github-actions
- environments-secrets-terraform
- tracing-llm-apps
- llm-gateways
- caching-and-speed
- cost-control
- latency-load-testing
you_will_need:
- Your operations agent from the agents stage
- A cloud account with a small budget alert, and a GitHub repository
steps:
- title: Make it production-ready
  body: Add health and readiness endpoints, timeouts on every model and tool call, streaming where users wait, and
    settings read from the environment.
  hint: Set the inner timeouts shorter than the outer ones.
  done_when: The service starts, reports ready and fails fast on a stuck call.
- title: Describe the infrastructure as code
  body: Write Terraform or an equivalent for the service, its database, secrets and logs, with staging and production
    as separate environments.
  hint: Keep secrets in the cloud's secret manager.
  done_when: One command builds staging from scratch.
- title: Add CI/CD
  body: Write a pipeline that lints, tests and runs fast evals on every pull request, and deploys to staging then
    production on merge.
  hint: Block the deploy if evals drop.
  done_when: A merged change reaches production with no manual steps.
- title: Add a gateway and fallback
  body: Route model calls through a gateway with a model alias, a fallback model and per-feature budgets, and log
    every request.
  hint: Test the fallback by breaking the main key in staging.
  done_when: A broken primary model falls back without errors for users.
- title: Add tracing and a cost dashboard
  body: Trace each request step by step and build a dashboard with traces, cost per request, error rate and p95
    latency.
  hint: Tag traces with the prompt and model version.
  done_when: A dashboard showing a day of traffic.
- title: Load test against a budget
  body: State a latency budget, load test from low traffic to beyond your expected peak, fix the first bottleneck
    and write up the result.
  hint: Use a fake model for most rounds to save money.
  done_when: A chart of p95 latency against users with the budget marked.
rubric:
- criterion: Reproducible infrastructure
  strong: Environments built from code, secrets in a manager.
  weak: Resources clicked together by hand.
- criterion: Automated delivery
  strong: Tests and evals gate every deploy.
  weak: Manual deploys from a laptop.
- criterion: Resilience
  strong: Timeouts, a tested fallback and budgets.
  weak: One provider outage takes it down.
- criterion: Observability
  strong: Traces and a cost dashboard tied to versions.
  weak: Logs only, no cost data.
- criterion: Performance evidence
  strong: A load test against a stated budget, with a fix.
  weak: No idea how it behaves under load.
deliverables:
- A pipeline that tests and deploys on merge
- A dashboard screenshot showing traces, cost per request and error rate
- A load test result against a stated latency budget
stretch:
- Deploy to Kubernetes with a Helm chart.
- Add prompt caching and report the saving.
