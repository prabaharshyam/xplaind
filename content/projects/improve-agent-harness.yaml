id: improve-agent-harness
title: Improve a coding agent through its harness
difficulty: advanced
hours: 16
summary: Take a small coding agent, build a fixed set of 20 tasks with automatic checks, measure a baseline, then
  change only the harness, one part at a time, and report what each change did to pass rate, cost and time.
lessons:
- agent-loop
- agent-tool-design
- context-engineering
- agent-memory
- evaluating-agents
- regression-tests
- agent-budgets-kill-switches
- harness-engineering
- long-running-agent-harnesses
you_will_need:
- Python 3, Git, a GitHub repository and an API key with a spending limit you set yourself
- A small open-source coding agent you can read in an afternoon, or a minimal agent loop of your own of about 200
  lines
- A budget in rupees for model calls, written down before you start
steps:
- title: Pick and read the agent
  body: Choose a small open-source coding agent or write a minimal one with a loop, a few tools (read file, write
    file, run command) and a stop rule. Read the whole harness and write one page on what it does at each step,
    which tools it has and when it stops.
  hint: Keep it small. A harness you cannot read end to end is hard to change one part at a time.
  done_when: The agent solves one simple task, and you have a one-page map of its harness.
- title: Build a fixed task set of 20
  body: Write 20 small tasks in a tiny Python repository, such as fix a bug, add a function or change a CLI flag.
    Each task has a starting state and a check a script can run, usually tests that fail before and pass after. Mix
    easy, hard and longer multi-file tasks. Mark 15 as tuning tasks and 5 as held out. You run the held-out 5 only
    at the baseline and at the end, and never read their traces while you change the harness.
  hint: Write the check before the task description. If a script cannot decide pass or fail, the task is not ready.
  done_when: One command resets the repository, runs every task and prints pass or fail for each.
- title: Measure the baseline
  body: Fix the model version, settings, step limit and money limit. Run all 20 tasks three times each and record
    pass or fail, steps, tokens, cost in rupees and minutes per run. Save every trace. Read the failed traces of the
    15 tuning tasks only, and
    give each failure one label, such as wrong tool, lost the goal, stopped without checking, looped or ran out of
    budget.
  hint: Runs vary. One run per task can make a lucky change look good.
  done_when: A baseline table and a count of failures by label.
- title: Add a test gate
  body: Change only one thing. The harness runs the task's tests itself before it accepts that the agent is done,
    sends back the failing test names and short error lines, and allows a set number of retries. Make the test files
    read-only for the agent. Rerun the 15 tuning tasks three times each.
  hint: Send the error lines, not the whole log, or the context fills up.
  done_when: A before and after table for this one change, with pass rate, cost and time.
- title: Add a progress file, then a context reset
  body: These are two changes, measured one after the other. First, have the agent keep a short progress file of
    what it has done and what is next, and commit after each step that passes; rerun the tuning tasks and compare.
    Then, on top of that, start a fresh context from the progress file and git log when the context passes a size
    you choose; rerun and compare again. Compare each with the version before it, not only the baseline.
  hint: Look closely at the longer multi-file tasks; they are where these two changes should show up.
  done_when: Two rows of results, one per change, and a note on which long tasks each helped or hurt.
- title: Prune and rewrite the tools
  body: As a third change, remove tools the traces show the agent rarely needs or misuses, and rewrite the
    descriptions of the rest so each says what it does, when to use it and what it returns. Rerun the tuning tasks
    and compare.
  hint: Count wrong-tool failures before and after; that label should move.
  done_when: Results for this change, and the old and new tool lists side by side.
- title: Check the held-out tasks and put the set in CI
  body: Run the final harness on the 5 held-out tasks and report them separately. Then add a CI job that runs a small,
    cheap part of the task set on every harness change and fails if the pass rate drops below the baseline you
    choose.
  hint: Keep the CI part short and cheap enough that you will not switch it off.
  done_when: A CI run that passes, and one you make fail on purpose by breaking the harness.
- title: Write the report
  body: 'Write a short report: the agent, the task set, the fixed settings, one table with each change against the
    one before it (pass rate, cost per task in rupees, minutes per task, steps), failures by label, the held-out
    results, what did not help and what you would try next.'
  hint: Report a change that made things worse. It is as useful as one that helped.
  done_when: A report a reviewer can rerun from your repository.
rubric:
- criterion: Task set
  strong: 20 tasks with checks a script runs, a mix of difficulty, and 5 held out and never used for tuning.
  weak: A few hand-picked demos judged by eye.
- criterion: Controlled changes
  strong: Model and limits fixed; one harness change at a time, each measured against the one before.
  weak: Several changes at once, or the model changed too.
- criterion: Honest measurement
  strong: Several runs per task, with pass rate, cost, time and steps, plus failure labels from traces.
  weak: One run per task and a single score.
- criterion: Harness quality
  strong: The harness runs the tests, protects them, limits retries and keeps state on disk.
  weak: The agent decides for itself when it is done.
- criterion: Kept in CI
  strong: A CI job guards the baseline and is shown failing when the harness breaks.
  weak: The task set lives only on a laptop.
deliverables:
- A repository with the agent, the 20-task set and one command to run it
- A results table with the baseline and each harness change, including cost and time
- A CI job that runs part of the task set on every harness change
- A one-page report on what helped, what did not and why
stretch:
- Add an evaluator agent as a final gate and measure whether its extra cost pays for itself.
- Run the same harness with a smaller, cheaper model and compare the result with the larger model on the baseline
  harness.
drafted_with_ai: true
reviewed_by: Shyam Prabahar
reviewed_on: '2026-11-18'
