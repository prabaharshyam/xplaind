id: trusted-policy-assistant
title: A policy assistant people trust
difficulty: advanced
hours: 26
summary: Build a RAG assistant over a public document set of at least 300 pages, with citations, permission filters
  and an eval report comparing three retrieval set-ups, and show it refusing correctly.
lessons:
- document-parsing-ocr
- chunking
- retrieval-metadata
- hybrid-search-reranking
- grounding-citations
- check-retrieval
- llm-judges
- permission-aware-rag
you_will_need:
- At least 300 pages of public documents, such as an insurer's policy wordings or a regulator's circulars
- Python 3, a vector store and an API key
steps:
- title: Parse with care
  body: Parse every document with layout-aware tools, keep tables as rows with headers, OCR scanned pages and record
    title, section, page, date and version.
  hint: Look at parsed pages next to the originals.
  done_when: Clean text with metadata for every page.
- title: Build the golden set
  body: Write at least 40 questions with expected passages, including tables, cross-references and at least eight
    unanswerable questions.
  hint: Questions about tables catch parsing problems.
  done_when: A golden set of 40 or more questions.
- title: Build three retrieval set-ups
  body: Build vector search, hybrid search, and hybrid search with a reranker and metadata filters, all over the
    same chunks.
  hint: Change one thing between set-ups.
  done_when: Three set-ups answering the same questions.
- title: Ground and refuse
  body: Answer only from retrieved passages with a citation per claim, and refuse with a next step when the passages
    are silent.
  hint: Check citations automatically against the sources.
  done_when: Cited answers and correct refusals.
- title: Add permission filters
  body: Tag documents with groups, filter inside the search by the user's groups and test what each user must not
    see.
  hint: Deny by default.
  done_when: Two users see different documents for the same question.
- title: Write the eval report
  body: Report retrieval recall, answer correctness with a calibrated judge, refusal accuracy, cost and latency
    for each set-up, with a recommendation and a demo of a correct refusal.
  hint: Show failures and what caused them.
  done_when: An eval report and a demo.
rubric:
- criterion: Parsing quality
  strong: Tables, scans and metadata handled and checked.
  weak: Plain text extraction with lost tables.
- criterion: Evaluation
  strong: Three set-ups compared on retrieval and answers.
  weak: One set-up and no measurements.
- criterion: Trust
  strong: Citations checked, refusals correct.
  weak: Confident answers with no sources.
- criterion: Permissions
  strong: Filtered in search, tested both ways.
  weak: Everyone sees everything.
- criterion: Recommendation
  strong: A choice backed by numbers and failures.
  weak: No conclusion.
deliverables:
- A golden set of at least 40 questions
- An eval report with retrieval and answer scores for each set-up
- A demo that shows a correct refusal
stretch:
- Add multimodal retrieval for charts and diagrams.
- Cache frequent answers and report the cost saving.
