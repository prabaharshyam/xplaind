id: eval-harness-improvement
title: An eval harness that shows a measured improvement
difficulty: advanced
hours: 12
summary: 'Build an evaluation harness for an LLM app you already have: a test set, automatic checks, a calibrated
  model judge and a regression gate in CI, then use it to show one change that measurably improves the app.'
lessons:
- evals-test-sets
- llm-judges
- regression-tests
- prompt-injection
you_will_need:
- An LLM app you built earlier, such as your RAG app or agent
- Python 3, a GitHub repository and an API key
steps:
- title: Build the test set
  body: Collect at least 40 test cases from real or realistic inputs, grouped into categories such as normal questions,
    hard questions, unanswerable questions and attempts to break the rules.
  hint: Include a few prompt-injection attempts as their own category.
  done_when: A file of 40 or more cases with categories and expected results.
- title: Add code checks
  body: 'Write automatic checks for everything code can judge: valid format, required citations, banned phrases,
    refusals where expected.'
  hint: Code checks are free and never change their mind.
  done_when: Each case gets pass or fail on the code checks.
- title: Add a model judge
  body: Write a judge prompt for what code cannot check, such as correctness against the reference. Grade 20 cases
    yourself and measure how often the judge agrees with you.
  hint: Ask the judge for a reason before the verdict.
  done_when: You have an agreement rate between you and the judge.
- title: Record a baseline
  body: Run the full harness and save scores by category with the date, the prompt version and the model.
  hint: Save results as files so you can compare runs.
  done_when: A baseline results file.
- title: Make one change and compare
  body: Change one thing, such as the prompt or the retrieval settings, rerun the harness and compare by category.
  hint: Change one thing at a time, or you cannot say what helped.
  done_when: A before-and-after table by category.
- title: Gate it in CI
  body: Add a GitHub Actions workflow that runs the fast checks on every pull request and fails if a critical category
    drops.
  hint: Keep the fast set small so it runs in minutes.
  done_when: A pull request that breaks a check is blocked.
rubric:
- criterion: Representative test set
  strong: Real-looking cases in categories, including adversarial ones.
  weak: A handful of easy examples.
- criterion: Right tool for each check
  strong: Code checks first, judge only where needed.
  weak: A judge for everything, including format.
- criterion: Calibrated judge
  strong: Agreement with human grades measured and reported.
  weak: Judge scores trusted without checking.
- criterion: Measured improvement
  strong: One change, compared by category, with the result explained.
  weak: Several changes at once and an overall average.
- criterion: Regression gate
  strong: CI blocks drops in critical categories.
  weak: Evals run by hand, sometimes.
deliverables:
- The harness and test set in a repository
- Baseline and improved results by category
- A CI workflow that blocks regressions
stretch:
- Track cost and latency per case alongside quality.
- Add five cases from real failures each week for a month.
drafted_with_ai: true
reviewed_by: "Shyam Prabahar"
