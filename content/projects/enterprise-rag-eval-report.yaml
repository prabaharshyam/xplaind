id: enterprise-rag-eval-report
title: An enterprise RAG assistant with an eval report
difficulty: advanced
hours: 24
summary: Build a RAG assistant over a few hundred pages of public policy documents, with citations and refusals,
  and measure it with a golden question set and an eval report comparing two retrieval set-ups on accuracy, cost
  and speed.
lessons:
- structured-output
- embeddings
- chunking
- vector-search
- hybrid-search-reranking
- grounding-citations
- evals-test-sets
- llm-judges
you_will_need:
- A few hundred pages of public policy documents, such as a regulator's circulars or a state scheme's guidelines
- Python 3, a vector store such as pgvector or a local library, and an API key
steps:
- title: Ingest the documents
  body: Parse every document into text with its title, section headings and page numbers, and record where each
    file came from.
  hint: Keep the section path with each chunk; it makes citations useful.
  done_when: Every document is parsed and its pages can be traced to the source.
- title: Write the golden set
  body: Write at least 30 questions a real user would ask, each with the expected source passage, and add at least
    six that the documents cannot answer.
  hint: Write the set before you tune anything.
  done_when: A golden set file of 30 or more questions with sources.
- title: Build set-up A
  body: Chunk, embed and index the documents, retrieve the top chunks by vector search and answer with citations
    and a refusal rule.
  hint: Start simple; set-up A is your baseline.
  done_when: Set-up A answers with citations and refuses unanswerable questions.
- title: Build set-up B
  body: Add one meaningful improvement, such as hybrid keyword and vector search with a reranker, or better chunking
    by section.
  hint: Change retrieval only, so the comparison is fair.
  done_when: Set-up B runs on the same questions.
- title: Evaluate both
  body: Measure retrieval recall at five, answer correctness with a judge you have checked against your own grades,
    refusal accuracy, cost per question and p95 latency for both set-ups.
  hint: Grade 15 answers yourself to check the judge.
  done_when: A results table for both set-ups.
- title: Write the report and demo
  body: Write a two-page eval report with the table, three failure examples and a recommendation, and record a short
    demo of the assistant answering and refusing.
  hint: Recommend one set-up and say what it costs.
  done_when: A report and a demo video under three minutes.
rubric:
- criterion: Golden set quality
  strong: Realistic questions with sources, including unanswerable ones.
  weak: A few easy questions written after tuning.
- criterion: Fair comparison
  strong: Two set-ups differing in retrieval only, run on the same set.
  weak: Several things changed at once.
- criterion: Complete metrics
  strong: Retrieval, answers, refusals, cost and latency for both.
  weak: Only answer accuracy, or only a demo.
- criterion: Trustworthy judge
  strong: Judge agreement with human grades reported.
  weak: Judge scores used without checking.
- criterion: Clear recommendation
  strong: A choice with evidence, failures shown and cost stated.
  weak: Results with no conclusion.
deliverables:
- A golden set of at least 30 questions with expected sources
- An eval report comparing two retrieval set-ups on accuracy, cost and speed
- A short demo video of the assistant answering and refusing
stretch:
- Add metadata filters for document type and date and measure their effect.
- Run the golden set in CI on every change.
drafted_with_ai: true
reviewed_by: 'UNREVIEWED: drafted by Claude, a person must review'
