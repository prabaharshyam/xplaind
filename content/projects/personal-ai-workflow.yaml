id: personal-ai-workflow
title: A personal AI workflow
difficulty: starter
hours: 3
summary: Pick one task you do every week, use an AI assistant to do it faster, check the result, and write down
  the steps so a colleague could repeat them.
lessons:
- use-an-assistant
- prompting-without-jargon
- checking-ai-answers
- use-ai-safely
- company-ai-policy
- choosing-your-path
you_will_need:
- A free AI assistant account
- One task you do every week, such as writing a weekly update or summarising meeting notes
steps:
- title: Time the task
  body: Do the task once the usual way and note how long it takes and what a good result looks like.
  hint: Pick something that takes at least 15 minutes.
  done_when: A time and a short description of a good result.
- title: Write a prompt
  body: Write a prompt that says what the task is, who it is for and the format you want. Try it and save the answer.
  hint: Paste an example of a past good result.
  done_when: A prompt and its first answer.
- title: Check the result
  body: Check every fact, number and name in the answer against your own sources, and fix what is wrong.
  hint: Assume it can be confidently wrong.
  done_when: A checked, corrected result.
- title: Decide the limits
  body: Decide one thing the AI should not do in this task, such as handle personal data or make a final decision,
    and say why.
  hint: Check your organisation's AI rules if it has any.
  done_when: One written limit with a reason.
- title: Write the steps
  body: 'Write the steps so a colleague could repeat them: the prompt, what to check and how long it now takes.'
  hint: Ask a colleague to try your steps.
  done_when: A one-page how-to.
rubric:
- criterion: Measured
  strong: Before-and-after time recorded.
  weak: No timing.
- criterion: Checked
  strong: Every claim checked and corrected.
  weak: Answer used as it came.
- criterion: Safe
  strong: A clear limit with a good reason.
  weak: No thought about what to keep out.
- criterion: Repeatable
  strong: Steps a colleague can follow.
  weak: Only the author can repeat it.
deliverables:
- The before-and-after time for the task
- Your written steps, including how you check the output
- One thing you decided the AI should not do, and why
stretch:
- Do the same for a second weekly task.
- Share the steps with your team and collect feedback.
drafted_with_ai: true
reviewed_by: "Shyam Prabahar"
reviewed_on: 2026-10-27
