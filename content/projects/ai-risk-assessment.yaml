id: ai-risk-assessment
title: An AI risk assessment for a real AI feature
difficulty: intermediate
hours: 15
summary: Assess one real or realistic AI feature end to end, covering what it does, who could be harmed, which laws
  and policies apply, the tests that show it is safe enough, and the controls and owners, then present a launch
  recommendation.
lessons:
- ai-risk-frameworks
- ai-rules-india-abroad
- ai-compliance
- bias-fairness
- security-privacy
- evals-test-sets
- writing-ai-policy
- ai-incident-response
you_will_need:
- One AI feature to assess, such as a resume screener, a loan-eligibility chatbot or a customer support assistant
- A document or slide tool
steps:
- title: Describe the system
  body: Write one page on what the feature does, who uses it, who is affected by its output, what data it uses and
    where that data goes, which model or vendor it relies on, and where a person is involved.
  hint: Draw the data flow from input to decision; most risks show up on the arrows.
  done_when: A one-page system description with a data-flow diagram.
- title: Map the harms
  body: List what could go wrong for each group affected, such as unfair treatment, wrong advice, privacy loss,
    security misuse or over-reliance, and rate each by likelihood and severity.
  hint: Ask who is harmed when the system is wrong, not only when it is attacked.
  done_when: A harm register with at least eight rated risks.
- title: Check laws and policies
  body: Note which rules apply to this feature, such as India's DPDP Act for personal data, sector rules from
    regulators like RBI or IRDAI, the EU AI Act if it serves EU users, and your organisation's AI policy, and what
    each requires here. Mark anything you are unsure about for a legal review.
  hint: Say what each rule requires for this feature, not just that it exists. Laws phase in over time, so record the
    date you checked.
  done_when: A table of rules, what each requires here, and open legal questions.
- title: Plan the tests
  body: Choose tests that show whether the main risks are controlled, such as accuracy on a test set, results
    compared across groups or languages, red-team prompts for misuse and prompt injection, and a privacy check of
    logs. Set a pass bar for each.
  hint: A risk with no test needs a control, an owner or a clear reason to accept it.
  done_when: A test plan with pass bars linked to the harm register.
- title: Set controls and owners
  body: For each high risk, name a control, such as human review, an approval threshold, data minimisation, a
    kill switch or a user disclosure, plus an owner and a review date. Add the incident process if something goes
    wrong after launch.
  hint: Controls that nobody owns do not happen.
  done_when: A control table with owners, and a one-page incident plan.
- title: Make the recommendation
  body: Write a two-page summary saying go, go with conditions, or not yet, with the evidence behind it and the
    conditions to meet. Present it to someone who acts as the product owner and answer their questions.
  hint: Lead with the decision and the top three risks.
  done_when: A two-page recommendation, presented once.
rubric:
- criterion: Understands the system
  strong: Clear data flow, users, affected people and human role.
  weak: Describes the model but not how it is used.
- criterion: Harms are specific
  strong: Rated risks for named groups, including harms from normal mistakes.
  weak: Generic risks such as 'bias' with no detail.
- criterion: Rules applied, not listed
  strong: Says what each rule requires for this feature and flags what needs a lawyer.
  weak: Lists laws by name only.
- criterion: Evidence over opinion
  strong: Tests with pass bars linked to the main risks.
  weak: No way to tell whether risks are controlled.
- criterion: Accountable controls
  strong: Every high risk has a control, an owner and a review date.
  weak: Controls with no owner, or none at all.
- criterion: A clear decision
  strong: A go, conditional or not-yet decision with reasons.
  weak: Ends without a recommendation.
deliverables:
- A system description with a data-flow diagram
- A harm register, a rules table and a test plan
- A control table with owners and an incident plan
- A two-page launch recommendation
stretch:
- Run five of your red-team prompts on a real model and record the results.
- Turn your controls into a one-page AI policy section for this kind of feature.
drafted_with_ai: true
reviewed_by: 'UNREVIEWED: drafted by Claude, a person must review'
