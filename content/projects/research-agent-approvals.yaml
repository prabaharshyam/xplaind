id: research-agent-approvals
title: A research agent with approvals
difficulty: advanced
hours: 22
summary: Build an agent that researches a company from public sources, drafts a briefing and asks for approval before
  sending it, with traces, a budget, a kill switch and a trajectory eval over 20 tasks.
lessons:
- tool-calling
- agent-loop
- agent-tool-design
- planning-reflection
- human-approval
- agent-budgets-kill-switches
- evaluating-agents
- agent-accountability
you_will_need:
- Python 3, an agent framework and an API key
- A web search or news tool with a free tier, and 20 company names to test with
steps:
- title: Define the briefing
  body: 'Write the briefing template: what the company does, recent news, people, risks and open questions, with
    a source link for every claim.'
  hint: A template makes the agent's job and your eval concrete.
  done_when: A one-page template with required sections.
- title: Give it research tools
  body: Write tools to search, open a page and save a note, with clear descriptions and limits on how many pages
    one task may open.
  hint: Treat page text as data, never as instructions.
  done_when: The agent can gather notes on one company.
- title: Plan, then execute
  body: Have the agent write a short plan from the template, carry it out step by step, and check the draft against
    the template before finishing.
  hint: A final check catches missing sections.
  done_when: Drafts follow the template with sources.
- title: Add approval, budget and kill switch
  body: Pause before sending the briefing so a person can approve, edit or reject it; cap steps and spend per task;
    add a kill switch.
  hint: Test that a rejected briefing is never sent.
  done_when: Approval, budget stop and kill switch all work.
- title: Trace and evaluate 20 tasks
  body: 'Run 20 companies and score each run: sections complete, claims sourced, unsafe actions (should be none),
    steps and cost.'
  hint: Include companies with little public information.
  done_when: A trajectory eval table for 20 tasks.
- title: Write the accountability note
  body: Write who owns the agent, what it may and may not do, how mistakes are reported and fixed, and the cost
    per task.
  hint: Use the agent card from the accountability lesson.
  done_when: A short agent card and cost figure.
rubric:
- criterion: Sourced output
  strong: Every claim links to a source.
  weak: Unsourced or invented claims.
- criterion: Planning
  strong: A plan, step-by-step work and a final check.
  weak: Wandering searches with uneven briefings.
- criterion: Human control
  strong: Nothing is sent without approval; rejections respected.
  weak: Briefings sent automatically.
- criterion: Evaluation
  strong: 20 tasks scored on completeness, sources, safety and cost.
  weak: A couple of demo runs.
- criterion: Accountability
  strong: Owner, limits and redress written down.
  weak: No one answers for the agent.
deliverables:
- A trajectory eval over 20 tasks
- Traces showing an approval and a refusal
- A cost per task figure and a kill switch you show working
stretch:
- Split research into sub-agents per section and compare cost and quality.
- Add a reviewer agent that checks sources before approval.
drafted_with_ai: true
reviewed_by: 'UNREVIEWED: drafted by Claude, a person must review'
reviewed_on: 2026-10-26
