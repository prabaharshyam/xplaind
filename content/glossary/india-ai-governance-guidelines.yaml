id: india-ai-governance-guidelines
term: India AI Governance Guidelines
definition: >-
  Guidelines released by MeitY in November 2025 setting principles for safe, trusted AI in
  India. They create no new AI law and rely on existing laws such as the DPDP Act and on sector
  regulators.
