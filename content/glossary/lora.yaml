id: lora
term: LoRA (low-rank adaptation)
definition: >-
  A way to fine-tune a model by freezing its weights and training two small extra matrices per
  layer instead. It trains well under 1% of the parameters, so it needs far less memory than full
  fine-tuning.
related:
- fine-tuning
- qlora
- weights
