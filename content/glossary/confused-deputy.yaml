id: confused-deputy
term: Confused deputy
also:
- confused deputy problem
definition: >-
  When a program with more authority than its caller is tricked into using that authority on
  the caller's behalf, such as an agent with admin access reading files for a user who
  cannot open them.
related:
- least-privilege
- excessive-agency
- tool-poisoning
