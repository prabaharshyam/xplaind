id: tool-poisoning
term: Tool poisoning
also:
- MCP tool poisoning
- tool description poisoning
definition: >-
  Hiding malicious instructions or behaviour in an AI agent's tool: in its description, code
  or results. Because the model trusts tool descriptions, hidden text there can steer the
  agent to misuse its tools.
related:
- mcp
- prompt-injection
- confused-deputy
- excessive-agency
