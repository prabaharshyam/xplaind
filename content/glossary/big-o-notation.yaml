id: big-o-notation
term: "Big-O notation"
also: ["Big O", "time complexity", "space complexity"]
definition: >-
  A way to describe how an algorithm's running time or memory grows as its input grows, ignoring constants. O(n) grows in step with the input; O(n²) grows with its square.
explanation: >-
  If checking one list of 1,000 phone numbers takes a moment, an O(n) method on 10 lakh numbers takes about a thousand moments, but an O(n²) method takes about a million times as long. Big-O lets you see that before you run anything.
related: ["hash-map", "binary-search"]
