id: token
term: Token
definition: >-
  The unit of text a model reads and writes: a whole word, part of a word or a punctuation
  mark. Prices and limits are counted in tokens.
explanation: >-
  A rough rule for English is that 100 tokens are about 75 words. Hindi and Tamil text usually
  needs more tokens for the same meaning, so it costs more.
