id: durable-execution
term: Durable execution
definition: >-
  Running a long job so that each completed step is saved, and after a crash or restart the job
  resumes from the last saved step instead of starting again.
explanation: >-
  For agents this means saving the state after each tool call or task, with step ids so a step is
  never done twice. A run that takes hours then survives a laptop going to sleep or a server
  restart.
