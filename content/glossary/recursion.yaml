id: recursion
term: "Recursion"
also: ["recursive function"]
definition: >-
  When a function solves a problem by calling itself on a smaller version of the same problem, until it reaches a base case it can answer directly.
explanation: >-
  Counting files in a folder is recursive: count the files here, then call the same function on each sub-folder. Without a base case it never stops.
related: ["dynamic-programming", "stack", "depth-first-search"]
