id: data-contamination
term: Data contamination
also:
- benchmark contamination
definition: >-
  When a model was trained on the questions of a test it is later scored on, so the score shows
  memory rather than skill. Also called benchmark leakage.
related:
- benchmark
- evals
- overfitting
