id: top-p
term: Top-p (nucleus) sampling
definition: >-
  A sampling setting that keeps only the smallest group of next-word options whose chances add
  up to p, such as 0.9, and picks from those. The group gets bigger when the model is unsure and
  smaller when it is sure.
