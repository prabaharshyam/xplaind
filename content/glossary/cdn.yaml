id: cdn
term: "Content delivery network"
also: ["CDN", "edge cache"]
definition: >-
  A network of servers in many cities that keeps copies of files such as images and videos close to users, so they load faster and the main server does less work.
explanation: >-
  A learner in Chennai gets a course video from a CDN server in Chennai instead of from a server in the US, so it starts quickly.
related: ["caching", "cache-invalidation"]
