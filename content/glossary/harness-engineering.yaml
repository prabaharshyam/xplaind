id: harness-engineering
term: Harness engineering
definition: >-
  Improving an agent by changing what surrounds the model, such as tools, context handling,
  progress files, tests and stop rules, and measuring each change on a fixed set of tasks.
explanation: >-
  It follows prompt engineering and context engineering. When an agent makes a mistake, you add
  something to the harness, such as a rule file, a test or a better tool, so it does not make that
  mistake again. Then you check on the same tasks that the change really helped.
