id: depth-first-search
term: "Depth-first search"
also: ["DFS"]
definition: >-
  A way to explore a graph by going as deep as possible along one branch before backing up, using recursion or a stack.
explanation: >-
  DFS is how you would search a maze by following one corridor to its end before trying the next. It is used to find connected groups and detect cycles.
related: ["breadth-first-search", "stack", "recursion"]
