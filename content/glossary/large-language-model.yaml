id: large-language-model
term: Large language model
also:
- LLM
definition: >-
  A model trained on huge amounts of text to predict the next token. That one skill lets it
  write, summarise, translate, answer questions and write code.
explanation: >-
  It does not look facts up. It produces the most likely continuation of the text it was given,
  which is why it can sound confident and still be wrong.
related:
- token
- next-token-prediction
- hallucination
