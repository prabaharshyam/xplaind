id: rag
term: Retrieval-augmented generation
also:
- RAG
definition: >-
  Answering a question by first retrieving relevant passages from your own documents and putting
  them in the prompt, so the model answers from them.
explanation: >-
  RAG is how most companies put AI on their own data without retraining a model. Its quality
  depends mostly on retrieval: if the right passage is not found, the model cannot use it.
related:
- retrieval
- grounding
- chunking
- embedding
drafted_with_ai: true
