id: agent
term: Agent
also:
- AI agent
definition: >-
  An AI system that decides its own next steps in a loop: it calls tools, reads the results
  and continues until the task is done or it must stop.
explanation: >-
  The difference from a fixed workflow is who decides the path. In a workflow, your code decides;
  in an agent, the model does. That flexibility costs predictability, so agents need limits
  and logs.
related:
- agent-loop
- tool-calling
- workflow
