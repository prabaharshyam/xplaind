id: lexical-similarity
term: Lexical similarity
also:
- BLEU
- ROUGE
- n-gram overlap
definition: >-
  How many words or word sequences an answer shares with a reference answer. BLEU and ROUGE are
  common measures. It rewards matching words, not matching meaning.
