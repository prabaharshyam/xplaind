id: hash-map
term: "Hash map"
also: ["hash table", "dictionary", "dict"]
definition: >-
  A data structure that stores key and value pairs and finds a value from its key in about the same time no matter how many pairs it holds.
explanation: >-
  Python's dict is a hash map. Looking up a customer by phone number in a dict of 10 lakh customers is as quick as in a dict of ten, because the key is turned into a position with a hash function.
