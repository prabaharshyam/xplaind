id: back-of-envelope-estimate
term: "Back-of-the-envelope estimate"
also: ["capacity estimate", "napkin maths"]
definition: >-
  A quick rough calculation of load, storage or cost from a few assumptions, used to check whether a design is the right size before building it.
explanation: >-
  If 1 crore users each send 10 messages a day, that is 100 crore messages a day, or about 12,000 a second on average. That number shapes every choice that follows.
related: ["horizontal-scaling", "throughput"]
