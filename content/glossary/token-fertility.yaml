id: token-fertility
term: Token fertility
also:
- tokens per word
definition: >-
  How many tokens a tokenizer needs, on average, for one word of a language. Hindi or Tamil often
  need several times more tokens than English for the same meaning, which raises cost and delay.
related:
- tokenizer
- token
