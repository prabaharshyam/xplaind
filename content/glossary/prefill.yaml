id: prefill
term: Prefill
also:
- prefill and decode
definition: >-
  The first stage of generating a reply: the model reads the whole prompt at once and fills its
  KV cache. Long prompts make it slower, which delays the first token.
related:
- kv-cache
- time-to-first-token
