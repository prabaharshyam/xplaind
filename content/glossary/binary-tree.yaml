id: binary-tree
term: "Binary tree"
also: ["binary search tree", "BST", "tree"]
definition: >-
  A tree where each node has at most two children. In a binary search tree, smaller values go left and larger go right, so a lookup halves the search each step.
explanation: >-
  Folders on your laptop form a tree. A balanced binary search tree of 10 lakh items finds any item in about 20 steps.
