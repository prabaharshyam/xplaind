id: breadth-first-search
term: "Breadth-first search"
also: ["BFS"]
definition: >-
  A way to explore a graph level by level using a queue, visiting all neighbours of a node before going further. It finds the shortest path when every edge counts the same.
explanation: >-
  To find the fewest metro stops from Rajiv Chowk, BFS checks every station one stop away, then two stops away, and so on.
related: ["depth-first-search", "queue", "graph-data-structure"]
