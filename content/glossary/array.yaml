id: array
term: "Array"
also: ["list", "dynamic array"]
definition: >-
  An ordered sequence of items stored side by side, so any item can be read by its position in constant time.
explanation: >-
  A Python list is a dynamic array. Reading item 500 is instant, but inserting at the front means shifting every item along.
