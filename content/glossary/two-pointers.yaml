id: two-pointers
term: "Two pointers"
also: ["two-pointer technique", "sliding window"]
definition: >-
  A technique that walks two positions through an array, often from both ends or at different speeds, to solve a problem in one pass instead of nested loops.
explanation: >-
  To check if any two prices in a sorted list add up to ₹1,000, start one pointer at each end and move them inward: one pass instead of checking every pair.
related: ["binary-search", "array"]
