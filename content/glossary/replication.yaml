id: replication
term: "Replication"
also: ["read replica", "primary and replica"]
definition: >-
  Keeping copies of the same data on more than one database server, so reads can be spread out and the data survives if one server fails.
explanation: >-
  A primary database takes all writes and copies them to two replicas that serve reads. If the primary fails, a replica can take over.
related: ["sharding", "database-index"]
