id: load-balancer
term: "Load balancer"
also: ["LB", "reverse proxy"]
definition: >-
  A component that spreads incoming requests across several servers and stops sending traffic to servers that are unhealthy.
explanation: >-
  Like a supervisor at a bank directing each customer to the next free counter, a load balancer sends each request to a server that can take it.
related: ["horizontal-scaling", "throughput"]
