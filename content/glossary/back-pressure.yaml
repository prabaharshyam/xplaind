id: back-pressure
term: Back-pressure
also:
- Verification gate
definition: >-
  Automatic checks that push back on an agent's work, such as tests, linters, type checks or an
  evaluator agent, so it must fix a failure before it can call a step done.
explanation: >-
  Without back-pressure an agent tends to report success on work that does not run. With it, a
  failing test result goes straight back into the loop, and the agent keeps working until the
  check passes or a limit is reached.
related:
- verifier
- unit-test
- agent-loop
