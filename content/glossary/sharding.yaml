id: sharding
term: "Sharding"
also: ["partitioning", "horizontal partitioning"]
definition: >-
  Splitting one large dataset across several databases by a key, so each database holds only part of the data and part of the load.
explanation: >-
  A payments app might keep users whose IDs end in 0 to 4 on one database and 5 to 9 on another. Choosing a key that spreads load evenly is the hard part.
related: ["replication", "database-index"]
