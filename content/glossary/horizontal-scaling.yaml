id: horizontal-scaling
term: "Horizontal scaling"
also: ["scaling out", "vertical scaling", "scaling up"]
definition: >-
  Handling more load by adding more machines rather than making one machine bigger. Making one machine bigger is vertical scaling.
explanation: >-
  When a sale brings ten times the usual shoppers, a site that scales horizontally adds more app servers behind a load balancer instead of buying one giant server.
related: ["load-balancer", "throughput"]
