id: hallucination
term: Hallucination
also:
- confabulation
definition: >-
  When a model states something false or invents a source with full confidence.
explanation: >-
  It happens because the model writes what sounds likely, not what it has checked. Grounding
  answers in retrieved documents and asking for citations reduces it; checking important claims
  is still your job.
related:
- grounding
- citation
- large-language-model
drafted_with_ai: true
