id: binary-search
term: "Binary search"
also: ["bisection"]
definition: >-
  A way to find an item in a sorted list by checking the middle and discarding the half that cannot hold it, so each step halves what is left.
explanation: >-
  Finding a word in a printed dictionary works this way. Binary search finds one roll number among 10 lakh sorted ones in about 20 checks.
