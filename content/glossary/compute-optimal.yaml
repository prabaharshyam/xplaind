id: compute-optimal
term: Compute-optimal
also:
- Chinchilla-optimal
definition: >-
  The split between model size and training tokens that gives the best quality for a fixed amount
  of training compute. The Chinchilla rule of thumb is about 20 training tokens per parameter.
related:
