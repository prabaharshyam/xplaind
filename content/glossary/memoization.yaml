id: memoization
term: "Memoization"
also: ["memoisation", "caching results"]
definition: >-
  Storing the result of a function call so that the next call with the same input returns the saved answer instead of computing it again.
explanation: >-
  A naive recursive Fibonacci recomputes the same values millions of times. With memoization each value is computed once, turning hours into milliseconds.
related: ["dynamic-programming", "caching"]
