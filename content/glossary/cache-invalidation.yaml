id: cache-invalidation
term: "Cache invalidation"
also: ["cache expiry", "TTL"]
definition: >-
  Deciding when a cached copy is out of date and must be removed or refreshed, for example after a set time-to-live or when the original data changes.
explanation: >-
  If a price changes but the cached page still shows the old one, shoppers see the wrong price. A short TTL or clearing the cache on update fixes it.
related: ["caching", "cdn"]
