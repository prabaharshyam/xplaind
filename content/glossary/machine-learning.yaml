definition: >-
  A way of building software that learns patterns from examples instead of following hand-written
  rules.
explanation: >-
  Show a machine learning system thousands of past loan applications and whether each was
  repaid, and it learns which patterns predict repayment. It can then score a new application
  it has never seen.
