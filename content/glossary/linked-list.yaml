id: linked-list
term: "Linked list"
also: ["singly linked list", "doubly linked list"]
definition: >-
  A chain of nodes where each node holds a value and a pointer to the next node, so adding or removing at a known point needs no shifting.
explanation: >-
  Undo history and music playlists can be linked lists: you insert or remove a step by changing two pointers, not by moving every item.
related: ["array", "stack"]
