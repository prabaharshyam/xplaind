id: catastrophic-forgetting
term: Catastrophic forgetting
definition: >-
  When fine-tuning a model on one task makes it worse at things it could do before. It is why a
  fine-tuned model needs tests on old tasks as well as the new one.
related:
- fine-tuning
- overfitting
- training
