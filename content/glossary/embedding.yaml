id: embedding
term: Embedding
also:
- vector embedding
definition: >-
  A list of numbers that represents the meaning of a piece of text, so texts with similar
  meanings get similar numbers.
explanation: >-
  If you embed "car" and "automobile", the two lists of numbers point in nearly the same direction,
  even though the words share no letters. That is what lets search find meaning rather than
  exact words.
related:
- vector-database
- cosine-similarity
- semantic-search
