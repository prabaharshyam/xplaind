id: message-queue
term: "Message queue"
also: ["Kafka", "RabbitMQ", "SQS", "pub/sub"]
definition: >-
  A service that holds messages from one part of a system until another part is ready to process them, so slow work can happen in the background.
explanation: >-
  When you place an order, the shop saves it and puts an 'order placed' message on a queue. Separate workers then send the SMS, update stock and email the invoice.
related: ["queue", "idempotency"]
