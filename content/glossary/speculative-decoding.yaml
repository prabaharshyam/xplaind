id: speculative-decoding
term: Speculative decoding
also:
- assisted generation
definition: >-
  A speed-up where a small, fast model drafts several tokens and the main model checks them all
  at once, keeping the ones it agrees with. The answer is the same, only faster.
related:
- kv-cache
- latency
