term: "Graph"
also: ["graph data structure", "nodes and edges", "adjacency list"]
definition: >-
  A set of nodes joined by edges, used to model networks such as roads, friendships or links between web pages.
explanation: >-
  Delhi Metro is a graph: stations are nodes and the tracks between them are edges. Finding the fewest stops between two stations is a graph search.
