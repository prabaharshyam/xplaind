id: backdoor-attack
term: Backdoor attack
also:
- trojan model
- model backdoor
definition: >-
  Hidden behaviour planted in a model, usually through poisoned training data, that appears
  only when a trigger such as a phrase or image patch is present. Without the trigger the
  model behaves normally.
related:
- data-poisoning
- adversarial-example
