id: dynamic-programming
term: "Dynamic programming"
also: ["DP"]
definition: >-
  Solving a problem by breaking it into overlapping smaller problems, solving each once and reusing the answers instead of recomputing them.
explanation: >-
  Working out the fewest coins for ₹93 is easier if you already know the answers for ₹92, ₹88 and ₹83. DP builds those answers up once and looks them up.
related: ["memoization", "recursion"]
