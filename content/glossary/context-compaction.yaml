id: context-compaction
term: Context compaction
also:
- Compaction
definition: >-
  Summarising an agent's history in place when its context window nears the limit, so the same
  session can continue with a shorter record of the goal, decisions and open items.
explanation: >-
  Compaction keeps continuity but never gives a clean slate. The other option is a context reset:
  end the session, write a structured handoff to a file, and start a fresh agent that reads it.
related:
- context-window
- context-engineering
- agent-memory
