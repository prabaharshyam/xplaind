id: prompt-engineering
term: Prompt engineering
definition: >-
  Designing and testing prompts so a model gives reliable, useful output for a task.
explanation: >-
  In practice it means clear instructions, the right context, a worked example and a fixed
  output format, then checking the results on real cases and adjusting.
