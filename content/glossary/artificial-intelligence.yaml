id: artificial-intelligence
term: Artificial intelligence
also:
- AI
definition: >-
  Software that does tasks we used to think needed human judgement, such as understanding
  language, recognising images or making predictions.
explanation: >-
  AI is an umbrella term. A spam filter, a face unlock and a chat assistant are all AI, though
  they work in very different ways. Most AI today learns from examples rather than following
  rules a person wrote.
