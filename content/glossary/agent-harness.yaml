id: agent-harness
term: Agent harness
also:
- Harness
- Agent scaffold
definition: >-
  Everything around the model that turns it into a working agent: the loop, tools, context
  handling, files it keeps on disk, checks on its work, permissions and limits.
explanation: >-
  A common way to put it is agent = model + harness. Two coding tools can use the same model and
  still behave very differently, because one has better tools, tests that push back on mistakes
  and a way to remember progress between sessions.
related:
- harness-engineering
- agent-loop
- agent
- context-engineering
