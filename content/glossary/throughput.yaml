id: throughput
term: "Throughput"
also: ["requests per second", "RPS", "QPS"]
definition: >-
  How much work a system finishes in a period of time, such as requests per second. It is different from latency, which is how long one request takes.
explanation: >-
  A toll plaza with ten booths has more throughput than one with two, even if each car takes the same time at its booth.
related: ["latency", "horizontal-scaling"]
