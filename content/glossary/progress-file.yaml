id: progress-file
term: Progress file
also:
- Progress log
- Notes file
definition: >-
  A file on disk where an agent records what it has done, what is left and what to do next, so a
  new session with an empty context can pick up the work.
explanation: >-
  Anthropic's long-running agent harness pairs a progress log with a JSON feature list and git
  commits. Each new session reads them first, the way a new shift reads the handover notes.
related:
- agent-memory
- context-compaction
- handover
