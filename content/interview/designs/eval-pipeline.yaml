id: eval-pipeline
title: An evaluation pipeline for an LLM product
prompt: Design how a team would evaluate and monitor an LLM feature from first prototype to production.
summary: A golden set and scorers offline, a regression gate in CI, and online evals with tracing and feedback that feed back into the set.
clarify:
- What does the feature do, and what does a good output look like?
- How often do prompts, models and retrieval change?
- Who can label examples, and how much time do they have?
- What would a bad answer cost?
requirements:
  functional:
  - Score every change before it ships
  - Monitor quality in production
  - Turn failures into test cases
  non_functional:
  - Fast tier under 2 minutes
  - Judge agreement with people of about 90%
  - Personal data masked in traces
estimates:
- label: Golden set
  value: 150 cases in 6 categories
- label: Production
  value: 20,000 requests a day; judge on 10% plus all thumbs-down
- label: Eval cost
  value: About ₹300 per full run
architecture: 'Logs, hard cases, past failures -> Golden set

  Golden set -> Scorers | code checks, calibrated judge, human sample

  Pull request -> Fast tier in CI -> Full tier before deploy

  Scorers -> Fast tier in CI

  Full tier before deploy -> Production

  Production -> Traces -> Online scores and feedback -> Dashboard and alerts

  Online scores and feedback -[failures]-> Golden set'
deep_dives:
- title: Scorers
  body: Code checks for anything exact (format, citations, length). A judge for faithfulness and helpfulness, with a rubric that lists problems first, calibrated on 80 human-graded cases. A small human sample every week.
- title: Gates
  body: Results by category against the production baseline; a release ships only if no critical category drops beyond its tolerance. Flaky judge scores are averaged over 3 runs for close calls.
failures:
- risk: Judge drift after a model upgrade
  mitigation: Re-calibrate the judge on the human set
- risk: Golden set goes stale
  mitigation: Add production failures weekly
- risk: Teams ignore a flaky gate
  mitigation: Keep the fast tier deterministic; judge only in the full tier
evals:
- Agreement between judge and humans
- Time from bug report to a test case
- Share of incidents caught before production
trade_offs:
- 'More cases mean more confidence but slower, costlier runs: keep two tiers'
- A judge scales but must be calibrated; humans are accurate but slow
follow_ups:
- How would you evaluate an agent instead of a chatbot?
- How do you pick the first 50 cases?
