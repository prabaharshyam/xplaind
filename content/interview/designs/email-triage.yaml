id: email-triage
title: Email and ticket triage for a support team
prompt: Design a system that reads incoming support emails, classifies and prioritises them, routes them, and drafts replies.
summary: An AI step with structured output, business rules on top, routing in the help desk, and drafts a person approves.
clarify:
- Volume, languages and categories?
- Which emails are sensitive (legal threats, data deletion, VIP accounts)?
- Will replies be sent automatically or by agents?
- Which help desk?
requirements:
  functional:
  - Classify category and priority; extract key fields
  - Route to the right team with a summary
  - Draft a reply for an agent to check
  non_functional:
  - Sensitive emails never auto-sent
  - Under 30 s from arrival to routing
  - Personal data masked in logs
estimates:
- label: Volume
  value: 12,000 emails a day
- label: Categories
  value: 15 categories, 4 priorities
- label: Unsure share
  value: About 8% go to a general queue
architecture: 'Incoming email -> AI step, structured output | category, priority, fields, summary, unsure?

  AI step, structured output -> Business rules | key account, legal words, deletion request

  Business rules -[rule matches]-> Senior or privacy queue

  Business rules -> Unsure?

  Unsure? -[yes]-> General queue

  Unsure? -[no]-> Team queue with a draft reply

  Team queue with a draft reply -> Agent checks and sends'
deep_dives:
- title: Rules over the model
  body: 'The model classifies, but code rules decide anything with legal or privacy weight: words like "legal notice" or "delete my data" force a route regardless of what the model said.'
- title: Drafts
  body: Drafts use the knowledge base with citations; agents edit and send. Edit distance between draft and sent reply is tracked as a quality signal.
failures:
- risk: Misrouted urgent email
  mitigation: Rules for urgent signals and an "unsure" path to a person
- risk: Draft promises a refund
  mitigation: Output check for promises; agents always send
- risk: Classifier drifts as products change
  mitigation: Weekly review of the unsure queue; retrain categories
evals:
- '500 labelled emails: category and priority accuracy, per category'
- Share routed to unsure; agent edit distance on drafts
trade_offs:
- Automatic sending saves time but risks harm; start with drafts
- More categories give finer routing but lower accuracy
follow_ups:
- How would you add a new category without breaking others?
- How do you measure that it saves time?
