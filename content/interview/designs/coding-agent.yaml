id: coding-agent
title: A coding agent that fixes small bugs
prompt: Design an agent that takes a bug ticket, finds the code, makes a fix, runs tests and opens a pull request.
summary: An agent with repository tools in a sandbox, tests as the main check, budgets, and a person reviewing every pull request.
clarify:
- 'What kinds of tickets: small bugs or features?'
- Which languages and how big is the codebase?
- Can it run tests and install packages?
- Who reviews and merges?
requirements:
  functional:
  - Read the ticket and search the code
  - Edit files and run tests in a sandbox
  - Open a pull request with an explanation
  non_functional:
  - Never pushes to the main branch
  - No secrets or network in the sandbox beyond the package mirror
  - Cost and time capped per ticket
estimates:
- label: Tickets
  value: 200 small bugs a week
- label: Steps
  value: 20-60 tool calls, up to 15 minutes
- label: Success target
  value: About 40% merged without changes
architecture: 'Bug ticket -> Agent loop

  Agent loop -> Search and read code

  Agent loop -> Edit files in a sandbox

  Agent loop -> Run tests in a sandbox

  Run tests in a sandbox -[fail]-> Agent loop

  Run tests in a sandbox -[pass]-> Open a pull request

  Open a pull request -> A person reviews and merges'
deep_dives:
- title: Context
  body: The agent searches the repository instead of loading it, keeps notes of what it has learned, and drops old tool output, so long runs stay within the context window.
- title: Sandbox
  body: A container per ticket with the repository, no secrets and network only to the package mirror; CPU and time limits; destroyed afterwards.
failures:
- risk: Fix passes tests but is wrong
  mitigation: Human review; the agent adds a test that fails before the fix
- risk: Endless loops
  mitigation: Step and time caps
- risk: Dependency confusion or malware
  mitigation: Package mirror only; no internet
evals:
- 'A set of 100 past bugs with known fixes: share solved, tests added'
- Review acceptance rate and reviewer time saved
trade_offs:
- More autonomy saves more time but needs a stronger sandbox
- Small tickets first; features later
follow_ups:
- How would you stop it from deleting tests to make them pass?
- How do you measure value for the team?
patterns:
- agent-loop
- least-privilege-sandbox
- budgets-kill-switch
- trajectory-evals
