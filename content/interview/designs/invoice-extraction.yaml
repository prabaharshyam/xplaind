id: invoice-extraction
title: Invoice extraction for an accounts team
prompt: Design a system that reads supplier invoices (PDF, photos, email) and posts them into the accounting system.
summary: Document parsing, schema-based extraction, code validation of every field, and a review screen for failures.
clarify:
- How many invoices a day and in what formats (digital PDF, scans, phone photos)?
- Which fields are required, and what accuracy is needed?
- What happens today when an invoice is wrong?
- Which accounting system?
requirements:
  functional:
  - Accept invoices from email, WhatsApp and a folder
  - Extract supplier, GSTIN, number, date, lines, taxes, total
  - Validate and post; send failures to review
  non_functional:
  - At least 98% field accuracy on critical fields
  - Nothing posted that fails validation
  - Original kept for audit
estimates:
- label: Volume
  value: 3,000 invoices a day, 30% scans or photos
- label: Pages
  value: Average 2 pages
- label: Review share
  value: Target under 10%
architecture: 'Email, WhatsApp, folder -> Store the original -> Get text | text layer, OCR or vision model

  Get text -> Extract with a schema -> Validate | formats, arithmetic, GSTIN, duplicates

  Validate -[passes]-> Post to accounting -> Audit trail

  Validate -[fails]-> Review screen | image beside fields

  Review screen -[corrected]-> Post to accounting

  Review screen -[corrected]-> New test case'
deep_dives:
- title: Validation
  body: 'Code checks every field: GSTIN format and checksum, date in range, line totals adding up to the invoice total within ₹1, tax rates valid, and the invoice number not already posted for that supplier.'
- title: Review screen
  body: Shows the page image beside the extracted fields with failed checks in red; corrections are saved as new test cases, so accuracy improves on the suppliers that fail most.
failures:
- risk: Wrong total posted
  mitigation: Arithmetic validation blocks it
- risk: Duplicate invoice
  mitigation: Supplier + number uniqueness check
- risk: Unreadable photo
  mitigation: OCR confidence threshold sends it to review
evals:
- 300 labelled invoices across suppliers and formats; accuracy per field
- Share sent to review and time per review
- Weekly sample of posted invoices audited
trade_offs:
- A vision model handles messy photos but costs more than OCR; route by document type
- Strict validation means more reviews but almost no wrong postings
follow_ups:
- How would you handle a new supplier layout?
- What if the accounting API is down?
