id: voice-booking-agent
title: A voice agent that books appointments
prompt: Design a phone voice agent for a clinic chain that books, moves and cancels appointments in English, Hindi and Tamil.
summary: Speech to text, an LLM with booking tools, text to speech, tight latency, and hand-off to the front desk.
clarify:
- Which languages and accents, and how noisy are calls?
- Which booking system, and what can be changed by phone?
- How is the caller identified?
- What must go to a person (emergencies, complaints)?
requirements:
  functional:
  - Understand the request and check slots
  - Book, move or cancel and confirm by SMS
  - Hand over to staff with a summary
  non_functional:
  - Reply starts within about 1 s of the caller stopping
  - Never gives medical advice; emergencies go to a person at once
  - Calls recorded only with consent
estimates:
- label: Volume
  value: 3,000 calls a day, peak 40 at once
- label: Call length
  value: About 2 minutes
- label: Latency budget
  value: Speech-to-text 300 ms, model 500 ms, voice 200 ms
architecture: 'Caller -> Phone line -> Speech to text -> LLM + prompt

  LLM + prompt -[tool call]-> Booking tools | find slots, book, cancel

  Booking tools -[result]-> LLM + prompt

  LLM + prompt -> Text to speech -> Caller

  LLM + prompt -[emergency or unsure]-> Transfer to the front desk

  Booking tools -> SMS confirmation'
deep_dives:
- title: Latency
  body: 'Stream every stage: partial transcripts, streamed tokens, and voice that starts on the first sentence. Use a small fast model for the conversation and keep the prompt short and cached.'
- title: Safety
  body: Emergency words trigger an immediate transfer. The agent confirms date, time and doctor back to the caller before booking, and sends an SMS confirmation.
failures:
- risk: Misheard names or dates
  mitigation: Read back and confirm before booking
- risk: Medical question
  mitigation: Refuse and offer a call-back from staff
- risk: Booking system down
  mitigation: Take details and promise a call-back; log for staff
evals:
- 200 recorded test calls across languages and accents
- Booking accuracy, transfer accuracy, time to first word
trade_offs:
- A smaller model is faster but makes more mistakes; confirm before acting
- 'Full automation vs transfer: start with booking only'
follow_ups:
- How would you handle a caller switching languages mid-call?
- How do you stop double bookings?
