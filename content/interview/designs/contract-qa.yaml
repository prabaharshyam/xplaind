id: contract-qa
title: Question answering over long legal contracts
prompt: Design a tool where a legal team uploads contracts and asks questions such as "what is the termination notice period?"
summary: Long context with prompt caching for one contract, retrieval across many, strict citations to clauses, and lawyer review of risky answers.
clarify:
- One contract at a time, or questions across hundreds?
- How long are contracts, and are they scanned?
- How exact must answers be, and who checks them?
- 'Confidentiality rules: may text leave the region?'
requirements:
  functional:
  - Upload and parse contracts with clause structure
  - Answer with the exact clause cited
  - Compare a clause across many contracts
  non_functional:
  - Every answer cites a clause; no citation, no answer
  - Documents stay in the firm's cloud region
  - Answer under 10 s for one contract
estimates:
- label: Contract size
  value: 40-120 pages, about 40,000-100,000 tokens
- label: Library
  value: 5,000 contracts
- label: Questions
  value: 2,000 a day
architecture: 'Upload -> Parse with clause structure -> Store clauses with numbers

  Question on one contract -[fits the window]-> Whole contract, cached prefix -> Model

  Question across contracts -> Retrieve matching clauses -> Model

  Model -> Answer citing clause numbers -> Check quotes match

  Check quotes match -[risky topic]-> Lawyer review'
deep_dives:
- title: Long context or retrieval
  body: For one contract, send it whole with the stable prefix cached, so follow-up questions are cheap and nothing is missed. Across the library, retrieve clauses by type (termination, liability) with metadata, then answer per contract in a table.
- title: Citations
  body: Clauses keep their numbers from parsing. The answer must quote the clause; code checks that the quote appears in that clause before showing it.
failures:
- risk: Answer from the wrong clause
  mitigation: Quote check against the cited clause
- risk: Scanned contract with OCR errors
  mitigation: OCR confidence shown; low confidence goes to review
- risk: Confidential data leaves the region
  mitigation: Model in the firm's region through the gateway
evals:
- 200 questions over 20 contracts with lawyer-written answers
- Citation accuracy and quote match rate
trade_offs:
- Long context is simpler and more complete for one document but costs more; caching closes much of the gap
- Requiring citations means some refusals, which lawyers prefer to guesses
follow_ups:
- How would you find every contract with an unusual liability cap?
- What if two clauses contradict each other?
