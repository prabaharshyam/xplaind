id: llm-platform-gateway
title: An internal LLM platform for many teams
prompt: Design a shared platform so 20 teams in a company can use LLMs safely, with control of cost and data.
summary: A gateway with per-team keys and budgets, model aliases and fallbacks, masked logging, shared evals and approved models.
clarify:
- How many teams and requests, and which models are approved?
- What data may go to which provider?
- Who pays, and how should cost be split?
- Self-hosted models needed?
requirements:
  functional:
  - One API for all approved models
  - Per-team keys, budgets and usage reports
  - Fallbacks and model aliases
  non_functional:
  - Provider keys never leave the platform
  - Logs masked; data stays in approved regions
  - 99.9% availability
estimates:
- label: Traffic
  value: 2 million requests a day, peak 200 a second
- label: Teams
  value: 20 teams, 60 features
- label: Spend
  value: About ₹40 lakh a month
architecture: 'Team feature -[team key]-> Gateway, 3 instances

  Gateway -> Budget and policy checks

  Budget and policy checks -[alias]-> Provider A, Mumbai

  Provider A, Mumbai -[fails]-> Provider A, second region

  Provider A, second region -[fails]-> Self-hosted open model

  Gateway -> Masked logs and usage by team

  Masked logs and usage by team -> Cost reports and alerts'
deep_dives:
- title: Policy
  body: Each key carries the team, allowed models, data class and monthly budget. Requests with confidential data can go only to models approved for it, such as the self-hosted one.
- title: Operations
  body: Model aliases let the platform team upgrade models after a shared eval run, without each team changing code. Alerts at 75% of budget; a hard stop at 100% unless the owner raises it.
failures:
- risk: Gateway outage stops every team
  mitigation: Several instances across zones; health checks
- risk: A team leaks data to an unapproved model
  mitigation: Data class on the key; policy check blocks it
- risk: Runaway spend
  mitigation: Per-key budgets and alerts
evals:
- Shared golden sets per alias, run before any model upgrade
- Latency and error rate per provider
trade_offs:
- A central gateway adds one hop of latency but gives control
- Self-hosting gives data control at the cost of running GPUs
follow_ups:
- How would you charge teams fairly?
- How do you roll out a new model safely?
