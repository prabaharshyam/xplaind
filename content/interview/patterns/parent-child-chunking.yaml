id: parent-child-chunking
name: Parent-child chunking
category: retrieval
summary: Search small, precise chunks, but send the model their larger parent section so it has the full context.
when_to_use:
- Answers need surrounding context (a table, a clause and its exceptions)
- Small chunks retrieve well but read badly
flow: 'Document -> Parent sections

  Parent sections -> Small child chunks -> Index

  Question -> Search child chunks -> Index

  Search child chunks -> Fetch their parents, de-duplicate -> Prompt'
trade_offs:
- Precise matching with readable context
- Uses more prompt tokens per answer
- More bookkeeping in the index
pitfalls:
- Parents so large they crowd out other evidence
- Forgetting to de-duplicate when two children share a parent
say_it: I would index small child chunks for precise matching but send their parent sections to the model, de-duplicated, so it sees the whole clause or table. That trades some tokens for fewer half-answers.
questions:
- choose-chunk-size
lessons:
- chunking
- advanced-retrieval
