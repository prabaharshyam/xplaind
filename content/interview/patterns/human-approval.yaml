id: human-approval
name: Human approval for actions
category: agents
summary: Pause before costly, irreversible or external actions; show a person the action and evidence; resume with their decision.
when_to_use:
- Refunds, payments, emails to customers, record changes, deletions
- Regulated decisions
flow: 'Agent proposes an action -> Risk rules

  Risk rules -[read, or small and reversible]-> Run it

  Risk rules -[costly or external]-> Save a checkpoint and pause

  Save a checkpoint and pause -> Approval card | action, reason, evidence

  Approval card -[approve, edit or reject]-> Resume from the checkpoint'
trade_offs:
- Safety and accountability
- Slower; needs people on call and reminders
pitfalls:
- Approval on everything, so people click yes without reading
- No timeout or escalation when nobody answers
say_it: 'I would let the agent act alone on reads and small reversible steps, and pause on anything costly or external: save state, show a person the action with its evidence, and resume with their decision. I would log the decision time to tune the thresholds.'
