id: online-evals
name: Online evals and tracing
category: evals
summary: Trace every request in production, score them with rules, a judge on a sample and user feedback, and turn failures into test cases.
when_to_use:
- After launch, when real inputs differ from the test set
- When users report problems you cannot reproduce
flow: 'Live request -> Trace | prompt, retrieval, tools, tokens, cost, latency

  Trace -> Rules on every trace

  Trace -> Judge on a sample + all thumbs-down

  Trace -> Weekly human review

  Rules on every trace -> Dashboard and alerts

  Judge on a sample + all thumbs-down -> Dashboard and alerts

  Weekly human review -> New golden cases'
trade_offs:
- Finds problems the test set missed
- 'Traces may hold personal data: mask them'
pitfalls:
- Logging without ever reading
- Tracing that leaks customer data
say_it: Offline evals are not enough, so I would trace every request with prompt and model versions, run cheap rules on all of them and a judge on a sample plus every thumbs-down, review 50 traces a week, and feed failures back into the golden set.
questions:
- monitor-llm-app
- what-to-trace
- good-offline-bad-online
lessons:
