id: streaming-and-queues
name: Streaming and background queues
category: serving
summary: Stream tokens so users see words at once, and move slow work (OCR, indexing, batch jobs) to a queue.
when_to_use:
- Model calls take seconds
- Some work does not need to finish before replying
flow: 'User -> API

  API -[stream tokens]-> First words in under 1 s

  API -[slow work]-> Queue -> Workers | OCR, indexing

  Workers -[failures retry with backoff]-> Dead-letter queue after N tries

  API -[job id]-> User checks status'
trade_offs:
- Feels fast even when total time is long
- Queues add moving parts to monitor
pitfalls:
- Timeouts shorter than model calls
- No dead-letter queue, so failed jobs vanish
say_it: I would stream tokens so the first words arrive in under a second, set timeouts above the model's worst case, and move slow work like OCR to a queue with retries, a dead-letter queue and a job id the user can poll.
questions:
