id: supervisor-subagents
name: Supervisor and sub-agents
category: agents
summary: A lead agent splits work into parts, runs sub-agents with fresh contexts in parallel, and merges their summaries.
when_to_use:
- Independent parts that can run in parallel
- One context window cannot hold everything
flow: 'Lead agent: plan the parts -> Sub-agent A | own context and tools

  Lead agent: plan the parts -> Sub-agent B | own context and tools

  Lead agent: plan the parts -> Sub-agent C | own context and tools

  Sub-agent A -[short summary]-> Lead merges and checks conflicts

  Sub-agent B -[short summary]-> Lead merges and checks conflicts

  Sub-agent C -[short summary]-> Lead merges and checks conflicts'
trade_offs:
- Parallel and clean contexts
- Several times the tokens of one agent
- Harder to debug
pitfalls:
- Multi-agent where one agent would do
- Sub-agents returning whole transcripts instead of summaries
say_it: I would start with one agent and only split when parts are independent or the context overflows; then a lead plans, sub-agents run in parallel with their own tools, and each returns a short sourced summary.
questions:
- when-multi-agent
lessons:
- multi-agent-systems
- agent-sdks-subagents
