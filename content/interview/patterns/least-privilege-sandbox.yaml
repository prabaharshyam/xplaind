id: least-privilege-sandbox
name: Least privilege and sandboxing
category: safety
summary: Give each tool the narrowest access, and run generated code in a locked-down sandbox.
when_to_use:
- Agents that query data or run code
- Tools that touch production systems
flow: 'Agent -> Query tool | read-only role, row filters

  Agent -> Code runner | container, no network, no secrets, CPU and time caps

  Agent -> No delete tool, no shell on the host

  Code runner -> Only charts and CSVs come out'
trade_offs:
- Limits the blast radius of any failure
- More setup per tool
pitfalls:
- One admin key shared by every tool
- A sandbox with network access
say_it: I would give each tool its own narrow role, with read-only views and row filters for data, and run generated code in a container with no network, no secrets and hard CPU and time limits, so the worst case stays small.
questions:
- agent-sandboxing
- computer-use-agent-risks
lessons:
- agent-permissions-sandboxing
