id: budgets-kill-switch
name: Budgets and kill switches
category: agents
summary: Cap steps, tokens, time and money per task, user and day, and let an operator stop any agent instantly.
when_to_use:
- Any agent in production
- Agents that can loop or call paid APIs
flow: 'Every task -> Caps | steps, tokens, time

  Every tool call -> Checks | kill switch, repeated calls

  Every day -> Spend caps | per user, per feature, alert at 75%

  Caps -> Shared store

  Checks -> Shared store

  Spend caps -> Shared store

  Shared store -> Provider spend limit | the backstop'
trade_offs:
- Prevents runaway bills and loops
- Caps can stop a legitimate long task
pitfalls:
- Only a provider limit, which stops everyone at once
- Kill switch that needs a deploy
say_it: I would put budgets at three levels, task, user and day, in a shared store, with a kill switch an operator can flip without a deploy, and the provider limit only as a backstop.
