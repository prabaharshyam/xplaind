id: agent-loop
name: Agent loop
category: agents
summary: A model that repeatedly chooses a tool, sees the result, and decides the next step until the task is done.
when_to_use:
- The steps are not known in advance
- The task needs information gathered along the way
flow: 'Model: task + history + tools -> Wants a tool?

  Wants a tool? -[yes]-> Your code validates and runs it -> Model: task + history + tools

  Wants a tool? -[no]-> Final answer

  Your code validates and runs it -[step cap or budget hit]-> Stop, hand to a person'
trade_offs:
- Handles open-ended tasks
- Less predictable, slower and costlier than a fixed workflow
- Needs caps, logs and evals
pitfalls:
- Using an agent where a fixed workflow would do
- No step cap or budget
say_it: 'If the steps are known, I would build a workflow; if not, an agent loop: the model picks a tool, my code validates and runs it, the result goes back, with a step cap and a budget, and a hand-off to a person when either is hit.'
questions:
