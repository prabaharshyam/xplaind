id: regression-gate
name: Regression gate in CI
category: evals
summary: Run a fast eval tier on every change and a full tier before deploy, and block merges that make a category worse.
when_to_use:
- Prompts, models or retrieval change often
- Several people edit the same feature
flow: 'Pull request -> Fast tier, about 90 s | format, critical cases, must-refuse cases

  Fast tier, about 90 s -[fails]-> Merge blocked

  Fast tier, about 90 s -[passes]-> Full tier before deploy | all cases vs the production baseline

  Full tier before deploy -[no critical category down]-> Deploy'
trade_offs:
- Catches breaks before users do
- Eval runs cost money and time
pitfalls:
- Only manual spot checks
- A gate so flaky people learn to ignore it
say_it: 'Prompt changes are code changes, so I would gate them in CI: a 90-second tier on every push and a full tier before deploy, compared with the production baseline by category.'
