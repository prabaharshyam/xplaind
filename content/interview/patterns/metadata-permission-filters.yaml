id: metadata-permission-filters
name: Metadata and permission filters
category: retrieval
summary: Store who may see each chunk and what it is about, and filter inside the search before ranking.
when_to_use:
- Enterprise data with access rights
- Documents that differ by region, product, date or version
- Old versions must not be cited
flow: 'Source document + its permissions -> Chunk + metadata | groups, region, effective date, version

  User signs in -> Verified groups

  Verified groups -> Search with filters

  Chunk + metadata -> Search with filters

  Search with filters -> Only permitted, current chunks'
trade_offs:
- Prevents leaks and stale answers at the source
- Permissions must be re-synced as they change
- Filters can hide the right answer if metadata is wrong
pitfalls:
- Filtering after ranking, so the top k is mostly empty
- Enforcing access rules in the prompt instead of code
- Missing permissions defaulting to visible
say_it: 'Access control has to live in retrieval, not the prompt: every chunk carries its allowed groups and effective dates, and the search filters on the verified user before ranking. Missing permissions mean visible to nobody.'
questions:
