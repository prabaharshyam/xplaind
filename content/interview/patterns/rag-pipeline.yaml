id: rag-pipeline
name: RAG pipeline
category: retrieval
summary: 'Answer from your own documents: retrieve the right passages at question time and make the model answer only from them, with citations.'
when_to_use:
- The answer lives in documents that change (policies, manuals, tickets)
- You need citations a person can check
- The data is too big or too private to fine-tune on
flow: 'Documents -> Parse and chunk -> Embed -> Vector index

  Question -> Retrieve top k -> Vector index

  Retrieve top k -> Rerank -> Prompt with numbered passages -> Answer with citations'
trade_offs:
- 'Cheap to update: re-index instead of retraining'
- Every answer can be traced to a source
- 'Quality is capped by retrieval: if the passage is not found, the model cannot use it'
- Adds latency and a store to run
pitfalls:
- Skipping evaluation of retrieval itself
- Chunks that cut tables and topics in half
- Letting the model answer when nothing relevant was found
say_it: 'I would use a RAG pipeline: index the documents in structure-aware chunks, retrieve with hybrid search and a reranker, and make the model answer only from numbered passages with citations. I would measure retrieval recall separately from answer faithfulness, so I know which half broke.'
