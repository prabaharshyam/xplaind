id: llm-gateway
name: LLM gateway with fallbacks
category: serving
summary: 'One service in front of every model call: keys, budgets, retries, fallbacks, logging and model aliases.'
when_to_use:
- Several teams or features call models
- You need to switch providers or survive outages
flow: 'Feature A -[key A]-> Gateway

  Feature B -[key B]-> Gateway

  Gateway -[alias chat-default]-> Primary model

  Primary model -[timeout or 5xx]-> Same model, second region

  Same model, second region -[fails]-> Approved fallback model

  Gateway -> Logs | team, feature, tokens, cost, latency'
trade_offs:
- One place for keys, budgets and switching models
- Another service to run; a single point of failure if not redundant
pitfalls:
- Provider keys spread across services
- Fallback models never tested on the golden set
say_it: 'I would put an LLM gateway in front of every call: per-feature keys and budgets, retries with backoff, model aliases so we can switch without deploys, and a tested fallback chain for outages.'
questions:
- why-llm-gateway
