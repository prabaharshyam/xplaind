id: structured-output
name: Structured output with validation
category: serving
summary: Make the model return JSON that matches a schema, validate it in code, and retry once with the error.
when_to_use:
- Extraction from documents or messages
- Any output another system reads
flow: 'Messy text + schema -> Model in JSON or tool mode -> Validate in code

  Validate in code -[ok]-> Save

  Validate in code -[fails]-> Retry once with the error

  Retry once with the error -[fails again]-> A person reviews'
trade_offs:
- Reliable machine-readable output
- Strict schemas can reject valid edge cases
pitfalls:
- Parsing free text with regex
- Trusting the JSON without checking types and ranges
say_it: I would use the provider's schema or tool mode, validate every field in code (types, ranges, totals that add up), retry once with the validation error, and send repeat failures to a review queue.
questions:
- ai-invoice-extraction
- invoice-amount-validation
- map-json-fields
