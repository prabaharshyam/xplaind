id: long-context-or-rag
name: Long context or RAG
category: retrieval
summary: Decide whether to send whole documents in a long context window or retrieve a few passages.
when_to_use:
- A few long documents per question (one contract)
- Millions of documents across a company
- Cost or latency limits
flow: 'How much text per question? -[a few documents]-> Long context | send them whole, cache the prefix

  How much text per question? -[a large library]-> RAG | retrieve the top passages

  How much text per question? -[in between]-> Find the right 2 documents, send them whole'
trade_offs:
- Long context is simple and sees everything, but costs more and is slower
- RAG is cheap and scales, but misses what retrieval misses
pitfalls:
- Assuming a bigger window means better answers
- Ignoring prompt caching for repeated long documents
say_it: 'It depends on how much text each question needs. For one contract I would send it whole with prompt caching; for a company library I would use RAG; often the best is in between: retrieve the right two documents and send them whole.'
