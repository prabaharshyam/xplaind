id: guardrail-layers
name: Guardrail layers
category: safety
summary: Checks before the model (input), after it (output) and before any action, each logged with its reason.
when_to_use:
- Customer-facing assistants
- Regulated domains
flow: 'User text -> Input checks | mask personal data, injection, on topic

  Input checks -> Model -> Output checks | advice, promises, other customers'' data

  Output checks -[fail]-> Regenerate once, then a safe template

  Output checks -[pass]-> Action checks | limits, recipients, approvals

  Action checks -> The tool runs'
trade_offs:
- Defence in depth
- Every check adds latency; false positives annoy users
pitfalls:
- One giant system prompt as the only guardrail
- Checks with no logging, so nobody can tune them
say_it: 'I would layer guardrails: rules and a classifier on input, a model check on output with one regeneration then a safe fallback, and hard limits in code before any action, logging every trigger so we can tune false positives.'
questions:
- protect-user-data
- design-for-wrong-answers
lessons:
