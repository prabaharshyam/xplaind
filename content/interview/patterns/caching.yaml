id: caching
name: Prompt and response caching
category: serving
summary: 'Reuse work: cache the stable start of prompts, and cache whole answers to repeated questions.'
when_to_use:
- Long fixed instructions or documents sent every call
- Many users ask the same questions
flow: 'Request -> Stable prefix first | instructions, tools, documents

  Stable prefix first -[prompt cache hit]-> Cheaper, faster first token

  Request -> Response cache | key = normalised question + versions

  Response cache -[hit]-> Answer instantly

  Response cache -[miss]-> Model -> Stream to the user'
trade_offs:
- Lower cost and latency
- A stale cache gives outdated answers
pitfalls:
- Putting the changing part first, which breaks prompt caching
- Cache keys without prompt and model versions
say_it: I would order every prompt stable-first so the provider can cache the prefix, and add a response cache keyed on the normalised question plus prompt and model versions, with a short expiry for anything time-sensitive.
questions:
- prompt-caching-explained
- reduce-latency
lessons:
- caching-and-speed
