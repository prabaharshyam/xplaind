id: model-router
name: Model routing and tiering
category: serving
summary: Send easy requests to a small, cheap model and hard ones to a large model, checked by a validator.
when_to_use:
- High volume with mixed difficulty
- Cost or latency pressure
flow: 'Request -> Router

  Router -[easy]-> Small model -> Validator passes?

  Validator passes? -[yes]-> Answer

  Validator passes? -[no]-> Large model

  Router -[hard]-> Large model -> Answer

  Request -[can wait hours]-> Batch API, discounted'
trade_offs:
- Large savings at similar quality
- A router that misroutes hurts quality silently
pitfalls:
- Routing without measuring quality per route
- Never using the batch API for work that can wait
say_it: I would measure what share of traffic is easy, route it to a small model with a validator that escalates failures to the large model, and push anything that can wait into the discounted batch API.
questions:
- model-size-choice
- control-llm-cost
- llm-bill-doubled
lessons:
- batching-model-tiering
- quality-cost-speed
