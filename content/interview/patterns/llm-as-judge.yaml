id: llm-as-judge
name: LLM as judge
category: evals
summary: A model grades outputs against a rubric, calibrated against human grades before its scores are trusted.
when_to_use:
- 'Open-ended outputs code cannot check: faithfulness, tone, helpfulness'
- Too many outputs for people to grade
flow: 'Output + rubric -> Judge model | list problems, then a verdict

  Judge model -> Scores

  Human grades on a sample -> Calibration | agreement rate

  Scores -> Calibration | agreement rate

  Calibration | agreement rate -[about 90% or more]-> Trust it for this rubric'
trade_offs:
- Scales grading to thousands of outputs
- 'Judges have biases: position, length, self-preference'
pitfalls:
- Trusting a judge never compared with people
- Asking for a score with no reasoning first
say_it: For open-ended quality I would use an LLM judge with a specific rubric that lists problems before its verdict, swap answer order to cancel position bias, and trust it only after it agrees with human graders on about 90% of a sample.
questions:
