id: grounded-citations
name: Grounded answers with citations
category: retrieval
summary: Make the model answer only from given passages, cite them by id, and refuse when they do not cover the question.
when_to_use:
- 'Answers people act on: policy, legal, medical, finance'
- Users must be able to verify
flow: 'Retrieved passages [1]..[5] -> Prompt: use only these, cite ids, refuse if not covered

  Prompt: use only these, cite ids, refuse if not covered -> Answer with [ids]

  Answer with [ids] -> Checks | ids exist, quotes match, claims supported'
trade_offs:
- 'Trust: every claim points to a page'
- More refusals, which users may dislike at first
- Citation checks add a little latency
pitfalls:
- Citations the model invents
- Refusing with no next step for the user
say_it: I would number the passages, require the answer to cite ids, and check in code that each cited id exists and quoted words appear in it. When the passages do not cover the question, it says so and points to a person or page.
questions:
- grounding-and-citations
- why-hallucinate
lessons:
- grounding-citations
reviewed_by: UNREVIEWED
reviewed_on: '2026-11-07'
