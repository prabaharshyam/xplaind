id: query-rewriting
name: Query rewriting
category: retrieval
summary: 'Turn what the user typed into a better search query: standalone, expanded, or split into parts.'
when_to_use:
- Follow-up questions that depend on chat history ("and for seniors?")
- Short or vague queries
- Questions that need several searches
flow: 'User message + chat history -> Rewrite into a standalone query

  Rewrite into a standalone query -[short query]-> HyDE: draft an answer, embed it

  Rewrite into a standalone query -> Search

  HyDE: draft an answer, embed it -> Search'
trade_offs:
- Big gains on conversational search
- One extra model call per question
- A bad rewrite can drift from what the user meant
pitfalls:
- Rewriting every query, even clear ones
- Not logging the rewritten query, so failures cannot be debugged
say_it: Because users ask follow-ups, I would add a query-rewrite step that turns the last message and history into a standalone search query, and HyDE only for very short queries. I would log both versions in the trace so we can see when the rewrite caused a miss.
questions:
