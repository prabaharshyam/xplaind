id: plan-and-reflect
name: Plan, execute, reflect
category: agents
summary: A planner writes the steps, each step runs a short loop, and a check pass reviews the draft before the final answer.
when_to_use:
- Long research or multi-part tasks
- Pure ReAct drifts or loses the goal
flow: 'Planner writes steps -> Step 1: short tool loop -> Step 2: short tool loop -> Draft

  Draft -> Checks | totals add up, every claim sourced

  Checks -[fail]-> One revision -> Final

  Checks -[pass]-> Final'
trade_offs:
- Stays on track on long tasks
- More calls and latency than a single loop
pitfalls:
- Unlimited revision rounds
- Checks done only by the same model, never by code
say_it: For long tasks I would plan first, run each step as a short capped loop, then check the draft with code where possible and a model where not, allowing one revision.
questions:
- planning-and-reflection
lessons:
- planning-reflection
