id: agent-memory
name: Short- and long-term memory
category: agents
summary: Keep the current conversation compact, and save durable facts about the user across sessions with source and date.
when_to_use:
- Assistants people return to
- Long conversations that overflow the context
flow: 'Current thread -> Summary of old turns + last turns in full -> Model call

  Finished task -[background job extracts facts]-> Long-term store | per user, with source and date

  Long-term store -[read relevant facts]-> Model call'
trade_offs:
- Personal and consistent
- 'Privacy duties: users must see and delete what is stored'
pitfalls:
- Saving everything
- Facts with no date, so stale ones never expire
- Reading memory across users
say_it: I would summarise old turns to keep the thread small, and have a background job save durable facts per user with source and date, always filtered by user id, visible and deletable by the user.
questions:
