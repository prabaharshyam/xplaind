# Draft wording and hours from the PRD. Hours are estimates to replace after the soft launch.
# Topics are the roadmap outline, drafted by Claude for review. A topic id is the
# shared tag: placement questions use it and the stop that teaches it lists it.
levels:
  - id: B1
    name: AI newcomer
    can_do: Explain in plain words what AI, machine learning and a language model are; use a chat assistant for a real task; spot a wrong or made-up answer
    draft_hours: 8
    exit_check: Write three prompts for a work task and check the answers against a source
    topics:
      - id: ai-basics
        title: AI, machine learning and language models
        summary: Say in plain words what each one is and how they fit together.
      - id: llm-basics
        title: How a language model writes
        summary: Why it predicts the next word, and what it can and cannot know.
      - id: prompting-basics
        title: Prompting for a real task
        summary: Give context, an example and a format, then refine the answer.
      - id: hallucination
        title: Spotting wrong and made-up answers
        summary: Check claims, sources and numbers before you trust them.
      - id: ai-safety
        title: Using AI safely at work
        summary: Keep private data out, follow your company's rules, know the limits.
      - id: ai-tools-landscape
        title: The main AI assistants
        summary: What the popular assistants are good at, and when to switch.
        optional: true
  - id: B2
    name: Python starter
    can_do: Write and run short Python programs with variables, loops, functions, lists and dictionaries; read and write a file
    draft_hours: 25
    exit_check: A script that cleans a CSV file
    topics:
      - id: python-setup
        title: Set up Python and an editor
        summary: Install Python, run a file and use a code editor.
      - id: python-basics
        title: Variables, loops and conditions
        summary: Store values, repeat work and make decisions in code.
      - id: python-functions
        title: Functions
        summary: Break a program into small reusable pieces.
      - id: python-data-structures
        title: Lists and dictionaries
        summary: Hold many values and look things up by name.
      - id: python-files-errors
        title: Files and errors
        summary: Read and write files, and handle what goes wrong.
      - id: python-classes
        title: Classes and objects
        summary: Group data with the code that uses it.
        optional: true
  - id: B3
    name: Data and tools
    can_do: Use libraries, the terminal and Git; call a web API and read JSON; handle tables with pandas
    draft_hours: 20
    exit_check: A script that calls a public API, saves results and is pushed to GitHub
    topics:
      - id: terminal-git
        title: The terminal and Git
        summary: Move around in a terminal, save your work in Git and push to GitHub.
      - id: python-libraries
        title: Packages and virtual environments
        summary: Install libraries with pip and keep each project separate.
      - id: web-apis
        title: Web APIs and JSON
        summary: Call a web API, read the JSON reply and handle status codes.
      - id: pandas-basics
        title: Tables with pandas
        summary: Load, filter, group and clean a table of data.
      - id: sql-basics
        title: SQL basics
        summary: Ask a database questions with SELECT, WHERE and JOIN.
        optional: true
  - id: I1
    name: LLM builder
    can_do: Call an LLM API; manage prompts, tokens and context; get structured JSON output; handle errors and cost
    draft_hours: 20
    exit_check: A small web or command-line app that uses an LLM API
    topics:
      - id: llm-api
        title: Calling an LLM API
        summary: Send a prompt from code and use the reply in a program.
      - id: system-prompts
        title: System prompts and prompt design
        summary: Set the model's role and rules, and test prompts like code.
      - id: tokens-context
        title: Tokens and the context window
        summary: How text is counted, what fits, and what it costs.
      - id: structured-output
        title: Structured JSON output
        summary: Get answers in a fixed shape your code can trust.
      - id: llm-cost-errors
        title: Errors, retries and cost
        summary: Handle rate limits and failures, and keep spending in check.
      - id: streaming
        title: Streaming answers
        summary: Show the answer as it is written, for a faster-feeling app.
        optional: true
  - id: I2
    name: RAG builder
    can_do: Explain embeddings, chunking and vector search; build question answering over their own documents; check whether retrieval found the right text
    draft_hours: 30
    exit_check: A RAG app over 20 or more documents with a 20-question test set
    topics:
      - id: embeddings
        title: Embeddings
        summary: Turn text into numbers that capture meaning.
      - id: chunking
        title: Chunking documents
        summary: Split documents into pieces that retrieval can find.
      - id: vector-search
        title: Vector search
        summary: Find the closest pieces of text with a vector database.
      - id: rag-pipeline
        title: A full RAG app
        summary: Retrieve, then answer with sources, over your own documents.
      - id: retrieval-eval
        title: Checking retrieval
        summary: Measure whether the right text was found, with a test set.
      - id: hybrid-search
        title: Hybrid search and reranking
        summary: Mix keyword and vector search, then rerank the results.
        optional: true
  - id: I3
    name: Agent builder
    can_do: Explain tool calling and agent loops; build an agent with tools; name common failure modes
    draft_hours: 30
    exit_check: A multi-step agent that completes a task, with logs
    topics:
      - id: tool-calling
        title: Tool calling
        summary: Let the model ask your code to run a function.
      - id: agent-loop
        title: The agent loop
        summary: Think, act, look at the result, repeat until done.
      - id: agent-logging
        title: Logs and traces for agents
        summary: Record every step so you can see what the agent did.
      - id: agent-failures
        title: How agents fail
        summary: Loops, wrong tools and runaway costs, and how to stop them.
      - id: mcp
        title: Model Context Protocol
        summary: Connect an agent to tools and data through MCP servers.
        optional: true
  - id: P1
    name: Quality engineer
    can_do: Design test sets and evals; know the limits of LLM judges; defend against basic prompt injection
    draft_hours: 25
    exit_check: An eval harness that shows a measured improvement
    topics:
      - id: evals
        title: Test sets and evals
        summary: Build a test set and score your app before every change.
      - id: llm-judges
        title: LLM judges and their limits
        summary: Use a model to grade answers, and check that it grades fairly.
      - id: regression-testing
        title: Regression tests for prompts
        summary: Catch a change that makes yesterday's answers worse.
      - id: prompt-injection
        title: Prompt injection defence
        summary: Stop text in documents or users from taking over your app.
      - id: red-teaming
        title: Red-teaming
        summary: Try to break your own app before someone else does.
        optional: true
  - id: P2
    name: Production engineer
    can_do: Deploy, monitor and cache; control latency and cost; handle security and privacy
    draft_hours: 30
    exit_check: A deployed app with monitoring and a cost report
    topics:
      - id: deployment-monitoring
        title: Deploy and monitor
        summary: Ship the app and watch errors, quality and usage.
      - id: caching-latency
        title: Caching and speed
        summary: Reuse work and cut waiting time.
      - id: cost-control
        title: Cost control
        summary: Track spend per user and set limits.
      - id: security-privacy
        title: Security and privacy
        summary: Protect keys, user data and access.
      - id: model-routing
        title: Model routing
        summary: Send each request to the cheapest model that does it well.
        optional: true
  - id: P3
    name: AI system designer
    can_do: Choose between prompting, RAG and fine-tuning; design a system on a whiteboard; explain trade-offs in an interview
    draft_hours: 25
    exit_check: A written design for an AI product, plus ten interview questions answered aloud to a friend
    topics:
      - id: approach-selection
        title: Prompting, RAG or fine-tuning
        summary: Pick the right approach for the problem and say why.
      - id: system-design
        title: Designing an AI system
        summary: Draw the parts of an AI product and how data moves.
      - id: tradeoffs
        title: Quality, cost and speed trade-offs
        summary: Explain what you give up for what you gain.
      - id: design-interview
        title: The design interview
        summary: Talk through a design out loud, step by step.
      - id: fine-tuning
        title: Fine-tuning basics
        summary: When a custom model is worth it, and what it takes.
        optional: true
