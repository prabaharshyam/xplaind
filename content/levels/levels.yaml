# Draft wording and hours from the PRD. Hours are estimates to replace after the soft launch.
levels:
  - id: B1
    name: AI newcomer
    can_do: Explain in plain words what AI, machine learning and a language model are; use a chat assistant for a real task; spot a wrong or made-up answer
    draft_hours: 8
    exit_check: Write three prompts for a work task and check the answers against a source
  - id: B2
    name: Python starter
    can_do: Write and run short Python programs with variables, loops, functions, lists and dictionaries; read and write a file
    draft_hours: 25
    exit_check: A script that cleans a CSV file
  - id: B3
    name: Data and tools
    can_do: Use libraries, the terminal and Git; call a web API and read JSON; handle tables with pandas
    draft_hours: 20
    exit_check: A script that calls a public API, saves results and is pushed to GitHub
  - id: I1
    name: LLM builder
    can_do: Call an LLM API; manage prompts, tokens and context; get structured JSON output; handle errors and cost
    draft_hours: 20
    exit_check: A small web or command-line app that uses an LLM API
  - id: I2
    name: RAG builder
    can_do: Explain embeddings, chunking and vector search; build question answering over their own documents; check whether retrieval found the right text
    draft_hours: 30
    exit_check: A RAG app over 20 or more documents with a 20-question test set
  - id: I3
    name: Agent builder
    can_do: Explain tool calling and agent loops; build an agent with tools; name common failure modes
    draft_hours: 30
    exit_check: A multi-step agent that completes a task, with logs
  - id: P1
    name: Quality engineer
    can_do: Design test sets and evals; know the limits of LLM judges; defend against basic prompt injection
    draft_hours: 25
    exit_check: An eval harness that shows a measured improvement
  - id: P2
    name: Production engineer
    can_do: Deploy, monitor and cache; control latency and cost; handle security and privacy
    draft_hours: 30
    exit_check: A deployed app with monitoring and a cost report
  - id: P3
    name: AI system designer
    can_do: Choose between prompting, RAG and fine-tuning; design a system on a whiteboard; explain trade-offs in an interview
    draft_hours: 25
    exit_check: A written design for an AI product, plus ten interview questions answered aloud to a friend
