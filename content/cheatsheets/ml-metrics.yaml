id: ml-metrics
title: ML metrics
theme: ml
summary: 'Which metric to use and what it means: classification, regression, ranking and the traps.'
lessons:
- choosing-a-metric
- classification-models
- regression-models
- cross-validation-leakage
sections:
- title: Classification
  items:
  - term: Precision
    detail: 'Of what you flagged, how much was right: TP / (TP + FP).'
  - term: Recall
    detail: 'Of the real positives, how many you caught: TP / (TP + FN).'
  - term: F1
    detail: Harmonic mean of precision and recall.
  - term: PR AUC
    detail: Better than ROC AUC when positives are rare (fraud, defaults).
  - term: Accuracy trap
    detail: 99% accurate on 1% fraud can mean catching nothing.
- title: Regression
  items:
  - term: MAE
    detail: Average absolute error, in the target's units; easy to explain.
  - term: RMSE
    detail: Punishes big errors more.
  - term: MAPE
    detail: Error as a percentage; breaks near zero.
  - term: R squared
    detail: Share of variance explained; not an error measure.
- title: Ranking and retrieval
  items:
  - term: Recall at k
    detail: Was the right item in the top k?
  - term: MRR
    detail: 1 / rank of the first right item, averaged.
  - term: NDCG
    detail: Rewards right items near the top, with graded relevance.
- title: Doing it right
  items:
  - term: Threshold
    detail: 'Pick it from costs: a missed fraud vs a blocked good customer.'
  - term: Split by time
    detail: When rows are ordered in time, never train on the future.
  - term: Leakage
    detail: A feature that would not exist at prediction time makes results look better than they will be.
  - term: Confidence interval
    detail: 87% on 200 cases could be 82-92%; small differences may be noise.
reviewed_by: UNREVIEWED
