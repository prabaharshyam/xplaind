id: git
title: Git
theme: code
summary: The Git commands for daily work and team work, and how to get out of trouble.
lessons:
- terminal-and-git
- git-branches-merging
- git-undo-and-history
- git-with-a-team
sections:
- title: Daily
  items:
  - term: Status and diff
    detail: See what changed before you commit.
    code: 'git status

      git diff'
  - term: Commit
    detail: Stage files, then record a snapshot with a clear message.
    code: 'git add src/app.py

      git commit -m "Add retry on 429"'
  - term: Push and pull
    detail: Share your commits; fetch others'.
    code: 'git push

      git pull'
- title: Branches
  items:
  - term: New branch
    detail: One branch per change.
    code: git switch -c feat/retries
  - term: Pull request
    detail: Push the branch, open a PR, get review and green checks, then merge.
  - term: Update your branch
    detail: Bring in the new main.
    code: 'git fetch origin

      git merge origin/main'
- title: Trouble
  items:
  - term: Merge conflict
    detail: Edit the marked lines, keep the right version, then add and commit.
  - term: Undo a commit (shared)
    detail: git revert makes a new commit that undoes it; safe on shared branches.
  - term: Unstage
    detail: git restore --staged file
  - term: Throw away local edits
    detail: git restore file (gone for good)
- title: Good habits
  items:
  - term: .gitignore
    detail: Never commit .venv, __pycache__, .env or data dumps.
  - term: Small commits
    detail: One idea per commit, a message that says why.
  - term: Never commit secrets
    detail: If a key was pushed, rotate it; deleting the line is not enough.
reviewed_by: UNREVIEWED
