id: agents
title: AI agents
theme: agents
summary: The agent loop, tool design, memory, guardrails and the failures interviewers ask about.
lessons:
- agent-loop
- tool-calling
- agent-tool-design
- agent-memory
- agent-failures
- human-approval
- multi-agent-systems
sections:
- title: The loop
  items:
  - term: Model step
    detail: Model gets the task, history and tool list; answers or asks for a tool.
  - term: Tool step
    detail: Your code validates the arguments and runs the tool; the result goes back.
  - term: Stop
    detail: Final answer, step cap reached, budget hit, or hand over to a person.
  - term: Workflow vs agent
    detail: 'Known steps: a workflow. Unknown steps: an agent.'
- title: Tool design
  items:
  - term: Few tools
    detail: 3-8 task-shaped tools beat 20 API-shaped ones.
  - term: Clear names
    detail: Names and descriptions say when to use the tool.
  - term: Strict schemas
    detail: Typed parameters, enums, required fields; validate every call.
  - term: Read vs act
    detail: Reads run freely; actions that cost money or reach people need approval.
- title: Memory
  items:
  - term: Short-term
    detail: 'The current thread: a summary of old turns plus the last few in full.'
  - term: Long-term
    detail: Facts saved across sessions, always filtered by user id, with source and date.
  - term: Context engineering
    detail: 'Keep only what this step needs: notes, not every old tool result.'
- title: Failures and guards
  items:
  - term: Loops
    detail: Step cap and repeated-call detection.
  - term: Wrong tool
    detail: Fewer, clearer tools; strict schemas.
  - term: Made-up results
    detail: Answer only from tool results; check facts.
  - term: Unsafe actions
    detail: Least permission, human approval, kill switch.
  - term: Hijacked by text
    detail: External text is data; the tool list is fixed per task.
  - term: Runaway cost
    detail: Token and spend budgets per task and per user.
- title: Patterns
  items:
  - term: ReAct
    detail: Think, act, observe, repeat; adapts fast, can drift.
  - term: Plan then execute
    detail: A planner writes steps; each runs a short loop.
  - term: Reflection
    detail: A check pass before the final answer; one revision.
  - term: Supervisor + workers
    detail: A lead splits work into sub-agents with fresh contexts.
reviewed_by: UNREVIEWED
