id: llm-basics
title: LLM basics
theme: llm
summary: 'Tokens, context windows, sampling and the API call: the numbers and terms every LLM interview assumes you know.'
lessons:
- tokens-and-context
- first-llm-api-call
- transformers-explained
- structured-output
- errors-retries-cost
sections:
- title: Tokens
  items:
  - term: Token
    detail: A word piece; about 4 characters of English, about 0.75 words. Indian languages often take more.
  - term: Context window
    detail: 'The most tokens one call can hold: system prompt + history + documents + reply.'
  - term: Input vs output price
    detail: Output tokens usually cost several times more than input tokens.
  - term: Cost per request
    detail: (input tokens x input price + output tokens x output price) / 1,000,000.
- title: Sampling
  items:
  - term: Temperature
    detail: 0 = most likely tokens; higher = more varied. 0-0.3 for facts.
  - term: Top-p
    detail: Sample only from the smallest set of tokens covering probability p.
  - term: Max tokens
    detail: A hard cap on reply length; also caps cost.
  - term: Stop reason
    detail: 'Why it stopped: finished, hit max tokens, or asked for a tool.'
- title: The API call
  items:
  - term: Messages
    detail: A list of user and assistant turns; the system prompt sits apart.
    code: "client.messages.create(model=..., max_tokens=800,\n  system=\"...\", messages=[{\"role\": \"user\", \"content\": \"...\"}])"
  - term: Streaming
    detail: Send tokens as they are made so users see words in under a second.
  - term: Retries
    detail: Retry 429, 500-503 and timeouts with exponential backoff and jitter; never 400s.
  - term: Usage
    detail: Log input and output tokens per call; it is your bill.
- title: How it works
  items:
  - term: Next-token prediction
    detail: The model writes one token at a time, each chosen from a probability list.
  - term: Attention
    detail: Each token looks at every other token to decide what it means here.
  - term: Pre-training
    detail: Learns language from huge text; then tuned to follow instructions.
  - term: Hallucination
    detail: Fluent but false output; fix with grounding, tools and checks, not hope.
reviewed_by: UNREVIEWED
