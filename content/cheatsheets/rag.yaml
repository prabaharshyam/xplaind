id: rag
title: RAG
theme: retrieval
summary: 'Retrieval-augmented generation on one page: the pipeline, chunking, search, grounding and how to tell what broke.'
lessons:
- rag-app
- chunking
- embeddings
- vector-search
- hybrid-search-reranking
- check-retrieval
- grounding-citations
sections:
- title: The pipeline
  layout: steps
  items:
  - term: Ingest
    detail: Extract text from files, clean it, keep the source, page and section for every passage.
  - term: Chunk
    detail: Split by headings, then paragraphs; about 300-500 tokens with a little overlap.
  - term: Embed
    detail: Turn each chunk into a vector with one embedding model; store vector + text + metadata.
  - term: Retrieve
    detail: Embed the question with the same model, find the nearest chunks, filter by metadata.
  - term: Rerank
    detail: A cross-encoder rescores the top 20-50 and keeps the best 3-8.
  - term: Generate
    detail: Prompt = rules + numbered passages + question; answer only from them, with citations.
- title: Chunking
  items:
  - term: Fixed size
    detail: Fast and simple; cuts tables and topics in half.
  - term: Structure-aware
    detail: Split on headings and paragraphs; prepend the title path. The default to reach for.
  - term: Parent-child
    detail: Search small child chunks, send their larger parent section to the model.
  - term: Overlap
    detail: 10-15% so a sentence split across chunks is still findable.
- title: Search
  items:
  - term: Vector search
    detail: Finds meaning ("money back" matches "refund"); weak on exact codes and names.
  - term: BM25 keyword
    detail: Finds exact words, ids and error codes; misses paraphrases.
  - term: Hybrid
    detail: Run both, merge with reciprocal rank fusion. Usually beats either alone.
  - term: Metadata filters
    detail: Product, date, language, permissions; apply inside the search, before ranking.
  - term: Query rewrite
    detail: Turn a follow-up ("and for seniors?") into a standalone query using the chat history.
- title: Grounding
  items:
  - term: Cite by id
    detail: Number the passages [1]..[5]; the answer cites ids; the app links each to its page.
  - term: Refuse well
    detail: If the passages do not cover it, say so and give a next step. Never guess.
  - term: Check quotes
    detail: Verify cited ids exist and quoted words appear in the passage.
- title: What broke?
  items:
  - term: Right passage not in top k
    detail: 'A retrieval problem: chunking, embeddings, hybrid search, filters, query rewrite.'
  - term: Right passage there, wrong answer
    detail: 'A generation problem: prompt, grounding rules, citations, model choice.'
  - term: Measure retrieval
    detail: Recall at k and MRR on a golden set of 50-200 real questions with known passages.
  - term: Measure answers
    detail: Faithfulness and answer relevance, scored by a calibrated LLM judge plus a human sample.
reviewed_by: UNREVIEWED
reviewed_on: '2026-11-06'
