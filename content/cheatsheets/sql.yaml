id: sql
title: SQL
theme: data
summary: 'The SQL interviews and real work ask for: the query order, joins, grouping, window functions and indexes.'
lessons:
- sql-for-engineers
sections:
- title: How a query runs
  items:
  - term: Order
    detail: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT. Written order is different.
  - term: WHERE vs HAVING
    detail: WHERE filters rows before grouping; HAVING filters groups after.
  - term: 'NULL'
    detail: Unknown, not zero; use IS NULL, and COALESCE to replace it.
- title: Joins
  items:
  - term: INNER JOIN
    detail: Rows that match in both tables.
  - term: LEFT JOIN
    detail: Every row on the left, matches or NULL on the right.
  - term: Anti-join
    detail: 'Rows with no match: LEFT JOIN, then WHERE right.id IS NULL.'
    code: 'SELECT c.* FROM customers c

      LEFT JOIN orders o ON o.customer_id = c.id

      WHERE o.id IS NULL;'
  - term: Fan-out
    detail: Joining one-to-many multiplies rows; aggregate before or after on purpose.
- title: Grouping
  items:
  - term: GROUP BY
    detail: One row per group with aggregates.
    code: 'SELECT city, COUNT(*), SUM(amount)

      FROM orders GROUP BY city;'
  - term: COUNT(*) vs COUNT(col)
    detail: COUNT(col) skips NULLs.
  - term: CASE
    detail: Conditional values inside a query.
    code: SUM(CASE WHEN status = 'refund' THEN 1 ELSE 0 END)
- title: Window functions
  items:
  - term: ROW_NUMBER
    detail: Number rows per group; pick the latest or top N.
    code: ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY created_at DESC)
  - term: Running total
    detail: SUM(amount) OVER (ORDER BY day)
  - term: LAG / LEAD
    detail: Compare a row with the previous or next one.
  - term: RANK vs DENSE_RANK
    detail: RANK skips numbers after ties; DENSE_RANK does not.
- title: Speed
  items:
  - term: Index
    detail: Lets the database jump to rows instead of reading them all.
  - term: EXPLAIN
    detail: Shows the plan; look for sequential scans on big tables.
  - term: Select less
    detail: Name the columns you need; filter early.
reviewed_by: UNREVIEWED
