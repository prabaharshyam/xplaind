id: evals
title: Evals for LLM apps
theme: evals
summary: 'How to know an LLM app works: test sets, scorers, LLM judges, regression gates and online monitoring.'
lessons:
- evals-test-sets
- llm-judges
- regression-tests
- online-evals-feedback
- evaluating-agents
sections:
- title: Test sets
  items:
  - term: Golden set
    detail: 50-200 real inputs with what a good answer must contain.
  - term: Categories
    detail: Group cases (routine, complaints, must-escalate) and report each; an average hides breaks.
  - term: Hard cases
    detail: Add past failures and edge cases on purpose.
  - term: Keep it fresh
    detail: Every production bug becomes a new test case.
- title: Scorers
  items:
  - term: Code checks
    detail: 'Exact and free: valid JSON, length, citation present, required fields.'
  - term: LLM judge
    detail: A model grades against a rubric; list problems first, then a verdict.
  - term: Pairwise
    detail: Show A vs B and B vs A; keep only consistent verdicts.
  - term: Human sample
    detail: Experts grade a sample to calibrate the judge.
- title: RAG metrics
  items:
  - term: Recall at k
    detail: Share of questions whose right passage is in the top k.
  - term: Faithfulness
    detail: Every claim in the answer is supported by the passages.
  - term: Answer relevance
    detail: The answer addresses the question asked.
  - term: Context precision
    detail: How much of what was retrieved was actually useful.
- title: Gates and monitoring
  items:
  - term: Fast tier
    detail: 'On every push, about 90 s: format, critical cases, must-refuse cases.'
  - term: Full tier
    detail: 'Before deploy: all cases by category against the production baseline.'
  - term: Ship rule
    detail: No critical category gets worse, overall within tolerance.
  - term: Online
    detail: Rules on every trace, a judge on a sample and on negative feedback, a weekly human review.
- title: 'Judges: watch for'
  items:
  - term: Position bias
    detail: Prefers the first answer shown; swap the order.
  - term: Length bias
    detail: Prefers longer answers; tell it length is not quality.
  - term: Self-preference
    detail: Prefers its own model's style; use a different judge model where you can.
  - term: Calibrate
    detail: Trust a judge only after it agrees with humans on about 90% of a sample.
reviewed_by: UNREVIEWED
