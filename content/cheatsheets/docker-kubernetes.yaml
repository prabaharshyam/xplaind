id: docker-kubernetes
title: Docker and Kubernetes
theme: ops
summary: 'Ship an AI service as a container and run it on Kubernetes: the files, commands and objects.'
lessons:
- docker-basics
- kubernetes-helm-basics
- environments-secrets-terraform
- serving-ai-apps
sections:
- title: Docker
  items:
  - term: Dockerfile
    detail: The recipe for an image.
    code: 'FROM python:3.12-slim

      WORKDIR /app

      COPY requirements.txt .

      RUN pip install -r requirements.txt

      COPY . .

      CMD ["uvicorn", "app:api", "--host", "0.0.0.0"]'
  - term: Build and run
    detail: Make the image, start a container.
    code: 'docker build -t claims-api:1.4.0 .

      docker run -p 8000:8000 claims-api:1.4.0'
  - term: Compose
    detail: Run the app with its database locally in one command.
  - term: Image vs container
    detail: The image is the package; a container is a running copy.
- title: Kubernetes objects
  items:
  - term: Pod
    detail: One or more containers that run together.
  - term: Deployment
    detail: Keeps N copies of a pod running and rolls out new versions.
  - term: Service
    detail: A stable name that sends traffic to ready pods.
  - term: Ingress
    detail: HTTPS from outside to a service.
  - term: ConfigMap and Secret
    detail: Settings and keys given to pods as environment variables.
- title: Running well
  items:
  - term: Probes
    detail: /health says alive; /ready says able to take traffic.
  - term: Requests and limits
    detail: Reserve CPU and memory, and cap them.
  - term: Helm
    detail: A chart with values per environment; helm upgrade and helm rollback.
  - term: Same image everywhere
    detail: Build once, promote the same image from staging to production.
reviewed_by: UNREVIEWED
reviewed_on: '2026-11-06'
