id: python-for-ai
title: Python for AI
theme: code
summary: 'The Python you use every day in AI work: data structures, functions, files, errors, environments and async.'
lessons:
- python-basics
- python-data-structures
- python-functions
- python-files-errors
- packages-and-venv
- python-for-production
sections:
- title: Data structures
  items:
  - term: list
    detail: Ordered, by position. Fast append; slow search.
    code: 'cities = ["Pune", "Kochi"]

      cities.append("Agra")'
  - term: dict
    detail: Key to value; finds a key in about one step.
    code: 'marks = {"K101": 78}

      marks.get("K102", 0)'
  - term: set
    detail: Unique values, no order; quick membership and de-duplication.
    code: unique = set(emails)
  - term: tuple
    detail: A fixed group that cannot change; good as a dict key.
- title: Everyday code
  items:
  - term: Comprehension
    detail: Build a list in one line.
    code: totals = [p * q for p, q in rows if q > 0]
  - term: f-string
    detail: Format text with values.
    code: 'f"Total: Rs {total:,.2f}"'
  - term: Function
    detail: One job, clear name, typed inputs.
    code: "def gst(price: float, rate: float = 0.18) -> float:\n    return price * rate"
  - term: enumerate / zip
    detail: Loop with an index, or over two lists together.
- title: Files and errors
  items:
  - term: with open
    detail: Opens and always closes a file.
    code: "with open(\"data.csv\", encoding=\"utf-8\") as f:\n    rows = list(csv.DictReader(f))"
  - term: try / except
    detail: Catch the error you expect; keep going.
    code: "try:\n    amount = float(row[\"amount\"])\nexcept ValueError:\n    bad.append(row)"
  - term: Traceback
    detail: 'Read the last line first: it names the error.'
  - term: json
    detail: json.loads(text) to a dict; json.dumps(obj) to text.
- title: Projects
  items:
  - term: venv
    detail: One environment per project so versions never clash.
    code: 'python -m venv .venv

      source .venv/bin/activate'
  - term: Pin versions
    detail: pip freeze or uv lock records exact versions.
  - term: Pydantic
    detail: Validate API input and LLM JSON into typed objects.
  - term: async
    detail: Wait on many network calls at once.
    code: results = await asyncio.gather(*calls)
reviewed_by: UNREVIEWED
reviewed_on: '2026-11-06'
