id: prompt-engineering
title: Prompt engineering
theme: llm
summary: 'How to write prompts that work in an app: the parts of a good prompt, the techniques that matter, and the mistakes to avoid.'
lessons:
- prompt-design
- prompting-without-jargon
- structured-output
- tokens-and-context
- context-engineering
sections:
- title: Parts of a system prompt
  items:
  - term: Role and audience
    detail: Who the model is and who it writes for.
  - term: Task
    detail: What to do, in one or two sentences.
  - term: Context
    detail: 'Facts it needs: price list, policies, timings.'
  - term: Rules
    detail: What it must and must not do, including "if unsure, say so and hand over".
  - term: Output format
    detail: Length, structure, JSON schema; say why, not just what.
  - term: Examples
    detail: 2-3 varied examples, one of them a tricky case.
- title: Techniques
  items:
  - term: Few-shot
    detail: Show input-output pairs; the model copies the pattern.
  - term: Step by step
    detail: Ask it to reason before answering on multi-step problems.
  - term: Delimiters
    detail: Wrap user text and documents in tags so they read as data.
    code: <customer_message>...</customer_message>
  - term: Structured output
    detail: Use the provider's JSON schema or tool mode, then validate.
  - term: Prefill or format cue
    detail: Start the answer's shape ("Answer:") to keep it on track.
- title: In production
  items:
  - term: Version prompts
    detail: Keep them in files with ids; record the version on every request.
  - term: Test set
    detail: Run 30-100 real cases on every prompt change before you ship.
  - term: Keep it stable first
    detail: Put fixed instructions first so prompt caching can reuse them.
  - term: Temperature
    detail: Low (0-0.3) for extraction and support; higher for brainstorming.
- title: Mistakes
  items:
  - term: Vague goals
    detail: '"Make it better" gives random results; name the reader and the outcome.'
  - term: Rules buried in examples
    detail: The model copies examples over rules; keep them consistent.
  - term: Trusting user text
    detail: Instructions inside an email or page can hijack the model; treat them as data.
  - term: No eval
    detail: Judging a prompt by three tries in a playground; use a test set.
