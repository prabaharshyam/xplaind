id: big-o-dsa
title: Big O and DSA patterns
theme: dsa
summary: Complexity at a glance and the patterns that solve most coding-round problems.
lessons:
- big-o-complexity
- arrays-strings-hashing
- sorting-and-searching
- stacks-queues-linked-lists
- trees-and-graphs
- dynamic-programming
sections:
- title: Complexity
  items:
  - term: O(1)
    detail: 'Same work for any size: a dict lookup.'
  - term: O(log n)
    detail: 'Halve each step: binary search.'
  - term: O(n)
    detail: Look at each item once.
  - term: O(n log n)
    detail: Good sorting.
  - term: O(n squared)
    detail: Every pair; fine for 1,000 items, not for 10 lakh.
- title: Patterns
  items:
  - term: Hash map
    detail: Count, look up or de-duplicate in one pass.
  - term: Two pointers
    detail: Sorted array, pairs or ranges, from both ends.
  - term: Sliding window
    detail: Best subarray or substring with a moving window.
  - term: Binary search
    detail: Sorted data, or "smallest value that works".
  - term: BFS
    detail: Shortest path in an unweighted graph; level by level.
  - term: DFS and backtracking
    detail: Explore all paths, undo choices.
  - term: Heap
    detail: Top k, or always the smallest next.
  - term: Dynamic programming
    detail: 'Overlapping subproblems: save each answer once.'
- title: In the interview
  layout: steps
  items:
  - term: Clarify
    detail: Input size, edge cases, what to return.
  - term: Brute force first
    detail: Say it and its complexity, then improve.
  - term: Talk while coding
    detail: Name the pattern and why it fits.
  - term: Test
    detail: Run a small example and an edge case by hand.
reviewed_by: UNREVIEWED
reviewed_on: '2026-11-06'
