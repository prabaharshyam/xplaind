id: llm-system-design
title: LLM system design interview
theme: system-design
summary: The 35-minute shape of an LLM system design answer, the building blocks, and the numbers to say out loud.
lessons:
- ai-system-design
- design-interview
- system-design-basics
- llm-gateways
- caching-and-speed
- quality-cost-speed
sections:
- title: The 35-minute answer
  layout: steps
  items:
  - term: 0-5 Clarify
    detail: Users, scale, latency, cost, languages, data rules, what success means.
  - term: 5-10 High level
    detail: 'Boxes and arrows: channel, API, routing, RAG or tools, model, reply.'
  - term: 10-28 Deep dives
    detail: The 2-3 parts that matter most for this problem.
  - term: 28-31 Failures
    detail: Hallucination, injection, outage, cost, privacy.
  - term: 31-34 Evals and ops
    detail: Test set, metrics, launch bar, monitoring, rollout.
  - term: 34-35 Trade-offs
    detail: What changes with more time or at 10x scale.
- title: Building blocks
  items:
  - term: Gateway
    detail: 'One entry for all model calls: keys, budgets, retries, fallbacks, logs.'
  - term: Router
    detail: Easy requests to a small model, hard ones to a large one.
  - term: Retrieval
    detail: Hybrid search, filters, reranker, citations.
  - term: Guardrails
    detail: Input checks, output checks, action limits.
  - term: Cache
    detail: Prompt caching for stable prefixes; a response cache for repeated questions.
  - term: Queue
    detail: Slow work (OCR, indexing, batch jobs) off the request path.
- title: Numbers to say
  items:
  - term: Latency budget
    detail: p95 first token about 1-2 s with streaming; whole answer 3-8 s.
  - term: Tokens per request
    detail: Prompt 1-3k, documents 1-4k, reply 200-800.
  - term: Cost per request
    detail: Tokens x price; compare it with the value of the task.
  - term: Throughput
    detail: Requests per second at peak, and tokens per second the provider allows.
- title: Trade-offs to name
  items:
  - term: Quality vs cost
    detail: Bigger model, more context and rerankers raise quality and cost.
  - term: Long context vs RAG
    detail: Whole document is simple but slow and costly; RAG is cheap but can miss.
  - term: API vs self-hosted
    detail: API is fast to start; self-hosting gives control at the cost of running GPUs.
  - term: Automation vs approval
    detail: 'More autonomy, more risk: add human approval where mistakes are costly.'
