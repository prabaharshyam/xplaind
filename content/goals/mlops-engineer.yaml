id: mlops-engineer
name: MLOps Engineer
tagline: Run machine learning and LLM systems reliably at scale.
description: Track experiments, version data and models, serve and monitor them, ship changes safely, watch quality
  and cost, and keep the platform compliant, for classical ML models and language models alike.
who_for: Backend, DevOps, data and cloud engineers moving into AI platforms. Plan on about six months at 8 to 10
  hours a week.
theme: ops
rank: 9
coding: 'yes'
layout: stages
placement: ladder
months: 6
stages:
- id: platform-foundations
  title: Foundations
  summary: Python, Linux, containers, one cloud and Kubernetes.
  lessons:
  - packages-and-venv
  - terminal-and-git
  - first-llm-api-call
  - python-for-production
  - linux-shell-ssh
  - docker-basics
  - kubernetes-helm-basics
  - cloud-fundamentals
- id: ml-lifecycle
  title: The ML lifecycle
  summary: Experiments, data and model versions, batch and online serving, and drift.
  lessons:
  - experiment-tracking
  - data-versioning
  - serving-ml-models
  - monitoring-drift
- id: serving
  title: Serving
  summary: APIs, open-weight models, GPUs and gateways.
  lessons:
  - serving-ai-apps
  - deploy-and-monitor
  - llm-gateways
  - vllm-open-weights
  - gpus-quantization
- id: delivery
  title: Delivery
  summary: Ship changes to prompts, models and code safely.
  lessons:
  - cicd-github-actions
  - environments-secrets-terraform
  - regression-tests
  - versioning-prompts-models
- id: observability
  title: Observability
  summary: Traces, cost, quality and drift.
  lessons:
  - tracing-llm-apps
  - agent-logs
  - evals-test-sets
  - online-evals-feedback
- id: scale
  title: Scale
  summary: Faster, cheaper and steady under load.
  lessons:
  - caching-and-speed
  - cost-control
  - batching-model-tiering
  - latency-load-testing
- id: platform-governance
  guide: ai-platform-one-team
  title: Governance
  summary: Audit, compliance and incident response for AI systems.
  lessons:
  - security-privacy
  - audit-logs
  - ai-compliance
  - ai-risk-frameworks
  - ai-incident-response
  project:
    title: An AI platform for one team
    brief: Stand up a gateway, an open-weight model and a hosted model behind it, with tracing, cost dashboards,
      CI/CD for prompts and an incident runbook.
    deliverables:
    - Infrastructure as code that builds the platform from scratch
    - A dashboard with latency, cost and quality per route
    - A runbook and a written review of one simulated incident
# IQ-8: the Top 25 interview questions, in study order.
top_interview:
  - why-docker
  - kubernetes-basics-question
  - experiment-tracking-why
  - why-llm-gateway
  - why-vllm
  - what-to-trace
  - evaluate-llm-app
  - batch-vs-online-serving
  - model-drift-monitoring
  - good-offline-bad-online
  - serve-llm-streaming-api
  - manage-secrets
  - ci-for-prompts
  - version-rollback-models
  - golden-test-set
  - prevent-regressions
  - monitor-llm-app
  - latency-budget-load-test
  - reduce-latency
  - control-llm-cost
  - llm-bill-doubled
  - llm-provider-outage
  - responsible-ai-launch
  - ai-incident-handling
  - production-incident-story
