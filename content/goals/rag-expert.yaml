id: rag-expert
name: RAG Expert
tagline: Build search and question-answering over real company documents.
description: >-
  Retrieval-augmented generation is how most companies put AI on their own
  data. This path covers ingestion, retrieval, grounded answers, evaluation and
  production, from a first prototype to a system people trust.
who_for: >-
  Developers who can already call an LLM API from Python. Plan on about three
  months at 8 to 10 hours a week.
rank: 5
coding: "yes"
layout: stages
placement: ladder
months: 3
stages:
  - id: rag-foundations
    title: Foundations
    summary: Embeddings, the context window and the shape of a RAG system.
    lessons:
      - tokens-and-context
      - embeddings
      - rag-app
  - id: ingestion
    title: Ingestion
    summary: Turn messy documents into clean, searchable pieces.
    lessons:
      - chunking
    planned:
      - title: Parsing documents and OCR
        summary: Get clean text and tables out of PDFs, scans and slides.
      - title: Metadata that helps retrieval
        summary: Titles, dates, owners and sections that make filters and citations work.
      - title: Keeping an index fresh
        summary: Add, change and delete documents without rebuilding everything.
  - id: retrieval
    title: Retrieval
    summary: Find the right passage for every kind of question.
    lessons:
      - vector-search
    planned:
      - title: Hybrid search, reranking and filters
        summary: Mix keyword and vector search, rerank the results and filter by metadata.
      - title: Query rewriting, HyDE and parent-child chunks
        summary: Retrieval tricks that fix the questions plain vector search gets wrong.
      - title: Graph RAG
        summary: When links between entities matter more than similar text.
      - title: Long documents without vectors
        summary: Navigate a long report by its table of contents instead of by embeddings.
  - id: generation
    title: Generation
    summary: Answers that stay grounded in the sources and say so.
    lessons: []
    planned:
      - title: Grounding, citations and refusing to guess
        summary: Make answers cite their source and say "I don't know" when the source is silent.
      - title: Long context or RAG
        summary: When to put everything in the prompt and when to retrieve.
  - id: rag-evaluation
    title: Evaluation
    summary: Measure retrieval and answers separately, and keep measuring.
    lessons:
      - check-retrieval
      - evals-test-sets
      - llm-judges
      - regression-tests
  - id: rag-production
    title: Production
    summary: Permissions, speed, cost and monitoring for RAG at work.
    lessons:
      - caching-and-speed
      - cost-control
    planned:
      - title: Permission-aware RAG
        summary: Show each user only the documents they are allowed to see.
      - title: Multimodal RAG
        summary: Search images, charts and tables, not just text.
    project:
      title: A policy assistant people trust
      brief: Build a RAG assistant over a public document set of at least 300 pages, with citations, permission filters and an eval report comparing three retrieval set-ups.
      deliverables:
        - A golden set of at least 40 questions
        - An eval report with retrieval and answer scores for each set-up
        - A demo that shows a correct refusal
