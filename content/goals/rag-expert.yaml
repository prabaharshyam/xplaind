id: rag-expert
name: RAG Expert
tagline: Build search and question-answering over real company documents.
description: >-
  Retrieval-augmented generation is how most companies put AI on their own data. This path covers ingestion,
  retrieval, grounded answers, evaluation and production, from a first prototype to a system people trust.
who_for: >-
  Developers who can already call an LLM API from Python. Plan on about three months at 8 to 10 hours
  a week.
theme: retrieval
rank: 5
coding: 'yes'
layout: stages
placement: ladder
months: 3
stages:
- id: rag-foundations
  title: Foundations
  summary: Embeddings, the context window and the shape of a RAG system.
  lessons:
  - tokens-and-context
  - embeddings
  - rag-app
- id: ingestion
  title: Ingestion
  summary: Turn messy documents into clean, searchable pieces.
  lessons:
  - document-parsing-ocr
  - chunking
  - retrieval-metadata
  - data-pipelines-ai
- id: retrieval
  title: Retrieval
  summary: Find the right passage for every kind of question.
  lessons:
  - vector-search
  - hybrid-search-reranking
  - advanced-retrieval
  - vectorless-retrieval
  - graph-rag
- id: generation
  title: Generation
  summary: Answers that stay grounded in the sources and say so.
  lessons:
  - grounding-citations
  - long-context-vs-rag
- id: rag-evaluation
  title: Evaluation
  summary: Measure retrieval and answers separately, and keep measuring.
  lessons:
  - check-retrieval
  - evals-test-sets
  - llm-judges
  - regression-tests
- id: rag-production
  title: Production
  summary: Permissions, speed, cost and monitoring for RAG at work.
  lessons:
  - permission-aware-rag
  - caching-and-speed
  - cost-control
  - multimodal-rag
  project:
    title: A policy assistant people trust
    brief: Build a RAG assistant over a public document set of at least 300 pages, with citations, permission
      filters and an eval report comparing three retrieval set-ups.
    deliverables:
    - A golden set of at least 40 questions
    - An eval report with retrieval and answer scores for each set-up
    - A demo that shows a correct refusal
