id: llmops-engineer
name: LLMOps / AI Platform Engineer
tagline: Run AI systems reliably at scale.
description: >-
  Serve models, ship changes safely, watch quality and cost, and keep the platform compliant. The DevOps
  and MLOps skills that AI teams hire for, applied to language models.
who_for: >-
  Backend, DevOps and cloud engineers moving into AI. Plan on about six months at 8 to 10 hours a week.
rank: 7
coding: 'yes'
layout: stages
placement: ladder
months: 6
stages:
- id: platform-foundations
  title: Foundations
  summary: Python, Linux, containers, one cloud and Kubernetes.
  lessons:
  - packages-and-venv
  - terminal-and-git
  - first-llm-api-call
  - python-for-production
  - linux-shell-ssh
  - docker-basics
  - kubernetes-helm-basics
  - cloud-fundamentals
- id: serving
  title: Serving
  summary: APIs, open-weight models, GPUs and gateways.
  lessons:
  - serving-ai-apps
  - deploy-and-monitor
  - llm-gateways
  planned:
  - title: Open-weight models with vLLM
    summary: Serve an open model on your own GPUs when data cannot leave the building.
  - title: GPUs and quantization
    summary: Memory, throughput and the quality cost of smaller numbers.
- id: delivery
  title: Delivery
  summary: Ship changes to prompts, models and code safely.
  lessons:
  - cicd-github-actions
  - environments-secrets-terraform
  - regression-tests
  planned:
  - title: Versioning prompts and models
    summary: Know exactly which prompt and model produced each answer.
- id: observability
  title: Observability
  summary: Traces, cost, quality and drift.
  lessons:
  - tracing-llm-apps
  - agent-logs
  - evals-test-sets
  - online-evals-feedback
- id: scale
  title: Scale
  summary: Faster, cheaper and steady under load.
  lessons:
  - caching-and-speed
  - cost-control
  - batching-model-tiering
  - latency-load-testing
- id: platform-governance
  title: Governance
  summary: Audit, compliance and incident response for AI systems.
  lessons:
  - security-privacy
  planned:
  - title: Audit logs
    summary: Record who asked what, what the system did and why, for later review.
  - title: Compliance for AI systems
    summary: What SOC 2, GDPR, India's DPDP Act and HIPAA ask of an AI deployment.
  - title: AI risk frameworks
    summary: The NIST AI RMF, ISO/IEC 42001 and the EU AI Act, in practice.
  - title: Incident response for AI
    summary: Detect, contain and learn from an AI failure in production.
  project:
    title: An AI platform for one team
    brief: Stand up a gateway, an open-weight model and a hosted model behind it, with tracing, cost dashboards,
      CI/CD for prompts and an incident runbook.
    deliverables:
    - Infrastructure as code that builds the platform from scratch
    - A dashboard with latency, cost and quality per route
    - A runbook and a written review of one simulated incident
