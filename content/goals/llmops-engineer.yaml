id: llmops-engineer
name: LLMOps / AI Platform Engineer
tagline: Run AI systems reliably at scale.
description: >-
  Serve models, ship changes safely, watch quality and cost, and keep the platform compliant. The DevOps
  and MLOps skills that AI teams hire for, applied to language models.
who_for: >-
  Backend, DevOps and cloud engineers moving into AI. Plan on about six months at 8 to 10 hours a week.
theme: ops
rank: 7
coding: 'yes'
layout: stages
placement: ladder
months: 6
stages:
- id: platform-foundations
  title: Foundations
  summary: Python, Linux, containers, one cloud and Kubernetes.
  lessons:
  - packages-and-venv
  - terminal-and-git
  - first-llm-api-call
  - python-for-production
  - linux-shell-ssh
  - docker-basics
  - kubernetes-helm-basics
  - cloud-fundamentals
- id: serving
  title: Serving
  summary: APIs, open-weight models, GPUs and gateways.
  lessons:
  - serving-ai-apps
  - deploy-and-monitor
  - llm-gateways
  - vllm-open-weights
  - gpus-quantization
- id: delivery
  title: Delivery
  summary: Ship changes to prompts, models and code safely.
  lessons:
  - cicd-github-actions
  - environments-secrets-terraform
  - regression-tests
  - versioning-prompts-models
- id: observability
  title: Observability
  summary: Traces, cost, quality and drift.
  lessons:
  - tracing-llm-apps
  - agent-logs
  - evals-test-sets
  - online-evals-feedback
- id: scale
  title: Scale
  summary: Faster, cheaper and steady under load.
  lessons:
  - caching-and-speed
  - cost-control
  - batching-model-tiering
  - latency-load-testing
- id: platform-governance
  guide: ai-platform-one-team
  title: Governance
  summary: Audit, compliance and incident response for AI systems.
  lessons:
  - security-privacy
  - audit-logs
  - ai-compliance
  - ai-risk-frameworks
  - ai-incident-response
  project:
    title: An AI platform for one team
    brief: Stand up a gateway, an open-weight model and a hosted model behind it, with tracing, cost dashboards,
      CI/CD for prompts and an incident runbook.
    deliverables:
    - Infrastructure as code that builds the platform from scratch
    - A dashboard with latency, cost and quality per route
    - A runbook and a written review of one simulated incident
# IQ-8: the Top 25 interview questions, in study order.
top_interview:
  - why-docker
  - kubernetes-basics-question
  - why-llm-gateway
  - why-vllm
  - quantization-tradeoffs
  - what-to-trace
  - prompt-caching-explained
  - evaluate-llm-app
  - serve-llm-streaming-api
  - manage-secrets
  - ci-for-prompts
  - version-rollback-models
  - golden-test-set
  - prevent-regressions
  - monitor-llm-app
  - latency-budget-load-test
  - reduce-latency
  - control-llm-cost
  - llm-bill-doubled
  - llm-provider-outage
  - debug-agent
  - protect-user-data
  - responsible-ai-launch
  - ai-incident-handling
  - production-incident-story
