id: ml-engineer
name: ML Engineer
tagline: Train, evaluate and deploy machine learning models.
description: >-
  The classical machine learning and deep learning that still power ranking, fraud, forecasting and vision,
  plus the MLOps to run models in production.
who_for: >-
  Engineers and graduates comfortable with Python and school maths. Plan on about nine months at 8 to
  10 hours a week.
theme: ml
rank: 9
coding: 'yes'
layout: stages
placement: none
months: 9
stages:
- id: ml-foundations
  title: Foundations
  summary: Python, the data stack and the maths intuition machine learning needs.
  lessons:
  - python-basics
  - pandas-tables
  - maths-for-ml
  - statistics-for-ml
  - numpy-plotting
- id: classical-ml
  title: Classical machine learning
  summary: Regression, classification, trees and clustering.
  lessons:
  - regression-models
  - classification-models
  - trees-boosting
  - unsupervised-learning
  - ml-feature-engineering
- id: evaluation
  title: Evaluating models
  summary: Validation, metrics and leakage.
  lessons:
  - cross-validation-leakage
  - choosing-a-metric
- id: deep-learning
  title: Deep learning
  summary: Neural networks, PyTorch, CNNs and transformers.
  lessons:
  - neural-networks
  - pytorch-basics
  - cnns-images
  - transformers-explained
- id: mlops
  title: MLOps
  summary: Track, version, serve and monitor models.
  lessons:
  - experiment-tracking
  - serving-ml-models
  - monitoring-drift
  - data-versioning
- id: ml-career
  guide: fraud-model-production
  title: Career
  summary: Interviews and a portfolio for ML roles.
  lessons:
  - ml-interviews
  project:
    title: A fraud model in production
    brief: Train a fraud model on a public transactions dataset, choose a cost-weighted metric, serve
      it behind an API and monitor it for drift.
    deliverables:
    - A notebook comparing three models with cross-validation
    - A served model with a monitoring dashboard
    - A model card covering data, metrics, limits and fairness checks
# IQ-8: the Top 25 interview questions, in study order.
top_interview:
  - supervised-vs-unsupervised
  - overfitting
  - bias-variance-tradeoff
  - regularisation-l1-l2
  - linear-vs-logistic
  - precision-recall
  - boosting-vs-random-forest
  - train-test-split
  - backpropagation-explained
  - vanishing-gradients
  - why-convolutions
  - experiment-tracking-why
  - choose-k-means
  - missing-values
  - feature-engineering-example
  - data-leakage
  - imbalanced-classes
  - ab-test-significance
  - prevent-overfitting-neural-net
  - transfer-learning
  - batch-vs-online-serving
  - model-drift-monitoring
  - good-offline-bad-online
  - design-recommendation-system
  - ml-project-end-to-end
