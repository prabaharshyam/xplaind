id: ml-engineer
name: ML Engineer
tagline: Train, evaluate and deploy machine learning models.
description: >-
  The classical machine learning and deep learning that still power ranking,
  fraud, forecasting and vision, plus the MLOps to run models in production.
who_for: >-
  Engineers and graduates comfortable with Python and school maths. Plan on
  about nine months at 8 to 10 hours a week.
rank: 9
coding: "yes"
layout: stages
placement: none
months: 9
stages:
  - id: ml-foundations
    title: Foundations
    summary: Python, the data stack and the maths intuition machine learning needs.
    lessons:
      - python-basics
      - pandas-tables
    planned:
      - title: Maths for machine learning
        summary: Vectors, derivatives and probability, by intuition first.
      - title: Statistics for machine learning
        summary: Distributions, sampling, and why averages mislead.
      - title: NumPy and plotting
        summary: Arrays, vectorised code and charts that reveal the data.
  - id: classical-ml
    title: Classical machine learning
    summary: Regression, classification, trees and clustering.
    lessons: []
    planned:
      - title: Regression
        summary: Fit a line, read the errors and avoid the common traps.
      - title: Classification
        summary: Logistic regression, thresholds and imbalanced classes.
      - title: Trees and gradient boosting
        summary: Decision trees, random forests and XGBoost, the workhorses of tabular data.
      - title: Unsupervised learning
        summary: Clustering and dimensionality reduction.
      - title: Feature engineering
        summary: Turn raw columns into signals a model can use.
  - id: evaluation
    title: Evaluating models
    summary: Validation, metrics and leakage.
    lessons: []
    planned:
      - title: Cross-validation and leakage
        summary: Test honestly, and spot when the future leaks into training.
      - title: Choosing a metric
        summary: Accuracy, precision, recall, AUC and cost-weighted metrics.
  - id: deep-learning
    title: Deep learning
    summary: Neural networks, PyTorch, CNNs and transformers.
    lessons: []
    planned:
      - title: Neural networks
        summary: Layers, loss, gradient descent and backpropagation.
      - title: PyTorch
        summary: Tensors, a training loop and saving a model.
      - title: CNNs for images
        summary: Convolutions, transfer learning and data augmentation.
      - title: Transformers
        summary: Attention, and why it changed language and vision.
  - id: mlops
    title: MLOps
    summary: Track, version, serve and monitor models.
    lessons: []
    planned:
      - title: Experiment tracking and model registry
        summary: Record every run and promote the right model.
      - title: Serving a model
        summary: Batch and real-time inference behind an API.
      - title: Monitoring and drift
        summary: Notice when the world changes and the model stops working.
      - title: Data versioning
        summary: Reproduce any model from the exact data it was trained on.
  - id: ml-career
    title: Career
    summary: Interviews and a portfolio for ML roles.
    lessons: []
    planned:
      - title: ML interviews
        summary: Theory, coding and ML system design rounds.
    project:
      title: A fraud model in production
      brief: Train a fraud model on a public transactions dataset, choose a cost-weighted metric, serve it behind an API and monitor it for drift.
      deliverables:
        - A notebook comparing three models with cross-validation
        - A served model with a monitoring dashboard
        - A model card covering data, metrics, limits and fairness checks
