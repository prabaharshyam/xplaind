id: forward-deployed-engineer
name: Forward Deployed Engineer
tagline: Take AI from demo to production inside a client's business.
description: >-
  A forward deployed engineer sits with a customer, finds the problem worth solving, builds the AI system
  and gets it into daily use. This path covers the engineering (RAG, agents, deployment, enterprise integration)
  and the client craft (discovery, scoping, demos, handover) in six stages.
who_for: >-
  Software engineers with a year or more of Python who like working with people as much as with code.
  Plan on about six months at 15 to 20 hours a week.
rank: 2
coding: 'yes'
layout: stages
placement: ladder
months: 6
stages:
- id: foundations
  title: Engineering foundations
  summary: Production Python, data, APIs, Git, Linux and Docker, plus how language models work and how
    to call them.
  lessons:
  - python-for-production
  - project-tooling
  - sql-for-engineers
  - fastapi-rest-apis
  - files-tables-pdfs
  - git-with-a-team
  - linux-shell-ssh
  - docker-basics
  - first-llm-api-call
  - tokens-and-context
  project:
    title: A document question-answering API
    brief: Build a FastAPI service that takes a PDF, extracts its text and answers questions about it
      with a hosted model, packaged with Docker.
    deliverables:
    - A public repository with a README that a stranger can follow
    - A Dockerfile and a Compose file that start the service with one command
    - Five pytest tests, including one for a bad file
- id: llm-engineering
  title: LLM engineering and RAG
  summary: Prompts, structured output, tools, retrieval done properly, and evals that tell you whether
    it works.
  lessons:
  - prompt-design
  - structured-output
  - tool-calling
  - embeddings
  - chunking
  - vector-search
  - rag-app
  - check-retrieval
  - hybrid-search-reranking
  - advanced-retrieval
  - grounding-citations
  - vectorless-retrieval
  - evals-test-sets
  - llm-judges
  - regression-tests
  - quality-cost-speed
  project:
    title: An enterprise RAG assistant with an eval report
    brief: Build a RAG assistant over a few hundred pages of public policy documents, with citations,
      and measure it with a golden question set.
    deliverables:
    - A golden set of at least 30 questions with expected sources
    - An eval report comparing two retrieval set-ups on accuracy, cost and speed
    - A short demo video of the assistant answering and refusing
- id: agents
  title: Agentic AI
  summary: Agents that plan, use tools, remember and stop safely, built with the frameworks companies
    use.
  lessons:
  - agent-loop
  - agent-tool-design
  - agent-memory
  - planning-reflection
  - langgraph-basics
  - agent-sdks-subagents
  - mcp-servers-clients
  - context-engineering
  - human-approval
  - guardrails
  - agent-permissions-sandboxing
  - agent-budgets-kill-switches
  - agent-failures
  project:
    title: An operations agent with approval gates
    brief: Build an agent that triages support tickets, drafts replies and refund actions, and waits for
      a person to approve anything that changes a customer record.
    deliverables:
    - A graph or flow diagram of the agent and its tools
    - Traces of ten real runs, including two it should refuse
    - A budget and kill switch that you show working
- id: production
  title: Production and deployment
  summary: Serve, ship, watch and scale an AI system so a client can depend on it.
  lessons:
  - serving-ai-apps
  - kubernetes-helm-basics
  - cloud-fundamentals
  - cicd-github-actions
  - environments-secrets-terraform
  - deploy-and-monitor
  - tracing-llm-apps
  - agent-logs
  - online-evals-feedback
  - llm-gateways
  - caching-and-speed
  - cost-control
  - batching-model-tiering
  - latency-load-testing
  project:
    title: The stage-3 agent, deployed
    brief: Deploy your operations agent to a cloud with CI/CD, tracing, a cost dashboard and a gateway
      with a fallback model.
    deliverables:
    - A pipeline that tests and deploys on merge
    - A dashboard screenshot showing traces, cost per request and error rate
    - A load test result against a stated latency budget
- id: enterprise
  title: Enterprise integration and governance
  summary: Sign-on, permissions, data pipelines, compliance and deployment models that pass a client's
    security review.
  lessons:
  - prompt-injection
  - security-privacy
  planned:
  - title: Single sign-on
    summary: OAuth 2, OpenID Connect and SAML, enough to plug an AI app into a company's login.
  - title: Permission-aware RAG
    summary: Show each user only the documents they are allowed to see.
  - title: Audit logs
    summary: Record who asked what, what the system did and why, for later review.
  - title: Enterprise connectors
    summary: Pull data from SharePoint, Salesforce, SAP, Jira and cloud storage.
  - title: Data pipelines for AI
    summary: ETL, ELT, change data capture and keeping an index fresh.
  - title: Data quality and personal data
    summary: Find and mask personal data, and catch bad records before they reach the model.
  - title: Compliance for AI systems
    summary: What SOC 2, GDPR, India's DPDP Act and HIPAA ask of an AI deployment.
  - title: Security questionnaires
    summary: Answer a client's vendor security review honestly and quickly.
  - title: Deployment models
    summary: Private cloud, on-premise and air-gapped set-ups, and what each rules out.
  - title: Open-weight models with vLLM
    summary: Serve an open model on your own GPUs when data cannot leave the building.
  - title: Cost of ownership
    summary: Compare API, self-hosted and hybrid costs over a year, not a demo.
  project:
    title: A secure enterprise copilot
    brief: Extend your RAG assistant with sign-on, per-user document permissions, personal data masking
      and an audit trail, and write the security note a client would ask for.
    deliverables:
    - A login flow and a test showing two users see different documents
    - An audit log sample and a data-flow diagram
    - A two-page security and compliance note
- id: client-craft
  title: FDE craft and capstone
  summary: Discovery, scoping, delivery gates, demos and handover, then an end-to-end capstone.
  lessons:
  - ai-system-design
  - design-interview
  planned:
  - title: Discovery
    summary: Interview stakeholders and map the process before proposing any AI.
  - title: The KPI that matters
    summary: Agree one measurable result with the client, and a baseline to beat.
  - title: Writing a scope of work
    summary: In scope, out of scope, milestones, acceptance criteria and assumptions.
  - title: Proof of concept, pilot, production
    summary: The gate between each stage and the evidence that opens it.
  - title: Change management and training
    summary: Help people adopt the system, and plan for the ones who will not.
  - title: Demos, risk logs and escalation
    summary: A weekly rhythm that surfaces problems early.
  - title: Talking to executives
    summary: Updates and demos that lead with the business result.
  - title: Managing scope creep
    summary: Say no, or "yes, and here is what moves", without losing the client.
  - title: Documentation and handover
    summary: Runbooks and training so the client's team can own the system.
  - title: A case study, end to end
    summary: A worked engagement with an Indian lender, from first call to handover.
  - title: The FDE interview loop
    summary: What each round tests and how to prepare for it.
  - title: Portfolio and job search
    summary: Turn the six projects into a portfolio and a story employers remember.
  project:
    title: An end-to-end client capstone
    brief: Pick a real public dataset and an imagined client. Write the discovery notes, scope, architecture
      and KPI, build the system, and present the results as you would to the client's leadership.
    deliverables:
    - A one-page scope of work with acceptance criteria
    - The working system, deployed, with its eval report
    - A ten-slide results deck and a recorded five-minute demo
