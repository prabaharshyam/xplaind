id: ai-automation-specialist
name: AI Automation Specialist
tagline: Automate business workflows with AI and low-code tools.
description: >-
  Connect apps, add AI steps and remove hours of manual work, mostly without writing code. The path covers
  n8n in depth, compares Make, Zapier and Power Automate, and ends with how to scope and measure an automation
  project.
who_for: >-
  Operations, support, sales and marketing people, freelancers and small business owners. Light code only.
  Plan on about three months at 5 to 6 hours a week.
rank: 6
coding: some
layout: stages
placement: none
months: 3
stages:
- id: automation-foundations
  title: Foundations
  summary: What automation is, how to map a process and how to prompt for business tasks.
  lessons:
  - what-is-ai
  - use-an-assistant
  planned:
  - title: What automation is
    summary: Triggers, actions and data passed between apps.
  - title: Mapping a process
    summary: Draw today's process, find the slow steps and pick what to automate.
- id: automation-tools
  title: The tools
  summary: n8n in depth, then Make, Zapier and Power Automate side by side.
  lessons: []
  planned:
  - title: Your first n8n workflow
    summary: Triggers, nodes, credentials and a working workflow.
  - title: n8n in depth
    summary: Branches, loops, error workflows and self-hosting.
  - title: Make, Zapier and Power Automate
    summary: What each is good at, what it costs and how to choose.
- id: apis-without-code
  title: APIs and webhooks without heavy code
  summary: Talk to any app that has an API.
  lessons:
  - web-apis-json
  planned:
  - title: Webhooks
    summary: Let one app tell another that something happened.
  - title: Reading and shaping JSON
    summary: Pick out and reshape the fields a workflow needs.
- id: ai-steps
  title: AI steps in workflows
  summary: Extract, classify, summarise and reply inside an automation.
  lessons:
  - structured-output
  planned:
  - title: Extracting data from documents
    summary: Turn invoices, forms and emails into clean fields.
  - title: Triage for email and tickets
    summary: Classify, route and draft replies, with a person checking the risky ones.
  - title: Chat assistants for websites and WhatsApp
    summary: Answer customer questions from your own documents.
  - title: RPA basics
    summary: Automate apps that have no API, and the cost of doing so.
- id: automation-governance
  title: Reliability and governance
  summary: Workflows that fail safely and treat personal data with care.
  lessons:
  - use-ai-safely
  - human-approval
  - data-quality-pii
  planned:
  - title: Error handling and retries
    summary: Catch failures, retry safely and alert a person.
- id: automation-delivery
  title: Delivering automation projects
  summary: Scope, price, measure and hand over.
  lessons:
  - documentation-handover
  planned:
  - title: Scoping an automation project
    summary: Agree the process, the edge cases and what success means.
  - title: Measuring return on investment
    summary: Hours saved, errors avoided and what it all costs.
  project:
    title: An invoice-to-ledger automation
    brief: Build a workflow that reads invoices from an inbox, extracts the fields with an AI step, asks
      a person to approve anything unusual and writes the result to a spreadsheet.
    deliverables:
    - The exported workflow and a diagram of it
    - A test run over 20 sample invoices with the error rate
    - A one-page ROI estimate
