id: ai-engineer
name: AI Engineer
tagline: Build AI systems end to end, from data and models to LLM apps in production.
description: 'The all-round AI engineering path: Python and data, the machine learning every AI engineer is expected
  to know, deep learning and transformers, apps on large language models with RAG and agents, testing, and running
  it all in production.'
who_for: Students and working developers who want a broad AI engineering role rather than one specialism. You will
  write Python from the start. Plan on about nine months at 10 to 12 hours a week.
theme: code
rank: 1
coding: 'yes'
layout: stages
placement: ladder
months: 9
stages:
- id: ae-foundations
  title: Python and data foundations
  summary: Write Python, use the terminal and Git, call APIs and work with tables.
  lessons:
  - what-is-ai
  - ai-careers-india
  - choosing-your-path
  - python-setup
  - python-basics
  - python-functions
  - python-data-structures
  - python-files-errors
  - terminal-and-git
  - packages-and-venv
  - web-apis-json
  - pandas-tables
  guide: api-data-to-github
- id: ae-ml
  title: Machine learning essentials
  summary: The maths, models and evaluation habits behind every AI system.
  lessons:
  - maths-for-ml
  - statistics-for-ml
  - regression-models
  - classification-models
  - trees-boosting
  - cross-validation-leakage
  - choosing-a-metric
- id: ae-deep-learning
  title: Deep learning and transformers
  summary: Neural networks, PyTorch and the architecture behind language models.
  lessons:
  - neural-networks
  - pytorch-basics
  - transformers-explained
- id: ae-llm-apps
  title: Building with language models
  summary: Prompts, structured output, RAG, tool calling and your first agent.
  lessons:
  - first-llm-api-call
  - prompt-design
  - tokens-and-context
  - structured-output
  - errors-retries-cost
  - embeddings
  - chunking
  - vector-search
  - rag-app
  - check-retrieval
  - tool-calling
  - agent-loop
  guide: trusted-policy-assistant
- id: ae-quality
  title: Testing and safety
  summary: Evals, judges, regression tests and prompt injection.
  lessons:
  - evals-test-sets
  - llm-judges
  - regression-tests
  - prompt-injection
- id: ae-production
  title: Production
  summary: Containers, APIs, serving, monitoring, speed, cost and security.
  lessons:
  - docker-basics
  - fastapi-rest-apis
  - serving-ml-models
  - deploy-and-monitor
  - monitoring-drift
  - caching-and-speed
  - cost-control
  - security-privacy
  guide: deployed-app-with-monitoring
- id: ae-design
  title: System design and interviews
  summary: Choose the right approach, design whole systems and explain them.
  lessons:
  - prompt-rag-or-finetune
  - ai-system-design
  - quality-cost-speed
  - design-interview
  guide: ai-product-design-doc
# IQ-8: the Top 25 interview questions, in study order.
top_interview:
  - what-is-an-llm
  - tokens-explained
  - what-is-rag
  - explain-embeddings
  - how-tool-calling-works
  - bias-variance-tradeoff
  - overfitting
  - precision-recall
  - backpropagation-explained
  - prompt-rag-finetune
  - evaluate-llm-app
  - prompt-injection-defence
  - missing-values
  - data-leakage
  - imbalanced-classes
  - choose-chunk-size
  - debug-rag
  - golden-test-set
  - reduce-latency
  - control-llm-cost
  - batch-vs-online-serving
  - model-drift-monitoring
  - design-support-bot
  - ai-feature-failed
  - tell-me-about-project
