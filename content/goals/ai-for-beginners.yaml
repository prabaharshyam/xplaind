id: ai-for-beginners
name: AI for Beginners
tagline: Understand AI and use it well at work, with no coding.
description: >-
  What AI is, how to use AI assistants for real work, how to check what they tell you, and what the rules
  are. Five short stages for anyone, from students to senior managers.
who_for: >-
  Anyone curious about AI, in any job. No coding and no maths. Plan on about a month at 2 to 3 hours a
  week.
theme: ai-basics
rank: 3
coding: none
layout: stages
placement: none
months: 1
stages:
- id: what-ai-is
  title: What AI is
  summary: AI, machine learning and language models in plain words, and what they can and cannot do.
  lessons:
  - what-is-ai
  - history-of-ai
  - what-ai-cannot-do
- id: using-assistants
  title: Using AI assistants for real work
  summary: Write, summarise, plan and research with a chat assistant.
  lessons:
  - use-an-assistant
  - prompting-without-jargon
  - ai-for-writing
  - ai-for-research
  - images-voice-tools
- id: using-ai-well
  title: Using AI well
  summary: Check answers, protect private data and follow your workplace rules.
  lessons:
  - checking-ai-answers
  - use-ai-safely
  - company-ai-policy
- id: ai-and-society
  title: AI and society
  summary: Bias, deepfakes, jobs and the rules governments are writing.
  lessons:
  - bias-fairness
  - deepfakes-misinformation
  - ai-rules-india-abroad
  - ai-and-jobs
- id: next-step
  guide: personal-ai-workflow
  title: Your next step
  summary: Choose where to go from here, with or without code.
  lessons:
  - ai-careers-india
  - choosing-your-path
  project:
    title: A personal AI workflow
    brief: Pick one task you do every week. Use an AI assistant to do it faster, check the result, and
      write down the steps so a colleague could repeat them.
    deliverables:
    - The before-and-after time for the task
    - Your written steps, including how you check the output
    - One thing you decided the AI should not do, and why
# IQ-8: the Top 25 interview questions, in study order.
top_interview:
  - ai-ml-genai-difference
  - what-is-an-llm
  - training-vs-inference
  - attention-high-level
  - why-hallucinate
  - ai-limits-example
  - ai-bias-example
  - dpdp-act-basics
  - write-a-good-prompt
  - check-ai-answer
  - ai-for-research-tips
  - what-not-to-share-with-ai
  - company-ai-policy-basics
  - spot-a-deepfake
  - first-ai-use-case-team
  - ai-difficult-customer-email
  - ai-report-wrong-figure
  - ai-confidential-meeting-notes
