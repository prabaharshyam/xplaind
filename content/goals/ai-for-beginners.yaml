id: ai-for-beginners
name: AI for Beginners
tagline: Understand AI and use it well at work, with no coding.
description: >-
  What AI is, how to use AI assistants for real work, how to check what they
  tell you, and what the rules are. Five short stages for anyone, from students
  to senior managers.
who_for: >-
  Anyone curious about AI, in any job. No coding and no maths. Plan on about a
  month at 2 to 3 hours a week.
rank: 3
coding: none
layout: stages
placement: none
months: 1
stages:
  - id: what-ai-is
    title: What AI is
    summary: AI, machine learning and language models in plain words, and what they can and cannot do.
    lessons:
      - what-is-ai
    planned:
      - title: A short history of AI
        summary: From rules to learning to language models, and why now.
      - title: What AI cannot do
        summary: The limits that matter at work, from facts to judgement.
  - id: using-assistants
    title: Using AI assistants for real work
    summary: Write, summarise, plan and research with a chat assistant.
    lessons:
      - use-an-assistant
    planned:
      - title: Prompting without jargon
        summary: Context, example, format and one round of feedback.
      - title: AI for writing and summarising
        summary: Emails, reports and meeting notes, with you still in charge.
      - title: AI for research and analysis
        summary: Ask good questions of documents and spreadsheets.
      - title: Images, voice and other AI tools
        summary: Image, audio and meeting tools, and when each helps.
  - id: using-ai-well
    title: Using AI well
    summary: Check answers, protect private data and follow your workplace rules.
    lessons:
      - use-ai-safely
    planned:
      - title: Checking an AI answer
        summary: Spot made-up facts, numbers and sources before you rely on them.
      - title: Your company's AI policy
        summary: What a good workplace AI policy says, and what to ask if yours is silent.
  - id: ai-and-society
    title: AI and society
    summary: Bias, deepfakes, jobs and the rules governments are writing.
    lessons: []
    planned:
      - title: Bias and fairness
        summary: How AI systems treat people unequally, and what can be done.
      - title: Deepfakes and misinformation
        summary: Recognise fake media and protect yourself and your family.
      - title: AI rules in India and abroad
        summary: India's DPDP Act, the EU AI Act and what they mean for ordinary users.
      - title: AI and jobs
        summary: Which tasks change, which jobs grow, and how to stay useful.
  - id: next-step
    title: Your next step
    summary: Choose where to go from here, with or without code.
    lessons: []
    planned:
      - title: AI careers in India
        summary: The roles companies are hiring for and what each needs.
      - title: Choosing your path
        summary: Match your background and time to one of the Xplaind paths.
    project:
      title: A personal AI workflow
      brief: Pick one task you do every week. Use an AI assistant to do it faster, check the result, and write down the steps so a colleague could repeat them.
      deliverables:
        - The before-and-after time for the task
        - Your written steps, including how you check the output
        - One thing you decided the AI should not do, and why
