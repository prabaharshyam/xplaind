id: ai-governance-specialist
name: AI Governance & Compliance Specialist
tagline: 'Make AI safe, fair and lawful: risk, policy, audit and compliance.'
description: Learn how AI systems work and fail, the harms they can cause, the laws that apply in India and abroad,
  and the policies, tests, audits and incident processes that let a company use AI responsibly.
who_for: Risk, compliance, legal, audit, privacy and policy professionals, and anyone moving into responsible AI.
  No coding needed. Plan on about three months at 6 to 8 hours a week.
theme: governance
rank: 7
coding: none
layout: stages
placement: none
months: 3
stages:
- id: gov-foundations
  title: How AI works and fails
  summary: Enough about models and AI products to judge their risks.
  lessons:
  - what-is-ai
  - history-of-ai
  - what-ai-cannot-do
  - how-ai-products-work
  - checking-ai-answers
  - use-ai-safely
  guide: personal-ai-workflow
- id: gov-harms
  title: The harms to manage
  summary: Bias, misinformation, privacy, security and prompt injection.
  lessons:
  - bias-fairness
  - deepfakes-misinformation
  - images-voice-tools
  - ai-and-jobs
  - data-quality-pii
  - security-privacy
  - prompt-injection
- id: gov-laws
  title: Laws and frameworks
  summary: India's DPDP Act and guidelines, the EU AI Act, sector rules and risk frameworks.
  lessons:
  - ai-rules-india-abroad
  - ai-compliance
  - ai-risk-frameworks
- id: gov-controls
  title: Policies and controls
  summary: Write AI policy, keep people in control and set guardrails.
  lessons:
  - company-ai-policy
  - writing-ai-policy
  - hitl-product-design
  - guardrails
  - agent-accountability
- id: gov-assurance
  title: Assurance and audit
  summary: Test, document, audit and respond when things go wrong.
  lessons:
  - evals-test-sets
  - audit-logs
  - security-questionnaires
  - deployment-models
  - ai-incident-response
  guide: ai-risk-assessment
# IQ-8: the Top 25 interview questions, in study order.
top_interview:
  - ai-limits-example
  - check-ai-answer
  - ai-bias-example
  - dpdp-act-basics
  - eu-ai-act-risk-tiers
  - prompt-injection-defence
  - company-ai-policy-basics
  - what-not-to-share-with-ai
  - ai-confidential-meeting-notes
  - protect-user-data
  - automation-personal-data
  - ai-impact-assessment-walkthrough
  - responsible-ai-launch
  - when-human-in-the-loop
  - ai-audit-trail
  - ai-vendor-due-diligence
  - pass-security-review
  - biased-applicant-ranking
  - spot-a-deepfake
  - fake-boss-voice-call
  - email-agent-injection-fix
  - agent-accountability-question
  - ai-incident-handling
  - production-incident-story
  - slowed-ai-project-for-risk
