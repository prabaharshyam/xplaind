id: agentic-ai-expert
name: Agentic AI Expert
tagline: Design, build and run AI agents that act safely.
description: >-
  Agents plan, call tools, keep memory and take actions. This path goes from the first tool call to multi-agent
  systems in production, with the reliability and accountability that real deployments need.
who_for: >-
  Developers who can already call an LLM API from Python. Plan on about four months at 8 to 10 hours a
  week.
rank: 4
coding: 'yes'
layout: stages
placement: ladder
months: 4
stages:
- id: agent-foundations
  title: Foundations
  summary: Model APIs, structured output and tool calling, the building blocks of every agent.
  lessons:
  - first-llm-api-call
  - structured-output
  - tool-calling
- id: agent-design
  title: Agent design
  summary: The loop, tools, memory, planning and the context the model sees.
  lessons:
  - agent-loop
  - agent-tool-design
  - agent-memory
  - planning-reflection
  - context-engineering
- id: frameworks
  title: Frameworks
  summary: LangGraph, vendor agent SDKs and multi-agent patterns.
  lessons:
  - langgraph-basics
  - agent-sdks-subagents
  planned:
  - title: Multi-agent systems
    summary: Supervisor, hand-off and debate patterns, and their failure modes.
- id: interoperability
  title: Connecting agents to the world
  summary: MCP, browsers and computers as tools.
  lessons:
  - mcp-servers-clients
  planned:
  - title: Browser and computer-use agents
    summary: Agents that click and type, and the extra care they need.
- id: reliability
  title: Reliability
  summary: Evals, traces, failure modes and the controls that keep agents in bounds.
  lessons:
  - agent-logs
  - agent-failures
  - evals-test-sets
  - prompt-injection
  - human-approval
  - guardrails
  - agent-permissions-sandboxing
  - agent-budgets-kill-switches
  planned:
  - title: Evaluating agents
    summary: Score whole trajectories, not just final answers.
- id: agents-in-production
  title: Production and accountability
  summary: Deploy, pay for and answer for what an agent does.
  lessons:
  - deploy-and-monitor
  - cost-control
  planned:
  - title: Accountability for agent actions
    summary: Who is responsible when an agent acts, and the records that prove what happened.
  project:
    title: A research agent with approvals
    brief: Build an agent that researches a company from public sources, drafts a briefing and asks for
      approval before sending it, with traces, a budget and an eval set.
    deliverables:
    - A trajectory eval over 20 tasks
    - Traces showing an approval and a refusal
    - A cost per task figure and a kill switch you show working
