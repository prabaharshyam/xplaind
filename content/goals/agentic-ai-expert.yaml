id: agentic-ai-expert
name: Agentic AI Expert
tagline: Design, build and run AI agents that act safely.
description: >-
  Agents plan, call tools, keep memory and take actions. This path goes from
  the first tool call to multi-agent systems in production, with the
  reliability and accountability that real deployments need.
who_for: >-
  Developers who can already call an LLM API from Python. Plan on about four
  months at 8 to 10 hours a week.
rank: 4
coding: "yes"
layout: stages
placement: ladder
months: 4
stages:
  - id: agent-foundations
    title: Foundations
    summary: Model APIs, structured output and tool calling, the building blocks of every agent.
    lessons:
      - first-llm-api-call
      - structured-output
      - tool-calling
  - id: agent-design
    title: Agent design
    summary: The loop, tools, memory, planning and the context the model sees.
    lessons:
      - agent-loop
    planned:
      - title: Designing tools for agents
        summary: Names, schemas, descriptions and errors that a model can use correctly.
      - title: Agent memory
        summary: Short-term state, long-term memory and what to forget.
      - title: Planning and reflection
        summary: ReAct, plan-then-execute and self-checks, and when each is worth the cost.
      - title: Context engineering
        summary: Decide what goes into the model's context on each turn, and what stays out.
  - id: frameworks
    title: Frameworks
    summary: LangGraph, vendor agent SDKs and multi-agent patterns.
    lessons: []
    planned:
      - title: LangGraph
        summary: State, nodes, edges and checkpoints for an agent you can resume.
      - title: Agent SDKs and sub-agents
        summary: What the vendor agent SDKs give you, and when to split work across agents.
      - title: Multi-agent systems
        summary: Supervisor, hand-off and debate patterns, and their failure modes.
  - id: interoperability
    title: Connecting agents to the world
    summary: MCP, browsers and computers as tools.
    lessons: []
    planned:
      - title: MCP servers and clients
        summary: Expose a tool or data source once and use it from any MCP-capable app.
      - title: Browser and computer-use agents
        summary: Agents that click and type, and the extra care they need.
  - id: reliability
    title: Reliability
    summary: Evals, traces, failure modes and the controls that keep agents in bounds.
    lessons:
      - agent-logs
      - agent-failures
      - evals-test-sets
      - prompt-injection
    planned:
      - title: Evaluating agents
        summary: Score whole trajectories, not just final answers.
      - title: Human approval steps
        summary: Pause an agent before an action that costs money or cannot be undone.
      - title: Guardrails
        summary: Check inputs and outputs, and block what policy forbids.
      - title: Permissions and sandboxing
        summary: Give an agent the least access it needs and run its code somewhere safe.
      - title: Loop limits, budgets and kill switches
        summary: Stop a runaway agent before it burns money or does damage.
  - id: agents-in-production
    title: Production and accountability
    summary: Deploy, pay for and answer for what an agent does.
    lessons:
      - deploy-and-monitor
      - cost-control
    planned:
      - title: Accountability for agent actions
        summary: Who is responsible when an agent acts, and the records that prove what happened.
    project:
      title: A research agent with approvals
      brief: Build an agent that researches a company from public sources, drafts a briefing and asks for approval before sending it, with traces, a budget and an eval set.
      deliverables:
        - A trajectory eval over 20 tasks
        - Traces showing an approval and a refusal
        - A cost per task figure and a kill switch you show working
