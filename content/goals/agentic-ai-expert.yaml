id: agentic-ai-expert
name: Agentic AI Engineer
tagline: Design, build and run AI agents that act safely.
description: Agents plan, call tools, keep memory and take actions. This path goes from the first tool call to multi-agent
  systems in production, with the reliability and accountability that real deployments need.
who_for: Developers who can already call an LLM API from Python. Plan on about four months at 8 to 10 hours a week.
theme: agents
rank: 5
coding: 'yes'
layout: stages
placement: ladder
months: 4
stages:
- id: agent-foundations
  title: Foundations
  summary: Model APIs, structured output and tool calling, the building blocks of every agent.
  lessons:
  - first-llm-api-call
  - structured-output
  - tool-calling
- id: agent-design
  title: Agent design
  summary: The loop, tools, memory, planning and the context the model sees.
  lessons:
  - agent-loop
  - agent-tool-design
  - agent-memory
  - planning-reflection
  - context-engineering
- id: frameworks
  title: Frameworks
  summary: LangGraph, vendor agent SDKs and multi-agent patterns.
  lessons:
  - langgraph-basics
  - agent-sdks-subagents
  - multi-agent-systems
- id: interoperability
  title: Connecting agents to the world
  summary: MCP, browsers and computers as tools.
  lessons:
  - mcp-servers-clients
  - computer-use-agents
- id: reliability
  title: Reliability
  summary: Evals, traces, failure modes and the controls that keep agents in bounds.
  lessons:
  - agent-logs
  - agent-failures
  - evals-test-sets
  - prompt-injection
  - human-approval
  - guardrails
  - agent-permissions-sandboxing
  - agent-budgets-kill-switches
  - evaluating-agents
- id: agents-in-production
  guide: research-agent-approvals
  title: Production and accountability
  summary: Deploy, pay for and answer for what an agent does.
  lessons:
  - deploy-and-monitor
  - cost-control
  - agent-accountability
  project:
    title: A research agent with approvals
    brief: Build an agent that researches a company from public sources, drafts a briefing and asks for approval
      before sending it, with traces, a budget and an eval set.
    deliverables:
    - A trajectory eval over 20 tasks
    - Traces showing an approval and a refusal
    - A cost per task figure and a kill switch you show working
# IQ-8: the Top 25 interview questions, in study order.
top_interview:
  - agent-vs-workflow
  - how-tool-calling-works
  - agent-memory-types
  - planning-and-reflection
  - context-engineering-explained
  - langgraph-state-checkpoints
  - what-is-mcp
  - agent-failure-modes
  - evaluate-llm-app
  - prompt-injection-defence
  - design-agent-tools
  - when-multi-agent
  - computer-use-agent-risks
  - agent-sandboxing
  - human-approval
  - evaluate-agent-trajectory
  - golden-test-set
  - debug-agent
  - agent-runaway-cost
  - email-agent-injection-fix
  - design-refund-agent
  - control-llm-cost
  - monitor-llm-app
  - agent-accountability-question
  - agent-project-story
