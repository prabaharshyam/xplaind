id: genai-engineer
name: GenAI Engineer
tagline: Build and ship apps on large language models.
description: >-
  Build and ship applications on top of large language models: prompts, RAG,
  agents, evals and production. The path runs from AI newcomer to AI system
  designer in nine levels.
who_for: >-
  Students, freshers and working engineers who want the most-hired AI title in
  India. You will write Python from level B2 onwards.
rank: 1
coding: "yes"
layout: levels
placement: ladder
months: 9
# On a path laid out by level, each stage is a level from levels/levels.yaml.
# Lessons are listed in the order a learner takes them.
stages:
  - id: B1
    lessons:
      - what-is-ai
      - use-an-assistant
      - use-ai-safely
  - id: B2
    lessons:
      - python-setup
      - python-basics
      - python-functions
      - python-data-structures
      - python-files-errors
  - id: B3
    lessons:
      - terminal-and-git
      - packages-and-venv
      - web-apis-json
      - pandas-tables
  - id: I1
    lessons:
      - first-llm-api-call
      - prompt-design
      - tokens-and-context
      - structured-output
      - errors-retries-cost
  - id: I2
    lessons:
      - embeddings
      - chunking
      - vector-search
      - rag-app
      - check-retrieval
  - id: I3
    lessons:
      - tool-calling
      - agent-loop
      - agent-logs
      - agent-failures
  - id: P1
    lessons:
      - evals-test-sets
      - llm-judges
      - regression-tests
      - prompt-injection
  - id: P2
    lessons:
      - deploy-and-monitor
      - caching-and-speed
      - cost-control
      - security-privacy
  - id: P3
    lessons:
      - prompt-rag-or-finetune
      - ai-system-design
      - quality-cost-speed
      - design-interview
