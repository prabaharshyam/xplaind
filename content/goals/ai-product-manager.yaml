id: ai-product-manager
name: AI Product Manager
tagline: Decide what AI to build, and ship it responsibly.
description: >-
  Choose problems AI can solve, design for answers that are sometimes wrong,
  measure quality, price the feature and meet the rules. No coding needed, but
  enough technical depth to work well with engineers.
who_for: >-
  Product managers, business analysts, founders and consultants. No coding.
  Plan on about three months at 4 to 5 hours a week.
rank: 8
coding: none
layout: stages
placement: none
months: 3
stages:
  - id: pm-ai-basics
    title: AI basics for product managers
    summary: Enough about models, tokens, RAG and agents to talk to engineers with confidence.
    lessons:
      - what-is-ai
      - tokens-and-context
      - prompt-rag-or-finetune
    planned:
      - title: How AI products work
        summary: Models, prompts, retrieval and tools, drawn as one picture.
  - id: use-cases
    title: Finding use cases
    summary: Pick problems AI should solve, and say no to the rest.
    lessons: []
    planned:
      - title: Choosing a problem for AI
        summary: Frequent, valuable and tolerant of mistakes, and how to test all three.
      - title: Feasibility and build versus buy
        summary: Prototype in a day, and know when a vendor beats your own build.
  - id: designing-ai-products
    title: Designing AI products
    summary: Interfaces for uncertain answers, with people in control.
    lessons: []
    planned:
      - title: UX for uncertain output
        summary: Show confidence, sources and an easy way to correct the system.
      - title: Human in the loop
        summary: Decide where people review, approve or override.
  - id: pm-evals
    title: Quality and metrics
    summary: Evals, product metrics and experiments for AI features.
    lessons:
      - evals-test-sets
    planned:
      - title: Metrics for AI features
        summary: Quality, adoption, cost and trust, and how they trade off.
      - title: Data strategy
        summary: The data you need, where it comes from and what you may use.
  - id: responsible-ai
    title: Responsible AI and governance
    summary: Bias, privacy, regulation and internal policy.
    lessons:
      - use-ai-safely
    planned:
      - title: Bias and fairness
        summary: How AI systems treat people unequally, and what can be done.
      - title: AI rules for product teams
        summary: India's DPDP Act, the EU AI Act risk tiers and what they ask of a product.
      - title: Writing an AI policy
        summary: Acceptable use, review steps and accountability for one company.
  - id: shipping-ai
    title: Pricing, launch and growth
    summary: Unit economics, launch and iteration.
    lessons:
      - cost-control
    planned:
      - title: Pricing AI features
        summary: Cost per use, margins and pricing models that survive heavy users.
      - title: Launch and adoption
        summary: Roll out gradually, watch the metrics and iterate.
      - title: AI PM interviews
        summary: Product sense, metrics and AI design questions, with practice answers.
    project:
      title: An AI feature brief
      brief: Write the product brief for one AI feature in an Indian consumer app, covering the problem, design, eval plan, metrics, pricing, risks and launch plan.
      deliverables:
        - A six-page brief
        - A clickable or annotated prototype
        - An eval plan with 20 example cases
