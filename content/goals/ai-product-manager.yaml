id: ai-product-manager
name: AI Product Manager
tagline: Decide what AI to build, and ship it responsibly.
description: >-
  Choose problems AI can solve, design for answers that are sometimes wrong, measure quality, price the
  feature and meet the rules. No coding needed, but enough technical depth to work well with engineers.
who_for: >-
  Product managers, business analysts, founders and consultants. No coding. Plan on about three months
  at 4 to 5 hours a week.
theme: product
rank: 8
coding: none
layout: stages
placement: none
months: 3
stages:
- id: pm-ai-basics
  title: AI basics for product managers
  summary: Enough about models, tokens, RAG and agents to talk to engineers with confidence.
  lessons:
  - what-is-ai
  - how-ai-products-work
  - tokens-and-context
  - prompt-rag-or-finetune
- id: use-cases
  title: Finding use cases
  summary: Pick problems AI should solve, and say no to the rest.
  lessons:
  - choosing-ai-problem
  - build-vs-buy
- id: designing-ai-products
  title: Designing AI products
  summary: Interfaces for uncertain answers, with people in control.
  lessons:
  - ux-uncertain-output
  - hitl-product-design
- id: pm-evals
  title: Quality and metrics
  summary: Evals, product metrics and experiments for AI features.
  lessons:
  - evals-test-sets
  - kpi-that-matters
  - ai-data-strategy
- id: responsible-ai
  title: Responsible AI and governance
  summary: Bias, privacy, regulation and internal policy.
  lessons:
  - bias-fairness
  - use-ai-safely
  - ai-risk-frameworks
  - writing-ai-policy
- id: shipping-ai
  title: Pricing, launch and growth
  summary: Unit economics, launch and iteration.
  lessons:
  - cost-control
  - pricing-ai-features
  - change-management
  - ai-pm-interviews
  project:
    title: An AI feature brief
    brief: Write the product brief for one AI feature in an Indian consumer app, covering the problem,
      design, eval plan, metrics, pricing, risks and launch plan.
    deliverables:
    - A six-page brief
    - A clickable or annotated prototype
    - An eval plan with 20 example cases
