id: ai-security-engineer
name: AI Security Engineer
tagline: 'Defend AI systems, and use AI to defend: from security basics to red-teaming LLM apps.'
description: Learn how attacks work and how defenders detect and respond, then how to secure LLM apps, agents and
  models against prompt injection, poisoning, data leaks and supply-chain attacks, use AI to catch threats faster,
  and red-team and govern AI safely.
who_for: Students, developers and IT or security staff who want the security role companies find hardest to hire.
  Starts from zero security knowledge; light Python.
theme: security
rank: 10
coding: some
layout: stages
placement: none
months: 6
stages:
- id: sec-foundations
  title: Security foundations
  summary: How attacks work, and the networks, Linux, web, identity and crypto basics every defender uses.
  lessons:
  - what-is-ai
  - how-attacks-work
  - networking-for-security
  - linux-for-security
  - python-basics
  - terminal-and-git
  - web-app-security
  - identity-and-access
  - cryptography-basics
- id: sec-soc
  title: Detect and respond
  summary: Logs, a SIEM, detection rules, incident response, phishing and cloud security.
  lessons:
  - logs-and-siem
  - threat-detection-attack
  - incident-response-basics
  - phishing-social-engineering
  - cloud-security-basics
  - audit-logs
- id: sec-ai-defence
  title: AI for defenders
  summary: Machine learning and LLM copilots that catch threats faster, and how attackers use AI.
  lessons:
  - how-ai-products-work
  - ml-threat-detection
  - llms-in-the-soc
  - ai-powered-attacks
  - deepfakes-misinformation
- id: sec-llm-apps
  guide: phishing-email-detector
  title: Securing LLM apps
  summary: The OWASP Top 10 for LLM apps, prompt injection, guardrails, private data and permissions.
  lessons:
  - llm-app-threats
  - prompt-injection
  - guardrails
  - data-quality-pii
  - permission-aware-rag
  - security-privacy
  project:
    title: A phishing email detector with honest evaluation
    brief: Train a small classifier that flags phishing emails, measure it honestly at a realistic base rate, and add an
      LLM second opinion that treats the email as untrusted data.
    deliverables:
    - Precision, recall and false positives on a held-out test set
    - An LLM second opinion that resists instructions hidden in the email
    - A write-up of what it catches and what it misses
- id: sec-model-attacks
  title: Attacks on models and the AI supply chain
  summary: Poisoning, privacy attacks on models, risky model files and packages, and unsafe agent tools.
  lessons:
  - data-model-poisoning
  - model-privacy-attacks
  - ai-supply-chain
  - agent-tool-security
  - agent-permissions-sandboxing
- id: sec-red-team
  guide: red-team-an-llm-app
  title: Red-team and test AI
  summary: Threat-model AI systems, attack them with permission, and keep the fixes tested in CI.
  lessons:
  - ai-threat-modeling
  - ai-red-teaming
  - evals-test-sets
  - security-testing-ci
  project:
    title: Red-team your own LLM app
    brief: Threat-model your own RAG chatbot, attack it with manual tests and an open-source scanner, fix the worst issues
      and keep every successful attack as a regression test in CI.
    deliverables:
    - A written scope and threat model
    - A findings report with attack success rates before and after fixes
    - A red-team regression suite running in GitHub Actions
- id: sec-governance
  title: Run AI security at a company
  summary: An AI security program, risk frameworks, the law, incidents and customer security reviews.
  lessons:
  - ai-security-program
  - ai-risk-frameworks
  - ai-rules-india-abroad
  - ai-incident-response
  - security-questionnaires
# IQ-8: the Top 25 interview questions, in study order.
top_interview:
  - cia-triad-explained
  - hashing-vs-encryption
  - least-privilege-in-practice
  - fix-sql-injection
  - siem-alert-fatigue
  - mitre-attack-in-practice
  - incident-response-steps
  - phishing-defences-dmarc
  - security-incident-story
  - ml-detector-false-positives
  - llm-copilot-soc-risks
  - ai-phishing-defence
  - deepfake-ceo-fraud-controls
  - owasp-llm-top-ten
  - prompt-injection-defence
  - email-agent-injection-fix
  - data-poisoning-defence
  - model-extraction-defence
  - pickle-model-files-risk
  - mcp-tool-poisoning
  - bank-chatbot-threat-model
  - red-team-a-chatbot
  - attack-success-rate
  - shadow-ai-policy
  - pass-security-review

