# IX-1: ask IndexNow (Bing and the engines that share it) to crawl every page in the live sitemap.
# Run it by hand after a deploy that adds or changes pages: Actions, IndexNow, Run workflow.
name: IndexNow
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be sent"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run indexnow -- ${{ inputs.dry_run && '--dry-run' || '' }}
